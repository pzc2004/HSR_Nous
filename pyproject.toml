[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hsr-nous"
version = "0.1.0"
description = "博识尊驱动战斗分析与配装优化"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=0.9.9",
    "langchain>=1.3.4",
    "langchain-openai>=1.2.2",
    "httpx>=0.27",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
account = ["keyring>=25.0"]
screen = ["mss>=9.0", "numpy>=1.26", "onnxruntime>=1.19"]
pilot = ["pyautogui>=0.9"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
hsr-data-update = "hsr_nous.pipeline.update:main"
hsr-sim = "hsr_nous.sim.cli:main"
hsr-nous = "hsr_nous.api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hsr_nous"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
