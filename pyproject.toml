[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hsr-nous"
version = "0.1.0"
description = "博识尊驱动战斗分析与配装优化"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=0.9.9",
    "langchain>=1.3.4",
    "langchain-openai>=1.2.2",
    "httpx>=0.27",
    "tenacity>=8.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
account = ["keyring>=25.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
ops = ["ddgs>=9.0"]

[project.scripts]
hsr-data = "hsr_nous.pipeline.cli:main"
hsr-data-update = "hsr_nous.pipeline.update:main"
hsr-sim = "hsr_nous.sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hsr_nous"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
