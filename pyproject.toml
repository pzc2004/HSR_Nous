[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hsr-nous"
version = "0.1.0"
description = "博识尊驱动战斗分析与配装优化"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
account = [
    "keyring>=25.0",
    "genshin>=1.7,<2",
    "qrcode>=7.4",
    "curl-cffi>=0.7",
]
web = ["fastapi>=0.115", "uvicorn>=0.30", "zstandard>=0.23"]
ops = ["ddgs>=9.0"]
agent = ["mcp>=1.0,<2"]

[project.scripts]
hsr-data = "hsr_nous.pipeline.cli:main"
hsr-data-update = "hsr_nous.pipeline.update:main"
hsr-sim = "hsr_nous.sim.cli:main"
hsr-research-mcp = "hsr_nous.research.permissions.mcp:main"
hsr-research-agent = "hsr_nous.agents.cli:main"
hsr-research-chat = "hsr_nous.agents.interactive:main"
hsr-research-web = "hsr_nous.research.workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hsr_nous"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
