#      目标 DoT 计数函数缺（stacks() 需具名 modifier_id，无"目标持有 DoT 数"判定原语）
relic_set_id: '116'
name: 幽锁深牢的系囚
set_2pc:
  desc: 攻击力提高12%。
  stat_effects:
    atk_pct: 0.12
set_4pc:
  desc: 敌方目标每承受1个持续伤害效果，装备者对其造成伤害时就无视其6%的防御力，最多计入3个持续伤害效果。
