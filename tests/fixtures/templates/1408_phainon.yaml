# 角色模板：白厄（1408）——**人工全机制版，勿用生成器覆盖**
#
# 收录：火种特殊充能（12 激活）/ 战技获火种 / 变身（倒计时 8 回合，速度固定 60%）/
#       血棘渡亡（强化普攻，扩散+毁伤）/ 弑魂焚诏（弑魂之炽+敌方立即行动）/
#       死星天裁（毁伤驱动段数+净化）/ 最后一击（均分）/ 形态内攻击+80%·生命+135%
# hook 语义（代码注册，见 tests/test_phainon_full_kit.py）：弑魂之炽叠层反击、免死、
#       火种溢出银行、140811 消耗≥4 额外均分、攻击后回血、变身结束全队加速
# 待收：免疫控制（debuff_immune）、天赋"成为技能目标获火种+暴伤"、境界（时墟铁墓——
#       队友 banish/敌方植弱点已备件，zone 系统化属机制收编阶段）
# 数值：全部照抄原始数据 params（lv1-lv15 全表）
actor_id: "1408"
name: "白厄"
level: 80
base_stats:
  hp: 1435.896
  atk: 582.12
  def: 703.395
  spd: 99            # 94+5（行迹速度节点）
  crit_rate: 0.17    # 0.05+0.12（行迹暴击率）
  crit_dmg: 0.873    # 0.5+0.373（行迹暴击伤害）
  max_energy: 0       # 特殊充能：非常规能量槽（火种激活终结技，140804）

custom_resources:
  fire_seed:
    max: 15           # 火种：12 激活 + 3 溢出（溢出银行刀 2，v1 硬上限）
  ruin:
    max: 99           # 毁伤（消费驱动段数刀 2）

actions:
  - action_id: "140801"
    name: "逐火救世，行则将至"
    action_type: "basic"
    target_type: "single"
    damage_type: "physical"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    toughness_dmg: 10

  - action_id: "140802"
    name: "黎明创世，地辟天开"
    action_type: "skill"
    target_type: "blast"
    damage_type: "physical"
    scaling: [{"atk": 1.5}, {"atk": 1.65}, {"atk": 1.8}, {"atk": 1.95}, {"atk": 2.1},
              {"atk": 2.25}, {"atk": 2.4375}, {"atk": 2.625}, {"atk": 2.8125}, {"atk": 3.0},
              {"atk": 3.15}, {"atk": 3.3}, {"atk": 3.45}, {"atk": 3.6}, {"atk": 3.75}]
    scaling_blast: [{"atk": 0.6}, {"atk": 0.66}, {"atk": 0.72}, {"atk": 0.78}, {"atk": 0.84},
                    {"atk": 0.9}, {"atk": 0.975}, {"atk": 1.05}, {"atk": 1.125}, {"atk": 1.2},
                    {"atk": 1.26}, {"atk": 1.32}, {"atk": 1.38}, {"atk": 1.44}, {"atk": 1.5}]
    resource_gain: {fire_seed: 2}
    toughness_dmg: 20
    skill_point_cost: 1

  - action_id: "140803"
    name: "永劫燔世，其将背负"
    action_type: "ultimate"
    target_type: "single"       # 变身技本体无伤害（伤害在 final_strike）
    ult_cost_resource: "fire_seed"
    ult_cost_amount: 12
    resource_gain: {ruin: 4}    # 140805：变身时获得 4 点毁伤
    apply_modifiers:            # 境界【时墟铁墓】：敌方全体始终拥有物理弱点
      - target: "all_enemies"
        modifier_id: "ZONE_PHY_WEAK"
        name: "时墟铁墓"
        modifier_type: "debuff"
        duration: 0
        dispellable: False
        weakness_add: ["physical"]

  - action_id: "140808"
    name: "创生•血棘渡亡"
    action_type: "basic"
    target_type: "blast"
    damage_type: "physical"
    scaling: [{"atk": 1.25}, {"atk": 1.5}, {"atk": 1.75}, {"atk": 2.0}, {"atk": 2.25},
              {"atk": 2.5}, {"atk": 2.75}, {"atk": 3.0}, {"atk": 3.25}, {"atk": 3.5}]
    scaling_blast: [{"atk": 0.375}, {"atk": 0.45}, {"atk": 0.525}, {"atk": 0.6}, {"atk": 0.675},
                    {"atk": 0.75}, {"atk": 0.825}, {"atk": 0.9}, {"atk": 0.975}, {"atk": 1.05}]
    resource_gain: {ruin: 2}
    toughness_dmg: 20
    energy_gain: 0              # 形态内不回能（连锁变身保险丝）

  - action_id: "140809"
    name: "灾厄•弑魂焚诏"
    action_type: "skill"
    target_type: "self"
    skill_point_cost: 1
    act_now_targets: "all_enemies"  # 使敌方全体立即行动
    apply_modifiers:
      - target: "self"
        modifier_id: "SOUL_PYRE"
        name: "弑魂之炽"
        modifier_type: "buff"
        stacks: 1
        max_stack: 99
        stat_effects: {"dmg_dmg_reduction": 0.75}  # lv10 减伤 75%
    # 弑魂之炽机制逻辑（敌方行动叠层 + 全体行动完毕反击 + 解除）为 hook 语义——
    # 注册码见 tests/test_phainon_full_kit.py（hook DSL 化属机制收编阶段）

  - action_id: "140811"
    name: "支柱•死星天裁"
    action_type: "skill"
    target_type: "bounce"
    damage_type: "physical"
    scaling: [{"atk": 0.225}, {"atk": 0.2475}, {"atk": 0.27}, {"atk": 0.2925}, {"atk": 0.315},
              {"atk": 0.3375}, {"atk": 0.3656}, {"atk": 0.3937}, {"atk": 0.4219}, {"atk": 0.45},
              {"atk": 0.4725}, {"atk": 0.495}, {"atk": 0.5175}, {"atk": 0.54}, {"atk": 0.5625}]
    toughness_dmg: 5              # 弹射基线 5×N
    skill_point_cost: 1
    instances_from_resource: "ruin"
    instances_per_point: 4        # 每 1 毁伤 4 段
    instances_cap: 26             # 总倍率上限 1170% ÷ 45% = 26 段
    consume_all_resource: "ruin"  # 施放时消耗全部毁伤（段数先读）
    cleanse_self: true            # 解除自身所有负面效果

  - action_id: "final_strike"
    name: "最后一击"
    action_type: "ultimate"     # 原文"物理属性终结技伤害"——类别归因（吃终结技增伤）
    target_type: "aoe"
    damage_type: "physical"
    scaling: [{"atk": 4.8}, {"atk": 5.28}, {"atk": 5.76}, {"atk": 6.24}, {"atk": 6.72},
              {"atk": 7.2}, {"atk": 7.8}, {"atk": 8.4}, {"atk": 9.0}, {"atk": 9.6},
              {"atk": 10.08}, {"atk": 10.56}, {"atk": 11.04}, {"atk": 11.52}, {"atk": 12.0}]
    split: "even"               # 由敌方全体均分
    energy_gain: 0

state_config:
  state: "khaslana"
  name: "卡厄斯兰那"                # 形态显示名（日志中文官方名，140803"变身为卡厄斯兰那"）
  replaces_actions: {"basic": "140808", "skill": ["140809", "140811"]}
  locked_actions: ["ultimate"]            # 140805：无法施放终结技（两个强化战技经 replaces 生效）
  exit_conditions: [{"trigger": "on_action_count", "value": 8}]   # 8 个倒计时额外回合
  stat_effects: {"atk_pct": 0.8, "hp_pct": 1.35}                  # 140805 lv10：攻击+80%、生命+135%
  final_action_id: "final_strike"
  entry_action_id: "140803"
  countdown_spd_ratio: 0.6        # 140803：倒计时回合速度固定为基础速度的 60%
  banish_allies_on_enter: true    # 境界：其他队友离场且无法行动
  exit_remove_modifiers: ["ZONE_PHY_WEAK"]   # 境界结束：植入弱点随形态解除
  grants_immune: ["control"]      # 140805：卡厄斯兰那免疫控制类负面状态

# 大行迹（额外能力）——hook DSL 自包含版（数值照抄 params）
hooks:
  # 1408101 行向世界终点：战斗开始获 3 火种；变身结束获 1 火种
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_resource"
        resource_id: "fire_seed"
        amount: 3
  - event: "on_state_change"
    condition: "$event.from_state == 'khaslana' && $event.actor == '1408'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "fire_seed"
        amount: 1
  # 1408103 照见英雄本色：进入战斗或变身结束时攻击力提高 50%，最多叠 2 层
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TRACE_1408103"
          name: "照见英雄本色"
          modifier_type: "buff"
          stacks: 1
          max_stack: 2
          stack_mode: "refresh"
          stat_effects: {"atk_pct": 0.5}
  - event: "on_state_change"
    condition: "$event.from_state == 'khaslana' && $event.actor == '1408'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TRACE_1408103"
          name: "照见英雄本色"
          modifier_type: "buff"
          stacks: 1
          max_stack: 2
          stack_mode: "refresh"
          stat_effects: {"atk_pct": 0.5}
