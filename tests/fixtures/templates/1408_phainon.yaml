#
# 收录：火种特殊充能（12 激活）/ 战技获火种 / 变身（倒计时 8 回合，速度固定 60%）/
#       血棘渡亡（强化普攻，扩散+毁伤）/ 最后一击（均分）/ 形态内攻击+80%·生命+135%
# 刀 2 待收：140809 弑魂焚诏（弑魂之炽计数器+反击链）、140811 死星天裁（毁伤驱动段数）、
#       火种溢出银行、天赋"成为技能目标获火种+暴伤"、免死、免疫控制、攻击后回血、
#       变身结束全队加速、境界（时墟铁墓）/队友离场/敌方植弱点
# 数值：全部照抄原始数据 params（lv1-lv15 全表）
