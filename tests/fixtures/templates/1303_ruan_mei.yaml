# 角色模板：阮•梅（1303）——**人工全机制版（光环 dogfood），勿用生成器覆盖**
#
# **真身位于 tests/fixtures/templates/；data/sim_templates/characters/ 下的同名文件由测试
# copy 物化（tests/template_materialize.py）——直接改 data/ 副本会被测试冲掉，改请改 fixtures 源文件**
#
# 收录：普攻 / 战技【弦外音】（挂阮梅·辐射全队·增伤+弱点击破效率·阮梅回合开始计时）/
#       终结技【结界+残梅绽】（结界=挂阮梅·辐射全队·抗性穿透·阮梅回合开始计时；残梅绽=
#       挂标/触发/重挂锁三件 hook，见下）/
#       天赋【分型的螺旋】（除自身外队友速度+10% / 我方击破时阮梅追加冰属性击破伤害）
# 待收（notes）：终结技结界本身的"结界"zone 语义（现按光环模型等价表达）
# 数值：全部照抄原始数据 params（lv1-lv15 全表）
actor_id: "1303"
name: "阮•梅"
level: 80
base_stats:
  hp: 1086.624
  atk: 659.736
  def: 485.1
  spd: 109            # 104+5（行迹速度节点）
  crit_rate: 0.05
  crit_dmg: 0.5
  max_energy: 130
  break_effect: 0.373  # 行迹击破特攻节点

actions:
  - action_id: "130301"
    name: "一针幽兰"
    action_type: "basic"
    target_type: "single"
    damage_type: "ice"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    toughness_dmg: 10

  - action_id: "130302"
    name: "慢捻抹复挑"
    action_type: "skill"
    target_type: "self"
    skill_point_cost: 1
    apply_modifiers:
      - target: "self"
        modifier_id: "XWY"
        name: "弦外音"
        modifier_type: "buff"
        duration: 3
        tick_anchor: "owner_turn_start"   # 原文：阮•梅每回合开始时持续回合数减 1
        effect_scope: "team"              # 挂阮梅、辐射我方全体
        stat_effects:
          all_dmg: 0.32                   # lv10 #1：我方全体伤害提高 32%
          weakness_break_efficiency_boost: 0.5  # lv10 #2：弱点击破效率提高 50%（归 spec 弱点击破效率池，池 2）

  - action_id: "130303"
    name: "摇花缎水，沾衣不摘"
    action_type: "ultimate"
    target_type: "self"
    energy_cost: 130
    apply_modifiers:
      - target: "self"
        modifier_id: "RM_ZONE"
        name: "结界"
        modifier_type: "buff"
        duration: 2
        tick_anchor: "owner_turn_start"   # 原文：自身每回合开始时结界持续回合数减 1
        effect_scope: "team"              # 处于结界中时我方全体
        stat_effects:
          res_pen: 0.25                   # lv10 #1：全属性抗性穿透提高 25%

hooks:
  # 天赋 130304 分型的螺旋：除自身以外的队友速度提高 10%（常驻）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "other_allies"            # 除自身以外的队友
        modifier:
          modifier_id: "RM_TALENT_SPD"
          name: "分型的螺旋"
          modifier_type: "buff"
          duration: 0
          stat_effects: {"spd_pct": 0.1}  # lv10 #1：速度提高 10%

  # 天赋 130304：我方全体击破敌方目标弱点时，阮•梅追加冰属性击破伤害（120%）
  - event: "on_break"
    effects:
      - effect_type: "break_damage"
        name: "分型的螺旋"
        target: "enemy_first"
        element: "ice"
        ratio: 1.2                        # lv10 #2：等同于阮•梅 120% 的冰属性击破伤害

  # 终结技 130303【残梅绽】三件（原文：结界中我方攻击对命中敌人施加残梅绽；被施加者尝试
  # 从击破恢复时触发——延长击破 + 按击破特攻延后 + 冰击破伤害；恢复前不可重复附加）：
  # ① 挂标 + 重挂锁：结界存在时我方（非怪）攻击命中 → 挂【残梅绽】+ 锁（锁在即不可再挂，
  #    "until they recover" 的载体；seg_index==0 = 多段攻击按一次攻击挂一次）
  - event: "after_being_hit"
    condition: "stacks($self, 'RM_ZONE') > 0 && $event.actor_type != 'monster' && $event.seg_index == 0 && !has_modifier($event.target, 'THANATOPLUM_LOCK')"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "THANATOPLUM"
          name: "残梅绽"
          modifier_type: "debuff"
          duration: 0
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "THANATOPLUM_LOCK"
          name: "残梅绽·重挂锁"
          modifier_type: "debuff"
          duration: 0
          dispellable: False
  # ② 触发：被挂标敌人尝试恢复韧性（toughness_recovered waterfall）→ 冰击破伤害 + 延后
  #    + 摘标 + cancel 阻止本次恢复（延长击破；该次行动被消耗——mechanics 04"真跳过"；
  #    cancel 后 waterfall 链中断，③不会同次误清锁）
  - event: "toughness_recovered"
    condition: "has_modifier($event.target, 'THANATOPLUM')"
    effects:
      - effect_type: "break_damage"
        name: "残梅绽"
        target: "$event.target"
        element: "ice"
        ratio: 0.5                        # lv10 #5：等同于阮•梅 50% 的冰属性击破伤害
      - effect_type: "delay_action"
        target: "$event.target"
        amount: "$self.break_effect * 20 + 10"   # lv10 #3/#4：击破特攻×20% + 10%（delay_action 百分数口径）
      - effect_type: "remove_modifier"
        target: "$event.target"
        modifier_id: "THANATOPLUM"
      - effect_type: "cancel_event"
  # ③ 重挂锁解除：真正恢复韧性（本次未被 cancel）→ 清锁，之后可重新挂标
  - event: "toughness_recovered"
    condition: "!$event.cancel && has_modifier($event.target, 'THANATOPLUM_LOCK')"
    effects:
      - effect_type: "remove_modifier"
        target: "$event.target"
        modifier_id: "THANATOPLUM_LOCK"
  # 注：hook 归口框架语义——阮•梅阵亡后标记不再触发（hook owner 存活闸）；触发不依赖结界
  #    仍在（标记驱动），与"结界结束只停止新挂标"的文本口径一致
