# 角色模板：刃（1205）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
# SP 消歧在案：刃（1205，本件）≠ 千冶•刃（1507，欢愉侧另一实体，各自模板）。
#
# 过堂收编/勘正两件：① 强化普攻 1120508 主目标倍率列幻视勘正——scaling
#   取 params 第 2 列（draft 误取第 1 列"耗血 10%"当倍率=主段 10%×Max
#   幻视；官方"对指定单体造成 #2[i]% 生命上限伤害" lv9=1.82，耗血 #1
#   走 hooks drain_hp——桑博 1108 同族列幻视）。
#   ② 终结技"HP 设为 Max HP 50%"收编——set_hp_to_percent 原语在库（draft
#   误判"set_hp 通道缺"；该 HP 变动是否计入天赋 Charge/tally/触发 E4
#   待实测随注）。
#
# 收录：普攻支离剑（hp 倍率 lv6=0.5×Max）/ 战技地狱变（耗 10% Max →
#       HELLSCAPE 3 回合增伤 40% lv10 + 换技能硬闸）/ 强化普攻无间剑树
#       （耗 10% Max + 主 1.82×Max/邻 0.728×Max lv9——HELLSCAPE 互斥可用）/
#       终结技大辟万死（Blast 主 1.5×Max/邻 0.6×Max lv10 + tally 段
#       1.2×累计 + HP 设 50% + 回能 5 + Vita Infinita 累计清 50%）/
#       天赋倏忽恩赐（受击/耗血 1 层满 5 → 0.85×Max 追加（A3 并入）+
#       自疗 25% Max + 回能 15）/ HP 消耗累计（_hp_tally：耗血/受击 90%
#       上限记账 + Neverending Deaths 受治疗 20% 计入）/
#       大行迹 Neverending Deaths（incoming_heal +25% 常驻）/
#       秘技耗 20% Max 全体 40% Max 风伤 / 本体套 ENABLE_BASE_KIT 常闭门控
#       （永不授予——生效套 11205xx）/ E2 HELLSCAPE 暴击 +15% /
#       E3/E5 等级族 / E4 低血 HP+20%×2 层
# 待收（均带挡因）：E1 主目标 tally 150%（on_action 主/邻区分通道缺——
#       现并入终结技 tally 全体段近似）/ E6 充能上限 5→4（资源 max 星魂
#       覆写通道缺）/ 终结技 HP 设 50% 的 tally/Charge 计入（待实测）/
#       普攻/强化普攻削韧值（fandom 空缺保守 10）/ 行迹面板节点（未取证）
