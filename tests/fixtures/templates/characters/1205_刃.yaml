eidolons:
  E1:
    name: "置身无间地狱"
    notes:
      - "终结技对主目标额外增伤 = HP 消耗累计的 150%——主目标标识在 on_action 事件载荷缺（target 主/邻区分通道无），追加段暂并入终结技 tally hook 近似主目标系数，精确归属待收"
  E2:
    name: "一梦万死同悲"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_HELLSCAPE_CRIT"
              name: "一梦万死同悲"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "has_modifier($self, 'HELLSCAPE') >= 1"
              stat_effects: {"crit_rate": 0.15}
  E3:
    name: "寒刃映冷辉"
    skill_level_overrides: {"ultimate": 2, "talent": 2}
  E4:
    name: "拒受天命轮转"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_LOW_HP_MAXHP"
              name: "拒受天命轮转"
              modifier_type: "buff"
              stacks: 2
              max_stack: 2
              stack_mode: "refresh"
              duration: 0
              dispellable: False
              enable_if: "$self.hp / $self.max_hp <= 0.5"
              stat_effects: {"hp_pct": 0.2}
  E5:
    name: "十王判死凝视"
    skill_level_overrides: {"skill": 2, "basic": 1}
  E6:
    name: "空壳复生"
    notes:
      - "天赋充能上限从 5 降为 4：custom_resources _talent_charge max 固定 5，星魂级资源上限覆写通道缺——天赋满层触发阈值需在 E6 下覆写为 4（本版 hooks 按 5 写，切 E6 待收阈值覆写）"
      - "天赋追加攻击额外增伤 = 50% Max HP：并入天赋 deal_damage 表达式（切 E6 时 amount 加 0.5*max_hp），见 hooks 天赋追加段注"

hooks:
  - event: "on_action"
    condition: "$event.actor == '1205' && $event.action_id == '1120502' && !$event.insert"
    effects:
      - effect_type: "drain_hp"
        target: "self"
        amount: "param(1120502, 1) * $self.max_hp"
        floor: 1
        drain_ratio: 0
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "HELLSCAPE"
          name: "地狱变"
          modifier_type: "buff"
          duration: 3
          tick_anchor: "owner_turn_start"
          dispellable: False
          stat_effects: {"all_dmg": "param(1120502, 4)"}

  - event: "on_action"
    condition: "$event.actor == '1205' && $event.action_id == '1120508' && !$event.insert"
    effects:
      - effect_type: "drain_hp"
        target: "self"
        amount: "param(1120508, 1) * $self.max_hp"
        floor: 1
        drain_ratio: 0

  - event: "on_action"
    condition: "$event.actor == '1205' && $event.action_id == '1120503' && !$event.insert"
    effects:
      - effect_type: "set_hp_to_percent"
        target: "self"
        percent: 0.5    # 终结技"释放时 HP 设为 Max HP 50%"（过堂收编——set_hp_to_percent
                        # 原语在库，draft 误判"set_hp 通道缺"；该 HP 变动是否计入天赋
                        # Charge/tally/触发 E4 待实测随注）
      - effect_type: "deal_damage"
        name: "大辟万死·tally"
        target: "all_enemies"
        damage_type: "wind"
        amount: "param(1120503, 5) * res__hp_tally"
      - effect_type: "gain_energy"
        target: "self"
        amount: 5
      - effect_type: "set_resource"
        resource_id: "_hp_tally"
        amount: "0.5 * resource_of($self, '_hp_tally')"

  - event: "on_hp_decrease"
    condition: "$event.target == '1205'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_talent_charge"
        amount: 1
  - event: "on_hp_decrease"
    condition: "$event.target == '1205' && res__talent_charge + 1 >= 5"
    effects:
      - effect_type: "deal_damage"
        name: "倏忽恩赐"
        target: "all_enemies"
        damage_type: "wind"
        amount: "(param(1120504, 2) + 0.2) * $self.max_hp"
        toughness_dmg: 10
      - effect_type: "heal"
        target: "self"
        ratio: "param(1120504, 3)"
        amount: 0
      - effect_type: "gain_energy"
        target: "self"
        amount: 15
      - effect_type: "set_resource"
        resource_id: "_talent_charge"
        amount: 0

  - event: "on_hp_decrease"
    condition: "$event.target == '1205'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_hp_tally"
        amount: "min($event.amount, max(0, 0.9 * $self.max_hp - resource_of($self, '_hp_tally')))"

  - event: "on_hp_increase"
    condition: "$event.target == '1205' && $event.reason == 'heal'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_hp_tally"
        amount: "0.2 * $event.amount"

  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "BLADE_INCOMING_HEAL"
          name: "不死的恩典"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"incoming_heal": 0.25}

scaling_notes:
  - 两套 id 并存裁定：官方清单下发本体套 1205xx 与强化套 11205xx；本模板主编排现行强化套
    11205xx（action_id/skill_level 轨道/行迹均取强化套），本体套 params 全表入 skill_params
    备查。本体套 action（120501/120502/120503/120508）已按官方 id 登记但以 available_if
    挂 ENABLE_BASE_KIT 门控常闭（该 modifier 无任何来源，永不授予），生效套仍为 11205xx。
  - 强化普攻 available_if 与普攻 available_if 互斥（HELLSCAPE 状态门控）——Hellscape 期间
    普攻按钮替换为无间剑树（换技能硬闸非形态机，同遐蝶 140702↔140709 先例）。
  - 终结技"释放时 HP 设为 Max HP 50%"过堂收编（set_hp_to_percent 原语在库——draft 误判"set_hp 通道缺"）；该 HP 变动是否计入天赋 Charge/tally/触发 E4——待实测。
  - 强化普攻 1120508 主目标倍率列勘正（过堂幻视）：scaling = params 第 2 列（draft 误取第 1 列"耗血 10%"当倍率——主段 10%×Max 幻视；耗血 #1 走 hooks drain_hp，桑博 1108 同族）
  - 普攻/强化普攻削韧值：fandom 空缺、米游社未标注，给保守默认 10，待实测补齐。
