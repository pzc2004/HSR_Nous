# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN
eidolons:
  E1:
    name: "轻云"
    notes:
      - "机制已明（官方星魂文本）：对弱点击破敌人使用战技后回复 1 战技点（判定时点=使用战技时目标状态；与 tbgd sp_cost 1 组合，击破目标下净 SP 0；大招期间 2 次额外剑势不重复触发——E1 绑'使用战技'非'剑势'，倾向每次最多 1 次，待实测）"
      - "待收——挡因：hook 层无战技点变动 effect_type 先例（仅 action 层 skill_point_gain 在案），且目标击破状态查询不在表达式白名单（头注②③）"
  E2:
    name: "剑势护体（Refine in Toil）"
    notes:
      - "已收：剑势触发后自身受到伤害降低 20% 持续 1 回合——并入主剑势 hook effects（同 roll 免二次重掷，见 hooks 段）"
      - "已知偏差：当前主剑势仅概率段（chance 白名单通道），E2 在同一 hook 内同 roll 触发——语义正确；击破必触发段恢复后须复核 E2 在必中分支下的触发一致性（挡因因③④）"
      - "待实测：多段剑势同回合触发是否刷新时长；buff 可驱散性；减伤 stat 键名（dmg_taken_reduction）待闸校验"
  E3:
    name: "剑术精进（Rise From Fame）"
    skill_level_overrides: {"ultimate": 2, "talent": 2}   # 终结技+2、天赋+2
    notes:
      - "终结技 lv10→lv12 = 表第 12 行：直伤 345.6% / ATK+32.4% / buff 回合恒 2 / 额外剑势恒 50%（apply_modifiers 与 hooks 走 param() 随档）"
      - "天赋 lv10→lv12 = 表第 12 行：速度 +21%（hooks stat_effects param(120604,1) 随档）"
  E4:
    name: "剑意贯通（Cleave With Heart）"
    stat_effects: {"break_effect": 0.4}   # 击破特攻 +40%（明文）——break_effect 键名待闸校验
  E5:
    name: "剑法大成（Prevail via Taixu）"
    skill_level_overrides: {"skill": 2, "basic": 1}       # 战技+2、普攻+1
    notes:
      - "战技 lv10→lv12 = 表第 12 行：主伤 231% / 剑势 110% / 触发率恒 33%（action scaling 实取 lv12 档；剑势 param(120602,2) 随档）"
      - "普攻 lv10→上限 10：官方数据普攻 10 档上限，无第 11 档——跳过（param() 越档钳表尾+⚠编译警告口径）"
  E6:
    name: "剑意如水（Dwell Like Water）"
    hooks:
      # 入场立即获得 1 层天赋速度加成（官方明文）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "SUSHANG_TALENT_SPD"
              name: "游刃若水"
              modifier_type: "buff"
              stacks: 1
              max_stack: 1
              stack_mode: "refresh"
              duration: 2
              dispellable: False
              stat_effects: {"spd_pct": "param(120604, 1)"}
    notes:
      - "入场 1 层已收（on_battle_start）"
      - "待收——叠 2 层半：挡因 = modifier max_stack 星魂覆写通道缺（基础件保守 max_stack 1）；且同源速度叠加算法 (1+0.4) 加法 vs 1.2² 乘法 待实测，禁止脑补"
      - "E3/E5 等级族见各条（E5 战技+2；普攻+1 无第 11 档跳过）"

scaling_notes:
  - "剑势触发链：战技 action 主伤（scaling）→ hooks 33% 概率附加段（category additional，倍率 param(120602,2) 烘焙剑胆）→ 终结技在场时至多 2 次额外机会（50%×原剑势 = param(120603,3)×param(120602,2)）；'击破目标必触发'判据官方文本明载但查询通道缺（挡因③），恢复前单次战技理论上限按独立 roll 3 段全中（推论依据官方文本 '2 extra chances'，数值非脑补）"
  - "战技点：战技 sp_cost=1 以 tbgd/BPNeed 为权威（米游社无标 ≠ 不耗，§8 裁定）；E1 击破目标回 1 点通道缺（待收）"
  - "削韧/回能权威源：fandom 全空缺（各条目 fandom: {}），降级为 tbgd + 米游社标签互证——削韧 10/20/30/20、回能 20/30/5，两源一致无冲突"
  - "表达式白名单口径：weakness_broken_count / is_weakness_broken / rand() 均不在 effect 层白名单——场/目标击破查询回落待实测（天赋 120604、制胜 1206103、剑势必触发段、E1 触发条件均受累），概率段改走 mechanic_chance() 通道（chance 不在函数词表——过堂勘正）"
  - "待实测清单（12 项，官方/wiki/社区三层无证据覆盖，编译层不写死）：①终结技立即行动=100% 拉条还是额外回合、是否消耗 buff 2 回合；②剑势独立削韧/回能/剑胆/E2；③剑胆叠加时序（N vs N-1 层）与跨回合永久性；④朴实仇恨降幅（通道+数值双缺）；⑤天赋刷新语义（击破存续期是否逐回合刷新/解除后计时/E6 各层独立计时）；⑥E6 速度叠加算法；⑦E1 触发次数；⑧E2 多次触发刷新与可驱散性；⑨自动战斗行为（是否优先击破目标/大招时机）；⑩秘技入场斩能否直接击破并联动天赋/E6；⑪战技动画段数与剑势结算顺序（final hit 判读点）；⑫额外机会版剑势是否吃剑胆/E2（当前实现同吃）"
