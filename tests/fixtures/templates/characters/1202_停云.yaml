custom_resources:
  _e2_kills:
    max: 1

techniques:
  - technique_id: "120207"
    name: "惠风和畅"
    point_cost: 1
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 50

actions:
  - action_id: "120201"
    name: "逐客令"
    action_type: "basic"
    target_type: "single"
    damage_type: "thunder"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    toughness_dmg: 10
    skill_point_gain: 1
    energy_gain: 20

  - action_id: "120202"
    name: "祥音和韵"
    action_type: "skill"
    target_type: "ally_single"  # 我方单体（过堂勘正——draft 写 "single" 敌方池，
                                # 增益技挂错池会打敌人；1101/1105/1110 同案）
    damage_type: "thunder"
    skill_point_cost: 1
    energy_gain: 30

  - action_id: "120203"
    name: "庆云光覆仪祷"
    action_type: "ultimate"
    target_type: "ally_single"  # 我方单体（充能+增伤目标——同勘正）
    energy_cost: 130
    energy_gain: 5
    toughness_dmg: 0

hooks:
  - event: "on_become_target"
    condition: "$event.source == '1202' && $event.action_id == '120202'"
    effects:
      - effect_type: "remove_modifier"
        target: "all_allies"
        modifier_id: "BENEDICTION"   # 机制移除非驱散——modifier_id 直摘（过堂勘正：
        # filter 路径只摘 dispellable，BENEDICTION dispellable False=恒跳过死钩，
        # 唯一持有者转移不生效实证；1107 标记同案）
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "BENEDICTION"
          name: "祝福"
          modifier_type: "buff"
          duration: 3
          dispellable: False
          stat_effects:
            atk: "min(param(120202, 2) * $self.atk, param(120202, 4) * stat_of($event.target, 'atk'))"
            # 过堂双勘正：① 加攻基数错基——stat_exprs 以**持有者**为语境求值
            #（$self=受加持者而非停云）；官方加攻=#2×停云 ATK——hook 物化
            # stat_effects 以停云为持有者烘焙（施加时刻快照，快照/动态待实测）。
            # ② cap 错基——draft 写 #4×烘焙 529.2（停云白值）；官方 cap=#4×
            # **受加持者**当前 ATK——stat_of($event.target,'atk') 施加时刻真值

  - event: "after_being_hit"
    condition: "$event.source != '1202' && actor_type_of($event.source) != 'monster' && has_modifier($event.source, 'BENEDICTION') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "祥音和韵·附加"
        target: "$event.target"
        damage_type: "thunder"
        amount: "(param(120202, 1) + 0.2 * min(has_modifier($self, 'E4_JOVIAL'), 1)) * stat_of($event.source, 'atk')"

  # 天赋 120204 紫电扶摇：持有【祝福】的我方目标攻击敌方目标时，停云立即对该目标
  # 造成 60%×持有者 ATK 雷属性附加伤害（官方原文主语=受加持者攻击——过堂勘正：
  # draft 条件 $event.source == '1202'（停云自己攻击才触发=主客倒置），正解与
  # 祥音和韵同触发域（持有者命中、怪物目标））
  - event: "after_being_hit"
    condition: "actor_type_of($event.source) != 'monster' && has_modifier($event.source, 'BENEDICTION') >= 1 && actor_type_of($event.target) == 'monster'"
    effects:
      - effect_type: "deal_damage"
        name: "紫电扶摇"
        target: "$event.target"
        damage_type: "thunder"
        amount: "param(120204, 1) * stat_of($event.source, 'atk')"

  - event: "on_become_target"
    condition: "$event.source == '1202' && $event.action_id == '120203'"
    effects:
      - effect_type: "gain_energy"
        target: "$event.target"
        amount: "param(120203, 1)"
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "TINGYUN_ULT_DMG"
          name: "庆云光覆仪祷"
          modifier_type: "buff"
          duration: 2
          dispellable: False
          stat_effects: {"all_dmg": "param(120203, 3)"}

  - event: "on_action"
    condition: "$event.actor == '1202' && $event.action_id == '120202' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TINGYUN_NOURISHED_JOVIALITY"
          name: "Nourished Joviality"
          modifier_type: "buff"
          duration: 1
          dispellable: False
          stat_effects: {"spd_pct": 0.2}

  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TINGYUN_KNELL_SUBDUAL"
          name: "Knell Subdual"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"dmg_basic_dmg_boost": 0.4}   # 键名勘正（过堂）：basic_dmg
          # 无消费端=死键——dmg_bonus 类型桶正主通道（pipeline 读 f"{action_type}_dmg_boost"）

  - event: "on_turn_start"
    condition: "$event.actor == '1202'"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 5

eidolons:
  E1:
    name: "Windfall of Lucky Springs"
    hooks:
      - event: "on_ultimate"
        condition: "$event.source != '1202' && actor_type_of($event.source) != 'monster' && has_modifier($event.source, 'BENEDICTION') >= 1"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.source"
            modifier:
              modifier_id: "E1_WINDFALL_SPD"
              name: "Windfall of Lucky Springs"
              modifier_type: "buff"
              duration: 1
              dispellable: False
              stat_effects: {"spd_pct": 0.2}
    notes:
      - "on_ultimate 载荷 source 字段与锚先例同构（140703 用法）；祝福持有者判读点=施放时快照，待实测"
  E2:
    name: "Gainfully Gives, Givingly Gains"
    hooks:
      - event: "on_kill"
        condition: "$event.source != '1202' && actor_type_of($event.source) != 'monster' && has_modifier($event.source, 'BENEDICTION') >= 1 && res__e2_kills < 1"
        effects:
          - effect_type: "gain_energy"
            target: "$event.source"
            amount: 5
          - effect_type: "gain_resource"
            resource_id: "_e2_kills"
            amount: 1
      - event: "on_turn_start"
        condition: "$event.actor == '1202'"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e2_kills"
            amount: 0
  E3:
    name: "Halcyon Bequest"
    skill_level_overrides: {"ultimate": 2, "basic": 1}
    notes:
      - "终结技+2：增伤 #3 随档走 param(120203,3)（常驻 lv12=0.56）；回能 50/回合 2 全档常量无观察差；普攻+1：scaling 实取 lv6 档（1.0）"
  E4:
    name: "Jovial Versatility"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_JOVIAL"
              name: "Jovial Versatility"
              modifier_type: "buff"
              duration: 0
              dispellable: False
    notes:
      - "CN 原文歧义已由 EN 解（'the DMG multiplier provided by Benediction increases by 20%'）；加算 0.20 表达式见 120202 after_being_hit hook"
  E5:
    name: "Sauntering Coquette"
    skill_level_overrides: {"skill": 2, "talent": 2}
    notes:
      - "战技+2：祝福攻加成/上限/附加倍率随档（param(120202,1/2/4)，常驻 lv12=0.44/0.55/0.27）；天赋+2：param(120204,1) lv12=0.66"
  E6:
    name: "Peace Brings Wealth to All"
    hooks:
      - event: "on_become_target"
        condition: "$event.source == '1202' && $event.action_id == '120203'"
        effects:
          - effect_type: "gain_energy"
            target: "$event.target"
            amount: 10

scaling_notes:
  - "祝福唯一持有者：新目标施放 → 先 remove_modifier 全场 BENEDICTION 再施加新件（EN 'most recent receiver' 倾向转移语义）；双挂/覆盖时序待实测"
  - "祝福攻加成 cap（#4×停云当前 ATK）：stat 侧无 cap 块 → min() 表达式裁剪承载；停云面板变化（大行迹攻%缺、装备攻%）不重估件内烘焙 529.2——待编译侧 $owner 通道接线后改真值，列入待收"
  - "附加伤害基数 = 持有者自身 ATK（stat_of($event.source,'atk')）：持有者换人后自动切真值"
  - "待实测清单：祝福 dispellable / 战技可否自指 / E4 槽位与乘区 / 大行迹 1202102 乘区归属 / 天赋触发频次（多段/AoE）/ 秘技回能结算时机 / 自动战斗目标优先级 / 削韧 10 单源复核 / 120206 占位条目用途"
