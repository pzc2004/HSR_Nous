# 角色模板：停云（1202）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂收编/勘正四件：① 战技/终结技 target_type "single"→"ally_single"
#   （敌方池挂错会打敌人——1101/1105/1110 同案）。
#   ② 祝福加攻双勘正——stat_exprs 以**持有者**为语境求值（$self=受加持者
#   而非停云），官方加攻=#2×停云 ATK（错基）；且 cap=#4×**受加持者**当前
#   ATK，draft 误烘焙停云白值 529.2。正解：hook 物化 stat_effects 以停云
#   快照烘焙 min(param(120202,2)×停云 atk, param(120202,4)×受加持者 atk)
#   （快照/动态口径待实测随注）。
#   ③ 天赋紫电扶摇触发域勘正——官方主语=**受加持者**攻击时停云追加，
#   draft 写 $event.source == '1202'（停云自己攻击才触发=主客倒置）；
#   正解与祥音和韵同触发域（持有者命中、怪物目标）。
#   ④ Knell Subdual 键名勘正——basic_dmg 无消费端=死键 →
#   dmg_basic_dmg_boost 类型桶正主通道。
#
# 收录：普攻逐客令 / 战技祥音和韵（指定我方祝福：ATK+min(50%停云 atk,
#       25%持有者 atk) 3 回合 + 唯一持有者转移（新目标先摘全场再挂）+
#       持有者攻击附加 40%持有者 atk 雷伤）/ 天赋紫电扶摇（持有者攻击
#       敌方 → 停云追加 60%持有者 atk 雷伤）/ 终结技庆云光覆仪祷（指定
#       我方充能 50 + 增伤 50% 2 回合 lv10）/ 大行迹 Knell Subdual
#       （普攻+40%）/ Nourished Joviality（战技后 SPD+20%）/
#       回合开始回能 5 / 秘技进战回能 50 / E1 持有者大招后 SPD+20% /
#       E2 持有者击杀回 5 能每回合限 1 / E3/E5 等级族 / E4 祝福倍率+0.2 /
#       E6 终结技额外充能 10
# 待收（均带挡因）：祝福快照 vs 动态重估（现快照在案）/ 附加段归因
#       （hook 持有者=停云记账 vs 官方持有者携带语义）/ 祝福 dispellable /
#       战技可否自指 / E4 槽位与乘区 / 天赋触发频次（多段/AoE）/
#       秘技回能结算时机 / 削韧 10 单源复核
actor_id: "1202"
name: "停云"
level: 80
path: "harmony"
groups: ["faction:foxian"]
element: "thunder"
base_stats:
  hp: 846.72
  atk: 529.2
  def: 396.9
  spd: 112
  crit_rate: 0.05
  crit_dmg: 0.5
  max_energy: 130
trace_notes:
  - "行迹平铺节点（暴击/速度/生命等）社区无收 → base_stats 维持官方管线实值，未并入任何行迹加成；行迹增伤（雷伤%）未收——社区数值未给，未脑补，见 trace_stat_effects 留空备注"
  - "大行迹 1202101/1202102/1202103 已收（见 hooks）；无免死/免疫/特殊比例行迹（逐条已评）"
trace_stat_effects: {}

