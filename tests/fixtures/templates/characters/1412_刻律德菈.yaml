  energy_gain: 5
  toughness_dmg: 30
trace_stat_effects:
  atk_pct: 0.18
  hp_pct: 0.1
trace_notes:
- 大行迹「来者」机制待收编：刻律德菈的攻击力大于#1[i]时，每超过#2[i]点攻击力可使自身暴击伤害提高#3[i]%，最多提高#4[i]%。
custom_resources:
  cerydra_charge:
    name: 充能        # 呈现层显示名（官方资源槽名）
    max: 8
  cerydra_fua_count:
    max: 20
hooks:
- event: on_become_target
  condition: $event.action_id == '141202' && !has_modifier($event.target, 'CYD_MERIT')
  effects:
  - effect_type: remove_modifier
    target: other_allies
    modifier_id: CYD_MERIT
  - effect_type: remove_modifier
    target: other_allies
    modifier_id: CYD_PEERAGE
  - effect_type: set_resource
    resource_id: cerydra_charge
    amount: 0
  - effect_type: apply_modifier
    target: $event.target
    modifier:
      modifier_id: CYD_MERIT
      name: 军功
      modifier_type: buff
      duration: 0
      dispellable: false
  - effect_type: gain_resource
    resource_id: cerydra_charge
    amount: 1
  - effect_type: apply_modifier
    target: $event.target
    modifier:
      modifier_id: CYD_VICI_SPD
      name: 征服者
      modifier_type: buff
      duration: 3
      stat_effects:
        spd: 20
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: CYD_VICI_SPD
      name: 征服者
      modifier_type: buff
      duration: 3
      stat_effects:
        spd: 20
- event: on_become_target
  condition: $event.action_id == '141202' && has_modifier($event.target, 'CYD_MERIT')
  effects:
  - effect_type: gain_resource
    resource_id: cerydra_charge
    amount: 1
  - effect_type: apply_modifier
    target: $event.target
    modifier:
      modifier_id: CYD_VICI_SPD
      name: 征服者
      modifier_type: buff
      duration: 3
      stat_effects:
        spd: 20
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: CYD_VICI_SPD
      name: 征服者
      modifier_type: buff
      duration: 3
      stat_effects:
        spd: 20
- event: on_ultimate
  condition: $event.source == '1412'
  effects:
  - effect_type: gain_resource
    resource_id: cerydra_charge
    amount: 2
  - effect_type: set_resource
    resource_id: cerydra_fua_count
    amount: 0
- event: on_action
  condition: ($event.action_type == 'basic' || $event.action_type == 'skill') && !$event.insert
    && (has_modifier($event.actor, 'CYD_MERIT') || has_modifier($event.actor, 'CYD_PEERAGE'))
  effects:
  # 天赋 141204：军功持有者施放普攻/战技 → 刻律德菈 +1 充能（奇袭/插入期间不充——
  # 曾被误删为"幻觉"，官方原文在案（征服者只给能量，充能是天赋给的）
  - effect_type: gain_resource
    resource_id: cerydra_charge
    amount: 1
- event: on_action
  condition: $event.action_type == 'skill' && !$event.insert && has_modifier($event.actor,
    'CYD_MERIT') && res_cerydra_charge >= 6 && $event.target_type != 'self' && $event.target_type
    != 'ally_single' && $event.target_type != 'ally_aoe'
  effects:
  # 奇袭（爵位机制核心）：军功充能≥6 时军功持有者放战技 → 复制该战技由持有者再放一次——
  # 官方 141202 限定"using their Skill on enemy targets"：以敌方为目标的战技才触发
  # （140809 自身增益不触发/140811 弹射与 140802 扩散触发——owner 实战同口径）。
  # （官方：复制提前施放随后原技能——本实现为原技能后复制，结算等价；奇袭不套娃=insert 闸），
  # 随后消耗 6 充能（爵位→军功）。爵位 buff/徽章/解控待"按条件点名"选择器（B31）落地
  - effect_type: trigger_action
    action_id: "$event.action_id"
  - effect_type: gain_resource
    resource_id: cerydra_charge
    amount: -6
- event: on_action
  condition: ($event.action_type == 'basic' || $event.action_type == 'skill') && (has_modifier($event.actor,
    'CYD_MERIT') || has_modifier($event.actor, 'CYD_PEERAGE'))
  effects:
  - effect_type: gain_energy
    amount: 5
- event: after_being_hit
  condition: $event.actor_type != 'monster' && $event.seg_index == 0 && res_cerydra_fua_count
    < 20 && (has_modifier($event.source, 'CYD_MERIT') || has_modifier($event.source,
    'CYD_PEERAGE'))
  effects:
  - effect_type: deal_damage
    name: 荣光属于凯撒
    target: $event.target
    damage_type: wind
    category: additional
    scaling_atk: 0.6
  - effect_type: gain_resource
    resource_id: cerydra_fua_count
    amount: 1
- event: on_battle_start
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: CYD_VIDI_CRIT
      name: 见者
      modifier_type: buff
      duration: 0
      dispellable: false
      stat_effects:
        crit_rate: 0.01
- event: on_ultimate
  condition: has_modifier($event.source, 'CYD_MERIT') && res_cerydra_charge < 8 &&
    !has_modifier($self, 'CYD_VIDI_SPENT')
  effects:
  - effect_type: gain_resource
    resource_id: cerydra_charge
    amount: 1
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: CYD_VIDI_SPENT
      name: 见者·单场已触发
      modifier_type: buff
      duration: 0
      dispellable: false
