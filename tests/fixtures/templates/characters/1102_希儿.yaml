custom_resources:
  _auto_skill_used:
    max: 1          # 加强版自动战技配额闩（每希儿回合 1 次；on_turn_start(actor=self) 复位——非 duration 型）
  _bf_proc:
    max: 1          # E6 Butterfly Flurry 递归护栏闩（声明序 set1→伤害→set0；嵌套事件同步发射假设待实测）
  _e6_ult_dmg:
    max: "inf"      # E6 新版锚点：本次终结技实额（结算后伤害值——「本次终结技伤害」非倍率）
  _seele_extra:
    max: 1          # 天赋再现压制闩（额外回合内不再触发再现——授予置 1、自身回合结束清零）

# 秘技：进战立即进入「增幅」；加强版追加对随机 1 名敌人造成等同战技倍率的量子伤（必暴击待收）
techniques:
  - technique_id: "110207"
    name: "幻身（本体）"
    point_cost: 1
    effects:
      - effect_type: "apply_modifier"      # 攻击敌人进入战斗 → 立即进入「增幅」
        target: "self"
        modifier:
          modifier_id: "AMPLIFICATION"
          name: "增幅"
          modifier_type: "buff"
          duration: 3
          stack_mode: "refresh"
          dispellable: True
          stat_effects: {"all_dmg": "param(1110204, 1)"}
      # 隐身 20 秒（探索层状态，不被敌人侦测）——待收：探索层无通道（挡因在头注）
  - technique_id: "1110207"
    name: "幻身（加强版）"
    point_cost: 1
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "AMPLIFICATION"
          name: "增幅"
          modifier_type: "buff"
          duration: 3
          stack_mode: "refresh"
          dispellable: True
          stat_effects: {"all_dmg": "param(1110204, 1)"}
      - effect_type: "deal_damage"        # 进场：随机 1 名敌人，等同战技倍率（lv10=3.6）
        name: "幻身·进场"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "quantum"
        amount: "param(1110202, 1) * stat_of($self, 'atk')"
        # 「必定暴击」待收（无 force_crit 键）；削韧/回能/天赋击杀归属待实测
        # 「Skill DMG multiplier」是否读当前战技等级档 待实测

