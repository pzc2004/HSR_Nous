    toughness_dmg: 10          # 米游社 sub_tag 削韧 10（fandom 空）；加强版未单发新削韧值——按本体同值
    skill_point_gain: 1        # tbgd 权威：+1 战技点
    energy_gain: 20            # tbgd 权威：回能 20
    # Rippling Waves 普攻后行动提前 20%（on_action 触发域含本 id，见 hooks 段）

  - action_id: "1110202"
    name: "归刃（加强版）"
    action_type: "skill"
    target_type: "single"
    damage_type: "quantum"
    scaling: [{"atk": 1.8}, {"atk": 1.98}, {"atk": 2.16}, {"atk": 2.34}, {"atk": 2.52},
              {"atk": 2.7}, {"atk": 2.925}, {"atk": 3.15}, {"atk": 3.375}, {"atk": 3.6},
              {"atk": 3.78}, {"atk": 3.96}, {"atk": 4.14}, {"atk": 4.32}, {"atk": 4.5}]
    toughness_dmg: 20
    skill_point_cost: 1        # 手动施放口径（tbgd）；自动追放 0/0 走 hooks
    energy_gain: 30            # 手动回能 30；自动追放回能 0（官方明示）
    # 自动追放（友方攻击后 HP%≤#4 目标）不建独立 action——hooks 承载（见 hooks 段）

  - action_id: "1110203"
    name: "乱蝶（加强版）"
    action_type: "ultimate"
    target_type: "single"
    damage_type: "quantum"
    energy_cost: 120
    energy_gain: 5
    scaling: [{"atk": 3.6}, {"atk": 3.96}, {"atk": 4.32}, {"atk": 4.68}, {"atk": 5.04},
              {"atk": 5.4}, {"atk": 5.85}, {"atk": 6.3}, {"atk": 6.75}, {"atk": 7.2},
              {"atk": 7.56}, {"atk": 7.92}, {"atk": 8.28}, {"atk": 8.64}, {"atk": 9.0}]
    toughness_dmg: 30

eidolons:
  E1:
    name: "extirpating_slash"
    notes:
      - "对当前 HP%≤80% 的敌人造成伤害时暴击率 +15% **且无视目标 20% 防御**（版本审计勘正 2026-09-14 B39——draft 只记旧版暴击半句）——双件全待收：①目标依赖型增益，enable_if 只读自身面板，无按受击目标血档门控的 crit 通道（1004 E6 同族）②无视防御=def_ignore 键缺（res_pen 抗性区不等值——1212 霜魄 11212103 同族）。'dealing DMG' 宽域（是否含附加伤害/DoT）待实测"
  E2:
    name: "dancing_butterfly"
    hooks:
      # 战技速度增益可叠 2 层——双件承载（过堂钓出：主干件同 id 重叠时 refresh 取
      # **存量** max_stack（主干 1）钳制，E2 后挂叠不上；拆第二层为独立件——
      # E0=主干 1 层、E2=主干+第二层各 25%，合计 50% 与"可叠 2 层"等值）
      - event: "on_action"
        condition: "$event.actor == '1102' && $event.action_id == '1110202' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "SEELE_SPD_BUFF_E2"
              name: "归刃·加速·第二层"
              modifier_type: "buff"
              stacks: 1
              max_stack: 1
              stack_mode: "refresh"
              duration: 3
              dispellable: True
              stat_effects: {"spd_pct": "param(1110202, 2)"}
    notes:
      - "加强版自动追放是否参与叠层 待实测（官方只说 'Skill 的 SPD Boost'——自动施放亦为 Skill，倾向可叠但不写死）；同 id 重叠存量钳制实测在案（双件承载缘由）"
  E3:
    name: "eidolon_3"
    skill_level_overrides: {"skill": 2, "talent": 2}
    notes:
      - "战技+2：110202/1110202 各 15 档 scaling 实取 lv12 档；速度提升 #2 全档恒值 0.25；持续回合 #3 全档恒值（本体 2/加强 3）——不随档"
      - "天赋+2：增伤 param(1110204,1) 随档（lv12=0.88）；持续回合 #2 全档恒值 3"
  E4:
    name: "flitting_phantasm"
    hooks:
      # 击杀回能 15（能量走 gain_energy 钩——不声明 custom_resources 'energy'）
      - event: "on_kill"
        condition: "$event.source == '1102'"
        effects:
          - effect_type: "gain_energy"
            amount: 15
    notes:
      - "'defeats an enemy' 无动作域限定——与天赋三技枚举不同；E6 附加伤害击杀/秘技进场伤击杀是否回 15 能 待实测"
  E5:
    name: "eidolon_5"
    skill_level_overrides: {"ultimate": 2, "basic": 1}
    notes:
      - "终结技+2：1110203 scaling 实取 lv12 档（7.92）；普攻+1：1110201 10 档实取 lv7 档（本体 110203/110201 留档表同退役——现役单轨）"
  E6:
    name: "shattering_shambles"
    hooks:
      # ① 终结技攻击后挂「乱蝶」3 回合 + 记录本次终结技实额（新版锚点=结算后伤害值——
      #    「希儿本次终结技伤害 30%」非倍率锚；同事件 effects 序读现场：先记后挂）
      - event: "on_hp_decrease"
        condition: "$event.source == '1102' && $event.action_type == 'ultimate' && $event.reason == 'hit' && actor_type_of($event.target) == 'monster'"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e6_ult_dmg"
            amount: "$event.amount"
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "BUTTERFLY_FLURRY"
              name: "蝶影"
              modifier_type: "debuff"
              duration: 3
              dispellable: True
      # ② 乱蝶目标每次被攻击 → 真伤 = 0.3×本次终结技实额（category "true" 跳乘区——
      #    新版=真实伤害；_bf_proc 闩挡递归——本段 reason='hit' 会再进本钩，声明序 set1→伤→set0）
      - event: "on_hp_decrease"
        condition: "has_modifier($event.target, 'BUTTERFLY_FLURRY') >= 1 && $event.reason == 'hit' && res__bf_proc < 1"
        effects:
          - effect_type: "set_resource"
            resource_id: "_bf_proc"
            amount: 1
          - effect_type: "deal_damage"
            name: "蝶影·附加"
            target: "$event.target"
            damage_type: "true"
            category: "true"
            amount: "0.3 * res__e6_ult_dmg"
            # 削韧/回能：文本未述，默认 0——待实测
          - effect_type: "set_resource"
            resource_id: "_bf_proc"
            amount: 0
      # ③ 新版豁免翻案：**任意**单位消灭乱蝶目标 → 触发再现（旧版「被乱蝶附加伤消灭
      #    不触发」作废）——非枚举来源补发：天赋钩触发域=三技枚举，本钩条件=乱蝶目标
      #    ∧ 非枚举行动 id，两条件互补防双发；压制闩同天赋（额外回合内不触发）
      - event: "on_kill"
        condition: "has_modifier($event.target, 'BUTTERFLY_FLURRY') >= 1 && !($event.action_id == '1110201' || $event.action_id == '1110202' || $event.action_id == '1110203') && res__seele_extra < 1"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "AMPLIFICATION"
              name: "增幅"
              modifier_type: "buff"
              duration: 3
              stack_mode: "refresh"
              dispellable: True
              stat_effects: {"all_dmg": "param(1110204, 1)"}
          - effect_type: "grant_extra_turn"
          - effect_type: "set_resource"
            resource_id: "_seele_extra"
            amount: 1
    notes:
      - "版本审计勘正（2026-09-14 B39）：draft 按**旧版**建模（乱蝶 1 回合/0.15×倍率×ATK 量子段/豁免再现）——新版=3 回合/0.3×本次终结技实额真伤/任意消灭触发再现三件全换"
      - "希儿倒地摘除全场蝶影——待收（挡因：remove_modifier 跨目标通道未实证）"
      - "'attacked' 域边界（DoT/追加伤害/反击是否算被攻击）待实测——本件按 reason=='hit' 实现；蝶影真伤段 reason 归类（是否计入 attacked 域自触发——现按 hit 计、_bf_proc 闩挡）待实测"

hooks:
  # 大行迹 Lacerate（加强版 11102102）：「增幅」内量子抗性穿透 +25%（本体 1102102 为 0.20，
  # 版本开关确认前维持加强版单件）——enable_if 写进 modifier 块（04_modifier §4.16 口径）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SEELE_LACERATE"
          name: "割裂"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "has_modifier($self, 'AMPLIFICATION') >= 1"
          stat_effects: {"res_pen": 0.25}

  # 加强版自动战技配额复位：希儿回合开始时重置（官方 "resets at the start of Seele's turn"
  # ——非自然轮转；on_turn_start 主体=actor）
  - event: "on_turn_start"
    condition: "$event.actor == '1102'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_auto_skill_used"
        amount: 0

  # 大行迹 Rippling Waves（11102103=1102103）：普攻后自身行动提前 20%
  - event: "on_action"
    condition: "$event.actor == '1102' && $event.action_id == '1110201' && !$event.insert"
    effects:
      - effect_type: "advance_action"
        target: "self"
        amount: 20

  # 战技速度增益（1110202 手动施放：#2 0.25 / #3 持续 3 回合——本体双 id 轴单轨化，
  # 110202 本体钩随行动块同退役，卡芙卡/银狼先例）
  - event: "on_action"
    condition: "$event.actor == '1102' && $event.action_id == '1110202' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SEELE_SPD_BUFF"
          name: "归刃·加速"
          modifier_type: "buff"
          stacks: 1
          max_stack: 1
          stack_mode: "refresh"
          duration: 3
          dispellable: True
          stat_effects: {"spd_pct": "param(1110202, 2)"}

  # 加强版自动战技（1110202 追放）：任意友方攻击（reason='hit'）的受击敌方目标当前 HP%≤#4
  #（lv10=0.5）→ 希儿自动对该目标追放战技 1 次：不耗战技点、不回能（sp/energy 均不写=0/0）；
  # 声明序：闩先落（防本段伤害自触发递归）→ 伤害 → 速度增益（refresh，与手动同件——
  # 自动是否复用同一速度件/E2 叠层 待实测）；倍率档同手动（是否分档 待实测）。
  # 存活过滤 hp_of>0（过堂钓出：on_hp_decrease 先于本段死亡检查发射——致死一击会把
  # 目标打进负血但尚未判死，缺过滤=追放抢在死判前发射并**截杀归因**（击杀落到
  # 追放段 aid=''——普攻/战技/终结技枚举外的击杀不触发再现，再现被吞）；官方
  # "攻击后目标 HP≤50%"不含已死目标，过滤同向）
  - event: "on_hp_decrease"
    condition: "actor_type_of($event.target) == 'monster' && $event.reason == 'hit' && res__auto_skill_used < 1 && hp_of($event.target) > 0 && hp_of($event.target) <= param(1110202, 4) * max_hp_of($event.target)"
    effects:
      - effect_type: "set_resource"
        resource_id: "_auto_skill_used"
        amount: 1
      - effect_type: "deal_damage"
        name: "归刃·自动"
        target: "$event.target"
        damage_type: "quantum"
        amount: "param(1110202, 1) * stat_of($self, 'atk')"
        toughness_dmg: 20      # 按战技件同削韧读——自动段削韧 待实测
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SEELE_SPD_BUFF"
          name: "归刃·加速"
          modifier_type: "buff"
          stacks: 1
          max_stack: 1
          stack_mode: "refresh"
          duration: 3
          dispellable: True
          stat_effects: {"spd_pct": "param(1110202, 2)"}
    # EN 触发域："After an ally target attacks"（宽域，非 'uses Skill/Ultimate'）——
    # 追加伤害/DoT/反击是否入围 待实测（本件以 reason=='hit' 界定）；
    # 兜底「无有效目标改打最低 HP% 敌人」在 hook 形态下不可达（触发即存在受击目标），不收

  # 终结技进入「增幅」（1110203 官方 desc："enters the Amplification state"）
  - event: "on_ultimate"
    condition: "$event.source == '1102' && $event.action == '1110203'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "AMPLIFICATION"
          name: "增幅"
          modifier_type: "buff"
          duration: 3
          stack_mode: "refresh"
          dispellable: True
          stat_effects: {"all_dmg": "param(1110204, 1)"}

  # 天赋再现：击杀（动作域=普攻/战技/终结技显式枚举——现役三 id；不含 follow_up/秘技进场伤）
  # → 进入「增幅」（增伤 param(1110204,1)，加强版持续 3 回合）+ 授予额外回合
  #（过堂收编——grant_extra_turn 原语在库，draft 误判"词表无此 effect_type"）。
  # 额外回合内不再触发再现：压制闩 res__seele_extra（授予时置 1——击杀当下判据见旧值
  # 0 放行；额外回合内再杀判据 1 压制）+ 额外回合结束清零（on_turn_end 自身）；
  # 闩清除时点与官方"额外回合结束后恢复可触发"口径待实测
  - event: "on_kill"
    condition: "$event.source == '1102' && ($event.action_id == '1110201' || $event.action_id == '1110202' || $event.action_id == '1110203') && res__seele_extra < 1"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "AMPLIFICATION"
          name: "增幅"
          modifier_type: "buff"
          duration: 3
          stack_mode: "refresh"
          dispellable: True
          stat_effects: {"all_dmg": "param(1110204, 1)"}
      - effect_type: "grant_extra_turn"
      - effect_type: "set_resource"
        resource_id: "_seele_extra"
        amount: 1
  - event: "on_turn_end"
    condition: "$event.actor == '1102'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_seele_extra"
        amount: 0

  # 大行迹 Nightshade 加强版（11102101，替换本体降仇恨）：击杀时伤害 +50%/层（字面值——
  # 行迹无等级轨道），至多 3 层、持续 3 回合——计数层+烘焙值双件（1407 同构）。
  # 触发域 EN 无动作域限定（与天赋三技枚举不一致——E6 附加伤/秘技进场伤击杀是否叠层 待实测）
  - event: "on_kill"
    condition: "$event.source == '1102'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SEELE_NIGHTSHADE_STACKS"
          name: "夜幕"
          modifier_type: "buff"
          stacks: 1
          max_stack: 3
          stack_mode: "refresh"
          duration: 3
          dispellable: True
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SEELE_NIGHTSHADE_BOOST"
          name: "夜幕增伤"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 3
          dispellable: True
          stat_effects:
            all_dmg: "0.5 * min(stacks($self, 'SEELE_NIGHTSHADE_STACKS'), 3)"

scaling_notes:
  - "双 id 轴单轨化（过堂）：现役=加强版 11102xx——本体 1102xx 行动块摘除（卡芙卡 11005xx/银狼 11006xx 先例；draft 曾双轨并登记=双普攻双战技双终结技同时在册政策面并列，且与 trace_notes 自身'大行迹按加强版实现'的承诺矛盾）；本体表留档于 skill_params 备查不引用；hooks/星魂条件同步单 id 化"
  - "天赋再现额外回合过堂收编：grant_extra_turn 原语在库（05_effects 已收编清单——draft 误判'词表无此 effect_type'）；压制闩 res__seele_extra（授予置 1——额外回合内不再触发；自身回合结束清零，时点口径待实测）"
  - "自动战技（1110202 追放）不建 action：sp_cost/energy_gain 豁免 + 每希儿回合 1 次配额 + 自动目标选择均是 hook 语义，action 层承载会污染 SP/能量记账（官方明示不耗点不回能）"
  - "能量纪律：max_energy 120 走内建槽（action energy_cost/energy_gain + gain_energy 钩），custom_resources 不声明 'energy'"
  - "增幅（AMPLIFICATION）单池：终结技与天赋同名同池（官方双入口进同一状态），stack_mode refresh；Lacerate enable_if 以 has_modifier('AMPLIFICATION') 门控"
  - "取档纪律：15 行表 lv10=第 10 行（1110202 倍率 3.6、1110203 倍率 7.2、1110204 增伤 0.8），非表尾"
  - "待实测清单（不脑补）：①自动战技触发域边界（追加伤/DoT/反击）+倍率档复用+希儿被控跳回合时配额复位；②Nightshade 加强版触发域是否含 E6 附加伤/秘技进场伤击杀；③E4 击杀回能归因域；④E6 蝶影 15% 锚点（倍率 vs 结算后伤害值）、'attacked' 域边界、_bf_proc 嵌套事件同步假设、附加伤削韧；⑤E1 'dealing DMG' 宽域；⑥秘技进场伤的削韧/回能/天赋归属与「Skill DMG multiplier」等级锚；⑦E2 与主干件同 modifier_id 的 max_stack 重叠生效口径；⑧天赋额外回合的行动条插位与回合计数推进（通道到位后校准）；⑨刻律复制战技可触发再现（社区单源，外部角色交互，不进本体 hooks）"
