# 角色模板：希儿（1102）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂收编/勘正两件：① 双 id 轴单轨化——现役=加强版 11102xx，本体 1102xx
#   行动块摘除（卡芙卡 11005xx/银狼 11006xx 先例；draft 双轨并登记=双普攻
#   双战技双终结技同时在册政策面并列，且与 trace_notes 自身"大行迹按加强版
#   实现"的承诺矛盾）；本体表留档 skill_params 备查；hooks/星魂条件单 id 化。
#   ② 天赋再现额外回合收编——grant_extra_turn 原语在库（05_effects 已收编
#   清单，draft 误判"词表无此 effect_type"）；压制闩 _seele_extra（授予置 1
#   ——额外回合内不再触发再现；自身回合结束清零，时点口径待实测）。
#
# 收录：普攻 1110201 / 战技 1110202（3.6 lv10 + SPD+25% 三回合）/
#       终结技 1110203（7.2 lv10 + 进增幅）/ 增幅单池（增伤 0.8 lv10 三回合
#       refresh）/ 大行迹 Lacerate（增幅内抗穿 25% enable_if 门控）/
#       Rippling Waves（普攻拉条 20%）/ Nightshade 加强版（击杀叠层 50%×3）
#       / 天赋再现（三技枚举击杀 → 增幅 + 额外回合 + 压制闩）/
#       加强版自动战技（友方攻击后目标 HP≤50% → 追放 3.6 不耗点不回能，
#       每希儿回合 1 次配额闩）/ 秘技进战增幅（+随机单体战技倍率段）/
#       E2 加速叠 2 层 / E3/E5 等级族 / E4 击杀回能 15 / E6 蝶影附加段
# 待收（均带挡因）：E1 目标血档暴击（scoped accept 只收 dmg_*——crit_* 不在
#       命中域）/ 秘技必暴击（force_crit 键缺）/ Nightshade 本体降仇恨
#       （仇恨通道缺）/ E6 希儿倒地摘全场蝶影（remove_modifier 跨目标通道
#       未实证）/ 自动追放触发域边界（DoT/追加/反击计次待实测）/
#       E6 蝶影真伤段 reason 归类（是否计入 attacked 域自触发待实测——新版
#       锚点已按官方「本次终结技伤害」落实为结算后实额，倍率歧义随新版消歧）
actor_id: "1102"
name: "希儿"
level: 80
path: "the_hunt"
groups: ["faction:wildfire"]   # 野火（Wildfire）——官方剧情归属；_FACTION_ROSTERS 对照未下发，待核
element: "quantum"
base_stats:
  hp: 931.392                  # 官方 calc lv80 实值（唯一照抄源，社区页数值不采）
  atk: 640.332
  def: 363.82500000000005
  spd: 115
  crit_rate: 0.05
  crit_dmg: 0.5
  max_energy: 120              # 常规能量条（官方 max_sp=120；内建资源——不进 custom_resources）
trace_notes:
  - "行迹面板节点（暴击/速度/增伤白值平铺）数据未随本包下发——base_stats 维持管线实值，trace_stat_effects 空；首个节点数据到达时按平铺（≥管线值）/trace_stat_effects（百分比）分流补"
  - "大行迹双版本：Nightshade 本体（1102101，HP≤50% 降被攻击概率）与加强版（11102101，击杀叠层增伤）机制整体替换——本模板按加强版实现，本体降仇恨待收（仇恨通道缺）；本体 1102xx 行动块随现役单轨化同退役（scaling_notes）"
  - "Lacerate 双值：本体 0.20 / 加强版 0.25——按加强版 0.25 实现；版本开关确认前维持单件（无观察差于 demo 若开关=加强版）"
  - "Rippling Waves 两版同值 20%，单件承载"
