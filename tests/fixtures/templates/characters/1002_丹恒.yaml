# 角色模板：丹恒（1002）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂收编（staging→fixtures 合并流水线首个校准例）
#
# 过堂收编四件（打标稿误判通道缺，引擎现状可组出）：
#   ① 天赋 100204（on_become_target 收编——白厄 140804 同族事件）
#   ② 战技暴击减速（is_critical 载荷——2026-09-12 通道落地首个角色级实例）
#   ③ 终结技 Slowed 追加 ④ 大风（真伤压缩口径，遐蝶 E1 等值先例）
#   行迹数值回填（atk_pct 0.18/def_pct 0.125 生成器同源 + 风伤 0.224 hsr-optimizer 交叉）
#
# 收录：普攻/战技/终结技 scaling 全表照抄 params（取档 index=等级-1）/ 场景攻击 /
#       秘技 ATK+40% / 天赋（武装+冷却+消耗三钩）/ 战技减速（暴击门控）/
#       终结技 Slowed 追加（#2/#1×原伤害真伤）/ 大风（0.4×原伤害真伤）/
#       E2 冷却置 1（后注册覆盖）/ E5 天赋随档（param 链）/ E6 减速追加件 /
#       E3/E5 等级族 / E4 击杀再动（advance_action 承载，语义待实测）
# 待收（均带挡因）：1002101 潜龙在渊（taunt 修正键名未定+官方无数值）/
#       1002102 迅光（mechanic_chance 通道在库——固定概率用法待判例）/
#       E1（命中域无 crit 通道+target_hp_ratio 仅限治疗域）/
#       全技能 toughness_dmg（fandom 削韧值未取）/ 跨源减速检索（kind 检索原语缺）
actor_id: "1002"
name: "丹恒"
level: 80
path: "hunt"          # 巡猎命途（官方内部类目 Rogue ↔ hunt canonical——闭合词表唯一合法态）
element: "wind"          # 风
# —— 收录：普攻 100201 / 战技 100202 / 终结技 100203（scaling 全表照抄 params）/ 场景攻击 100206 /
#    秘技 100207 / 行迹数值（atk_pct/def_pct/风伤——生成器小节点+hsr-optimizer 交叉）/
#    天赋 100204（on_become_target 收编——打标稿误判"无被指向通道"过堂钓出）/ 战技暴击减速
#    （is_critical 载荷收编）/ 终结技 Slowed 追加与大风（真伤压缩口径遐蝶 E1 先例）/
#    E2 冷却置 1 / E5 天赋随档（param 链自生效）/ E6 减速追加件 / E3/E5 等级族 / E4 击杀再动
# —— 待收（均带挡因）：1002101 潜龙在渊（taunt 修正键名未定+官方无数值）/ 1002102 迅光
#    （mechanic_chance 通道在库——固定概率用法待判例）/ E1（命中域无 crit 通道+target_hp_ratio
#    仅限治疗域）/ 全技能 toughness_dmg（fandom 削韧值未取）/ 跨源减速检索（kind 检索原语缺）
# —— 数值：照官方 params 全表逐行照抄（scaling 表=action 层；skill_params 表+param() 引用=hook 侧
#    随档系数——本版 hook 侧暂无随档引用件，表仍全量入册备后续回填）
base_stats:
  hp: 882                 # 官方管线 lv80 实值（社区页数值一律以此终审）
  atk: 546.84
  def: 396.9
  spd: 110                # 官方 lv80 白值（行迹无速度节点）
  crit_rate: 0.05         # 官方 lv80 白值（行迹无暴击率节点）
  crit_dmg: 0.5           # 官方 lv80 白值（行迹无暴伤节点）
  max_energy: 100         # 官方：满能 100 释放终结技
  dmg_bonus:
    wind: 0.224         # 行迹风伤节点（白值面板位——hsr-optimizer game_data 交叉验证；
                        # 生成器属性伤节点映射待补在案）

trace_notes:
  - 大行迹「潜龙在渊」（1002101）待收：当前 HP%≤50%（params_max=[0.5]）时降低被敌人攻击概率——
    taunt 修正通道键名未定（官方未给数值比例），挡因在案，不脑补
  - 大行迹「迅光」（1002102）待收：攻击后 50% 固定概率 SPD+20% 持续 2 回合——condition 无
    RNG 原语（随机触发通道缺），挡因在案
  - 大行迹「大风」（1002103）待收：普攻对 Slowed 敌人增伤 +40%——Slowed 检索通道缺（同终结技
    追加倍率挡因），且增伤乘区归属待实测，挡因在案
trace_stat_effects:
  atk_pct: 0.18         # StarRailRes 行迹小节点（生成器同源）
  def_pct: 0.125        # 同上

