    level_key: talent    # 寸长寸强（Talent——纯机制天赋，无 action，主干待收）
    rows:                # lv1..lv15 照抄原始数据 params（#1 风抗穿/#2 冷却回合）
      - [0.18, 2]
      - [0.198, 2]
      - [0.216, 2]
      - [0.234, 2]
      - [0.252, 2]
