actions:
  - action_id: "800601"
    name: "摇摆的礼仪"
    action_type: "basic"
    target_type: "single"
    damage_type: "imaginary"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    # lv1..lv10 全表照抄（#1 倍率×atk；官方 "one designated enemy" 单体点选）
    toughness_dmg: 10       # 米游社 sub_tag「削韧 10」（fandom 无数据——来源=米游社）
    skill_point_gain: 1     # tbgd sp_gain=1 权威（米游社「战技点 +1」一致）
    energy_gain: 20         # tbgd 对轴 + 米游社「回能 20」

  - action_id: "800602"
    name: "中场馈赠的雨"
    action_type: "skill"
    target_type: "single"   # 首段单体指定；4 段随机弹射由本体 hooks 承载（target 代数 random）
    damage_type: "imaginary"
    scaling: [{"atk": 0.25}, {"atk": 0.275}, {"atk": 0.3}, {"atk": 0.325}, {"atk": 0.35},
              {"atk": 0.375}, {"atk": 0.4062}, {"atk": 0.4375}, {"atk": 0.4688}, {"atk": 0.5},
              {"atk": 0.525}, {"atk": 0.55}, {"atk": 0.575}, {"atk": 0.6}, {"atk": 0.625}]
    # lv1..lv15 全表照抄（取档 index=等级-1；lv10=第 10 行 0.5）
    toughness_dmg: 10       # 米游社「削韧10+5*4」：首段 10，弹射段 5×4 走 hooks 逐段
    skill_point_cost: 1     # tbgd BPNeed sp_cost=1 为权威；米游社 sub_tag 无「消耗」标属漏标（对轴裁决在案）
    energy_gain: 30         # 米游社「回能 30 (6*5)」合计（action 层一次入账，逐段分布不进账）

  - action_id: "800603"
    name: "喧嚣的舞灯巡游"
    action_type: "ultimate"
    target_type: "self"     # Support 型：无目标选择，全体自动套用
    damage_type: "none"     # 纯支援技无伤害段（1306 一人千役同形）
    energy_cost: 140        # tbgd + 米游社「能量 140」
    energy_gain: 5          # 米游社「回能 5」
    toughness_dmg: 0
    apply_modifiers:
      # 伴舞【Backup Dancer】：击破特攻 +#3（lv10 = +30%）。
      # 持续 #1=3 回合 + 官方「开拓者每次回合开始 -1」：单实例挂 8006 + effect_scope team
      # 辐射全队 + tick_anchor owner_turn_start（holder=8006 回合开始走字——阮梅弦外音族
      # 同锚先例；逐人各挂会错成按各持有者回合计）。重放刷新按 stack_mode refresh 保守读。
      - target: "self"
        modifier_id: "BACKUP_DANCER"
        name: "伴舞"
        modifier_type: "buff"
        duration: 3
        tick_anchor: "owner_turn_start"
        stack_mode: "refresh"
        effect_scope: "team"
        dispellable: False      # 官方未标可驱散——保守 False（待实测）
        stat_effects: {"break_effect": "param(800603, 3)"}   # 编译期取档——E4 stat_of 可读
      # 伴舞·超击破伴随件（勘正④⑤ 收编）：削韧值 → 1 段超击破伤害（super_break_modifier
      # 转换倍率池——敌数分档 1.6/1.4/1.2，≤1/≤3/>3 名；来源 02_damage_formula §2.11 +
      # hsr-optimizer + 社区对轴）+ 8006101 卫我起舞超击破增伤（敌数五档 0.2..0.6，官方
      # params 字面值）。敌数现场分档 → stat_exprs 通道（enemies_alive 宿主——蒙福者烘焙
      # 不适用：敌数随战斗进程变）。与伴舞同 duration/锚点/scope——同挂同到期。
      - target: "self"
        modifier_id: "BACKUP_DANCER_SB"
        name: "伴舞·超击破"
        modifier_type: "buff"
        duration: 3
        tick_anchor: "owner_turn_start"
        stack_mode: "refresh"
        effect_scope: "team"
        dispellable: False
        stat_exprs:
          super_break_modifier: "enemies_alive() <= 1 ? 1.6 : (enemies_alive() <= 3 ? 1.4 : 1.2)"
          super_break_dmg_boost: "enemies_alive() >= 5 ? 0.2 : (enemies_alive() >= 4 ? 0.3 : (enemies_alive() >= 3 ? 0.4 : (enemies_alive() >= 2 ? 0.5 : 0.6)))"

# 800606「攻击」不落 actions（挡因见 trace_notes）
techniques:
  - technique_id: "800607"
    name: "即刻！独奏团"
    point_cost: 1
    effects:                # 进战一次性（战前装填预置，18.3；施放者=8006）
      # 下场战斗开始时我方全体 BE +30%、持续 2 回合（单档 params [[0.3,2]]——字面值，
      # 无等级轨道不走 param()；多波次是否逐波生效待实测）
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "TECH_SOLO_SPOTLIGHT"
          name: "即刻！独奏团"
          modifier_type: "buff"
          duration: 2
          dispellable: False    # 官方未标可驱散——保守 False（待实测）
          stat_effects: {"break_effect": 0.3}

hooks:
  # 800604 天赋 全屏段的高空踏歌：当场上任意敌人弱点击破时，立即回复 param(800604,1)
  # 能量（lv10=10）。全自动事件驱动；desc 未限定击破来源——按字面实现（target 侧
  # monster 过滤）；回能吃 ERR（非 mechanics 05 §5.3 豁免族，默认口径）
  - event: "on_break"
    condition: "actor_type_of($event.target) == 'monster'"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: "param(800604, 1)"

  # 8006102 随波逐流（勘正⑥ 收编）：常驻 scoped 件——hit_condition 命中域
  # action_type=='skill' 时削韧效率 +100%（params [[1]] 字面值——行迹无等级轨道）。
  # 恰好覆盖官方「施放战技时，第一次伤害的削韧值额外提高」语义域：action 层主段是
  # 8006 全场唯一 skill 型伤害；4 段弹射伪行动类别 follow_up（缺省）自然出集——
  # 该缺省是本 scoped 的承载语义，改派 action_type 槽即破坏（飞霄 E4 同构先例）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TRACE_FLOW_SKILL_EFF"
          name: "随波逐流"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          hit_condition: "$event.action_type == 'skill'"
          stat_effects: {"break_efficiency_boost": 1.0}

  # 800602 战技弹射段：额外 4 次，每次对随机敌人造成 param(800602,1)×atk 虚数伤害、
  # 逐段削韧 5（米游社「10+5*4」）。随机池是否含首段指定目标/权重是否均匀待实测；
  # expected 确定化按序取首（B22 纪律）。散装 4 段同形——段数即官方 "4 times"
  - event: "on_action"
    condition: "$event.actor == '8006' && $event.action_id == '800602' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "中场馈赠的雨·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(800602, 1) * $self.atk"
        toughness_dmg: 5
      - effect_type: "deal_damage"
        name: "中场馈赠的雨·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(800602, 1) * $self.atk"
        toughness_dmg: 5
      - effect_type: "deal_damage"
        name: "中场馈赠的雨·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(800602, 1) * $self.atk"
        toughness_dmg: 5
      - effect_type: "deal_damage"
        name: "中场馈赠的雨·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(800602, 1) * $self.atk"
        toughness_dmg: 5

  # 8006103 剧院之帽（勘正③）：我方目标造成弱点击破后，该敌人行动延后 30%
  #（params [[0.3]] 字面值——delay_action 百分数 30 = +0.3×10000 剩余距离；
  # 与击破固有延后独立相加，加/乘算合并口径待实测——1225 A1 同注在案）
  - event: "on_break"
    condition: "actor_type_of($event.source) != 'monster' && actor_type_of($event.target) == 'monster'"
    effects:
      - effect_type: "delay_action"
        target: "$event.target"
        amount: 30

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN；官中名以 character_ranks.json 核（勘正⑩）
eidolons:
  E1:
    name: "您的最佳观众席"
    hooks:
