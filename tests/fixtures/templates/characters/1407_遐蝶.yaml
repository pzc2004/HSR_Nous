# 角色模板：遐蝶（1407）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 收录：新蕊特殊充能（ult_cost_resource 通道，上限 34000=米游社 energy_cap）/
#       战技耗全队当前 HP 30%（drain_hp 收编首实例，floor 1 保底）/
#       终结技召唤死龙（inheritance none + 常量 Max HP=新蕊上限×100%）+ 死龙行动提前 100% +
#       境界【遗世冥域】（res_pen 0.2 光环=官方"全属性抗性降低"，mechanics 02：RES_PEN 含抗性降低）/
#       天赋失 HP 产新蕊 / 死龙在场转化为死龙 HP / 遐蝶+死龙增伤计数层+烘焙值双件 /
#       140709 骸爪连携（死龙半挂死龙侧 hook + 基数 max_hp_of('1407') 跨 actor 读忆师——
#       R-CY3 收官 2026-09-17：旧压缩口径「忆灵继承忆师面板 ⇒ 挂哪边等价」仅在对称 buff
#       下成立；长夜月光环 CD/天亮了/长夜月 E1 final 区为忆灵限定（不落遐蝶）⇒ 不等价，
#       死龙半必须按死龙面板结算；爪痕同迁）/ 1140706 晦翼+E6 追加段（**2026-09-17
#       时序扶正收官——before_actor_exit 生前自爆**：死龙侧 hook 挂死龙面板，忆灵限定
#       buff 对 9 段全通，R-CY3 残留收口；引擎新发射点见 23 章事件名册）/
#       死龙焰息（耗自身 25% Max HP 保底 1 + 倍率逐次递增 lv6 0.24/0.28/0.34 封顶不清零——
#       计数资源+动态基数）/ 低血 25% 主动降 1 触发消失 / 3 回合消失 /
#       1140703 替身（before_take_damage waterfall cancel——任意队友承伤降至 1，死龙承担 5%）/
#       1140705 被召唤全体增伤 10% / 1140706 消失 6 段随机单体（逐段削韧 5）+全体治疗 /
#       140709 死龙半削韧 10（hook toughness_dmg 收编——2026-09-07，遐蝶半 action 层 10 同发）/
#       大行迹「收容的暗潮」治疗 12% 转化主干 / 大行迹「西风的驻足」（焰息增伤 30%/层×6 本回合）/
#       大行迹「倒置的火炬」两件（遐蝶 HP≥50% 速度+40%——enable_if 门控（04_modifier §4.16）+
#       HP 事件全队速度重同步首实例；死龙半：焰息致命全灭（on_kill action_id 归属 +
#       enemies_alive()==0 判定）或敌锁血不可削减（on_hp_lock 钳制发射点）→ 死龙速度
#       +100% 1 回合——2026-09-09 致命判定通道收编）/ 换技能硬闸（140702↔140709 死龙在场换技能——
#       available_if 互斥声明（03_actor §3.8.1，2026-09-07 收编；非形态机——entry=变身语义
#       会误 end_current_turn+授倒计时））/
#       星魂 E1-E6（见 eidolons 块——E1 四技低血加伤 / E2 炽意抵扣+强化战技返蕊
#       （before_drain waterfall 首实例，2026-09-10）/ E4 受疗 + E6 量子抗穿+晦翼 +3 段；E3/E5 等级族）
# 待收：收容的暗潮"每目标累计转化 ≤ 新蕊上限 1%、任意单位行动后重置"（per-target 计数通道缺）
# 数值：照 query-game-data params 表；action 倍率全表照抄，hook/modifier 侧系数走
#       skill_params 表 + param() 编译期引用（05_effects §5.1——2026-09-08 回填，随档）
actor_id: "1407"
name: "遐蝶"
level: 80
path: "remembrance"   # 命途（count_team 编成计数口径——昔涟 1415102 / 长夜月 1413103 读）
groups: ["faction:chrysos_heir"]   # 黄金裔名册（03_actor §3.1——官方献予诗系列 1141513-1141526 逐目标诗权威推断，生成器 _FACTION_ROSTERS 同源；in_group/count_team(group=) 口径）
element: "quantum"   # 元素（element_of 取数源——动态元素族，03_actor §3.1；官方数据照抄）
energy_name: "新蕊"      # 特殊充能显示名（官方文本「新蕊」在案；白厄火种同通道）
base_stats:
  hp: 1629.936
  atk: 523.908
  def: 485.1
  spd: 95
  crit_rate: 0.237    # 0.05 + 行迹暴击率节点 ×4（生成器口径照抄）
  crit_dmg: 0.633     # 0.5 + 行迹暴伤节点 ×2（生成器口径照抄）
  max_energy: 0       # 特殊充能：非常规能量槽（新蕊激活终结技，140704；fandom 全技能回能 0）
  dmg_bonus:
    quantum: 0.144    # 行迹量子增伤节点 ×3（生成器口径照抄）
trace_notes:
  - 大行迹「收容的暗潮」主干已收（治疗 12% 转化为新蕊/死龙 HP，见 hooks）；"我方每个目标累计转化值不超过新蕊上限 1%、任意单位行动后重置"待收（per-target 计数+重置通道缺）。数值读法在案：CN desc 占位序（#1 转化位/#2 上限位）与 params [1, 0.12] 错位——按语义读（转化率 12%、累计上限 1%，与 fandom 渲染一致）
  - 大行迹「倒置的火炬」已收两件：①遐蝶 HP≥50% 时速度+40%（enable_if 门控——HP 变化经 on_hp_decrease/on_hp_increase 全队速度重同步上路，04_modifier §4.16）②死龙半（2026-09-09 致命判定通道）：死龙施放焰息对场上所有敌方造成致命伤害（on_kill 逐杀发射——action_id 致死行动归属到 hook 伤害（继承触发事件行动 id），AoE 顺序结算最后一杀 enemies_alive()==0 方挂）或敌方无法被继续削减生命值（on_hp_lock——hp_lock 钳 1 血发射点）时死龙速度+100% 持续 1 回合（#3=1.0 spd_pct 白值口径；tick_anchor=owner_turn_start——授予在本回合结算中，end 锚会当回合末到期提速落空，读法在案）。官方原文主语为"敌方"无法被削减（非死龙自身——模板注记曾误写死龙半，按官方文本改正）
  - 大行迹「西风的驻足」已收（死龙侧 hooks：焰息施放后伤害+30%/层、至多 6 层、持续至本回合结束——计数层+烘焙值双件；本次施放不吃、后续发起吃，按"每次施放时提高"读法，B19 候选待实测）
trace_stat_effects: {}

