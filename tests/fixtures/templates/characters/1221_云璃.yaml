hooks:
  # —— 天赋受击反击（122104）：被敌人攻击（gets attacked）→ 对攻击者立即反击。
  # Parry 中则改放 Intuit: Cull（122103 #1/#6/#7）并摘除 Parry；EN 触发域=受击（非能力施放域）
  - event: "on_hp_decrease"
    condition: "$event.target == '1221' && $event.reason == 'hit' && has_modifier($self, 'YUNLI_PARRY') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "Intuit: Cull"
        action_type: "ultimate"
        target: "$event.source"
        damage_type: "physical"
        amount: "param(122103, 1) * $self.atk"
