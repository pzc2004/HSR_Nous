          modifier_id: "TRUE_SUNDER_ATK"
          name: "真式"
          modifier_type: "buff"
          duration: 1
          dispellable: False
          stat_effects: {"atk_pct": "0.3"}
      - effect_type: "set_resource"
        resource_id: "_slash_toggle"
        amount: 1
      - effect_type: "remove_modifier"
        modifier_id: "YUNLI_PARRY"
  - event: "on_turn_end"
    condition: "has_modifier($self, 'YUNLI_PARRY') >= 1 && res__slash_toggle >= 1"
    effects:
