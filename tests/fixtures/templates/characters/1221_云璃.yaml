        name: "Intuit: Cull·追加"
        action_type: "ultimate"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        amount: "param(122103, 7) * $self.atk"
      - effect_type: "deal_damage"
        name: "Intuit: Cull·追加"
        action_type: "ultimate"
        target: {pool: "enemies", take: 1, mode: "random"}
