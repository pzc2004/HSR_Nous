scaling_notes:
  - 反击型主 C 双层结构：受击触发域（天赋 gets attacked）与敌方主动施放域（E6 uses abilities）分源——前者 on_hp_decrease reason='hit' 且 target=self，后者 on_action 且 actor 为 monster；两 hook 互斥由 Parry 存续（has_modifier）+ 声明序保证（E6 与天赋 Cull 同刻摘 Parry，先命中者生效）
  - Slash/Cull 伤害类型：EN 收束句 "it's considered as dealing Ultimate DMG" ⇒ 终结技增伤/内圈遗器命中域；动作注册层仍分 ultimate（Slash/Cull 语义）与 follow_up（天赋反击）——本版 hook 侧统一 damage_type physical，Ultimate DMG 乘区归属待实测（挡因：damage 域标签通道未见锚例）
  - Parry 时长近似：duration 1 + owner_turn_end 锚 vs 官方「至下一个友方或敌方回合结束」——双主体回合锚通道缺（B19 候选）；兜底 Slash 于 on_turn_end 判 Parry 存续，若同刻过期先摘则兜底落空，排序待实测
  - 终结技能耗：params #8=120 照抄为 energy_cost；角色封套 max_sp=240 冲突待实测（base_stats max_energy 按 120 记）
