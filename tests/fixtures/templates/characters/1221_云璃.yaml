# 角色模板：云璃（1221）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂勘正七件（staging+fixture 同步）+ grants_immune 闸升级一件：
#   ① 天赋反击回能 +15 收录——官方 desc「additionally regenerates #3[i]
#     Energy」+params #3=15 双证权威（draft「三方源冲突待实测」过虑——
#     tbgd 10/mys 5 为标签病灶）；gain_energy 六连翻案先例
#   ② Parry 到期+兜底改任一回合结束——官方「lasting until the end of the
#     next ally's or enemy's turn」：draft on_turn_end 只判云璃自己回合=
#     窗口失真（大招通常在别人回合插入——Parry 应活到下一行动者回合末）
#   ③ Cull/Slash deal_damage 加 action_type: "ultimate"（官方归 Ultimate
#     DMG 域——1220 飞霄声明槽第二消费者；秘技「后发先至」同标）
#   ④ YUNLI_PARRY 件补 crit_dmg 1.0（122103 #2 下一次反击暴伤+100%——
#     Parry 期反击即「下一次」天然语义）+ dmg_dmg_reduction 0.2（Demon
#     Quell #1 减伤 20%——活键，draft 误判「未见锚例」1107/1206/1211 先例）
#   ⑤ grants_immune: ["crowd_control"]→["control"]——Demon Quell 免疫控制
#     （官方「resists Crowd Control debuffs received」无概率=免疫，对比
#     藿藿「increases the chance by 35%」为概率抵抗）；错拼 kind=免疫死挂
#   【grants_immune 闸升级】字面 kind 改词表校验（{debuff,dot,control}—
#     crowd_control 类"形似 kind 但引擎不认"错拼不能再漏——1207 表达式案
#     与 1221 错拼案同族收口）
#   ⑥ atk_pct 注释勘误（活键已 1207/1215 实证）
#   ⑦ 秘技 Ward 直入化——draft 挂 YUNLI_WARD 标记+主干 on_battle_start
#     钩中转：emit 快照语义下同事件钩 condition 快照时标记未挂=永不触发
#     （1214 同族反向案）；改 techniques effects 直接结算（「进战即结算」
#     语义本身无需标记中转）
#   ⑧ 嘲讽挡因改写——stat 键 taunt 在 pipeline l1 可用，但敌方 AI 目标
#     选择未读（木桩现状）：非键缺，是消费端缺——待敌方 AI 立项后生效
#
# 重审勘正两件（2026-09-24，全部实证非误报）：
#   ⑨ Parry-Cull 钩补 gain_energy 15——官方 122104「When Yunli gets
#     attacked...additionally regenerates #3[i] Energy and immediately
#     launches a Counter」：受击回能与反击同触发，Parry 仅把反击改写为
#     Cull（122103）不改写回能；非 Parry 钩有回能、Parry-Cull 钩漏挂
#   ⑩ E4 触发时机勘正——官方「After launching Intuit: Slash or Cull」=
#     发射后；旧挂 on_action 122103（终结技施放=开 Parry 瞬间，发射是
#     后续受击/兜底/E6/秘技的 hook 瞬发段）比官方早约一回合；改挂发射
#     签名钩（on_hp_decrease source=1221 且 action_type=ultimate——本
#     模板内仅 Slash/Cull 各形态声明 ultimate 类伤害，一钩覆盖全部
#     发射点含秘技 Ward Cull）
#
# 收录：普攻戍剑 / 战技飞环（主 1.1 邻 0.55 lv10+自奶 0.3×atk+330 lv10）
#       / 天赋闪铄反击（受击→攻击者 1.2 lv10 + 回能 15——相邻段 0.6 待收
#       （相邻谓词缺 1210 同族）/ 终结技剑为地纪（Parry：免疫控制+减伤
#       20%+下一次反击暴伤+100%，至下一任一回合结束）/ Parry 中受击 Cull
#       （主 2.2 lv10+追加 6×0.72——相邻段 1.1 待收同族）/ 兜底 Slash
#       （Parry 到期未反击→主 2.2（Fiery Wheel 交替闩下次回 Cull））/
#       大行迹 True Sunder（反击后 ATK+30% 1 回合）/ Demon Quell（Parry
#       期免疫控制+减伤 20%）/ Fiery Wheel（Slash→Cull 交替）/ 秘技 Ward
#       （进战 Cull×1.8）/ E4 Slash/Cull 发射后效果抵抗+50% / E6 Parry
#       期敌方施放即 Cull（触发域扩至任意敌方施放）
# 待收（均带挡因）：相邻段三处（天赋邻 0.6/Cull 邻 1.1/Slash 邻——相邻
#       谓词缺，1210/1221 同族立项候选）/ E1 追加段 6→9（段数资源循环
#       通道缺）/ E1 Slash/Cull 增伤 20%（action 级增伤过滤通道缺）/
#       E2 反击无视 20% 防御（def 区 scoped 第四面缺——承伤三区已通
#       （vuln/res_pen/efficiency），def 区待实例）/ 嘲讽（敌方 AI 消费端）/
#       Parry tick 顺序（兜底先到期与钩摘除先后）/ 秘技触发态（主动攻击
#       或受击二择一）
