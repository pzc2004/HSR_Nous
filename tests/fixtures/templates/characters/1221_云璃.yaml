  # Fiery Wheel 交替：toggle=0 → Slash（随后置 1）；toggle=1 → 改 Cull（随后清 0）。
  # ⚠ tick 顺序待实测：若 Parry 于 owner_turn_end 先过期则兜底落空（B19 候选——duration 1 锚同刻）
  - event: "on_turn_end"
    condition: "has_modifier($self, 'YUNLI_PARRY') >= 1 && res__slash_toggle < 1"   # 官方「至下一个任一（友方或敌方）回合结束」——draft 只判云璃回合=窗口失真（插入窗通常在别人回合）
