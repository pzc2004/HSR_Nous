eidolons:
  E1:
    name: "常世道返三途无六钱"          # 勘正①：draft「归去来兮，亡魂复返」=幻名
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_SEALFORM_DEF_PEN"
              name: "常世道返三途无六钱"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "res__sealform >= 1"   # 印结内生效（条件光环 04 §4.16；1507 Zone 闩同族先例）
              stat_effects: {"def_pen": 0.15}   # 勘正③：def_ignore 死键→def_pen（rulebook def_multi 消费；官方「乱破造成的伤害无视目标 15% 的防御」攻击侧）
      - event: "on_action"
        condition: "$event.actor == '1317' && $event.action_id == '131718' && !$event.insert && res_chroma_ink - 1 <= 0"
        effects:
          - effect_type: "gain_energy"   # 退出印结恢复 20 能量（勘正② gain_resource energy 编译闸必炸）
            target: "self"
            amount: 20
    notes:
      - "退出印结事件通道（on_sealform_exit 类）不在契约表——以彩墨耗尽钩等价承载（快照判退补偿 -1）；若官方实为『任何退出途径』需补钩（待实测⑥）"
  E2:
    name: "俳句暗记有识无挂碍"          # 勘正①：draft「自在兮，心猿得解」=幻名
    hooks: []
    notes:
      - "待收③：强化普攻前 2 段攻击对指定敌方单体的削韧值提高 50%——星魂条件的段级削韧覆写通道缺；官方文本在案（仅前 2 段、仅指定那名敌人不含相邻；加算/乘算待实测⑩）"
  E3:
    name: "堂塔伽蓝末法无间狱"          # 勘正①：draft「万神龛前，香火长明」=幻名
    skill_level_overrides: {"skill": 2, "talent": 2}
    notes:
      - "战技+2：131702 实取 lv12 档（1.32）；天赋+2：131704 实取 lv12 行 [10,0,0.66,2,0.55,1]（天赋追加段待收①，档位随档在案）"
  E4:
    name: "经年劣化任侠无忍义"          # 勘正①：draft「失道兮，忍道不孤」=幻名
    hooks:
      - event: "on_ultimate"
        condition: "$event.source == '1317' && $event.action == '131703'"
        effects:
          - effect_type: "apply_modifier"
            target: "all_allies"        # 我方全体（含自身——_allies_alive 口径，勘正⑮ 附销待实测⑨）
            modifier:
              modifier_id: "E4_SEALFORM_SPD"
              name: "经年劣化任侠无忍义"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"spd_pct": 0.12}
      - event: "on_action"
        condition: "$event.actor == '1317' && $event.action_id == '131718' && !$event.insert && res_chroma_ink - 1 <= 0"
        effects:
          - effect_type: "remove_modifier"
            target: "all_allies"        # 勘正⑮：draft 缺省 self——队友件永久残留
            modifier_id: "E4_SEALFORM_SPD"
  E5:
    name: "一心不乱鸣弦无徒矢"          # 勘正①：draft「稳行兮，巡 ranger 不辍」=幻名（内嵌英文垃圾串实证）
    skill_level_overrides: {"ultimate": 2, "basic": 1}
    notes:
      - "终结技+2：131703 实取 lv12 行 [0.5,0.34,3]——印结 BE 增益 0.34 随档（param(131703,2)）；WBE 0.5 与彩墨 3 全档恒值"
      - "普攻+1：基档 6+1=lv7，10 档表第 7 行实取（131701=1.1、131718=[1.08,0.54,1.08,0.5]）——勘正⑯：draft「无第 11 档可取」笔记错（官方上限 10 级=编译器 basic cap 同值，无钳尾）"
  E6:
    name: "破邪显正应报无慈悲"          # 勘正①：draft「正气兮，怒目金刚」=幻名
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "gain_resource"   # 战斗开始获得 5 点充能
            resource_id: "talent_stacks"
            amount: 5
          - effect_type: "apply_modifier"  # 充能上限 10→15（勘正⑰：max_override 通道，16 §16.12）
            target: "self"
            modifier:
              modifier_id: "E6_CHARGE_CAP"
              name: "破邪显正应报无慈悲"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              target_resource: "talent_stacks"
              max_override: 15
      - event: "on_action"
        condition: "$event.actor == '1317' && $event.action_id == '131718' && !$event.insert"
        effects:
          - effect_type: "gain_resource"   # 发动第 3 段攻击后获得 5 点充能（勘正⑱：整次粒度≡第 3 段完成后）
            resource_id: "talent_stacks"
            amount: 5
    notes:
      - "上限 15 时天赋追加段理论峰值（lv12）= 60%+15×55%=885% 虚数击破伤害、削韧 2+15=17 点——随追加段待收①在案"

hooks:

  # 终结技入印结：闩 + 彩墨 3 点（param#3）+ WBE/BE 增益（param#1/#2 烘焙——随 E5 档）
  # + 额外回合（勘正⑨ grant_extra_turn——draft advance_action 100=拉条非额外回合）
  - event: "on_ultimate"
    condition: "$event.source == '1317' && $event.action == '131703'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_sealform"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "chroma_ink"
        amount: "param(131703, 3)"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "RAPPA_SEALFORM"
          name: "印结"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects:
            weakness_break_efficiency_boost: "param(131703, 1)"   # param 编译期取档→float 主通道（纯字面量无烘焙告警）
            break_effect: "param(131703, 2)"
      - effect_type: "grant_extra_turn"
        target: "self"

  # 强化普攻逐次消耗彩墨 1 点（官方 "After using Enhanced Basic ATK, consumes 1 point"）
  - event: "on_action"
    condition: "$event.actor == '1317' && $event.action_id == '131718' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "chroma_ink"
        amount: -1

  # 彩墨耗尽退出印结（快照判退补偿 -1：同事件多钩 condition 读事件开始旧值——
  # 幻视族谱 #9；本钩与消耗钩同事件快照，-1 后 = 消耗后落点）
  - event: "on_action"
    condition: "$event.actor == '1317' && $event.action_id == '131718' && !$event.insert && res_chroma_ink - 1 <= 0"
    effects:
      - effect_type: "set_resource"
        resource_id: "_sealform"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "chroma_ink"
        amount: 0
      - effect_type: "remove_modifier"
        modifier_id: "RAPPA_SEALFORM"

  # 天赋 131704：敌方目标被弱点击破 → 充能 +1（勘正⑪：on_break 在契约表——
  # 1225 忘归人「无击破事件挡因过期」同案；无 source 限制按官方文本）
  - event: "on_break"
    effects:
      - effect_type: "gain_resource"
        resource_id: "talent_stacks"
        amount: 1

  # 大行迹 1317101（忍法帖•魔天）：精英及以上敌被击破 → 额外充能 +1 + 回能 10
  #（params [10,1] 字面化——行迹无等级轨道；精英档=engine 怪物一律精英档 convention）
  - event: "on_break"
    effects:
      - effect_type: "gain_resource"
        resource_id: "talent_stacks"
        amount: 1
      - effect_type: "gain_energy"
        target: "self"
        amount: 10

  # 大行迹 1317103（忍法帖•枯叶）：敌被击破 → 挂击破承伤 debuff 2 回合——
  # 值=2%+min(8%,(atk-2400)//100×1%)（params [0.02,2400,0.01,0.08,2] 字面化）；
  # 蒙福者烘焙（挂点 $self=乱破现场有效 ATK；stack_mode replace 重挂重烘）；
  # 1222 灵砂 BEFOG 族 scoped 通道（hit_condition 限定击破族——直击不吃）
  - event: "on_break"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "RAPPA_WITHERED_LEAF"
          name: "忍法帖•枯叶"
          modifier_type: "debuff"
          duration: 2
          stack_mode: "replace"
          dispellable: True             # 待实测⑦（官方未标不可解除——保守）
          hit_condition: "$event.action_type == 'break' or $event.action_type == 'super_break'"
          stat_effects:
            vulnerability: "0.02 + min(0.08, max(0, $self.atk - 2400) // 100 * 0.01)"

  # 大行迹 1317102（忍法帖•海鸣）：印结内超击破转化 60%（params [[0.6]] 字面化——
  # 勘正⑭ B38 super_break_modifier 池；印结闩条件光环等价官方语义域）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "RAPPA_OCEAN_CHANT"
          name: "忍法帖•海鸣"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "res__sealform >= 1"
          stat_effects: {"super_break_modifier": 0.6}

scaling_notes:
  - "印结状态机已收：_sealform 闩 + available_if 互斥（131701/131702/131703 `res__sealform < 1` ↔ 131718 `>= 1`）——纯合法性替换非形态机（state_config entry=变身语义会误 end_current_turn+倒计时，乱破不适用）"
  - "SP 轴（tbgd+EN 双证）：普攻 +1 / 战技 -1 / 强化普攻 0 产 0 耗——印结全程 SP 净产出 0"
  - "能量轴（tbgd 权威）：普攻 20 / 战技 30 / 终结技后 5 / 强化普攻行动级 20（分段条目 131708/131710/131712 能量 5/5/10 合计——mechanics 05 §5.1 行动级结算一次）/ 行迹一击破 +10 / E1 退出印结 +20 / 秘技入战 +10；上限 140"
  - "131708/131710/131712（强化普攻分段条目，Basic 类）与 131714–131717（无名条目，Ultimate 类，能量 5/5/10/10）：官方无 desc/params 的引擎管路条目——不赋倍率不入 actions（勘正⑥：draft 占位登记=散装零成本后门全摘除）；分段机制已并入 131718 instances，分段能量已并入行动级 20"
  - "131706（攻击，战斗外开怪条目，无 params、SP/能量全 0）：通用开怪削韧，不入 actions"
  - "削韧（tbgd 权威，勘正⑧）：普攻 10 / 战技群 10 / 强化普攻主 10+邻 5+群 5 / 秘技 30 无视弱点；131718 复合显示主 25 邻 15=三段合计对账闭环；非虚数弱点 50% 效力削韧（param#4 全档恒 0.5）通道缺→待收④（缺省 own_element 低估 0% 保守，不写 all 高估 100%）"
  - "WBE 双池口径：印结 WBE +50% 走 weakness_break_efficiency_boost（池 2——rulebook toughness_damage (1+a)(1+b) 双池乘算；强化普攻主目标削韧 10→15 实证）"
  - "待实测清单：⑤ 印结内控制模型（自动施放分歧）；⑥ 彩墨/充能跨战斗保留、退出时点；⑦ 枯叶可驱散性；⑧ 枯叶对超击破归属；⑨（已销——all_allies 含自身）；⑩ E2 加/乘算、行迹一精英档实证；⑪ 站位"
