# 角色模板：乱破（1317）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 版本单轨：1317 不在 3.x 官方加强名单（1004/1005/1006/1102/1205/1212/1217/
# 1306/1307/1310），星魂无新旧两轨问题（B39③ 审计过）。
#
# 出处：打标 DAG 产物（staging `data/annotator/staging/1317_乱破.yaml`）+ 过堂勘正
# （staging→fixtures 合并流水线）。数值源：技能/星魂/行迹文本与 params 全表照
# StarRailRes（query-game-data）；削韧/回能/SP 五项 tbgd AvatarSkillConfig 权威
# 对轴（draft 削韧全表缺省=漏拉 tbgd，本次补落）。
#
# 过堂勘正十八件：
#   ① 星魂幻名 ×6（幻视族谱 #2 实证）——E1-E6 全幻（E5 名内嵌英文 "ranger"
#     垃圾串），按 character_ranks.json 官方名全替换：常世道返三途无六钱 /
#     俳句暗记有识无挂碍 / 堂塔伽蓝末法无间狱 / 经年劣化任侠无忍义 /
#     一心不乱鸣弦无徒矢 / 破邪显正应报无慈悲；行迹幻名 ×2 同案替换
#     （云汉→忍法帖•魔天、水音→忍法帖•海鸣）。
#   ② gain_resource energy ×2（编译闸必炸——"energy 是内建资源"硬闸，
#     1210 桂乃芬实证族）：秘技回能 10 + E1 退出回能 20 → gain_energy。
#   ③ E1 def_ignore 死键（全代码库 0 消费端——静默死件）→ def_pen 0.15
#     （rulebook def_multi 消费，01_formula §4 spec 钉死：def_pen=无视防御%
#     +防御降低%；攻击侧挂自身，官方「乱破造成的伤害」语义域吻合）。流萤
#     1310/镜流 1212 fixtures「def_pen 键缺」挡因为过期口径，本模板实证键在库。
#   ④ 秘技伤害段 param 含义错读：官方 #2/#3=「虚数击破伤害的 200%/180%」
#     （Break DMG——非 2.0/1.8×ATK 直伤！draft 直伤建模=脑补数值）——击破
#     伤害 hook 通道缺 → 两段摘除记待收；#5=30 无视弱点削韧（官方文本+tbgd
#     ShowStance [90,0,0] 双证）以 toughness-only deal_damage（amount 0）承载。
#   ⑤ 131703 印结内未禁终结技（官方 EN "Skill and Ultimate cannot be used"
#     ——draft 自己 trace_notes 引用此句却漏挂闸=免费再开大刷新彩墨后门）
#     → available_if "res__sealform < 1"（终结技同吃行动级可用条件，
#     engine._fire_ultimate 窗口口径）。
#   ⑥ 散装零成本 action ×7（幻视族谱 #15 实证）：131708/131710/131712
#     （0 产 0 耗占位 Basic，印结内进合法集可被 policy 选中白拿 5/5/10 能）
#     + 131714-131717（无名 Ultimate 类 0 费 5/5/10/10 能——energy_cost 缺省
#     =终结技 ready 清单常驻免费能量后门）→ 全摘除，登记入 scaling_notes；
#     分段能量 5+5+10 已并入 131718 行动级 energy_gain 20（mechanics 05
#     §5.1 行动级结算一次口径）。
#   ⑦ 131718 三段全收编（B35 族 instances 通道）：draft「第 2 段待收（hook
#     目标代数无当前主目标）+ 第 3 段散装 all_enemies hook」→ instances 3 +
#     instance_variants（段 1/2 blast 主 param#1 邻 param#2，段 3 变体 aoe
#     param#3）——三段伤害/削韧全落，hook 段全撤。
#   ⑧ 削韧全表落值（幻视族谱 #14——tbgd 权威，draft「fandom 空全表缺省」
#     =漏源）：普攻 10 / 战技群 10 / 强化普攻主 10+邻 5+群 5（ShowStance
#     [30,0,15]/[0,15,0]÷3；131718 复合显示主 25 邻 15 对账闭环）/ 秘技 30。
#   ⑨ advance_action 100 → grant_extra_turn（官方 "immediately gains 1
#     extra turn"=额外回合非拉条——希儿再现/流萤/青雀先例原语在库）。
#   ⑩ 行迹平铺节点全收（官方 character_skill_trees properties 在案，draft
#     「未随证据提供」挡因过期）：SpeedDelta 2+3+4=+9 平铺入 base_stats.spd
#     （96→105，1303 阮•梅先例）；ATK% 4/4/6/6/8=0.28 + 击破特攻 5.3%/8%
#     =0.133 入 trace_stat_effects（百分比节点通道，1105/1225 先例）。
#   ⑪ 天赋充能获取挡因过期（on_break 在总线契约表——1225 忘归人 A1/A4
#     「无击破事件挡因过期」同案）→ 收编：敌被击破 → 充能 +1。
#   ⑫ 行迹一（魔天）同案收编：敌被击破 → 充能 +1 + 回能 10（params [10,1]
#     字面化——行迹无等级轨道）；「精英级别及以上」按引擎怪物一律精英档
#     既有 convention 承载（pipeline bleed_coeff 同口径注释在案）。
#   ⑬ 行迹三（枯叶）同案收编：on_break → 目标挂击破承伤 debuff（1222 灵砂
#     BEFOG 族：vulnerability + hit_condition "$event.action_type == 'break'
#     or 'super_break'"——超击破属击破伤害族、super_break 公式链同读
#     vuln scoped 通道，归属待实测 ⑧）；值=2%+min(8%,(atk-2400)//100×1%)
#     蒙福者烘焙（$self=乱破现场有效 ATK，挂点快照；stack_mode replace 重
#     挂重烘——每次击破按当前 ATK 重判）；duration 2、dispellable True 待实测。
#   ⑭ 行迹二（海鸣）挡因过期（B38 super_break_modifier 转换倍率池在库，
#     pipeline 注释明写「忘归人 E4/乱破族」）→ 收编：modifier
#     {super_break_modifier: 0.6} + enable_if 印结闩（印结内她只有强化普攻
#     出伤，闸等价官方「印结内强化普攻对击破敌转化」；EN "converts" 对已破
#     目标本无实际削韧，转化≡追加同值）。
#   ⑮ E4 解除钩目标域错（全队速度 buff 用 remove_modifier 缺省 self 摘——
#     队友件永久残留）→ target: "all_allies"（含自身，_allies_alive 口径，
#     待实测⑨「all allies 是否含自身」随销——含）。
#   ⑯ E5 普攻+1 笔记错（「无第 11 档可取」——普攻基档 6+1=lv7，10 档表
#     第 7 行实取 131701=1.1 / 131718=[1.08,0.54,1.08,0.5]；官方「最多不超
#     过10级」=编译器 basic cap 10 同值，无钳尾）。
#   ⑰ talent_stacks max 15 常驻 → 10（param(131704,1) 全档恒 10）；E6
#     上限 +5 改走 modifier max_override 通道（16 §16.12 在库——E0-E5
#     不再虚高上限）。
#   ⑱ E6「第 3 段后再获 5 层」挡因过期（段已随 instances 收编进行动——
#     on_action 整次粒度≡第 3 段完成后，段中断差异可忽略）→ 收编。
#   ⑲ 官方名间隔号 ·（U+00B7）→ •（U+2022）×5（忍术•七转八起/忍切•初志
#     贯彻/忍道•极•爱死天流/忍具•降魔花弁/忍步•血义理——命名两态原则）。
#
# 收录：印结状态机（终极技 131703：_sealform 闩 + 彩墨 3 点计数 + WBE 50%/
#       BE 30%（lv10，param 取档随 E5）+ grant_extra_turn 额外回合；普攻/战技/
#       终结技印结内禁用 ↔ 强化普攻 131718 唯一可用（available_if 互斥，
#       03_actor §3.8.1）/ 彩墨逐次消耗（on_action 快照判退补偿 -1，幻视族谱
#       #9 口径实证）耗尽退出印结（摘增益+E4 全队速度+E1 回能 20）/
#       131718 instances 3 分段（段 1/2 blast+段 3 aoe）/ 天赋充能（on_break
#       +1，上限 10）/ 行迹魔天（击破再 +1 充能+回 10 能）/ 海鸣（印结内 60%
#       超击破转化）/ 枯叶（击破承伤 2%+ATK 条件至多 8%，2 回合）/ SP 轴
#       （普攻 +1、战技 -1、强化普攻 0 产 0 耗——EN "will not recover Skill
#       Points"+tbgd 双证）/ 能量轴（普攻 20/战技 30/终结技后 5/强化普攻行动
#       级 20/E1 退出 20/行迹一击破 10/秘技入战 10；上限 140）/ E1（印结内
#       def_pen 15%+退出回能 20）/ E3/E5 等级族（E3 战技/天赋+2、E5 终结技
#       +2 普攻+1）/ E4（印结内全队速度+12%）/ E6（开战 +5 充能、上限
#       10→15 max_override、第 3 段后再 +5 充能）
# 待收（均带挡因）：
#   ① 天赋追加段（131718 第 3 段命中时追加虚数击破伤害=60%+层数×50%
#     （param#3/#5）、无视弱点削韧 2+层数×1（param#4/#6）、消耗全部充能）
#     ——挡因：击破伤害 hook 通道缺（deal_damage 无 break 类、pipeline.
#     break_damage 未暴露 hook 面）；消耗全部充能随段整体待收（只建消耗=
#     充能白丢）。E6 上限 15 时理论峰值 lv12：60%+15×55%=885% 击破伤害、
#     削韧 2+15=17——数值在案。
#   ② 秘技 200%/180% 虚数击破伤害两段（#2/#3）——同①通道缺。
#   ③ E2（强化普攻前 2 段对指定敌方单体削韧+50%）——挡因：星魂条件的
#     段级削韧覆写通道缺（instance_variants 静态编译、星魂 overrides 只及
#     形态机；主目标段削韧 10→15 数值在案）。
#   ④ 非虚数弱点 50% 效力削韧（131718 param#4=0.5 全档恒值）——挡因：
#     toughness_scope 二值（own_element/all）无半效力槽；写 all=对非弱点
#     高估 100%、缺省=低估 0%——保守缺省+在案，不脑补。
#   ⑤ 印结内强化普攻是否强制自动施放（控制模型——官方仅 "Skill/Ultimate
#     不可用"，LootBar "automatically unleash" 分歧）→ 待实测。
#   ⑥ 彩墨/充能跨战斗保留、印结退出瞬间增益失效时点 → 待实测。
#   ⑦ 行迹三 debuff 可驱散性（现按 dispellable True 保守）→ 待实测。
#   ⑧ 行迹三对超击破生效归属（「受到的击破伤害提高」——引擎口径超击破
#     属击破伤害族、scoped 双匹配收录；游戏实证待实测）。
#   ⑨ 虚韧性条场景 on_break 每条都发（天赋/行迹一/行迹三在虚条破时多触发
#     ——is_state_break 载荷字段缺；无虚条环境=官方语义）→ 待实测+通道候选。
#   ⑩ E2 削韧加算/乘算、行迹一精英判定与 engine 精英档 convention 的游戏
#     实证 → 待实测。
#   ⑪ 站位：官方/wiki/社区均无——待实测（不脑补）。
