# 角色模板：娜塔莎（1105）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂收编/勘正五件：① 战技 target_type "single"→"ally_single"（敌方池
#   挂错会打敌人——布洛妮娅 1101 同案）。
#   ② 战技治疗/挂 HoT/驱散目标 最低血占位→$event.target（on_action 载荷
#   在册——1001/1005/1013 全链实证，draft 误判"载荷未登记"占位与官方
#   "指定队友"语义不符）。
#   ③ outgoing_heal 死键勘正→heal_bonus（heal 公式只读 heal_bonus 施放者
#   /incoming_heal 受疗者——draft 的医者行迹与天赋键名全部无消费端）。
#   ④ 天赋生机焕发正主收编——hit_condition 治疗命中域 scoped 件
#   （$event.target_hp_ratio≤0.3 + heal_bonus，1409 阴云莞尔族先例）；
#   draft 用 on_hp_increase 后授 buff=触发当次不吃+后续误吃，语义不符摘除。
#   ⑤ E6 追加段目标 最低血占位→$event.target（官方"与普攻同目标"）。
#
# 收录：普攻 / 战技（指定友方治疗 7% Max+280 + HoT 3 回合 4.8% Max+192
#       + 驱散 1 负面 LIFO）/ 终结技（全体治疗 9.2% Max+368）/
#       天赋生机焕发（治疗≤30% 友方时 heal_bonus +50% 命中域门控）/
#       行迹舒缓（战技驱散）/ 医者（heal_bonus +10%）/ 调理（HoT 3 回合）/
#       E1 受击低血自疗 / E2 大招低血队友附加 HoT / E3/E5 等级族 /
#       E4 受击回能 5 / E6 普攻同目标追加 40% Max 物伤
# 待收（均带挡因）：秘技挥击段削韧（社区双源冲突）/ 多 debuff 移除优先级
#       （官方未给）/ E1/E2 flat 成长性（官方单值）/ 治疗暴击交互（文档外）
