  - "大行迹 1105101「Soothe 舒缓」已收（战技对指定队友驱散 1 个 debuff——EN \"using Skill\" ⇒ 仅战技触发、终结技不触发；见 skill hook remove_modifier）；多 debuff 时移除优先级官方未给 → 待实测"
  - "大行迹 1105102「Healer 医者」已收（治疗量 +10%——heal_bonus 键名勘正：draft 写 outgoing_heal=无消费端死键，heal 公式只读 heal_bonus（施放者）/incoming_heal（受疗者）——trace_stat_effects 通道）"
  - "天赋 110504「生机焕发」过堂正主：hit_condition 治疗命中域 scoped 件（$event.target_hp_ratio≤0.3 + heal_bonus——1409 阴云莞尔族先例；draft 用 on_hp_increase 后授 buff=触发当次不吃+后续误吃，语义不符摘除）"
  - "大行迹 1105103「Recuperation 调理」已收（战技 HoT 持续时间 2→3 回合——HoT duration 字面值 3 已含此件）"
  - "天赋 110504「生机焕发」判定时点以 hit_condition 命中域承载（受疗者治疗前 HP 比——pipeline 治疗命中域注入口径）；HoT 逐跳同走 heal 公式故逐跳独立判定（与官方'continuous healing also works'同向）"
