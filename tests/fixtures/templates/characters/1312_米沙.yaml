  E4:
    name: "亲挚的音容"   # 终结技每段攻击的伤害倍率提高 6%（字面值无等级轨道）
    hooks:
      # 段倍率加件宿主资源置档（+0.06 加算于 param(131203,2)——官方「倍率提高6%」加法门径，
      # lv10 段=0.60+0.06=0.66）；主干段 amount 读 res__ult_hit_dmg_bonus（未激活恒 0）
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_ult_hit_dmg_bonus"
            amount: 0.06
  E5:
    name: "最初的爱与友谊"
    skill_level_overrides: {"skill": 2, "talent": 2}     # 战技+2（上限15）、天赋+2（上限15）
    notes:
      - "战技+2 随档：主/邻倍率 scaling 实取 lv12 档（2.2/0.88）；天赋+2 随档：每耗 1 点回能 param(131204,1) lv12=2.2（加段 #2 全档恒 1）"
  E6:
    name: "久已生疏的憧憬"   # 施放终结技时，自身伤害 +30% 持续至自身回合结束，且下一次施放战技后为我方恢复 1 个战技点
    hooks:
      # 增伤挂 on_action（发射序先于段族 on_ultimate——头注④）：覆盖本次大招各段与
      # 后续战技/冻结附伤；duration 1 @ owner_turn_end=「持续至自身回合结束」
      - event: "on_action"
        condition: "$event.actor == '1312' && $event.action_id == '131203' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "S6_DMG_BOOST"
