# 角色模板：米沙（1312）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging 1312_米沙.yaml）+ 过堂勘正（staging→fixtures 合并
# 流水线）；证据笔记 data/annotator/notes/1312.md；非加强名单角色（无双轨问题）。
#
# 过堂收编/勘正十三件：
#   ① 段门控快照死链（幻视族谱 #9）——draft 段/冻结/E2 门控读 `res__ult_hits >= N`，
#     而 _ult_hits 由**同事件**（on_action 131203）首钩 set_resource 写入；§23 快照分发
#     （hooks.py _run_event_hooks_snapshot）下同事件多钩 condition 一律读**事件开始
#     前旧值**——首发大招 0>=N 全假=零伤害，次发起读上一发残值。勘正：门控内联现场
#     可算式 min(param(131203,1)+res__ult_bonus+E1 件, param(131203,5)) >= N
#     （_ult_bonus 施放前已累计，快照读数正确），_ult_hits 资源整只摘除。
#   ② mechanic_chance 双参死钩（幻视族谱 #4 同族）——draft 全族写
#     mechanic_chance(p, 0.6)（A4 效果命中当第二参）；本函数只收单参 float(p)
#     （1004 瓦尔特/1104 杰帕德先例），双参 TypeError → 条件求值失败按不触发吞 ⚠
#     =冻结/E2 全族恒不触发。勘正：A4 +60% 按行迹字面值乘入概率表达式（×(1+0.6)）。
#   ③ count('enemies') 误用——count() 只收列表（缇宝 hit_targets 族），传字符串按
#     len() 恒得 7 → min(7,5)=5 恒真（2 敌场景也按 5 敌计）。正解 enemies_alive()
#     （§22.4 登记函数）。
#   ④ 段载体事件移位 on_action→on_ultimate——draft 段钩/冻结钩/E2 钩与 E6 增伤钩同
#     挂 on_action，星魂钩注册序在主干钩后（编译序：主干 hooks 先于 eidolons 块），
#     快照分发下同帧后挂 → 当次大招各段吃不到 E6 +30%。_fire_ultimate 发射序 = 先
#     on_action 后 on_ultimate（B37，engine.py:1602-1608）：段族全迁 on_ultimate
#     （1104 护盾同通道），E6 挂 on_action → 覆盖本次大招，对齐官方「施放终结技时，
#     使自身造成的伤害提高 30%」。
#   ⑤ 首段指定目标语义回收——draft 载体 target_type self 丢指定目标（$event.target=
#     米沙自己）。载体改 target_type single（无 scaling 不跳伤——1104 终结技同构），
#     首段伤害/冻结/E2 打 $event.target，其余段 mode random（B22 确定化按序取首）。
#   ⑥ 星魂名语言轨——draft 用 EN 官方名（与 character_ranks en 一致，非幻名）；
#     fixtures 库走中文显示名轨，勘回官方 CN：飘忽的幻影/青春的怅望/欢乐年光的影子/
#     亲挚的音容/最初的爱与友谊/久已生疏的憧憬。
#   ⑦ E6② SP 回复挡因过期——draft 记「战技点增益 effect 通道未登记」待收；
#     gain_skill_point 原语在库（1015 Archer 先例），收编为 _e6_sp_armed 闩：
#     下次施放战技后 +1 SP、闩落（gain 非消耗，不触发天赋计数——在案）。
#   ⑧ 天赋自耗计数矛盾注记勘正——draft 两注互斥（「按 EN 纪律不自计」↔ 钩实按全量
#     计数）。终审=CN「我方全体每消耗1个战技点」（EN "allies" 非 "other allies"；
#     StarGuide「+2 from Skill text and Talent self-trigger」社区佐证在案）：
#     米沙自耗计入，钩维持全量消耗计数，注记统一。
#   ⑨ 天赋段数缺乘档——draft _ult_bonus 增量直写 SP 差值（=×1 恒等但语义错位）；
#     补乘 param(131204, 2)（全档恒 1，对齐官方 #2[i] 占位）。
#   ⑩ E2 减防叠层闸——同名 refresh 缺省 stacks 累进（层数不进 stat 值，仅计数不洁）；
#     补 max_stack 1（单次 -16% 不叠层、重挂刷时长；叠层规则官方未明，保守不叠+
#     待实测）。
#   ⑪ 行迹白值节点收编——trace_stat_effects 空 → 按官方节点汇总 dmg_ice 0.224（4
#     节点）/ def_pct 0.225（3 节点）/ crit_rate 0.067（2 节点）（1313 def_pct 先例；
#     character_skill_trees.json properties 实测）。
#   ⑫ 段伤害身份声明——hook 段缺省归 follow_up（父行动不可辨）；大招段是终结技伤害
#     （吃终结技增伤/身份过滤），补 action_type: "ultimate" 声明槽（1220 飞霄终结技
#     子击先例）；冻结回合开始附伤官方「附加伤害」→ category: "additional"。
#   ⑬ 冻结/E2 概率承载——A2 首段 (param(131203,3)+0.8)×(1+0.6)、后续段
#     param(131203,3)×(1+0.6)、E2 0.24×(1+0.6)：mechanic_chance 单参表达式
#     （expected ≥0.5 生效口径——首段 1.6 恒冻结、其余段 0.32/0.384 expected 不触发；
#     目标效果抵抗未折入——1104 同近似在案）。
#
# 收录：普攻 / 战技（主 200%+邻 80% lv10 + 下次大招 +1 段）/ 终结技（载体 + 段族全
#       展开：段数 = min(3+_ult_bonus+min(敌数,5)×E1 标记, 10) 现场算，首段指定/余段
#       随机、逐段 60% lv10 冰伤 + 削韧 10/5）/ 天赋（全队耗 SP → 每点 +1 段 +2 能）
#       / 秘技进战 +2 段 / A2 首段冻结率 +80% / A4 EHR 折入概率 / 行迹白值三项
#       / E1 敌数加段（armed marker 并入段门控）/ E2 逐段 24% 减防 16% 3 回合
#       / E3/E5 等级族 / E4 段倍率 +6% / E6 增伤 30% + 下次战技回 1 点
#       / 冻结期回合开始 30% lv10 冰附加伤害
# 待收（均带挡因）：A6 冻结目标暴伤 +30%（目标依赖型 crit 通道缺——承伤三区 scoped
#       化未覆 crit 乘区，1102 E1/1004 E6 同族）/ 冻结「不能行动」控制语义
#       （control_kind 不在 spec 键表——1104 同族；MISHA_FREEZE 仅承载 debuff 标记
#       +duration 供附伤判定）/ 秘技「梦中牢笼」Dimension Effect 互斥/覆盖通道缺
#       （仅收进战 +2 段半）/ 段内「攻击前」时序（冻结/减防判定官方在每段伤害**前**，
#       本模板同帧批处理于行动末——本段不吃当段自挂减防/冻结；expected 档 E2/非首段
#       冻结恒不触发无观察差，roll 档有差在案）/ 段级目标绑定（同段伤害/冻结/减防各
#       自独立抽样——roll 档可打不同目标；expected 确定化同序取首=同目标）/ 超 10
#       截断按溢出弃置（min 钳制；官方未明弃置 vs 返还——待实测）/ 131206「攻击」
#       进战削韧值未下发 / 冻结概率未折目标效果抵抗（1104 同近似）/ 自动战斗 AI
#       阈值 / E2 可驱散性与叠层规则待实测 / S6 回 SP 是否触发天赋（gain 非消耗，
#       按不触发在案）/ E6 覆盖本段的实测终审（本模板按覆盖建模——若实测不覆盖需
#       移位回同帧，挡因=引擎快照分发约束）
