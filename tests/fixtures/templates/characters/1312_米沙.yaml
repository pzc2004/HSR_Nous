eidolons:
  E1:
    name: "飘忽的幻影"   # 施放终结技时，场上每有 1 个敌方目标，本次终结技段数额外 +1，最多 +5
    hooks:
      # armed marker（1104 E1_FREEZE_CHANCE 同族）：常驻标记挂 self，主干段门控读
      # has_modifier 并入 min(enemies_alive(), 5) 加件（E0 无件=加 0）；与天赋/战技
      # 叠加后同受 10 段硬顶（门控 min 钳制——官方「最多累计 10 段」）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_EXTRA_HITS"
              name: "飘忽的幻影"
              modifier_type: "buff"
              duration: 0
              dispellable: False
  E2:
    name: "青春的怅望"   # 终结技每段攻击前，24% 基础概率使目标防御力 -16%，持续 3 回合（字面值无等级轨道）
    hooks:
      # 逐段独立判定（与段族同门控同目标代数）；概率=0.24×(1+A4 0.6)=0.384
      #（mechanic_chance 单参——expected <0.5 不触发，roll 真掷）；max_stack 1 不叠层
      - event: "on_ultimate"
        condition: "$event.source == '1312' && $event.action == '131203' && min(param(131203, 1) + res__ult_bonus + min(enemies_alive(), 5) * min(has_modifier($self, 'E1_EXTRA_HITS'), 1), param(131203, 5)) >= 1 && mechanic_chance(0.24 * (1 + 0.6))"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "S2_DEF_DOWN"
              name: "青春的怅望"
              modifier_type: "debuff"
              duration: 3
              max_stack: 1
              dispellable: True    # 可驱散性官方未明——保守 True 待实测
              stat_effects: {"def_pct": -0.16}
      - event: "on_ultimate"
        condition: "$event.source == '1312' && $event.action == '131203' && min(param(131203, 1) + res__ult_bonus + min(enemies_alive(), 5) * min(has_modifier($self, 'E1_EXTRA_HITS'), 1), param(131203, 5)) >= 2 && mechanic_chance(0.24 * (1 + 0.6))"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "enemies", take: 1, mode: "random"}
            modifier:
              modifier_id: "S2_DEF_DOWN"
              name: "青春的怅望"
              modifier_type: "debuff"
              duration: 3
              max_stack: 1
              dispellable: True
              stat_effects: {"def_pct": -0.16}
      - event: "on_ultimate"
        condition: "$event.source == '1312' && $event.action == '131203' && min(param(131203, 1) + res__ult_bonus + min(enemies_alive(), 5) * min(has_modifier($self, 'E1_EXTRA_HITS'), 1), param(131203, 5)) >= 3 && mechanic_chance(0.24 * (1 + 0.6))"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "enemies", take: 1, mode: "random"}
            modifier:
              modifier_id: "S2_DEF_DOWN"
              name: "青春的怅望"
              modifier_type: "debuff"
              duration: 3
              max_stack: 1
              dispellable: True
              stat_effects: {"def_pct": -0.16}
      - event: "on_ultimate"
        condition: "$event.source == '1312' && $event.action == '131203' && min(param(131203, 1) + res__ult_bonus + min(enemies_alive(), 5) * min(has_modifier($self, 'E1_EXTRA_HITS'), 1), param(131203, 5)) >= 4 && mechanic_chance(0.24 * (1 + 0.6))"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "enemies", take: 1, mode: "random"}
