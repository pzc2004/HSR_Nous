        target: {pool: "enemies", take: 1, mode: "random"}
        modifier:
          modifier_id: "MISHA_FREEZE"
          name: "冻结"
          modifier_type: "debuff"
          duration: 1
          dispellable: True

  # 冻结期附加伤害：被冻结敌方每回合开始受冰属性附加伤害 = param(131203,4)×ATK
  #（lv10=0.30；官方「附加伤害」→ category additional；1104 冻结附伤同构——
  # on_turn_start 主体=$event.actor 无 target 键）
  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'MISHA_FREEZE') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "要…要迟到了！·冻结附加"
        category: "additional"
        target: "$event.actor"
        damage_type: "ice"
        amount: "param(131203, 4) * $self.atk"

scaling_notes:
  - "终结技段数动态（初始 3 + 战技/天赋/秘技/E1 累计，硬顶 10=param(131203,5) 全档恒定）：action 层 target_type single 仅作施放载体（保留首段指定目标语义，无 scaling 不跳伤），逐段伤害/冻结/削韧全部走 hooks on_ultimate 段门控（段数现场算——快照分发下读施放前 _ult_bonus 正确；draft 的 _ult_hits 同事件 set→读死链已勘正，头注①）"
  - "首段打 $event.target（指定目标），其余段目标代数 mode random（B22 确定化按序取首——expected 档同序伤害段/冻结段/E2 段同目标；roll 档各自独立抽样，段级目标绑定通道缺在案）"
  - "段内「攻击前」时序近似：官方冻结/减防判定在每段伤害前，本模板同帧批处理于行动末（快照分发约束）——本段伤害不吃当段自挂减防/冻结；expected 档非首段冻结(0.32)/E2(0.384)恒不触发无观察差，roll 档观察差在案"
  - "削韧：首段 10/其余段 5（米游社「10+5*n」；tbgd stance 30 对轴首段）；战技 20+10×2、普攻 10（米游社/tbgd 一致）"
  - "能量分槽：技能固有（普攻 20/战技 30/大招 5——tbgd 权威）与天赋（每耗 1 点 +param(131204,1)，lv10=2）互不合并；天赋计数含米沙自耗（CN 我方全体终审——draft 矛盾注记已勘正，头注⑧）"
  - "超 10 截断按溢出弃置（门控 min 钳制；官方未明弃置 vs 返还——待实测）"
  - "131206「攻击」不建 action：非战斗内技能条目（params 空、无倍率表），进战削韧值米游社未单列 → 待实测/待收（1104 同口径）"
  - "duration 一律 int 直给（冻结 1/E2 减防 3/E6 增伤 1@owner_turn_end）——param() 不入 duration 槽（1104 同口径）"
  - "mechanic_chance 概率表达式 = 基础概率 ×（1+A4 0.6）：expected ≥0.5 生效（首段冻结 1.6 恒中；其余段 0.32/E2 0.384 不触发）；目标效果抵抗未折入——1104 同近似，模板层无 EHR/RES 公式通道（hit_chance 仅 Python 侧 _apply_modifier 可达）"
