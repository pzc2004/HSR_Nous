      # 1015 先例）；闩落一次；gain 非消耗不触发天赋计数（在案）
      - event: "on_action"
        condition: "$event.actor == '1312' && $event.action_id == '131202' && !$event.insert && res__e6_sp_armed >= 1"
        effects:
          - effect_type: "gain_skill_point"
            amount: 1
          - effect_type: "set_resource"
            resource_id: "_e6_sp_armed"
            amount: 0

hooks:
  # 战技：下次终结技段数 +#3（全档恒 1，param 随档）
  - event: "on_action"
    condition: "$event.actor == '1312' && $event.action_id == '131202' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_ult_bonus"
        amount: "param(131202, 3)"

  # 天赋 131204 擒纵机构：我方全体（含米沙自耗——CN「我方全体」终审，EN "allies" 非
  # "other allies"；StarGuide 自触发社区佐证在案）每消耗 1 点战技点 → 下次大招 +#2 段
  # + 米沙回 #1 能量。on_skill_point_change 载荷 {before, after, reason}（消耗=after<before）
  - event: "on_skill_point_change"
    condition: "$event.after < $event.before"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: "param(131204, 1) * ($event.before - $event.after)"
      - effect_type: "gain_resource"
        resource_id: "_ult_bonus"
        amount: "param(131204, 2) * ($event.before - $event.after)"

  # 终结技段数复位：施放后恢复至初始状态（官方原文）——同事件快照分发下段门控已按
  # 事件前旧值判定完毕，本钩 effects 相归零安全
  - event: "on_ultimate"
    condition: "$event.source == '1312' && $event.action == '131203'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_ult_bonus"
        amount: 0

