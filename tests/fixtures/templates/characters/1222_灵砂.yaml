# 角色模板：灵砂（1222）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂勘正六件（staging+fixture 同步）：
#   ① BEFOG break_dmg_taken 死键 → vulnerability + hit_condition
#     "$event.action_type == 'break'"（「受到的击破伤害+25%」=类型限定承伤
#     ——击破结算 scoped 通道首实例；vulnerability 全域替代=直击同吃高估
#     非等价；秘技/大招两处同改）
#   ② E1 弱点击破效率 +50% 翻案收录（draft 误判无通道——
#     break_efficiency_boost 在库（承伤三区通用化③ spec 双池）；
#     官方「自身」=灵砂全部削韧，全域永续件）
#   ③ 治疗 ATK 基数通道勘正×4（战技/大招/浮元/余烬回响）——draft 把
#     ATK 比例写进 ratio 槽=**hp_scaling**（基数变灵砂 HP 1358.28：战技
#     奶实测 610 vs 应 515 失真实证）；正解表达式全展开成 flat_heal
#     （1203 罗刹先例——ratio 槽是 HP 奶专道（1211 白露族），ATK 奶族
#     全展开：param×$self.atk + flat）
#   ④ 浮元资源账挂忆师——draft gain/set _fy_count/_fy_on_field 全写浮元
#     自身=分账死挂（次数扣在浮元而灵砂账不动；消失钩 res 平铺读浮元
#     恒 0 会恒真——探针实证）；正解 target 代数指灵砂（1409 风堇账挂
#     忆师先例）+ 消失判定改跨人 resource_of('1222', '_fy_count')
#   ⑤ 白值 679.14 动态化——E4/余烬回响/E6 段 $self.atk（灵砂钩，有效
#     面板）；浮元钩 stat_of($self.summoner_id, 'atk') 跨人读召唤者
#     （1409 先例——浮元 inheritance none 不继承面板，官方基数=灵砂
#     ATK 故必须跨人；draft 硬编丢行迹/装备/buff）
#   ⑥ 余烬回响血线维持受击者单点近似——官方「我方存在 HP%≤60% 角色」
#     =任意队友血线：$team 无逐元素比值聚合、count_team 不支持条件计数
#     ——精确通道缺在案（受击者>60% 但他人≤60% 时漏触发，B27 候选）
#
# 收录：普攻肃香（回能 20+大行迹 10=30）/ 战技识烟飞彩（全体 0.8 lv10
#       +全体治疗 0.14×atk+420+召唤浮元+3 次+浮元拉条 20%）/ 终结技
#       幔亭缭霞（全体 1.5 lv10+全体治疗+BEFOG 2 回合+浮元立即行动）/
#       天赋浮元（行动：全体 0.75+随机单体 0.75 lv10+全体驱散 1+全体
#       治疗 0.12×atk+360——行动次数 5 封顶（战技 +3 溢出截断在案），归
#       0 消失）/ 大行迹朱殷焚心（BE 25% 转攻 cap 50%/10% 转治疗量 cap
#       20%——stat_exprs 动态）/ 余烬回响（受击者 ≤60% 触发浮元追击
#       不耗次数+全体驱散+治疗，2 回合冷却）/ 秘技召唤+3 次+BEFOG /
#       E1 击破效率+50%+击破降防 20% / E2 终结技全队 BE+40% 3 回合 /
#       E3/E5 等级族 / E4 浮元行动奶最低 0.4×atk / E6 浮元在场全队
#       res_pen+20%（team 辐射=敌方全抗-20% 等效压缩在案）+追加 4 段
# 待收（均带挡因）：余烬回响全队血线判定（$team 逐元素聚合缺）/
#       浮元随机单体优先韧性>0 且火弱（谓词通道缺）/ E1 降防时长（按
#       2 回合保守）/ 战技次数溢出截断 / 秘技驱散交互 / 浮元 HP 照抄
#       （无承伤交互在案）/ 行迹属性节点（未下发）/ 浮元被控/拉条交互
actor_id: "1222"
name: "灵砂"
level: 80
path: "abundance"    # 命途·丰饶（count_team 编成计数口径——官方内部类目 Priest ↔ abundance canonical）
element: "fire"     # 元素（element_of 取数源——官方数据照抄）
base_stats:
  hp: 1358.28       # 官方管线实值（社区页数值一律以此终审）
  atk: 679.14
  def: 436.59
  spd: 98
  crit_rate: 0.05
  crit_dmg: 0.5
  max_energy: 110   # 终结技能量上限 110（官方 max_sp）
trace_notes:
  - 大行迹「青烟 1222102」已收：普攻额外回复 10 能量——直接并入 122201 energy_gain 30（tbgd 20 + 10，官方同句相加）
  - 大行迹「朱殷焚心 1222101」已收（stat_exprs 被动）：击破特攻 25% 转攻击力（上限 +50%）、10% 转治疗量（上限 +20%）——转化分母（当前面板 BE 含 buff 与否）与封顶/转化叠算次序待实测
  - 大行迹「余烬回响 1222103」已收（受击者单点条件近似 + _echo_cd 2 回合冷却，见 hooks）
trace_stat_effects: {}

