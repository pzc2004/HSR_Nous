# 角色模板：花火（1306）·**加强后**（enhanced，默认真身）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 版本双轨：3.x 官方加强角色（新版 11306xx 现役；旧版 1306xx 未收——legacy 文件
# 留待需要时补，B39④ 流程）。
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
#
# 过堂收编/勘正七件：① 天赋 SP 上限+2 收编——set_sp_max 新 effect（state.
#   sp_max_override 挂点预留已久的首个实例；draft 误标 param #1——官方文本
#   上限=#3[i]）；② 终结技溢出池全链收编——gain_skill_point 增 overflow_to 键
#   （恢复超上限转记 sp_overflow 池 ≤10）+ refill_skill_point 新 effect（我方
#   回合结束 SP<上限则从记录池补足——官方「消耗记录值为我方恢复战技点直至
#   恢复至上限」；action 层 skill_point_gain: 6 摘除改 hook 通道，溢出才不丢）；
#   ③ 秘技参数同参双解勘正——#2=20 既是迷误秒数也是回能值（draft 误判
#   「占位冲突不写」——官方「并使花火恢复#2[i]点能量」同参复用），回 3 点+
#   20 能全收；④ 幻景易伤收编——SPK_VULN 蒙福者烘焙（on_skill_point_change
#   同钩重挂，stacks($self)×(4%+谜诡 6%)；谜诡到期回落窗待实测在案）；⑤ 星魂
#   版本审计（B39③）：E1/E2 draft 全按旧版建模——E1 新版=谜诡 ATK+40% + 战斗
#   开始/施放战技花火速度+15% 2 回合（旧版「谜诡持续+1」在新版文本已删——
#   不补）；E2 新版=幻景每层敌方防御-10%（def_pct 负值 1507 先例——旧版
#   「我方无视 8% 防御」联动待实测随旧版退役）；⑥ atk_pct 词表在案（夜幕
#   ATK+45%/E1 ATK+40%——draft「键待编译校验」挡因过期）；⑦ 幻景易伤键
#   vulnerability 在案（draft「易伤键缺」挡因过期——1222 BEFOG 同族）。
# 待收（均带挡因）：11306102 单回合耗 3 SP 免点（窗口计数糖 every_n/window 未接线）/
#       谜诡易伤随谜诡到期回落（无到期事件——重挂窗靠 SP 变化，回落滞后在案）/
#       E6②③ 暴伤扩散快照规则（官方未明，不脑补）/ 普攻/战技/大招削韧值
#       （fandom 全空保守 0/10）/ 谜诡 ATK+40% 与谜诡到期同步（现同 duration 3 近似）
actor_id: "1306"
name: "花火"
level: 80
path: "harmony"        # 命途（count_team 编成计数口径）
element: "quantum"     # 元素（element_of 取数源）
base_stats:
  hp: 1397.088
  atk: 523.908
  def: 485.1
  spd: 101
  crit_rate: 0.05
  crit_dmg: 0.5        # Skill 基数 = 自身暴伤（官方"花火暴击伤害的 #1% + #2%"）——无暴伤行迹节点在案，照管线值
  max_energy: 110      # 能量上限 110（wiki-mys 标签+tbgd 对轴一致）
trace_notes:
  - "11306101 Almanac（星历）两件全收：① 普攻额外回 10 能量（hooks gain_energy self）② 持 Skill 暴伤 buff 的队友每消费 SP 花火回 1 能量（on_skill_point_change 载荷无消费主体字段，消费判定走 before/after 数值差，归属主体待实测 B19 候选）"
  - "11306102 Artificial Flower（加强版）：某队友单回合消耗 >=3 SP -> 花火下次 Skill 不耗 SP——待收（单回合窗口计数通道缺：modifier 糖键 every_n/window 未接线，不写）"
  - "11306103 Nocturne（加强版）两件全收：全体 ATK +45%（on_battle_start 光环——atk_pct 在案键，draft「键待编译校验」挡因过期）+ 持 Skill 暴伤 buff 的角色全抗穿 +10%（随 Skill 挂载同 duration 口径）"
  - "1130604 天赋 param 标序勘正：上限=#3[i]（draft 误标 #1）、持续=#1[i]（draft 误标 #3）——官方文本「上限额外增加 #3[i] 点……该效果持续 #1[i] 回合」实证"
  - "入场攻击 1130606：归秘技入场钩，削韧值 fandom 空/待实测——未单列 action"
  - "站位：官方/wiki/社区均无——待实测（不脑补）"
