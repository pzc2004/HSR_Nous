# 天赋 141004 为纯机制/被动触发 → 不建 actions 条目（action_type 词表无 talent 键），落 hooks

eidolons:
  E1:
    name: "You Ask Why Hearts Cry"    # 你问我心为何悲伤
    hooks:
      # 「通过天赋使敌人陷入…时，100% 基础概率额外陷入 1 次同款可共存状态」——勘正③：
      # 1 色非 4 色；_dot_idx 快照配位（天赋施 state[k] → E1 施 state[(k+1)%4]，异色近似）
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && actor_type_of($event.target) == 'monster' && res__hy_guard == 0 && res__dot_idx == 0"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "HY_DOT_BLEED_E1"
              name: "裂伤·E1 追加实例"
              modifier_type: "debuff"
              duration: 2
              max_stack: 1
              dispellable: True
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && actor_type_of($event.target) == 'monster' && res__hy_guard == 0 && res__dot_idx == 1"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "HY_DOT_BURN_E1"
              name: "灼烧·E1 追加实例"
              modifier_type: "debuff"
              duration: 2
              max_stack: 1
              dispellable: True
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && actor_type_of($event.target) == 'monster' && res__hy_guard == 0 && res__dot_idx == 2"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "HY_DOT_SHOCK_E1"
              name: "触电·E1 追加实例"
              modifier_type: "debuff"
              duration: 2
              max_stack: 1
              dispellable: True
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && actor_type_of($event.target) == 'monster' && res__hy_guard == 0 && res__dot_idx >= 3"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "HY_DOT_WIND_E1"
              name: "风化·E1 追加实例"
              modifier_type: "debuff"
              duration: 2
              max_stack: 1
              dispellable: True
    notes:
      - "「我方目标造成的 DoT 为原值 116%」全队独立乘区——待收（「为原值 X%」= DoT 限定最终伤害族：dmg_dot_dmg_boost 是增伤区非独立乘区，DoT 限定 final 槽未开——B27#3 后仍无通道，1507 同案）"
      - "追加实例与天赋同款同倍率同持续、可共存（tick 实例计数=base+_E1 存在性和）；选色为轮转配位近似（官方随机+异色优先，待实测）"
  E2:
    name: "Tell Me Why Waves Roar High"   # 你说浪花为何喧响
    hooks:
      # 「结界持续期间，行迹【珍珠的琴弦】增伤对我方全体生效」——勘正⑦双发射点 /
      # 勘正⑧ max(0,…) 钳 / 勘正⑨ other_allies（自身已持本体不双份）；蒙福者烘焙
      # （$self=施加者 1410，挂点快照——EHR 战斗中变动重挂重算，滞后在案）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "other_allies"
            modifier:
              modifier_id: "E2_PEARL_FIDDLE"
              name: "珍珠之琴·全队"
              modifier_type: "buff"
              duration: 3
              stack_mode: "replace"
              tick_anchor: "source_turn_start"
              dispellable: False
              stat_effects:
                all_dmg: "max(0, 0.15 * min(($self.effect_hit - 0.6) / 0.1, 6))"
      - event: "on_ultimate"
        condition: "$event.source == '1410' && $event.action == '141003'"
        effects:
          - effect_type: "apply_modifier"
            target: "other_allies"
            modifier:
              modifier_id: "E2_PEARL_FIDDLE"
              name: "珍珠之琴·全队"
              modifier_type: "buff"
              duration: 3
              stack_mode: "replace"
              tick_anchor: "source_turn_start"
              dispellable: False
              stat_effects:
                all_dmg: "max(0, 0.15 * min(($self.effect_hit - 0.6) / 0.1, 6))"
  E3:
    name: "Why Do Lights Bid Goodbye"     # 可知灯火为何遗忘
    skill_level_overrides: {"ultimate": 2, "basic": 1}
    notes:
      - "终结技+2 实取 lv12 档：初始 2.16 / Zone 追加 0.88 / DEF-27%（param() 编译期随档）；普攻+1 实取 lv7 档（141001 表 10 档第 7 行=1.1）"
  E4:
    name: "Lo, How Time Flows By"         # 看呀，时间为何流淌
    hooks:
      # 「结界持续期间，敌方全体全属性抗性 -20%」——我方 res_pen 等效承载（抗性区同区
      # 相减数值等价；敌方目标侧抗性削减通道缺，等效在案）；勘正⑦双发射点
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "all_allies"
            modifier:
              modifier_id: "E4_ALL_RES_PEN"
              name: "看呀，时间为何流淌"
              modifier_type: "buff"
              duration: 3
              tick_anchor: "source_turn_start"
              dispellable: False
              stat_effects: {"res_pen": 0.2}
      - event: "on_ultimate"
        condition: "$event.source == '1410' && $event.action == '141003'"
        effects:
          - effect_type: "apply_modifier"
            target: "all_allies"
            modifier:
              modifier_id: "E4_ALL_RES_PEN"
              name: "看呀，时间为何流淌"
              modifier_type: "buff"
              duration: 3
              tick_anchor: "source_turn_start"
              dispellable: False
              stat_effects: {"res_pen": 0.2}
  E5:
    name: "In Ablution, I Hum and Sigh"   # 于梳洗中，我轻吟浅唱
    skill_level_overrides: {"skill": 2, "talent": 2}
    notes:
      - "战技+2 实取 lv12 档（1.54 / 易伤 0.22）；天赋+2 实取 lv12 档（DoT 0.275 / 裂伤帽 0.275 / 2 回合）——param() 编译期随档"
  E6:
    name: "When to Return From Where You Lie"   # 沉没的你，何日返乡
    hooks:
      # 「结界持续期间…次数上限提高至 12」——部署点置帽（基准 8 见 _zone_cap 声明，勘正①）
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_zone_cap"
            amount: 12
      - event: "on_ultimate"
        condition: "$event.source == '1410' && $event.action == '141003'"
        effects:
          - effect_type: "set_resource"
            resource_id: "_zone_cap"
            amount: 12
    notes:
      - "「伤害倍率提高 20%」加算（0.8→1.0）vs 乘算（0.8→0.96）两源未决——待实测，本版未入表达式（不脑补）"

hooks:
  # 大行迹 A「征服之剑」：开战部署等同终结技的 Zone + 部署回 1 战技点（勘正⑥）+ 计数归零
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "HYS_ZONE"
          name: "绝海回涛·Zone"
          modifier_type: "debuff"
          duration: 3                  # 141003 #2 全档常量 3
          max_stack: 1
          tick_anchor: "source_turn_start"   # 官方「海瑟音的回合开始时 -1」（勘正⑩）
          dispellable: False           # 结界=领域不可驱散（勘正⑭）；倒下即消散通道缺待实测
          stat_effects:
            def_pct: "-param(141003, 3)"     # DEF 降低（勘正⑤ def_pct 负值 1015 先例）
            atk_pct: "-param(141003, 6)"     # ATK 降低（勘正⑤ atk_pct 负值）
      - effect_type: "set_resource"
        resource_id: "_zone_trigs"
        amount: 0
      - effect_type: "gain_skill_point"
        amount: 1

  # 大行迹 C「珍珠之琴」：EHR 每超 60% 的每 10% 增伤 15% 至多 90%（勘正⑬ stat_exprs
  # 现场通道——面板读取即重估；max/min 双钳：EHR<60% 不倒扣、120% 吃满 0.9）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "HYS_PEARL_FIDDLE"
          name: "珍珠之琴"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "$self.effect_hit >= 0.6"
          stat_exprs:
            all_dmg: "max(0, 0.15 * min(($self.effect_hit - 0.6) / 0.1, 6))"

  # 141003 终结技：部署 Zone（刷新）+ 计数归零 + 部署回 1 战技点
  - event: "on_ultimate"
    condition: "$event.source == '1410' && $event.action == '141003'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_zone_trigs"
        amount: 0
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "HYS_ZONE"
          name: "绝海回涛·Zone"
          modifier_type: "debuff"
          duration: 3
          max_stack: 1
          tick_anchor: "source_turn_start"
          dispellable: False
          stat_effects:
            def_pct: "-param(141003, 3)"
            atk_pct: "-param(141003, 6)"
      - effect_type: "gain_skill_point"
        amount: 1

  # 141003 Zone 追加 DOT·发射点一：Zone 内敌方回合开始，按现存 DoT 实例数计（勘正⑪，
  # min(cap-trigs) 钳帽）——递归闩（勘正②）
  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'HYS_ZONE') >= 1 && res__zone_trigs < res__zone_cap && (has_modifier($event.actor, 'HY_DOT_WIND') + has_modifier($event.actor, 'HY_DOT_BLEED') + has_modifier($event.actor, 'HY_DOT_BURN') + has_modifier($event.actor, 'HY_DOT_SHOCK') + has_modifier($event.actor, 'HY_DOT_WIND_E1') + has_modifier($event.actor, 'HY_DOT_BLEED_E1') + has_modifier($event.actor, 'HY_DOT_BURN_E1') + has_modifier($event.actor, 'HY_DOT_SHOCK_E1')) >= 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_hy_guard"
        amount: 1
      - effect_type: "deal_damage"
        name: "绝海回涛·追加 DOT"
        target: "$event.actor"
        damage_type: "physical"
        action_type: "dot"   # DoT 路由——官方 "deals Physical DoT" 明示（dot_dmg_boost 桶消费，2026-09-22）
        amount: "param(141003, 4) * $self.atk * min(has_modifier($event.actor, 'HY_DOT_WIND') + has_modifier($event.actor, 'HY_DOT_BLEED') + has_modifier($event.actor, 'HY_DOT_BURN') + has_modifier($event.actor, 'HY_DOT_SHOCK') + has_modifier($event.actor, 'HY_DOT_WIND_E1') + has_modifier($event.actor, 'HY_DOT_BLEED_E1') + has_modifier($event.actor, 'HY_DOT_BURN_E1') + has_modifier($event.actor, 'HY_DOT_SHOCK_E1'), res__zone_cap - res__zone_trigs)"
      - effect_type: "set_resource"
        resource_id: "_hy_guard"
        amount: 0
      - effect_type: "gain_resource"
        resource_id: "_zone_trigs"
        amount: "min(has_modifier($event.actor, 'HY_DOT_WIND') + has_modifier($event.actor, 'HY_DOT_BLEED') + has_modifier($event.actor, 'HY_DOT_BURN') + has_modifier($event.actor, 'HY_DOT_SHOCK') + has_modifier($event.actor, 'HY_DOT_WIND_E1') + has_modifier($event.actor, 'HY_DOT_BLEED_E1') + has_modifier($event.actor, 'HY_DOT_BURN_E1') + has_modifier($event.actor, 'HY_DOT_SHOCK_E1'), res__zone_cap - res__zone_trigs)"

  # 141003 Zone 追加 DOT·发射点二：Zone 内敌方承受我方一次攻击后 1 发（「单次攻击后…
  # 无法重复触发」——多段命中去重通道缺，一段=一发近似在案；递归闩勘正②）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && res__hy_guard == 0 && has_modifier($event.target, 'HYS_ZONE') >= 1 && res__zone_trigs < res__zone_cap"
    effects:
      - effect_type: "set_resource"
        resource_id: "_hy_guard"
        amount: 1
      - effect_type: "deal_damage"
        name: "绝海回涛·追加 DOT"
        target: "$event.target"
        damage_type: "physical"
        action_type: "dot"   # DoT 路由——官方 "deals Physical DoT" 明示（同发射点一）
        amount: "param(141003, 4) * $self.atk"
      - effect_type: "set_resource"
        resource_id: "_hy_guard"
        amount: 0
      - effect_type: "gain_resource"
        resource_id: "_zone_trigs"
        amount: 1

  # 141002 战技：全体敌人易伤 param#3（基础概率 #2=1→100% 收录，roll 通道待实测），#4=3 回合
  - event: "on_action"
    condition: "$event.actor == '1410' && $event.action_id == '141002' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "HY_VULN"
          name: "泛音·易伤"
          modifier_type: "debuff"
          duration: 3
          max_stack: 1
          dispellable: True
          stat_effects:
            vulnerability: "param(141002, 3)"    # 勘正⑤ dmg_taken 死键→vulnerability

  # 141004 天赋：我方任意目标攻击命中敌方后，以 100% 基础概率施加 4 色 DoT 之一
  # （轮转近似——官方随机+异色优先待实测；递归闩勘正②；快照语义：四分支读事件开始旧 _dot_idx）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && actor_type_of($event.target) == 'monster' && res__hy_guard == 0 && res__dot_idx == 0"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "HY_DOT_WIND"
          name: "风化"
          modifier_type: "debuff"
          duration: 2
          max_stack: 1
          dispellable: True
      - effect_type: "gain_resource"
        resource_id: "_dot_idx"
        amount: 1
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && actor_type_of($event.target) == 'monster' && res__hy_guard == 0 && res__dot_idx == 1"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "HY_DOT_BLEED"
          name: "裂伤"
          modifier_type: "debuff"
          duration: 2
          max_stack: 1
          dispellable: True
      - effect_type: "gain_resource"
        resource_id: "_dot_idx"
        amount: 1
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && actor_type_of($event.target) == 'monster' && res__hy_guard == 0 && res__dot_idx == 2"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "HY_DOT_BURN"
          name: "灼烧"
          modifier_type: "debuff"
          duration: 2
          max_stack: 1
          dispellable: True
      - effect_type: "gain_resource"
        resource_id: "_dot_idx"
        amount: 1
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && actor_type_of($event.target) == 'monster' && res__hy_guard == 0 && res__dot_idx >= 3"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "HY_DOT_SHOCK"
          name: "触电"
          modifier_type: "debuff"
          duration: 2
          max_stack: 1
          dispellable: True
      - effect_type: "set_resource"
        resource_id: "_dot_idx"
        amount: 0

  # 141004 DoT tick：敌方回合开始结算 4 色（实例计数=base+_E1 存在性和——E1 共存实例同倍率
  # 同读；递归闩勘正②；deal_damage 直伤口径含期望暴击，官方 DoT 不暴击偏差在案 B27 同族）
  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && (has_modifier($event.actor, 'HY_DOT_WIND') + has_modifier($event.actor, 'HY_DOT_WIND_E1')) >= 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_hy_guard"
        amount: 1
      - effect_type: "deal_damage"
        name: "风化"
        target: "$event.actor"
        damage_type: "wind"
        action_type: "dot"   # DoT 路由——dot_dmg_boost 桶消费（桑博 1108 风化 tick 族同案 2026-09-22）
        amount: "param(141004, 2) * $self.atk * (has_modifier($event.actor, 'HY_DOT_WIND') + has_modifier($event.actor, 'HY_DOT_WIND_E1'))"
      - effect_type: "set_resource"
        resource_id: "_hy_guard"
        amount: 0
  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && (has_modifier($event.actor, 'HY_DOT_BURN') + has_modifier($event.actor, 'HY_DOT_BURN_E1')) >= 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_hy_guard"
        amount: 1
      - effect_type: "deal_damage"
        name: "灼烧"
        target: "$event.actor"
        damage_type: "fire"
        action_type: "dot"   # DoT 路由——dot_dmg_boost 桶消费（同上）
        amount: "param(141004, 2) * $self.atk * (has_modifier($event.actor, 'HY_DOT_BURN') + has_modifier($event.actor, 'HY_DOT_BURN_E1'))"
      - effect_type: "set_resource"
        resource_id: "_hy_guard"
        amount: 0
  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && (has_modifier($event.actor, 'HY_DOT_SHOCK') + has_modifier($event.actor, 'HY_DOT_SHOCK_E1')) >= 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_hy_guard"
        amount: 1
      - effect_type: "deal_damage"
        name: "触电"
        target: "$event.actor"
        damage_type: "thunder"
        action_type: "dot"   # DoT 路由——dot_dmg_boost 桶消费（同上）
        amount: "param(141004, 2) * $self.atk * (has_modifier($event.actor, 'HY_DOT_SHOCK') + has_modifier($event.actor, 'HY_DOT_SHOCK_E1'))"
      - effect_type: "set_resource"
        resource_id: "_hy_guard"
        amount: 0
  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && (has_modifier($event.actor, 'HY_DOT_BLEED') + has_modifier($event.actor, 'HY_DOT_BLEED_E1')) >= 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_hy_guard"
        amount: 1
      - effect_type: "deal_damage"
        name: "裂伤"
        target: "$event.actor"
        damage_type: "physical"
        action_type: "dot"   # DoT 路由——dot_dmg_boost 桶消费（同上）
        amount: "min(param(141004, 3) * max_hp_of($event.actor), param(141004, 4) * $self.atk) * (has_modifier($event.actor, 'HY_DOT_BLEED') + has_modifier($event.actor, 'HY_DOT_BLEED_E1'))"
      - effect_type: "set_resource"
        resource_id: "_hy_guard"
        amount: 0

scaling_notes:
  - "DoT/Zone 追加 DOT 为周期伤害源：不回能不削韧（deal_damage 未带 toughness_dmg/energy_gain——官方文本无据，待实测在案）；含期望暴击区为 deal_damage 承载口径偏差（全库触电同族，B27 在案）；全部 tick/Zone 追加段已声明 action_type \"dot\"（2026-09-22——dot_dmg_boost 桶消费，桑博 1108 同案）"
  - "Zone 追加 DOT 发射点一按 DoT 实例数计（官方「每承受 1 个持续伤害…触发」+社区③层 TapTap/IcyVeins 对轴）；发射点二=单次攻击 1 发（多段命中去重待实测）；两发射点共用 #5 次数帽"
  - "终结技部署序：on_ultimate 在伤害结算后广播——终结技本击吃不到『本次』部署的 Zone 减防（行迹 A 开战 Zone 在场时掩盖）；战技本击吃不到本次易伤（on_action 后挂）——前序部署窗口缺，引擎缺口在案"
  - "Zone/易伤/DoT duration 字面值=全档常量（141003 #2=3、141004 #5=2、141002 #4=3 源表无随档变动）"
  - "战技 sp_cost=1 / 普攻产 1 / 能量 20·30·5 / 削韧 10·10·20——fandom 五项与 tbgd 对轴一致（米游社五项无 1410 条目，数据源断更在案）"
