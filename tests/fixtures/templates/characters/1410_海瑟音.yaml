# 角色模板：海瑟音（1410）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging `data/annotator/staging/1410_海瑟音.yaml`）+ 过堂勘正
# （staging→fixtures 合并流水线）。官方对照：StarRailRes 技能/星魂/行迹（query-game-data
# 2026-09-15 取数）+ fandom 五项标签（能量/削韧/SP 全对轴）+ 社区③层（Zone 追加 DOT
# 触发口径、结界不可驱散两源一致）。
#
# 过堂勘正十四件：
#   ① _zone_cap 基准 8 从未赋值（decl 只有 max 12、current 默认 0——E0-E5 条件
#      `res__zone_trigs < res__zone_cap` 恒假，Zone 追加 DOT 全档静默死钩）——声明
#      `current: 8`（141003 #5 全档常量 8），E6 照旧 set 12；
#   ② 递归闩缺失——hook deal_damage 的 on_hp_decrease reason='hit' 回灌：Zone DoT
#      自链至 cap（1 次攻击连锁 8 发）、DoT 跳伤误触天赋追加施放——6 个伤害钩全配
#      `_hy_guard` set 1→deal→set 0，天赋×4/E1×4/发射点二条件加 `res__hy_guard == 0`；
#   ③ E1 一次命中施加全 4 色追加实例——官方「额外陷入**一次**…状态」=1 色——E1 四分
#      支按 `_dot_idx` 快照读数配位（同事件快照语义：天赋施 state[k]、E1 施
#      state[(k+1)%4]_E1），一次命中 2 色、异色优先为确定轮转近似在案；
#   ④ 小行迹「官方缺档」误判——官方 skill_trees 结构化 properties 实有 SPD+14 /
#      ATK+18% / EHR+10% → trace_stat_effects 全收（draft 空表+「不采社区值」挡因过期）；
#   ⑤ 死键三连：`def_shred`（编译期死键闸直炸）→`def_pct` 负值（1015 先例）；
#      `dmg_taken`→`vulnerability`（1108/1507 先例）；`atk_reduction`（无近似静默放行
#      =死件）→`atk_pct` 负值；
#   ⑥ 行迹 A②「每次部署 Zone 恢复 1 战技点」挡因过期——gain_skill_point 词表已接线
#      （花火 1130603 先例），开战/终结技两部署点各 +1 收录；
#   ⑦ E2/E4 只挂 on_ultimate——大行迹 A 开战部署 Zone 同属「结界持续期间」→ 两星魂
#      各补 on_battle_start 发射点；
#   ⑧ E2 增伤表达式无下界——EHR<60% 时烘焙出**负** all_dmg（0.1 EHR→-0.75 全队倒扣，
#      游戏无此效应）——max(0,…) 钳位（行迹 C 本体同钳）；
#   ⑨ E2 target all_allies→other_allies——海瑟音自身已持行迹 C 本体，再挂=双份（官方
#      语义=行迹效果扩散全队，自身仍一份）；
#   ⑩ Zone 走字锚 default owner_turn_end=每个敌人回合末各 -1（双敌一轮 -2 节奏全错）
#      →`tick_anchor: source_turn_start`（官方逐字「海瑟音的回合开始时 -1」，引擎已接
#      线锚）；E2/E4 buff 同锚与 Zone 节奏同步；
#   ⑪ Zone 发射点一固定 1 次→按敌方现存 DoT 实例数计（官方「每承受 1 个持续伤害…
#      触发」+社区③层对轴），amount/计数同乘实例数 + min(cap-trigs) 钳帽；
#   ⑫ 天赋条件补 `actor_type_of($event.target) == 'monster'`（击中敌方才施加）；
#      DoT/Zone/易伤件 max_stack 1（refresh 防堆叠——has_modifier 存在性计数口径）；
#   ⑬ 行迹 C 改 stat_exprs 现场通道（面板读取即重估，蒙福者烘焙迟滞消除——04 §4.16
#      条件光环），enable_if 保留作门控对应文本；
#   ⑭ Zone dispellable True→False（结界=领域场效应不可驱散，社区两源一致；海瑟音倒
#      下即消散通道缺→duration 到期近似待实测在案）。
#
# 收录：天赋 4 色 DoT 轮转施加（异色优先近似）+ 敌方回合开始跳伤（裂伤=min(20%maxHP,
#   25%ATK) 帽）/ 战技全体易伤 / 终结技 Zone（减防减攻+追加 DOT 8 次帽+初始直伤）/
#   行迹 A 开战 Zone+部署回点 / 行迹 C EHR 增伤（连续近似，分档口径待实测）/ 秘技 2 色
#   DoT / E1 追加 1 色共存实例 / E2 行迹增伤扩散全队 / E4 全队抗穿 20%（我方 res_pen
#   等效承载）/ E6 次数帽 12。
# 待收（均带挡因）：行迹 B 宴会之泡（终结技时现存 DoT 立即产生 150% 原伤害——DoT 实例
#   快照/按率结算通道缺：trigger_dot 只全结无 ratio，且现役 DoT 为 debuff+hook 承载不
#   在 native dot 注册表）/ E1 全队 DoT 116% 独立乘区（「为原值 116%」= DoT 限定最终伤害
#   族——dmg_dot_dmg_boost 是增伤区非独立乘区，DoT 限定 final 槽未开，B27#3 后仍无通道）
#   / E6 追加 DOT 倍率+20% 加/乘口径（两源未决待实测，未入表达式——不脑补）/ Zone 倒
#   下即消散（钩子通道缺，duration 近似）/ 发射点二「单次攻击后 1 次」多段命中去重
#   （on_hp_decrease 载荷无 action_id——一段=一发近似）/ 秘技 dimension（战场外不攻
#   击+跟随，pre_battle 只收进战 2 色）/ 天赋·秘技选色规则（随机+异色优先，确定轮转
#   近似）/ 基础概率命中 roll（#1/#2=1 按 100% 收录，EHR/抵抗调制通道待实测 B19）。

