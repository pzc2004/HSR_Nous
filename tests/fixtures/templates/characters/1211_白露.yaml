              duration: 2
              dispellable: True
              stat_effects: {"all_dmg": 0.1}
    notes:
      - "$event.action_id 载荷已由引擎补口落地（on_hp_increase 透传引发治疗的行动归属——战技三跳同带 121102、终结技奶带 121103、受击奶为 \"\"——E4 只认战技奶语义成立）"
  E5:
    name: "调和安命"
    skill_level_overrides: {"ultimate": 2, "basic": 1}
    notes:
      - "终结技+2：全队治疗比例/flat 与生息回合数随 param(121103, N)（实取 lv12 档 [0.144, 400.5, 2]，duration 恒=2）；普攻+1：121101 scaling 10 档上限无第 11 档——越档钳表尾+编译警告口径，action 层 scaling 实取 lv10 档"
  E6:
    name: "游仙化生"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "gain_resource"
            resource_id: "_revive_left"
            amount: 1

