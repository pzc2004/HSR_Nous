  - "战技 sp_cost=1：tbgd BPNeed 为权威；米游社 sub_tag 缺「消耗战技点」标签判为漏标（非反证）——对轴冲突处置记录在案"
  - "121102 三跳治疗递减读法：首跳 100%、第二跳 85%、第三跳 72.25%（#3=0.15 逐跳递减，官方逐跳表述与乘子等价）；跳数由 #4=2（弹跳）+ 首跳 1 = 共 3 跳"
