# 角色模板：白露（1211）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂勘正四件（staging+fixture 同步）+ 引擎补口一件：
#   ①【引擎补口】on_hp_increase 载荷 enrich——excess（溢出量=拟回−实际
#     clamp；满血溢出奶也发事件，月茧「受到治疗」解除保 actual>0 内联）+
#     action_id（引发治疗的行动归属：hook 链 payload 透传，战技多跳同带、
#     受击奶为 ""）——bus 注册表 + 23 章文档同步；现有消费者（刃 tally/万敌
#     charge/遐蝶 newbud/风堇 cumulative）全按比例读 amount，0 值无害已审计
#   ② 死键三件：dmg_reduction→dmg_dmg_reduction（1107/1206 先例——裸键无
#     消费端）/ max_hp_pct→hp_pct（pct 族词表）/ outgoing_heal→heal_bonus
#   ③ A2 溢出语义落地——$event.excess > 0（补口首个消费者）：满血被奶挂、
#     残血奶满溢出同挂（官方「治疗溢出」语义；draft 满血判定缺通道会
#     误挂残血奶满——excess 精确化）
#   ④ E4 action_id 通道落地（draft 自承「载荷字段待实测」——补口后战技
#     三跳同带 121102、终结技奶 121103、受击奶 ""——E4 只认战技奶成立）
#
# 机制联动实证（e2e 钉）：A2 挂上后治疗基数联动——全队奶按 allies 池序
#   （白露序首）先奶自己溢出触发 A2（hp_pct+10% → 1451.42），后续队友吃奶
#   按新上限（大招 ally 555.94=0.135×1451.42+360 对轴）——引擎 heal 读
#   施放者有效面板，行为自洽。
#
# 收录：普攻望闻问蹴（削韧双源缺数待收不脑补）/ 战技云吟乍涌（三跳治疗：
#       首跳指定 0.117×HP+312 lv10、随机跳 ×0.85 递减，B22 确定化）/ 终结技
#       匏蛟跃渊（全队 0.135×HP+360 lv10 + 生息施加/延长——refresh 近似在案）
#       / 天赋生息受击奶（0.054×HP+144 lv10，基础 2 次+A4=3 次计数件递减）/
#       天赋免死（队友致死 cancel+回 0.18×HP+480 lv10，每场 1 次——teammate
#       排自在案）/ A2 岐黄要论（溢出 Max HP+10% 2 回合）/ A4 生息次数 +1 /
#       A6 生息减伤 10% / 秘技进战全体生息 2 回合 / E2 终结技后 heal_bonus
#       +15% / E3/E5 等级族 / E4 战技奶目标增伤 10% 叠 3 / E6 免死 +1 次
# 待收（均带挡因）：E1 生息自然结束满血回能（modifier 到期事件通道缺——
#       on_modifier_end 不在词表，近似会误触发）/ 普攻削韧（双源缺数）/
#       生息延长精确 +1（refresh 近似）/ 免死含白露自身与否（排自保守读）/
#       行迹属性节点（未下发）/ AUTO 优先级
