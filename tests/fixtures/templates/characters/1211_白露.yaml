          modifier_type: "buff"
          stacks: 3
          max_stack: 3
          stack_mode: "refresh"
          duration: 2
          dispellable: True

actions:
  - action_id: "121101"
    name: "望 、闻、问…蹴！"
    action_type: "basic"
    target_type: "single"
    damage_type: "thunder"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    # toughness_dmg: 待收——官方未给数、fandom 行空（挡因「双源缺数」），不脑补
    skill_point_gain: 1
    energy_gain: 20

  - action_id: "121102"
    name: "云吟乍涌坠珠露"
    action_type: "skill"
    target_type: "single"
    # 无伤害段：三跳全部治疗，结算在 hooks（heal 管线 ratio=Max HP% + flat）
    skill_point_cost: 1
    energy_gain: 30

  - action_id: "121103"
    name: "匏蛟跃渊先雷音"
    action_type: "ultimate"
    target_type: "self"
    energy_cost: 100
    energy_gain: 5

hooks:
  # 121102 战技三跳治疗：首跳指定单体（#1 Max HP% + #2 flat），第 2/3 跳随机队友，
  # 每跳较上一跳 -15%（#3=0.15）；#4=2 为弹跳次数（总 3 跳）
  - event: "on_action"
    condition: "$event.actor == '1211' && $event.action_id == '121102' && !$event.insert"
    effects:
      - effect_type: "heal"
        target: "$event.target"
        ratio: "param(121102, 1)"
        amount: "param(121102, 2)"
      - effect_type: "heal"
        target: {pool: "allies", take: 1, mode: "random"}
        ratio: "param(121102, 1) * (1 - param(121102, 3))"
        amount: "param(121102, 2) * (1 - param(121102, 3))"
      - effect_type: "heal"
        target: {pool: "allies", take: 1, mode: "random"}
        ratio: "param(121102, 1) * (1 - param(121102, 3)) * (1 - param(121102, 3))"
        amount: "param(121102, 2) * (1 - param(121102, 3)) * (1 - param(121102, 3))"

  # 121103 终结技：全队治疗（#1 Max HP% + #2 flat）+ 生息施加/延长（#3=2 回合，档间恒定，
  # duration 按字面整数 2 落表；已持有者延长 1 回合——stack_mode refresh 近似，精确 extend 通道待收）
  - event: "on_ultimate"
    condition: "$event.source == '1211' && $event.action == '121103'"
    effects:
      - effect_type: "heal"
        target: "all_allies"
        ratio: "param(121103, 1)"
        amount: "param(121103, 2)"
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "INVIGORATION"
          name: "生息"
          modifier_type: "buff"
          duration: 2
          stack_mode: "refresh"
          dispellable: True
          stat_effects: {"dmg_dmg_reduction": 0.1}
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "INV_HEAL_COUNT"
          name: "生息受击奶计数"
          modifier_type: "buff"
          stacks: 3
          max_stack: 3
          stack_mode: "refresh"
          duration: 2
          dispellable: True

  # 121104 天赋·生息受击奶：持有生息的队友受击后回复 #1 Max HP% + #2 flat，
  # 每份生息基础 #5=2 次 + A4 +1 = 3 次（计数 modifier 逐次递减）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && actor_type_of($event.target) != 'monster' && has_modifier($event.target, 'INVIGORATION') >= 1 && stacks($event.target, 'INV_HEAL_COUNT') >= 1"
    effects:
      - effect_type: "heal"
        target: "$event.target"
        ratio: "param(121104, 1)"
        amount: "param(121104, 2)"
      - effect_type: "adjust_stacks"
        target: "$event.target"
        modifier_id: "INV_HEAL_COUNT"
        delta: -1

  # 121104 天赋·免死：队友受到致死一击时不吃死亡，立即回复 #3 Max HP% + #4 flat；
  # 每场 1 次（E6 +1）。EN 用 "teammate"——本版排除白露自身（待实测）
  - event: "before_take_damage"
    condition: "actor_type_of($event.target) != 'monster' && $event.target != '1211' && $event.amount >= hp_of($event.target) && res__revive_left >= 1"
    effects:
      - effect_type: "heal"
        target: "$event.target"
        ratio: "param(121104, 3)"
        amount: "param(121104, 4)"
      - effect_type: "gain_resource"
        resource_id: "_revive_left"
        amount: -1
      - effect_type: "cancel_event"

  # 免死次数初始化（每场 1 次；E6 hook 追加 +1）
  - event: "on_battle_start"
    effects:
      - effect_type: "set_resource"
        resource_id: "_revive_left"
        amount: 1

  # A2「岐黄要论」：受治疗目标高于正常 Max HP 时，其 Max HP +10%（#1）、持续 2 回合（#2）
  - event: "on_hp_increase"
    condition: "$event.reason == 'heal' && actor_type_of($event.target) != 'monster' && hp_of($event.target) >= max_hp_of($event.target) && $event.excess > 0"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "QIHUANG_MAX_HP"
          name: "岐黄要论"
          modifier_type: "buff"
          duration: 2
          dispellable: True
          stat_effects: {"hp_pct": 0.1}

eidolons:
  E1:
    name: "至仁覆育"
    notes:
      - "待收：生息自然结束时若持有者 HP 为满，则回复 8 点能量——挡因「modifier 到期事件通道缺」（on_modifier_end 不在现役事件词表；on_turn_end 无法表达到期归属，近似会误触发非自然结束/被延长情形）；$event 主体读法在案：回能主体=该队友（事件 actor=持有者），非白露"
