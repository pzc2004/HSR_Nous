# 角色模板：开拓者•欢愉（8010）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 命名消歧：开拓者按命途写全称——本文件=欢愉命途开拓者（characters.json 该 cid
# name={NICKNAME} 为玩家昵称占位，官方显示名按米游社「开拓者•欢愉」）。同人物
# 另一实体：8009（异性主角同套件，双子模板——结构与勘正口径与 8009_开拓者•欢愉
# 对齐；同族消歧先例：三月七 1001≠1224）。
#
# 出处：打标 DAG 产物（staging 8010_{NICKNAME}.yaml）+ 过堂勘正（staging→fixtures
# 合并流水线）。数据源：StarRailRes（技能/星魂/行迹文本+params 逐项对轴——15 档表
# lv10=index9 全表照抄无误读）+ fandom（普攻削韧 10/回 20/产 1 点、战技削韧 20/耗 1 点/
# 回 30、终结技能耗 160/回 5）+ 米游社开拓者笔记（削韧 10/20、能量 160 互证）+
# tbgd（SP/能量权威；欢愉技 801020 回 5）+ docs/mechanics/08_elation_system.md
# （欢愉体系规则：进战 20 点好活当赏 / 进战每欢愉角色 +1 笑点）+
# sim_schema/docs/21_elation.md（欢愉体系未实装在案——elation 面板/punchline 乘区/
# 阿哈行动条均无引擎路径）。
#
# 过堂勘正十六件：
#   ① E3 等级轨错（幻视族谱#18）——draft slo {"skill":2,"ultimate":2,"follow_up":1}
#     把天赋+2 错成终结技+2；官方 E3=战技+2/天赋+2/欢愉技+1（character_ranks.json
#     level_up_skills 实证）。draft E5 note「普攻+1 钳表尾」同错——普攻默认 lv6，
#     E5+1=lv7 实取 1.1，无越档。
#   ② 行迹白值漏收（爻光勘正①同族）——draft trace_stat_effects 只收大行迹 8010102：
#     小节点 crit_rate +12%（8010202/06/09）/crit_dmg +13.3%（8010204/08）/
#     atk_pct +28%（8010201/03/05/07/10）全漏收编。
#   ③ 欢愉度 all_dmg 占位三处摘除（不脑补铁律）——秘技 30%/20%、行迹 8010101、E2 12%：
#     elation 面板键缺（21 章未实装，爻光同案），all_dmg 实吃增伤区=虚增全队伤害的
#     假机制，一律待收不留件（爻光勘正先例：不造键不脑补）。
#   ④ chance() 非可用通道——hook 语境无 rng 注入（ExpressionError→按不触发静默），
#     且 chance(N) 语义=roll<N%（0.1=0.1% 非 10%）；秘技随机二选一正解
#     mechanic_chance(0.1)/(0.9)，随③整体待收。
#   ⑤ 欢愉技 801020 散装零成本 action（幻视族谱#15）——draft 无 available_if=免费
#     手动施放后门；正解 aha_turn 资源锚 + available_if "res_aha_turn >= 1"
#     （爻光勘正⑤先例；trigger_action 不过该闸，终结技触发路径不受影响）。
#   ⑥ deal_damage 通道错（爻光勘正⑮同族）——draft 天赋追加段/801020 九段用 amount
#     （ability_multiplier 基数直写槽——资源值即基数族）；正解 scaling_atk 倍率槽
#     （占位 ATK 基数，欢愉管线待收②）。
#   ⑦ 天赋回能/笑点钩触发域过宽——draft `$event.actor=='8010' && !$event.insert`
#     连终结技也回 10 能+3 笑点；官方「施放攻击后」，801003 是支援技非攻击。正解
#     action_type != 'ultimate'（insert 闩摘除——欢愉技同为攻击，爻光勘正③同案）。
#   ⑧ 终结技净化 filter 双错——draft `$mod.kind=='debuff' && controlled($it)`：
#     filter 语境绑 $mod 非 $it（$it 未绑必炸）、controlled() 吃 actor 非 modifier；
#     官方「解除控制类负面状态」正解 `$mod.kind == 'control'`。
#   ⑨ 好活当赏建模翻案——draft custom_resource（无时限、上限 999 脑补）：官方/§8.1
#     =持续 2 回合的层数账、多次合并 → modifier CERTIFIED_BANGER（爻光先例，refresh
#     重挂加层同语义）；动态发放走 adjust_stacks（幻视族谱#11）；801002 +20 / 终结技
#     分支 A +10 各档恒定字面（param #2/#4 全档恒 20/10）。
#   ⑩ 进战两件漏收——§8.1 进战欢愉角色 +20 好活当赏（2 回合）、§8.2 进战每欢愉角色
#     +1 笑点（count_team(path='elation') 命途计数正用，非 team_size——族谱#6）。
#   ⑪ 终结技 target_type——draft "single" 无伤害段撞编译 warn 闸（八次实证）；正解
#     ally_single（生成器同档）。
#   ⑫ 801002 削韧来源注错——draft「fandom 未给/米游社 null 保守默认」证伪：fandom
#     toughness_dmg 20 + 米游社 sub_tag 削韧 20 双源在案（tbgd stance [0,60,0] 互证）。
#   ⑬ E4/E6 时序注错——draft「当次即吃」：on_action 在行动结算后发射，欢愉技挂载
#     当次不吃、下次起吃（官方时序待实测在案）。
#   ⑭ 阿哈咬它挂账域双错——draft `action_type=='follow_up' && !$event.insert`：欢愉技
#     典型 insert（trigger_action 发射 insert=True）→ 闩反杀真实触发源；且未限我方
#     （怪物 follow_up 也挂账）。正解 actor_type_of != 'monster' + action_type ==
#     'follow_up'（含自身——爻光「我方目标含自身」同案，待实测）。
#   ⑮ trigger_action 跨 actor 死键摘除——draft 分支 A `target: "$event.target"` 无
#     消费端（trigger_action 只查 hook 持有者自身行动表，target 键静默丢弃）→ 指队友
#     开大误放 8010 自身欢愉技=假机制。正解：trigger 门 `$event.target == '8010'`
#     （指自己=官方路径），指其他欢愉队友的触发路由记待收③。
#   ⑯ draft 待收④翻案——on_ultimate 载荷 target 字段在案（engine _last_target_id）、
#     gain_resource/gain_skill_point/remove_modifier/advance_action/apply_modifier
#     跨 actor target 通道全在案——挡因过期。
#   附：星魂 E1-E6 EN 名核 character_ranks.json 全对（draft 罕见无幻名）；CN 名补注
#   （相信光的时间/名场面酝酿中……/来吧，镜头的焦点/拯救世界，无需理由/爱与勇气，
#   永不过时/银河传奇，登场！）；param 列映射与 15 档取档逐项对轴无误（族谱#1/#5 过）。
#
# 收录：普攻 801001（单体雷，产 1 点/回 20/削韧 10）/ 战技 801002（全体雷，耗 1 点/
#   回 30/削韧 20；自体好活当赏 +20——B40 条目账）/ 天赋 801004（施放攻击后回 10 能
#   +3 笑点；持好活当赏时战技追加全体雷欢愉伤害——B40 真路由）/ 终结技 801003（160
#   满能；+5 笑点/回 5 能；指定队友暴伤 +50%·3 回合+净化控制类；欢愉目标 +10 好活当赏
#   +立即代放欢愉技（固定计入 20 笑点——跨 actor 全收）；非欢愉目标行动提前 50%；
#   行迹 8010102 放大回 1 点）/ 欢愉技 801020（8 段随机 + 均摊段 ÷enemies_alive 手算
#   分母——双子原语口径差异在案；体系触发行动，合法行动集引擎排除）/ 进战两件
#   （+20 好活当赏 2 回合条目 / +1 笑点——引擎统发）/ 行迹面板（暴率 0.27/暴伤
#   0.133/ATK 0.28）/ 8010101 欢愉度 stat_exprs / 8010103 挂账清账（+2 好活当赏/层）/
#   E1 挂账（下次终结技好活当赏 +2/层至 3 层）/ E2 终结技目标欢愉度 +12%·2 回合 /
#   E4 欢愉技全体易伤 10%·2 回合 / E6 欢愉技自身暴伤 +100%·3 回合 / E3·E5 等级轨
#   （含 elation_skill 欢愉技轨）/ 秘技 801007 欢愉度随机二选一（mechanic_chance 门控）。
#
# 待收（均带挡因）：
#   ① 秘技随机二选一概率阈值——params [0.3,0.1,0.2,0.1,3] 两率同值与「小/大概率」
#     文案矛盾（#2/#4 何者为阈值待实测——现按 0.1 工作实现，expected 模式定取大概率
#     +20%）；秘技点消耗 tbgd 无记录——同类保守 1 随本项。
#   ② 801006「攻击」（接战削韧条目，tbgd stance [30,0,0]、触发通道未明）——未落
#     actions 待实测（draft 同口径）。
#   ③ 801020 削韧（fandom/米游社无条目保守 0；tbgd stance [0,60,0] 在案——stance→
#     削韧口径项目未建立，不脑补）；8 段随机可否重复命中同敌/是否含已败目标、均摊
#     分母（现 enemies_alive() 现场值——按文本字面「由敌方全体均分」）、欢愉技是否
#     计天赋「施放攻击」（现按攻击收，爻光同案）、E1 与终结技 #4=10 加算方向（现按
#     加算）、天赋 +10 回能与 tbgd 基础回能同 tick 合并口径、进战 20 好活与秘技欢愉度
#     可否驱散（现按不可/可）、笑点/好活当赏上限与衰减、「欢愉技施放前敌方目标战败
#     则改投新入场敌人」边界（旧待收③残留）均待实测。
#   ④ E4 易伤命中域（官方「敌方目标」按全体敌收——随机单敌段命中域待实测）与
#     E4/E6 当次不吃时序（on_action 结算后发射在案，勘正⑬；官方时序待实测）。
#
# B40 迁移记（2026-09-15——欢愉体系基建落地后摘待收，旧待收①②③④ 全兑现；
#   双子蓝本 8009 迁移记六条同构）：
#   ⓵ 欢愉技 801020 正身——action_type follow_up → elation_skill（枚举入闸；合法
#   行动集引擎排除手动施放，顶替旧 res_aha_turn 闩——available_if 锚+声明全摘）；
#   level_key/slo 键同名对接。随机八段 hook scaling_atk → category "elation" +
#   amount 纯倍率 + punchline_source "res_punchline"（21_elation §21.2 定槽——
#   笑点池实时值，终结技代放经 _aha_pool_override 覆写固定 20）；收尾均摊段同换
#   真路由，hook 手算分母 ÷enemies_alive() 保留（8009 用 action split:even 单承
#   ——双子原语口径差异在案待上游统一，8009 勘正⑦）。
#   ⓶ 好活当赏 modifier 层账 → 引擎原生条目列表：进战 +20 归引擎 _init_aha 统发
#   （本钩摘除防双发）；战技 +20/终结技分支 A +10/E1 兑现/行迹 8010103 清账改
#   gain_resource certified_banger（逐条目独立 2 回合计时+合并加和——官方「合并
#   计算」同语义；adjust_stacks 通道退役）；门控 has_modifier →
#   resource_of('8010','certified_banger')（同快照域——emit 快照 condition 读旧值）；
#   punchline actor 账声明退役——笑点=队伍账 eng.state.punchline 引擎原生（旧待收④
#   兑现）。
#   ⓷ 天赋追加段真路由——category "elation" + amount param(801004,3) 纯倍率 +
#   punchline_source "max($team.certified_banger)"（官方「按我方最高好活当赏值
#   计算」——$team 聚合通道 B40 补口，旧待收②兑现）。
#   ⓸ 终结技分支 A 触发全收——trigger_action caster="$event.target" + action_type
#   "elation_skill" + pool_override "param(801003, 5)"（B40 P1a 跨 actor 代放——
#   勘正⑮「跨 actor 死键摘除/仅自身路径可定」翻案，指其他欢愉队友也触发；「固定
#   计入 #5=20 笑点」结算口径=覆写锚非发放——不落 gain_resource，旧待收②③兑现）。
#   ⓹ 欢愉度三件收编（旧待收①兑现）——行迹 8010101（ATK>1000 每 200 点 +0.1%
#   上限 0.6%：常驻件 stat_exprs 现场求值）/ E2（终结技目标欢愉度 +12%·2 回合：
#   modifier stat_effects elation 通道）/ 秘技 801007（随机二选一：mechanic_chance
#   门控双钩互斥——阈值待实测按 0.1 工作实现；techniques 块复活）。
#   ⓺ E3/E5 slo 键 follow_up → elation_skill 随档（勘正①口径不变）。
