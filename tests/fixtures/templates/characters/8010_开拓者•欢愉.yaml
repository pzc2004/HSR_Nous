hooks:
  # 进战两件归引擎原生统发（B40 _init_aha：+1 笑点/名 + 20 好活当赏 2 回合
  # 条目——本钩旧 modifier 层账全摘，防双发）

  # 大行迹 8010101 快哉快哉：ATK 超 1000 后每 200 点 → 欢愉度 +0.1%，上限 +0.6%
  #（B40 ⓹ 收编——elation 面板通道；常驻件 stat_exprs 现场求值（$self.atk=无条件件
  # 面板——装备/光环全吃进；// 整除向下取整=params「每 200 点」语义）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TRACE_8010101"
          name: "快哉快哉"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            elation: "0.001 * min(6, max(0, ($self.atk - 1000) // 200))"

  # 801004 天赋·追加段：持有好活当赏时，战技对敌方全体额外造成 #3%（lv10=0.3）雷属性
  # 欢愉伤害（B40 ⓷ 真路由——category "elation" + amount 纯倍率 + punchline_source
  # "max($team.certified_banger)"（官方「按我方最高好活当赏值计算」跨 actor 最大值
  # 通道）；condition 读事件开始旧值=「持有时」施放判定族谱#9，战技本发的好活当赏不
  # 喂本发追加——文本序伤害在先获得在后一致；deal_damage 不发 on_action 无递归——族谱#12 免闩）
  - event: "on_action"
    condition: "$event.actor == '8010' && $event.action_id == '801002' && resource_of('8010', 'certified_banger') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "英雄一笑，生死难料"
        category: "elation"
        target: "all_enemies"
        damage_type: "thunder"
        amount: "param(801004, 3)"
        punchline_source: "max($team.certified_banger)"

  # 801002 战技：自身获得 #2=20 点好活当赏（EN "gains" 主语 Trailblazer 自身；
  # param(801002,2) 全档恒 20 → 字面值，族谱#11；B40 ⓶ 条目化——逐条目独立 2 回合
  # 计时+合并加和=官方「多次好活当赏笑点值合并计算」同语义）
  - event: "on_action"
    condition: "$event.actor == '8010' && $event.action_id == '801002'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "certified_banger"
        amount: 20

  # 8010103 阿哈咬它！·清账：战技施放时兑现并摘除（钩序在战技发放钩之后——condition
  # 读事件开始旧值=挂账层数不受本事件发放影响，族谱#9 两域各就其位；B40 ⓶ 条目化
  # =独立新条目，与战技本发条目各自计时，8009 同案）
  - event: "on_action"
    condition: "$event.actor == '8010' && $event.action_id == '801002' && stacks($self, 'AHA_SIC_EM_ARMED') >= 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "certified_banger"
        amount: "2 * stacks($self, 'AHA_SIC_EM_ARMED')"
      - effect_type: "remove_modifier"
        modifier_id: "AHA_SIC_EM_ARMED"

  # 801020 欢愉技·九段（B40 ⓵ 真路由——category "elation" + amount 纯倍率 +
  # punchline_source "res_punchline"（欢愉技=阿哈笑点池实时值，终结技代放经
  # pool_override 覆写固定 20——路由读锚不读本键，见 hooks 欢愉段））：#1=8 段
  # 每段随机一名敌人 #2%（expected 模式 random 确定化=按序取首敌；可否重复命中同敌/
  # 随机池是否含已败目标待实测）+ 收尾 #3% 由敌方全体均分（÷enemies_alive() 现场值
  # ——文本字面「由敌方全体均分」，均摊分母口径待实测；8009 双子为 action split:even
  # 单承，本件 hook 手算分母同数值解，原语口径差异在案待上游统一）；无 insert 闩——
  # 终结技触发（insert=True）与阿哈时刻同发射（勘正⑤注：trigger_action 自带 on_action 广播）
  - event: "on_action"
    condition: "$event.actor == '8010' && $event.action_id == '801020'"
    effects:
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        amount: "param(801020, 2)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        amount: "param(801020, 2)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        amount: "param(801020, 2)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        amount: "param(801020, 2)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        amount: "param(801020, 2)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        amount: "param(801020, 2)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        amount: "param(801020, 2)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        amount: "param(801020, 2)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
