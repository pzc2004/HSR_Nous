eidolons:
  E1:
    name: "Believe In the Light"   # CN：相信光的时间（character_ranks.json 核）
    hooks:
      # 施放战技后挂账：下次终结技使队友目标获得的好活当赏 +2，至多叠 3 层
      #（insert 闩摘除——爻光勘正③同案：复制战技是否双计待实测）
      - event: "on_action"
        condition: "$event.actor == '8010' && $event.action_id == '801002'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_CB_ARMED"
              name: "相信光的时间"
              modifier_type: "buff"
              stacks: 1
              max_stack: 3
              stack_mode: "refresh"
              duration: 0
              dispellable: False
      # 兑现：终结技分支 A 的好活当赏 +2/层（官方"increases the amount of CB gained by
      # ally targets"——仅分支 A 有发放，故门欢愉路径；与 #4=10 加算方向待实测在案；
      # B40 ⓶ 条目化——gain_resource certified_banger 逐条目独立计时，模板钩先于星魂钩
      # 发射=分支 A 条目已在不受本钩影响——两笔独立条目合并加和=官方「合并计算」同语义，
      # 8009 同案）
      - event: "on_ultimate"
        condition: "$event.source == '8010' && $event.action == '801003' && path_of($event.target) == 'elation' && stacks($self, 'E1_CB_ARMED') >= 1"
        effects:
          - effect_type: "gain_resource"
            target: "$event.target"
            resource_id: "certified_banger"
            amount: "2 * min(stacks($self, 'E1_CB_ARMED'), 3)"
      # 清账：下次终结技后摘除（本钩序在兑现钩之后——delta 先按现场层数求值，族谱#9）
      - event: "on_ultimate"
        condition: "$event.source == '8010' && $event.action == '801003' && stacks($self, 'E1_CB_ARMED') >= 1"
        effects:
          - effect_type: "remove_modifier"
            modifier_id: "E1_CB_ARMED"
  E2:
    name: "History in the Making..."   # CN：名场面酝酿中……
    hooks:
      # 终结技额外使一名指定队友欢愉度 +12%，持续 2 回合（B40 ⓹ 收编——elation 面板
      # 通道；是否与暴伤同一目标：官方 one designated ally 字面独立——待实测，
      # 同挂 $event.target 口径起步，8009 同案）
      - event: "on_ultimate"
        condition: "$event.source == '8010' && $event.action == '801003'"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "E2_ELATION"
              name: "名场面酝酿中……"
              modifier_type: "buff"
              duration: 2
              dispellable: True
              stat_effects: {"elation": 0.12}
  E3:
    name: "Into the Spotlight"   # CN：来吧，镜头的焦点
    skill_level_overrides: {"skill": 2, "talent": 2, "elation_skill": 1}   # 官方：战技+2/天赋+2/欢愉技+1（勘正①——draft 误作终结技+2；B40 ⓺ slo 键正身）
    notes:
      - "战技+2：801002 scaling 实取 lv12=0.66；天赋+2：追加段 param(801004,3) 实取 lv12=0.33；欢愉技+1：801020 各段实取 lv11（0.21/0.63）"
  E4:
    name: "Save the World. Just Because."   # CN：拯救世界，无需理由
    hooks:
      # 使用欢愉技时，敌方目标受到的伤害 +10%，持续 2 回合
      #（vulnerability 在案键——1108/1222/1502 先例，draft「键待键闸」挡因过期；
      # 命中域按全体敌收——随机段命中域待实测；on_action 结算后发射——当次不吃勘正⑬）
      - event: "on_action"
        condition: "$event.actor == '8010' && $event.action_id == '801020'"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E4_VULNERABILITY"
              name: "拯救世界，无需理由"
              modifier_type: "debuff"
              duration: 2
              dispellable: True
              stat_effects: {"vulnerability": 0.1}
  E5:
    name: "Love & Courage: Always in Style"   # CN：爱与勇气，永不过时
    skill_level_overrides: {"ultimate": 2, "basic": 1, "elation_skill": 1}   # 官方：终结技+2/普攻+1/欢愉技+1（B40 ⓺ slo 键正身）
    notes:
      - "终结技+2：暴伤 param(801003,1) 实取 lv12=0.54；普攻+1：默认 lv6 → lv7 实取 1.1（勘正①——draft「钳表尾」错）；欢愉技+1：801020 实取 lv12（0.22/0.66）"
  E6:
    name: "The Cosmic Legend Cometh!"   # CN：银河传奇，登场！
    hooks:
      # 使用欢愉技时，本单位暴击伤害 +100%，持续 3 回合
      #（on_action 结算后发射——当次欢愉技不吃、下次起吃勘正⑬；官方时序待实测）
      - event: "on_action"
        condition: "$event.actor == '8010' && $event.action_id == '801020'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_CRIT_DMG"
              name: "银河传奇，登场！"
              modifier_type: "buff"
              duration: 3
              dispellable: True
