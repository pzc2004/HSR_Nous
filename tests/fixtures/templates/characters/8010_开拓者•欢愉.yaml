        action_type: "elation_skill"

  # 801004 天赋·攻击后：回能 10 + 笑点 3（官方「施放攻击后」——801003 支援技非攻击
  # 出集勘正⑦；insert 闩不加——欢愉技同属攻击，爻光勘正③同案，待实测在案）
  - event: "on_action"
