      - effect_type: "gain_energy"
        target: "self"
        amount: "param(801004, 1)"
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: "param(801004, 2)"

  # 801003 终结技·主干：指定队友暴击伤害 +#1%（lv10=0.5），持续 3 回合（#2 恒 3 int 直给）
  # + 净化控制类 debuff（勘正⑧——$mod.kind=='control'；蒙福者烘焙：数值恒档字串
  # 烘焙无随层件，stat_effects 通道合法——族谱#10 不适用；官方无数量上限=max_count 99）
  - event: "on_ultimate"
    condition: "$event.source == '8010' && $event.action == '801003'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"      # 玩家指定队友；on_ultimate 载荷 target 在案（勘正⑯）
        modifier:
          modifier_id: "ULT_CRIT_DMG"
          name: "放心飞，开拓永相随！"
          modifier_type: "buff"
          duration: 3                # param(801003,2)=3 全档恒定，duration 为 int 直给不写 param()
          dispellable: True
          stat_effects: {"crit_dmg": "param(801003, 1)"}
      - effect_type: "remove_modifier"
        target: "$event.target"
        filter: "$mod.kind == 'control'"
        max_count: 99
        reason: "cleanse"

  # 8010102 跟你爆了：施放终结技后为我方恢复 1 战技点（gain_skill_point 词表实名；
  # 生效时序（释放即刻/结算末）待实测在案）
  - event: "on_ultimate"
    condition: "$event.source == '8010' && $event.action == '801003'"
    effects:
      - effect_type: "gain_skill_point"
        amount: 1

  # 801003 终结技·分支 A 发放（目标拥有欢愉技）：额外 +10 点好活当赏（#4 全档恒 10
  # 字面值，族谱#11；B40 ⓶ 条目化——跨 actor gain_resource 通道在案勘正⑯）；"拥有
  # 欢愉技"以 path_of=='elation' 代理（官方判据为技能持有，代理待实测——欢愉命途≡
  # 持欢愉技在案，8009 同案）
  - event: "on_ultimate"
    condition: "$event.source == '8010' && $event.action == '801003' && path_of($event.target) == 'elation'"
    effects:
      - effect_type: "gain_resource"
        target: "$event.target"
        resource_id: "certified_banger"
        amount: 10

  # 801003 终结技·分支 A 触发（目标拥有欢愉技）：立即施放其欢愉技 1 次（B40 ⓸ 全收
  # ——trigger_action caster="$event.target" + action_type "elation_skill" 跨 actor 代放
  #（P1a——勘正⑮「跨 actor 死键/仅自身路径可定」翻案，指其他欢愉队友也触发）；「固定
  # 计入 #5=20 笑点」结算口径=pool_override 覆写锚（非发放——不落 gain_resource）；
  # "拥有欢愉技"以 path_of=='elation' 代理（同上）
  - event: "on_ultimate"
    condition: "$event.source == '8010' && $event.action == '801003' && path_of($event.target) == 'elation'"
    effects:
      - effect_type: "trigger_action"
        caster: "$event.target"
        action_type: "elation_skill"
        pool_override: "param(801003, 5)"

  # 801003 终结技·分支 B（目标没有欢愉技）：行动提前 #3=50%（advance_action amount
  # 百分数口径——param×100；跨 actor target 通道在案勘正⑯）
  - event: "on_ultimate"
    condition: "$event.source == '8010' && $event.action == '801003' && path_of($event.target) != 'elation'"
    effects:
      - effect_type: "advance_action"
        target: "$event.target"
        amount: "param(801003, 3) * 100"

  # 8010103 阿哈咬它！·挂账：我方目标施放欢愉技后挂账（勘正⑭——actor_type 限我方；
  # 无 insert 闩——欢愉技典型 insert 闩反杀真实触发源；"ally"含自身——爻光「我方
  # 目标含自身」同案待实测；B40 ⓵ action_type 正身=elation_skill 精确判定（旧 follow_up
  # 代理退役——任意追加攻击误挂账病灶同摘）；账可叠层 max 99——多笔叠加口径待实测，
  # 8009 同案）
  - event: "on_action"
    condition: "actor_type_of($event.actor) != 'monster' && $event.action_type == 'elation_skill'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "AHA_SIC_EM_ARMED"
          name: "阿哈咬它！"
          modifier_type: "buff"
          stacks: 1
          max_stack: 99
          duration: 0
          dispellable: False

scaling_notes:
  - "action scaling 全表照抄官方 params：801001（10 行，lv6=1.0/lv10=1.4）、801002（15 行，lv10=0.6/E3 lv12=0.66）；801003/801004/801020 的倍率走 skill_params + param()（801020 逐段随机目标+均摊分母故不进 action scaling——8009 双子收尾段为 split:even + elation 行键单承，本件 hook 手算分母 ÷enemies_alive() 同数值解，原语口径差异在案待上游统一，8009 勘正⑦）"
  - "欢愉体系通道 B40 全兑现（迁移记头注）：elation 面板（行迹 8010101/E2/秘技）/ 欢愉伤害路由（等级系数 7535.107×纯倍率，天赋追加段与 801020 全段——ATK 占位退役）/ 笑点队伍账（引擎原生，天赋 +3、终结技 +5、进战 +1/名 三路写入）/ 好活当赏条目列表（独立 2 回合计时+合并加和）/ 阿哈时刻主体（代放+授予+清池）"
  - "好活当赏形制=B40 引擎原生条目列表（旧 modifier 层账翻案）：进战 +20 引擎统发、战技 +20、终结技分支 A +10、E1 兑现 2×层、行迹 8010103 清账 2×层——全经 gain_resource certified_banger；门控 resource_of('8010','certified_banger')（emit 快照 condition 读旧值=「持有时」判定，族谱#9 同口径）"
  - "快照语义三处在案（幻视族谱#9）：① 战技首发无好活当赏→天赋追加不发（官方文本序先伤后得一致）；② 8010103 清账钩序在战技发放钩之后——condition 读旧值不受本事件发放影响；③ 钩序纪律（B40 文本序实证）：天赋追加段钩 > 战技发放钩、801020 段钩 > 天赋攻击后钩——官方『伤害在先获得在后』，段读施放时池/旧好活当赏，晚序即误读发放后新值"
  - "终结技分支承载（B40 ⓸ 全收）：「拥有欢愉技」=path_of=='elation' 代理——欢愉目标 +10 好活当赏 + 立即代放其欢愉技（trigger_action caster+action_type，固定 20 笑点 pool_override 结算）；非欢愉目标提前 50%"
  - "801006「攻击」（接战削韧条目）触发通道未明 → 未落 actions（待收②）；欢愉技 801020 削韧保守 0 待实测（待收③）"
  - "站位：本体角色，无召唤物/忆灵/独立单位（全部官方技能文本无召唤条目）；控制模型：普攻/战技/终结技=回合内玩家操控（终结技 ally_single 手选——自身可选在案），欢愉技=体系触发（阿哈时刻按编号序代放/终结技代放——合法行动集引擎排除手动施放）"
