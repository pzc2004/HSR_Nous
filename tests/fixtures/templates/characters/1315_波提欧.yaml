# 角色模板：波提欧（1315）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging `data/annotator/staging/1315_波提欧.yaml`）+
# 过堂勘正（staging→fixtures 合并流水线）。非加强角色（不在 B39 双轨名单），单轨。
#
# 过堂收编/勘正十八件（draft 十一个挡因证伪 + 幻名 + 漏收 + 仲裁 + 重构）：
#   ① 星魂幻名两件——E3 "Eidolon3"→Marble Orchard's Guard、E5 "Eidolon5"→
#   Stump Speech（character_ranks.json 核名；E1/E2/E4/E6 draft 名与官方一致）。
#   ② 行迹小节点全漏收——官方 10 个 stat 节点：击破×5=0.373 / 攻击×3=0.18 /
#   生命×2=0.10 → trace_stat_effects（draft 只注"无暴击/物伤节点"却对击破/
#   攻击/生命节点只字未提，trace_stat_effects 空表）。Ghost Load 转化链因此
#   闭环（$self.break_effect 白名单在案——draft"字段名待核"过期）。
#   ③ 削韧三技全收——tbgd 权威在案（131501=10 / 131508=20 / 131503=30；
#   米游社五项"削韧 20/30"双源一致；draft"待实测不脑补"误把权威源当空缺）。
#   ④ 天赋击破伤害收编——break_damage 原语在库（1303 阮•梅先例）+ broken_of
#   目标击破查询在库（draft"击破伤害通道缺/on_break 发射点未见词表"过期）：
#   on_action（131508）+ broken_of($event.target) + 层数三元 ratio。
#   ⑤ 对峙"被击破"半支收编——on_break 事件在库（payload source/target）。
#   ⑥ "被消灭"语义勘正——draft 限 `$event.source == '1315'`（只认波提欧击杀），
#   官方"该目标被消灭…均可获得"无来源限定 → 改经 STANDOFF_TARGET 敌侧标记
#   精确锚定（任何来源击杀/击破对峙目标均触发）。
#   ⑦ 战技"本回合不会结束"收编——grant_extra_turn 原语在库（1015/1102/1201
#   先例，1201 青雀战技不结束回合同机制；draft"词表无 extra_turn 通道"过期）。
#   ⑧ 大招推条 40% 收编——delay_action + $event.target（1303 先例；
#   param(131503,2)×100 百分数口径，E3 联动自动随档 lv12=42%）。
#   ⑨ 大招植弱点收编——modifier weakness_add 在库（1310/1408 先例；draft
#   "弱点植入通道缺"过期）；挂 on_become_target（伤害结算前发射——官方
#   "先植后伤"语序同构，大招本击即享 0 抗性 + 解锁削韧）。
#   ⑩ 秘技植入半支收编——TECH_WEAKNESS_ARMED 标记 + 首次战技钩（同⑨件，
#   "与终结技相同的物理弱点"同 modifier 承载；触发即摘标记=首次限定）。
#   ⑪ 敌侧嘲讽收编——forced_taunt  modifier 键在库（火主同族：挂敌方 →
#   必打 source=施加者波提欧）→ STANDOFF_TARGET 标记件承载（draft"敌方侧
#   施加通道缺"过期——action 层确为 self/all_enemies 二值，hook $event.target
#   通道在库，手册第 16 条正解）。
#   ⑫ 大行迹蛇之上行收编——before_take_damage waterfall modify_amount ×0.7
#   （攻击方无 STANDOFF_TARGET 标记判定——⑪落地后"非对峙目标"可判，draft
#   "敌方侧对峙标记未落地"过期）。
#   ⑬ 大行迹抵近射击收编——gain_energy 10 挂天赋击杀/击破链（draft"hook 侧
#   回能通道未见词表"过期）；溢出层数亦触发=事件驱动天然覆盖（叠层钳顶
#   不影响事件触发）。
#   ⑭ E1 无视 16% 防御收编——def_pen 在案键（rulebook def_multi"无视防御%+
#   防御降低%"合并口径；draft"def_ignore 通道未见词表"过期）；E1 开战 1 层
#   优势口袋保留。"跨战斗保留"系天赋文本（非 E1），注记归位。
#   ⑮ E2 收编——gain_skill_point 1 + break_effect 0.3（2 回合）+ _e2_cd
#   单回合闩（draft"回战技点/BE 增益键未见词表"过期）；溢出触发同⑬覆盖。
#   ⑯ E6 目标侧 +40% 收编（同天赋触发链第二 break_damage，ratio=原倍率×0.4）；
#   相邻 70% 待收（目标代数无相邻池——手册第 16 条同类挡因）。
#   ⑰ 对峙生命周期重构（压缩优先）：draft _standoff_t 计数器+快照补偿双轨
#   删除——STANDOFF modifier duration 3（含⑦额外回合 1 次 owner_turn_start
#   走字补偿：官方 2 真实回合=引擎 3 次走字；希儿/Archer 语义差同族在案）+
#   after_remove_modifier 统一清理链（到期/解除同钩清敌侧标记）；available_if
#   改读 has_modifier($self,'STANDOFF')（modifier 单一事实源，_standoff_on
#   闩一并退役——少一个可失同步件）。
#   ⑱ E3 随档注记勘正——普攻默认 lv6 → E3 实取 lv7（131501=1.1 /
#   131508=2.42；draft"lv11 越档钳表尾"误诊——默认档 basic=6 非 10，不触钳）。
#
# 收录：普攻 131501（lv6=1.0、产点 1、回能 20、削韧 10）/ 强化普攻 131508
#       （lv6=2.2、产点 0、回能 30、削韧 20、对峙互斥 available_if）/ 战技
#       131502（耗 1 点、无回能、对峙双标记 + 额外回合）/ 终结技 131503
#       （lv10=4.0、回能 5、削韧 30、植弱点 + 推条 40%）/ 天赋轮中五豆
#       （优势口袋叠层 + 击杀/击破双链解除对峙 + 击破伤害按层 70/120/170%）/
#       大行迹幽灵装填（双暴转化 stat_exprs 活读）/ 蛇之上行（×0.7）/ 抵近
#       射击（+10 能）/ 秘技植弱点 / E1（16% 无视防御 + 开战 1 层）/ E2（回点
#       +BE30%+单回合闩）/ E3/E5 等级族 / E6 目标侧 +40%
# 待收（均带挡因）：战技易伤两件（#1 敌方受波提欧攻击 +30%、#2 波提欧受对峙
#       目标攻击 +15%）+ E4 ±12%——hit_condition 命中域 $event 只带
#       action_type/damage_type/target_broken/target_controlled，无攻击方
#       标识，来源受限易伤组合不出；改通用 vulnerability 会污染他方攻击
#       （含队友打对峙目标也 +30%），不脑补不写 / 天赋削韧 +50%/层——
#       hit_condition 命中域无 stacks 函数语境（ExprCompiler host 函数表
#       未注入）且 stat_exprs 无命中域限定，"仅强化普攻×按层"双限定组合
#       不出；全局 break_efficiency_boost 会污染大招削韧（30→45），不采 /
#       天赋 #6 削韧计入上限 ×16 子句——pipeline.break_damage 直读目标
#       max_toughness 无 cap 覆写通道（e2e 假人韧性 100 < 160 不触顶）/
#       强化普攻仅能以对峙目标为目标——available_if/policy 不过滤候选
#       （prefer_target 仅 owner_last_target 忆灵族）/ E6 相邻 70%（过堂⑯）/
#       优势口袋跨战斗保留——单场 encounter 语义外 / E2  BE buff 与额外回合
#       走字交互（grant_extra_turn 语义差总注——希儿/Archer 同族待实测）/
#       E2 BE buff 是否惠及触发它的那一下击破——引擎结构序 _trigger_break
#       先发 on_break 再结算击破伤害（buff 先挂→同击按 be 1.673），游戏内
#       同序真相待实测（e2e 已按引擎现序钉值在案）
