  # ——见 hooks ⑩（触发即摘标记 = "首次"限定；官方文本"下一次战斗首次施放战技时"）

actions:
  - action_id: "131501"
    name: "蹄铁裂颅"
    action_type: "basic"
    target_type: "single"
    damage_type: "physical"
    available_if: "has_modifier($self, 'STANDOFF') < 1"  # 对峙中普攻被强化为 131508（换技能互斥，03_actor §3.8.1；modifier 单一事实源——过堂⑰）
