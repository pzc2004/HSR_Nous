  - "战技 131502 易伤两件读法（lv10 = 第 10 档）：param(131502,1)=0.30 敌方所受波提欧攻击易伤；param(131502,2)=0.15 波提欧受对峙目标攻击自伤易伤（全等级恒定）；#3=2 持续回合——来源/目标受限易伤通道缺（hit_condition 命中域无攻击方标识），整件待收（指定读法在案）"
  - "天赋 131504 读法（lv10 = 第 10 档）：param(131504,1/2/3)=0.70/1.20/1.70 击破伤害倍率（按 1/2/3 层优势口袋）——已收（过堂④）；param(131504,4)=0.5 强化普攻削韧 +50%/层（恒定）——待收（命中域×层数双限定缺，见头注）；#5=3 层数上限（恒定）；#6=16 削韧计入上限倍数（恒定）——cap 通道缺待收；『战斗胜利后保留优势口袋至下一战斗』——跨战斗保留单场语义外待收（E1 注记归位）"

