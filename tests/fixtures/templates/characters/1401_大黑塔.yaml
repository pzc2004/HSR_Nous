# 角色模板：大黑塔（1401）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 版本单轨：1401 不在 3.x 加强名单（1004/1005/1006/1102/1205/1212/1217/1306/1307/1310），
# 无新旧两轨——现役即唯一版。
#
# 出处：打标 DAG 产物（staging `data/annotator/staging/1401_大黑塔.yaml`）+ 过堂勘正
#（staging→fixtures 合并流水线）。官方对照：`query-game-data character 1401` +
# starrailres cn/en character_ranks / character_skill_trees + 米游社五项 + fandom 五项。
#
# 过堂勘正十七件：
#   ① 行迹属性节点漏收——draft「节点表缺失」挡因证伪：character_skill_trees.json
#     1401201-1401210 在库（冰伤 0.032+0.032+0.048+0.048+0.064=0.224 / ATK%
#     0.04+0.06+0.08=0.18 / SPD 2+3=5）→ trace_stat_effects 全收（1002 丹恒先例）；
#   ② 1401101「冷漠的诚实」前半漏收——官方「我方目标攻击时，对被击中的敌方目标
#     施加 1 层【解读】」（EN 同步）→ on_become_target 逐命中目标收编（1002 丹恒
#     同族事件），draft 只收了能量半；
#   ③ 1401101② 能量条件两错——draft `$event.actor != '1401'` 把大黑塔本人排除
#     （官方「我方目标」含本人/终结技/追加），却放进怪物行动；正解
#     `actor_type_of($event.actor) != 'monster' && actor_type_of($event.target)
#     == 'monster'`（我方 buff 类行动不触发）+ target_type 分档（aoe 实数 clamp
#     [3,5]，非 aoe 恒 9=3×floor3——floor 来自 1401102 #2=3）+ err_exempt（官方
#     「固定恢复/fixed Energy」不乘 ERR）；
#   ④ 「谜底」命名勘正——draft 作「解答」：官方 CN=【谜底】、EN="Answer"（display
#     改谜底，id 留 ANSWER）；1401102 行迹名 draft 幻视作 "To Sol's Breakfast
#     Jokes"——官方 EN="Message From Beyond the Veil"/CN=视界外来信；
#   ⑤ 谜底计数粒度错——draft 挂 after_apply_modifier 每「次」+1：官方「每被施加
#     1 层」按层数计（波次 25 层=+25 谜底）；正解：各【解读】施加点同钩配对等量
#     谜底（after_apply_modifier 钩退役；clamp 截断的溢出层数不计——边界在案）；
#   ⑥ 1401102③④ 选目标方向错（幻视族谱 #13）——`order_by: "stacks(...)"` 升序
#     取层数**最少**：官方「层数最高」→ `-stacks(...)` 降序（1308 黄泉 CRIMSON_KNOT
#     同构）；condition 补 target 为怪物（我方 buff 不触发）、放掉 `!$event.insert`
#     （追加攻击官方同为攻击——小黑塔追加叠【解读】是核心互动）；
#   ⑦ 天赋 140104 主目标重置漏收——draft「主目标引用缺」挡因过期：on_action 载荷
#     target 在册（bus.py:76）。收编：on_action(140109) adjust_stacks $event.target
#     delta `1 - stacks(...)`（时序=伤害结算后 ✓ 官方「使用时重置」）；E1② 改置
#     15 层=注册序后钩 +14（1002 丹恒 E2 §23.11 注册序先例）；
#   ⑧ 140102/140109 对主目标施加 1 层【解读】漏收（同⑦挡因过期）——on_action
#     $event.target 施加 +谜底配对 +1；
#   ⑨ 战技削韧「米游社未标」误判——米游社有标：一段削韧 15/强化 20（=逐击 5×3/×4，
#     fandom "5 (Per Hit)" 对轴一致）→ toughness_dmg: 5 + toughness_dmg_blast: 5
#     （默认 0.5× 口径不符，逐击恒 5 显式覆盖）；强化收尾段 hook 补 toughness_dmg: 5；
#     「重复 2 次」扩散轮（伤害+削韧）维持待收；米游社「二段削韧 5+10*2」相邻口径
#     存疑→注待实测；
#   ⑩ 终结技「立即行动」通道换——advance_action 100 → immediate_action（官方措辞
#     直映，1310 流萤先例；与推条/行动条清零的精确语义差 待实测 B19 在案）；
#   ⑪ 波次 1 双轨漏——setup 不发 actor_enter/on_wave_start（波 1）：天赋①入场
#     1 层 + ②每波 25 层各补 on_battle_start 轨（1321 大丽花 Wilt 双轨先例）；
#   ⑫ 伪行动身份补——谜底段/E6 段 action_type: "ultimate"、强化战技收尾段
#     action_type: "skill"（1220 飞霄「终结技伤害」身份族先例，类型增伤桶命中口径）；
#   ⑬ 谜底段判读点前移——挂 on_action(140103) 且声明序先于 1401102③④：计入终结技
#     自身命中的预伤害施加（on_become_target 先于伤害，与游戏内同序），不计入攻击
#     后③④（官方「攻击后」）——快照窗最近似「伤害时读取」；若官方实为「施放时」
#     快照则差=本次命中数，待实测在案；
#   ⑭ E6 分档公式验算保留（n=1→4.0 / 2→2.5 / ≥3→1.4 ✓）；判读点=on_action 后值
#     （终结技击杀降档窗 待实测在案）；
#   ⑮ 星魂名核 en/character_ranks.json 全对（Night at Shorefall 等——非幻名，
#     1306 花火 fixture 同 EN 名口径），保留；
#   ⑯ E4 速度件收编维持（pool allies where path_of erudition——含大黑塔本人，
#     spd_pct 白值口径）；E2/E3/E5 维持（联动档见各注）；
#   ⑰ base_stats 注释勘正——行迹无暴击节点（官方节点=atk%/spd/冰伤），crit 维持
#     管线值 0.05/0.5。
#
# 收录：全技能/终结技/强化战技主结构 + 天赋入场&每波【解读】+ 行迹三件套主干
#   （1401101 逐命中解读+固定回能 / 1401102 暴伤光环+攻击后最高层追加 / 1401103
#   谜底累积+终结技倍率段）+ 星魂 E2-E6 全件 + E1② + 秘技 ATK 半。
#
# 待收（均带挡因）：
#   - 天赋 140104 每层增伤（主 #1=8%/其他 #2=4%，智识≥2 翻倍——lv10 口径）：
#     按目标差分倍率通道缺（hook deal_damage amount 单次求值不逐目标；主目标半边
#     虽可经 $event.target 建模，「其他目标」半边无通道——宁缺勿假整件待收）；
#     预伤害回注窗亦缺（on_action 在伤害后发射，当次攻击吃不到）——E1① 联动同挡；
#   - 战技/强化战技「重复 2 次」扩散轮：action 层 repeat/扩散链通道缺 +「上次命中
#     目标及其相邻」动态目标集无表达（相邻关系非 pool 词表）；
#   - 终结技【解读】重排（高层优先精英及以上）+ 敌人离场/击倒转移：重分配/转移
#     通道缺 + 精英层级判定表达式缺；
#   - 1401101③ 主目标 42 层时 +50% 冰伤至本次攻击结束：预伤害修饰窗缺（同上）；
#   - 波次开始 25 层「精英及以上优先」：以随机 1 目标承载（order_by 无精英层级
#     表达式），排序待实测；
#   - 秘技 SU/DU 波次真伤（宇宙域门控通道缺）+ 宝箱标记（非战斗机制）+ point_cost
#     （数据源无，12.4 每秘技各自定义——不脑补）；
#   - 1401102③④ 选目标范围=全体敌人近似（官方「被击中的敌方目标中」——命中集
#     无 on_action 表达；两假人场景无观察差）；
#   - 敌方召唤物入场是否触发天赋①（actor_type=summon 现排除）+【解读】可驱散性
#     官方未述（保守 True）+ E6/谜底段击杀降档/快照窗——均待实测。
