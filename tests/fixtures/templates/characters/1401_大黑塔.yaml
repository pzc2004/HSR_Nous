    # 「重复 2 次」的扩散轮（命中面沿相邻关系二次扩散）→ 待收：挡因=action 层无 repeat/扩散链
    # 通道 + 「上次命中目标及其相邻」的动态目标集无目标代数表达（相邻关系非 pool 词表）
    toughness_dmg: 5         # 逐击 5（fandom "5 (Per Hit)" + 米游社一段 15=5×3 对轴——勘正⑨）
    toughness_dmg_blast: 5   # 相邻逐击同 5（默认 0.5× 口径不符，显式覆盖；扩散轮削韧随轮待收）
    skill_point_cost: 1      # 米游社「战技点 -1」+ fandom 对轴一致
    energy_gain: 30          # 米游社「回能 30」+ fandom 对轴一致
    # 对主目标施加 1 层「解读」（#2）→ 已收（hooks on_action $event.target——勘正⑧）

  - action_id: "140103"
    name: "早说了是魔法吧"
    action_type: "ultimate"
    target_type: "aoe"
    damage_type: "ice"
    energy_cost: 220         # max_sp（米游社「能量 220」+ starrailres 对轴一致）
    scaling: [{"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4},
              {"atk": 1.5}, {"atk": 1.625}, {"atk": 1.75}, {"atk": 1.875}, {"atk": 2.0},
              {"atk": 2.1}, {"atk": 2.2}, {"atk": 2.3}, {"atk": 2.4}, {"atk": 2.5}]
    # 全表 15 行（lv10=第 10 行=2.0）
    toughness_dmg: 20        # 米游社 sub_tag「削韧 20」+ fandom 对轴一致
    energy_gain: 5           # 米游社「回能 5」+ fandom 对轴一致（施放后固定回 5——伤害型终结技经行动回能槽）
    apply_modifiers:
      # 施放时自身 ATK 提升 #4%（lv10=0.8），持续 #5=3 回合——self buff（先于本段伤害挂载，
      # 终结技自身伤害同吃——_apply_action_side_effects 先于伤害循环）
      - target: "self"
        modifier_id: "HERTA_ULT_ATK"
        name: "早说了是魔法吧"
        modifier_type: "buff"
        duration: 3          # param(140103, 5)（全档恒 3）
        dispellable: False
        stat_effects: {"atk_pct": "param(140103, 4)"}
    # 施放后获得 1 层「灵感」+ 立即行动：见 hooks（on_ultimate——immediate_action 勘正⑩）
    # 「解读」重排（高层数优先转移给精英及以上）→ 待收：挡因=重分配通道缺 + 精英层级判定表达式缺

  - action_id: "140109"
    name: "我有一个大胆的想法"
    action_type: "skill"
    target_type: "blast"     # 主体结构=主目标+相邻扩散；官方 effect_text 标 AoE（因末段全体）
    damage_type: "ice"
    available_if: "stacks($self, 'INSPIRATION') >= 1"  # 换技能互斥半（03_actor §3.8.1）：
                                                       # 仅持灵感可用（与 140102 互补同槽替换）
    scaling: [{"atk": 0.4}, {"atk": 0.44}, {"atk": 0.48}, {"atk": 0.52}, {"atk": 0.56},
              {"atk": 0.6}, {"atk": 0.65}, {"atk": 0.7}, {"atk": 0.75}, {"atk": 0.8},
              {"atk": 0.84}, {"atk": 0.88}, {"atk": 0.92}, {"atk": 0.96}, {"atk": 1.0}]
    # 全表 15 行（lv10=第 10 行=0.8）
    scaling_blast: [{"atk": 0.4}, {"atk": 0.44}, {"atk": 0.48}, {"atk": 0.52}, {"atk": 0.56},
                    {"atk": 0.6}, {"atk": 0.65}, {"atk": 0.7}, {"atk": 0.75}, {"atk": 0.8},
                    {"atk": 0.84}, {"atk": 0.88}, {"atk": 0.92}, {"atk": 0.96}, {"atk": 1.0}]
    # 「重复 2 次」扩散轮 → 待收（挡因同 140102）；收尾全体段 #3（lv10=0.4）走 hook
    # deal_damage（见 hooks，toughness_dmg: 5 同逐击口径）；主目标 +1 层解读 → 已收（勘正⑧）
    toughness_dmg: 5         # 逐击 5（米游社强化一段 20=5×4 对轴——勘正⑨）
    toughness_dmg_blast: 5   # 相邻逐击同 5
    skill_point_cost: 1      # 米游社「战技点 -1」+ fandom 对轴一致
    energy_gain: 30          # 米游社「回能 30」+ fandom 对轴一致

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN；星魂名核 en/character_ranks.json（勘正⑮）
eidolons:
  E1:
    name: "Night at Shorefall"   # CN：群星岸落之夜
    # ① 强化战技计算【解读】层数时，额外计入主目标及相邻目标中层数最高者的 50% → 待收
    # （依赖天赋每层增伤通道——头注；按目标差分+相邻集引用双缺）
    hooks:
      # ② 重置改置 15 层：基础钩先置 1、本钩注册序后置 +14（§23.11 注册序——1002 丹恒 E2 先例）
      - event: "on_action"
        condition: "$event.actor == '1401' && $event.action_id == '140109' && !$event.insert"
        effects:
          - effect_type: "adjust_stacks"
            target: "$event.target"
            modifier_id: "INTERPRETATION"
            delta: 14
  E2:
    name: "Wind Through Keyhole"   # CN：穿过锁孔之风
    hooks:
      # ① 入场额外 +1 层「灵感」（上限 4，与终结技授予同池）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "INSPIRATION"
              name: "灵感"
              modifier_type: "buff"
              stacks: 1
              max_stack: 4
              stack_mode: "refresh"
              duration: 0
              dispellable: False
      # ② 施放终结技后额外 +1 层灵感（基础件在 hooks 的 on_ultimate，本件为星魂追加）
      - event: "on_ultimate"
        condition: "$event.source == '1401' && $event.action == '140103'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "INSPIRATION"
              name: "灵感"
              modifier_type: "buff"
              stacks: 1
              max_stack: 4
              stack_mode: "refresh"
              duration: 0
              dispellable: False
      # ③ 施放强化战技后自身下次行动提前 35%
      - event: "on_action"
        condition: "$event.actor == '1401' && $event.action_id == '140109' && !$event.insert"
        effects:
          - effect_type: "advance_action"
            target: "self"
            amount: 35
  E3:
    name: "Door into Summer"   # CN：进入盛夏之门
    skill_level_overrides: {"skill": 2, "talent": 2}     # 战技+2、天赋+2（上限 15）
    # 战技+2：140102/140109 15 档 scaling 实取 lv12 档（0.77/0.88）；天赋+2：解读上限/每波
    # 施加为常量（42/25 全档恒值），增伤每层系数（140104 #1/#2）随档——该增伤本体待收（头注）
  E4:
    name: "The Sixteenth Key"   # CN：第十六把钥匙
    hooks:
      # 队伍中智识角色速度 +12%（spd_pct 白值口径；pool allies 含大黑塔本人——勘正⑯）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "path_of($it) == 'erudition'"}
            modifier:
              modifier_id: "E4_ERUDITION_SPD"
              name: "第十六把钥匙"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"spd_pct": 0.12}
  E5:
    name: "Bitter Pill of Truth"   # CN：苦药似的真理
    skill_level_overrides: {"ultimate": 2, "basic": 1}   # 终结技+2、普攻+1
    # 终结技+2：140103 scaling 实取 lv12 档（2.2）+ ATK buff 随档（param(140103,4)=0.88）；
    # 普攻+1：默认 lv6+1=lv7 在 10 档表内（0.7——cap=10 结构性不越界，1321 大丽花同例）
  E6:
    name: "Sweet Lure of Answer"   # CN：甜饵般的答案
    stat_effects: {"res_pen": 0.2}   # 冰属性抗性穿透 +20%（全技能皆冰——单通道无观察差；self 面板槽在案）
    hooks:
      # 终结技倍率按场上存活敌人数分档：≥3 → +140% / 2 → +250% / 1 → +400%（倍率加算——
      # 以同乘区追加伤害段等值承载：atk × 档值；clamp 阶梯：n=1→4.0 / 2→2.5 / ≥3→1.4 勘正⑭）
      # 挂 on_action 与谜底段同判读点（on_ultimate 同序亦可——声明序保持与谜底段相邻）
      - event: "on_action"
        condition: "$event.actor == '1401' && $event.action_id == '140103'"
        effects:
          - effect_type: "deal_damage"
            name: "甜饵般的答案"
            target: "all_enemies"
            damage_type: "ice"
            action_type: "ultimate"    # 终结技伤害身份族（勘正⑫——1220 飞霄先例）
            amount: "$self.atk * (4.0 - 1.5 * min(max(enemies_alive() - 1, 0), 1) - 1.1 * min(max(enemies_alive() - 2, 0), 1))"
    # 分档判读点=on_action 后值（终结技击杀降档窗 待实测——勘正⑭）；与解读重排先后 待实测

hooks:
  # ── 天赋 140104「拿来吧你」──────────────────────────────────────────
  # 波 1 双轨（勘正⑪——setup 不发 actor_enter/on_wave_start，1321 大丽花先例）：
  # 入场全体 1 层「解读」+ 随机 1 目标 25 层（精英优先 → 随机承载，待收在案）+ 谜底配对
  #（2+25：先 apply 1 立件再 adjust 差量——adjust_stacks 对未持有件无效，立件-配对两步走）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "INTERPRETATION"
          name: "解读"
          modifier_type: "debuff"
          duration: 0
          dispellable: True        # 可驱散性官方未述 → 保守默认可驱散，待实测
          stacks: 1
          max_stack: 42            # param(140104, 3)（全档恒 42）
          stack_mode: "refresh"
      - effect_type: "apply_modifier"
        target: {pool: "enemies", take: 1, mode: "random"}
        modifier:
          modifier_id: "INTERPRETATION"
          name: "解读"
          modifier_type: "debuff"
          duration: 0
          dispellable: True
          stacks: 25               # param(140104, 6)（全档恒 25）
          max_stack: 42
          stack_mode: "refresh"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ANSWER"
          name: "谜底"
          modifier_type: "buff"
          stacks: 1
          max_stack: 99            # 1401103 #2（全档恒 99）
          stack_mode: "refresh"
          duration: 0
          dispellable: False
      - effect_type: "adjust_stacks"     # 谜底配对：命中数（=存活敌数）+25 - 立件 1
        modifier_id: "ANSWER"
        delta: "enemies_alive() + 24"

  # 天赋①：敌人入场时被施加 1 层「解读」（波 2+ 新敌/中场入场——actor_enter 在案事件）
  # + 谜底配对 +1（勘正⑤）
  - event: "actor_enter"
    condition: "actor_type_of($event.actor) == 'monster'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "INTERPRETATION"
          name: "解读"
          modifier_type: "debuff"
          duration: 0
          dispellable: True
          stacks: 1
          max_stack: 42
          stack_mode: "refresh"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ANSWER"
          name: "谜底"
          modifier_type: "buff"
          stacks: 1
          max_stack: 99
          stack_mode: "refresh"
          duration: 0
          dispellable: False

  # 天赋②：每波次开始（波 2+）对随机敌人施加 25 层「解读」（精英优先 → 随机承载，待收）
  # + 谜底配对 +25
  - event: "on_wave_start"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "enemies", take: 1, mode: "random"}
        modifier:
          modifier_id: "INTERPRETATION"
          name: "解读"
          modifier_type: "debuff"
          duration: 0
          dispellable: True
          stacks: 25
          max_stack: 42
          stack_mode: "refresh"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ANSWER"
          name: "谜底"
          modifier_type: "buff"
          stacks: 25
          max_stack: 99
          stack_mode: "refresh"
          duration: 0
          dispellable: False

  # ── 行迹 1401101「冷漠的诚实」──────────────────────────────────────
  # ① 我方目标攻击时，对被击中的敌方目标施加 1 层「解读」（勘正②——on_become_target
  # 逐命中目标发射；我方=非怪物含召唤物/追加，敌方行动的 source 为怪物被条件排除）
  # + 谜底配对 +1
  - event: "on_become_target"
    condition: "actor_type_of($event.source) != 'monster' && actor_type_of($event.target) == 'monster'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "INTERPRETATION"
          name: "解读"
          modifier_type: "debuff"
          duration: 0
          dispellable: True
          stacks: 1
          max_stack: 42
          stack_mode: "refresh"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ANSWER"
          name: "谜底"
          modifier_type: "buff"
          stacks: 1
          max_stack: 99
          stack_mode: "refresh"
          duration: 0
          dispellable: False

  # ── 终结技 140103「早说了是魔法吧」──────────────────────────────────
  # 施放后获得 1 层「灵感」（上限 4=#6）+ 立即行动（immediate_action 承载——勘正⑩，
  # 1310 流萤先例；与推条/行动条清零的精确语义差 待实测 B19）
  - event: "on_ultimate"
    condition: "$event.source == '1401' && $event.action == '140103'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "INSPIRATION"
          name: "灵感"
          modifier_type: "buff"
          stacks: 1
          max_stack: 4             # param(140103, 6)（全档恒 4）
          stack_mode: "refresh"
          duration: 0
          dispellable: False
      - effect_type: "immediate_action"
        target: "self"

  # 1401103「饥饿的地景」终结技倍率段：每层「谜底」使本次终结技倍率 +1%（#1=0.01 全档
  # 恒值）——倍率加算以同乘区追加伤害段承载（atk × 0.01 × 层数，两段求和 ≡ 倍率加算，
  # 行距在案）；挂 on_action 且声明序先于 1401102③④（判读点勘正⑬：计终结技自身命中的
  # 预伤害施加、不计攻击后③④——最近似「伤害时读取」快照）；谜底未被官方述为消耗 →
  # 不消耗（在案，待实测）
  - event: "on_action"
    condition: "$event.actor == '1401' && $event.action_id == '140103'"
    effects:
      - effect_type: "deal_damage"
        name: "饥饿的地景"
        target: "all_enemies"
        damage_type: "ice"
        action_type: "ultimate"    # 终结技伤害身份族（勘正⑫）
        amount: "$self.atk * 0.01 * stacks($self, 'ANSWER')"

  # ── 战技/强化战技主目标施加 1 层「解读」（#2——勘正⑧：on_action 载荷 target 在册，
  # draft「主目标引用缺」挡因过期）+ 谜底配对 +1；时序=攻击后（伤害结算完毕——行迹/
  # 天赋的预伤害施加已在 on_become_target 先行）
  - event: "on_action"
    condition: "$event.actor == '1401' && ($event.action_id == '140102' || $event.action_id == '140109')"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "INTERPRETATION"
          name: "解读"
          modifier_type: "debuff"
          duration: 0
          dispellable: True
          stacks: 1
          max_stack: 42
          stack_mode: "refresh"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ANSWER"
          name: "谜底"
          modifier_type: "buff"
          stacks: 1
          max_stack: 99
          stack_mode: "refresh"
          duration: 0
          dispellable: False

  # ── 强化战技 140109 结算 ──────────────────────────────────────────
  # ① 消耗 1 层「灵感」（声明序=先消耗后收尾段）；② 收尾全体段（lv10 #3=0.4 × ATK，
  # 全体冰伤——逐击削韧 5 同口径，勘正⑨；伪行动身份=skill 勘正⑫）
  - event: "on_action"
    condition: "$event.actor == '1401' && $event.action_id == '140109' && !$event.insert"
    effects:
      - effect_type: "adjust_stacks"
        modifier_id: "INSPIRATION"
        delta: -1
      - effect_type: "deal_damage"
        name: "我有一个大胆的想法·收尾"
        target: "all_enemies"
        damage_type: "ice"
        action_type: "skill"
        toughness_dmg: 5
        amount: "param(140109, 3) * $self.atk"

  # 天赋 140104 主目标重置：使用强化战技时将主目标「解读」重置为 1 层（勘正⑦——
  # 伤害结算后 on_action 承载 ✓ 官方「使用时重置」时序；E1 改置 15=E1 钩后补 +14）
  - event: "on_action"
    condition: "$event.actor == '1401' && $event.action_id == '140109' && !$event.insert"
    effects:
      - effect_type: "adjust_stacks"
        target: "$event.target"
        modifier_id: "INTERPRETATION"
        delta: "1 - stacks($event.target, 'INTERPRETATION')"

  # ── 行迹 1401101② 固定回能（勘正③）────────────────────────────────
  # 我方目标攻击后，本次攻击每击中 1 个目标固定恢复 3 点能量（#1 全档恒值），最多 5 个；
  # 1401102 #2=3 → 至少按 3 个计（floor 3 恒成立——行迹全解锁口径）：
  # aoe 实数 clamp [3,5]；非 aoe（single/blast ≤3 目标）恒 9。err_exempt：官方「固定恢复/
  # fixed Energy」不乘 ERR。条件排除怪物行动与我方 buff（target 须为怪物——勘正③）
  - event: "on_action"
    condition: "actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster' && $event.target_type == 'aoe'"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: "3 * min(max(enemies_alive(), 3), 5)"
        err_exempt: true
  - event: "on_action"
    condition: "actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster' && $event.target_type != 'aoe'"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 9
        err_exempt: true

  # ── 行迹 1401102「视界外来信」──────────────────────────────────────
  # 上半：队伍中智识角色 ≥2 时全体暴击伤害 +80%（#1——count_team 编成计数口径）
  - event: "on_battle_start"
    condition: "count_team('erudition') >= 2"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "allies"}
        modifier:
          modifier_id: "E_TRACE_CRITDMG"
          name: "视界外来信"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"crit_dmg": 0.8}

  # 下半①（勘正⑥）：任意我方攻击后，对「解读」层数最高的敌人追加 #3=1 层解读
  #（降序 `-` 前缀——draft 升序取反；平手按池序=站位序，deterministic 稳定全序；
  # 官方范围=「被击中的敌方目标中」→ 全体敌人近似，两假人无观察差，待收在案）
  # + 谜底配对 +1
  - event: "on_action"
    condition: "actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster'"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "enemies", order_by: "-stacks($it, 'INTERPRETATION')", take: 1, mode: "deterministic"}
        modifier:
          modifier_id: "INTERPRETATION"
          name: "解读"
          modifier_type: "debuff"
          duration: 0
          dispellable: True
          stacks: 1
          max_stack: 42
          stack_mode: "refresh"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ANSWER"
          name: "谜底"
          modifier_type: "buff"
          stacks: 1
          max_stack: 99
          stack_mode: "refresh"
          duration: 0
          dispellable: False

  # 下半②：攻击者为智识角色时，同一目标再 +#4=2 层解读（①+② = 智识 3 层/次）
  # + 谜底配对 +2
  - event: "on_action"
    condition: "actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster' && path_of($event.actor) == 'erudition'"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "enemies", order_by: "-stacks($it, 'INTERPRETATION')", take: 1, mode: "deterministic"}
        modifier:
          modifier_id: "INTERPRETATION"
          name: "解读"
          modifier_type: "debuff"
          duration: 0
          dispellable: True
          stacks: 2
          max_stack: 42
          stack_mode: "refresh"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ANSWER"
          name: "谜底"
          modifier_type: "buff"
          stacks: 2
          max_stack: 99
          stack_mode: "refresh"
          duration: 0
          dispellable: False
