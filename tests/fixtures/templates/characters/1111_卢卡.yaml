trace_notes:
  - 大行迹 1111101「动能过载」已收：使用战技（EN "When using Skill"——仅 111102 触发域，
    强化普攻/终结技不触发）时驱散目标 1 个增益（filter buff / max_count 1）；驱散选取顺序
    （敌方多增益时移除哪一个）待实测
  - 大行迹 1111102「循环制动」已收：每获得 1 层战意额外 +3 能——on_resource_gain 全源判
    （普攻/战技/强化普攻/终结技/E2/秘技入战层）；payload 字段名（resource_id/amount）与
    终结技 +2 层是否 = +6 能、入战层是否回能、满 4 层后再获得是否仍回能——待实测
  - 大行迹 1111103「粉碎战意」已收：强化普攻「直冲拳」每段 50% 固定概率追加 1 段（追加段
    不再追加——condition 单层不递归天然成立）；追加段削韧待实测（暂 0）
  - "行迹面板节点已回填（B-TR①：atk 0.28/DEF 0.125/EHR 0.18——character_skill_trees.json 1111201-210 聚合；官方无物理增伤/暴击节点——原注记『物理增伤待取证』以官方数据终审不存在）"
