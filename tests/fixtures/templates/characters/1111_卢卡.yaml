# 角色模板：卢卡（1111）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂收编/勘正三件：① 111108 结构勘正——官方 "uses Direct Punch to deal
#   3 hits"（直冲 3 段走 instances #1）+ "Rising Uppercut to deal 1 hit"
#   （碎天拳 hook param(111108, 2)）；draft 单段 #1 建模=直冲 3 段与碎天
#   段双缺（query-game-data 官方文本实证）。
#   ② chance(0.5)×3→mechanic_chance（函数不在词表——1009 同案；expected
#   恒中、roll 真掷）。
#   ③ LUKA_VULN 易伤键勘正——dmg_taken 无消费端=死键（1507 先例）→
#   vulnerability 承伤区（终结技易伤 20% lv10）。
#
# 收录：普攻直冲拳 / 战技裂伤拳（1.2 lv10 + 裂伤施加 3 回合 + 驱散 1
#       增益）/ 裂伤 DoT（min(24% 敌 Max, 338% ATK lv10)——角色专属公式
#       承载，非击破裂伤族）/ 终结技制胜一击（3.3 lv10 + 战意 +2 + 易伤
#       12% 三回合）/ 战意循环（普攻/战技 +1 层上限 4；≥2 强化普攻可用
#       耗 2）/ 循环制动（每层 +3 能——on_resource_gain 全源判）/
#       粉碎战意（直冲每段 50% 追加 1 段×3）/ 天赋引爆（强化普攻命中
#       裂伤 → 85% 原裂伤 lv10）/ 秘技随机单体 + 裂伤 + 1 战意 /
#       E1 裂伤目标行动增伤 15% / E3/E5 等级族 / E6 喝彩附加段
# 待收（均带挡因）：E2 物理弱点谓词（element_of≠weakness——1009/1101
#       同案）/ E4 ATK 叠层（EN/CN 语义分歧——已获得次数 vs 当前层数）/
#       裂伤刷新规则（refresh 语义待实测）/ 追加段削韧值（官方未载）
actor_id: "1111"
name: "卢卡"
level: 80
