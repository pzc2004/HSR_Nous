eidolons:
  E1:
    name: "格斗不止"
    hooks:
      - event: "on_action"
        condition: "$event.actor == '1111' && !$event.insert && has_modifier($event.target, 'LUKA_BLEED') >= 1"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_FIGHT_ON"
              name: "格斗不止"
              modifier_type: "buff"
              duration: 2
              dispellable: True
              stat_effects: {"all_dmg": 0.15}
  E2:
    name: "敌弱我强"
    notes:
      - "待收：战技命中物理弱点目标 → 额外获得 1 层战意（可触发 1111102 +3 能）。挡因：宿主函数"
      - "词表无 weakness 谓词（element_of 是自身取数，无目标弱点判据通道），'hits' 语义"
      - "（未命中是否照给）待实测——不脑补条件，数据/通道到位后回填"
  E3:
    name: "为擂台而生"
    skill_level_overrides: {"skill": 2, "talent": 2}
    notes:
      - "战技+2：111102 直伤 scaling 实取 lv12 档；裂伤上限倍率/持续随 param(111102,4/5) 引用"
      - "天赋+2：引爆比例 param(111104,2) 随档（实取 lv12=0.884）"
  E4:
    name: "永不回头"
    notes:
      - "待收：EN「For every stack of Fighting Will obtained, increases ATK by 5%, stacking up to 4 time(s)」"
      - "EN 措辞为按已获得次数计数的独立 atk 叠层 buff（上限 4 层=20% ATK），"
      - "但 CN 若写「每拥有 1 层战意」则语义反转为随当前层数浮动；官方未写消耗战意时是否衰减。"
      - "挡因：EN/CN 语义分歧 + 无权威裁定——标待实测，不脑补"
  E5:
    name: "野火之魂"
    skill_level_overrides: {"ultimate": 2, "basic": 1}
    notes:
      - "终结技+2：111103 直伤 scaling 实取 lv12 档；易伤 param(111103,3) 随档；+2 战意恒定"
      - "普攻+1：111101 scaling 实取 lv10 档（10 行表上限）；111108 强化普攻同走 basic 档"
  E6:
    name: "冠军的喝彩"
    hooks:
      - event: "on_action"
        condition: "$event.actor == '1111' && $event.action_id == '111108' && !$event.insert && has_modifier($event.target, 'LUKA_BLEED') >= 1"
        effects:
          - effect_type: "deal_damage"
            name: "冠军的喝彩"
            target: "$event.target"
            damage_type: "physical"
            amount: "0.24 * min(param(111102, 3) * max_hp_of($event.target), param(111102, 4) * $self.atk)"

hooks:
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_resource"
        resource_id: "fighting_will"
        amount: 1

  - event: "on_action"
    condition: "$event.actor == '1111' && $event.action_id == '111102' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "LUKA_BLEED"
          name: "裂伤"
          modifier_type: "debuff"
          duration: 3
          dispellable: True

  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'LUKA_BLEED') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "裂伤"
        target: "$event.actor"
        damage_type: "physical"
        amount: "min(param(111102, 3) * max_hp_of($event.actor), param(111102, 4) * $self.atk)"

  - event: "on_action"
    condition: "$event.actor == '1111' && $event.action_id == '111103' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "fighting_will"
        amount: "param(111103, 5)"
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "LUKA_VULN"
          name: "制胜一击·易伤"
          modifier_type: "debuff"
          duration: 3
          dispellable: True
          stat_effects: {"vulnerability": "param(111103, 3)"}   # 键名勘正（过堂）：dmg_taken 无消费端=死键（1507 先例）→ vulnerability 承伤区

  # 战意获取（官方天赋触发域：普攻"直冲拳"或战技——过堂勘正摘除 111108：
  # 强化普攻是 Sky-Shatter Fist 不在枚举，官方"消耗 2 层"语义下不应自产——
  # draft 误含强化普攻=净耗 −1（−2+1）与官方 −2 不符）
  - event: "on_action"
    condition: "$event.actor == '1111' && !$event.insert && ($event.action_id == '111101' || $event.action_id == '111102')"
    effects:
      - effect_type: "gain_resource"
        resource_id: "fighting_will"
        amount: 1

  - event: "on_action"
    condition: "$event.actor == '1111' && $event.action_id == '111108' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "碎天拳"
        target: "$event.target"
        damage_type: "physical"
        amount: "param(111108, 2) * $self.atk"   # Rising Uppercut 1 段（#2——过堂补段，
                                                # draft 结构勘正段在 actions 注）
  - event: "on_action"
    condition: "$event.actor == '1111' && $event.action_id == '111108' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "fighting_will"
        amount: -2

  - event: "on_action"
    condition: "$event.actor == '1111' && $event.action_id == '111108' && !$event.insert && has_modifier($event.target, 'LUKA_BLEED') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "火花四溅·引爆"
        target: "$event.target"
        damage_type: "physical"
        amount: "param(111104, 2) * min(param(111102, 3) * max_hp_of($event.target), param(111102, 4) * $self.atk)"

  - event: "on_action"
    condition: "$event.actor == '1111' && $event.action_id == '111102' && !$event.insert"
    effects:
      - effect_type: "remove_modifier"
        target: "$event.target"
        filter: "$mod.kind == 'buff'"
        max_count: 1

  - event: "on_resource_gain"
    condition: "$event.resource_id == 'fighting_will' && $event.amount >= 1"
    effects:
      - effect_type: "gain_energy"
        amount: "3 * $event.amount"

  - event: "on_action"
    condition: "$event.actor == '1111' && $event.action_id == '111108' && !$event.insert && mechanic_chance(0.5)"
    effects:
      - effect_type: "deal_damage"
        name: "直冲碎天拳·追加段 1"
        target: "$event.target"
        damage_type: "physical"
        amount: "param(111108, 1) * $self.atk"
  - event: "on_action"
    condition: "$event.actor == '1111' && $event.action_id == '111108' && !$event.insert && mechanic_chance(0.5)"
    effects:
      - effect_type: "deal_damage"
        name: "直冲碎天拳·追加段 2"
        target: "$event.target"
        damage_type: "physical"
        amount: "param(111108, 1) * $self.atk"
  - event: "on_action"
    condition: "$event.actor == '1111' && $event.action_id == '111108' && !$event.insert && mechanic_chance(0.5)"
    effects:
      - effect_type: "deal_damage"
        name: "直冲碎天拳·追加段 3"
        target: "$event.target"
        damage_type: "physical"
        amount: "param(111108, 1) * $self.atk"

scaling_notes:
  - 裂伤（Bleed）建模：物理 DoT，敌方回合开始结算（on_turn_start 主体 $event.actor），伤害 =
    min(敌 max_hp × param(111102,3), 卢卡 atk × param(111102,4))，持续 param(111102,5)=3 回合，
    重复施加默认 refresh——刷新/覆盖旧档上限规则待实测
  - 战意（Fighting Will）= custom_resources fighting_will（max 4）；强化普攻条件 ≥2、消耗 2；
    不用 energy 伪资源（能量走内建 energy_cost/energy_gain + gain_energy）
  - 强化普攻 action scaling 照抄 params(111108) 第 1 列单段值（0.10..0.28，10 档）；1111103
    追加段与 E1/E6 增益命中域走 hook deal_damage（归属卢卡面板乘区）
  - EN 触发域裁定：1111101「When using Skill」= 仅战技；天赋「Basic ATK or Skill」= 双类含
    强化普攻、不含终结技；E4「For every stack of Fighting Will obtained」= 已获得次数计数
    口径，待实测裁定
