    skill_point_gain: 1                      # tbgd：与原版一致 +1
    energy_gain: 20                          # tbgd：与原版一致

  # 150702 附加语义：4 次随机单体段（#3 每次 12%→30%）走 hook on_action（4× deal_damage random，
  # 逐段削韧 15）；耗 10% Max HP（#4 全档恒定）走 hook drain_hp floor 1
  - action_id: "150702"
    name: "刃下，归葬"
    action_type: "skill"
    target_type: "aoe"
    damage_type: "fire"
    available_if: "res__fury_on >= 1 && $self.hp > 1"   # 双 AND 硬门槛：Infinite Fury + HP>1
    scaling:                                 # lv1..lv15 照抄 150702 params #1（全体本体段）
      [{"hp": 0.36}, {"hp": 0.396}, {"hp": 0.432}, {"hp": 0.468}, {"hp": 0.504},
       {"hp": 0.54}, {"hp": 0.585}, {"hp": 0.63}, {"hp": 0.675}, {"hp": 0.72},
       {"hp": 0.756}, {"hp": 0.792}, {"hp": 0.828}, {"hp": 0.864}, {"hp": 0.9}]
    toughness_dmg: 10                        # 全体本体 10（tbgd/mys sub_tag；fandom 无数据）
    skill_point_cost: 0                      # tbgd BPNeed sp_cost=0 + 官方 "does not consume Skill Points" 双证
    skill_point_gain: 0                      # tbgd sp_gain=0
    energy_gain: 30                          # tbgd 权威

  # 150709 附加语义：免费追加技——由 Talent 满充触发（hooks trigger_action 插入档，全自动），玩家不点按；
  # 目标选择规则待实测（随机/沿用上次/最低血无文本可判）；scaling 照抄官方 150709 params 第 1 列原值
  - action_id: "150709"
    name: "刃下，归葬"
    action_type: "follow_up"                 # Talent 明写 "considered as Follow-Up ATK"（无 talent 键可用）
    target_type: "aoe"
    damage_type: "fire"
    scaling:                                 # lv1..lv15 照抄官方 150709 params 第 1 列（全档 0.1，desc 为空占位原值）
