# 秘技 150707「十方无赦」：立即攻击范围内全体敌人；进战后全体敌人 Taunt 1 回合 + 自身受伤
# 降低 90%（#1）持续 2 回合（#2）；削韧 20（mys sub_tag 对轴）
techniques:
  - technique_id: "150707"
    name: "十方无赦"
    point_cost: 1
    effects:                                 # 进战一次性（战前装填预置，施放者=千冶•刃）
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "MORTENAX_TECH_TAUNT"
          name: "十方无赦·嘲讽"
          modifier_type: "debuff"
          duration: 1                        # int 直给（全档恒 2 回合持续的是自身减伤，嘲讽 1 回合）
          dispellable: True                  # 驱散性待实测（保守置 True）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "MORTENAX_TECH_DR"
          name: "十方无赦·减伤"
          modifier_type: "buff"
          duration: 2                        # #2 全档恒 2（单档字面值）
          dispellable: False
          stat_effects: {"all_dmg": 0}       # 减伤 90%（#1）走 before_take_damage modify_amount 0.1×（hooks）

actions:
