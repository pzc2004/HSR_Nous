    toughness_dmg: 10                        # 保守口径（精确值待实测）

# 星魂（build.yaml member.eidolon: N 激活 E1..EN）
# E1 ② 使用 Talent 免费 Skill 后 Infinite Fury 倒计时行动延后 15%——倒计时实体通道未登记，待收 [待实测]
# E2 ① 队友以终极技造成的伤害视为发动了追加攻击（改判 action 类别标签）+ ② 队友追加攻击伤害 +75%
#    ——重判标签与追加攻击乘区通道缺，待收 [待实测]
# E3 Ultimate+2 随档段：Balefire Bind DEF↓（param(150703,7)——action apply_modifiers）/ Infinite Fury
#    CRIT DMG（param(150703,3)）；耗血 20%/暴击率 20%/倒计时 SPD 70/免死回血 50%/持续 2 全档恒定维持字面值；
#    Talent+2 随档段：满充回能（param(150704,2)）；Charge 上限 #1 恒 9（E2 覆写另计）
# E5 Skill+2：150702/150709 均 15 档 scaling 实取 lv12 档（AoE 79.2% / 4×26.4%）+ 耗血与随机段倍率
#    随档（param(150702,4)/param(150702,3)）；Basic+1：150701/150708 均 10 档——+1 后封顶 lv10
#    （70%/140%，表尾即封顶，无第 11 档，不脑补）
# E6 ② Tenax Per Ignem（150714）倍率 ×150%（lv10 350%→525%）——action 倍率覆写通道缺，待收 [待实测]；
#    最终乘区（直乘 vs 独立乘区）待实测
eidolons:
  E1:
    name: "Ere My Death, I Stood Unmade"
    hooks:
      # ① Zone 活跃时全体敌人全属性抗性 -20%（mechanics 02：res_pen 含抗性降低，遐蝶 LOST_NETHERLAND 同口径）
      - event: "on_ultimate"
        condition: "$event.source == '1507' && $event.action == '150703'"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E1_ALL_RES_DOWN"
              name: "Ere My Death, I Stood Unmade"
              modifier_type: "debuff"
              duration: 0                    # 随 Zone 存续——Zone 解散链（免死 hook）统一摘除
              dispellable: True
              stat_effects: {"res_pen": 0.2}
  E2:
    name: "Ash Was My Heart…"
    hooks:
      # ③ Charge 上限 9 → 7：挂标记，Talent 满充阈值条件按 has_modifier 分叉（见 150704 满充 hook）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_CHARGE_CAP"
              name: "Ash Was My Heart…·充能上限 7"
              modifier_type: "buff"
              duration: 0
              dispellable: False
  E3:
    name: "Across the Shore…"
    skill_level_overrides: {"ultimate": 2, "talent": 2}   # Ultimate+2、Talent+2
  E4:
    name: "Odium I've Smitten…"
    hooks:
      # 大行迹1507103 ① 队友增伤再 +50%（官方 "additionally increases" 加算追加）——team 光环同池加算；
      # 是否为独立 modifier 同池叠加待实测（数值等价，在案）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_TEAM_DMG"
              name: "Odium I've Smitten…"
              modifier_type: "buff"
              duration: 0
              effect_scope: "team"
              dispellable: False
              stat_effects: {"all_dmg": 0.5}
  E5:
    name: "I Severed My Woes…"
    skill_level_overrides: {"skill": 2, "basic": 1}       # Skill+2、Basic+1
  E6:
    name: "If Immortality Could Die…"
    hooks:
      # ① Zone 存续期间自身受到伤害或消耗 HP 时 +1 Charge，"can trigger again after any target's
      # turn ends"——任意目标回合结束后可再触发（等效每至多 1 次/回合轮转）：_e6_icd 闩 +
      # on_turn_end 复位（事件为全 actor 轮转发射，与官方语义同构；精确 ICD 边界待实测）
      - event: "on_hp_decrease"
        condition: "$event.target == '1507' && res__zone_on >= 1 && res__e6_icd < 1"
        effects:
          - effect_type: "gain_resource"
            resource_id: "charge"
            amount: 1
          - effect_type: "set_resource"
            resource_id: "_e6_icd"
            amount: 1
      - event: "on_turn_end"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e6_icd"
            amount: 0

hooks:
  # ── 150703 终结技主链：耗 20% Max HP（floor 1）→ 部署 Zone（闩+光环件）→ 进 Infinite Fury
  #（闩 + CRIT Rate 0.2 / CRIT DMG param(150703,3)）；Balefire Bind 走 action apply_modifiers。
  # 倒计时 SPD 70 实体通道未登记——Zone 暂常驻（duration 0），仅免死/解散链收口 [待实测]
  - event: "on_ultimate"
    condition: "$event.source == '1507' && $event.action == '150703'"
    effects:
      - effect_type: "drain_hp"
        target: "self"
        amount: "param(150703, 1) * $self.max_hp"   # lv10 = 20% Max HP（全档恒定）
        floor: 1                                     # HP 不足压至 1（官方）
        drain_ratio: 0
      - effect_type: "set_resource"
        resource_id: "_zone_on"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_fury_on"
        amount: 1
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "MORTENAX_ZONE"
          name: "结界·骸骨当炉"
          modifier_type: "buff"
          duration: 0                                # 倒计时实体待收——暂常驻，见头注 ①
          dispellable: False
          stat_effects: {"all_dmg": 0}               # Zone 承载件（团队增伤走大行迹件）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "INFINITE_FURY"
          name: "无限怒火"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects:
            crit_rate: 0.2                           # #2 全档恒定 +20%
            crit_dmg: "param(150703, 3)"             # #3 随档（lv10=60%）

  # ── 免死（Infinite Fury 内致死一击）：解散 Zone + 退状态 + 回 #6=50% Max HP（全档恒定）。
  # before_take_damage waterfall cancel 路径（白厄免死族同构）——条件=命中自己且足以致死
  - event: "before_take_damage"
    condition: "$event.target == '1507' && res__fury_on >= 1 && $event.amount >= hp_of($event.target)"
    effects:
      - effect_type: "cancel_event"
      - effect_type: "set_resource"
        resource_id: "_zone_on"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_fury_on"
        amount: 0
      - effect_type: "remove_modifier"
        modifier_id: "MORTENAX_ZONE"
      - effect_type: "remove_modifier"
        modifier_id: "INFINITE_FURY"
      - effect_type: "remove_modifier"
        modifier_id: "E1_ALL_RES_DOWN"
      - effect_type: "heal"
        target: "self"
        amount: "param(150703, 6) * $self.max_hp"    # #6 = 50% Max HP（全档恒定）

  # ── 战技/追加技耗血（#4=10% Max HP 全档恒定，floor 1）——HP>1 门槛在 available_if（150702）
  # 与 Talent 满充 hook（150709 触发）处判定；150709 是否同样耗血待实测（占位值照抄收录）
  - event: "on_action"
    condition: "$event.actor == '1507' && $event.action_id == '150702' && !$event.insert"
    effects:
      - effect_type: "drain_hp"
        target: "self"
        amount: "param(150702, 4) * $self.max_hp"
        floor: 1
        drain_ratio: 0
  - event: "on_action"
    condition: "$event.actor == '1507' && $event.action_id == '150709'"
    effects:
      - effect_type: "drain_hp"
        target: "self"
        amount: "param(150709, 4) * $self.max_hp"    # 官方 150709 params #4 占位 0.1（待实测）
        floor: 1
        drain_ratio: 0

  # ── 战技 4 次随机单体段（#2=4 次、每次 #3 倍率、逐段削韧 15——随机单体=目标代数 random×4，
  # expected 确定化按序取首（B22 纪律））；追加技 150709 同形继承——150709 唯一入口=
  # trigger_action（insert=True），故 150709 不过 insert 滤（150702 主动施放才滤——
  # 对拍 B-MB① 钓出：合写 !$event.insert 会让 150709 继承段全哑，1510 勘正⑦同族）
  - event: "on_action"
    condition: "($event.actor == '1507' && (($event.action_id == '150702' && !$event.insert) || $event.action_id == '150709'))"
    effects:
      - effect_type: "deal_damage"
        name: "刃下，归葬·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "fire"
        amount: "param(150702, 3) * $self.max_hp"
        toughness_dmg: 15
      - effect_type: "deal_damage"
        name: "刃下，归葬·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "fire"
        amount: "param(150702, 3) * $self.max_hp"
        toughness_dmg: 15
      - effect_type: "deal_damage"
        name: "刃下，归葬·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "fire"
        amount: "param(150702, 3) * $self.max_hp"
        toughness_dmg: 15
      - effect_type: "deal_damage"
        name: "刃下，归葬·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "fire"
        amount: "param(150702, 3) * $self.max_hp"
        toughness_dmg: 15

  # ── 普攻 Taunt 1 回合（150701 / 150708 同构；action 层 target 受限故走 hook，
  # $event.target 字段沿用遐蝶 E1 先例——嘲讽强制命中级待实测）
  - event: "on_action"
    condition: "$event.actor == '1507' && ($event.action_id == '150701' || $event.action_id == '150708') && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "MORTENAX_TAUNT"
          name: "嘲讽"
          modifier_type: "debuff"
          duration: 1
          dispellable: True

  # ── 150704 天赋·充能源①：Zone 内每次队友攻击命中敌人 → 对应敌人挂 Balefire Bind + 自身 +1 Charge。
  # EN "after each attack an ally target uses on an enemy"——语义触发域按 EN 裁定为一切攻击行为；
  # 落点=被攻击敌人（$event.target 字段待实测，若无则须改 all_enemies 近似并标注失真）
  - event: "on_action"
    condition: "$event.actor != '1507' && actor_type_of($event.actor) != 'monster' && res__zone_on >= 1 && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "BALEFIRE_BIND"
          name: "Balefire Bind"
          modifier_type: "debuff"
          duration: 2                        # #8 全档恒 2；多源重复施加刷新/并存语义待实测
          dispellable: True
          stat_effects: {"def_pct": "-param(150703, 7)",
                          "vulnerability": "param(150703, 4)"}
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: 1

  # ── 大行迹1507102 充能源②：Zone 内自身被攻击 → 对攻击者挂 Balefire Bind + 自身 +1 Charge
  #（after_being_hit 通知事件；$event.source=攻击者）
  - event: "after_being_hit"
    condition: "$event.target == '1507' && res__zone_on >= 1"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.source"
        modifier:
          modifier_id: "BALEFIRE_BIND"
          name: "Balefire Bind"
          modifier_type: "debuff"
          duration: 2
          dispellable: True
          stat_effects: {"def_pct": "-param(150703, 7)",
                          "vulnerability": "param(150703, 4)"}
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: 1

  # ── 150704 满充兑现：Charge 满（9；E2 后 7）且 HP>1 → 扣 9、回能 #2、免费 Skill 使用 1 次
  #（trigger_action 插入档，action_type follow_up=150709）。判定事件 on_resource_gain 的
  # payload resource_id 字段待实测（若无则改挂充能源 hook 链尾自检）
  - event: "on_resource_gain"
    condition: "$event.resource_id == 'charge' && (res_charge >= 9 || (res_charge >= 7 && has_modifier($self, 'E2_CHARGE_CAP') >= 1)) && $self.hp > 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: "0 - (has_modifier($self, 'E2_CHARGE_CAP') >= 1 ? 7 : 9)"
                                     # 扣量=阈值同档（E2 阈值 7 扣 7——原恒扣 9 在 E2 下扣成负数，
                                     # 过堂钓出修正；满充判定与扣量同一表达式源防漂移）
      - effect_type: "gain_energy"
        amount: "param(150704, 2)"           # lv10 = 25（社区交叉 ✓）
      - effect_type: "trigger_action"
        action_id: "150709"                  # 追加技目标选择规则待实测

  # ── 大行迹1507102 ② Zone 内自身受伤降低 50%（#2 全档恒定）——before_take_damage waterfall
  # modify_amount（modify_amount 通道经遐蝶 E2 实证）；秘技减伤件同路径分件承载
  - event: "before_take_damage"
    condition: "$event.target == '1507' && res__zone_on >= 1"
    effects:
      - effect_type: "modify_amount"
        amount: "0.5 * $event.amount"
  - event: "before_take_damage"
    condition: "$event.target == '1507' && has_modifier($self, 'MORTENAX_TECH_DR') >= 1"
    effects:
      - effect_type: "modify_amount"
        amount: "0.1 * $event.amount"        # 秘技 #1：受伤降低 90%（全档恒定，单档字面值）

  # ── 大行迹1507102 ③ Zone 内受治疗量 +50%（#3 全档恒定；incoming_heal 受疗者池——遐蝶 E4 同通道）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "MORTENAX_INCOMING_HEAL"
          name: "Soul, Tempered ad Mortem·受疗"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "res__zone_on >= 1"
          stat_effects: {"incoming_heal": 0.5}

  # ── 大行迹1507103 ① Zone 内队友伤害 +50%（#1；E4 再 +50% 走 E4_TEAM_DMG 同池加算）。
  # 分叉（#2 有其他 Nihility 队友 → 队友终结技伤害 +75%；#3 否则自身伤害 +75%）待收——
  # "仅终结技"作用域乘区键未登记 [待实测]
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "MORTENAX_ZONE_TEAM_DMG"
          name: "Heart, Refined ad Infinitum"
          modifier_type: "buff"
          duration: 0
          effect_scope: "team"
          dispellable: False
          enable_if: "res__zone_on >= 1"
          stat_effects: {"all_dmg": 0.5}

  # ── 大行迹1507101 自净半：能量回满（达到 max_sp 160）时驱散自身全部 debuff。
  # on_gain_energy payload 与"回满"判定时机（含本次获得同帧结算）待实测。
  # 官方为『驱散自身全部 debuff』——max_count 逐目标 LIFO 截断数取大值承载全量（无 "all" 键）
  - event: "on_gain_energy"
    condition: "$self.energy >= 160"
    effects:
      - effect_type: "remove_modifier"
        filter: "$mod.kind == 'debuff'"
        max_count: 99

  # ── 大行迹1507101 保底半：战斗开始能量<75%(=120/160) 回至 75%——$self.energy 面板读取通道
  # 待实测；溢出能量（上限 80、Ultimate 后等量返还）无内建溢出登记通道，待收 [待实测]
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_energy"
        amount: "max(0, 120 - $self.energy)"

scaling_notes:
  - "全伤害基数 = Max HP（官方各技 desc + 社区 starguide 双证，ATK 无用）——所有 scaling/hook 伤害统一 hp 槽 × $self.max_hp"
  - "换技能（150701↔150708 普攻强化；150702 门槛化）：双 action available_if 互斥/门控声明（03_actor §3.8.1），纯合法性替换非形态机；150714 由 res__fury_on 门控（150703 授予）"
  - "150709 scaling 照抄官方 150709 params 第 1 列原值（全档 0.1，desc 为空占位）——与 150702 同名同 sub_tag 但官方未给继承明证，实际倍率待实测；hook 内 param(150709,x) 一律按 150709 原表取档"
  - "150706 断念一斩：场景/野外攻击入口（desc 无 params，战斗内入场削韧按对应弱点类型）——不入 actions 主循环，削韧值待实测 [待收]"
  - "倒计时实体（SPD 70 / E1 延后 15%）、溢出能量 80、仇恨权重 #1=10、大行迹3 分叉（作用域乘区键缺）、E2 重判标签、E6 ×150%（action 倍率覆写通道缺）：通道未登记或文本不足，全部挂头注待收清单"
  - "过堂修正记录：① BALEFIRE_BIND 防御符号（def_ +0.3=给敌方加防 → def_pct −param(150703,7)=减防 30%——初稿符号反）② 易伤 +50% 收编（vulnerability 在词表——初稿误判'易伤键未登记'）③ E2 满充扣量随阈值（初稿恒扣 9——E2 阈值 7 下扣成负数，改阈值同档表达式）"
