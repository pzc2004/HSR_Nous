  # apply_modifier TAUNT（action 层 apply_modifiers target 仅 all_enemies/self，单体目标须 hook 承载）；
  # 嘲讽强制命中级与免疫交互待实测
  - action_id: "150701"
    name: "残锋，掠尽"
    action_type: "basic"
    target_type: "single"
    damage_type: "fire"
    available_if: "res__fury_on < 1"         # 换技能互斥半（03_actor §3.8.1）：Infinite Fury 内变 150708
    scaling:                                 # lv1..lv10 照抄 150701 params（#1 Max HP 倍率）
      [{"hp": 0.25}, {"hp": 0.3}, {"hp": 0.35}, {"hp": 0.4}, {"hp": 0.45},
       {"hp": 0.5}, {"hp": 0.55}, {"hp": 0.6}, {"hp": 0.65}, {"hp": 0.7}]
    toughness_dmg: 10                        # 对轴（mys sub_tag）；精确值待实测
    skill_point_gain: 1                      # tbgd 权威：产点 +1
    energy_gain: 20                          # tbgd 权威

  # 150708 附加语义：Taunt 1 回合同 150701（共用 hooks 过滤 action_id 150701|150708）
  - action_id: "150708"
    name: "淬锋，断魄"
    action_type: "basic"
    target_type: "single"
    damage_type: "fire"
    available_if: "res__fury_on >= 1"        # 换技能互斥半：仅 Infinite Fury 内可用（与 150701 互补）
    scaling:                                 # lv1..lv10 照抄 150708 params（倍率为原版 2 倍）
      [{"hp": 0.5}, {"hp": 0.6}, {"hp": 0.7}, {"hp": 0.8}, {"hp": 0.9},
       {"hp": 1.0}, {"hp": 1.1}, {"hp": 1.2}, {"hp": 1.3}, {"hp": 1.4}]
