       {"hp": 0.1}, {"hp": 0.1}, {"hp": 0.1}, {"hp": 0.1}, {"hp": 0.1},
       {"hp": 0.1}, {"hp": 0.1}, {"hp": 0.1}, {"hp": 0.1}, {"hp": 0.1}]
    toughness_dmg: 10                        # 继承 150702 口径（mys sub_tag 完全一致）
    skill_point_cost: 0
