#
# **SP 消歧在案**：千冶•刃（1507）≠ 刃（1205）——同人物多实体，机制全按 1507
#   官方数据建模（欢愉侧新实体，与毁灭刃无共享件）
#
# 过堂修正四件（打标稿实证 bug）：① BALEFIRE_BIND 防御符号（def_ +0.3=给敌方加防
#   → def_pct −param(150703,7)=减防 30%——符号反）② 易伤 +50% 收编（vulnerability
#   在词表——初稿误判"易伤键未登记"）③ E2 满充扣量随阈值（初稿恒扣 9——E2 阈值 7
#   下扣成负数，改阈值同档表达式）④ 150709 随机段继承钩 !$event.insert 全哑
#  （B-MB①——150709 唯一入口 trigger_action insert=True，合写 insert 滤=死件；
#   拆条件 150709 免滤，1510 勘正⑦同族）
#
# 收录：终结技主链（耗 20% Max HP→Zone+Fury 闩+双暴件+Balefire Bind 敌方减防易伤）
#       / 免死解散（Fury 内致命 cancel+解散+回 50%）/ 换技能互斥（150701↔150708
#       available_if+150714 Fury 门控）/ 战技 AoE+4 段随机单体逐段削韧+耗 10% HP /
#       普攻 Taunt 1 回合 / 充能双源（队友命中+被攻击各 +1）/ 满充兑现（扣 9 回 25 能
#       +免费 150709 trigger）/ Zone 减伤 0.5×+秘技 0.1×+受疗 +50% /
#       大行迹1 自净（能量满驱散全 debuff）+保底 75% 能量 / E2 阈值 7 扣 7 /
#       E3/E5 等级族 / 秘技十方无赦（嘲讽+自身减伤 90%）
# 待收（均带挡因）：倒计时实体 SPD 70（Zone 解散时机——独立行动条目通道未登记）/
#       溢出能量 80 / 仇恨权重 #1=10（taunt 键）/ 大行迹3 分叉（作用域乘区键缺）/
#       E2 重判标签 / E6 ×150%（action 倍率覆写通道缺）/ 150709 倍率待实测
#       （params 第 1 列 0.1 为 desc 空占位原值）
