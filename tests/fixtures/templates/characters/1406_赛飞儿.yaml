# 角色模板：赛飞儿（1406）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging `data/annotator/staging/1406_赛飞儿.yaml`）+ 过堂勘正
# （staging→fixtures 合并流水线）。非加强名单角色（无双轨问题）；星魂名 E1-E6 已核
# `character_ranks.json`（无幻名）；倍率表已逐行对官方 params + tbgd（lv10=index 9）。
#
# ── 过堂勘正清单（staging 病 → 正解）────────────────────────────────────
# ① 战技「虚弱 + 自身 ATK+30%」staging 收录注释声称已收、全文件实无一钩 → 收录：
#    ATK+30% 走 action apply_modifiers self（引擎在伤害段前挂——官方「使赛飞儿攻击力
#    提高…并造成伤害」序同构）；虚弱走 on_action 钩挂主目标 dmg_dmg_reduction 0.1
#    （1107/1206 先例键——减伤乘区消费端在库）；相邻目标虚弱 → 待收（on_action 主/邻
#    区分通道缺，病族⑯）；120% 基础概率无 base_chance 通道 → 按必中写入（1006 银狼先例）。
# ② A6②「敌方全体受到伤害 +40%」+ E2「击中易伤 +30%」——staging 待收①挡因过期：
#    vulnerability 在案键（承伤区读目标面板——1222 灵砂/1507 先例）→ 全收。A6② 光环：
#    on_battle_start（首波）+ actor_enter（换波/召唤入场——覆盖 on_wave_start 与中途
#    入场两路）；E2：on_hp_decrease 赛飞儿命中即挂（CN「击中敌方目标时」全域含追加/
#    附加/秘技/真伤段——真伤段命中与否待实测），refresh 2 回合按必中。
# ③ 天赋追加攻击回能 5——staging 待收③挡因过期：gain_energy 原语在库（1306 星历先例）
#    → 收录（tbgd SPBase=5 权威值）。
# ④ 三百侠盗钩 target 侧 monster 判定写反（`!= 'monster'` → 我方互殴才触发、敌伤永不
#    计 8%）→ 正解 `== 'monster'`；同病 E1/E6 三处钩随重构消除（见⑤⑥）。
# ⑤ E6①「追加攻击伤害 +350%」staging 补偿段 = 递归死循环（hook deal_damage 伪行动
#    follow_up → on_hp_decrease 再进本钩，无闩，病族⑫）且乘区读法存疑 → 正解
#    eidolon stat_effects `dmg_follow_up_dmg_boost: 3.5`（CN「伤害提高350%」=增伤区
#    加算——1214 雪衣 E1/1305 真理医生同文先例；类型桶只命中伪 follow_up 段，E4 附加/
#    秘技/真伤段自然出集，零递归）。
# ⑥ E6③「清空后返还 20%」staging 独立 on_ultimate 钩读 res_tally——模板钩先于星魂
#    钩编译（build_compiler 1964→2022 行序），基础清空钩先跑、effects 读现场新值
#    （病族⑨）→ 永读 0 → 折入基础清空：set tally = 0.2×res__e6_flag×res_tally
#    （E6 闩——先清后返等值，E6 未激活=0 即官方「清空」）。
# ⑦ E4 触发域误抄天赋「我方其他目标」排除赛飞儿——官方 E4=「我方目标」含本人
#    （CN 原文核）→ 去 source 排除；E4 附加伤害补 category: "additional"（staging 缺——
#    伪行动落 follow_up 会误吃 E6 桶/误触 follow_up 族钩；additional 不吃类型限定增伤
#    正合 mechanics 02 §2.1）。
# ⑧ 秘技直接记账 raw atk（0.36×白值攻击，不吃防御/抗性/暴击区——高估约 2.2 倍）→
#    改 `$last.actual_amount / enemies_alive()` 按实伤承载（前序快照通道）；秘技伤害
#    补 category: "additional"（staging 缺——伪 follow_up 会误吃 E6 桶；进战伤害非任何
#    行动类，不吃类型桶正合）。
# ⑨ 终结技扩散真伤 staging 只对主目标除 3（总账 50%×tally）——官方「总计等同于记录值
#    75% 的真实伤害，由所有技能目标均分」少一半 → 改全体存活敌方池 + 0.75×tally/
#    enemies_alive()（≤3 敌与 Blast 集全等；4+ 敌多摊到非命中目标——相邻集通道缺
#    待实测/通道扩展）。
# ⑩ 终结技 #4 量子段：staging Blast scaling/scaling_blast 主目标只吃 #1——官方「对指定
#    敌方单体及其相邻目标造成 #4 量子」覆盖主目标 → instances 2 + instance_variants
#    （基底 single #1 削韧 30 = seg1；变体 blast #4 削韧 0 = seg2，相邻吃基底
#    scaling_blast #4/削韧 20——变体键闸不收 scaling_blast 只能挂基底）——主目标
#    120%+40%、相邻 40%，米游社削韧 30/20 对账。
# ⑪ 行迹平铺节点 staging「清单未收」挡因过期 → 取证 character_skill_trees 1406201-
#    1406210 收录 trace_stat_effects（spd+14 flat / dmg_quantum+0.144 / effect_hit+0.10）。
# ⑫ A6①「追加攻击暴伤 +100%」staging 全局 crit_dmg+1.0 误惠普攻/战技/终结技全段 →
#    撤下待收（crit_dmg 不在 hit_condition scoped 收录词表——伤害 scoped 只收 dmg_*/
#    all_dmg/vulnerability/res_pen；1223 貊泽同族挡因）。
# ⑬ 老主顾递补：staging 仅开局指派 + 战技/大招覆盖——官方「场上不存在【老主顾】时立即
#    指派生命上限最高敌」→ 补 on_kill（死者 modifier 未清账可判——engine._check_death
#    发 on_kill 时挂载仍在）+ on_wave_start 递补钩。
# ⑭ 三百侠盗钩漏乘 A2/E1 记录值增量（官方「获得的记录值提高」全域）→ 与基础记录钩同
#    乘式 + 补 min 钳（官方「不记录溢出伤害」同纪律）。
# ⑮ A2 记录值分档 staging 走 _tally_pct 资源 + 3 件 on_turn_start 钩（开局/秘技时点
#    仍是 0，且资源钩组冗余）→ 全部内联三元按 $self.spd 现场判档（压缩：资源 _tally_pct
#    与 6 件钩全退役；秘技记账早于一切模板钩——technique pre_hook 最先跑——内联后
#    开局即正确）。
# ── 收录 ────────────────────────────────────────────────────────────────
# 普攻 140601 / 战技 140602（Blast 主200%/邻100% lv10 + 虚弱 10% 减伤主目标 2 回合 +
#   自身 ATK+30% 2 回合）/ 终结技 140603（四段：#1 单体量子 120% + #2 单体真伤 25%×tally
#   + #4 主+邻量子 40% + #3 真伤 75%×tally 全体均摊，lv10；放完清空 tally）/
# 天赋 140604（老主顾单标记：无标记→最高 Max HP 敌、战技/终结技主目标覆盖、死亡/换波
#   递补；追加攻击 follow_up 强制指向老主顾、每回合 1 次、本人回合开始重置、回能 5、
#   削韧 20；tally 记录 12% 非真伤）/ 秘技 140607（进战全体 100% ATK 量子 + 该次记录
#   +200%——大世界隐身/加速/消耗品非战斗件不入）/ 大行迹 A2 神行宝鞋（SPD≥140 暴击
#   +25%/记录 +50%；≥170 暴击 +50%/记录 +100%——取代式分档）/ A4 三百侠盗（非老主顾
#   8%）/ A6② 偷天换日（敌方全体易伤 40% 常驻）/ E1（tally×1.5 + 追加攻击时 ATK+80%
#   2 回合）/ E2（击中易伤 30% 2 回合）/ E3/E5 等级族 / E4（老主顾受击后 50% ATK 量子
#   附加伤害）/ E6（追加攻击 +350% 增伤区 + 追加攻击非溢出伤额外记录 16% + 清空返还 20%）
# ── 待收（均带挡因）────────────────────────────────────────────────────
# ① A6① 追加攻击暴击伤害 +100%——crit_dmg 不在 hit_condition scoped 词表（1223 貊泽
#    同族挡因），全局烘焙误惠全段（宁缺勿假）
# ② 战技虚弱相邻目标件——on_action 主/邻区分通道缺（病族⑯；主目标已收）
# ③ E4 对追加攻击命中的触发——after_being_hit 仅 action 命中链发射，hook 伤害无此事件
#    （官方 E4「我方目标攻击后」含追加攻击；当前建模只对 action 命中触发）
# ④ E2 对 hook 伤害（追加/附加）的触发域同上——当前建模走 on_hp_decrease 全域已覆盖
#    （反而更全）；真伤段命中是否挂易伤待实测
# ⑤ 秘技进战伤害吃不到 A6 光环/E1 闩（装填预置序：technique pre_hook 先于一切模板钩——
#    官方光环常驻应先挂；差 1.4 区/1.5 系待实测）；秘技削韧 fandom/米游社全空保守 0
# ⑥ tally 上限口径（社区=老主顾 Max HP，保守 min 钳已承载）、溢出定义（过杀 HP 段不计——
#    on_hp_decrease 载荷无目标事前 HP，当前按 Max HP 缺口钳近似）、A2/E1/秘技/E6 各记录
#    系数的最终合成公式（乘加序）、天赋 #4=5（15 档全 5，desc 未引用）→ 待实测
# ⑦ 战技/终结技换目标覆盖老主顾的结算序——引擎 on_action 在伤害后（官方「施放时」读法
#    应先挂后伤：本次伤害对新老主顾应按 12% 计而非 8%）→ 待实测；tally 随老主顾切换
#    是否保留（官方仅「施放终结技后清空」）→ 待实测，当前按保留承载
# ⑧ E1 ATK 件与本次追加伤害的先后（当前星魂钩后于基础钩——本次追加攻击不吃本次 E1
#    攻击件，后续 2 回合内追加攻击吃）→ 待实测；E4 与追加攻击同事件内序（当前 E4 吃
#    E1 攻击件——E1 钩先于 E4 钩）→ 待实测
