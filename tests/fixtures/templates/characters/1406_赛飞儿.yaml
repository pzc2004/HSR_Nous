        target: "all_enemies"
        damage_type: "quantum"
        category: "additional"            # 勘正⑧：进战伤害非任何行动类——不吃类型限定增伤桶
        amount: "1 * $self.atk"           # （伪 follow_up 会误吃 E6 +350% 桶）；削韧 fandom/米游社空→保守 0
      - effect_type: "gain_resource"      # 该次伤害的记录值 +200%（#2=2）：老主顾 12% 通道（装填
        resource_id: "tally"              # 序——technique 先于老主顾指派钩，自然钩补不上本通道，
        amount: "param(140604, 2) * (1 + 2 + ($self.spd >= 170 ? 1 : ($self.spd >= 140 ? 0.5 : 0)) + 0.5 * res__e1_tally) * $last.actual_amount / enemies_alive()"
                                          # 按实伤直接入账——$last 前序快照=本秘技伤害合计 / 存活敌数
                                          # =单敌实伤（假人等值精确；异值敌按均值近似）；三百侠盗 8% 通道
                                          # 由自然钩双发（两敌此时均无标记）；合成序/双计口径待实测（头注⑤⑥）

actions:
  - action_id: "140601"
    name: "呀，漏网之鱼"
    action_type: "basic"
    target_type: "single"
    damage_type: "quantum"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    # lv6=90%（默认档，index 5）；lv10=140%；10 档，E3 +1（6→7 档内）
    toughness_dmg: 10
    skill_point_gain: 1     # tbgd+米游社一致：产 1 点
    energy_gain: 20         # tbgd 对轴：回能 20

  - action_id: "140602"
    name: "嘿，空手套白银"
    action_type: "skill"
    target_type: "blast"
    damage_type: "quantum"
    scaling: [{"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4},
              {"atk": 1.5}, {"atk": 1.625}, {"atk": 1.75}, {"atk": 1.875}, {"atk": 2.0},
              {"atk": 2.1}, {"atk": 2.2}, {"atk": 2.3}, {"atk": 2.4}, {"atk": 2.5}]
    # lv10=200%（第 10 行）；15 档（E5 +2 至 lv12 实取 2.2）
    scaling_blast: [{"atk": 0.5}, {"atk": 0.55}, {"atk": 0.6}, {"atk": 0.65}, {"atk": 0.7},
                    {"atk": 0.75}, {"atk": 0.8125}, {"atk": 0.875}, {"atk": 0.9375}, {"atk": 1.0},
                    {"atk": 1.05}, {"atk": 1.1}, {"atk": 1.15}, {"atk": 1.2}, {"atk": 1.25}]
    # lv10 相邻=100%（第 10 行）
    toughness_dmg: 20           # 米游社：主 20 / 相邻各 10
    toughness_dmg_blast: 10
    skill_point_cost: 1         # tbgd BPNeed sp_cost=1 为权威（米游社 sub_tag 缺"消耗"标判不一致，按 tbgd 裁决）
    energy_gain: 30             # tbgd 对轴：回能 30
    apply_modifiers:
      # 「使赛飞儿的攻击力提高 #5[i]%，持续 #4[i] 回合」——self buff（引擎副作用通道
      # 在伤害段前挂载——官方「提高…并造成伤害」序，本发战技自身吃得到）；基础概率 #6
      # 只管辖虚弱半（EN 措辞纪律——'base chance to Weaken ... and increases' 两段读）
      - target: "self"
        modifier_id: "SKILL_ATK_UP"
        name: "嘿，空手套白银"
        modifier_type: "buff"
        duration: 2
        dispellable: True
        stat_effects: {"atk_pct": "param(140602, 5)"}

  - action_id: "140603"
    name: "猫咪怪盗，敬上！"
    action_type: "ultimate"
    target_type: "single"       # 基底=seg1：#1 单体量子（官方「对指定敌方单体造成 #1」）
    damage_type: "quantum"
    energy_cost: 130            # 能量上限 130（常规能量槽——非特殊充能通道）
    instances: 2                # 勘正⑩：#4 覆盖主+邻——seg1 single #1 / seg2 blast #4
    instance_variants:
      - null                      # seg1 用基底（single #1，米游社主削韧 30）
      - {"target_type": "blast", "toughness_dmg": 0,   # seg2：#4 主+邻（基底 scaling_blast 同率）
         "scaling": [{"atk": 0.2}, {"atk": 0.22}, {"atk": 0.24}, {"atk": 0.26}, {"atk": 0.28},
                     {"atk": 0.3}, {"atk": 0.325}, {"atk": 0.35}, {"atk": 0.375}, {"atk": 0.4},
                     {"atk": 0.42}, {"atk": 0.44}, {"atk": 0.46}, {"atk": 0.48}, {"atk": 0.5}]}
    scaling: [{"atk": 0.6}, {"atk": 0.66}, {"atk": 0.72}, {"atk": 0.78}, {"atk": 0.84},
              {"atk": 0.9}, {"atk": 0.975}, {"atk": 1.05}, {"atk": 1.125}, {"atk": 1.2},
              {"atk": 1.26}, {"atk": 1.32}, {"atk": 1.38}, {"atk": 1.44}, {"atk": 1.5}]
    # 基底 scaling=#1（lv10 单体=120%，第 10 行）；15 档（E3 +2 至 lv12 实取 1.32/0.44）
    scaling_blast: [{"atk": 0.2}, {"atk": 0.22}, {"atk": 0.24}, {"atk": 0.26}, {"atk": 0.28},
                    {"atk": 0.3}, {"atk": 0.325}, {"atk": 0.35}, {"atk": 0.375}, {"atk": 0.4},
                    {"atk": 0.42}, {"atk": 0.44}, {"atk": 0.46}, {"atk": 0.48}, {"atk": 0.5}]
    # seg2 相邻=#4（lv10=40%——官方 #4 主邻同率；变体键闸只收 target_type/scaling/
    # damage_type/toughness_dmg——scaling_blast 只能挂基底，seg1 single 不消费）
    toughness_dmg: 30             # 米游社：主 30 / 相邻各 20（主削韧全在 seg1——对账 30+20×2）
    toughness_dmg_blast: 20       # seg2 相邻各 20
    skill_point_cost: 0
    energy_gain: 5                # tbgd 对轴：施放回能 5（行动级一次）
    # #2/#3 真伤段 + 清空 tally 走 hooks（on_ultimate——全段量子结算后发射，官方句序同构）

hooks:
  # ── 天赋·老主顾指派：战斗开始无标记 → 场上最高 Max HP 敌人成为老主顾
  #（order_by 降序 "-" 前缀——病族⑬；$it.max_hp 在案键；同值稳定序=编队首敌）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "enemies", order_by: "-$it.max_hp", take: 1, mode: "deterministic"}
        modifier:
          modifier_id: "PATRON"
          name: "老主顾"
          modifier_type: "debuff"
          duration: 0
          dispellable: False

  # ── 天赋·老主顾递补①：持有者死亡（engine._check_death 发 on_kill 时死者 modifier 未清账
  #    可判——勘正⑬）→ 存活最高 Max HP 敌递补；全灭空池=无事发生（换波由下钩接管）
  - event: "on_kill"
    condition: "has_modifier($event.target, 'PATRON') >= 1"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "enemies", order_by: "-$it.max_hp", take: 1, mode: "deterministic"}
        modifier:
          modifier_id: "PATRON"
          name: "老主顾"
          modifier_type: "debuff"
          duration: 0
          dispellable: False

  # ── 天赋·老主顾递补②：换波（旧波全灭标记随死者灭）→ 新波最高 Max HP 敌（on_wave_start
  #    在新敌布场后发射——engine._advance_wave_if_needed 序在案）
  - event: "on_wave_start"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "enemies", order_by: "-$it.max_hp", take: 1, mode: "deterministic"}
        modifier:
          modifier_id: "PATRON"
          name: "老主顾"
          modifier_type: "debuff"
          duration: 0
          dispellable: False

  # ── 天赋·老主顾覆盖：战技/终结技主目标成为新老主顾（单标记——「仅对最新被施加的目标
  #    生效」；先摘后挂同钩序）。引擎 on_action 在伤害结算后——覆盖序待实测（头注⑦）
  - event: "on_action"
    condition: "$event.actor == '1406' && ($event.action_id == '140602' || $event.action_id == '140603') && !$event.insert"
    effects:
      - effect_type: "remove_modifier"
        target: {pool: "enemies", where: "has_modifier($it, 'PATRON') >= 1"}
        modifier_id: "PATRON"
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "PATRON"
          name: "老主顾"
          modifier_type: "debuff"
          duration: 0
          dispellable: False

  # ── 战技·虚弱（勘正①）：主目标 10% 减伤 2 回合（dmg_dmg_reduction——减伤乘区，1107/1206
  #    先例）；120% 基础概率按必中写入（1006 银狼先例——无 base_chance 通道）；相邻件待收
  - event: "on_action"
    condition: "$event.actor == '1406' && $event.action_id == '140602' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "SKILL_WEAKEN"
          name: "虚弱"
          modifier_type: "debuff"
          duration: 2
          dispellable: True
          stack_mode: "refresh"
          stat_effects: {"dmg_dmg_reduction": "param(140602, 3)"}

  # ── 天赋·追加攻击计数重置：赛飞儿回合开始（官方「赛飞儿回合开始时重置可触发次数」）
  - event: "on_turn_start"
    condition: "$event.actor == '1406'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_fua_used"
        amount: 0

  # ── 天赋·追加攻击（140604 follow_up 通道——词表无 talent action_type，官方 Talent 攻击
  #    落 follow_up；hook deal_damage 承载，遐蝶 1140701 同先例）：老主顾受到**我方其他
  #    目标**（CN「我方其他目标」——不含赛飞儿本人）攻击后立即追加攻击；每回合至多
  #    param(140604,3)=1 次；回能 5（勘正③——gain_energy 在案）；削韧 20（米游社/tbgd）
  - event: "after_being_hit"
    condition: "has_modifier($event.target, 'PATRON') >= 1 && $event.source != '1406' && actor_type_of($event.source) != 'monster' && res__fua_used < param(140604, 3)"
    effects:
      - effect_type: "deal_damage"
        name: "热情好客的多洛斯人"
        target: "$event.target"
        damage_type: "quantum"
        amount: "param(140604, 1) * $self.atk"
        toughness_dmg: 20
      - effect_type: "gain_resource"
        resource_id: "_fua_used"
        amount: 1
      - effect_type: "gain_energy"
        target: "self"
        amount: 5               # tbgd SPBase=5（吃 ERR 常规口径——非豁免清单件）

  # ── 天赋·tally 记录：我方对老主顾造成的非真实伤害按 12%（lv10 #2）计入 tally；
  #    溢出不计（min 钳制于老主顾 Max HP 缺口——社区上限口径，待实测）；
  #    A2 增量内联三元（勘正⑮——SPD≥170:+1 / ≥140:+0.5，取代式分档）与 E1 ×1.5
  #    （0.5×res__e1_tally 闩）同乘；合成序待实测（头注⑥）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && has_modifier($event.target, 'PATRON') >= 1 && actor_type_of($event.source) != 'monster' && $event.damage_type != 'true'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "tally"
        amount: "min(param(140604, 2) * (1 + ($self.spd >= 170 ? 1 : ($self.spd >= 140 ? 0.5 : 0)) + 0.5 * res__e1_tally) * $event.amount, max(0, max_hp_of($event.target) - res_tally))"

  # ── 大行迹 A4「三百侠盗」（1406102）：非老主顾**敌方**目标（勘正④——target 侧 monster
  #    判定）被我方造成非真伤 → 记录 8%（溢出不计——min 钳同纪律；A2/E1 增量同乘——
  #    官方「获得的记录值提高」全域，勘正⑭；并池口径待实测）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && has_modifier($event.target, 'PATRON') < 1 && actor_type_of($event.target) == 'monster' && actor_type_of($event.source) != 'monster' && $event.damage_type != 'true'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "tally"
        amount: "min(0.08 * (1 + ($self.spd >= 170 ? 1 : ($self.spd >= 140 ? 0.5 : 0)) + 0.5 * res__e1_tally) * $event.amount, max(0, max_hp_of($event.target) - res_tally))"

  # ── 终结技真伤两段（140603 #2/#3，基数=tally 当前值）+ 清空/返还（勘正⑥⑨）。
  #    #2：对主目标造成 tally 的 25% 真伤（category true 跳乘区）；
  #    #3：总计 75%×tally 由所有技能目标均分——相邻集通道缺按全体存活敌池均摊
  #    （≤3 敌与 Blast 集全等；4+ 敌多摊待实测）；E6 闩：清空改返 20%（先清后返等值）
  - event: "on_ultimate"
    condition: "$event.source == '1406' && $event.action == '140603'"
    effects:
      - effect_type: "deal_damage"
        name: "猫咪怪盗，敬上！·真伤单点"
        target: "$event.target"
        damage_type: "true"
        category: "true"
        amount: "param(140603, 2) * res_tally"
      - effect_type: "deal_damage"
        name: "猫咪怪盗，敬上！·真伤均摊"
        target: {pool: "enemies"}
        damage_type: "true"
        category: "true"
        amount: "param(140603, 3) * res_tally / enemies_alive()"
      - effect_type: "set_resource"
        resource_id: "tally"
        amount: "0.2 * res__e6_flag * res_tally"

  # ── 大行迹 A6②「偷天换日」：赛飞儿在场时敌方全体受到伤害 +40%（vulnerability 在案
  #    键——勘正②；常驻无条件光环——首波 on_battle_start + 换波/召唤 actor_enter 两路）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "A6_SLEIGHT_OF_SKY"
          name: "偷天换日"
          modifier_type: "debuff"
          duration: 0
          dispellable: False
          stat_effects: {"vulnerability": 0.4}
  - event: "actor_enter"
    condition: "actor_type_of($event.actor) == 'monster'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "A6_SLEIGHT_OF_SKY"
          name: "偷天换日"
          modifier_type: "debuff"
          duration: 0
          dispellable: False
          stat_effects: {"vulnerability": 0.4}

  # ── 大行迹 A2「神行宝鞋」暴击率半：取代式分档（EN 并列双值读法；累加与否待实测）——
  #    enable_if 互斥门控（条件光环 04_modifier §4.16——速度变化现场变档）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "A2_CRIT_140"
          name: "神行宝鞋·140"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "$self.spd >= 140 && $self.spd < 170"
          stat_effects: {"crit_rate": 0.25}
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "A2_CRIT_170"
          name: "神行宝鞋·170"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "$self.spd >= 170"
          stat_effects: {"crit_rate": 0.5}

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN
eidolons:
  E1:
    name: "Read the Room, Seek the Glee"     # 察言观色看笑脸
    hooks:
      # ① 记录值为原记录值的 150%：落 _e1_tally 闩（记录钩乘式含 0.5×res__e1_tally——
      #    等值改写）；与 A2/秘技的合成序待实测
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e1_tally"
            amount: 1
      # ② 施放天赋的追加攻击时自身 ATK +80%（星魂字面值——param 层无轨），持续 2 回合；
      #    与天赋追加攻击同事件同触发条件（快照语义——病族⑨，两钩同过同不过）；
      #    结算序：本钩后于基础钩——本次追加攻击不吃本次攻击件（待实测，头注⑧）
      - event: "after_being_hit"
        condition: "has_modifier($event.target, 'PATRON') >= 1 && $event.source != '1406' && actor_type_of($event.source) != 'monster' && res__fua_used < param(140604, 3)"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_ATK_ON_FUA"
              name: "察言观色看笑脸"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 2
              dispellable: False
              stat_effects: {"atk_pct": 0.8}
  E2:
    name: "In the Fray, Nab On a Spree"      # 焦头烂额顺手牵
    hooks:
      # 击中敌方目标时 120% 基础概率使其受到的伤害 +30% 持续 2 回合（vulnerability 在案——
      # 勘正②）：on_hp_decrease 全域命中（普攻/战技/终结技/追加/附加/秘技——CN「击中」
      # 层裁定；真伤段命中与否待实测）；按必中写入（1006 银狼先例）；重复击中 refresh
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.source == '1406' && actor_type_of($event.target) == 'monster'"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "E2_VULN"
              name: "焦头烂额顺手牵"
              modifier_type: "debuff"
              stack_mode: "refresh"
              duration: 2
              dispellable: True
              stat_effects: {"vulnerability": 0.3}
  E3:
    name: "From Thin Air, Hard to Foresee"   # 无中生有难分辨
    skill_level_overrides: {"ultimate": 2, "basic": 1}   # 终结技+2、普攻+1
    notes:
      - "终结技+2 随档段：seg1/seg2 scaling 实取 lv12 档（#1=1.32/#4=0.44）；真伤两段 #2/#3 全档恒定 0.25/0.75（param() 随档引用，取档无观察差）"
      - "普攻+1：默认档 6→7（=1.0 倍率，10 档表内）；上限 10 无第 11 档——不脑补"
  E4:
    name: "The Jig Is Up, Quick to Flee"     # 东窗事发一溜烟
    hooks:
      # 老主顾受到我方目标攻击后（CN「我方目标」——含赛飞儿本人，勘正⑦），赛飞儿对其
      # 造成 50% ATK 量子**附加伤害**（category additional——不吃类型限定增伤桶，伪行动
      # 不冒 follow_up 误吃 E6 桶）；与天赋追加攻击同事件并行——官方未限定计数耦合，
      # 按字面各自独立；对追加攻击命中的触发待收（挡因头注③）
      - event: "after_being_hit"
        condition: "has_modifier($event.target, 'PATRON') >= 1 && actor_type_of($event.source) != 'monster'"
        effects:
          - effect_type: "deal_damage"
            name: "东窗事发一溜烟"
            target: "$event.target"
            damage_type: "quantum"
            category: "additional"
            amount: "0.5 * $self.atk"
  E5:
    name: "Safe in Numbers, Light as a Bee"  # 狡兔三窟轻如燕
    skill_level_overrides: {"skill": 2, "talent": 2}     # 战技+2、天赋+2
    notes:
      - "战技+2：140602 scaling/scaling_blast 实取 lv12 档（2.2/1.1）；虚弱/ATK buff 参数（#3/#4/#5/#6）全档恒定（param() 随档引用无观察差）"
      - "天赋+2：140604 追加攻击倍率实取 lv12 档（1.65——hook param(140604,1) 编译期定稿）；记录比例 12%、每回合次数 1 全档恒定"
  E6:
    name: "The Thief's Game, Unsung and Free"  # 大盗无名天地间
    stat_effects: {"dmg_follow_up_dmg_boost": 3.5}   # ① 追加攻击伤害 +350%（勘正⑤——增伤区
    # 类型桶，1214 雪衣 E1/1305 真理医生同文先例；只命中伪 follow_up 段=天赋追加攻击，
    # E4 附加/秘技/真伤段自然出集——零递归，staging 补偿段递归死循环已拆）
    hooks:
      # ② E6 闩（终结技清空返还 20% + 追加攻击额外记录 16% 两件门控——勘正⑥）
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e6_flag"
            amount: 1
      # ③ 记录时额外记录该次追加攻击造成的非溢出伤害的 16%（星魂字面值——伪 follow_up
      #    段只剩天赋追加攻击：真伤段 damage_type=true 出集、E4/秘技 additional 出集；
      #    与 12%/8% 通道及 A2/E1 系数的叠加序待实测——按字面独立 16% 承载）
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.source == '1406' && $event.action_type == 'follow_up' && actor_type_of($event.target) == 'monster' && $event.damage_type != 'true'"
        effects:
          - effect_type: "gain_resource"
            resource_id: "tally"
            amount: "min(0.16 * $event.amount, max(0, max_hp_of($event.target) - res_tally))"

scaling_notes:
  - 取档纪律：skill_params 行数=官方 params 行数（140601 10 行 / 140602-140604 15 行），index=等级-1；lv10=第 10 行，不许目测表尾
  - 天赋追加攻击编译落位：官方 type_text=Talent/Single Target，action_type 词表无 talent 键 → follow_up 语义（三月七反击族先例），以 hook deal_damage 通道承载（遐蝶 1140701 同构）；与战斗日志动作分类核对待实测
  - 天赋 #4=5（15 档全 5）官方 desc 未引用——语义待实测，不脑补、不落键
  - 终结技真伤均摊（勘正⑨）：官方「由所有技能目标均分」——目标代数无 adjacent 键 → 全体存活敌池均摊承载（≤3 敌精确，4+ 敌多摊待实测）
  - 追加攻击回能 5 已收（勘正③——gain_energy target=self）；削韧 20 随 deal_damage toughness_dmg 承担
  - tally 上限/溢出/并池/乘加序（头注⑥）：min 钳制按「该老主顾 Max HP」社区口径保守承载；A2(+50/+100)、E1(×1.5)、秘技(+200%)、E6(16%) 的最终合成公式待实测
  - 站位：全技能/行迹/星魂文本均无站位约束 → 无站位机制（反向确认待实测）；控制模型：回合玩家操控选目标，追加攻击/老主顾指派为规则驱动全自动；终结技时机需手动（社区 starguide："auto play wastes stored damage on overkill"）
  - 冲突裁决：战技 sp_cost 依 tbgd=1（BPNeed 权威；米游社 sub_tag 缺"消耗"标判不一致）；140606「攻击」为敌方/通用占位条目（params 空、sp/energy/toughness 全 0）不入 actions
