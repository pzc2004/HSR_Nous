# 靠近敌人随机消耗品每日 #4=50 次（账号级口径待实测）不入编译；进战件见下（唯一档
# params [15,2,1,50]，字面值——无等级轨道不引用 param()）
techniques:
  - technique_id: "140607"
    name: "穿靴子的猫"
    point_cost: 1
    effects:                              # 进战一次性（战前装填预置；施放者=赛飞儿）
      - effect_type: "deal_damage"        # 持有祝福进战：对全体敌人造成 100% ATK（#3=1）量子伤害
