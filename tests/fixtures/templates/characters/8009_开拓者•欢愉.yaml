#   ⑱ trigger_action/gain_energy 键名「待编译闸验证」挡因过期——在案（hooks.py 词表+
#     1306/1407 先例）。
#   附：星魂 E1-E6 EN 名核 character_ranks 全对（draft 罕见无幻名——EN 名照留、
#   CN 名补注，8010 双子同口径）；param 列映射与 15 档取档逐项对轴无误（族谱#1/#5 过）。
