# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 命名消歧：开拓者按命途写全称——本文件=欢愉命途开拓者（characters.json 该 cid
# name={NICKNAME} 为玩家昵称占位，官方显示名按米游社「开拓者•欢愉」）。同人物
# 另一实体：8010（异性主角同套件，双子模板——结构与勘正口径与 8010_开拓者•欢愉
# 对齐；同族消歧先例：三月七 1001≠1224）。
#
# 出处：打标 DAG 产物（staging 8009_{NICKNAME}.yaml）+ 过堂勘正（staging→fixtures
#   合并流水线）。数据源：StarRailRes（技能/星魂/行迹文本+params 逐项对轴——15 档表
#   lv10=index9 全表照抄无误读）+ fandom（普攻削韧 10/回 20/产 1 点、战技削韧 20/耗 1 点/
#   回 30、终结技能耗 160/回 5）+ 米游社开拓者笔记（削韧 10/20、能量 160 互证）+
#   tbgd（SP/能量权威；欢愉技 800920 回 5）+ docs/mechanics/08_elation_system.md
#   （欢愉体系规则：进战 20 点好活当赏 / 进战每欢愉角色 +1 笑点）+
#   sim_schema/docs/21_elation.md（欢愉体系未实装在案——elation 面板/punchline 乘区/
#   阿哈行动条均无引擎路径）+ 8010 双子过堂先例（结构对齐）。
#
# 过堂勘正十八件：
#   ① E3/E5 欢愉技等级轨漏（幻视族谱#18）——draft slo 只 {skill,talent}/{ultimate,basic}：
#     官方明文「欢愉技等级+1」→ 各补 follow_up:1（欢愉技=action_type/level_key follow_up
#     轨，1502 勘正⑧同族；引擎 levels.get(k,10)+v 同案）。draft E5 注「普攻实取 lv11
#     表尾档 1.4」同错——普攻默认 lv6，E5+1=lv7 实取 1.1，无越档（1501 勘正⑫同族）。
#   ② 行迹白值漏收（爻光勘正①同族）——draft trace_stat_effects 空块：小节点
#     crit_rate +12%（8009202/06/09）/crit_dmg +13.3%（8009204/08）/
#     atk_pct +28%（8009201/03/05/07/10）收编；大行迹 8009102 暴率 +15% 同通道折入
#     （crit_rate 合计 0.27——压缩优先，8010 双子同案）。
#   ③ 欢愉度 all_dmg 占位三处摘除（不脑补铁律）——秘技 30%/20%、行迹 8009101、E2 12%：
#     elation 面板键缺（21 章未实装，爻光同案），all_dmg 实吃增伤区=虚增伤害的假机制，
#     一律待收不留件（1501/1502/8010 先例：不造键不脑补）。
#   ④ chance() 死钩+秘技挂钩漏——draft TECH_* 两件落 on_battle_start 无条件全战斗触发
#     （秘技门全无=每场战斗白送 30%/20%），且 chance() 在 hook 域=编译期硬炸
#     （_check_no_hook_chance 病族闸——1009/1206/1209 实证）；秘技随机二选一正解
#     mechanic_chance，随③整体待收——空壳 techniques 块=死件同摘（8010 同案）。
#   ⑤ 欢愉技 800920 散装零成本 action（幻视族谱#15）——draft 无 available_if=免费
#     手动施放后门；正解 aha_turn 资源锚 + available_if "res_aha_turn >= 1"
#     （爻光勘正⑤先例；trigger_action 不过该闸，终结技触发路径不受影响）。
#   ⑥ deal_damage 通道错（爻光勘正⑮同族）——draft 天赋追加段/800920 九段用 amount
#     （ability_multiplier 基数直写槽——资源值即基数族）；正解 scaling_atk 倍率槽
#     （占位 ATK 基数，欢愉管线待收②）。
#   ⑦ 均摊段通道——draft hook 手写 amount/enemies_alive() 均摊 → action split: "even"
#     + scaling 单承收尾段（05_effects §split 分配轴在案——总伤按存活目标数均分；
#     1501 勘正①同族纪律：主段 action scaling 单承防双倍；8010 双子为 hook 手算分母
#     同数值解，原语口径差异在案待上游统一）。
#   ⑧ 好活当赏建模翻案——draft custom_resource（无时限、上限 999 脑补）：官方/§8.1
#     =持续 2 回合的层数账、多次合并 → modifier CERTIFIED_BANGER（爻光/8010 先例，
#     refresh 重挂加层同语义）；800902 +20 / 终结技分支 A +10 各档恒定字面
#     （param #2/#4 全档恒 20/10——modifier.stacks 只收 int 族谱#11）。
#   ⑨ 进战两件漏收——§8.1 进战欢愉角色 +20 好活当赏（2 回合）、§8.2 进战每欢愉角色
