#   ⑩ 终结技 target_type——draft "self" 近似；官方「指定我方单体」正解 ally_single
#     （1202/1217/8010 同族案；暴伤/净化/分支授予全走 $event.target——on_ultimate
#     载荷 target 在案，8010 勘正⑯）。
#   ⑪ 终结技净化收编——draft 待收「净化通道缺」挡因过期：正解 remove_modifier
#     filter "$mod.kind == 'control'"（1413/8010 先例——控制类子集，官方无数量上限
#     =max_count 99 清全部可驱散控制）。
#   ⑫ 终结技分支建模全收——draft 全待收：分支 A（"拥有欢愉技"以 path_of=='elation'
#     代理，8010 同案——欢愉命途≡持欢愉技在案待实测）好活当赏 +10（跨 actor
#     apply_modifier 在案）；分支 A 触发仅自身路径可定（trigger_action 跨 actor
#     target 键无消费端——指队友误放自身欢愉技=假机制，8010 勘正⑮同案；
#     指其他欢愉队友只发放不触发，触发路由待收③）；分支 B（path_of 非欢愉）
#     advance_action param×100=50（1306 先例）。
#   ⑬ 大行迹 2 SP 半件漏——「施放终结技后为我方恢复 1 个战技点」draft 标待收
#     → gain_skill_point 在案（1502 勘正⑨同案）收编。
#   ⑭ 阿哈咬它挂账域双错——draft `$event.actor != '8009'` 排除自身且未限我方（怪物
