custom_resources:
  punchline:
    name: "笑点（Punchline）"
    max: "inf"          # 上限待实测在案；全队共享口径待收④（16 章 scope:team 未消费——现 actor 账，爻光同案）
  aha_turn:
    name: "阿哈时刻接线锚"
    max: 1              # 阿哈时刻通道待收③——声明使 800920 available_if 可评估；接入前恒 0（非死件：available_if 实读，爻光同型）

# 秘技 800907 未落 techniques 块——唯一战斗效果=欢愉度增益（待收① elation 面板键缺），
# 空壳块=死件不留（勘正④；点消耗/概率阈值随该项一并待实测）

actions:
  - action_id: "800901"
    name: "此即应援"
    action_type: "basic"
    target_type: "single"
    damage_type: "thunder"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    # 10 档全表照抄官方 params（lv6=index5=100% ATK；lv10=index9=140%）
    toughness_dmg: 10       # fandom 10 + 米游社 sub_tag 削韧 10 + tbgd stance [30,0,0] 三源（勘正⑯）
    skill_point_gain: 1     # tbgd sp_gain +1（权威；fandom 同）
    skill_point_cost: 0
    energy_gain: 20         # tbgd +20（fandom/米游社一致）

  - action_id: "800902"
    name: "风暴甚是喧嚣"
    action_type: "skill"
    target_type: "aoe"
    damage_type: "thunder"
    scaling: [{"atk": 0.3}, {"atk": 0.33}, {"atk": 0.36}, {"atk": 0.39}, {"atk": 0.42},
              {"atk": 0.45}, {"atk": 0.4875}, {"atk": 0.525}, {"atk": 0.5625}, {"atk": 0.6},
              {"atk": 0.63}, {"atk": 0.66}, {"atk": 0.69}, {"atk": 0.72}, {"atk": 0.75}]
    # 15 档全表照抄官方 params（lv10=index9=60% ATK；E3 lv12=66%）
    toughness_dmg: 20       # fandom 20 + 米游社 sub_tag 削韧 20 双源（tbgd stance [0,60,0] 互证——勘正⑯）
    skill_point_cost: 1     # tbgd BPNeed sp_cost 1（权威；fandom 同）
    skill_point_gain: 0
    energy_gain: 30         # tbgd +30（fandom/米游社一致）
    # 自体获好活当赏 20 点走 hooks（EN "gains" 主语 Trailblazer 自身——modifier 层账勘正⑧）

  - action_id: "800903"
    name: "放心飞，开拓永相随！"
    action_type: "ultimate"
    target_type: "ally_single"   # 支援技：一名指定队友（含自身；勘正⑩——draft "self" 近似）
    damage_type: "none"          # 纯支援技无伤害段（爻光 150203 同型）
    energy_cost: 160             # 常规能量终结技：满 160 全额消耗（max_energy 同源）
    energy_gain: 5               # tbgd +5（fandom 同——释放后小额回能）
    toughness_dmg: 0
    skill_point_cost: 0
    skill_point_gain: 0
    resource_gain:
      punchline: 5               # #6 各档恒 5（爻光勘正⑬先例——action 通道并入，钩摘除）
    # 暴伤/净化/分支 A·B 全走 on_ultimate 钩（跨 actor 目标——action apply_modifiers
    # 的 target 词表只有 self/all_enemies，幻视族谱#16）

  - action_id: "800920"
    name: "我说欢愉，你耳朵聋吗？"
    action_type: "follow_up"     # 欢愉技——取档键=action_type follow_up 轨（爻光勘正⑧先例；词表无 elation_skill 键）
    target_type: "aoe"
    damage_type: "thunder"
    available_if: "res_aha_turn >= 1"   # 欢愉技仅阿哈时刻/终结技触发——通道待收③，封手动后门（勘正⑤；trigger_action 不过该闸）
    split: "even"            # 收尾段「由敌方全体均分」——分配轴在案（05_effects §split：总伤按存活目标数均分；勘正⑦）
    scaling: [{"atk": 0.3}, {"atk": 0.33}, {"atk": 0.36}, {"atk": 0.39}, {"atk": 0.42},
              {"atk": 0.45}, {"atk": 0.4875}, {"atk": 0.525}, {"atk": 0.5625}, {"atk": 0.6},
              {"atk": 0.63}, {"atk": 0.66}, {"atk": 0.69}, {"atk": 0.72}, {"atk": 0.75}]
    # 15 档全表照抄 #3 均摊倍率（lv10=index9=60% 总伤按存活敌数均分）——action scaling 单承；
    # 8 段随机单体 #2 见 hooks 逐段照抄（勘正⑥；欢愉伤害=ATK 基数占位，待收②）
    toughness_dmg: 0        # fandom/米游社均无该条——保守 0 待实测（tbgd stance [0,60,0] 在案，待收⑥）
    energy_gain: 5          # tbgd +5（权威——8010 双子同案；官方 desc 未明示待实测）
    skill_point_cost: 0
    skill_point_gain: 0

eidolons:
  E1:
    name: "Believe In the Light"   # CN：相信光的时间（character_ranks.json 核）
    hooks:
      # 施放战技后挂账：下次终结技使队友目标获得的好活当赏 +2，至多叠 3 层
      #（insert 闩不加——复制战技是否双计待实测，8010 同案）
      - event: "on_action"
        condition: "$event.actor == '8009' && $event.action_id == '800902'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_CB_ARMED"
              name: "相信光的时间"
              modifier_type: "buff"
              stacks: 1
              max_stack: 3
              stack_mode: "refresh"
              duration: 0
              dispellable: False
      # 兑现：终结技分支 A 的好活当赏 +2/层（官方"提高获得的【好活当赏】"——仅分支 A 有
      # 发放，故门欢愉路径；与 #4=10 加算方向待实测在案；模板钩先于星魂钩发射——
      # 分支 A 挂载已在，adjust_stacks 不落空，8010 同案）
      - event: "on_ultimate"
        condition: "$event.source == '8009' && $event.action == '800903' && path_of($event.target) == 'elation' && stacks($self, 'E1_CB_ARMED') >= 1"
        effects:
          - effect_type: "adjust_stacks"
            target: "$event.target"
            modifier_id: "CERTIFIED_BANGER"
            delta: "2 * min(stacks($self, 'E1_CB_ARMED'), 3)"
      # 清账：下次终结技后摘除（本钩序在兑现钩之后——delta 先按现场层数求值，族谱#9）
      - event: "on_ultimate"
        condition: "$event.source == '8009' && $event.action == '800903' && stacks($self, 'E1_CB_ARMED') >= 1"
        effects:
          - effect_type: "remove_modifier"
            modifier_id: "E1_CB_ARMED"
  E2:
    name: "History in the Making..."   # CN：名场面酝酿中……
    notes:
      - "终结技额外使一名指定队友欢愉度 +12%，持续 2 回合——待收①（elation 面板键缺；是否与暴伤同一目标：官方 one designated ally 字面独立——待实测，接入时同挂 $event.target 口径起步）"
  E3:
    name: "Into the Spotlight"   # CN：来吧，镜头的焦点
    skill_level_overrides: {"skill": 2, "talent": 2, "follow_up": 1}   # 官方：战技+2/天赋+2/欢愉技+1（勘正①——draft 漏欢愉技轨）
    notes:
      - "战技+2：800902 scaling 实取 lv12=0.66；天赋+2：追加段 param(800904,3) 实取 lv12=0.33；欢愉技+1：800920 各段实取 lv11（0.21/0.63）"
  E4:
    name: "Save the World. Just Because."   # CN：拯救世界，无需理由
    hooks:
      # 使用欢愉技时，敌方目标受到的伤害 +10%，持续 2 回合
      #（vulnerability 在案键——1502/1306/8010 先例，draft「键名未登记」挡因过期勘正⑮；
      # 命中域按全体敌收——随机段命中域待实测；on_action 结算后发射——当次不吃，待收⑦）
      - event: "on_action"
        condition: "$event.actor == '8009' && $event.action_id == '800920'"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E4_VULNERABILITY"
              name: "拯救世界，无需理由"
              modifier_type: "debuff"
              duration: 2
              dispellable: True
              stat_effects: {"vulnerability": 0.1}
  E5:
    name: "Love & Courage: Always in Style"   # CN：爱与勇气，永不过时
    skill_level_overrides: {"ultimate": 2, "basic": 1, "follow_up": 1}   # 官方：终结技+2/普攻+1/欢愉技+1（勘正①）
    notes:
      - "终结技+2：暴伤 param(800903,1) 实取 lv12=0.54；普攻+1：默认 lv6 → lv7 实取 1.1（勘正①——draft「lv11 表尾档 1.4」幻视）；欢愉技+1：800920 实取 lv12（0.22/0.66）"
  E6:
    name: "The Cosmic Legend Cometh!"   # CN：银河传奇，登场！
    hooks:
      # 使用欢愉技时，本单位暴击伤害 +100%，持续 3 回合
      #（on_action 结算后发射——当次欢愉技不吃、下次起吃，待收⑦；官方时序待实测）
      - event: "on_action"
        condition: "$event.actor == '8009' && $event.action_id == '800920'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_CRIT_DMG"
              name: "银河传奇，登场！"
              modifier_type: "buff"
              duration: 3
              dispellable: True
              stat_effects: {"crit_dmg": 1.0}

hooks:
  # 进战两件（勘正⑨）：① §8.2 每有 1 名欢愉角色 +1 笑点（count_team 命途计数正用）；
  # ② §8.1 欢愉角色进战 +20 点好活当赏（持续 2 回合——modifier 层账勘正⑧；refresh
  # 重挂加层=「多次好活当赏笑点值合并计算」同语义；阿哈时刻结算授予随待收③接线；
  # 进战笑点 +1/名 已归引擎原生统发——B40 P2b _init_aha，本钩不再重复发放）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CERTIFIED_BANGER"
          name: "好活当赏"
          modifier_type: "buff"
          duration: 2              # §8.1 持续 2 回合（8009 侧无延时件——爻光 +1 为行迹 1502103 专有）
          stacks: 20               # §8.1 进战 20 点（modifier.stacks 只收 int 字面量——族谱#11）
          max_stack: 999           # 上限官方未明示——保守 999 待实测（待收④）
          dispellable: False

  # 800902 战技：自身获得 #2=20 点好活当赏（EN "gains" 主语 Trailblazer 自身；
  # param(800902,2) 全档恒 20 → 字面值，族谱#11；重挂加层+时长取大=合并/续期同语义）
  - event: "on_action"
    condition: "$event.actor == '8009' && $event.action_id == '800902'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CERTIFIED_BANGER"
          name: "好活当赏"
          modifier_type: "buff"
          duration: 2
          stacks: 20
          max_stack: 999
          dispellable: False

  # 8009103 阿哈咬它！·清账：战技施放时兑现并摘除（钩序在战技发放钩之后——未持
  # 好活当赏时先挂后调，adjust_stacks 不落空；condition 读事件开始旧值——挂账层数
  # 不受本事件发放影响，族谱#9 两域各就其位；8010 同案）
  - event: "on_action"
    condition: "$event.actor == '8009' && $event.action_id == '800902' && stacks($self, 'AHA_SIC_EM_ARMED') >= 1"
    effects:
      - effect_type: "adjust_stacks"
        target: "self"
        modifier_id: "CERTIFIED_BANGER"
        delta: "2 * stacks($self, 'AHA_SIC_EM_ARMED')"
      - effect_type: "remove_modifier"
        modifier_id: "AHA_SIC_EM_ARMED"

  # 800904 天赋·攻击后：回能 10 + 笑点 3（官方「施放攻击后」——800903 支援技非攻击
  # 出集勘正⑰；insert 闩不加——欢愉技同属攻击，爻光勘正③同案，待实测在案）
  - event: "on_action"
    condition: "$event.actor == '8009' && $event.action_type != 'ultimate'"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: "param(800904, 1)"
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: "param(800904, 2)"

  # 800904 天赋·追加段：持有好活当赏时，战技对敌方全体额外造成 #3%（lv10=0.3）雷属性
  # 欢愉伤害（勘正⑥ scaling_atk 倍率槽——占位 ATK 基数待收②；condition 读事件开始
  # 旧值=「持有时」施放判定族谱#9，战技本发的好活当赏不喂本发追加——文本序伤害在
  # 先获得在后一致；「按我方最高好活当赏值计算」跨 actor 最大值读取待收②；
  # deal_damage 不发 on_action 无递归——族谱#12 免闩）
  - event: "on_action"
    condition: "$event.actor == '8009' && $event.action_id == '800902' && has_modifier($self, 'CERTIFIED_BANGER') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "英雄一笑，生死难料"
        target: "all_enemies"
        damage_type: "thunder"
        scaling_atk: "param(800904, 3)"

  # 800903 终结技·主干：指定队友暴击伤害 +#1%（lv10=0.5），持续 3 回合（#2 恒 3 int 直给）
  # + 净化控制类 debuff（勘正⑪——$mod.kind=='control'；蒙福者烘焙：数值恒档字串
  # 烘焙无随层件，stat_effects 通道合法——族谱#10 不适用；官方无数量上限=max_count 99）
  - event: "on_ultimate"
    condition: "$event.source == '8009' && $event.action == '800903'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"      # 玩家指定队友；on_ultimate 载荷 target 在案（勘正⑩）
        modifier:
          modifier_id: "ULT_CRIT_DMG"
          name: "放心飞，开拓永相随！"
          modifier_type: "buff"
          duration: 3                # param(800903,2)=3 全档恒定，duration 为 int 直给不写 param()
          dispellable: True
          stat_effects: {"crit_dmg": "param(800903, 1)"}
      - effect_type: "remove_modifier"
        target: "$event.target"
        filter: "$mod.kind == 'control'"
        max_count: 99
        reason: "cleanse"

  # 8009102 跟你爆了：施放终结技后为我方恢复 1 战技点（勘正⑬——gain_skill_point 词表
  # 实名；生效时序（释放即刻/结算末）待实测在案）
  - event: "on_ultimate"
    condition: "$event.source == '8009' && $event.action == '800903'"
    effects:
      - effect_type: "gain_skill_point"
        amount: 1

  # 800903 终结技·分支 A 发放（目标拥有欢愉技）：额外 +10 点好活当赏（#4 全档恒 10
  # 字面值，族谱#11；跨 actor apply_modifier 通道在案）；"拥有欢愉技"以
  # path_of=='elation' 代理（官方判据为技能持有，代理待实测——欢愉命途≡持欢愉技在案，
  # 8010 同案）
  - event: "on_ultimate"
    condition: "$event.source == '8009' && $event.action == '800903' && path_of($event.target) == 'elation'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "CERTIFIED_BANGER"
          name: "好活当赏"
          modifier_type: "buff"
          duration: 2
          stacks: 10
          max_stack: 999
          dispellable: False

  # 800903 终结技·分支 A 触发（目标=自身）：立即施放欢愉技 1 次（trigger_action 跨
  # actor target 通道缺——仅自身路径可定勘正⑫/待收③；「固定计入 #5=20 笑点」为结算
  # 口径非发放——不落 gain_resource，随欢愉管线待收②；指其他欢愉队友只发放不触发）
  - event: "on_ultimate"
    condition: "$event.source == '8009' && $event.action == '800903' && path_of($event.target) == 'elation' && $event.target == '8009'"
    effects:
      - effect_type: "trigger_action"
        action_id: "800920"

  # 800903 终结技·分支 B（目标没有欢愉技）：行动提前 #3=50%（advance_action amount
  # 百分数口径——param×100；跨 actor target 通道在案）
  - event: "on_ultimate"
    condition: "$event.source == '8009' && $event.action == '800903' && path_of($event.target) != 'elation'"
    effects:
      - effect_type: "advance_action"
        target: "$event.target"
        amount: "param(800903, 3) * 100"

  # 800920 欢愉技·随机八段（勘正⑥ scaling_atk 倍率槽——占位 ATK 基数待收②）：#1=8 段
  # 每段随机一名敌人 #2%（expected 模式 random 确定化=按序取首敌；可否重复命中同敌/
  # 随机池是否含已败目标待实测）；收尾 #3% 均摊段由 action split:even + scaling 单承
  #（勘正⑦）；无 insert 闩——终结技触发（insert=True）与阿哈时刻同发射
  - event: "on_action"
    condition: "$event.actor == '8009' && $event.action_id == '800920'"
    effects:
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        scaling_atk: "param(800920, 2)"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        scaling_atk: "param(800920, 2)"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        scaling_atk: "param(800920, 2)"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        scaling_atk: "param(800920, 2)"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        scaling_atk: "param(800920, 2)"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        scaling_atk: "param(800920, 2)"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        scaling_atk: "param(800920, 2)"
      - effect_type: "deal_damage"
        name: "我说欢愉，你耳朵聋吗？·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        scaling_atk: "param(800920, 2)"

  # 8009103 阿哈咬它！·挂账：我方目标施放欢愉技后挂账（勘正⑭——actor_type 限我方；
  # 无 insert 闩——欢愉技典型 insert 闩反杀真实触发源；"ally"含自身——爻光「我方
  # 目标含自身」同案待实测；欢愉技→follow_up 代理判定——任意我方追加攻击均挂账在案；
  # 账可叠层 max 99——多笔叠加口径待实测，8010 同案）
  - event: "on_action"
    condition: "actor_type_of($event.actor) != 'monster' && $event.action_type == 'follow_up'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "AHA_SIC_EM_ARMED"
          name: "阿哈咬它！"
          modifier_type: "buff"
          stacks: 1
          max_stack: 99
          duration: 0
          dispellable: False

