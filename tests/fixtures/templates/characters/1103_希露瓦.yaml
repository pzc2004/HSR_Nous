# 角色模板：希露瓦（1103）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂收编/勘正三件：① 触电件 modifier_type dot→debuff——native DoT 声明式
#   通道未接线（modifier spec 键表无 dot_element/dot_ratio/dot_source_atk，
#   1005 卡芙卡同案）；"dot" 类型会被 native ticker 按 dot_ratio 0 结算=零值
#   跳伤日志噪音，现以 debuff 标记 + on_turn_start 事件跳伤承载（口径与官方
#   DoT 不暴击偏差在案——1005 同族）。
#   ② 终结技触电延长 refresh 重写 → adjust_duration +2 收编——原语在库
#   （05_effects 已收编，时长 ±N ≠ refresh；draft 重写 duration 4/5，剩 1
#   回合时官方延长=3 与重写=4 不等价）。
#   ③ E2 谓词两层勘正——count 是 len(x) 单参（缇宝族），draft 写
#   count('enemies', 'filter') 双参=TypeError 吞 ⚠ 死钩；who_has 仅查我方
#   （跳过怪物）触电在敌方仍死钩；全域"任一敌方触电"谓词缺 → 目标粒度
#   近似承载（打未触电目标但其他敌人触电时不回能=低估，在案）。
#
# 收录：普攻 / 战电光石火间（Blast 主 1.4 邻 0.6 + 双目标触电挂载 2 回合）/
#       触电跳伤（param(110302,5) lv10=1.04×ATK）/ 终结技（AoE 1.8 + 两族
#       触电延长 +2）/ 天赋燃情和弦（自身行动后对全体触电者 0.72×ATK）/
#       行迹 Rock'n'Roll（触电概率 80%+20%=恒中）/ String Vibration（开战
#       +15 能）/ Mania（击杀 ATK+20% 二回合）/ E1 普攻溅射 0.6×普攻倍率 /
#       E2 触电在场自身行动 +4 能 / E3/E5 等级族 / E4 大招补挂未触电者 /
#       E6 雷伤命中触电者 +30% 真伤段
# 待收（均带挡因）：触电命中 EHR×抗性稀释公式（社区公式非官方明文）/
#       战技/E4/击破触电独立实例（同 id 覆盖语义待实测）/ E6 +30% 乘区归属
#       （真伤压缩承载——独立乘区 vs 原伤害% 待实测）/ 削韧值官方未载
#       （fandom 典型值待实测）
