  - "行迹1「Rock 'n' Roll」（1103101）：战技施加触电基础概率 +20%（params_max [0.2]，无等级轨道）→ 80%+20% = 100% 基础概率，故战技触电挂载无概率门（恒中，不走 chance()）。若引入效果命中/抗性稀释（社区通用公式：基础概率×(1+效果命中)×(1-效果抵抗)×(1-特殊抵抗)——非官方明文），需在 apply_modifier 侧补概率通道【官方 params + 社区】"
  - "行迹2「String Vibration」（1103102）：战斗开始立即回复 15 能量（params_max [15]，on_battle_start 钩）；是否受能量恢复效率加成【待实测】（当前裸 +15）【官方】"
  - "行迹3「Mania」（1103103）：消灭敌人后攻击力 +20%（params_max [0.2]），持续 2 回合（duration int 直给 2）【官方】"
  - "无免死/免疫/生命比例转换类行迹（该类机制在专属光锥层，非本角色）【官方文本核查】"
