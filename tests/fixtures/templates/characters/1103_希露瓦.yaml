# 天赋 110304「燃情和弦」：不建 action（action_type 词表无 talent 键）——被动附加伤害
# 落 hooks（on_action → 对全体触电者 deal_damage），见下方 hooks 块

eidolons:
  E1:
    name: "回声琴房"
    hooks:
      - event: "on_action"
        condition: "$event.actor == '1103' && $event.action_type == 'basic' && !$event.insert"
        effects:
          - effect_type: "deal_damage"
            name: "回声琴房"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "thunder"
            amount: "0.6 * param(110301, 1) * $self.atk"
  E2:
    name: "安可！"
    hooks:
      # 场上有触电时自身行动 +4 能——谓词两层勘正（过堂）：① count 是 len(x) 单参
      #（缇宝族），draft 写 count('enemies', 'filter') 双参=TypeError 吞 ⚠ 死钩；
      # ② who_has 仅查我方（注释"持有指定 modifier 的我方单位"——跳过怪物），
      # 触电在敌方=恒 '' 仍死钩；全域"任一敌方触电"谓词缺 → 目标粒度近似承载
      #（口径在案：官方"场上存在触电"全域——本次打未触电目标但其他敌人触电时
      # 不回能=低估，全域谓词通道到位后换回）
      - event: "on_action"
        condition: "$event.actor == '1103' && !$event.insert && ($event.action_type == 'basic' || $event.action_type == 'skill' || $event.action_type == 'ultimate') && (has_modifier($event.target, 'SHOCK_SKILL') >= 1 or has_modifier($event.target, 'SHOCK_TECH') >= 1)"
        effects:
          - effect_type: "gain_energy"
            amount: 4
  E3:
    name: "震耳欲聋"
    skill_level_overrides: {"skill": 2, "basic": 1}
    notes:
      - "战技+2 随档段：主/相邻倍率（action scaling 实取 lv12 档）+ 触电 DoT param(110302,5)；普攻+1 实取 lv7 档（10 档表 index=6）"
  E4:
    name: "尽情摇滚！"
    hooks:
      - event: "on_action"
        condition: "$event.actor == '1103' && $event.action_type == 'ultimate' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "enemies", where: "has_modifier($it, 'SHOCK_SKILL') < 1 && has_modifier($it, 'SHOCK_TECH') < 1"}
            modifier:
              modifier_id: "SHOCK_SKILL"
              name: "触电·E4"
              modifier_type: "debuff"
              duration: 2
              dispellable: True
  E5:
    name: "翻台重来"
    skill_level_overrides: {"ultimate": 2, "talent": 2}
    notes:
      - "终结技+2 随档段：全体倍率（action scaling 实取 lv12 档）+ 触电延长回合 #2（恒 2，无观察差）；天赋+2 随档段：附加伤害 param(110304,1) 实取 lv12 档"
  E6:
    name: "这首歌唱到天上！"
    hooks:
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.source == '1103' && $event.damage_type == 'thunder' && (has_modifier($event.target, 'SHOCK_SKILL') >= 1 || has_modifier($event.target, 'SHOCK_TECH') >= 1)"
        effects:
          - effect_type: "deal_damage"
            name: "这首歌唱到天上！"
            target: "$event.target"
            damage_type: "true"
            category: "true"
            amount: "0.3 * $event.amount"

hooks:
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && $event.source == '1103' && $event.action_type == 'skill' && actor_type_of($event.target) == 'monster'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "SHOCK_SKILL"
          name: "触电"
          modifier_type: "debuff"
          duration: 2
          dispellable: True

  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'SHOCK_SKILL') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "触电"
        target: "$event.actor"
        damage_type: "thunder"
        amount: "param(110302, 5) * $self.atk"

  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'SHOCK_TECH') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "触电·秘技"
        target: "$event.actor"
        damage_type: "thunder"
        amount: "0.5 * $self.atk"

  - event: "on_ultimate"
    condition: "$event.source == '1103'"
    effects:
      # 触电延长 2 回合（110303 #2=2 全档恒）——过堂收编：adjust_duration 原语在库
      #（05_effects 已收编——时长 ±N ≠ refresh；draft 用 refresh 重写 duration 4/5，
      # 剩 1 回合时官方延长=3 与重写=4 不等价）
      - effect_type: "adjust_duration"
        target: {pool: "enemies", where: "has_modifier($it, 'SHOCK_SKILL') >= 1"}
        modifier_id: "SHOCK_SKILL"
        delta: 2
      - effect_type: "adjust_duration"
        target: {pool: "enemies", where: "has_modifier($it, 'SHOCK_TECH') >= 1"}
        modifier_id: "SHOCK_TECH"
        delta: 2

  - event: "on_action"
    condition: "$event.actor == '1103' && !$event.insert && ($event.action_type == 'basic' || $event.action_type == 'skill' || $event.action_type == 'ultimate')"
    effects:
      - effect_type: "deal_damage"
        name: "燃情和弦"
        target: {pool: "enemies", where: "has_modifier($it, 'SHOCK_SKILL') >= 1 || has_modifier($it, 'SHOCK_TECH') >= 1"}
        damage_type: "thunder"
        amount: "param(110304, 1) * $self.atk"

  - event: "on_battle_start"
    effects:
      - effect_type: "gain_energy"
        amount: 15

  - event: "on_kill"
    condition: "$event.source == '1103'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "MANIA_ATK"
          name: "狂热"
          modifier_type: "buff"
          duration: 2
          dispellable: True
          stat_effects: {"atk_pct": 0.2}

scaling_notes:
  - "天赋 110304 不建 action（action_type 词表无 talent 键）——官方 type_text=Talent、effect_text=Enhance，机制为被动附加伤害，落 on_action hook（伪行动类别不声明）"
  - "触电实例族：SHOCK_SKILL（战技/E4，DoT param(110302,5)）与 SHOCK_TECH（秘技，DoT 0.5）两族并存；modifier_type 过堂勘正 dot→debuff（native DoT 声明式通道未接线——modifier spec 键表无 dot_element/dot_ratio/dot_source_atk，1005 卡芙卡同案；'dot' 类型会触发 native 零值跳伤日志噪音，现以 debuff 标记+事件跳伤承载）；终结技延长两族 adjust_duration +2 收编（≠refresh 重写——draft 重写 4/5 与官方'延长 2 回合'不等价）。战技/E4/击破触电是否互为独立实例【待实测】——当前同 id 即同族覆盖（不叠加双 DoT）"
  - "基数区全部为希露瓦自身 ATK（普攻/战技/终结技/天赋/触电 DoT/E1 溅射/秘技段同源），统一 $self.atk（stat_of 同义通道）；无生命/防御基数段"
  - "削韧值（普攻 10 / 战技 20+10 / 终结技 20 / 秘技 20）除秘技 mys_sub_tag「削韧 20」有社区标外均为 fandom 典型值，官方文本未载——【社区/待实测】，首个实测样本到位后校正"
  - "E1 触发面按 action_type == 'basic' 圈定（on_hp_decrease 类事件载荷无 action_id 字段，一律以 action_type 判定技能来源）【官方载荷 + 实测待补】"
  - "E6 +30% 乘区归属（全伤增伤 vs 独立乘区 vs 原伤害%）官方未明示——按真伤段 0.3×$event.amount 压缩承载【待实测】"
