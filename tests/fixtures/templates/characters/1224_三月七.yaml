# 角色模板：三月七（1224）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂勘正八件（staging+fixture 同步）：
#   ① 战技 target_type single→ally_single（同族案第 9 次）
#   ② mechanic_chance('_hit_chance')→mechanic_chance(res__hit_chance)——
#     字符串参数 float() 必炸死钩（追加段永不触发）；res 平铺键才是正解
#     （银狼可变概率族——概率载体=自定义资源）
#   ③ E2 分支并入主钩——draft 独立钩 condition res__e2_used == 1 被同事件
#     快照挡死（主钩 set 1 在快照后=恒假，永不分支）；分支段改 DPS 门控
#     表达式（min(1, has_modifier(...)) 数值门）并入
#   ④ 命途枚举删 remembrance/elation——官方文本 DPS 分支=智识/毁灭/巡猎
#     三命途（2.4 定）；draft 擅自加记忆/欢愉=脑补（违命名两态原则）；
#     「记忆/欢愉是否后续加入分支」待实测在案，不脑补
#   ⑤ 支援分支削韧+100% 翻案收录（draft 误判「逐行动削韧倍率通道缺」——
#     break_efficiency_boost 在库（承伤三区通用化③）；官方无类型限定=全域）
#   ⑥ _hit_chance 初始化挪 on_battle_start（0.6）+on_ultimate（0.8）——
#     draft 挂 on_action 122408（与追加判定钩同事件——emit 快照读初值 0
#     =追加段永不触发，1214/1221 同族快照案）
#   ⑦ 追加段链重构——draft 三钩链（res__extra_hits 计数闸）被同事件快照
#     挡死（计数 set 在快照后，`>= 1/2` 恒假=每次施放只触发追加 1）；
#     正解 amount 三元内联 mechanic_chance（快照族① effects 读现场——
#     快照免疫、roll 各段独立掷、cap 3 写死；0 伤段 log 噪音在案）
#   ⑧ 摘除挪主结算钩最后+追加段回无门控钩——draft 先摘后打=段 2/3/追加
#     段吃不到增伤（官方天赋「直到施放强化普攻」=该次全程吃）；且追加段
#     若在 436 钩（ULT_ARMED 门控）会把基础概率 0.6 的追加也挡掉、436
#     不触发连摘除也不执行（ENHANCED_DMG 漏摘）
#
# 收录：普攻荡涤妖邪琉璃剑（lv6=1.0+命中 +1 Charge+DPS 分支附加 0.2）/
#       战技师父请喝茶（挂 Shifu+速度 +10% lv10+命途记名双分支+DPS 分支
#       附加/SUP 分支削韧效率+100%）/ 终结技盖世女侠（2.4 lv10+ULT_ARMED：
#       下次强化普攻段 +2+追加概率 0.8）/ 天赋 Charge 满 7（拉条 100%+
#       增伤 80% lv10 直到下次强化普攻+强化普攻换技 available_if 互斥）/
#       强化普攻一扎眉攒二扎心（初始 3 段 lv6 0.8+概率追加至多 3 段
#       （mechanic_chance 可变概率 0.6/0.8））/ 大行迹燕举（进场拉条 25%）/
#       驭澜（强化普攻后 Shifu 暴伤+60%+击破特攻+36% 2 回合）/ 秘技
#       Charge+3+回 30 能 / E1 Shifu 在场速度+10% / E2 Shifu 普攻/战技后
#       追加 60%+1 Charge（闩 1 回合）/ E3/E5 等级族 / E4 回合开始回 5 能 /
#       E6 大招后下次强化普攻暴伤+50%
# 待收（均带挡因）：秘技 122406 进战削韧（攻击型秘技削韧通道缺）/
#       1224102 削韧元素动态扩展与击破类型覆写 / 分支元素跟随 Shifu
#       属性（动态元素槽——element_of(who_has('SHIFU')) 族可解未收）/
#       Charge 满 7 拉条语义（额外回合 vs 拉条 100%）/ E2 无主目标兜底 /
#       行迹属性节点（未下发）
actor_id: "1224"
name: "三月七"
level: 80
path: "the_hunt"        # 命途（count_team 编成计数口径；Shifu 分支判读走 path_of）
groups: ["faction:astral_express"]
element: "imaginary"    # 元素（element_of 取数源；官方数据照抄）
base_stats:
  hp: 1058.4
  atk: 564.48
  def: 441
  spd: 102
  crit_rate: 0.05       # 管线实值（无行迹暴击率节点数据在案——社区页一律以此终审）
  crit_dmg: 0.5         # 管线实值（E6/行迹 1224103 走 modifier 通道不并入）
  max_energy: 110       # 能量上限（官方参数 + 米游社 sub_tag「能量 110」双源一致）
trace_notes:
  - "大行迹 1224101「燕举 Swan Soar」已收：战斗开始行动提前 25%（字面值 0.25，无等级轨道）"
  - "大行迹 1224103「驭澜 Tide Tamer」已收：强化普攻后 Shifu 暴击伤害 +60%、击破特攻 +36%，持续 2 回合（字面值 0.6/0.36/2；duration 直给 int）；break_effect 键名按常规白值口径，若编译闸键表不符以实测/键表回改"
  - "大行迹 1224102「镂云 Filigree」待收——挡因：①可削减弱点属性 = Shifu 战斗属性的敌人的韧性，需要削韧元素类型动态扩展通道（action 层 damage_type 与削韧元素解耦通道缺）；②触发弱点击破时始终按虚数弱点击破效果结算，需要击破类型覆写通道（on_break 结算类型改写缺）。与战技 #3 削韧 +100% 的加算/乘算关系亦待实测"
  - "战技辅助命途分支（同谐/虚无/存护/丰饶 → 削韧 +100%，122402 #3=1）待收——挡因：action 层无逐行动削韧倍率槽，hook 侧 deal_damage toughness_dmg 为直给整数无倍率槽；数值档位已照抄入 skill_params 随档留存，通道到位后接 param(122402, 3)"
trace_stat_effects: {}

