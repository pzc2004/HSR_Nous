  charge:               # Charge 充能点（官方「充能」；id 无前导下划线 → 平铺键 res_charge）
    name: "充能"
    max: 10             # 122404 #3 全等级恒 10（官方 Talent）
  _hit_chance:          # 强化普攻追加段固定概率宿主槽（mechanic_chance(res__hit_chance) 读值——
    max: 1              # 基础 0.6（122408 #2）；ULT_ARMED 时 0.8 = #2 + 122403 #3）
  _extra_hits:          # 强化普攻追加段计数（封顶 122408 #3=3；每次施放重置）
    max: 3
  _e2_used:             # E2 每回合 1 次闩（自身回合开始重置）
    max: 1

techniques:
  - technique_id: "122407"
    name: "一气化三餐"
    point_cost: 1
    effects:                                # 进战一次性（战前装填预置，18.3；施放者=三月七）
      - effect_type: "gain_resource"       # 队友每人用过秘技 → +1 Charge，至多 3（#1[i]=3）
        resource_id: "charge"              # 简化读法：按满额 3 注入；逐队友计数通道缺→待实测
        amount: 3                          #（官方上限 3 为字面值，无等级轨道）
      - effect_type: "gain_energy"         # 自身使用秘技后下场战斗开始恢复 30 能量（#2[i]=30）
        target: "self"
        amount: 30
  # 122406「攻击」（秘技攻击条目）待收——挡因：进战削韧（攻击型秘技命中削韧对应属性韧性）
  # 通道缺；params 为空（官方 []），无数值可挂。与 122407 是否同场叠加亦待实测

actions:
  - action_id: "122401"
    name: "荡涤妖邪琉璃剑"
    action_type: "basic"
    target_type: "single"
    damage_type: "imaginary"
    available_if: "res_charge < 7"         # 强化态下普攻被 122408 替换（官方 Talent）
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    # 生效档：本体满级 lv10=第 10 行 1.4；E3（Basic Lv.+1 → lv10）已封顶
    toughness_dmg: 10        # 待实测（fandom 空、tbgd 无削韧列——按巡猎单体普攻惯例 10 占位）
    skill_point_gain: 1      # tbgd BPNeed 权威：产 +1
    energy_gain: 20          # tbgd 权威：回能 20

  - action_id: "122402"
    name: "师父，请喝茶！"
    action_type: "skill"
    target_type: "ally_single"    # 目标=我方单名队友（排除自身，玩家自选）——draft single=打敌人同族案第 9 次
    available_if: "res_charge < 7"         # 强化态禁用战技（官方 Talent："her Skill cannot be used"）
    skill_point_cost: 1      # tbgd 权威：耗 1（对轴冲突已裁决 tbgd 胜出）
    energy_gain: 30          # tbgd 权威：回能 30
    toughness_dmg: 0

  - action_id: "122403"
    name: "盖世女侠三月七"
    action_type: "ultimate"
    target_type: "single"
    damage_type: "imaginary"
    energy_cost: 110         # max_sp=110（能量满自选时机施放）
    scaling: [{"atk": 1.44}, {"atk": 1.536}, {"atk": 1.632}, {"atk": 1.728}, {"atk": 1.824},
              {"atk": 1.92}, {"atk": 2.04}, {"atk": 2.16}, {"atk": 2.28}, {"atk": 2.4},
              {"atk": 2.496}, {"atk": 2.592}, {"atk": 2.688}, {"atk": 2.784}, {"atk": 2.88}]
    # 生效档：本体满级 lv10=第 10 行 2.4；E5（Ultimate Lv.+2 → lv12=2.592）走 11-15 行
    toughness_dmg: 30        # 待实测（fandom 空——按巡猎单体终结技惯例 30 占位）
    energy_gain: 5           # tbgd/米游社一致：用后回能 5

  - action_id: "122408"
    name: "一扎眉攒，二扎心"
    action_type: "basic"     # 强化普攻（122401 的强化变体——独立 action，id 照抄官方清单）
    target_type: "single"
    damage_type: "imaginary"
    available_if: "res_charge >= 7"        # Charge ≥7 触发强化态后可用（与 122401 互斥半）
    # scaling = 每段倍率（#1）；初始段 3（#2/#3/#4 及武装/追加段由本块 hooks 承载——
    # 多段伤害走 deal_damage 表达式基数 $self.atk，与 scaling 表并行在案）
    scaling: [{"atk": 0.4}, {"atk": 0.48}, {"atk": 0.56}, {"atk": 0.64}, {"atk": 0.72},
              {"atk": 0.8}, {"atk": 0.88}, {"atk": 0.96}, {"atk": 1.04}, {"atk": 1.12}]
    # 生效档：强化普攻是 basic——lv6=0.8（普攻 lv6 口径；E3 basic+1 → lv7=0.88 在表内；
    # 表 10 行 lv10 末行 1.12 为档顶——draft 前注「lv10 生效档」误，强化普攻 lv6）
    toughness_dmg: 5         # 待实测（fandom 空——按每段削韧 5 占位）
    skill_point_gain: 0      # EN 明示：Enhanced Basic ATK cannot recover Skill Points
    energy_gain: 30          # tbgd 权威：回能 30（不随段数增加，官方 EN 明示）

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN
eidolons:
  E1:
    name: "My Sword Stirs Starlight"
    hooks:
      # Shifu 在场时三月七速度 +10%——Shifu 挂立即生效（duration 0 永续）；Shifu 标记转移/
      # 退场时摘除通道见主链 SHIFU remove_modifier 半（待实测边界）
      - event: "on_action"
        condition: "$event.actor == '1224' && $event.action_id == '122402' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_SHIFU_SPD"
              name: "My Sword Stirs Starlight"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"spd_pct": 0.1}
  E2:
    name: "Blade Dances on Waves' Fight"
    hooks:
      # 每回合限 1 次闩：自身回合开始重置
      - event: "on_turn_start"
        condition: "$event.actor == '1224'"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e2_used"
            amount: 0
      # Shifu 用普攻或战技（EN "Basic ATK or Skill"——触发域比天赋的 "attack or Ultimate" 窄）
      # 攻击敌人后，三月七立即追加攻击：对该次攻击主目标 60% ATK 虚数伤害；+1 Charge
      - event: "on_action"
        condition: "$event.actor != '1224' && has_modifier($event.actor, 'SHIFU') >= 1 && ($event.action_type == 'basic' || $event.action_type == 'skill') && !$event.insert && res__e2_used < 1"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e2_used"
            amount: 1
          - effect_type: "deal_damage"
            name: "Blade Dances on Waves' Fight"
            target: "$event.target"        # 无主目标时改打随机单体——缺省判定通道缺→待收
            damage_type: "imaginary"
            amount: "0.6 * $self.atk"      # 字面值（星魂无等级轨道）
          - effect_type: "gain_resource"
            resource_id: "charge"
            amount: 1
          # E2 分支效果（按 Shifu 命途）并入主钩——draft 独立钩 condition res__e2_used == 1
          # 被同事件快照挡死（主钩 set 1 在快照后=恒假，永不分支）；DPS 门控改表达式
          - effect_type: "deal_damage"
            name: "师父，请喝茶！·分支"
            target: "$event.target"
            damage_type: "imaginary"       # 待实测：元素跟随 Shifu 战斗属性（通道缺）
            amount: "min(1, has_modifier($self, 'SKILL_DPS_ARMED')) * param(122402, 2) * $self.atk"
    notes:
      - "E2 追加攻击是否回能、是否产战技点官方未写→待实测（不脑补，默认 0/0 记账）；是否触发行迹 1224102 削韧/击破类型规则随该行迹待收一并挂账"
  E3:
    name: "E3（Skill +2 / Basic +1）"
    skill_level_overrides: {"skill": 2, "basic": 1}
    notes:
      - "战技+2：随档段 = Shifu 速度 param(122402,1)（lv12=0.108）+ 附加伤害 param(122402,2)（lv12=0.22）；削韧+#3 随档段待收（通道缺，档位已在 skill_params 留存）；普攻+1：122401 表仅 10 行，lv10 已封顶=第 10 行 1.4"
  E4:
    name: "Being Fabulous Never Frights"
    hooks:
      # 回合开始恢复 5 能量（主体=$event.actor 三月七；on_turn_start 载荷无 target）
      - event: "on_turn_start"
        condition: "$event.actor == '1224'"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 5
  E5:
    name: "E5（Ultimate +2 / Talent +2）"
    skill_level_overrides: {"ultimate": 2, "talent": 2}
    notes:
      - "终结技+2：随档段=倍率 scaling lv12=2.592 + 武装段数 param(122403,2)/概率 param(122403,3)（两值全档恒 2/0.2，无观察差）；天赋+2：增伤 param(122404,2) lv12=0.88 随档"
  E6:
    name: "Me, the Best Girl in Sight"
    hooks:
      # 使用终结技后，下一次强化普攻暴击伤害 +50%（武装标记，122408 施放兑现并摘除——
      # 与行迹 1224103（Shifu 侧）/天赋增伤分属不同乘区，叠加顺序待实测）
      - event: "on_ultimate"
        condition: "$event.source == '1224' && $event.action == '122403'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_NEXT_ENH_CRITDMG"
              name: "Me, the Best Girl in Sight"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"crit_dmg": 0.5}

hooks:
  # 1224101 大行迹「燕举」：战斗开始时行动提前 25%（字面值 0.25，无等级轨道）
  - event: "on_battle_start"
    effects:
      - effect_type: "advance_action"
        target: "self"
        amount: 25

  # 122402 战技：指定 1 名队友（排除自身，$event.target）为 Shifu——挂 SHIFU 标记 +
  # Shifu 速度 +X%（lv10 #1=+10%，随档 param(122402,1)）；旧标记摘除（换目标即转移——
  # 官方未标持续回合数，摘除边界待实测）
  - event: "on_action"
    condition: "$event.actor == '1224' && $event.action_id == '122402' && !$event.insert"
    effects:
      - effect_type: "remove_modifier"
        target: {pool: "allies", where: "has_modifier($it, 'SHIFU') >= 1 && $it.actor_id != '1224'"}
        modifier_id: "SHIFU"
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "SHIFU"
          name: "师父"
          modifier_type: "buff"
          duration: 0            # 官方未标持续回合数（最近一次战技目标才算）→ 挂移标记制
          dispellable: False
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "SHIFU_SPD"
          name: "师父·加速"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"spd_pct": "param(122402, 1)"}

  # 122402 战技·Shifu 命途记名：DPS 命途（智识/毁灭/巡猎——官方文本三命途；
  # draft 擅自加 remembrance/elation 已删（违命名两态原则——「记忆/欢愉是否后续加入
  # 分支」待实测在案，不脑补）→ SKILL_DPS_ARMED；
  # 辅助命途（同谐/虚无/存护/丰饶）→ SKILL_SUP_ARMED（削韧 +100% 翻案收录——
  # break_efficiency_boost 在库（承伤三区通用化③）；官方无类型限定=全域）
  - event: "on_action"
    condition: "$event.actor == '1224' && $event.action_id == '122402' && !$event.insert && (path_of($event.target) == 'erudition' || path_of($event.target) == 'destruction' || path_of($event.target) == 'the_hunt')"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SKILL_DPS_ARMED"
          name: "师父请喝茶·攻分支"
          modifier_type: "buff"
          duration: 0
          dispellable: False
  - event: "on_action"
    condition: "$event.actor == '1224' && $event.action_id == '122402' && !$event.insert && (path_of($event.target) == 'harmony' || path_of($event.target) == 'nihility' || path_of($event.target) == 'preservation' || path_of($event.target) == 'abundance')"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SKILL_SUP_ARMED"
          name: "师父请喝茶·韧分支"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"break_efficiency_boost": 1.0}

  # 122401 普攻命中 → +1 Charge（#2 全等级恒 1）；并结算 DPS 分支附加伤害（param(122402,2)
  # ×ATK——无 armed 时表达式值 0，天然空发；元素跟随 Shifu 属性待实测，暂虚数）
  - event: "on_action"
    condition: "$event.actor == '1224' && $event.action_id == '122401' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: "param(122401, 2)"
      - effect_type: "deal_damage"
        name: "师父，请喝茶！·分支"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "min(1, has_modifier($self, 'SKILL_DPS_ARMED')) * param(122402, 2) * $self.atk"

  # 122404 天赋·Charge 获取：Shifu 使用攻击（普攻/战技/追加攻击等，排除 assist）或终结技后，
  # 三月七每次最多 +1 点（EN "After Shifu uses an attack or Ultimate"；上限 10 由资源 max 钳）
  - event: "on_action"
    condition: "$event.actor != '1224' && has_modifier($event.actor, 'SHIFU') >= 1 && $event.action_type != 'assist' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: 1

  # 122404 天赋·充满动作：Charge ≥7（#1 全档恒 7）→ 立即行动（advance 100——额外行动/拉条
  # 语义边界待实测 B19）+ 伤害提高 #2%（lv10=80%，随档；强化普攻施放后摘除）
  - event: "on_resource_gain"
    condition: "$event.resource_id == 'charge' && res_charge >= 7 && has_modifier($self, 'ENHANCED_DMG') < 1"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ENHANCED_DMG"
          name: "师父，我悟了！·增伤"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"all_dmg": "param(122404, 2)"}
      - effect_type: "advance_action"
        target: "self"
        amount: 100

  # 122403 终结技：下一次强化普攻初始段 +2、追加固定概率 +0.2（#2/#3 全档恒 2/0.2）——
  # ULT_ARMED 武装标记，122408 施放兑现并摘除（"下一次"边界/跨回合保留待实测）
  - event: "on_ultimate"
    condition: "$event.source == '1224' && $event.action == '122403'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ULT_ARMED"
          name: "盖世女侠三月七·武装"
          modifier_type: "buff"
          duration: 0
          dispellable: False
      # 武装期追加概率 0.8 = #2 + 122403 #3（on_ultimate 先于强化普攻——快照可读）
      - effect_type: "set_resource"
        resource_id: "_hit_chance"
        amount: 0.8

  # 122408 强化普攻·主结算链（声明序=执行序）：
  #  ① 追加概率宿主槽：基础 0.6（#2）；ULT_ARMED 时 0.8 = #2 + 122403 #3
  #  ② 耗 Charge 7（#1 全档恒 7）+ 追加段计数清零 + 摘 ENHANCED_DMG / E6 武装 / ULT_ARMED
  #  ③ 初始段 2/3（每段 = 每段倍率 ×ATK，fold DPS 分支附加伤害；削韧 5 由 action 层承担）
  - event: "on_battle_start"
    effects:
      # 追加概率宿主槽初始化（基础 0.6 #2）——**必须早于强化普攻事件**：draft 原挂
      # on_action 122408 钩（与追加判定钩同事件——emit 快照读初值 0=追加段永不触发，
      # 1214/1221 同族快照案）
      - effect_type: "set_resource"
        resource_id: "_hit_chance"
        amount: 0.6
  - event: "on_action"
    condition: "$event.actor == '1224' && $event.action_id == '122408' && !$event.insert"
    effects:
      - effect_type: "set_resource"
        resource_id: "charge"
        amount: "res_charge - 7"
      - effect_type: "deal_damage"
        name: "一扎眉攒，二扎心·段2"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "(param(122408, 1) + min(1, has_modifier($self, 'SKILL_DPS_ARMED')) * param(122402, 2)) * $self.atk"
        toughness_dmg: 5       # 待实测（fandom 空，占位口径）
      - effect_type: "deal_damage"
        name: "一扎眉攒，二扎心·段3"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "(param(122408, 1) + min(1, has_modifier($self, 'SKILL_DPS_ARMED')) * param(122402, 2)) * $self.atk"
        toughness_dmg: 5
      # 末段追加（至多 3 段——写死 3 段承载 cap）：mechanic_chance 在 amount 三元
      # **内联求值**（快照族① effects 读现场——draft 三钩链用 res__extra_hits 计数闸
      # 被同事件快照挡死（计数 set 在快照后，`>= 1/2` 恒假=每次施放只触发追加 1）；
      # expected 0.6/0.8>=0.5 恒触发全出、roll 各段独立掷、0 伤段 log 噪音在案）
      - effect_type: "deal_damage"
        name: "一扎眉攒，二扎心·追加1"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "mechanic_chance(res__hit_chance) >= 1 ? (param(122408, 1) + min(1, has_modifier($self, 'SKILL_DPS_ARMED')) * param(122402, 2)) * $self.atk : 0"
        toughness_dmg: 5
      - effect_type: "deal_damage"
        name: "一扎眉攒，二扎心·追加2"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "mechanic_chance(res__hit_chance) >= 1 ? (param(122408, 1) + min(1, has_modifier($self, 'SKILL_DPS_ARMED')) * param(122402, 2)) * $self.atk : 0"
        toughness_dmg: 5
      - effect_type: "deal_damage"
        name: "一扎眉攒，二扎心·追加3"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "mechanic_chance(res__hit_chance) >= 1 ? (param(122408, 1) + min(1, has_modifier($self, 'SKILL_DPS_ARMED')) * param(122402, 2)) * $self.atk : 0"
        toughness_dmg: 5
      # 摘除在全部段（基础+武装+追加）结算后（draft 先摘后打=后续段吃不到增伤——
      # 官方天赋「直到施放强化普攻」=该次全程吃增伤/武装/E6；快照语义下 436 钩与追加
      # 钩 condition 读事件开始时的在场态——摘除放最后两域全保）
      - effect_type: "remove_modifier"
        modifier_id: "ENHANCED_DMG"
      - effect_type: "remove_modifier"
        modifier_id: "E6_NEXT_ENH_CRITDMG"
      - effect_type: "remove_modifier"
        modifier_id: "ULT_ARMED"

  # 终结技武装段：初始段 3→5（+2，param(122403,2)）——段 4/5
  - event: "on_action"
    condition: "$event.actor == '1224' && $event.action_id == '122408' && !$event.insert && has_modifier($self, 'ULT_ARMED') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "一扎眉攒，二扎心·段4"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "(param(122408, 1) + min(1, has_modifier($self, 'SKILL_DPS_ARMED')) * param(122402, 2)) * $self.atk"
        toughness_dmg: 5
      - effect_type: "deal_damage"
        name: "一扎眉攒，二扎心·段5"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "(param(122408, 1) + min(1, has_modifier($self, 'SKILL_DPS_ARMED')) * param(122402, 2)) * $self.atk"
        toughness_dmg: 5
  # 1224103 大行迹「驭澜」：使用强化普攻后 Shifu 暴击伤害 +60%、击破特攻 +36%，持续 2 回合
  #（字面值 0.6/0.36/2；duration 直给 int）
  - event: "on_action"
    condition: "$event.actor == '1224' && $event.action_id == '122408' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "has_modifier($it, 'SHIFU') >= 1"}
        modifier:
          modifier_id: "TIDE_TAMER"
          name: "驭澜"
          modifier_type: "buff"
          duration: 2
          dispellable: False
          stat_effects: {"crit_dmg": 0.6, "break_effect": 0.36}

scaling_notes:
  - "强化态换技（122401/122402 ↔ 122408）：已收——available_if 互斥声明（res_charge 7 为分界，03_actor §3.8.1 行动级可用条件）；天赋 on_resource_gain 阈值发射 + advance_action 100 承担「立即行动」（拉条/额外回合语义边界待实测 B19）"
  - "Charge 平铺键对账：资源 id charge 无前导下划线 → res_charge（单下划线族）；_hit_chance/_extra_hits/_e2_used 有前导下划线 → res__xxx（双下划线族）"
  - "追加段固定概率走 mechanic_chance(res__hit_chance) 宿主函数 + condition（effect 层无 chance 键）"
  - "强化普攻多段基数走 hook deal_damage 以 $self.atk 为底（scaling 表保留每段倍率 10 档供面板/档位读取；DPS 分支附加伤害 fold 进 amount 表达式——min(1, has_modifier(...)) 数值门）"
  - "行迹/星魂数值一律字面值（无等级轨道）；duration 直给 int（驭澜 2 回合）"
  - "待收（挡因汇总）：辅助命途削韧 +100%（逐行动削韧倍率通道缺，档位已在 skill_params 122402 #3 留存）；行迹 1224102 削韧元素动态扩展与击破类型覆写通道缺；秘技 122406 进战削韧通道缺"
