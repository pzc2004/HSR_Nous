# 角色模板：镜流（1212）·**加强前**（legacy）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 版本双轨：3.4 官方加强前后机制互不兼容（判据=两套技能 id 121xxx/1121xxx，
# 星魂 E1/E4/E6 机制重做），加强后见 `1212_镜流.yaml`；build member 写
# `version: legacy` 选本件（编译期选文件，默认 enhanced——owner 裁定：加强
# 前后视为两个角色）。
#
# 出处：打标 DAG 双轨原料（staging）拆分 + 过堂勘正。
#
# 过堂勘正六件：① 星魂名官方勘正三件（draft 幻名 月落天关/桂子垂霜/万川映月 →
#   月犯天关/朔晕七星/半璧迫望——命名两态原则）② 朔望上限旧版=3（官方天赋
#   文本"最多可累计3层"——draft 未分版一律 4 幻视）③ 剑首技名错位勘正——
#   EN "Transcendent Flash"=无罅飞光（121202 普通战技，EN 官方命名对照实证），
#   行动提前 10% 挂 121202（draft 误挂 121209 寒川映月）④ 耗血目标勘正——
#   队友=other_allies（draft all_allies 会自耗，官方"消耗队友生命值"）；
#   ⑤ E1 追伤/秘技附加伤 ATK 基准改读 $self.atk 现场值（draft 白值字面量
#   679.14 不吃转魄攻buff）⑥ 汲血转攻公式双重幻视勘正——#3=5.4 是 540%
#   倍率（[i] 渲染分数×100，#6=1→"100%"同族）非 5.4%（draft 误 /100）；
#   count_team() 空参=命途为空的编成计数（_count_team_path("")）非全队人数
#   （draft 当 team_size 用）——现制 drain 实额累计 _drain_tally 精确逐目标。
#
# 收录：普攻流影方晖（atk 倍率 lv6=1.0×ATK）/ 战技无罅飞光（单攻 lv10=2.0×ATK，
#       朔望+1，转魄外可用）/ 终结技昙华生灭天河泻梦（Blast 主 3.0×ATK/邻 1.5×ATK
#       lv10，朔望+1）/ 强化战技寒川映月（Blast 主 2.5×ATK/邻 1.25×ATK lv10，
#       朔望-1，转魄专属，不耗点）/ 天赋澹月转魄（朔望 2 层进转魄：行动提前
#       100%+暴击率 lv10+50%；转魄攻击耗队友 4%Max 血并按全体耗血总量 ×540%
#       转攻（上限 lv10=1.8×基础攻——tally 实额制，见 hooks 注））/ 大行迹剑首
#       1212102（无罅飞光后下次行动提前 10%）/ 秘技古镜照神（朔望+1+回能 15+
#       冻结，冻结附加伤 0.8×ATK 版）/ E1 月犯天关（暴伤+24%+单攻场景追伤
#       1.0×ATK）/ E2 朔晕七星（终结技后强化战技增伤 80%）/ E3/E5 等级族 /
#       E6 蚀变于娄（进转魄额外朔望+1、转魄中暴伤+50%）
# 待收（均带挡因）：E4 持秉玄烛（转魄耗血转攻额外提高=全体生命值消耗总量×
#       90%+转攻上限+30%——"全体耗血总量"含非 drain 源耗血（队友被打/自耗技），
#       事件源求全通道缺，不造近似；drain 源部分可复用 _drain_tally 通道）/
#       E6 朔望上限 3→4（资源 max 星魂覆写通道缺——1205 E6 同族）/ E1 追伤
#       "只攻击了 1 个目标"判定=enemies_alive()==1 近似（on_action 载荷无命中数/
#       主邻区分——1205 E1 同族）/ 汲血转攻"本次"口径=tally 累计+min cap 近似
#       （真实队两者同钉 cap；单队友场景第二次起偏上——精确口径待 drain_total
#       载荷通道；转攻对触发攻击本身不生效是 on_action 后置钩模型固有近似）/ 大行迹死境 1212101（转魄中
#       效果抵抗+35%——stat_effects 词表 effect_res 登记证据缺，0.35 在案）/
#       大行迹霜魄 1212103（转魄中终结技伤害+20%——ultimate 技能类增伤键缺，
#       all_dmg 过宽不造键，0.2 在案）/ 天赋 params #1=0.3（官方文本未引用，
#       含义不明禁脑补）
