      - event: "on_action"
        condition: "$event.actor == '1212' && ($event.action_id == '121203' || $event.action_id == '121209') && !$event.insert && enemies_alive() == 1"
        effects:
          - effect_type: "deal_damage"
            name: "月犯天关·追伤"
            target: {pool: "enemies", take: 1}
            damage_type: "ice"
            amount: "$self.atk"
    notes:
      - "追伤条件「只攻击了 1 个目标」以 enemies_alive()==1 近似（on_action 载荷无命中数/主邻区分——1205 E1 同族），精确判定待收"
  E2:
    name: "朔晕七星"
    hooks:
      - event: "on_action"
        condition: "$event.actor == '1212' && $event.action_id == '121203' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_ARMED"
              name: "朔晕七星·武装"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
      - event: "on_action"
        condition: "$event.actor == '1212' && $event.action_id == '121209' && has_modifier($self, 'E2_ARMED') >= 1 && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_ESKILL_BOOST"
              name: "朔晕七星"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              stat_effects: {"all_dmg": 0.8}
          - effect_type: "remove_modifier"
            modifier_id: "E2_ARMED"
  E3:
    name: "半璧迫望"
    skill_level_overrides: {"ultimate": 2, "talent": 2}   # 终结技+2 / 天赋+2
  E4:
    name: "持秉玄烛"
    notes:
