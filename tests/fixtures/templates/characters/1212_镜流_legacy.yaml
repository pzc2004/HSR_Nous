hooks:
  # ---- 朔望增减（战技 +1 / 终结技 +1 / 寒川映月 -1 / 归零退转魄） ----
  - event: "on_action"
    condition: "$event.actor == '1212' && $event.action_id == '121202' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "syzygy"
        amount: "param(121202, 2)"
  - event: "on_action"
    condition: "$event.actor == '1212' && $event.action_id == '121203' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "syzygy"
        amount: "param(121203, 2)"
  - event: "on_action"
    condition: "$event.actor == '1212' && $event.action_id == '121209' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "syzygy"
        amount: "-param(121209, 2)"
  - event: "on_action"
    condition: "$event.actor == '1212' && $event.action_id == '121209' && res__transmigration >= 1 && res_syzygy - param(121209, 2) <= 0"
    effects:
      - effect_type: "set_resource"
        resource_id: "_transmigration"
        amount: 0

  # ---- 进转魄（朔望满 2 → 提前 100% + 暴击率；旧版无额外获得朔望） ----
  - event: "on_action"
    condition: "$event.actor == '1212' && ($event.action_id == '121202' || $event.action_id == '121203') && res__transmigration < 1 && res_syzygy + 1 >= param(121204, 5)"
    effects:
      - effect_type: "set_resource"
        resource_id: "_transmigration"
        amount: 1
      - effect_type: "advance_action"
        target: "self"
        amount: "param(121204, 6) * 100"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SPECTRAL_TRANS"
          name: "转魄"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "res__transmigration >= 1"
          stat_effects: {"crit_rate": "param(121204, 7)"}

  # ---- 转魄攻击耗血 + 汲血转攻（队友=other_allies，勘正 draft all_allies 自耗） ----
  # 汲血转攻公式勘正（draft 双重幻视）：① #3=5.4 是 540% 倍率非 5.4%（[i] 渲染
  # 分数×100——#6=1 渲染"100%"同族），draft 误 /100；② count_team() 空参 =
  # 命途为空的编成计数（_count_team_path("")，长夜月/昔涟族编成计数器），非
  # 全队人数——draft 当 team_size 用。现制 = drain 实额经 on_hp_decrease
  # （reason='drain'）累计进 _drain_tally，转攻 = min(5.4×tally, cap×基础攻)：
  # 每目标实耗精确（不再近似等血量）；"本次"口径以累计+min cap 近似（真实队
  # 两者同钉 cap；单队友场景第二次起偏上——精确口径待 drain_total 载荷通道）。
  - event: "on_action"
    condition: "$event.actor == '1212' && res__transmigration >= 1 && !$event.insert"
    effects:
      - effect_type: "drain_hp"
        target: "other_allies"
        amount: "param(121204, 2) * $target.max_hp"
        floor: 1
        drain_ratio: 0
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TRANS_ATK_BOOST"
          name: "转魄·汲血转攻"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          enable_if: "res__transmigration >= 1"
          stat_effects:
            atk: "min(param(121204, 3) * res__drain_tally, param(121204, 4) * 679.14)"
  # drain 实额累计（on_hp_decrease reason='drain' 载荷 amount——05_effects 词表冻结）；
  # 条件**不带** _transmigration 门：退场发（朔望归零同事件）退转魄钩先跑置 0 会漏计，
  # 而 1212 的 drain 源本就只出自转魄钩（source+reason 过滤已充分）
  - event: "on_hp_decrease"
    condition: "$event.source == '1212' && $event.reason == 'drain' && actor_type_of($event.target) != 'monster'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_drain_tally"
        amount: "$event.amount"

  # ---- 大行迹·剑首 1212102（无罅飞光后下次行动提前 10%——
  #      EN "Transcendent Flash"=无罅飞光实证，勘正 draft 误挂 121209） ----
  - event: "on_action"
    condition: "$event.actor == '1212' && $event.action_id == '121202' && !$event.insert"
    effects:
      - effect_type: "advance_action"
        target: "self"
        amount: 10

  # ---- 秘技冻结附加伤（ATK 版——读 $self.atk 现场值，勘正 draft 白值字面量） ----
  - event: "on_turn_start"
    condition: "$event.actor != '1212' && actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'TECH_FROZEN') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "古镜照神·冻结附加伤"
        target: "$event.actor"
        damage_type: "ice"
        amount: "param(121207, 5) * $self.atk"

