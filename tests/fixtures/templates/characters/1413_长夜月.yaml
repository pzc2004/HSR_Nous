  _eve_on_field:
    max: 1            # 长夜在场闩（actor_type_of 查表不含 alive——1407 _nw_on_field 同先例）
  _eve_used_1307:
    max: 1            # 本回消失由 1141307 致（1141306 两档互斥闩——合并值档置位，exit 闩读后即清）
  _ult_pending:
    max: 1            # 终结技召唤途标（同事件内 actor_enter 嵌套派发识别"本次召唤源=终结技"
                      # ——141303 AoE 首次召唤档，见忆灵侧 E0u hook）
  _tech_pending:
    max: 1            # 秘技装填途标（秘技 effect 先于模板 hooks 跑、同事件快照不串——
                      # 挂 actor_enter 嵌套派发消费，见 E1 hook）

# 秘技（141307 愿有冷雨落下）：下次战斗开始获战技同款忆灵暴伤光环 + 1 忆质
techniques:
  - technique_id: "141307"
    name: "愿有冷雨落下"
    point_cost: 1
    effects:                              # 进战一次性（战前装填预置，18.3；施放者=长夜月）
      - effect_type: "gain_resource"
        resource_id: "_tech_pending"
        amount: 1                         # 途标置位（E1 在长夜进场时挂光环并清标）
      - effect_type: "gain_resource"
        resource_id: "memoria"
        amount: 1                         # #1：获得 1 点忆质（米游社 params [1,1]）

actions:
  - action_id: "141301"
    name: "从此岁月朦胧"
    action_type: "basic"
    target_type: "single"
    damage_type: "ice"
    scaling: [{"hp": 0.25}, {"hp": 0.3}, {"hp": 0.35}, {"hp": 0.4}, {"hp": 0.45},
              {"hp": 0.5}, {"hp": 0.55}, {"hp": 0.6}, {"hp": 0.65}, {"hp": 0.7}]
    # 生命倍率普攻（官方 desc "Ice DMG equal to #1[i]% of Evernight's Max HP"）
    toughness_dmg: 10
    skill_point_gain: 1     # fandom：战技点 +1
    energy_gain: 20         # fandom：回能 20

  - action_id: "141302"
    name: "白昼悄然离去"
    action_type: "skill"
    target_type: "self"     # 官方技能无选取目标（召唤+光环经本模板 hooks 结算）
    skill_point_cost: 0     # 不耗点（owner 实战确认 + tbgd BPNeed sp_cost 0 + 米游社无"消耗战技点"
                            # 标三源；旧 fandom 类型兜底 -1 系 B34 病灶误植）
    energy_gain: 30         # fandom：回能 30

  - action_id: "141303"
    name: "晚安，全世界无眠"
    action_type: "ultimate"
    target_type: "self"     # 召唤+状态技（AoE 由忆灵侧 hooks 结算——140703 同先例）
    energy_cost: 240
    energy_gain: 5          # fandom：回能 5
    toughness_dmg: 0        # 米游社削韧 30 由忆灵侧 hook deal_damage 承担（U1/E0u 两档各 30，
                            # 互斥单次——action 无 scaling 不落段，本键保持 0 防双计）

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN（数值/机制照抄 ranks_detail desc）
eidolons:
  E1:
    name: "睡吧，长夜有所梦"
    hooks:
      # 长夜月在场时，场上敌方 4+/3/2/1 名 → 我方忆灵伤害为原伤害 120%/125%/130%/150%——
      # dmg_final_dmg_boost 独立乘区（final_dmg_multi=1+bonus——"原伤害%"族正主通道，区别于
      # all_dmg 增伤区加算稀释）；忆灵逐个挂（actor_enter reason=summon 覆盖一切召唤路径，
      # 含开局天赋召唤与重召），stat_exprs 现场变档（enemies_alive() 懒求值——减员即变档）。
      # 档位式：n≥4→0.2 / n=3→0.25 / n=2→0.3 / n=1→0.5（min/max 分段等价，无三元可读性优先）
      - event: "actor_enter"
        condition: "$event.reason == 'summon' && actor_type_of($event.actor) == 'summon'"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.actor"
            modifier:
              modifier_id: "E1_MEMO_FINAL_DMG"
              name: "睡吧，长夜有所梦"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_exprs:
                dmg_final_dmg_boost: "0.2 + 0.05 * min(max(4 - enemies_alive(), 0), 2) + 0.2 * max(0, min(2 - enemies_alive(), 1))"
    notes:
      - "死龙半/爪痕/消逝走遐蝶侧 hook 承载（伤害归属记遐蝶，1407 模板在案）——本源为忆灵面板的最终乘区加成对那几段不生效（归属差，与模板既有口径同源）"
  E2:
    name: "听，沉眠中的呓语"
    stat_effects: {"crit_dmg": 0.4}              # 长夜月暴伤 +40%（常驻件；忆灵侧见 hooks）
    hooks:
      # ① 忆灵「长夜」暴伤 +40%（忆灵侧件——进场挂，重召 refresh 幂等）
      - event: "actor_enter"
        condition: "$event.actor == '1413_evey' && $event.reason == 'summon'"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}
            modifier:
              modifier_id: "E2_EVEY_CRIT_DMG"
              name: "听，沉眠中的呓语"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"crit_dmg": 0.4}
      # ② 每当长夜月获得忆质，获得数量 +2——on_resource_gain 正值即补 +2；E2_GAIN_GUARD
      # 闩防自循环（补笔自身也发 on_resource_gain——闩在链内先挂后摘，嵌套派发被闩挡住）
      - event: "on_resource_gain"
        condition: "$event.actor == '1413' && $event.resource_id == 'memoria' && $event.amount > 0 && stacks($self, 'E2_GAIN_GUARD') < 1"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_GAIN_GUARD"
              name: "忆质补账闩"
              modifier_type: "buff"
              duration: 0
              dispellable: False
          - effect_type: "gain_resource"
            resource_id: "memoria"
            amount: 2
          - effect_type: "remove_modifier"
            modifier_id: "E2_GAIN_GUARD"
      # ③ 施放终结技额外获得 2 点至暗之谜充能——_dr_charge clamp max=2 与基础 +2 合流恒满
      #（官方文本由既有上限承载：1→2 路径与 E0 同值，无可观察增量，在案）
      - event: "on_ultimate"
        condition: "$event.source == '1413' && $event.action == '141303'"
        effects:
          - effect_type: "gain_resource"
            resource_id: "_dr_charge"
            amount: 2
  E3:
    name: "别怕，噩梦已成过去"
    skill_level_overrides: {"skill": 2, "basic": 1}     # 战技+2、普攻+1
    notes:
      - "战技+2 随档段：暴伤光环系数（param(141302,1)）/忆质+2（param(141302,2)）/至暗档 +12（param(141302,5)）/在场回复（param(141302,4)）；action 层普攻 scaling 实取 lv7 档"
      - "忆灵天赋+1：官方数据忆灵天赋上限 10 档（StarRailRes max_level=10、params 10 行），无第 11 档可取——不脑补数值，跳过（param() 越档钳表尾+⚠编译警告口径）"
  E4:
    name: "醒来，便是你的明天"
    hooks:
      # 长夜月在场时我方忆灵弱点击破效率 +25%（weakness_break_efficiency_boost——阮梅
      # 1303/流萤 1310 同池），忆灵「长夜」额外 +25%（合计 50%——双件分挂；削韧量走
      # pipeline 双池乘算 (1+a)(1+b) 同口径）
      - event: "actor_enter"
        condition: "$event.reason == 'summon' && actor_type_of($event.actor) == 'summon'"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.actor"
            modifier:
              modifier_id: "E4_MEMO_BREAK_EFF"
              name: "醒来，便是你的明天"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"weakness_break_efficiency_boost": 0.25}
      - event: "actor_enter"
        condition: "$event.actor == '1413_evey' && $event.reason == 'summon'"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}
            modifier:
              modifier_id: "E4_EVEY_BREAK_EFF"
              name: "醒来，便是你的明天"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"weakness_break_efficiency_boost": 0.25}
  E5:
    name: "忘却，记忆中的「我」"
    skill_level_overrides: {"ultimate": 2, "talent": 2}   # 终结技+2、天赋+2
    notes:
      - "终结技+2 随档段：AoE 倍率/至暗增伤/易伤/充能（param(141303,1/3/4/2)）；天赋+2 随档段：失 HP 暴伤/忆质（param(141304,2/1)）——param() 回填勘正旧烘焙错档（141303 lv11 行/141304 lv14 行→lv10 正档，双源复核在案）"
      - "忆灵技+1：官方数据忆灵技 10 档上限，无第 11 档——跳过（param() 越档钳表尾+⚠编译警告口径）"
  E6:
    name: "就这样，一直"
    hooks:
      # ① 长夜月在场时我方全体全属性抗性穿透 +20%（挂长夜月 team 光环——res_pen 单通道
      # 承载，mechanics 02 口径；owner 阵亡其 hook/光环失源=官方"在场"口径兜住）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_TEAM_RES_PEN"
              name: "就这样，一直"
              modifier_type: "buff"
              duration: 0
              effect_scope: "team"
              dispellable: False
              stat_effects: {"res_pen": 0.2}
      # ② 忆灵「长夜」施放如露后长夜月获得本次消耗忆质 30%——消耗点 = 忆质全耗键控件
      # set memoria 0（负值事件 + _eve_used_1307 闩先置位=如露致耗唯一识别）；返还笔为
      # 正值获得（E2 的 +2 照常叠加——官方"每当获得忆质"）
      - event: "on_resource_gain"
        condition: "$event.actor == '1413' && $event.resource_id == 'memoria' && $event.amount < 0 && res__eve_used_1307 >= 1"
        effects:
          - effect_type: "gain_resource"
            resource_id: "memoria"
            amount: "-0.3 * $event.amount"

hooks:
  # 141304 天赋·进战召唤：忆灵「长夜」入场（初始 SPD 160=action 块 base_stats；
  # Max HP=长夜月×50%=max_hp_ratio）
  - event: "on_battle_start"
    effects:
      - effect_type: "summon"
        summon_id: "1413_evey"

  # 1413102 烛火起·进战半：长夜月回 70 能 + 1 忆质
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 70
      - effect_type: "gain_resource"
        resource_id: "memoria"
        amount: 1

  # 141302 战技：耗自身当前 HP 10%（#6）→ 召唤长夜 → 我方全体忆灵暴伤 = 长夜月暴伤×24%
  #（#1，持续 2 回合 #2，**source_turn_start 锚**——官方原文"This duration decreases by 1
  #  at the start of Evernight's every turn"；挂忆灵、source=长夜月，施加者回合开始走字）
  # → 得忆质 2 点（#3）。光环值现场烘焙（施加时刻快照，重挂重算——蒙福者族同通道）；
  # 天亮了变档同件（1413103：count_team(path='remembrance') 1/2/3/≥4 → +0.05/0.15/0.5/0.65，
  # 编成计数通道——施加时刻快照，编成战中不变=快照无损，见 trace_notes）。
  # 声明序：drain 先于光环——耗血触发的天赋 +72% 暴伤计入本次烘焙基数（读法在案）
  - event: "on_action"
    condition: "$event.actor == '1413' && $event.action_id == '141302' && !$event.insert"
    effects:
      - effect_type: "drain_hp"
        target: "self"
        amount: "0.1 * $self.hp"
        drain_ratio: 0
      - effect_type: "summon"
        summon_id: "1413_evey"
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "actor_type_of($it) == 'summon'"}
        modifier:
          modifier_id: "EVE_SKILL_CRIT"
          name: "白昼悄然离去"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          tick_anchor: "source_turn_start"   # 长夜月每回合开始 -1（第五锚首实例）
          dispellable: False
          stat_effects:
            crit_dmg: "param(141302, 1) * $self.crit_dmg + (count_team(path='remembrance') >= 4 ? 0.65 : count_team(path='remembrance') == 3 ? 0.5 : count_team(path='remembrance') == 2 ? 0.15 : 0.05)"
      - effect_type: "gain_resource"
        resource_id: "memoria"
        amount: "param(141302, 2)"

  # 141302 至暗之谜档：处于至暗之谜额外 +12 忆质（#5）
  - event: "on_action"
    condition: "$event.actor == '1413' && $event.action_id == '141302' && !$event.insert && has_modifier($self, 'DARKEST_RIDDLE') >= 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "memoria"
        amount: "param(141302, 5)"

  # 141303 终结技（U0 长夜月半）：召唤长夜 + 至暗之谜充能 +2（#2，clamp max=补满）。
  # 至暗之谜三件（双方增伤 #3/敌方易伤 #4/免疫控制）**不在本 hook**——
  # 官方序"召唤→长夜 AoE→进入至暗之谜"，由忆灵侧 U1（在场档）/E0u（首召档）在 AoE 后施加
  - event: "on_ultimate"
    condition: "$event.source == '1413' && $event.action == '141303'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_ult_pending"
        amount: 1
      - effect_type: "summon"
        summon_id: "1413_evey"
      - effect_type: "gain_resource"
        resource_id: "_dr_charge"
        amount: "param(141303, 2)"
      - effect_type: "set_resource"
        resource_id: "_ult_pending"
        amount: 0

  # 141304 天赋·受击半（双 hook 各一计数器，trigger_limit per_action=每次行动窗重置——
  # "该效果每个目标每次受到攻击最多触发 1 次"：AoE 同击双目标各触发 1 次=+4；
  # 同一行动多段单体=1 次）。失 HP → 双方暴伤 #2（2 回合 #3）+ 忆质 #1
  - event: "on_hp_decrease"
    condition: "$event.target == '1413' && $event.reason == 'hit'"
    trigger_limit: {per_action: 1}
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "EVE_TALENT_CRIT"
          name: "今夜与我同行"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          dispellable: False
          stat_effects: {"crit_dmg": "param(141304, 2)"}
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}
        modifier:
          modifier_id: "EVE_TALENT_CRIT"
          name: "今夜与我同行"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          dispellable: False
          stat_effects: {"crit_dmg": "param(141304, 2)"}
      - effect_type: "gain_resource"
        resource_id: "memoria"
        amount: "param(141304, 1)"
  - event: "on_hp_decrease"
    condition: "$event.target == '1413_evey' && $event.reason == 'hit'"
    trigger_limit: {per_action: 1}
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "EVE_TALENT_CRIT"
          name: "今夜与我同行"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          dispellable: False
          stat_effects: {"crit_dmg": "param(141304, 2)"}
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}
        modifier:
          modifier_id: "EVE_TALENT_CRIT"
          name: "今夜与我同行"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          dispellable: False
          stat_effects: {"crit_dmg": "param(141304, 2)"}
      - effect_type: "gain_resource"
        resource_id: "memoria"
        amount: "param(141304, 1)"

  # 141304 天赋·耗血半（不限次——"每次受到攻击限 1 次"约束的是受击；技能/忆灵技自耗
  # 逐实例触发，DoT(set_hp/dot) 读法在案待实测 B19）
  - event: "on_hp_decrease"
    condition: "($event.target == '1413' || $event.target == '1413_evey') && $event.reason == 'drain'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "EVE_TALENT_CRIT"
          name: "今夜与我同行"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          dispellable: False
          stat_effects: {"crit_dmg": "param(141304, 2)"}
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}
        modifier:
          modifier_id: "EVE_TALENT_CRIT"
          name: "今夜与我同行"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          dispellable: False
          stat_effects: {"crit_dmg": "param(141304, 2)"}
      - effect_type: "gain_resource"
        resource_id: "memoria"
        amount: "param(141304, 1)"

  # 1413101 天黑黑·耗血半：长夜月或长夜施放技能时，消耗该行动者当前 HP 5%（drain $target
  # 逐目标口径）→ 双方暴伤 +15%（2 回合）。读法：主语"长夜月和忆灵「长夜」"双方（米游社
  # CN 原文）；忆灵技插入复刻（trigger_action）同属施放在案
  - event: "on_action"
    condition: "($event.actor == '1413' || $event.actor == '1413_evey') && $event.action_type != 'ultimate'"
    effects:
      - effect_type: "drain_hp"
        target: "$event.actor"
        amount: "0.05 * $target.hp"
        drain_ratio: 0
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "EVE_TRACE_CRIT"
          name: "天黑黑，月寂寂"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          dispellable: False
          stat_effects: {"crit_dmg": 0.15}
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}
        modifier:
          modifier_id: "EVE_TRACE_CRIT"
          name: "天黑黑，月寂寂"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          dispellable: False
          stat_effects: {"crit_dmg": 0.15}

  # 1413101 天黑黑·终结技半（终结技不发 on_action——同效果补通道）
  - event: "on_ultimate"
    condition: "$event.source == '1413'"
    effects:
      - effect_type: "drain_hp"
        target: "self"
        amount: "0.05 * $self.hp"
        drain_ratio: 0
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "EVE_TRACE_CRIT"
          name: "天黑黑，月寂寂"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          dispellable: False
          stat_effects: {"crit_dmg": 0.15}
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}
        modifier:
          modifier_id: "EVE_TRACE_CRIT"
          name: "天黑黑，月寂寂"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          dispellable: False
          stat_effects: {"crit_dmg": 0.15}

  # 1413102 烛火起·施放半：长夜月或我方忆灵施放技能时，长夜月回 5 能 + 1 忆质
  #（终结技不发 on_action——双通道）
  - event: "on_action"
    condition: "($event.actor == '1413' || $event.actor == '1413_evey') && $event.action_type != 'ultimate'"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 5
      - effect_type: "gain_resource"
        resource_id: "memoria"
        amount: 1
  - event: "on_ultimate"
    condition: "$event.source == '1413'"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 5
      - effect_type: "gain_resource"
        resource_id: "memoria"
        amount: 1

  # 141303/1413101/141304 联动：忆灵施放【迷梦，流失，如露】后——至暗之谜充能 -1（141303）
  # + 回 1 战技点（1413101）+ 立即行动闩复位（141304"后方可再次触发"）。
  # 忆质全耗不走本 hook（见下方自耗 drain 键控件——序必须在忆灵侧伤害结算之后）
  - event: "on_action"
    condition: "$event.actor == '1413_evey' && $event.action_id == '1141307'"
    effects:
      - effect_type: "gain_skill_point"
        amount: 1
      - effect_type: "gain_resource"
        resource_id: "_dr_charge"
        amount: -1
      - effect_type: "set_resource"
        resource_id: "_eve_latch"
        amount: 0

  # 141304 忆质≥16·解除并免疫控制（每次跨档都解——remove_modifier filter $mod 首实例：
  # kind=control 一把罩住 modifier_type/control_kind 两写法；免疫件 replace 幂等）
  - event: "on_resource_gain"
    condition: "$event.actor == '1413' && $event.resource_id == 'memoria' && $event.current >= 16"
    effects:
      - effect_type: "remove_modifier"
        target: "self"
        filter: "$mod.kind == 'control'"
        reason: "purify"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "EVE_MEMORIA_IMMUNE"
          name: "长夜无梦"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          grants_immune: ["control"]

  # 141304 忆质跌出 16 → 免疫件摘除（消耗走 after_consume 同发 on_resource_gain 负值，
  # current<16 单事件罩住两路径）
  - event: "on_resource_gain"
    condition: "$event.actor == '1413' && $event.resource_id == 'memoria' && $event.current < 16"
    effects:
      - effect_type: "remove_modifier"
        target: "self"
        modifier_id: "EVE_MEMORIA_IMMUNE"

  # 141304 忆质≥16·立即行动（闩锁——触发后待忆灵施放 1141307 复位；长夜不在场不耗闩）
  - event: "on_resource_gain"
    condition: "$event.actor == '1413' && $event.resource_id == 'memoria' && $event.current >= 16 && res__eve_latch < 1 && res__eve_on_field >= 1"
    effects:
      - effect_type: "immediate_action"
        target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}
      - effect_type: "gain_resource"
        resource_id: "_eve_latch"
        amount: 1

  # 141303 至暗之谜退出判：长夜月回合开始时无 Charge → 三件全摘（官方"回合开始时若无
  # 剩余充能退出"）；忆灵已离场则忆灵件早已随灭（remove 空目标 no-op）
  - event: "on_turn_start"
    condition: "$event.actor == '1413' && res__dr_charge < 1 && has_modifier($self, 'DARKEST_RIDDLE') >= 1"
    effects:
      - effect_type: "remove_modifier"
        target: "self"
        modifier_id: "DARKEST_RIDDLE"
      - effect_type: "remove_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}
        modifier_id: "DR_EVEY"
      - effect_type: "remove_modifier"
        target: "all_enemies"
        modifier_id: "DR_VULN"

  # 1141303 孤独，浮游，漆黑 + 1141305 与夜，形影，不离（E0 进场件）：在场闩置位 +
  # 忆灵免控/嘲讽/双方增伤 70%（lv10 #1）+ 被召唤立即行动（1141305）。
  # 嘲讽读法：#2=3 按 aggro_boost 比例池（mechanics 10 taunt_eff=base×(1+Σ)——待实测 B19）
  - event: "actor_enter"
    condition: "$event.actor == '1413_evey' && $event.reason == 'summon'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_eve_on_field"
        amount: 1
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}
        modifier:
          modifier_id: "EVE_SOLITUDE_SELF"
          name: "孤独，浮游，漆黑"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          grants_immune: ["control"]
          stat_effects: {"all_dmg": "param(1141303, 1)", "aggro_boost": "param(1141303, 2)"}
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "EVE_SOLITUDE_OWNER"
          name: "孤独，浮游，漆黑"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"all_dmg": "param(1141303, 1)"}
      - effect_type: "immediate_action"
        target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}

  # 141307 秘技消费（E1）：长夜进场时挂战技同款光环（同 modifier_id=同件）并清途标
  - event: "actor_enter"
    condition: "$event.actor == '1413_evey' && $event.reason == 'summon' && res__tech_pending >= 1"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "actor_type_of($it) == 'summon'"}
        modifier:
          modifier_id: "EVE_SKILL_CRIT"
          name: "白昼悄然离去"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          tick_anchor: "source_turn_start"
          dispellable: False
          stat_effects:
            crit_dmg: "param(141302, 1) * $self.crit_dmg + (count_team(path='remembrance') >= 4 ? 0.65 : count_team(path='remembrance') == 3 ? 0.5 : count_team(path='remembrance') == 2 ? 0.15 : 0.05)"   # 天亮了变档（1413103 count_team 通道——与战技同件同式）
      - effect_type: "set_resource"
        resource_id: "_tech_pending"
        amount: 0

  # 141304 忆质≥16 携质召唤档（E2）：进场即 ≥16 且闩可发 → 立即行动（官方"若忆灵在场
  # 使其立即行动"为存续判——召唤瞬间同判，读法在案）
  - event: "actor_enter"
    condition: "$event.actor == '1413_evey' && $event.reason == 'summon' && res_memoria >= 16 && res__eve_latch < 1"
    effects:
      - effect_type: "immediate_action"
        target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}
      - effect_type: "gain_resource"
        resource_id: "_eve_latch"
        amount: 1

  # 1141306 与你，再见，无期（X0 无条件半）：消失 → 在场闩清 + 双方增伤件摘（忆灵侧件随灭）
  # + 1141307 闩清（快照序：X1 的条件按派发前闩值判定，本清不串同一派发）
  - event: "actor_exit"
    condition: "$event.actor == '1413_evey'"
    effects:
      - effect_type: "remove_modifier"
        target: "self"
        modifier_id: "EVE_SOLITUDE_OWNER"
      - effect_type: "set_resource"
        resource_id: "_eve_on_field"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_eve_used_1307"
        amount: 0

  # 1141306（X1 泛消失档）：非 1141307 消失 → 长夜月速度 +10%（#1，下回合开始移除——
  # duration 1 + owner_turn_start 锚；无法叠加=replace 同件整换）
  - event: "actor_exit"
    condition: "$event.actor == '1413_evey' && res__eve_used_1307 < 1"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "EVEY_PARTING_SPD"
          name: "与你，再见，无期"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 1
          tick_anchor: "owner_turn_start"
          dispellable: False
          stat_effects: {"spd_pct": "param(1141306, 1)"}

  # 141304 天赋·忆质全耗（1141307 自耗 drain 键控件——忆灵侧 1141307 伤害结算在
  # on_action 先跑完，本消耗挂在 drain 事件上天然在其后；声明序在天赋耗血半之后=
  # 自耗 +2 先入账再清零，终态 0；闩复位同槽收尾——自耗 +2 会把闩重新触发置位，
  # 官方"施放如露后方可再次触发"的终态以本钩为准）
  - event: "on_hp_decrease"
    condition: "$event.target == '1413_evey' && $event.source == '1413_evey' && $event.reason == 'drain'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_eve_used_1307"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "memoria"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_eve_latch"
        amount: 0

summons:
  "1413_evey":
    name: "长夜"
    inheritance: ["atk", "def", "crit_rate", "crit_dmg", "break_effect", "effect_hit",
                  "effect_res", "max_energy", "energy_regen", "taunt", "dmg_bonus"]
    # 部分继承（12.4 通用约定"其余面板继承忆师"的落地形）：hp 分量由 max_hp_ratio 覆写、
    # spd 由 base_stats 覆写——full 会整体替换含 spd（141304 固定 160 不随忆师），故列表化
    max_hp_ratio: 0.5         # 141304 #5：生命上限 = 长夜月 ×50%（12_summon v1.1 同小伊卡先例）
    base_stats:
      hp: 1000                # max_hp_ratio 覆写——本块仅编译闸占位（1409 同例）
      spd: 160                # 141304 #4：初始速度 160（固定值，不随忆师）
    actions:
      - action_id: "1141301"
        name: "追忆，蹁跹，如雨"
        action_type: "memosprite_skill"
        target_type: "single"
        damage_type: "ice"
        scaling: [{"hp": 0.25}, {"hp": 0.3}, {"hp": 0.35}, {"hp": 0.4}, {"hp": 0.45},
                  {"hp": 0.5}, {"hp": 0.55}, {"hp": 0.6}, {"hp": 0.65}, {"hp": 0.7}]
        # 生命倍率忆灵技（#1：长夜生命上限 ×%——action 层主段；每 4 点忆质追加 14%（#2/#3）
        # 由忆灵侧 hook 结算）。"自动选择目标，优先长夜月最后攻击的敌人"=prefer_target
        prefer_target: "owner_last_target"
        toughness_dmg: 10     # 米游社：忆灵技削韧 10（action 层承担——有 scaling 生效）
        energy_gain: 0        # 忆灵技回能无源（米游社 null / fandom 无忆灵行）——在案 0
      - action_id: "1141307"
        name: "迷梦，流失，如露"
        action_type: "memosprite_skill"
        # 手动触发型（12_summon §12.6——游戏实况：长夜回合全自动，唯如露忆质≥16 时玩家
        # 窗口手动点放+手选目标）：自动回合合法集剔除，改入终结技窗口 ready 清单
        manual_trigger: true
        # 官方"每点忆质对主目标 16.8%/其余 8.4%"=主目标单选+其余溅射——target_type=single
        # （窗口点放后手选主目标，补差段 $event.target 跟选；aoe 会恒落首个存活=选错人）
        target_type: "single"
        damage_type: "ice"
        # 施放条件（#3：忆质 ≥16 且长夜月不受控）——available_if 收编（03_actor §3.8.1，
        # 2026-09-07；resource_of 跨 actor 读忆师 + controlled 合成 kind 口径）
        available_if: "resource_of('1413', 'memoria') >= param(1141307, 3) && !controlled('1413')"
        # 无 scaling：每点忆质对主目标 16.8%（#1）/ 其余敌方 8.4%（#2）（长夜生命上限基数）
        # 由忆灵侧 hooks 结算
        toughness_dmg: 0      # 米游社削韧 30 由忆灵侧 hook AoE deal_damage 承担（单发 30；
                              # action 无 scaling 不落段，本键保持 0 防双计）
        energy_gain: 0        # 忆灵技回能无源——在案 0
    hooks:
      # 1141301 忆质追加段：每 4 点忆质（#3）追加 14%×长夜生命上限（#2）——
      # resource_of 跨 actor 读忆师忆质（首实例）；主目标 = 行动主目标（$event.target）
      - event: "on_action"
        condition: "$event.actor == '1413_evey' && $event.action_id == '1141301'"
        effects:
          - effect_type: "deal_damage"
            name: "追忆，蹁跹，如雨·忆质"
            target: "$event.target"
            damage_type: "ice"
            amount: "(resource_of('1413', 'memoria') // param(1141301, 3)) * param(1141301, 2) * $self.max_hp"

      # 1141307 结算：每点忆质 8.4%×长夜生命上限打全体 + 主目标再 8.4%（合计 16.8%=#1——
      # 目标代数 where 无 $event 槽，补差法两段化，总伤等价、实例数与官方有差在案）→
      # 1141306 合并速度档预结算（本次消耗忆质=施放时池——先于自耗/天赋入账）→
      # 消耗全部 HP 消失（drain 全量→death→actor_exit；忆质全耗由长夜月侧自耗键控件清零）
      - event: "on_action"
        condition: "$event.actor == '1413_evey' && $event.action_id == '1141307'"
        effects:
          - effect_type: "deal_damage"
            name: "迷梦，流失，如露"
            target: "all_enemies"
            damage_type: "ice"
            amount: "resource_of('1413', 'memoria') * param(1141307, 2) * $self.max_hp"
            toughness_dmg: 30   # 米游社：削韧 30（单发——主目标补差段为建模拆分不重复削，
                                # 下方补差 toughness_dmg 保持 0；hook 通道 2026-09-07 收编）
          - effect_type: "deal_damage"
            name: "迷梦，流失，如露·主目标"
            target: "$event.target"
            damage_type: "ice"
            amount: "resource_of('1413', 'memoria') * param(1141307, 2) * $self.max_hp"
            toughness_dmg: 0    # 补差段不重复削（官方单发 30 已由上方 AoE 段承担）
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id == '1413'"}
            modifier:
              modifier_id: "EVEY_PARTING_SPD"
              name: "与你，再见，无期"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 1
              tick_anchor: "owner_turn_start"
              dispellable: False
              stat_effects:
                spd_pct: "param(1141306, 1) + param(1141306, 2) * min(resource_of('1413', 'memoria'), param(1141306, 3))"
          - effect_type: "drain_hp"
            target: "self"
            amount: "$self.hp"
            drain_ratio: 0

      # 141303 终结技 AoE·在场档（U1）：长夜已在场时开大——AoE 210%×长夜生命上限（#1）
      # **先于**至暗之谜三件（官方序"召唤→长夜 AoE→进入状态"；首召档见 E0u，两档互斥）
      - event: "on_ultimate"
        condition: "$event.source == '1413' && $event.action == '141303'"
        effects:
          - effect_type: "deal_damage"
            name: "晚安，全世界无眠"
            target: "all_enemies"
            damage_type: "ice"
            amount: "param(141303, 1) * $self.max_hp"
            toughness_dmg: 30   # 米游社：终结技削韧 30（U1/E0u 互斥单次——hook 通道 2026-09-07 收编）
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id == '1413'"}
            modifier:
              modifier_id: "DARKEST_RIDDLE"
              name: "至暗之谜"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              grants_immune: ["control"]
              stat_effects: {"all_dmg": "param(141303, 3)"}
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "DR_EVEY"
              name: "至暗之谜"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              grants_immune: ["control"]
              stat_effects: {"all_dmg": "param(141303, 3)"}
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "DR_VULN"
              name: "至暗之谜"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              stat_effects: {"vulnerability": "param(141303, 4)"}

      # 141303 终结技 AoE·首召档（E0u）：开大召唤入场途中的嵌套 actor_enter 派发——
      # _ult_pending 途标识别本次召唤源=终结技；AoE 后同链施加至暗之谜三件（序同 U1）
      - event: "actor_enter"
        condition: "$event.actor == '1413_evey' && $event.reason == 'summon' && resource_of('1413', '_ult_pending') >= 1"
        effects:
          - effect_type: "deal_damage"
            name: "晚安，全世界无眠"
            target: "all_enemies"
            damage_type: "ice"
            amount: "param(141303, 1) * $self.max_hp"
            toughness_dmg: 30   # 米游社：终结技削韧 30（U1/E0u 互斥单次——hook 通道 2026-09-07 收编）
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id == '1413'"}
            modifier:
              modifier_id: "DARKEST_RIDDLE"
              name: "至暗之谜"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              grants_immune: ["control"]
              stat_effects: {"all_dmg": "param(141303, 3)"}
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "DR_EVEY"
              name: "至暗之谜"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              grants_immune: ["control"]
              stat_effects: {"all_dmg": "param(141303, 3)"}
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "DR_VULN"
              name: "至暗之谜"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              stat_effects: {"vulnerability": "param(141303, 4)"}

      # 141302 战技·在场回复半：长夜已在场时施放战技 → 回复其生命上限 50%（#4——
      # 忆灵侧 heal 自施口径：比例基数=长夜自身上限 ✓ 官方"其生命上限"）
      - event: "on_action"
        condition: "$event.actor == '1413' && $event.action_id == '141302' && !$event.insert"
        effects:
          - effect_type: "heal"
            target: "self"
            ratio: "param(141302, 4)"

scaling_notes:
  - 1141307 施放条件（忆质 ≥16 且不受控）：已收——action available_if（03_actor §3.8.1：
    `resource_of('1413', 'memoria') >= 16 && !controlled('1413')`）；忆灵自动回合首合法
    行动恒 1141301（声明序保留——忆灵技玩家选择/手动接管属 12_summon B32，条件满足
    不自动改放 1141307）
  - 施放时序类增益（1413102 +1 / 天黑黑耗血天赋 +2 / 1141301 用后 +1）对忆灵技当次伤害
    基数（1141301 追加段 / 1141307 每点倍率 / 1141306 速度档计数）的计入口径待实测（B19）
    ——本版按注册序：长夜月侧增益 hooks 先跑，全部计入当次（e2e 数值按此口径对轴）
  - 战技光环暴伤快照：施加时刻烘焙（蒙福者族同通道），长夜月暴伤后续变化不追踪；
    动态口径待实测（B19）
