    name: "忆质"
    max: "inf"        # 上限无官方文本（1141306"最多计算40点"侧证池可超 40——计数封顶走表达式）
  _dr_charge:
    max: 2            # 至暗之谜充能（141303 #2：开大 +2；忆灵施放 1141307 后 -1）
  _eve_latch:
