# 角色模板：长夜月（1413）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 收录：忆质特殊资源（上限无官方文本——1141306"最多计算40点"侧证池可超 40，计数封顶走
#       表达式 min(...,40)，池体 max inf 在案待实测 B19）/ 战技耗血召唤+忆灵暴伤光环
#       （source_turn_start 第五锚首实例——挂长夜按长夜月回合开始 -1）/
#       天赋失 HP 双件（受击每目标限 1 次=trigger_limit per_action 双 hook 独立计数 +
#       耗血不限次=drain 通道）/ 忆质≥16 驱散控制（remove_modifier filter $mod 首实例）+
#       免疫+闩锁立即行动 / 至暗之谜 Charge 存续（充能资源+回合开始判退）/
#       1141301 优先忆师末目标（prefer_target=owner_last_target 首实例）+ 忆质追加段
#       （resource_of 跨 actor 读首实例）/ 1141307 全耗消失（自耗尽 HP→death→actor_exit）
#       + 1141306 速度 buff（1141307 档合并值预结算 vs 泛消失档 10% 互斥闩）/
#       终结技削韧 30 + 1141307 削韧 30（hook toughness_dmg 收编——2026-09-07；action 无
#       scaling 不落段，由忆灵侧 hook deal_damage 承担）/
#       三大行迹全收（天黑黑双暴+施放耗血 / 烛火起开局 70 能+施放回能产质 / 天亮了 1 记忆档
#       烘焙 +5%）/ 秘技（旗标→进场光环+忆质）/ 1141307 施放条件（忆质≥16 且不受控——
#       available_if 收编（03_actor §3.8.1，2026-09-07）；140709 换技能同通道）/
#       星魂 E1-E6（见 eidolons 块——E1 忆灵伤害敌数变档 / E2 双暴+忆质获得+2 /
#       E4 忆灵击破效率 / E6 全队抗穿+如露返质 30%；E3/E5 等级族）
# 待收：141309（战技变体——官方触发语境未见（疑似剧情/试用件），在案）/
#       忆灵技回能（米游社 null / fandom 无忆灵行——无源，在案 0）
# 数值：照 query-game-data params 表；action 倍率全表照抄，hook/modifier 侧系数走
#       skill_params 表 + param() 编译期引用（05_effects §5.1——2026-09-08 回填，随档）。
#       **勘正**（param() 回填钓出——双源 StarRailRes+hsr-optimizer 复核）：旧烘焙 141303
#       取成 lv11 行（AoE 210%/增伤 63%/易伤 31.5%）、141304 #2 取成 lv14 行（暴伤 72%），
#       lv10 正档 = 200%/60%/30% 与 60%（e2e 手算常量同批勘正）
actor_id: "1413"
name: "长夜月"
level: 80
path: "remembrance"   # 命途（count_team 编成计数口径——天亮了变档 / 昔涟 1415102 读）
base_stats:
  hp: 1319.472
  atk: 543.312
  def: 582.12
  spd: 99
  crit_rate: 0.587   # 0.05 + 行迹暴击率节点 ×5（0.187）+ 天黑黑 #1 暴击率+35%（大行迹无条件段，
                     # 烘焙面板——1409 阴云莞尔同先例；忆灵 full 继承自动同值）
  crit_dmg: 0.633    # 0.5 + 行迹暴伤节点 ×2（0.133）
  max_energy: 240    # 终结技 240（米游社 energy_cap / fandom 双源）
trace_stat_effects:
  hp_pct: 0.18       # 行迹生命节点 ×3（初始 modifier 通道——pct 白值口径由引擎结算，非烘焙）
trace_notes:
  - 大行迹「天黑黑，月寂寂」：暴击率+35% 已烘焙入 crit_rate；"施放技能时消耗自身当前生命 5%
    使双方暴伤+15%（2 回合）+ 忆灵施放【迷梦，流失，如露】后回 1 战技点" 已收（见 hooks）
  - 大行迹「烛火起，烛火熄」：已收（进战回 70 能+1 忆质；长夜月或我方忆灵施放技能时长夜月
    回 5 能+1 忆质——on_action 与 on_ultimate 双通道，终结技不发 on_action）
  - 大行迹「天亮了，雨落了」：已收（战技持续期间我方全体忆灵暴伤按队伍「记忆」命途人数变档
    +5%/15%/50%/65%（1/2/3/≥4）——count_team(path='remembrance') 编成计数通道，施加时刻快照
    重挂重算（编成战中不变=快照无损），04_modifier §4.16；demo 队 1 记忆→+0.05 与旧烘焙同值）

