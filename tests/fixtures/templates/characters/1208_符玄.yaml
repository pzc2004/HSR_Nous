custom_resources:
  _fx_restore:
    name: "HP Restore 触发计数"
    max: 2
  _fx_cc_block:
    name: "控制抵抗可用次数"
    max: 1
  _e2_used:
    name: "E2 免死已用"
    max: 1
  _e6_pool:
    name: "E6 累计损失生命"
    max: "inf"

techniques:
  - technique_id: "120807"
    name: "岁记否泰，固守四郭"
    point_cost: 1
    effects:
      - effect_type: "set_resource"
        resource_id: "_fx_cc_block"
        amount: 1   # 秘技阵免控次数推定同战技（官方秘技阵=战技阵同款含慧明——待实测在案）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "FU_XUAN_MATRIX"
          name: "穷观阵"
          modifier_type: "buff"
          duration: 2
          dispellable: false
          stat_effects: {}
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "FU_XUAN_KNOWLEDGE"
          name: "慧明"
          modifier_type: "buff"
          duration: 2
          effect_scope: "team"
          dispellable: false
          stat_effects: {}
          stat_exprs:
            # hp flat=生命上限提高（max_hp 系死键无消费端）；stat_of 跨人读符玄
            # 有效 HP——动态追踪（战斗中 HP 上限少变≈快照，快照/动态归属待实测在案）
            hp: "param(120802, 4) * stat_of('1208', 'hp')"
            crit_rate: "param(120802, 5)"
            # 天赋减伤并入慧明辐射（阵存在=慧明在门控自洽，E3 联动 param 折叠自动）——
            # 替代旧 waterfall modify_amount 改写（E2 致死判定读 waterfall 序敏感，stat
            # 通道在 pipeline 乘区内，before_take_damage amount 恒为减伤后值）
            dmg_dmg_reduction: "param(120804, 1)"
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "FU_XUAN_CC_IMMUNE"
          name: "慧明·控制抵抗"
          modifier_type: "buff"
          duration: 2
          dispellable: false
          enable_if: "resource_of('1208', '_fx_cc_block') >= 1"
          grants_immune: ["control"]

