# 角色模板：符玄（1208）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂勘正六件（staging+fixture 同步）：
#   ① 慧明 stat_exprs 重设计——旧案 max_hp 死键（无消费端）+硬编白值 1474.704
#     （丢装备 HP）；正解 hp flat 键 + stat_of('1208','hp') 跨人动态读符玄有效
#     面板（stat_exprs 以受加持者为语境，跨人必走 stat_of；快照/动态归属待实测）
#   ② 天赋减伤通道迁移——旧案 before_take_damage waterfall modify_amount 改写
#     （E2 致死判定读数依赖 waterfall hook 序，脆弱）；正解并入慧明 stat_exprs
#     dmg_dmg_reduction（pipeline 乘区内，before_take_damage amount 恒为减伤后
#     值；阵存在=慧明在门控自洽；E3 lv12=0.196 联动 param 折叠自动）
#   ③ 免控链重构——旧案 after_apply_modifier 挂上再摘（误触发「队友挂负面」
#     计数族 + remove_modifier filter 只摘 dispellable + max_count 8 怪味）；
#     正解 grants_immune ["control"] 字面词表 + enable_if resource_of 跨人门控
#     次数槽 + on_immune 钩清槽（1207 条件件启用滤 pipeline.modifier_enabled
#     首个消费者）；**team scope 不辐射 grants_immune**（modifiers._apply_modifier
#     只查目标自身件）——免疫件独立 FU_XUAN_CC_IMMUNE 挂 all_allies
#   ④ E2 致死条件 -1 偏移勘正（hp_of-1 会在非致命时白送 70% 回血+耗闩；
#     正解 >= hp_of——before_take_damage 发射在护盾吸收前，有盾场景致死误判
#     风险在案待通道）
#   ⑤ E6 cap 硬编白值 → 1.2×$self.max_hp（有效口径，E3 联动自动）
#   ⑥ 天律回血 target 代数去 order_by/take 3（第 4 人/忆灵同场漏治）；另：主干
#     on_battle_start 删 _fx_cc_block 置 0（覆盖秘技钩置 1——秘技钩序先于主干）
#
# 收录：普攻始击岁星（HP 比例 lv6=0.5）/ 战技太微行棋（穷观阵 3 回合+慧明
#       全队 HP 6%/暴击 12%/减伤 18% lv10+回能 30/阵下 50）/ 终结技天律大衍
#       （AoE 1.0×MaxHP lv10+天赋回血次数 +1）/ 天赋护卫（血线 ≤50% 回已损
#       90% lv10，开战 1 次上限存 2）/ 太一璇宫（阵下战技额外回 20）/
#       遁甲幽隐（大招治疗其他角色 5%×MaxHP+133）/ 六壬太岁（全队免控 1 次，
#       重激活重置）/ 秘技进战阵 2 回合（免控次数推定同战技在案）/
#       E1 慧明暴伤 +30% / E2 阵下全队免死 1 次（降至 1 血+回 70%）/
#       E3/E5 等级族 / E4 队友被打回 5 能（逐目标结算在案）/
#       E6 损失池（×2 追加大招，cap 2.4×MaxHP，放后清池）
# 待收（均带挡因）：**伤害分摊 65%**（distribute_damage 通道缺——编译词表无
#       此键，待宿主能力落地；穷观阵 modifier 现仅承载时长/在场语义）/
#       符玄阵亡解除矩阵（死亡传播时序宿主自证缺失）/ 重激活 refresh 语义/
#       秘技阵免控次数推定 / 忆灵治疗语义 / E2 护盾交互（盾后溢出判定通道缺）/
#       E6 乘区归属（追加段 vs 并入基数）与时序（on_ultimate 后追加 vs 同发）/
#       E4 AoE 逐人 vs 按动作 / 行迹属性节点（数据未下发）
