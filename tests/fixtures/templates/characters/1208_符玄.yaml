eidolons:
  E1:
    name: "Dominus Pacis"
    hooks:
      - event: "on_action"
        condition: "$event.actor == '1208' && $event.action_id == '120802' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_KNOWLEDGE_CRITDMG"
              name: "慧明·暴伤"
              modifier_type: "buff"
              duration: 3
              effect_scope: "team"
              dispellable: false
              stat_effects: {"crit_dmg": 0.30}
  E2:
    name: "Optimus Felix"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e2_used"
            amount: 0
      - event: "before_take_damage"
        condition: "actor_type_of($event.target) != 'monster' && $event.amount >= hp_of($event.target) && has_modifier($self, 'FU_XUAN_MATRIX') >= 1 && res__e2_used < 1"
        effects:
          - effect_type: "modify_amount"
            amount: "hp_of($event.target) - 1"
          - effect_type: "heal"
            target: "$event.target"
            amount: "0.7 * max_hp_of($event.target)"
          - effect_type: "set_resource"
            resource_id: "_e2_used"
            amount: 1
  E3:
    name: "Apex Nexus"
    skill_level_overrides: {"skill": 2, "talent": 2}
    notes:
      - "战技+2 实取 lv12 档：慧明生命 0.066 / 暴击 0.132；天赋+2 实取 lv12 档：减伤 0.196 / 回复 0.92（触发线恒 0.5 不动）"
  E4:
    name: "Fortuna Stellaris"
    hooks:
      - event: "on_become_target"
        condition: "$event.target != '1208' && actor_type_of($event.target) != 'monster' && has_modifier($self, 'FU_XUAN_MATRIX') >= 1"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 5
    notes:
      - "AoE/多段命中多友方是否逐人结算（文本未限次）→ 待实测"
  E5:
    name: "Arbiter Primus"
    skill_level_overrides: {"ultimate": 2, "basic": 1}
    notes:
      - "终结技+2 实取 lv12 档=1.08；普攻+1：普攻表仅 10 档（上限 10）——第 11 档无值，param() 越档钳表尾+⚠编译警告口径（实取 lv10=0.70）"
  E6:
    name: "Omnia Vita"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e6_pool"
            amount: 0
      - event: "on_hp_decrease"
        condition: "actor_type_of($event.target) != 'monster' && has_modifier($self, 'FU_XUAN_MATRIX') >= 1"
        effects:
          - effect_type: "gain_resource"
            resource_id: "_e6_pool"
            amount: "$event.amount"
      - event: "on_ultimate"
        condition: "$event.source == '1208' && $event.action == '120803'"
        effects:
          - effect_type: "deal_damage"
            name: "Omnia Vita"
            target: "all_enemies"
            damage_type: "quantum"
            amount: "2 * min(res__e6_pool, 1.2 * $self.max_hp)"
          - effect_type: "set_resource"
            resource_id: "_e6_pool"
            amount: 0
    notes:
      - "E6 累计池属非标准宿主能力（modifier 层 accumulate/tally 糖键未接线）——本块以 custom_resources + hook 池候选近似；分摊计入/治疗冲减/上限快照时点/加成乘区归属待实测"

hooks:
  - event: "on_battle_start"
    effects:
      # 初始 1 次天赋回血（官方）；_fx_cc_block/_e2_used/_e6_pool 声明缺省 0 不重复置
      # ——_fx_cc_block 开战置 0 会覆盖秘技注入钩的置 1（秘技钩序先于主干）
      - effect_type: "set_resource"
        resource_id: "_fx_restore"
        amount: 1

  - event: "on_hp_decrease"
    condition: "$event.target == '1208' && hp_of($event.target) > 0 && hp_of($event.target) / max_hp_of($event.target) <= param(120804, 2) && res__fx_restore >= 1"
    effects:
      - effect_type: "heal"
        target: "self"
        amount: "param(120804, 3) * (max_hp_of($event.target) - hp_of($event.target))"
      - effect_type: "gain_resource"
        resource_id: "_fx_restore"
        amount: -1

  - event: "on_ultimate"
    condition: "$event.source == '1208' && $event.action == '120803'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_fx_restore"
        amount: 1

  - event: "on_action"
    condition: "$event.actor == '1208' && $event.action_id == '120802' && !$event.insert"
    effects:
      - effect_type: "set_resource"
        resource_id: "_fx_cc_block"
        amount: 1
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "FU_XUAN_CC_IMMUNE"
          name: "慧明·控制抵抗"
          modifier_type: "buff"
          duration: 3
          dispellable: false
          enable_if: "resource_of('1208', '_fx_cc_block') >= 1"
          grants_immune: ["control"]

  - event: "on_immune"
    condition: "actor_type_of($event.target) != 'monster' && res__fx_cc_block >= 1"
    effects:
      # 全队共享 1 次：任何人触发即清槽（enable_if 跨人读槽——全队免疫同步关闭）
      - effect_type: "set_resource"
        resource_id: "_fx_cc_block"
        amount: 0

  - event: "on_action"
    condition: "$event.actor == '1208' && $event.action_id == '120802' && !$event.insert && has_modifier($self, 'FU_XUAN_MATRIX') >= 1"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 20

  - event: "on_ultimate"
    condition: "$event.source == '1208' && $event.action == '120803'"
    effects:
      - effect_type: "heal"
        # 去 order_by/take 3 旧案：第 4 人/忆灵同场会漏治；忆灵治疗语义待实测在案
        target: {pool: "allies", where: "$it.actor_id != '1208' && actor_type_of($it) != 'monster'"}
        amount: "0.05 * $self.max_hp + 133"

scaling_notes:
  - "伤害分摊（65%，护盾前——EN 'before this DMG is mitigated by any Shields'）：编译词表无 distribute_damage 键 → 待收宿主能力，不自造键；矩阵 modifier 现仅承载时长/在场语义"
  - "矩阵在场判定统一走 has_modifier($self, 'FU_XUAN_MATRIX')（战技 3 回合 / 秘技进战 2 回合两挂点同 modifier_id，duration 短者先到期；重激活 refresh 语义待实测）"
  - "符玄阵亡解除矩阵（EN 'When Fu Xuan is knocked down, the Matrix will be dispelled'）：死亡传播时序宿主自证缺失 → 待实测（暂靠 duration 自然到期）"
  - "慧明 Max HP 加成=hp flat 键 + stat_of('1208','hp') 跨人动态读符玄有效面板（旧案 max_hp 死键+硬编白值 1474.704 已废——stat_exprs 以受加持者为语境，跨人必走 stat_of）；快照/动态归属待实测在案"
  - "E2 致死判定口径：before_take_damage amount=乘区结算后值（天赋减伤已并 stat 通道，判定读数=减伤后 ✓）；发射点在护盾吸收前——有盾场景致死误判风险在案（盾后溢出判定通道缺，待实测/待通道）"
  - "普攻/终结技伤害官方基数区=符玄 Max HP：action scaling hp 系（action_scaling 通道已覆盖，无需 hook 真值基数）"
