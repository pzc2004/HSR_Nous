custom_resources:
  _counter_n:
    max: 3

techniques:
  - technique_id: "100107"
    name: "冻人的瞬间"
    point_cost: 1
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "enemies", take: 1, mode: "random"}
        modifier:
          modifier_id: "MARCH_TECH_FROZEN"
          name: "冻人的瞬间·冻结"
          modifier_type: "debuff"
          duration: 1
          dispellable: True

actions:
  - action_id: "100101"
    name: "极寒的弓矢"
    action_type: "basic"
    target_type: "single"
    damage_type: "ice"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    toughness_dmg: 10
    skill_point_gain: 1
    energy_gain: 20

  - action_id: "100102"
    name: "可爱即是正义"
    action_type: "skill"
    target_type: "single"
    damage_type: "ice"
    skill_point_cost: 1
    energy_gain: 30

  - action_id: "100103"
    name: "冰刻箭雨之时"
    action_type: "ultimate"
    target_type: "aoe"
    damage_type: "ice"
    energy_cost: 120
    scaling: [{"atk": 0.9}, {"atk": 0.96}, {"atk": 1.02}, {"atk": 1.08}, {"atk": 1.14},
              {"atk": 1.2}, {"atk": 1.275}, {"atk": 1.35}, {"atk": 1.425}, {"atk": 1.5},
              {"atk": 1.56}, {"atk": 1.62}, {"atk": 1.68}, {"atk": 1.74}, {"atk": 1.8}]
    toughness_dmg: 20
    skill_point_cost: 0
    energy_gain: 5

  - action_id: "100104"
    name: "少女的特权"
    action_type: "follow_up"
    level_key: "talent"        # 天赋反击按天赋等级取档（缺省 follow_up 回落 ultimate——
                               # E3 ult+2 会误抬到 lv12，E5 talent+2 才是正主轨道）
    target_type: "single"
    damage_type: "ice"
    scaling: [{"atk": 0.5}, {"atk": 0.55}, {"atk": 0.6}, {"atk": 0.65}, {"atk": 0.7},
              {"atk": 0.75}, {"atk": 0.8125}, {"atk": 0.875}, {"atk": 0.9375}, {"atk": 1.0},
              {"atk": 1.05}, {"atk": 1.1}, {"atk": 1.15}, {"atk": 1.2}, {"atk": 1.25}]
    toughness_dmg: 10
    skill_point_cost: 0
    energy_gain: 10

hooks:
  - event: "on_action"
    condition: "$event.actor == '1001' && $event.action_id == '100102' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "MARCH_SKILL_SHIELD"
          name: "可爱即是正义·护盾"
          modifier_type: "buff"
          duration: 4
          dispellable: True
          shield:
            scaling: {def_: "param(100102, 1)"}   # lv10=0.57（draft 写 0.608 幻视勘正——
                                    # 官方 100102 #1=0.57；param() 随档，B27 #6 槽已收）
            flat: "param(100102, 4)"              # lv10=760（draft 写 845.5 幻视勘正）
      - effect_type: "remove_modifier"
        target: "$event.target"
        filter: "$mod.kind == 'debuff'"
        max_count: 1

  - event: "on_action"
    condition: "$event.actor == '1001' && $event.action_id == '100103' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "enemies", mode: "deterministic"}
        modifier:
          modifier_id: "MARCH_FROZEN"
          name: "冰刻箭雨之时·冻结"
          modifier_type: "debuff"
          duration: 1
          dispellable: True

  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'MARCH_FROZEN') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "冰刻箭雨之时·冻结附伤"
        target: "$event.actor"
        damage_type: "ice"
        amount: "param(100103, 4) * $self.atk"
  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'MARCH_TECH_FROZEN') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "冻人的瞬间·冻结附伤"
        target: "$event.actor"
        damage_type: "ice"
        amount: "0.5 * $self.atk"

  # 天赋反击：带战技护盾的我方**受击**（命中语义——护盾吸收不发 on_hp_decrease，draft 错挂
  # on_hp_decrease 致反击永不触发，过堂钓出）；限次 = 每回合 2 次（100104 #2）
  - event: "after_being_hit"
    condition: "actor_type_of($event.target) != 'monster' && has_modifier($event.target, 'MARCH_SKILL_SHIELD') >= 1 && res__counter_n < 2"
    effects:
      - effect_type: "deal_damage"
        name: "少女的特权"
        target: "$event.source"
        damage_type: "ice"
        amount: "param(100104, 1) * $self.atk"
        toughness_dmg: 10
      - effect_type: "gain_resource"
        resource_id: "_counter_n"
        amount: 1

  - event: "on_turn_start"
    condition: "$event.actor == '1001'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_counter_n"
        amount: 0

eidolons:
  E1:
    name: "Memory of You"
    notes:
      - "大招每冻结一个目标回复 6 能量（EN 'Every time … Freezes a target, she regenerates 6 Energy'——按冻结目标数逐个触发，5 目标全冻 = +30）——待收：冻结成功事件载荷键（on_freeze 族）与能量回复 effect 通道（gain_energy）均无现役词表，双缺挡因；ERR 乘区修正亦待实测"
  E2:
    name: "Memory of It"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "allies", order_by: "$it.hp / $it.max_hp", take: 1, mode: "deterministic"}
            modifier:
              modifier_id: "MARCH_E2_SHIELD"
              name: "Memory of It·护盾"
              modifier_type: "buff"
              duration: 3
              dispellable: True
              shield:
                scaling: {def_: 0.24}
                flat: 320
  E3:
    name: "Memory of Everything"
    skill_level_overrides: {"ultimate": 2, "basic": 1}
    notes:
      - "终结技+2 随档段：全体倍率 scaling（实取 lv12 档）+ 冻结附伤 param(100103, 4)（hook 随档）；普攻+1：官方数据普攻仅 10 档（params 10 行），无第 11 档可取——不脑补数值，param() 越档钳表尾 + ⚠ 编译警告口径"
  E4:
    name: "Never Forfeit Again"
    hooks:
      # E4 第 3 发（counter_n==2 放行）：同主干命中语义修正
      - event: "after_being_hit"
        condition: "actor_type_of($event.target) != 'monster' && has_modifier($event.target, 'MARCH_SKILL_SHIELD') >= 1 && res__counter_n == 2"
        effects:
          - effect_type: "deal_damage"
            name: "少女的特权"
            target: "$event.source"
            damage_type: "ice"
            amount: "param(100104, 1) * $self.atk + 0.3 * $self.def_"
            toughness_dmg: 10
          - effect_type: "gain_resource"
            resource_id: "_counter_n"
            amount: 1
    notes:
      - "E4 的 +30% DEF 附加对第 1/2 发反击同样生效（官方文本未限定档位）——待收：星魂条件查询通道（eidolon 旗标表达式）无现役键，无法在基础 hook 金额式内分支，挡因在案（demo 无观察差时先按仅第 3 发承载）"
  E5:
    name: "Never Forget Again"
    skill_level_overrides: {"skill": 2, "talent": 2}
    notes:
      - "战技+2：护盾 DEF%/固定值随档（param(100102, 1/4)，实取 lv12 档 = 0.608 / 845.5）；持续列全档常量 3 + Reinforce = 4（字面值 4 不随档变）；天赋+2：反击倍率 param(100104, 1) 实取 lv12 档 = 1.1"
  E6:
    name: "Just Like This, Always..."
    hooks:
      - event: "on_turn_start"
        condition: "actor_type_of($event.actor) != 'monster' && has_modifier($event.actor, 'MARCH_SKILL_SHIELD') >= 1"
        effects:
          - effect_type: "heal"
            target: "$event.actor"
            amount: "0.04 * max_hp_of($event.actor) + 106"

scaling_notes:
  - "战技嘲讽（EN \"greatly increases the chance of enemies attacking that ally\"，门槛 = 受盾目标 HP% ≥ 30%）：官方仅定性、无倍率/概率数值 + taunt 通道无现役键 → 待收（不脑补）"
  - "战技护盾重复施放行为（覆盖旧盾 / 继承剩余值 / 加算）官方文本未写 → 待实测"
  - "战技护盾持续回合：param(100102, 2) 全档常量 3 + Reinforce(#1001102)=+1 → 编译期结算字面值 4（duration 通道不接受表达式）"
  - "战技护盾数值：shield.scaling/flat 走 param() 编译期取档（05_effects §5.1 已接线——随档含星魂 +2，B27 #6 槽已收）→ scaling=param(100102,1)（lv10=0.57）、flat=param(100102,4)（lv10=760）；E5 战技+2 自动跳 lv12 档 0.608/845.5（draft 期落字面值 0.608/845.5 系幻视，已勘正）"
  - "大招冻结持续回合：param(100103, 3) 全档常量 1 → 编译期结算字面值 1（duration 通道不接受表达式）"
  - "大招冻结基础概率 0.65（0.50 + Ice Spell 0.15 加法）：chance/effect_chance 通道无现役键 → 本版按必冻承载（deterministic），效果命中/抗性修正公式与 +0.15 加算顺序 → 待实测（首个带冻结抗性敌方实例到达时收）"
  - "冻结\"不可行动\"控制位与附伤属性快照时点（施放时快照 ATK vs 每回合实时 ATK）→ 待实测"
  - "天赋反击回能 +10（tbgd）在 hook deal_damage 承载通道下是否结算 → 待实测（action 层 energy_gain 仅在行动通道播放时入账）"
  - "天赋\"每回合\"重置口径（三月七自身回合 vs 全局每回合）→ 待实测；AoE 多目标同时命中带盾我方的反击判定分摊 → 待实测"
  - "削韧全部降级米游社 sub_tag（fandom 三月七字段空表——社区兜底，非 fandom 权威）：普攻 10 / 大招 20 / 反击 10 / 秘技 20"
  - "战技 SP 消耗以 tbgd BPNeed=1 为权威（mys 无消耗标视为漏标）"
  - "100106「攻击」（通用占位条目，无参数、SP/回能全 0）：按纪律不产出 action，仅登记存在"
