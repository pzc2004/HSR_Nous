# 角色模板：三月七（1001）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂钓出幻视：战技护盾 draft 写 60.8% DEF+845.5（官方 100102 lv10=[0.57,3,0.3,760,5]
#   ——57% DEF+760）——幻脑旧值勘正并接 param() 随档（shield 槽 B27 #6 已收）
#
# 收录：战技护盾（57% DEF+760 随档、持续 3+Reinforce 1=4 回合）+ Purify 净化 1 负面
#       （LIFO 截断）/ 天赋反击（带战技盾我方受击 → 1.0×ATK 反击，每回合 2 次+
#       回合开始重置）/ 大招全体冻结（必冻承载——chance 通道待收）+ 冻结附伤
#       0.6×ATK 随档 / 秘技冻结+附伤 0.5×ATK / E2 开战盾最低血%（24% DEF+320）/
#       E4 第 3 发反击 +30% DEF 附加 / E3/E5 等级族
# 待收（均带挡因）：冻结基础概率 0.65（chance/effect_chance 通道缺——现必冻承载）/
#       E1 冻结回能（on_freeze 事件载荷键+能量通道双缺）/ 战技嘲讽权重
#       （taunt 键+官方定性无数值）/ 反击回能入账时点 / E4 +30% DEF 对 1/2 发同样生效
#       （星魂旗标表达式键缺——现仅第 3 发承载）/ 护盾重复施放叠加规则
actor_id: "1001"
name: "三月七"
level: 80
path: "preservation"
groups: ["group:hunt_march"]
element: "ice"
energy_name: "能量"
base_stats:
  hp: 1058.4
  atk: 511.56
  def: 573.3
  spd: 101
  crit_rate: 0.05
  crit_dmg: 0.5
  max_energy: 120
trace_notes:
  - 大行迹「Purify」（1001101）已收：使用战技时净化受盾目标 1 个负面（remove_modifier filter+max_count 结构块）
  - "战技护盾数值勘正（过堂钓出幻视）：draft 写 60.8% DEF+845.5 → 官方 100102 #1=0.57/#4=760（lv10）——接 param() 随档（shield 槽已收）"
  - 大行迹「Reinforce」（1001102）已收：战技护盾持续 +1 回合（3→4，编译期结算为字面值 4）；E2 开战盾是否同享官方文本未写（限定 "generated from Skill"）→ 待实测
  - 大行迹「Ice Spell」（1001103）已收数值账：大招冻结基础概率 0.50 → 0.65（加法）；chance/effect_chance 通道无现役键 → 冻结施加暂按必冻承载（挡因在案，见 scaling_notes）
  - 行迹 SPD/暴击/暴伤节点数据未提供 → trace_stat_effects 留空，base_stats 维持管线实值（≥管线值纪律满足）
trace_stat_effects: {}

