# 角色模板：万敌（1404）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 首个真跑产物（data_pull→crosscheck→evidence→draft→编译/冒烟闸→finalize）
#       + 人工闸全审回填（白值实值/大行迹三件/skill_params lv10 单行/削韧 tbgd stance÷3）
#
# 收录：常规能量槽 160（无特殊充能显示名——Charge 为独立 custom_resources 不占能量槽）
#       + Charge 充能资源（上限 200，损血每 1% Max HP=1 点，敌源笔吃血祥罩衫三元乘）
#       + 血仇形态（VENDETTA：Max HP+50%/DEF 恒 0/1404102 三十僭主免疫控制 grants_immune）
#       + 血仇双自动技（弑王成王回合开始/弑神登神阈值 150，trigger_action 插入档——
#       官方 EN "automatically used" 双实例）+ 免死双分支（1404101 水与泥土前 3 次致命
#       不清退 vs 第 4 次起天赋清空退血仇回 50%——before_take_damage waterfall cancel
#       白厄 140805/遐蝶 1140703 同构）+ 终结技（回 22.5% Max HP+充能+20+嘲讽 2 回合+
#       登神打标）+ 战技双 drain_hp（50%/35% floor 1）+ 大行迹三件全收（1404103 血祥罩衫
#       条件光环 enable_if+stat_exprs 1409 暴风停歇同构）+ 秘技进战装填（80% Max HP AoE
#       +嘲讽 1 回合+充能 50）+ 星魂 E1-E6（E2 治疗转化充能/E3E5 等级族/E4 暴伤+敌击回血
#       /E6 入场血仇+弑神登神阈值降档 150→100）
#
# 待收（挡因在案，详见 scaling_notes/eidolons notes）：E1 倍率+目标域覆写通道缺 /
#       E2 无视 DEF 乘区未举证 / 打标优先锁定目标查询通道 / 真额外回合通道（advance_action
#       100 近似）；待实测：血仇内手动操作权/自动技目标选取规则/天赋免死不限次/小数充能取整
