hooks:
  # 1404103 血祥罩衫（A6 大行迹）：战斗开始时若 Max HP >4000，每超 100 点
  # crit_rate +1.2%、敌源伤害充能比例 +2.5%、受疗 +0.75%（超档最多计入 4000 点 HP——
  # 条件光环 enable_if+stat_exprs（1409 暴风停歇同构）；充能比例在下方充能钩三元乘
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "BLOOD_SILK_COVER"
          name: "血祥罩衫"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "$self.max_hp > 4000"
          stat_exprs:
            crit_rate: "min(max($self.max_hp - 4000, 0), 4000) / 100 * 0.012"
            incoming_heal: "min(max($self.max_hp - 4000, 0), 4000) / 100 * 0.0075"

  # 140404 天赋·充能：每损失 1% Max HP 累积 1 点 Charge（上限 200 由资源钳）——
  # 施放「弑神登神」期间无法累积（_gsb_busy 闩，官方明示）；
  # 血祥罩衫敌源伤害充能比例 +2.5%/超 100（三元只乘敌源笔，自耗/队友伤害不加）
  - event: "on_hp_decrease"
    condition: "$event.target == '1404' && res__gsb_busy < 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: "$event.amount / $self.max_hp * 100 * (1 + (actor_type_of($event.source) == 'monster' ? min(max($self.max_hp - 4000, 0), 4000) / 100 * 0.025 : 0))"
    # 注：小数充能取整口径待实测（资源通道整数语义 vs 官方"每 1%"逐点记账）

  # 140404 天赋·入血仇：Charge ≥100（非血仇态）→ 耗 100 + 回 Max HP 30% + 行动提前 100%
  # + 进入血仇（VENDETTA：Max HP +50%、DEF 恒 0）
  - event: "on_hp_decrease"
    condition: "$event.target == '1404' && res__vendetta < 1 && res_charge >= 100"
    effects:
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: -100
      - effect_type: "heal"
        target: "self"
        ratio: "param(140404, 1)"        # lv10 #1：Max HP 30%
        amount: 0
      - effect_type: "advance_action"
        target: "self"
        amount: 100
      - effect_type: "set_resource"
        resource_id: "_vendetta"
        amount: 1
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "VENDETTA"
          name: "血仇"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          # Max HP +50%（talent #5）走 hp_pct 池（_PCT_BASE 词表实证——max_hp_pct 非
          # 结算通道名，打标初稿误植 e2e 钓出勘正）+ DEF 恒 0（def_pct -1.0）
          stat_effects: {"hp_pct": "param(140404, 5)", "def_pct": -1.0}
          # 1404102 三十僭主（A4 大行迹）：血仇中免疫控制类负面（官方 desc 无参）——
          # grants_immune 通道（1409 雨过天晴小伊卡同族）
          grants_immune: ["control"]

  # 140404 天赋·血仇自动技：回合开始自动施放「弑王成王」（官方"回合开始自动施放"）——
  # trigger_action 插入档通道（同 1407 焰息连发注记口径）；目标选取保守默认 random，
  # 官方未指明（待实测——扩散主目标选取规则）
  - event: "on_turn_start"
    condition: "$event.actor == '1404' && res__vendetta >= 1"
    effects:
      - effect_type: "trigger_action"
        action_id: "140409"
        target: {pool: "enemies", take: 1, mode: "random"}

  # 140404 天赋·登神：血仇中 Charge ≥150（E6 后 100）→ 耗充能 + 立刻获得 1 个额外回合
  #（额外回合通道缺——advance_action 100 近似，待实测）+ 自动施放「弑神登神」；
  # 施放期间禁充能（_gsb_busy 先置后清——声明序内触发的 drain 失血不记账）
  - event: "on_hp_decrease"
    condition: "$event.target == '1404' && res__vendetta >= 1 && res_charge >= 150 - 50 * res__e6_gsb"
    effects:
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: "0 - (150 - 50 * res__e6_gsb)"
      - effect_type: "advance_action"
        target: "self"
        amount: 100
      - effect_type: "set_resource"
        resource_id: "_gsb_busy"
        amount: 1
      - effect_type: "trigger_action"
        action_id: "140411"
        target: {pool: "enemies", take: 1, mode: "random"}
      - effect_type: "set_resource"
        resource_id: "_gsb_busy"
        amount: 0

  # 终结技充能入口（+20）后同判登神阈值（大招回充可直接顶过 150）
  - event: "on_ultimate"
    condition: "$event.source == '1404' && $event.action == '140403' && res__vendetta >= 1 && res_charge + param(140403, 5) >= 150 - 50 * res__e6_gsb"
    effects:
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: "0 - (150 - 50 * res__e6_gsb)"
      - effect_type: "advance_action"
        target: "self"
        amount: 100
      - effect_type: "set_resource"
        resource_id: "_gsb_busy"
        amount: 1
      - effect_type: "trigger_action"
        action_id: "140411"
        target: {pool: "enemies", take: 1, mode: "random"}
      - effect_type: "set_resource"
        resource_id: "_gsb_busy"
        amount: 0

  # 免死双分支（A2 水与泥土 1404101 先行消费 → 天赋 140404 兜底）：
  # 前 3 次致命攻击 = 不倒下且不清空不退场（水与泥土，param #1=3/场，官方文本实锤——
  # owner 实战口径纠正"官方无次数"误判）；第 4 次起 = 天赋本体（清空+退出血仇+回 50%）。
  # 分支 A：水与泥土（counter > 0）——cancel 致命伤 + 计数 -1；不清充能/不退血仇/不回血
  - event: "before_take_damage"
    condition: "$event.target == '1404' && res__vendetta >= 1 && $event.amount >= hp_of($event.target) && res_mud_soil >= 1"
    effects:
      - effect_type: "cancel_event"
      - effect_type: "gain_resource"
        resource_id: "mud_soil"
        amount: -1
  # 分支 B：天赋本体（counter 尽）——cancel + 清空充能 + 退出血仇 + 回 Max HP 50%（#4）
  #（before_take_damage waterfall cancel 路径，白厄 140805 / 1407 1140703 同构；伤害残留口径待实测）
  - event: "before_take_damage"
    condition: "$event.target == '1404' && res__vendetta >= 1 && $event.amount >= hp_of($event.target) && res_mud_soil < 1"
    effects:
      - effect_type: "cancel_event"
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: "0 - res_charge"
      - effect_type: "set_resource"
        resource_id: "_vendetta"
        amount: 0
      - effect_type: "remove_modifier"
        modifier_id: "VENDETTA"
      - effect_type: "heal"
        target: "self"
        ratio: "param(140404, 4)"        # lv10 #4：Max HP 50%
        amount: 0

  # 140403 终结技：回 Max HP 22.5%（#3）+ 累积 20 点充能（#5）+ 目标嘲讽 2 回合（#4）
  # + 打标（下一次「弑神登神」优先攻击该指定敌人，只对最新打标生效——旧标 refresh 覆盖）
  - event: "on_ultimate"
    condition: "$event.source == '1404' && $event.action == '140403'"
    effects:
      - effect_type: "heal"
        target: "self"
        ratio: "param(140403, 3)"
        amount: 0
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: "param(140403, 5)"
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "MYDEI_TAUNT_ULT"
          name: "诛天焚骨的王座·嘲讽"
          modifier_type: "debuff"
          duration: 2                 # lv10 #4：2 回合（duration 非 param() 槽——
                                    # 表达式槽清单见 05_effects §5.1；字面值与 lv10 单行钳表尾口径一致）
          dispellable: True
          # 嘲讽=敌方强制普攻施放者（敌方控制通道待实测——Boss/免疫交互见待收清单 ⑥）
          # 相邻目标同受嘲讽：blast 邻域选择器缺（$event.target 仅主目标）→ 待收
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "MYDEI_GSB_MARK"
          name: "诛天焚骨的王座·登神标记"
          modifier_type: "debuff"
          duration: 0
          dispellable: False
          # 「弑神登神」优先攻击被标目标：自动技目标选择走标记查询通道待实测
          #（trigger_action 目标现为保守 random 默认——见待收清单 ⑤）

  # 140402 战技：消耗自身当前 HP 的 50%（lv10 #3；当前 HP 不足时降至 1 = floor 1）
  - event: "on_action"
    condition: "$event.actor == '1404' && $event.action_id == '140402'"
    effects:
      - effect_type: "drain_hp"
        target: "self"
        amount: "param(140402, 3) * $self.hp"
        floor: 1
        drain_ratio: 0

  # 140409 弑王成王：消耗自身当前 HP 的 35%（lv10 #3，floor 1 同口径）
  - event: "on_action"
    condition: "$event.actor == '1404' && $event.action_id == '140409'"
    effects:
      - effect_type: "drain_hp"
        target: "self"
        amount: "param(140409, 3) * $self.hp"
        floor: 1
        drain_ratio: 0

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN（数值/机制照抄官方星魂文本）
eidolons:
  E1:
    name: "Frost Hones Spine of Steel"
    notes:
      - "「弑神登神」主目标倍率 +30%（lv10：280% → 310%）且目标域 扩散 → 全体 AoE——待收。挡因同 1407 E6：eidolons overrides 仅消费 state_config，action 层 scaling/目标域覆写通道缺；数值在案（380%/全体），通道到手即收"
  E2:
    name: "Strife Beholds Cry of Dead"
    hooks:
      # 受到治疗后，治疗量 40% 转化为 Charge——单次统计上限 40 点（_e2_heal_accum 钳位）、
      # 任意单位行动后重置统计（on_turn_end 清零；事件通道名待实测——挡因：任意单位行动锚
      # 未在既有事件词表举证）
      - event: "on_hp_increase"
        condition: "$event.target == '1404' && $event.reason == 'heal'"
        effects:
          - effect_type: "gain_resource"
            resource_id: "charge"
            amount: "min(0.4 * $event.amount, 40 - res__e2_heal_accum)"
          - effect_type: "gain_resource"
            resource_id: "_e2_heal_accum"
            amount: "min(0.4 * $event.amount, 40 - res__e2_heal_accum)"
      - event: "on_turn_end"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e2_heal_accum"
            amount: 0
    notes:
      - "血仇中伤害无视敌方 15% DEF——待收。挡因：无视 DEF 乘区通道不在既有 stat_effects 词表（def_ignore 未举证），不造键；过量治疗是否计入转化口径同待收（清单 ⑦⑪）"
  E3:
    name: "Honor Exalts Feast of Faith"
    skill_level_overrides: {"skill": 2, "basic": 1}   # Skill +2（上限 15）、Basic ATK +1（上限 10）
    notes:
      - "本版 skill_params 仅 lv10 单行（钳表尾）——等级跳档无档可取，全表回填后随档生效；140409/140411 同为 Skill 标签是否同吃 +2 待核（官方星魂文本措辞域）"
  E4:
    name: "Siren Jolts the Laconic Lion"
    hooks:
      # 血仇中暴击伤害 +30%（每回合刷新挂——血仇内等效持续；tick 锚待实测）
      - event: "on_turn_start"
        condition: "$event.actor == '1404' && res__vendetta >= 1"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_VENDETTA_CRIT_DMG"
              name: "Siren Jolts the Laconic Lion"
              modifier_type: "buff"
              duration: 1
              dispellable: False
              stat_effects: {"crit_dmg": 0.3}
      # 受到敌方攻击后回复 Max HP 10%
      - event: "on_hp_decrease"
        condition: "$event.target == '1404' && $event.reason == 'hit' && actor_type_of($event.source) == 'monster'"
        effects:
          - effect_type: "heal"
            target: "self"
            amount: "0.1 * $self.max_hp"    # 星魂文本字面值（无 params 轨道）
  E5:
    name: "War Chisels Flesh of Flame"
    skill_level_overrides: {"ultimate": 2, "talent": 2}   # Ultimate +2、Talent +2（上限 15）
    notes:
      - "本版 skill_params 仅 lv10 单行（钳表尾）——跳档无档可取，全表回填后随档（终结技倍率/治疗/嘲讽回合、天赋阈值/治疗/免死回血随档）"
  E6:
    name: "Legacy Scales Mound of Blood"
    hooks:
      # 入场直接进入血仇（不含入态治疗 30%/行动提前——那是充能 100 触发段，官方分开表述）；
      # 弑神登神阈值降至 100（_e6_gsb 闩 → 阈值/耗能表达式 150-50*闩）
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_vendetta"
            amount: 1
          - effect_type: "set_resource"
            resource_id: "_e6_gsb"
            amount: 1
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "VENDETTA"
              name: "血仇"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"hp_pct": "param(140404, 5)", "def_pct": -1.0}

scaling_notes:
  - "params 全表待收：证据仅给 lv10——skill_params 每技单行，param(id, n) 越档钳表尾 ⇒ 任意等级取 lv10 值，与取档约定一致；action scaling 同为 lv10 单行"
  - "万死无悔战技点冲突：tbgd BPNeed sp_cost=0（权威）+ 米游社 sub_tag 无消耗标 ⇒ 判不耗不产；与「毁灭战技通常耗 1 点」常识冲突 → 待实测（权威不改）"
  - "血仇控制模型：弑王成王（回合开始）与弑神登神（阈值）文本明示 automatically used；普攻/万死无悔/大招为玩家操控，血仇内手动操作权待实测（清单 ④）"
  - "自动技目标选择：无大招打标时保守 random 默认；打标优先锁定走 MYDEI_GSB_MARK 查询通道待实测（清单 ⑤）"
  - "免死次数：官方文本未写上限，社区称「次数有限」——本版按血仇内不限次实现，待实测（清单 ⑦）"
  - "id 140406「攻击」为敌方通用攻击动作（环境条目，非玩家技能）——不建模"
  - "削韧已全（tbgd stance ÷3 显示口径）：普攻 10 / 万死无悔主 20 相邻 10 / 弑王成王主 20 相邻 10 / 弑神登神主 30 相邻 20 / 终结技主 20 相邻 20"
  - "action scaling 档位勘正（e2e 钓出）：初稿把 15 行表的末行（lv15）误标 lv10 取字面值——
    现役=全表照抄 params，取档 index=等级-1（默认 skill/ult/talent lv10=idx 9、basic lv6=idx 5），
    param() 钩内引用同口径；教训：打标草稿的'lv10 直觉'必须落行号，不许目测表尾"
