level: 80
path: "destruction"   # 命途（count_team 编成计数口径——官方数据照抄）
element: "imaginary"  # 元素（element_of 取数源——官方数据照抄）
base_stats:
  hp: 1552.32         # lv80 白值（calc_character_stats 官方管线——人工闸回填）
  atk: 426.888
  def: 194.04
  spd: 100            # 95 + 行迹速度节点 ×1（+5）
  crit_rate: 0.05
  crit_dmg: 0.873     # 0.5 + 行迹暴伤节点 ×5（+0.373）
  max_energy: 160     # 常规能量槽上限 160（tbgd + 米游社「能量 160」双源）
trace_stat_effects:
  hp_pct: 0.18        # 行迹生命节点 ×3（初始 modifier 通道——pct 白值口径由引擎结算）
trace_notes:
  - "大行迹三件已收（人工闸回填）：1404101 水与泥土（免死前 3 次不清退——mud_soil 计数双分支）/ 1404102 三十僭主（血仇免疫控制——VENDETTA grants_immune）/ 1404103 血祥罩衫（超 4000 HP 档条件光环+敌源充能比例三元乘）"
  - "常规能量槽角色（无特殊充能显示名——新蕊/火种同通道不适用；Charge 为独立 custom_resources，不占能量槽）"

