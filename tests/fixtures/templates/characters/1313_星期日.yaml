# 角色模板：星期日（1313）——机械层由 adapters/template_generator 生成
# 机制层（hooks/modifier）手写闭环版（2026-09-05，owner 委托；写→编译→跑→对→改全流程验证在案，
# 见 tests/test_sunday_template.py）。数值口径：lv10 满级档（StarRailRes params[9]）。
actor_id: '1313'
name: 星期日
level: 80
base_stats:
  hp: 1241.8560000000002
  atk: 640.332
  def: 533.61
  spd: 96
  crit_rate: 0.05
  crit_dmg: 0.873
  max_energy: 130.0
  effect_res: 0.18
actions:
- action_id: '131301'
  name: 闪烁的劝诫
  action_type: basic
  skill_point_gain: 1    # 战技点数值复核
  target_type: single
  damage_type: imaginary
  scaling:
  - atk: 0.5
  - atk: 0.6
  - atk: 0.7
  - atk: 0.8
  - atk: 0.9
  - atk: 1.0
  - atk: 1.1
  - atk: 1.2
  - atk: 1.3
  - atk: 1.4
  energy_cost: 0
  energy_gain: 20
  toughness_dmg: 10
- action_id: '131302'
  name: 纸与仪典的恩赐
  action_type: skill
  skill_point_cost: 1    # 战技点数值复核
  target_type: ally_single
  damage_type: null
  scaling: []
  energy_cost: 0
  energy_gain: 30
  toughness_dmg: 0
- action_id: '131303'
  name: 轻与伤痕的赞颂
  action_type: ultimate
  target_type: ally_single
  damage_type: null
  scaling: []
  energy_cost: 130
  energy_gain: 5
  toughness_dmg: 0
trace_stat_effects:
  def_pct: 0.125
hooks:
  # 崇高拂尘（1313102）：战斗开始时，星期日恢复 25 点能量（lv10 档 [25]）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_energy"
        amount: 25
  # 轻与伤痕的赞颂（131303）：恢复目标 20% 能量上限的能量，不足 40 提至 40（主日渴慕 lv10 [40]）；
  # 使目标及其召唤物成为【蒙福者】（单体最新生效——先摘其他目标的蒙福者再挂新目标）。
  # 事件口径：终结技走 on_ultimate（不发 on_action）；payload 带 target=主目标（引擎 2026-09-05 补齐）
  - event: "on_ultimate"
    condition: "$event.action == '131303'"
    effects:
      - effect_type: "gain_energy"
        target: "$event.target"
        amount: "max(0.2 * $target.max_energy, 40)"
      - effect_type: "remove_modifier"
        target: "other_allies"
        modifier_id: "BEATIFIED"
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "BEATIFIED"
          name: "蒙福者"
          modifier_type: "buff"
          duration: 3
          tick_anchor: "source_turn_end"   # 官方"星期日每回合开始时持续-1"：词表无
                                           # source_turn_start，最近合法锚 source_turn_end（半锚偏差注记）
          dispellable: false
          stat_effects:
            crit_dmg: "0.30 * $self.crit_dmg + 0.12"   # lv10 [0.30, 0.12]：施加时刻快照
                                                       #（hook stat_effects 现场求值族，
                                                       # 重挂重算；$self=星期日）
  # 蒙福者解除：星期日无法战斗时全场摘除（官方"陷入无法战斗状态时【蒙福者】效果也会被解除"）
  - event: "actor_exit"
    condition: "$event.actor == '1313' && $event.reason == 'death'"
    effects:
      - effect_type: "remove_modifier"
        target: "all_allies"
        modifier_id: "BEATIFIED"
  # 纸与仪典的恩赐（131302）：目标立即行动（lv10 提前 100%）
  - event: "on_action"
    condition: "$event.action_id == '131302'"
    effects:
      - effect_type: "immediate_action"
        target: "$event.target"
  # 战技增伤 30% 持续 2 回合（lv10 [0.30, 2]；召唤物持有额外 +50% 注记待收——召唤物判定原语缺位）
  - event: "on_action"
    condition: "$event.action_id == '131302'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "SUNDAY_SKILL_DMG"
          name: "纸与仪典的恩赐"
          modifier_type: "buff"
          duration: 2
          stat_effects:
            all_dmg: 0.3
  # 倾诉之肉身（131304 天赋）：施放战技时目标暴击率提高 20%，持续 3 回合（lv10 [0.20, 3]）
  - event: "on_action"
    condition: "$event.action_id == '131302'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "SUNDAY_TALENT_CR"
          name: "倾诉之肉身"
          modifier_type: "buff"
          duration: 3
          stat_effects:
            crit_rate: 0.2
  # 战技点返还：对【蒙福者】施放战技后恢复 1 个战技点（官方原文）
  - event: "on_action"
    condition: "$event.action_id == '131302' && has_modifier($event.target, 'BEATIFIED')"
    effects:
      - effect_type: "gain_skill_point"
        amount: 1
trace_notes:
- 崇高拂尘（1313102）已收编：on_battle_start 回能 25。
- 主日渴慕（1313101）已收编：终结技回能 20%×目标上限，min 40（max() 表达式）。
- 掌中安港（1313103）**待收编**：施放战技解除目标 1 个负面效果——净化原语缺位
  （remove_modifier 须点名 modifier_id，无"摘一个 debuff"通用原语；needs_primitive 登记）。
- 荣光之秘（131307 秘技）**待收编**：战前秘技体系走 20_pre_battle_strategy，demo 不开秘技。
- 召唤物联动两条待收编：①战技对召唤物同行立即行动（召唤物寻址）；②持有召唤物时增伤 +50%
  （召唤物持有判定原语缺位，忆灵/召唤物体系 B32 同批）。
- 同谐命途限制（对同谐施放战技不触发立即行动）待收编：$target.path 原语缺位；
  demo 队内无同谐目标（白厄毁灭/盾丹存护），不阻塞。
