# 秘技（131307 荣光之秘）：下次战斗中星期日首次对我方目标施放技能时，目标增伤 50% 持续 2 回合
# ——进战挂武装标记（duration 0 常驻），首次命中消费（双通道：战技/普攻走 on_action、
# 终结技走 on_ultimate——B37 口径终结技不发 on_action；普攻指敌方不消费=target_type 闸）
techniques:
  - technique_id: "131307"
    name: "荣光之秘"
    point_cost: 1
    effects:                              # 进战一次性（战前装填预置，18.3；施放者=星期日）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "GLORY_SECRET"
          name: "荣光之秘"
          modifier_type: "buff"
          duration: 0
          dispellable: false
    hooks:
      - event: "on_action"
        condition: "$event.actor == '1313' && !$event.insert && has_modifier($self, 'GLORY_SECRET') && ($event.target_type == 'ally_single' || $event.target_type == 'ally_aoe')"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "GLORY_SECRET_DMG"
              name: "荣光之秘"
              modifier_type: "buff"
              duration: 2
              stat_effects: {"all_dmg": 0.5}   # lv10 #1/#2：50%、2 回合
          - effect_type: "remove_modifier"
            modifier_id: "GLORY_SECRET"
      - event: "on_ultimate"
        condition: "$event.source == '1313' && $event.action == '131303' && has_modifier($self, 'GLORY_SECRET')"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "GLORY_SECRET_DMG"
              name: "荣光之秘"
              modifier_type: "buff"
              duration: 2
              stat_effects: {"all_dmg": 0.5}
          - effect_type: "remove_modifier"
            modifier_id: "GLORY_SECRET"
trace_stat_effects:
  def_pct: 0.125
hooks:
  # 崇高拂尘（1313102）：战斗开始时，星期日恢复 25 点能量（lv10 档 [25]）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_energy"
        amount: 25
  # 轻与伤痕的赞颂（131303）：恢复目标 20% 能量上限的能量，不足 40 提至 40（主日渴慕 lv10 [40]）；
  # 使目标及其召唤物成为【蒙福者】（单体最新生效——先摘其他目标的蒙福者再挂新目标）。
  # 事件口径：终结技走 on_ultimate（不发 on_action）；payload 带 target=主目标（引擎 2026-09-05 补齐）
  - event: "on_ultimate"
    condition: "$event.action == '131303'"
    effects:
      - effect_type: "gain_energy"
        target: "$event.target"
        amount: "max(param(131303, 1) * $target.max_energy, 40)"
      - effect_type: "remove_modifier"
        target: "other_allies"
        modifier_id: "BEATIFIED"
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "BEATIFIED"
          name: "蒙福者"
          modifier_type: "buff"
          duration: 3
          tick_anchor: "source_turn_end"   # 官方"星期日每回合开始时持续-1"：词表无
                                           # source_turn_start，最近合法锚 source_turn_end（半锚偏差注记）
          dispellable: false
          stat_effects:
            crit_dmg: "param(131303, 2) * $self.crit_dmg + param(131303, 4)"   # #2/#4：施加时刻快照
                                                       #（hook stat_effects 现场求值族，
                                                       # 重挂重算；$self=星期日）
  # 蒙福者解除：星期日无法战斗时全场摘除（官方"陷入无法战斗状态时【蒙福者】效果也会被解除"）
  - event: "actor_exit"
    condition: "$event.actor == '1313' && $event.reason == 'death'"
    effects:
      - effect_type: "remove_modifier"
        target: "all_allies"
        modifier_id: "BEATIFIED"
  # 掌中安港（1313103 #1=1）：施放战技时解除目标 1 个负面——remove_modifier filter+max_count
  # 收编（2026-09-08，龙灵 141404 同通道）；LIFO 最新先摘（官方未指明摘哪枚——待实测 B19 候选）
  - event: "on_action"
    condition: "$event.action_id == '131302'"
    effects:
      - effect_type: "remove_modifier"
        target: "$event.target"
        filter: "$mod.modifier_type == 'debuff'"
        max_count: 1
        reason: "purify"
  # 纸与仪典的恩赐（131302）：目标立即行动（lv10 提前 100%）
  - event: "on_action"
    condition: "$event.action_id == '131302'"
    effects:
      - effect_type: "immediate_action"
        target: "$event.target"
  # 战技增伤 30% 持续 2 回合（lv10 [0.30, 2]；召唤物持有额外 +50% 注记待收——召唤物判定原语缺位）
  - event: "on_action"
    condition: "$event.action_id == '131302'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "SUNDAY_SKILL_DMG"
          name: "纸与仪典的恩赐"
          modifier_type: "buff"
          duration: 2
          stat_effects:
            all_dmg: "param(131302, 2)"
  # 倾诉之肉身（131304 天赋）：施放战技时目标暴击率提高 20%，持续 3 回合（lv10 [0.20, 3]）
  - event: "on_action"
    condition: "$event.action_id == '131302'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "SUNDAY_TALENT_CR"
          name: "倾诉之肉身"
          modifier_type: "buff"
          duration: 3
          stat_effects:
            crit_rate: "param(131304, 1)"
  # 战技点返还：对【蒙福者】施放战技后恢复 1 个战技点（官方原文）
  - event: "on_action"
    condition: "$event.action_id == '131302' && has_modifier($event.target, 'BEATIFIED')"
    effects:
      - effect_type: "gain_skill_point"
        amount: 1
trace_notes:
- 崇高拂尘（1313102）已收编：on_battle_start 回能 25。
- 主日渴慕（1313101）已收编：终结技回能 20%×目标上限，min 40（max() 表达式）。
- 掌中安港（1313103）已收编（2026-09-08）：施放战技解除目标 1 个负面——remove_modifier
  filter + max_count 1（龙灵 141404 同通道，LIFO 最新先摘待实测 B19）。
- 荣光之秘（131307 秘技）已收编（2026-09-08）：进战武装标记 + 首次对我方目标施放技能消费
  （目标增伤 50% 2 回合；双通道 on_action/on_ultimate，普攻指敌方不消费=target_type 闸）。
- 召唤物联动两条**仍缺**（2026-09-08 核查：现有件组不出，照实报缺）：①战技对召唤物同行
  立即行动——目标寻址需"召唤物 of $event.target"：目标代数 $it 命名空间无 summoner_id 键、
  where 语境无 $event 注入（22_syntax_reference §22.6 owner 未接线）；②持有召唤物增伤 +50%
  ——需"目标持有召唤物"存在性判定：count_team 仅按命途计角色、无 summon_of/has_summon
  宿主函数，在场闩/resources 闩为逐召唤模板自管件（非通用通道，跨目标不可组合）。
  待 B32 深层件批（$it.summoner_id 暴露 + where $event 注入，或 summon_of() 宿主函数）。
- 同谐命途限制（对同谐施放战技不触发立即行动）**仍缺**（2026-09-08 核查）：hook condition
  语境无 $target——$event.target 是裸 actor_id 字符串，无 path 属性通道；函数表无 path_of；
  $it 命名空间亦无 path 键。Actor.path 已接线（cbdef39，count_team 消费）但"本次战技目标的
  命途"在 hook 条件读不到。不阻塞：demo 政策目标恒指白厄（毁灭）——同谐队友刻律德菈
  不会被星期日战技选中，限制分支在 demo 无观察差。
