eidolons:
  E1:
    name: "Da Capo"
    hooks: []
    notes:
      - "待收：**施放攻击时**使目标 DoT 承伤 +30%（dot_taken）——版本审计勘正（2026-09-14 B39）：新版触发域从「天赋追击时」放宽为「施放攻击时」（draft 按旧版注），通道到位后按卡芙卡全攻击命中域挂；DoT 承伤乘区键无读取端（src 全仓无 dot_taken 消费点，_KNOWN_STAT_KEYS 外开放命名空间静默放行=死键，1507 教训不许静默死件）；vulnerability 是全伤害承伤非 DoT 限定，不可压缩"
  E2:
    name: "Fortississimo"
    hooks: []
    notes:
      - "待收：我方全体 DoT 伤害 +**33%**（版本审计勘正 2026-09-14 B39：新版数值 0.25→0.33）——桶通道已在（dmg_dot_dmg_boost，B27#3；团队光环 scope=team 形态+新版数值收编待过堂）；dot_dmg_bonus 仍死键（映射已指 dmg_dot_dmg_boost）；all_dmg 是全伤害增伤非 DoT 限定，不可压缩"
  E3:
    name: "Capriccio"
    skill_level_overrides: {"skill": 2, "basic": 1}
    notes:
      - "战技+2 随档段：1100502 action scaling（实取 lv12 档）+ 引爆倍率/相邻倍率随档（param(1100502,2/4)）；普攻+1：1100501 scaling 实取 lv7 档（10 档表上限）"
  E4:
    name: "Recitativo"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e4"
            amount: 1
  E5:
    name: "Doloroso"
    skill_level_overrides: {"ultimate": 2, "talent": 2}
    notes:
      - "终结技+2：1100503 action scaling 实取 lv12 档 + 触电单跳/引爆随档（param(1100503,4/5)）；天赋+2：FUA 倍率随档（param(1100504,1)），充能/概率/回合参数各档同值"
  E6:
    name: "Leggiero"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e6_shock"
            amount: 1

hooks:
  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'KAFKA_SHOCK') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "触电"
        target: "$event.actor"
        damage_type: "thunder"
        amount: "(param(1100503, 4) + 1.56 * res__e6_shock) * $self.atk"
      - effect_type: "gain_energy"
        target: "self"
        amount: "2 * res__e4"

  - event: "on_action"
    condition: "$event.actor != '1005' && actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster' && !$event.insert && res__fua_charges >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "温柔亦同残酷"
        target: "$event.target"
        damage_type: "thunder"
        amount: "param(1100504, 1) * $self.atk"
        toughness_dmg: 10
      - effect_type: "gain_energy"
        target: "self"
        amount: 10    # FUA 回能（tbgd 权威 10）——过堂补记：deal_damage 不过 action
                      # energy_gain 路由，1100504 action 块账面不到账（缺口实证）
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "KAFKA_SHOCK"
          name: "触电"
          modifier_type: "debuff"
          duration: 2
          stack_mode: "refresh"
          dispellable: True
      - effect_type: "gain_resource"
        resource_id: "_fua_charges"
        amount: -1

  - event: "on_turn_end"
    condition: "$event.actor == '1005'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_fua_charges"
        amount: "param(1100504, 4)"

  - event: "on_action"
    condition: "$event.actor == '1005' && $event.action_id == '1100502' && has_modifier($event.target, 'KAFKA_SHOCK') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "月光摩挲连绵·引爆"
        target: "$event.target"
        damage_type: "thunder"
        amount: "param(1100502, 2) * param(1100503, 4) * $self.atk"
  - event: "on_action"
    condition: "$event.actor == '1005' && $event.action_id == '1100502' && has_modifier($event.target, 'KAFKA_SHOCK') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "月光摩挲连绵·相邻引爆"
        target: {pool: "enemies", where: "$it.actor_id != $event.target && has_modifier($it, 'KAFKA_SHOCK') >= 1", order_by: "$it.hp", take: 2, mode: "deterministic"}
        damage_type: "thunder"
        amount: "param(1100502, 4) * param(1100503, 4) * $self.atk"
    # 相邻引爆也需相邻目标自身带触电（官方 "If the designated enemy or the adjacent targets
    # are currently afflicted with DoT"——过堂补滤：draft where 只排主目标，未感电相邻也吃）；
    # 命名空间勘正（e2e 实证）：$it 是命名空间非裸 id——`$it != $event.target` 恒真=主目标
    # 也吃相邻引爆，正解 $it.actor_id（昔涟/托帕先例）

  - event: "on_action"
    condition: "$event.actor == '1005' && $event.action_id == '1100503'"
    effects:
      - effect_type: "deal_damage"
        name: "悲剧尽头的颤音·引爆"
        target: {pool: "enemies", where: "has_modifier($it, 'KAFKA_SHOCK') >= 1"}
        damage_type: "thunder"
        amount: "param(1100503, 5) * param(1100503, 4) * $self.atk"

  - event: "on_ultimate"
    condition: "$event.source == '1005' && $event.action == '1100503'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_fua_charges"
        amount: 1

  - event: "on_action"
    condition: "$event.actor != '1005' && actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster' && !$event.insert && res__fua_charges >= 1 && has_modifier($event.target, 'KAFKA_SHOCK') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "Thorns·追加引爆"
        target: "$event.target"
        damage_type: "thunder"
        amount: "0.8 * param(1100503, 4) * $self.atk"

  - event: "on_kill"
    condition: "actor_type_of($event.target) == 'monster' && has_modifier($event.target, 'KAFKA_SHOCK') >= 1"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 5

  # 大行迹 11005101 Torture：我方目标 EHR ≥ 75% → ATK +100%（params [0.75, 1] 实证）。
  # 键名勘正（过堂钓出死件）：stat_of 读 effective_stats——EHR 键名 effect_hit，
  # draft 写 'effect_hit_rate' 查无此键恒 0.0=门控永不通过。
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "stat_of($it, 'effect_hit') >= 0.75"}
        modifier:
          modifier_id: "TORTURE_ATK"
          name: "Torture"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"atk_pct": 1.0}

scaling_notes:
  - 版本双轨：1005xx 原版不写行动块（历史对照——params 留档于官方下发；加强版 11005xx 现役）。
    原版差异在案：战技只炸主目标 DoT（#2 单槽）、Ultimate 只炸 Shock（需 1005101 Torture 扩全
    DoT——加强版内建）、Talent 仅 Basic 触发且 1 次/回合（加强版=任意攻击+充能制）
  - 引爆伤害口径：官方 "X% of their original DMG" 的 DoT 快照结算通道缺——统一近似为
    倍率 × 触电单跳基值（param(1100503,4)×ATK）；多 DoT 源（风化/裂伤/他人触电）与剩余跳数
    不入账（待收，挡因：DoT 注册表/快照通道缺）
  - 战技相邻引爆域：enemies 排除主目标 take 2（order_by $it.hp 确定化）近似官方 Blast 邻接
    （待收，挡因：Blast 邻接代数通道缺）
  - 触电概率门控：基础概率 1.0（#2）+ 行迹 Thorns 原版 +0.3——加强版行迹槽位已被替换，
    现役基础概率 1.0（≥1.0 不做 mechanic_chance 抽样）；实际命中受 EHR/目标抗性公式调制
    （该公式通道待实测，B19 候选）
  - 触电重施加：stack_mode "refresh" 近似（官方未明示刷新/覆盖/并存语义，待实测）
  - 触电承载口径（过堂钉死）：声明式 DoT 通道已落地（B27#3——modifier spec dot_element/dot_ratio 键 + 施加时攻击侧快照，dot_tick 全乘区不暴击）；现以 debuff + on_turn_start deal_damage 承载——乘区=直伤口径（含期望暴击 1.025），与官方 DoT（不暴击、吃防御/抗性）偏差在案，迁移待过堂对轴（E4 跳伤回能/E6 倍率联动段一并）
  - E1 dot_taken / E2 dot_dmg_bonus 过堂摘除（当时乘区键无读取端=静默死键，1507 教训——B27#3 已接线：E2=dmg_dot_dmg_boost 桶、E1=vulnerability+hit_condition "dot" scoped，收编待过堂）
  - 资源平铺键：_fua_charges → res__fua_charges、_e4 → res__e4、_e6_shock → res__e6_shock
    （id 带前导下划线=双下划线口径）
  - energy 内建资源：120 上限走 base_stats max_energy + action energy_cost/energy_gain +
    gain_energy 钩（不声明 custom_resources 'energy'）
