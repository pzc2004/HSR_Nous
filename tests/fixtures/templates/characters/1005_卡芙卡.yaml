# 角色模板：卡芙卡（1005）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂收编/勘正五件：① FUA 回能 10 补记——deal_damage 不过 action energy_gain
#   路由，1100504 action 块账面不到账（tbgd 权威 10，hook 侧 gain_energy 补）。
#   ② FUA/E1/Thorns 三钩补目标过滤 actor_type_of($event.target)=='monster'——
#   draft 无过滤：队友对友方施放（治疗/增益）会误触发追击打队友+白扣充能。
#   ③ E1 dot_taken / E2 dot_dmg_bonus 摘除落待收——DoT 乘区键当时 src 全仓无读取端
#   （2026-09-16 B27#3 已接线：E2 正解 dmg_dot_dmg_boost 桶、E1 正解 vulnerability+
#   hit_condition "dot" scoped 承伤，21008/椒丘先例；两件收编待过堂对轴）；vulnerability/
#   all_dmg 均全伤害域非 DoT 限定，不可压缩。
#   ④ 相邻引爆补触电过滤——官方 "If the designated enemy or the adjacent targets
#   are currently afflicted with DoT"：相邻目标也需自身带 DoT，draft where 只排
#   主目标（未感电相邻也吃引爆）。
#   ⑤ Torture 门控键名勘正——effective_stats 的 EHR 键是 effect_hit，draft 写
#   'effect_hit_rate' 查无此键恒 0.0=门控永不通过（死件）。
#
# 收录：普攻 / 战技（Blast 主 1.6+相邻 0.6 + 主引爆 75%×触电单跳 + 相邻引爆 50%
#       同滤触电）/ 终结技（AoE 0.8 + 全体触电挂载 + 全体引爆 100%×单跳 lv10）
#       / 触电 DoT（on_turn_start 跳 2.9×ATK lv10——承载口径见下）
#       / 天赋 FUA（队友攻击怪物目标+充能闩 → 1.4×ATK + 回能 10 + 触电 refresh +
#       耗 1 充能；回合结束 +1、Thorns 大招后 +1，上限 2）
#       / 行迹 Torture（EHR≥75% 队友 ATK+100%）/ Plunder（触电目标阵亡 +5 能）
#       / E3/E5 等级族 / E4 触电跳 +2 能 / E6 触电倍率 +156%
# 待收（均带挡因）：E1 DoT 承伤 30% / E2 DoT 增伤 25%（通道已在——B27#3，过堂③正解）/
#       触电迁声明式 DoT 载体（modifier spec dot_element/dot_ratio 已落地——B27#3；
#       现承载口径=直伤（含期望暴击 1.025、吃防御/抗性），
#       与官方 DoT（不暴击）偏差在案）/ 引爆"全部 DoT 源"（现只算 KAFKA_SHOCK——
#       DoT 注册表通道缺）/ Blast 邻接代数 / 触电命中 EHR×抗性调制公式
# 行迹实证（query-game-data 官方文本）：11005101 EHR≥75%→ATK+100% / 11005102 触电
#       目标阵亡 +5 能 / 11005103 大招后 FUA 充能 +1 + FUA 引爆全 DoT 80%
