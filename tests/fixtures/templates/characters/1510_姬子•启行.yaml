eidolons:
  E1:
    name: "我们称之为路的，是开拓"   # 勘正①（draft 幻名「我们阔步所向之物」）
    hooks:
      # E1④：姬子发动助战技时额外伤害段数 +1（姬子使用分支 #5: 4→5，段值 #6）
      - event: "on_action"
        condition: "$event.actor == '1510' && ($event.action_id == '151022' || $event.action_id == '151025' || $event.action_id == '151026')"
        effects:
          - effect_type: "deal_damage"
            name: "开拓，与你同行·E1"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "fire"
            action_type: "assist"
            toughness_scope: "all"
            amount: "param(151022, 6) * $self.atk"
    notes:
      - "E1①②③ 待收：①「天赋额外发动助战技效果的次数+1」=特殊效果额外助战 151022 #8 上限 2→3（draft 误读成 on_battle_start 送 1 次已勘正）；②Verdict 所需终结技 2→1；③Decimation 充能 9→6——三件全挂免费追发系统（追发+计数通道缺）"
  E2:
    name: "旗帜，永不降下的帆"   # 勘正①（draft 幻名「我们从未击出的色彩」）
    notes:
      - "四件全待收：①终结技与助战技伤害=原伤害 130%（独立乘区）——按 action_type 门控的独立乘区通道缺（dmg_bonus['ind_dmg_boost'] 桶无门控；hit_condition scoped 只进增伤区=加算，假）；②助战次数上限 1→2——cap 通道其实在案（modifier max_override，昔涟新蕊先例），但抬起后 1510101「次数==当前上限→+5 能」的动态阈值无表达通道（res_assist_uses>=1 口径在 cap2 下失真=假），随①④同挂；③旗语期间每回合开始额外回 1 次（依赖②上限才有可见差）；④非开拓同行使用助战亦触发 1510102 额外回合（随 1510102 挂起）"
  E3:
    name: "星辰之子，也在思索繁星"   # 勘正①（draft 幻名「虔敬的旅人，于星海扬帆」）
    skill_level_overrides: {"ultimate": 2, "basic": 1}
    notes:
      - "终结技+2 随档段：Beam param(151008,1)/Pulse param(151009,1)(151009,3)/Final param(151014,2) 实取 lv12（0.352/0.22/0.33/0.88）；151003 #9/#10 面板折算段未接线（待实测）；普攻实取 lv7 档（1.1）"
  E4:
    name: "握住所有伸向天空的手"   # 勘正①（draft 幻名「让苍穹之手不再垂落」）
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id != '1510'"}
            modifier:
              modifier_id: "E4_TEAM_RES_PEN"
              name: "握住所有伸向天空的手·共享"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"res_pen": "param(151004, 2)"}
          - effect_type: "apply_modifier"
            target: "self"
