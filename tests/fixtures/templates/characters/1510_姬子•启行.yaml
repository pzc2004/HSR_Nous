  E6:
    name: "铭记，终抵群星的誓约"   # 勘正①（draft 幻名「我们的誓言即星辰本身」）
    stat_effects: {"res_pen": 0.2}   # 火属性抗性穿透——元素专属穿透键缺，纯火输出下与全抗穿同池等效（在案）
    hooks:
      # E6③前半：我方使用/发动助战技时助战技伤害 +75%——官方措辞「伤害提高」=增伤区，
      # dmg_assist_dmg_boost 桶承载（只影响 assist 类伤害，与「使用时」触发域自然重合）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_ASSIST_DMG"
              name: "铭记，终抵群星的誓约·助战增伤"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"dmg_assist_dmg_boost": 0.75}
    notes:
      - "余三件待收：①源能上限 3→6（modifier max_override 通道在案，但固定序列下源能恒被钳零、无可观察差——随③同挂）；②使用/发动助战技姬子 +1 源能（同因无可观察差）；③发射 Beam 额外 +1 源能/Pulse 时源能 ≥6 追加全体 160% ATK——hook 脚本无按资源值循环/插段原语（段数编译期定死），E0 序列确定化不收"

hooks:
  # 天赋 151004：在场即展开境界「拓星视界」+ 我方全体 1 次助战次数（模板口径=姬子本人
  # 1 次——队友各 1 次的友方入口缺在案）+ 自身暴伤/全抗穿常驻
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_resource"
        resource_id: "assist_uses"
        amount: 1
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "NOVA_TALENT_CD"
          name: "共赴灼热的远征·暴伤"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"crit_dmg": "param(151004, 1)"}
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "NOVA_TALENT_PEN"
          name: "共赴灼热的远征·全抗穿"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"res_pen": "param(151004, 2)"}

  # 战技 151002：施放后立即回满助战次数 + 获得领航旗语（官方锚=姬子回合开始减 1）
  - event: "on_action"
    condition: "$event.actor == '1510' && $event.action_id == '151002' && !$event.insert"
    effects:
      - effect_type: "set_resource"
        resource_id: "assist_uses"
        amount: 1
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "NAV_SEMAPHORE"
          name: "领航旗语"
          modifier_type: "buff"
          duration: 3
          tick_anchor: "owner_turn_start"
          effect_scope: "team"
          dispellable: False
          stat_effects: {"all_dmg": "param(151002, 1)"}

  # 旗语期间「每个回合开始时立即恢复 1 次助战次数」——按字面全单位回合口径收
  # （归属自身回合 or 任意回合待实测，notes #4 在案）；快照语义：与能量钩同事件
  # 各读事件开始时旧值，互不串扰
  - event: "on_turn_start"
    condition: "has_modifier($self, 'NAV_SEMAPHORE') >= 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "assist_uses"
        amount: 1

  # 1510101②：回合开始次数已达当前上限 → +5 能量（E0/E1 上限 1 → >=1 等价）
  - event: "on_turn_start"
    condition: "res_assist_uses >= 1"
    effects:
      - effect_type: "gain_energy"
        amount: 5

  # 1510101①：姬子使用助战技不消耗次数——fire_assist 扣 1 → 同钩返还 1
  - event: "on_action"
    condition: "$event.actor == '1510' && ($event.action_id == '151022' || $event.action_id == '151025' || $event.action_id == '151026')"
    effects:
      - effect_type: "gain_resource"
        resource_id: "assist_uses"
        amount: 1

  # 助战三技姬子使用分支：额外 #5=4 段随机单体（段值 #6——三表 #5/#6 列同值，
  # 统一 param(151022,6) 引用）
  - event: "on_action"
    condition: "$event.actor == '1510' && ($event.action_id == '151022' || $event.action_id == '151025' || $event.action_id == '151026')"
    effects:
      - effect_type: "deal_damage"
        name: "开拓，与你同行·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "fire"
        action_type: "assist"
        toughness_scope: "all"
        amount: "param(151022, 6) * $self.atk"
      - effect_type: "deal_damage"
        name: "开拓，与你同行·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "fire"
        action_type: "assist"
        toughness_scope: "all"
        amount: "param(151022, 6) * $self.atk"
      - effect_type: "deal_damage"
