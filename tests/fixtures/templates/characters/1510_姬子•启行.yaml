# 角色模板：姬子•启行（1510）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging `data/annotator/staging/1510_姬子•启行.yaml`）+
# 过堂勘正（staging→fixtures 合并流水线）；证据链见 `data/annotator/notes/1510.md`。
#
# 过堂勘正十八件：① 星魂幻名×6 全改——E1-E6 draft 全编（正解 character_ranks.json：
#   我们称之为路的，是开拓/旗帜，永不降下的帆/星辰之子，也在思索繁星/握住所有伸向
#   天空的手/去跨越宇宙的全境/铭记，终抵群星的誓约）；② 大行迹幻名×3 全改（正解：
#   人类该向何处去/列车的脉搏在轰鸣/银轨在旷古中静默）；③ trace_stat_effects {} 漏收
#   → 官方行迹属性收编（atk_pct+28%/crit_rate+12%/dmg_fire+8%，character_skill_trees
#   十节点聚合）；④ 助战三技
#   scaling 用错分支——#1 友方列（1.6）→ #4 姬子使用列（2.0，模板内只有姬子本人
#   施放）；⑤ 助战三技缺 assist_cost_resource——无额度闸=无限免费发动后门（1309
#   勘正⑤同族），补 assist_cost_resource: assist_uses；⑥ 助战三技取档错轨——level_key
#   缺省回落 ultimate（E3 错取 lv12/E5 反漏 lv12），正解 level_key: talent（官方
#   level_up_skills：E5 天赋+2 同列 151022/25/26+2），actions 与 skill_params 同改；
#   ⑦ 助战钩 `!$event.insert` 判反——assist 唯一入口 fire_assist 走 trigger_action
#   （insert=True），带 !insert 的助战钩全哑，摘除 insert 过滤；⑧ E1① 误读建模——
#   draft on_battle_start 送 1 次助战，正解「天赋额外发动助战技效果的次数+1」=特殊
#   效果额外助战 #8 上限 2→3（随免费追发系统待收）；⑨ 终结技子段 151008/151009/
#   151014 散装 action 摘除（available_if 闸死=永不可放死件，1308 散装摘除同族）——
#   序列归 on_ultimate 钩脚本；_starblazer_ctl 闸资源/_territory 境界占位（无消费端）
#   随删；⑩ NAV_SEMAPHORE 缺 tick_anchor——官方「姬子每回合开始时持续回合数减1」
#   → tick_anchor: owner_turn_start（默认 owner_turn_end 错锚）；⑪ 秘技波次装填挂主干
#   on_wave_start 无条件执行（未施秘技也生效=假）→ 移入 techniques.hooks（pre_battle
#   激活才编译）+ 补 on_battle_start 孪生钩（进战=第 1 波——setup 不发 wave1
#   on_wave_start）；⑫ 终结技回能 0→5（tbgd+米游社双源一致，notes「存疑」可销）；
#   ⑬ 削韧收编——普攻 toughness_dmg 10（米游社五项权威）；大招 Beam 每发 2/Pulse
#   全体段 2（米游社子标签；全序列总 48 的余量分配待实测）；削韧段补 toughness_scope
#   "all"（天赋无视弱点削韧 hook 层同键）；⑭ Verdict 缺 #10 终结技增伤半件→收编
#   dmg_ultimate_dmg_boost（type_dmg_bonus 桶在案）；⑮ E6 部分收编——助战增伤 75%
#   → dmg_assist_dmg_boost（同桶；挡因「独立倍率键缺」过期——官方文本是增伤区口径
#   「伤害提高」非独立乘区）；⑯ 行迹 1510101 免耗半件收编——fire_assist 扣 1→同钩
#   返还 1（施放入口=fire_assist 已在案，draft「入口通道缺」挡因过期）；⑰ groups
#   faction:nameless 幻名→faction:astral_express（1224 三月七先例；_FACTION_ROSTERS
#   无 nameless 条目）；⑱ E2/E6 挡因全量翻新（见 eidolons 注——cap 通道 max_override
#   已有昔涟新蕊先例，真挡因在独立乘区门控/动态阈值表达/动态段数三缺）。
#
# 收录：天赋境界经济（助战次数资源+fire_assist 额度闸）/旗语全队增伤（owner_turn_start
#   锚）/终结技 Starblazer 固定序列（Beam×6→Pulse→Final Hit，E0 档确定化）/助战三技
#   姬子使用分支（AoE #4+随机段 #5×#6）/1510101 免耗+满额回能/1510103 源能记账+
#   随机段 +0.30/行迹属性/E1 额外段数/E4 抗穿辐射/E5 档位联动/E6 火穿+助战增伤。
# 待收（均带挡因，详见 trace_notes/eidolons notes/scaling_notes）：1510102 友方额外回合
#   （友方助战入口+额外回合授予链缺）/特殊效果免费追发全系（#8 上限、Verdict 2 大、
#   Decimation 9 充能——追发与计数通道缺，E1①②③ 同挂）/E2 四件（130% 按 action_type
#   门控独立乘区缺；cap 抬起后 1510101「==当前上限」动态阈值无表达通道同挂）/E6 源能
#   上限 6/Pulse≥6 追加 160%（hook 脚本无按资源值循环段数原语，固定序列下无可观察差，
#   同挂）/E6 助战回源能（同上无可观察差）/151004 #3 队友回 4 能（友方入口缺）/Decimation
#   #10 战技暴伤（按 action_type 门控暴伤通道缺）/秘技 TP+3（team_modifiers.
#   technique_point_max_bonus 词表有键无消费端——引擎缺口）/151003 #9/#10 面板折算
#   （待实测）/大招削韧余量 34 分配（待实测）。
