        toughness_scope: "all"
        amount: "param(151022, 6) * $self.atk"

  # 151025 → 进入【同行协议：裁决】（#8 增伤 + #10 终结技增伤——勘正⑭ 补收后半件；
  # 入口近似：官方为开拓同行同伴使用触发，模板内以姬子自放近似——同伴入口缺在案）
  - event: "on_action"
    condition: "$event.actor == '1510' && $event.action_id == '151025'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "COMPANION_VERDICT"
          name: "同行协议：裁决"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"all_dmg": "param(151025, 8)", "dmg_ultimate_dmg_boost": "param(151025, 10)"}

  # 151026 → 进入【同行协议：歼破】（#8 全队暴伤；#10 战技暴伤半件待收——按
  # action_type 门控暴伤通道缺；两协议能否共存待实测，不加 singleton_group 不脑补）
  - event: "on_action"
    condition: "$event.actor == '1510' && $event.action_id == '151026'"
