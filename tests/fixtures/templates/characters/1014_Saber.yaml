custom_resources:
  core_resonance:
    name: "炉心共鸣"
    max: 99              # 天赋 #7=99 读作上限（待实测——头注 8）
  golden_scepter:
    name: "解放的金色王权·替换态闩"
    max: 1               # 大招后置位 1；强化普攻消耗回 0（普攻栏替换，非形态机——1407 同口径）
  overflow_energy:
    name: "溢出能量"
    max: 120             # A2 溢出池（S6 提升至 200 待收——星魂覆写 max 通道缺）

techniques:
  - technique_id: "101407"
    name: "骑士王的登场"
    point_cost: 1
    effects:                              # 下一场战斗开始生效（战前装填，18.3；施放者=Saber）
      - effect_type: "apply_modifier"     # ATK +35%、持续 2 回合（单档 #1/#2，字面值）
        target: "self"
        modifier:
          modifier_id: "KNIGHT_KING_DEBUT"
          name: "骑士王的登场"
          modifier_type: "buff"
          duration: 2
          dispellable: True
          # 键名推定：与 spd_pct 同构的 atk_pct（锚范例无 ATK% 先例——待核，在案）
          stat_effects: {"atk_pct": 0.35}
      - effect_type: "gain_resource"      # +2 点炉心共鸣（#3）
        resource_id: "core_resonance"
        amount: 2
      - effect_type: "apply_modifier"     # A3 计数：每获 1 共鸣暴伤 +4%（是否计入秘技授予 → 待实测）
        target: "self"
        modifier:
          modifier_id: "A3_CRIT_COUNT"
          name: "星之冠冕·共鸣计数"
          modifier_type: "buff"
          stacks: 2
          max_stack: 8
          stack_mode: "refresh"
          duration: 0
          dispellable: False
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "A3_CRIT_DMG"
          name: "星之冠冕·暴伤"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          stat_effects:
            crit_dmg: "0.04 * min(stacks($self, 'A3_CRIT_COUNT'), 8)"

actions:
  - action_id: "101401"
    name: "风王结界"
    action_type: "basic"
    target_type: "single"
    damage_type: "wind"
    available_if: "res__golden_scepter < 1"   # 大招后被 101408 替换（140702↔140709 同构）
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    # 削韧：待实测（米游社 sub_tag 未给普攻削韧、fandom 空缺——不脑补，键缺省）
    skill_point_gain: 1     # tbgd：产 1 SP
    energy_gain: 0          # 待实测（未见 tbgd/fandom 普攻回能值——保守默认 0）

  - action_id: "101402"
    name: "风王铁槌"
    action_type: "skill"
    target_type: "blast"
    damage_type: "wind"
    scaling: [{"atk": 0.75}, {"atk": 0.825}, {"atk": 0.9}, {"atk": 0.975}, {"atk": 1.05},
              {"atk": 1.125}, {"atk": 1.2188}, {"atk": 1.3125}, {"atk": 1.4062}, {"atk": 1.5},
              {"atk": 1.575}, {"atk": 1.65}, {"atk": 1.725}, {"atk": 1.8}, {"atk": 1.875}]
    scaling_blast: [{"atk": 0.375}, {"atk": 0.4125}, {"atk": 0.45}, {"atk": 0.4875}, {"atk": 0.525},
                    {"atk": 0.5625}, {"atk": 0.6094}, {"atk": 0.6562}, {"atk": 0.7031}, {"atk": 0.75},
                    {"atk": 0.7875}, {"atk": 0.825}, {"atk": 0.8625}, {"atk": 0.9}, {"atk": 0.9375}]
    toughness_dmg: 20           # 米游社：削韧 20+10*2（主 20 / 相邻各 10）
    toughness_dmg_blast: 10
    skill_point_cost: 1         # tbgd BPNeed sp_cost=1（权威）；米游社 sub_tag 无消耗标按对轴表弃
    energy_gain: 0              # 待实测（保守默认 0）
    # 强化分支（每点共鸣 +param(101402,4) 倍率 + 消耗全部共鸣回能 8/点）与
    # 「Otherwise 获 3 共鸣」分支待收——挡因：能量现值表达式通道缺（头注 1）

  - action_id: "101403"
    name: "誓约胜利之剑"
    action_type: "ultimate"
    target_type: "aoe"
    damage_type: "wind"
    energy_cost: 360            # 满能量释放（max_energy=360）
    energy_gain: 5              # tbgd：回能 5（米游社「回能 5」一致）
    skill_point_cost: 0
    skill_point_gain: 0         # 不耗不产（tbgd 0/0）
    toughness_dmg: 40           # 米游社：群体削韧 40；弹射 2×10 走 hooks（逐段）
    scaling: [{"atk": 1.4}, {"atk": 1.54}, {"atk": 1.68}, {"atk": 1.82}, {"atk": 1.96},
              {"atk": 2.1}, {"atk": 2.275}, {"atk": 2.45}, {"atk": 2.625}, {"atk": 2.8},
              {"atk": 2.94}, {"atk": 3.08}, {"atk": 3.22}, {"atk": 3.36}, {"atk": 3.5}]

  - action_id: "101408"
    name: "解放的金色王权"
    action_type: "basic"
    target_type: "aoe"
    damage_type: "wind"
    available_if: "res__golden_scepter >= 1"  # 大招后唯一可用普攻（替换态）
    scaling: [{"atk": 0.75}, {"atk": 0.9}, {"atk": 1.05}, {"atk": 1.2}, {"atk": 1.35},
              {"atk": 1.5}, {"atk": 1.65}, {"atk": 1.8}, {"atk": 1.95}, {"atk": 2.1}]
    # 削韧：待实测（米游社/fandom 未给，不脑补，键缺省）
    skill_point_gain: 1         # tbgd：产 1 SP
    energy_gain: 30             # tbgd：回能 30

