              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              stat_effects:
                crit_dmg: "0.04 * min(stacks($self, 'A3_CRIT_COUNT'), 8)"
      - event: "on_battle_start"
        effects:
          # 终结技伤害 +60%（过堂收编——dmg_ultimate_dmg_boost 类型桶正主通道在案
          #（1008 阿兰先例），draft 误判"终极技限定增伤 stat 键未核实"）
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_ULT_DMG"
              name: "The Lost White Walls"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"dmg_ultimate_dmg_boost": 0.6}
    notes:
      - "终结技伤害 +60% 已收（dmg_ultimate_dmg_boost 常驻——过堂）；普攻/战技 +1 共鸣触发域含强化普攻 101408（同为 Basic ATK 类，EN 措辞裁定）"
  E2:
    name: "The Lost Oath of the Round Table"
    notes:
      - "整条待收：①每获 1 共鸣无视 1% 防御、至多 15 层（def-ignore 键名未核）②强化战技每点额外 +7% 倍率（依赖战技强化分支待收）——挡因见头注 3"
  E3:
    name: "（等级族）"
    skill_level_overrides: {"ultimate": 2, "basic": 1}   # 终结技+2、普攻+1
    notes:
      - "终结技+2：101403 action scaling 与 param(101403,2) 弹射倍率随档实取 lv12；普攻+1：101401/101408 scaling 实取 lv11/lv11（101408 上限 10 档——越档钳表尾+⚠编译警告口径）"
  E4:
    name: "The Saga of Sixteen Winter Days"
    stat_effects: {"res_pen": 0.08}    # 风抗性穿透 +8%（全部伤害皆风——单通道）
    hooks:
      # 每次放完终结技后再 +4% 风抗穿，最多叠 3 层（合计最高 20%）——counter+烘焙值双件
      - event: "on_ultimate"
        condition: "$event.source == '1014'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_RES_PEN_COUNT"
              name: "十六冬日的史诗·计数"
              modifier_type: "buff"
              stacks: 1
              max_stack: 3
              stack_mode: "refresh"
              duration: 0
              dispellable: False
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_RES_PEN"
              name: "十六冬日的史诗"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              stat_effects:
                res_pen: "0.04 * min(stacks($self, 'E4_RES_PEN_COUNT'), 3)"
  E5:
    name: "（等级族）"
    skill_level_overrides: {"skill": 2, "talent": 2}     # 战技+2、天赋+2
    notes:
      - "战技+2：101402 scaling/param(101402,*) 实取 lv12；天赋+2：param(101404,3/4) 增伤与持续回合随档实取 lv12"
  E6:
    name: "The Long Fated Night"
    notes:
      - "整条待收：①终结技风抗穿 +20%（终极技限定通道缺，同头注 2）②A2 溢出能量上限 120→200（custom_resources max 星魂档覆写通道缺）③进战后首次大招固定回 300 能量、此后每 3 次 1 次（能量回填通道缺 + 次数计数需自建资源）——挡因见头注 4"

hooks:
  # —— 天赋 101404 龙之炉心：进入战斗获得 1 点炉心共鸣（#8）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_resource"
        resource_id: "core_resonance"
        amount: "param(101404, 8)"
      - effect_type: "apply_modifier"       # A3 计数（每获 1 共鸣暴伤 +4%，本场累计）
        target: "self"
        modifier:
          modifier_id: "A3_CRIT_COUNT"
          name: "星之冠冕·共鸣计数"
          modifier_type: "buff"
          stacks: 1
          max_stack: 8
          stack_mode: "refresh"
          duration: 0
          dispellable: False
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "A3_CRIT_DMG"
          name: "星之冠冕·暴伤"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          stat_effects:
            crit_dmg: "0.04 * min(stacks($self, 'A3_CRIT_COUNT'), 8)"

  # —— 大行迹 A1「Knight of the Dragon」：进入战斗获得「Mana Burst」
  #（消耗侧——持共鸣且以战技回满能量时：返还 1 SP + 立即行动——待收，挡因头注 1）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "MANA_BURST"
          name: "Mana Burst"
          modifier_type: "buff"
          duration: 0
          dispellable: False

  # —— 大行迹 A2「Blessing of the Lake」上半：开战能量 < 60%（360×0.6=216）回填至 216
  #（过堂收编——gain_energy 原生能量池在库，draft 挡因"原生能量池非自定义池"证伪：
  # 自定义资源 gain_resource 与原生能量 gain_energy 是两通道，后者在库）；
  # 下半（大招后清溢出并按量回填）维持待收——溢出池累积机制整体未建（头注 5）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: "max(0, 0.6 * $self.max_energy - $self.energy)"

  # —— 战技 101402 双分支（过堂收编——$self.energy/$self.max_energy 白名单实证，
  # draft 挡因"能量现值表达式通道缺"证伪）：
  # 强化分支：持共鸣且现能量 + 消耗共鸣回能 ≥ 上限 → 每点共鸣追加 param(101402,4)×ATK
  #（倍率区等值段——与主伤同乘区，合计=基础倍率+0.14×点数；官方 "increases the DMG
  # multiplier for this instance of Skill"），攻击后按 8 能量/点回填并清空共鸣
  #（effect 序：伤害→回能→清零，读数在清零前）。判定时点在案：官方=施放前判定，
  # hook 挂 on_action=结算后判定——战技 energy_gain 0 下无观察差（回能值待实测随条）；
  # 相邻目标追加段待收（邻接目标代数通道缺——1008 E6 同挡因）
  - event: "on_action"
    condition: "$event.actor == '1014' && $event.action_id == '101402' && !$event.insert && res_core_resonance >= 1 && $self.energy + 8 * res_core_resonance >= $self.max_energy"
    effects:
      - effect_type: "deal_damage"
        name: "风王铁槌·强化"
        target: "$event.target"
        damage_type: "wind"
        amount: "param(101402, 4) * res_core_resonance * $self.atk"
      - effect_type: "gain_energy"
        target: "self"
        amount: "8 * res_core_resonance"
      - effect_type: "set_resource"
        resource_id: "core_resonance"
        amount: 0

  # 常规分支（Otherwise）：未达强化条件 → 获 3 共鸣（param(101402,3)）+ A3 计数 3 + 重烘焙
  - event: "on_action"
    condition: "$event.actor == '1014' && $event.action_id == '101402' && !$event.insert && !(res_core_resonance >= 1 && $self.energy + 8 * res_core_resonance >= $self.max_energy)"
    effects:
      - effect_type: "gain_resource"
        resource_id: "core_resonance"
        amount: "param(101402, 3)"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "A3_CRIT_COUNT"
          name: "星之冠冕·共鸣计数"
          modifier_type: "buff"
          stacks: 3
          max_stack: 8
          stack_mode: "refresh"
          duration: 0
          dispellable: False
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "A3_CRIT_DMG"
          name: "星之冠冕·暴伤"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          stat_effects:
            crit_dmg: "0.04 * min(stacks($self, 'A3_CRIT_COUNT'), 8)"

  # —— 天赋 101404：任一我方目标使用终结技 → Saber 伤害 +param(101404,3)、持续
  # param(101404,4) 回合，并获得 param(101404,1) 点共鸣
  #（EN "any ally target" 是否含 Saber 自身 → 待实测；condition 按非怪物施放者读）
  - event: "on_ultimate"
    condition: "actor_type_of($event.source) != 'monster'"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1014'"}
        modifier:
          modifier_id: "DRAGON_CORE_DMG"
          name: "龙之炉心·增伤"
          modifier_type: "buff"
          duration: 2               # param(101404,4) 全档恒 2——duration int 直给（非 param 槽，万敌/1001 纪律）
          dispellable: True
          stat_effects: {"all_dmg": "param(101404, 3)"}
      - effect_type: "gain_resource"
        resource_id: "core_resonance"
        amount: "param(101404, 1)"
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1014'"}
        modifier:
          modifier_id: "A3_CRIT_COUNT"
          name: "星之冠冕·共鸣计数"
          modifier_type: "buff"
          stacks: 3
          max_stack: 8
          stack_mode: "refresh"
          duration: 0
          dispellable: False
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1014'"}
        modifier:
          modifier_id: "A3_CRIT_DMG"
          name: "星之冠冕·暴伤"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          stat_effects:
            crit_dmg: "0.04 * min(stacks($self, 'A3_CRIT_COUNT'), 8)"

  # —— 大行迹 A3「Crown of the Star」上半：使用战技后暴伤 +50%、持续 2 回合
  #（params_max[0]=0.5 / [1]=2——行迹无等级轨道，字面值）
  - event: "on_action"
    condition: "$event.actor == '1014' && $event.action_id == '101402' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "A3_SKILL_CRIT_DMG"
          name: "星之冠冕·战技暴伤"
          modifier_type: "buff"
          duration: 2
          dispellable: True
          stat_effects: {"crit_dmg": 0.5}

  # —— 强化普攻 101408：敌人数 2 / 1 时对全体追加 #3 / #4 倍率（EN "additionally
  #     deals ... to all enemies"）——追加段声明在前（过堂序正：追加段是本攻击一部分，
  #     读旧面板；结算钩在后——draft 原序使追加段吃到本攻击新获共鸣喂的 A3 层，
  #     官方"使用后获得"不应回馈当次攻击，e2e 实证 6 层 vs 4 层差）
  - event: "on_action"
    condition: "$event.actor == '1014' && $event.action_id == '101408' && !$event.insert && enemies_alive() == 2"
    effects:
      - effect_type: "deal_damage"
        name: "解放的金色王权·2敌追加"
        target: "all_enemies"
        damage_type: "wind"
        amount: "param(101408, 3) * $self.atk"
  - event: "on_action"
    condition: "$event.actor == '1014' && $event.action_id == '101408' && !$event.insert && enemies_alive() == 1"
    effects:
      - effect_type: "deal_damage"
        name: "解放的金色王权·1敌追加"
        target: "all_enemies"
        damage_type: "wind"
        amount: "param(101408, 4) * $self.atk"
  # —— 强化普攻 101408 结算（声明序在追加段【之后】——过堂序正：追加段是本攻击的
  #     一部分，应先读旧面板；draft 结算钩在前 → 追加段吃到了本攻击新获共鸣喂的
  #     A3 层（官方"使用后获得"不应回馈当次攻击），e2e 实证 6 层 vs 4 层差）
  - event: "on_action"
    condition: "$event.actor == '1014' && $event.action_id == '101408' && !$event.insert"
    effects:
      - effect_type: "set_resource"
        resource_id: "golden_scepter"
        amount: 0
      - effect_type: "gain_resource"
        resource_id: "core_resonance"
        amount: "param(101408, 2)"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "A3_CRIT_COUNT"
          name: "星之冠冕·共鸣计数"
          modifier_type: "buff"
          stacks: 2
          max_stack: 8
          stack_mode: "refresh"
          duration: 0
          dispellable: False
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "A3_CRIT_DMG"
          name: "星之冠冕·暴伤"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          stat_effects:
            crit_dmg: "0.04 * min(stacks($self, 'A3_CRIT_COUNT'), 8)"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "MANA_BURST"
          name: "Mana Burst"
          modifier_type: "buff"
          duration: 0
          dispellable: False

  # —— 终结技 101403 结算：挂替换态闩（下一次普攻强制变为 101408）
  #     + 10 段随机单体弹射（每段 param(101403,2)×ATK、逐段削韧 2——米游社 2×10）
  #     弹射目标代数 mode random（B22 expected 确定化按序取首）；可否重复命中同一目标 → 待实测
  - event: "on_action"
    condition: "$event.actor == '1014' && $event.action_id == '101403' && !$event.insert"
    effects:
      - effect_type: "set_resource"
        resource_id: "golden_scepter"
        amount: 1
      - effect_type: "deal_damage"
        name: "誓约胜利之剑·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        amount: "param(101403, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "誓约胜利之剑·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        amount: "param(101403, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "誓约胜利之剑·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        amount: "param(101403, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "誓约胜利之剑·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        amount: "param(101403, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "誓约胜利之剑·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        amount: "param(101403, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "誓约胜利之剑·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        amount: "param(101403, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "誓约胜利之剑·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        amount: "param(101403, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "誓约胜利之剑·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        amount: "param(101403, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "誓约胜利之剑·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        amount: "param(101403, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "誓约胜利之剑·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        amount: "param(101403, 2) * $self.atk"
        toughness_dmg: 2

scaling_notes:
  - 战技 SP 消耗冲突裁决：tbgd BPNeed sp_cost=1 ↔ 米游社 sub_tag 无消耗标 → 按纪律取 tbgd 耗 1 SP（米游社标签缺失非反证）
  - 战技双分支过堂收编：强化分支（持共鸣且现能量+8×共鸣 ≥ 上限 → 每点共鸣追加 param(101402,4)×ATK 等值段 + 8 能/点回填清空）与常规分支（Otherwise 获 3 共鸣）——$self.energy/$self.max_energy 白名单实证（draft 挡因"能量现值表达式通道缺"证伪）；相邻目标追加段待收（邻接目标代数通道缺）；判定时点官方=施放前 vs hook=结算后在案
  - 战技 #4 lv10=0.14 呈现口径（0.14%/点 vs 14%/点）待实测；星魂 E2「额外 +7%/点」量级暗示后者，文本未定不脑补
  - 天赋每点 8 能量（param(101404,5) 全档恒定）回填随强化分支已收；tbgd 给天赋记 energy=10 为不同口径 → 待实测
  - 大招后普攻替换走 available_if 互斥声明（golden_scepter 闩，140702↔140709 同构）——纯合法性替换，非形态机
  - 弹射段走 hook deal_damage 通道（action scaling 只承载全体段），逐段削韧 2 已收
  - A2 开战回填 216 过堂收编（gain_energy 原生能量池在库——draft 挡因"原生能量池非自定义池"证伪：gain_resource 自定义池与 gain_energy 原生池是两通道）；A2 下半（大招后清溢出回填）与溢出池累积机制整体维持待收
