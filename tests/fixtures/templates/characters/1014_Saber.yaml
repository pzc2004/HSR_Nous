# 角色模板：Saber（1014）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂收编/勘正四件（draft 三挡因证伪 + duration 纪律）：① 战技双分支收编——
#   $self.energy/$self.max_energy 白名单实证（探针实测：条件判定+回填全通），
#   draft 挡因"能量现值表达式通道缺"证伪：强化=每点共鸣追加 param(101402,4)×ATK
#   等值段+8 能/点回填清空，常规（Otherwise）=获 3 共鸣+A3 计数 3。
#   ② A2 开战回填 216 收编——gain_energy 原生能量池在库（draft 挡因"原生能量池
#   非自定义池"证伪：gain_resource 自定义池与 gain_energy 原生池是两通道）。
#   ③ E1 终结技伤害 +60% 收编——dmg_ultimate_dmg_boost 类型桶正主通道（1008
#   阿兰先例），draft 误判"终极技限定增伤 stat 键未核实"。
#   ④ 天赋增伤 duration "param(101404,4)"→int 2（duration 非 param 槽——
#   万敌/1001 纪律，param(101404,4) 全档恒 2）。
#
# 收录：普攻 101401 / 战技 101402（Blast + 双分支）/ 终结技 101403（AoE 2.8 lv10
#       + 10 段随机弹射 1.1/段逐段削韧 2 + 替换态闩）/ 强化普攻 101408（AoE +
#       敌人数 2/1 追加 + available_if 互斥）/ 天赋龙之炉心（进战 +1 共鸣 +
#       我方大招 → 增伤 0.6 lv10 二回合 + 3 共鸣）/ A1 暴击 +20% / A2 开战回填 /
#       A3 战技暴伤 0.5 二回合 + 每共鸣 4% 暴伤 8 层（计数+烘焙双件）/
#       秘技 ATK+35%+2 共鸣 / E1 / E3/E5 等级族 / E4 风抗穿
# 待收（均带挡因）：强化分支判定时点（官方=施放前）+ 相邻追加段（邻接代数缺）/
#       E2 无视防御（def_pen 槽位语义待证）/ E6 三件（技域限定 res_pen 通道缺——
#       scoped accept 只收 dmg_*/all_dmg；资源 max 星魂覆写缺；溢出池未建）/
#       A2 下半（溢出回填——池累积机制未建）/ 弹射段类型桶归属（hook deal_damage
#       伪 action_type=follow_up——E1 ultimate 桶不命中弹射段，官方"终结技伤害"
#       口径下弹射应吃，伪行动类别继承通道缺）/ 天赋 any ally 含自身待实测
actor_id: "1014"
name: "Saber"
level: 80
path: "destruction"   # 毁灭命途（官方 type_text + 社区一致）
element: "wind"       # 风
base_stats:
  hp: 1241.856
  atk: 601.524
  def: 654.885
  spd: 101
  crit_rate: 0.05     # 管线实值；A1 常驻 +20% 走 trace_stat_effects，不并入
  crit_dmg: 0.5       # 管线实值；A3 暴伤走 hooks（非行迹平铺节点）
  max_energy: 360     # 能量上限 360（官方数据 + 米游社「能量 360」）

# —— 头注 ————————————————————————————————————————————————————————————
# 收录：普攻 101401（单体）/ 战技 101402（Blast 主 20 相邻 10，耗 1 SP——tbgd 权威，
#       米游社无消耗标按对轴冲突表裁 tbgd + 双分支过堂收编：强化=每点共鸣追加
#       param(101402,4)×ATK+8 能/点回填清空（$self.energy 白名单实证），常规=获 3 共鸣）/
#       终结技 101403（全体 + 10 段随机弹射逐段削韧 2，挂 stance 资源把下一次普攻
#       替换为强化态）/ 强化普攻 101408（全体 + 敌人数 2/1 追加倍率；available_if
#       互斥声明替换 101401，1407 换技能同构）/
#       天赋 101404（进战 +1 共鸣；我方任意人放终结技 → Saber 增伤 2 回合 + 3 共鸣）/
#       大行迹 A1（+20% 暴击率走 trace_stat_effects；Mana Burst 授予侧）/
#       A2 开战回填 216（gain_energy 原生池过堂收编——draft 挡因证伪）/
#       A3（放战技后暴伤 +50% 2 回合；每获 1 共鸣暴伤 +4%、至多 8 层——计数层+烘焙值双件）/
#       秘技 101407（下场战斗 ATK +35% 2 回合 + 2 共鸣）/
#       星魂 E1（普攻/战技后 +1 共鸣 + 终结技伤害 +60% dmg_ultimate_dmg_boost 过堂收编）/
#       E3/E5 等级族 / E4（风抗穿 8% + 每次大招后 +4% 至多 3 层——counter+烘焙双件）
# 待收（带挡因）：
#   1) 战技强化分支判定时点（官方=施放前，hook=结算后——energy_gain 0 下无观察差）+
#      相邻目标追加段（邻接目标代数通道缺——1008 E6 同挡因）+ 战技回能值（待实测）；
#      天赋每点 8 能量回填与消耗判定绑定（随强化分支已收——tbgd 天赋 energy=10 异口径待实测）。
#   2) E6 终结技风抗穿 +20%——hit_condition scoped 加成只收 dmg_*/all_dmg（accept 词表），
#      res_pen 限定技域通道缺，待收。
#   3) E2（每获 1 共鸣无视 1% 防御、至多 15 层；强化战技每点额外 +7% 倍率）——
#      def-ignore 键名未核（def_pen 是固定值槽还是比例槽待证）+ 依赖强化分支已收段复核。
#   4) E6 溢出能量上限 120→200 / 首次大招回 300 能量、此后每 3 次 1 次——
#      custom_resources max 星魂档覆写通道缺 + 溢出池累积机制未建，待收。
#   5) A2 下半：大招后清溢出并按量回填——溢出池累积机制整体未建（上半开战回填已收）。
#   6) 普攻 101401 / 强化普攻 101408 削韧值：米游社 sub_tag 未给、fandom 空缺 → 不脑补，
#      键缺省（待实测）。
#   7) 天赋未引用参数 #2=25、#6（0.05→0.125）用途；A1 params_max[1]=0.4/[2]=0.2 用途 → 待收。
#   8) 共鸣上限（天赋 #7=99 读作上限，待实测）；战技 #4 每点倍率 0.14 呈现口径
#      （0.14%/点 vs 14%/点）待实测；弹射可否重复命中同一目标待实测；
#      天赋「any ally」是否含 Saber 自身大招待实测。
# 数值：action scaling 全表照抄官方 params（取档 index=等级-1）；hook/modifier 侧系数走
#       skill_params + param() 编译期引用；行迹/秘技无等级轨道，字面值。
trace_notes:
  - 大行迹 A1「Knight of the Dragon」常驻 +20% 暴击率——百分比节点走 trace_stat_effects 通道，不并入 base_stats（param 1014101 params_max[0]=0.2）
  - 行迹暴击/暴伤/速度平铺节点数值未提供 → 不并入 base_stats（管线值终审）；A3 暴伤由 hooks 承载
  - 大行迹 A2 溢出能量池 120/200、A3 叠层、A1 Mana Burst 授予侧已收；A1 消耗侧与 A2 开战回填 216 待收（能量回填通道缺，挡因见头注 1、头注 5）
trace_stat_effects:
  crit_rate: 0.2      # A1 常驻（官方 params_max[0]）

