# 角色模板：椒丘（1218）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂勘正六件（staging+fixture 同步）+ 引擎补口一件：
#   ① ASHEN_VULN 双勘正：dmg_taken 死键→vulnerability（1108/1507 先例）；
#     stat_effects 烘焙→stat_exprs 动态（烘焙读 $self=hook 持有者椒丘——
#     烬煨在敌人身上 stacks 恒 0、层数驱动失效；stat_exprs 持有者=敌人
#     stacks($self) 才读敌方层数+动态重估——1210/1213/1214 先例）
#   ② 结界终伤易伤：ult_dmg_taken 死键→vulnerability + hit_condition
#     "$event.action_type == 'ultimate'"（类型限定承伤——1203 罗刹 E2 先例；
#     全类型 vulnerability 替代=普攻/追击同吃高估非等价）
#   ③ chance×3→mechanic_chance（同族案第 4 次——病族闸已固化）
#   ④ E1 重构——官方 EN「the Vulnerability effect of Ashen Roast is
#     increased by 40%」=天赋易伤 ×1.4（query 实证；乘算口径待实测）：
#     draft 命中挂独立 dmg_taken 0.4（绝对 +40pct 失真+死键）；正解永续
#     标记+放大项并入 stat_exprs ×(1+0.4×has_modifier('1218',...))——
#     has_modifier 跨人 actor_id 反查（$self=持有者=敌人读不到椒丘标记）
#     【④已作废——E1 读法全错，正解见⑧】
#   ⑤ E6 整件待收：全属性抗性 −3%/层（all_type_res 无消费端死键族——
#     1006/1015/1106/1203 同案；draft res_pen 挂敌方=攻击方穿透读攻击方
#     面板=死挂已删）+ 烬煨层数转移（modifier.stacks 只收 int 字面量——
#     表达式槽未接线，draft stacks: "stacks(...)" 物化必败）
#   ⑥ trace_note 自辩「按 04_modifier 登记口径书写」幻视删除（无此登记）
#   【引擎补口】承伤区 scoped_boost——hit_condition 件的 vulnerability/
#     ind_vulnerability 同命中域计入（旧缺口：scoped_boost 只服务增伤区/
#     治疗区，类型限定承伤永不被读；椒丘结界首实例。击破结算同形不补——
#     击破 action_type 非 ultimate 自然出集）
#   ⑦ ASHEN_VULN 施加路径补挂（2026-09-24 全量历史审查）：结界行动触发/
#     Seared Scent 新入场/秘技三路径挂烬煨时漏挂易伤件——官方天赋 121804
#     「At 1 stack, increases DMG received by the enemy」承伤提升是烬煨本体
#     效果，与施加路径无关（终结技 121803 结界触发/trace 1218103/秘技 121807
#     施加的均为同一「Ashen Roast」debuff；hsr-optimizer 单一 ashenRoastStacks
#     驱动 vulnerability 同口径）。三路径各补一 ASHEN_VULN 件（与命中路径同模）
#   ⑧ E1 全件误模重构（2026-09-24 重审二轮）：官方 rank1 双源（EN「Allies deal
#     40% increased DMG to enemy targets afflicted with Ashen Roast」/ CN「我方目标
#     对处于【烬煨】状态的敌方目标造成的伤害提高40%」）=攻击侧增伤、与层数无关
#     ——④「天赋易伤 ×1.4」读法全错（乘区错位+随层数缩放失真；对方 hsr-optimizer
#     BOOST 0.40 FullTeam 为正解）；②「触发天赋效果挂烬煨时本次 +1 层」（CN rank1
#     原文——仅天赋命中施加路径，结界/新入场/秘技非天赋触发不加）。重构：
#     E1_ASHEN_DMG_TAKEN 标记+4 处 ASHEN_VULN stat_exprs ×1.4 项全拆；正解=
#     全体队友永续 hit_condition 件（目标带 ASHEN_ROAST → all_dmg 0.4——117 死水
#     2pc 同通道，scoped_boost 只扫携带者自身件故 all_allies 各挂）+E1 天赋钩
#     补挂 ASHEN_ROAST +1 层（stacks 只收 int 字面量——表达式槽未接线）
#
# 收录：普攻仁火攻心 / 战技燔燎急袭（主 1.5 邻 0.9 lv10）/ 天赋烬煨
#       （命中 100% 基础概率挂 1 层（cap 5）+灼烧 twin——易伤=0.15+(N−1)
#       ×0.05 lv10 stat_exprs 动态）/ 灼烧 DoT（**声明式 dot 通道**——modifier_type
#       dot + dot_element fire + dot_ratio param(121804,6)×(1+3×E2 标记) lv10=1.8
#       施加时烘焙；引擎 A 类结算：不暴击+施加时刻快照+全乘区；2026-09-22
#       双通道合并，旧 on_turn_start hook tick 退役）
#       / 终结技鼎阵妙法（全体 1.0 lv10+鼎阵结界 3 回合+终伤易伤 15% lv10
#       scoped ultimate）/ 结界行动触发（敌方行动 60% 挂烬煨+易伤⑦——每敌每回合
#       1 次占用件+全场 cap 6）/ 大行迹 Pyre Cleanse（进战 15 能）/
#       Seared Scent（结界期新入场敌挂烬煨+易伤⑦——层数=全场最高待收：敌方池
#       聚合 max 通道缺，暂按 1 层）/ 秘技全体 100%+烬煨 1 层（+易伤⑦）/
#       E1 对烬煨增伤 40%+天赋施加 +1 层⑧ / E2 灼烧 ×4 / E3/E5 等级族 / E4 结界展开全体 ATK−15%
# 待收（均带挡因）：Seared Scent 层数全场最高（池聚合通道缺）/ E6 全抗+
#       层数转移（双通道缺）/ 1218102 命中转攻（转化 floor/cap 槽缺）/
#       结界全场层数等化 / 基础概率×命中公式（apply_chance 缺——天赋 100%
#       概率无观察差，dot_base_chance 缺省 1.0 中性）/ ~~灼烧快照口径~~
#       （已随双通道合并落定——施加时刻快照承载）
