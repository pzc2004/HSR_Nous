    action_type: "ultimate"
    target_type: "aoe"
    damage_type: "fire"
    energy_cost: 100
    energy_gain: 5
    toughness_dmg: 20
    scaling: [{"atk": 0.6}, {"atk": 0.64}, {"atk": 0.68}, {"atk": 0.72}, {"atk": 0.76},
              {"atk": 0.8}, {"atk": 0.85}, {"atk": 0.9}, {"atk": 0.95}, {"atk": 1.0},
              {"atk": 1.04}, {"atk": 1.08}, {"atk": 1.12}, {"atk": 1.16}, {"atk": 1.2}]
    apply_modifiers:
      - target: "self"
        modifier_id: "ASHEN_ZONE"
        name: "鼎阵结界"
        modifier_type: "buff"
        duration: 3
        tick_anchor: "owner_turn_start"
        dispellable: False
      - target: "all_enemies"
        modifier_id: "ASHEN_ZONE_ULT_VULN"
        name: "结界·终伤易伤"
        modifier_type: "debuff"
        duration: 3
        dispellable: True
        # ult_dmg_taken 死键勘正：类型限定承伤=vulnerability + hit_condition 命中域
        #（$event.action_type 伤害命中域字段——1203 罗刹 E2 先例；全类型 vulnerability
        # 替代=普攻/追击同吃高估非等价）
        hit_condition: "$event.action_type == 'ultimate'"
        stat_effects: {"vulnerability": "param(121803, 3)"}

hooks:
  - event: "after_being_hit"
    condition: "$event.source == '1218' && ($event.action_type == 'basic' || $event.action_type == 'skill' || $event.action_type == 'ultimate') && actor_type_of($event.target) == 'monster' && mechanic_chance(param(121804, 1))"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "ASHEN_ROAST"
          name: "烬煨"
          modifier_type: "debuff"
          stacks: 1
          max_stack: 5
          stack_mode: "refresh"
          duration: 2
          dispellable: True
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "ASHEN_BURN"
          name: "灼烧（烬煨）"
          modifier_type: "dot"
          dot_element: "fire"
          dot_ratio: "param(121804, 6) * (1 + 3 * min(has_modifier($self, 'E2_BURN_AMP'), 1))"
          duration: 2
          dispellable: True
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "ASHEN_VULN"
          name: "烬煨易伤"
          modifier_type: "debuff"
          duration: 2
          dispellable: True
          # 双勘正：dmg_taken 死键→vulnerability（1108/1507 先例）；stat_effects 烘焙
          # →stat_exprs 动态（烘焙读 $self=hook 持有者椒丘——烬煨在敌人身上，stacks 恒 0
          # 层数驱动失效；stat_exprs 持有者=敌人 stacks($self) 才读敌方层数+动态重估，
          # 1210/1213/1214 先例）；旧「E1 ×1.4 乘算项」已拆——E1 全件误模重构（头注⑧：
          # E1=攻击侧对烬煨增伤 40%+天赋施加 +1 层，非易伤放大）
          stat_exprs:
            vulnerability: "(param(121804, 2) + (max(stacks($self, 'ASHEN_ROAST'), 1) - 1) * param(121804, 3))"

  # 烬煨灼烧 DoT tick：**声明式 dot 通道承载**（2026-09-22 双通道合并——
  # modifier_type "dot" + dot_element fire + dot_ratio param(121804,6)×(1+3×E2 标记)
  # 施加时烘焙；跳伤走引擎 A 类结算：不暴击+施加时刻快照+全乘区；天赋基础概率
  # param(121804,1)=100% dot_base_chance 缺省 1.0 中性。旧 on_turn_start hook
  # tick 退役删除）

  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && has_modifier($self, 'ASHEN_ZONE') >= 1 && has_modifier($event.actor, 'ASHEN_ZONE_PROC') < 1 && res__zone_proc < param(121803, 5) && mechanic_chance(param(121803, 2))"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "ASHEN_ROAST"
          name: "烬煨"
          modifier_type: "debuff"
          stacks: 1
          max_stack: 5
          stack_mode: "refresh"
          duration: 2
          dispellable: True
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "ASHEN_BURN"
          name: "灼烧（烬煨）"
          modifier_type: "dot"
          dot_element: "fire"
          dot_ratio: "param(121804, 6) * (1 + 3 * min(has_modifier($self, 'E2_BURN_AMP'), 1))"
          duration: 2
          dispellable: True
      # 易伤件随烬煨同挂（勘正⑦）：官方终结技 121803 结界触发施加的是同一
      # 「Ashen Roast」debuff——承伤提升是烬煨本体效果（天赋 121804「At 1 stack,
      # increases DMG received by the enemy」），与施加路径无关；双勘正全注见
      # after_being_hit 件
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "ASHEN_VULN"
          name: "烬煨易伤"
          modifier_type: "debuff"
          duration: 2
          dispellable: True
          stat_exprs:
            vulnerability: "(param(121804, 2) + (max(stacks($self, 'ASHEN_ROAST'), 1) - 1) * param(121804, 3))"
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "ASHEN_ZONE_PROC"
          name: "结界行动触发占用"
          modifier_type: "debuff"
          duration: 1
          dispellable: False
      - effect_type: "gain_resource"
        resource_id: "_zone_proc"
        amount: 1

  - event: "on_ultimate"
    condition: "$event.source == '1218' && $event.action == '121803'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_zone_proc"
        amount: 0

  - event: "on_battle_start"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 15

  - event: "actor_enter"
    condition: "actor_type_of($event.actor) == 'monster' && has_modifier($self, 'ASHEN_ZONE') >= 1"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "ASHEN_ROAST"
          name: "烬煨"
          modifier_type: "debuff"
          stacks: 1
          max_stack: 5
          stack_mode: "refresh"
          duration: 2
          dispellable: True
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "ASHEN_BURN"
          name: "灼烧（烬煨）"
          modifier_type: "dot"
          dot_element: "fire"
          dot_ratio: "param(121804, 6) * (1 + 3 * min(has_modifier($self, 'E2_BURN_AMP'), 1))"
          duration: 2
          dispellable: True
      # 易伤件随烬煨同挂（勘正⑦）：官方 trace 1218103「inflict 1 stack of Ashen
      # Roast」——同一 debuff，承伤提升随本体（天赋 121804）；双勘正全注见
      # after_being_hit 件
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "ASHEN_VULN"
          name: "烬煨易伤"
          modifier_type: "debuff"
          duration: 2
          dispellable: True
          stat_exprs:
            vulnerability: "(param(121804, 2) + (max(stacks($self, 'ASHEN_ROAST'), 1) - 1) * param(121804, 3))"

eidolons:
  E1:
    name: "Pentapathic Transference"
    hooks:
      # E1①（官方 rank1 双源——EN「Allies deal 40% increased DMG to enemy targets
      # afflicted with Ashen Roast」/ CN「我方目标对处于【烬煨】状态的敌方目标造成
      # 的伤害提高40%」）：攻击侧增伤，与层数无关——旧案「天赋易伤 ×1.4」（承伤区
      # 乘算）乘区错位全错，已拆（头注⑧）。通道=携带者 hit_condition 目标条件件
      # （117 死水 2pc「对受负面敌人增伤 12%」同模——scoped_boost 只扫携带者自身
      # 持有件，全队族经 target all_allies 逐队友各挂一件）；命中域 has_modifier
      # 读 $event.target（23007 雨一直下 debuff_count($event.target) 同通道）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "all_allies"
            modifier:
              modifier_id: "E1_ASHEN_DMG_BOOST"
              name: "五味五走·对烬煨增伤"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              hit_condition: "has_modifier($event.target, 'ASHEN_ROAST') >= 1"
              stat_effects: {"all_dmg": 0.4}
      # E1②（官方 rank1 CN「每当触发天赋效果使敌方目标陷入【烬煨】状态时，使本次
      # 叠加的【烬煨】层数额外提高1层」）：仅天赋命中施加路径（after_being_hit——
      # 结界行动触发/Seared Scent/秘技非「触发天赋效果」，不加）。modifier.stacks
      # 只收 int 字面量（表达式槽未接线——头注⑤），正解=E1 独立钩同事件同条件再补
      # 挂一件 ASHEN_ROAST（stack_mode refresh 叠加 +1；灼烧/易伤件由主干钩承载，
      # 此处不重复挂）
      - event: "after_being_hit"
        condition: "$event.source == '1218' && ($event.action_type == 'basic' || $event.action_type == 'skill' || $event.action_type == 'ultimate') && actor_type_of($event.target) == 'monster' && mechanic_chance(param(121804, 1))"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "ASHEN_ROAST"
              name: "烬煨"
              modifier_type: "debuff"
              stacks: 1
              max_stack: 5
              stack_mode: "refresh"
              duration: 2
              dispellable: True
  E2:
    name: "From Savor Comes Suffer"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_BURN_AMP"
              name: "灼烧倍率增幅"
              modifier_type: "buff"
              duration: 0
              dispellable: False
  E3:
    name: "Flavored Euphony Reigns Supreme"
    skill_level_overrides: {"skill": 2, "basic": 1}
  E4:
    name: "Leisure In, Luster Out"
    hooks:
      - event: "after_apply_modifier"
        condition: "$event.target == '1218' && $event.modifier_id == 'ASHEN_ZONE'"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E4_ZONE_ATK_DOWN"
              name: "结界·攻击力削弱"
              modifier_type: "debuff"
              duration: 3
              dispellable: True
              stat_effects: {"atk_pct": -0.15}
      - event: "actor_enter"
        condition: "actor_type_of($event.actor) == 'monster' && has_modifier($self, 'ASHEN_ZONE') >= 1"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.actor"
            modifier:
              modifier_id: "E4_ZONE_ATK_DOWN"
              name: "结界·攻击力削弱"
              modifier_type: "debuff"
              duration: 3
              dispellable: True
              stat_effects: {"atk_pct": -0.15}
  E5:
    name: "Duel in Dawn, Dash in Dusk"
    skill_level_overrides: {"ultimate": 2, "talent": 2}
  E6:
    name: "Nonamorphic Pyrobind"
    hooks: []
    notes:
      - "整件待收：①全属性抗性 -3%/层——all_type_res 无消费端死键族（1006/1015/1106/1203 同案；draft 误写 res_pen 挂敌方=攻击方穿透读攻击方面板=死挂）②烬煨层数转移——modifier.stacks 只收 int 字面量（表达式槽未接线——draft stacks: \"stacks(...)\" 会被闸/物化失败）；目标选择（order_by 层数升序 take 1）已证通道可用，待 stacks 表达式槽落地后收"

scaling_notes:
  - "天赋易伤曲线为线性加算：N 层 = param(121804,2) + (N-1)×param(121804,3)；lv10 满 5 层 = 35%，E6 9 层口径 = 55%（上限提升待收）"
  - "结界全场敌方烬煨设为最高层数（等化不叠加）待收：池聚合 max 通道缺（挡因见头注①）"
  - "大行迹 1218102 待收（挡因见头注②）；行迹 EHR/火伤/速度节点已回填 trace_stat_effects（B-TR④——官方十节点聚合）"
  - "E3：战技+2 实取 lv12 档（scaling 1.65 / scaling_blast 0.99）；普攻+1 实取 lv7 档（1.1）；天赋侧施加概率恒 100% 无观察差"
  - "E5：终结技+2 随档段：全体倍率 1.08（lv12）/ 行动施加概率 param(121803,2)=0.62 / 终伤易伤 param(121803,3)=0.162 / 结界回合 3、全场上限 6 维持字面值；天赋+2 随档段：首层易伤 param(121804,2)=0.165 / 每层递增 param(121804,3)=0.055 / 灼烧 DoT param(121804,6)=1.98"
  - "E2：灼烧 DoT 倍率 +300% 口径：基础倍率 ×(1+300%) = 1.8×4 = 720% ATK @lv10（旧注误写 480%——1.8+3 错读，2026-09-24 勘正；代码/e2e 均按 ×4 正确）；加算进倍率 vs 独立乘区待实测，本版按乘区写，标记幂等"
  - "E6：烬煨上限 5→9 待收（挡因：max_stack 为字面量键，条件化上限通道缺）；上限未提时 res_pen/min(·,9) 与转移件按 ≤5 层自然钳制"
  - "烬煨 DoT 快照时机、持续回合刷新/独立计时、结界触发每回合 1 次边界、自动战斗 AI 施放优先级、削韧数值复核（普攻 10 / 战技 20+10×2 / 终结技 20）均待实测"
  - "交互语义：站位无依赖；能量条 100（开场 +15 / 普攻 +20 / 战技 +30 / 终结技返还 5）；回合制玩家操控（战技指定主目标）；普攻产 1 点、战技耗 1 点、终结技 0 点；目标选择：普攻单体 / 战技主+邻 / 终结技全体 / 天赋与结界为命中与敌方行动自动触发 / E6 转移为确定性单目标（order_by 层数升序）"
