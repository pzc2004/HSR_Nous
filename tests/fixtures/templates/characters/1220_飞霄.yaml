  # 122014「凿破大荒」行动块删除——官方技能清单的演出子条目（与 122003 同参数
  # 并列），非独立可施放终结技：若建行动块则 energy_cost 0 无门槛可绕过飞黄开大
  #（严重 bug 实证）；倍率档案留 skill_params，排除域（飞黄不计终结技攻击）保留引用。
hooks:
  # 大行迹 1220101 半①：战斗开始获得 3 点飞黄（#1=3，行迹无等级轨道——字面值）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_resource"
        resource_id: "flying_aureus"
        amount: 3

  # 天赋（122004）飞黄积攒：我方攻击敌方后获得 0.5 点飞黄（官方"每 2 次我方攻击 +1"等价口径，
  # 与米游社逐技 0.5 标签互证）；飞霄自己的终结技攻击不计入（官方明文——122003/122014 排除）。
  # 计数槽同步 +1（供 FUA 触发判读）；本 FUA 伤害本身是否再计一次攻击/再得 0.5 待实测（不双记）
  - event: "on_action"
    condition: "actor_type_of($event.actor) != 'monster' && !$event.insert && !($event.actor == '1220' && ($event.action_id == '122003' || $event.action_id == '122014'))"
    effects:
      - effect_type: "gain_resource"
        resource_id: "flying_aureus"
        amount: 0.5
      - effect_type: "gain_resource"
        resource_id: "_attack_tally"
        amount: 1

  # 天赋 FUA 触发（每回合限 1 次——闩 _fua_turn_used，回合开始重置）：队友攻击主目标被追加
  # 全自动 FUA（110% ATK lv10 #1）；目标=该队友攻击的主目标（$event.target），无主目标兜底随机
  # 敌方通道待实测（本版直取 $event.target，见注）。触发后自身增伤 60%/2 回合（#5/#6）
  - event: "on_action"
    condition: "actor_type_of($event.actor) != 'monster' && !$event.insert && !($event.actor == '1220' && ($event.action_id == '122003' || $event.action_id == '122014')) && res__attack_tally + 1 >= 2 && res__fua_turn_used < 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_attack_tally"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_fua_turn_used"
        amount: 1
      - effect_type: "deal_damage"
        name: "雷狩"
        target: "$event.target"          # 队友攻击主目标；无主目标→随机敌方（兜底通道待实测）
        damage_type: "wind"
        amount: "param(122004, 1) * $self.atk"   # lv10 #1=1.1
        toughness_dmg: 5                 # 米游社（单源待复核）
      - effect_type: "gain_resource"     # FUA 自身攻击计入 0.5 飞黄（FUA 是 hook 伤害不发 on_action——非双记，补的是 FUA 自身的攻击份；官方仅排除终结技）
        resource_id: "flying_aureus"
        amount: 0.5
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "FEIXIAO_TALENT_DMG"
          name: "雷狩·自增伤"
          modifier_type: "buff"
          duration: 2                    # #6=2 回合（字面值——duration 非表达式槽）
          dispellable: False
          stat_effects: {"all_dmg": "param(122004, 5)"}   # lv10 #5=0.6

  # 战技（122002）：立即追加 1 次天赋追加攻击（同目标）+ 大行迹 1220103（ATK +48%，3 回合）。
  # 战技本体飞黄 0.5 由上一条"我方攻击"hook 承担（不重复发放）；FUA 是否另计攻击数待实测
  - event: "on_action"
    condition: "$event.actor == '1220' && $event.action_id == '122002' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "雷狩"
        target: "$event.target"          # FUA 自动锁战技同目标
        damage_type: "wind"
        amount: "param(122004, 1) * $self.atk"
        toughness_dmg: 5
      - effect_type: "gain_resource"     # 战技触发的 FUA 另得 0.5（米游社口径；待实测）
        resource_id: "flying_aureus"
        amount: 0.5
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "FEIXIAO_TALENT_DMG"
          name: "雷狩·自增伤"
          modifier_type: "buff"
          duration: 2
          dispellable: False
          stat_effects: {"all_dmg": "param(122004, 5)"}
      - effect_type: "apply_modifier"    # 大行迹 1220103：使用战技后自身 ATK +48%，持续 3 回合
        target: "self"
        modifier:
          modifier_id: "FEIXIAO_BOLTCATCH"
          name: "Boltcatch"
          modifier_type: "buff"
          duration: 3
          dispellable: False
          stat_effects: {"atk_pct": 0.48}

  # 飞霄回合开始：FUA 闩与计数槽重置（官方"计数在飞霄回合开始时重置"）+ E2 计数重置
  - event: "on_turn_start"
    condition: "$event.actor == '1220'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_fua_turn_used"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_attack_tally"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_e2_count"
        amount: 0

  # 大行迹 1220101 半②：回合开始时若上一回合未通过天赋发动过 FUA，则视为完成了 1 次攻击计数
  #（保底——condition 读重置前快照，与上一 hook 声明序同事件）
  - event: "on_turn_start"
    condition: "$event.actor == '1220' && res__fua_turn_used < 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_attack_tally"
        amount: 1

  # 终结技（122003）：6 子击逐击切换——amount 三元按 broken_of($event.target) 的
  # **effects 链现场值**选变体（快照族①：钩 condition 快照、effects 表达式读现场——
  # E1 叠层同构已实证；draft「开大二选一」失真：中途击破后后续子击应切 122008 高伤
  # 变体，一次性判定走不完）。击破效率 +100% 挂摘全程（draft「无通道」误判——
  # break_efficiency_boost 通道在库；官方「未击破时」由「破后 bars_exhausted 不再
  # 削韧」自然出集，挂全程无影响）。E1 叠层内联同 draft（表达式乘 res__e1_flag——
  # E0 恒等，E1 块仅置旗）。
  - event: "on_ultimate"
    condition: "$event.source == '1220' && $event.action == '122003'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "FEIXIAO_ULT_EFFICIENCY"
          name: "凿破大荒·击破效率"
          modifier_type: "buff"
          duration: 1
          dispellable: False
          stat_effects: {"break_efficiency_boost": 1.0}
      - effect_type: "set_resource"
        resource_id: "_e1_stacks"
        amount: 0
      - effect_type: "deal_damage"
        name: "闪裂刃舞"
