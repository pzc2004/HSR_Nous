# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN
eidolons:
  E1:
    name: "Skyward I Quell"
    hooks:
      # E1 旗：开战置 1 → base 终结技 hooks 内联叠层表达式生效（每子击后后续伤害 +10% 原伤害，
      # 至多 5 层，持续到终结技行动结束——_e1_stacks 每次 on_ultimate 开头清零即行动内语义）
      # 结算口径（"对每段子击/最终段递增乘区"）按官方逐字读，实测复核见待实测清单 8
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e1_flag"
            amount: 1
    notes:
      - "叠层数值内联在 base ultimate hooks（表达式乘 res__e1_flag——E0 恒等），E1 块仅置旗，避免双份伤害段"
  E2:
    name: "Moonward I Wish"
    hooks:
      # 队友的每一次追加攻击额外 +1 飞黄（每回合至多 6 次——_e2_count 计数，回合开始重置）
      - event: "on_action"
        condition: "actor_type_of($event.actor) != 'monster' && $event.actor != '1220' && $event.action_type == 'follow_up' && res__e2_count + 1 <= 6"
        effects:
          - effect_type: "gain_resource"
            resource_id: "flying_aureus"
            amount: 1
          - effect_type: "gain_resource"
            resource_id: "_e2_count"
            amount: 1
    notes:
      - "$event.action_type 字段已实证（on_action 注册载荷含 action_type——bus DEFAULT_PAYLOAD_FIELDS；FUA 判定可用）"
  E3:
    name: "Starward I Bode"
    skill_level_overrides: {"ultimate": 2, "basic": 1}   # 终结技+2、普攻+1
    notes:
      - "终结技+2 随档段：终结段 param(122003,1)/子击 param(122008|122009,1|2) 全走 param() 引用随档；#2/#3/#4 常量维持字面（param 常量列同值无观察差）"
      - "普攻+1：122001 10 档表实取 lv8 行（越档钳表尾+⚠编译警告口径——官方数据本体 10 档）"
  E4:
    name: "Stormward I Hear"
    hooks:
      # 「天赋 FUA 削韧效率 +100%」翻案可收（draft 误判无通道）：hit_condition
      # "$event.action_type == 'follow_up'" scoped 件永续挂（承伤三区通用化③——
      # hook deal_damage 伪行动缺省归 follow_up 类可命中）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_FUA_EFFICIENCY"
              name: "Stormward·削韧效率"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              hit_condition: "$event.action_type == 'follow_up'"
              stat_effects: {"break_efficiency_boost": 1.0}
      # 天赋 FUA 发动时自身 SPD +8%，持续 2 回合（两处 FUA 触发点各挂一件）
      - event: "on_action"
        condition: "actor_type_of($event.actor) != 'monster' && !$event.insert && !($event.actor == '1220' && ($event.action_id == '122003' || $event.action_id == '122014')) && res__attack_tally + 1 >= 2 && res__fua_turn_used < 1"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_FEIXIAO_SPD"
              name: "Stormward I Hear"
              modifier_type: "buff"
              duration: 2
              dispellable: False
              stat_effects: {"spd_pct": 0.08}
      - event: "on_action"
        condition: "$event.actor == '1220' && $event.action_id == '122002' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_FEIXIAO_SPD"
              name: "Stormward I Hear"
              modifier_type: "buff"
              duration: 2
              dispellable: False
              stat_effects: {"spd_pct": 0.08}
  E5:
    name: "Heavenward I Leap"
    skill_level_overrides: {"skill": 2, "talent": 2}     # 战技+2、天赋+2
    notes:
      - "战技+2：122002 实取 lv12 行；天赋+2：FUA 倍率/自增伤 param(122004,1|5) 随档"
  E6:
    name: "Homeward I Near"
    hooks:
      # 终结技伤害全抗性穿透 +20%——官方限定**终结技**（draft 全域 stat_effects 直挂
      # =FUA/普攻同穿高估已勘正）：hit_condition scoped 件永续挂（承伤三区通用化②
      # res_pen scoped 首实例）；飞霄全技能皆风伤元素面单通道
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_RES_PEN"
              name: "Homeward I Near"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              hit_condition: "$event.action_type == 'ultimate'"
              stat_effects: {"res_pen": 0.2}
      # 天赋 FUA 倍率 +140%：对两处 FUA 触发点各追加 1.4×基准段（加算等价于 ×2.4；
      # "同时视为终结技伤害"的身份标签改写无通道——头注 5 待收）
      - event: "on_action"
        condition: "actor_type_of($event.actor) != 'monster' && !$event.insert && !($event.actor == '1220' && ($event.action_id == '122003' || $event.action_id == '122014')) && res__attack_tally + 1 >= 2 && res__fua_turn_used < 1"
        effects:
          - effect_type: "deal_damage"
            name: "雷狩·E6"
            target: "$event.target"
            damage_type: "wind"
            amount: "1.4 * param(122004, 1) * $self.atk"
            toughness_dmg: 5
      - event: "on_action"
        condition: "$event.actor == '1220' && $event.action_id == '122002' && !$event.insert"
        effects:
          - effect_type: "deal_damage"
            name: "雷狩·E6"
            target: "$event.target"
            damage_type: "wind"
            amount: "1.4 * param(122004, 1) * $self.atk"
            toughness_dmg: 5

scaling_notes:
  - "飞黄轨无能量槽：全部技能 energy_cost/gain 0（官方无 energy 描述 + tbgd 全 0）；终结技门槛走 ult_cost_resource 通道 6 点（上限 12 由 custom_resources max 承载）"
  - "终结技伤害实际结算由 on_ultimate hooks 承载（6 子击条件自动二选一 + 终结段）；action 122003/122008/122009/122014 按官方核心技能清单登记（action_type ultimate），倍率权威在 skill_params 表——hook 侧走 param() 引用"
  - "天赋 FUA（122004）声明为 follow_up action 供倍率/削韧权威对照，实际结算走 hooks deal_damage（触发为被动自动，引擎不自动执行该 action——不双份计伤）"
  - "基数区全为飞霄 ATK（$self.atk）——官方文本全部以 ATK 百分比表述，无生命/防御基数技能"
