        toughness_dmg: 5
      - effect_type: "gain_resource"
        resource_id: "_e1_stacks"
        amount: 1
      - effect_type: "deal_damage"
        name: "闪裂刃舞"
        action_type: "ultimate"   # 伪行动类别声明（终结技伤害身份——E6 穿透 scoped 命中点）
