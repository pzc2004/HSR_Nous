# 角色模板：飞霄（1220）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂勘正六件（staging+fixture 同步）+ 引擎补口四件：
#   ①【引擎】broken_of(target) 宿主函数+白名单——击破查询正式通道（1206
#     素裳挡因③/1220 双分支首实例；draft 幻视 WEAKNESS_BROKEN modifier_id
#     死钩——击破是 ActorState.broken 字段非 modifier，恒 0 恒走未击破分支）
#   ②【引擎】res_pen scoped（承伤三区通用化②——E6「终结技伤害全抗性
#     穿透」类型限定首实例；携带者=攻击侧）
#   ③【引擎】削韧效率 scoped（同族③——E4「天赋追加攻击削韧效率+100%」
#     首实例；toughness_damage_amount 加命中域槽，scoped 并入
#     break_efficiency_boost 池）
#   ④【引擎】deal_damage action_type 声明槽——hook 伤害缺省归 follow_up，
#     「终结技伤害」身份族（E6 穿透命中点/Formshift 反向族）经本槽声明
#   ⑤ 终结技双分支合并单钩逐击切换——draft「开大二选一」失真（中途击破
#     后应切 122008 高伤变体，一次性判定走不完）；amount 三元读 effects
#     链现场值（快照族①——condition 快照、effects 表达式读现场，E1 叠层
#     同构）；122008/122009 lv10 同值 0.6+0.3、lv12 同值 0.648+0.33——
#     数值等效在案，结构正确性保留
#   ⑥ 122014 行动块删除——官方技能清单的演出子条目（与 122003 同参数
#     并列）非独立终结技：若建行动块则 energy_cost 0 无门槛可绕过飞黄
#     开大（严重 bug）；倍率档案留 skill_params
#   ⑦ 击破效率+100% 翻案——draft 误判「无通道」：break_efficiency_boost
#     在库（spec 双池）；挂摘全程（官方「未击破时」由破后 bars_exhausted
#     不再削韧自然出集）
#   ⑧ E6/E4 scoped 化——E6 res_pen 改 hit_condition ultimate（draft 全域
#     直挂=FUA/普攻同穿高估）/ E4 削韧效率改 hit_condition follow_up
#     （FUA 限定——draft 误判无通道）
#   ⑨ E2 notes 勘误（on_action payload action_type 已注册实证）+ FUA 双轨
#     自辩勘误（FUA 是 hook 伤害不发 on_action——312/336 的 +0.5 是 FUA
#     自身攻击计入，非双记）
#
# 收录：普攻闪裂 / 战技钺贯（2.0 lv10+立即 FUA 1.1 lv10+飞黄 +0.5）/
#       天赋雷狩（我方攻击 0.5 飞黄+每 2 次攻击 FUA 1.1 lv10（每回合闩+
#       飞霄回合开始重置——快照 off-by-one 在案）+自增伤 60% 2 回合）/
#       终结技凿破大荒（飞黄 6 开大扣 6：6 子击逐击切换 lv10 0.9+终结段
#       1.6 lv10+无视弱点削韧+击破效率+100% 挂摘）/ 大行迹 Heavenpath
#       （开战 +3 飞黄+回合开始未发 FUA 保底 1 计数）/ Boltcatch（战技后
#       ATK+48% 3 回合）/ 秘技 +1 飞黄 / E1 子击叠层（每子击后后续 +10%
#       cap 5——旗+内联表达式 E0 恒等）/ E2 队友 FUA +1 飞黄 cap 6/回合 /
#       E3/E5 等级族 / E4 FUA 时 SPD+8%+FUA 削韧效率+100% scoped /
#       E6 终结技 res_pen+20% scoped+FUA 倍率+140% 追加段
# 待收（均带挡因）：Formshift（终结技伤害视为追加攻击+FUA 暴伤 36%——
#       身份改写已由 action_type 槽解锁，FUA 暴伤 scoped 件可收——本轮
#       未收因数值未核）/ 终结技全清或扣 6（按扣 6 收在案）/ FUA 无主目标
#       兜底 / 秘技逐波段 / E1 结算口径（逐段递增乘区）/ 行迹属性节点
#       （未下发）/ 削韧数值复核（子击 5×6+终结段 5——米游社单源）
