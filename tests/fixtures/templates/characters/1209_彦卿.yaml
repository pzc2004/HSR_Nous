# 角色模板：彦卿（1209）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂勘正六件（staging+fixture 同步）：
#   ① 列幻视两件（刃 1205 同族——多参数技能"伤害列"不在 params 第 1 列）：
#     大招 scaling 误抄 #1 暴击率列（全档 0.6 当倍率）→ 正解 #3 列 [2.1→4.2]
#     lv10=3.5 / 追击 scaling 误抄 #1 Sync 暴击率列 → 正解 #4 列 [0.25→0.50]
#     lv10=0.50（query-game-data 官方 desc「#4[i]% of Yanqing's ATK」实证）
#   ② 星魂泄漏四件归位：E1 冻结追加钩 / E2_ERR / E4_SEARING_STING / E6
#     on_kill 三件——draft 全植主干（on_battle_start/hooks 顶层）无星魂门控，
#     E0 泄漏生效（实测 e2 0.336=0.3×1.12 钓出 E4 res_pen）；已全归 eidolons
#     块（E0 主干 9 钩无星魂件实证）
#   ③ 追击概率 chance→mechanic_chance（1009/1206 同案——chance 白名单层有但
#     hook 宿主不注入 rng，22_syntax_reference §22.4 钉死：运行期静默不触发
#     +⚠；mechanic_chance expected ≥0.5 恒触发/roll 真掷）
#   ④ 秘技真伤 damage_type "true"→"ice"（1201 青雀先例：damage_type 留源
#     元素、category "true" 标真伤公式）
#   ⑤ ULT_CRIT_DMG 通道迁移：apply_modifiers+enable_if 动态门控（与自身 note
#     「按施放时点读」自相矛盾）→ on_become_target 钩（1207 驭空先例——伤害
#     前挂=本发可吃、施放时点判定、独立存续 1 回合）
#   ⑥ E6 延长 refresh 近似在案（max(剩余,1) vs 官方「延长 1 回合」精确 +1
#     ——修饰符 duration 无增量 effect，通道缺）
#
# 时序实证（e2e 钉）：战技本发不吃 Sync crit——Sync 由 on_action 钩在伤害
#   结算后挂上（crit 区 1.025 vs 后续行动 1.2 双态），与游戏「施放后获得」
#   一致。
#
# 收录：普攻霜锋点寒芒 / 战技遥击三尺水（2.2 lv10 + Soulsteel Sync 1 回合
#       owner_turn_start 锚）/ Sync 门控四件（天赋暴击 20%/暴伤 30% lv10 +
#       行迹 effect_res 20%——enable_if has_modifier 面板读取即重估）/ 受击
#       摘 Sync（reason==hit）/ 终结技快雨燕相逐（3.5 lv10 + 暴击率 +60% 1
#       回合全档恒定 + Sync 门控暴伤 +50% lv10 本发可吃）/ 天赋追击（60%
#       lv10 mechanic_chance——expected 恒触发/roll 真掷；0.5 lv10 列4）/
#       追击冻结（65% 全档 + 冻结附加 50%×atk 回合开始）/ 大行迹 Icing AoE
#       30%（冰弱点门控上位近似在案）/ 秘技 HP≥50% 敌标记+真伤 30%×原伤 /
#       E1 冻结追加 60% / E2 Sync 期 ERR+10% / E3/E5 等级族 / E4 血线≥80%
#       冰抗穿 12% / E6 击杀 refresh 三件
# 待收（均带挡因）：Icing 冰弱点门控（weakness 查询函数缺——上位近似多结算
#       在案）/ 行迹 1209103 暴击提速（on_crit 事件/字段缺）/ Sync 嘲讽降低
#       （aggro 通道缺官方无量化）/ 冻结「无法行动」控制语义（引擎 FREEZE
#       状态机待接——现仅附加伤承载）/ 追击目标重定向（官方单数指向最近
#       攻击目标——现最低 HP% 近似）/ ULT_CRIT_DMG 动态 vs 时点归属（按
#       时点收，待实测）/ E6 精确 +1（refresh 近似）
