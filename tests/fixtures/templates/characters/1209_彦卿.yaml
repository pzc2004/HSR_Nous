scaling_notes:
  - "Soulsteel Sync 是彦卿核心门控：由战技 120902 生成（duration 1）、受击（reason=='hit'）即摘；天赋暴击率/暴伤、行迹 1209102 效果抵抗、星魂 2 ERR 四件全部走 enable_if has_modifier 门控（面板读取即重估，无推式重同步需求）"
  - "终结技 Sync 门控暴伤件（ULT_CRIT_DMG）= on_become_target 钩施放时点判定+独立存续 1 回合（伤害前挂本发可吃——官方「若 Sync 激活中」按施放时点读；与 enable_if 动态门控差异=Sync 受击摘除后已挂暴伤保留，待实测）"
  - "E6 延长语义 refresh 近似=max(剩余,1)——官方「持续时间延长 1 回合」精确 +1 通道缺（修饰符 duration 无增量 effect）；差量场景=击杀发生在回合中段，待通道/待实测"
  - "追击目标选取代数：官方 EN \"the enemy\" 单数指向最近攻击目标，原目标死亡后重定向规则待实测——当前按最低 HP% 单体确定性近似（B19 候选）"
  - "行迹 1209101 冰弱点门控与行迹 1209103 暴击触发（+10% SPD×2 回合）未收：前者缺 weakness 查询函数（上位近似已收），后者缺 crit 判定事件/字段（整件待收）"
  - "战技 sp_cost=1 按 tbgd 权威收（米游社无「消耗」标为已知对轴差异，实机待实测佐证）"
  - "冻结 FREEZE「无法行动」控制语义挡收：modifier_type 词表无控制类键，引擎侧 FREEZE 状态机待接"
  - "120903 / 120904 的 scaling 一律照抄 skill_params 第 1 列（lv1..lv15 逐档对齐 params[0][列1]）；multi 列语义（暴击率/暴伤/追击概率/冻结附加伤/冻结概率）经 param(id, col) 通道直读，不进 scaling"
