hooks:
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TALENT_SYNC_CRIT_RATE"
          name: "呼剑如影·暴击率"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "has_modifier($self, 'SOULSTEEL_SYNC') >= 1"
          stat_effects: {"crit_rate": "param(120904, 1)"}
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TALENT_SYNC_CRIT_DMG"
          name: "呼剑如影·暴伤"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "has_modifier($self, 'SOULSTEEL_SYNC') >= 1"
          stat_effects: {"crit_dmg": "param(120904, 2)"}
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TRACE_FROST_BRAVE"
          name: "Favor Favors the Brave"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "has_modifier($self, 'SOULSTEEL_SYNC') >= 1"
          stat_effects: {"effect_res": 0.2}

  - event: "on_action"
    condition: "$event.actor == '1209' && $event.action_id == '120902' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SOULSTEEL_SYNC"
          name: "Soulsteel Sync"
          modifier_type: "buff"
          duration: 1
          tick_anchor: "owner_turn_start"
          dispellable: True

  - event: "on_become_target"
    condition: "$event.source == '1209' && $event.action_id == '120903' && has_modifier($self, 'SOULSTEEL_SYNC') >= 1"
    effects:
      # Sync 门控暴伤（伤害前挂=本发可吃；施放时点判定+独立存续 1 回合——官方「若
      # 智剑连心激活中」按施放时点读，1207 驭空 on_become_target 通道先例；
      # 单体大招单次 emit。旧案 apply_modifiers+enable_if 动态门控与本 note 自相矛盾已废）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ULT_CRIT_DMG"
          name: "快雨燕相逐·暴伤"
          modifier_type: "buff"
          duration: 1
          dispellable: True
          stat_effects: {"crit_dmg": "param(120903, 2)"}

  - event: "on_hp_decrease"
    condition: "$event.target == '1209' && $event.reason == 'hit'"
    effects:
      - effect_type: "remove_modifier"
        modifier_id: "SOULSTEEL_SYNC"

  - event: "on_action"
    condition: "$event.actor == '1209' && !$event.insert && ($event.action_id == '120901' || $event.action_id == '120902' || $event.action_id == '120903') && mechanic_chance(param(120904, 3))"
    effects:
      - effect_type: "trigger_action"
        action_id: "120904"
        target: {pool: "enemies", order_by: "$it.hp / $it.max_hp", take: 1, mode: "deterministic"}

  - event: "on_hp_decrease"
    condition: "$event.source == '1209' && $event.action_type == 'follow_up' && $event.reason == 'hit' && mechanic_chance(param(120904, 6))"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "FREEZE"
          name: "Frozen"
          modifier_type: "debuff"
          duration: 1
          dispellable: True

  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'FREEZE') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "呼剑如影·冻结附加伤"
        target: "$event.actor"
        damage_type: "ice"
        amount: "param(120904, 5) * $self.atk"

  - event: "on_action"
    condition: "$event.actor == '1209' && !$event.insert && ($event.action_id == '120901' || $event.action_id == '120902' || $event.action_id == '120903' || $event.action_id == '120904')"
    effects:
      - effect_type: "deal_damage"
        name: "Icing on the Kick"
        target: "all_enemies"
        damage_type: "ice"
        amount: "0.3 * $self.atk"

  - event: "on_hp_decrease"
    condition: "$event.source == '1209' && $event.reason == 'hit' && has_modifier($event.target, 'TECH_MARK') >= 1 && res__tech_lock < 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_tech_lock"
        amount: 1
      - effect_type: "deal_damage"
        name: "御剑真诀"
        target: "$event.target"
        damage_type: "ice"
        category: "true"
        amount: "0.3 * $event.amount"
      - effect_type: "set_resource"
        resource_id: "_tech_lock"
        amount: 0

eidolons:
  E1:
    name: "Svelte Saber"
    hooks:
      - event: "on_hp_decrease"
        condition: "$event.source == '1209' && $event.reason == 'hit' && has_modifier($event.target, 'FREEZE') >= 1 && res__e1_lock < 1"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e1_lock"
            amount: 1
          - effect_type: "deal_damage"
            name: "Svelte Saber"
            target: "$event.target"
