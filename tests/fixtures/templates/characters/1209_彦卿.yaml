              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "$self.hp / $self.max_hp >= 0.8"
              stat_effects: {"res_pen": 0.12}
    notes:
      - "已收（enable_if 件：HP%≥80% 冰抗穿 +12%；本体全冰段 res_pen 单通道无观察差；过堂勘正——draft 误植主干致 E0 泄漏（实测 0.3×1.12 钓出），已归位 eidolons 块）"
  E5:
    name: "Surging Strife"
    skill_level_overrides: {"ultimate": 2, "talent": 2}
    notes:
      - "终结技+2 随档段：暴击率 param(120903,1) 全档恒定 0.6、Sync 暴伤 param(120903,2) 取 lv12 档 0.54、伤害 scaling 取 params 列3 lv12 档 3.78（列1=暴击率非伤害——draft 曾列幻视全档 0.6 当倍率，刃 1205 同族案已勘正）"
      - "天赋+2 随档段：Sync 暴击率/暴伤 param(120904,1/2) 取 lv12 档（0.21 / 0.33）、追击概率 param(120904,3) 取 lv12 档 0.62、追击倍率 scaling 取 params 列4 lv12 档 0.55（列1=Sync 暴击率非追击倍率——同族列幻视已勘正）、冻结附加伤 param(120904,5) 取 lv12 档 0.55；冻结概率 #6 全档恒定 0.65"
  E6:
    name: "Swift Swoop"
    hooks:
      - event: "on_kill"
        condition: "$event.source == '1209' && has_modifier($self, 'SOULSTEEL_SYNC') >= 1"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
