              {"atk": 1.26}, {"atk": 1.32}, {"atk": 1.38}, {"atk": 1.44}, {"atk": 1.5}]
    toughness_dmg: 10           # 米游社 sub_tag：10（强化后 20——hook 侧表达式收编，见 hooks）
    skill_point_cost: 0         # 不耗不产
    energy_gain: 10             # 对轴表 energy_tbgd=10（账面档案——实账走 hook gain_energy，
                              # deal_damage 不过 action 路由，卡芙卡 1100504 同口径）
    # 由 hooks deal_damage 发射（充能阈值判定 + 终结技强化 + 当品叠层同一链——非玩家可选招式）

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN
eidolons:
  E1:
    name: "Altruism? Nevertheless Tradable"   # 无私？亦可交割（character_ranks 核）
    hooks:
      # 天赋追击伤害 +32%——乘区官方未明示（待实测）；按追加真伤段等值承载（遐蝶 E1 同构先例：
      # category "true" 跳乘区=与"原伤害 132%"数值等价）。若实测为倍率/增伤区需改写
      # 递归闩（族谱#12）双件：① damage_type=='quantum' 过滤——自身真伤段 damage_type='true'
      # 天然出集（遐蝶 E1 同族闩）；② res__in_fua>=1 发射闩——只认剔烁之牙闩内命中
      #（秘技进战伤害伪类别闭合词表只能 follow_up，靠闩出集——非天赋追加攻击不吃 +32%）
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.damage_type == 'quantum' && $event.source == '1314' && $event.action_type == 'follow_up' && res__in_fua >= 1"
        effects:
          - effect_type: "deal_damage"
            name: "Altruism? Nevertheless Tradable"
            target: "$event.target"
            damage_type: "true"
            category: "true"
            amount: "0.32 * $event.amount"
    notes:
      - "收债人攻击命中 2 或 1 个敌人时额外 +1 或 +2 充能 待收——挡因：after_being_hit 载荷含 hit_targets 全集但逐目标发射，按一次攻击去重需攻击实例 id/攻击结束事件（缺）；逐事件 ÷N 重建对多段行动失真（段级目标集≠攻击级），不收"
  E2:
    name: "Morality? Herein Authenticated"    # 道德？谨此核押
    hooks:
      # 当品 ≥15 层时暴击率 +18%——enable_if 门控（04_modifier §4.16 面板读取即重估；当品资源实时读）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_MORTGAGE_CRIT"
              name: "Morality? Herein Authenticated"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "res__mortgage >= 15"
              stat_effects: {"crit_rate": 0.18}
  E3:
    name: "Honesty? Soon Mortgaged"           # 坦率？只待典当
    skill_level_overrides: {"skill": 2, "talent": 2}   # 战技+2、天赋+2
    notes:
      - "战技+2：SPD+30/烧血 2%/持续 3 为全档常量（param 恒等）；附加伤害 param(131402, 3) 随档（lv12=0.27）"
      - "天赋+2：追击伤害 param(131404, 5) 随档（lv12=1.32）+ 每层暴伤 param(131404, 1)（lv12=0.0264）随档"
  E4:
    name: "Sincerity? Put Option Only"        # 真诚？唯凭认沽
    hooks:
      # 施放终结技时翡翠造成的伤害无视 12% 防御、持续 3 回合——过堂⑭收编：def_pen 键在库且
      # _def_multi_eff 消费（draft"通道缺"挡因证伪；官方"造成的伤害"=全域非技域限定，全局槽正好）。
      # 挂载点=终结技伤害结算后（on_action 后行——引擎无星魂门控的伤害前挂载通道）：
      # 当次终结技不自吃，后续 3 回合（翡翠自身回合末走字）内全伤害吃——当次是否自吃待实测 B19 候选
      - event: "on_action"
        condition: "$event.actor == '1314' && $event.action_id == '131403' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_DEF_PEN"
              name: "Sincerity? Put Option Only"
              modifier_type: "buff"
              duration: 3
              dispellable: False
              stat_effects: {"def_pen": 0.12}
  E5:
    name: "Hope? Hitherto Forfeited"          # 希冀？已然绝卖
    skill_level_overrides: {"ultimate": 2, "basic": 1}  # 终结技+2、普攻+1
    notes:
      - "终结技+2：全体伤害 action scaling 实取 lv12 档（2.64）；追击倍率强化 param(131403, 1) 随档（lv12=0.88）走 hooks"
      - "普攻+1：普攻 scaling 实取 lv7 档（主 0.99 / 相邻 0.33）"
  E6:
    name: "Equity? Pending Sponsorship"       # 公平？仍须保荐
    hooks:
      # 翡翠量子抗性穿透 +20%——enable_if 门控读收债人在场闩（官方"场上存在收债人时"）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_RES_PEN"
              name: "Equity? Pending Sponsorship"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "res__debtor_on_field >= 1"
              stat_effects: {"res_pen": 0.2}
      # 同时翡翠自身获得【收债人】状态（官方原文）——仅当战技指定他人时补挂（自挂时战技钩
      # 已挂无 spd 件，排 target==1314 防重复）；与官方"无法获得速度提高效果"一致=无 spd 形
      - event: "on_action"
        condition: "$event.actor == '1314' && $event.action_id == '131402' && $event.target != '1314' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "JADE_DEBTOR"
              name: "收债人"
              modifier_type: "buff"
              duration: 3
              tick_anchor: "source_turn_start"
              dispellable: False
              stat_effects: {}
    notes:
      - "E6 双收债人并发（队友+翡翠同持收债人）：现模型同源同钟（duration 3 source_turn_start）自然并发；自任双倍充能钩同盖（模板级）；与 E1 额外充能联动随 E1 待收"

hooks:
  # ── 131402 战技施放（目标≠翡翠）：挂【收债人】（+30 SPD 固定值、3 回合）+ 收债人在场闩 ──
  # 计时锚 source_turn_start = 施加者（翡翠）回合开始走字——官方"翡翠每回合开始时【收债人】
  # 状态持续回合数减 1"精确命中（过堂⑯；长夜月 141302 族通道）；_debtor_turns 闩同节奏门控
  - event: "on_action"
    condition: "$event.actor == '1314' && $event.action_id == '131402' && $event.target != '1314' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "JADE_DEBTOR"
          name: "收债人"
          modifier_type: "buff"
          duration: 3
          tick_anchor: "source_turn_start"
          dispellable: False
          stat_effects: {"spd": "param(131402, 1)"}   # #1=30 固定值（官方 params=30 整数；挂点烘焙静态档——非 30%）
      - effect_type: "set_resource"
        resource_id: "_debtor_on_field"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_debtor_turns"
        amount: "param(131402, 4)"                    # #4=3（全档恒定）

  # ── 131402 战技施放（目标=翡翠自身）：官方"若翡翠成为【收债人】时，无法获得速度提高
  # 效果且攻击后不消耗生命值"——无 spd 形挂件（过堂⑮：draft 单钩对自挂也带 SPD+30=病）──
  - event: "on_action"
    condition: "$event.actor == '1314' && $event.action_id == '131402' && $event.target == '1314' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "JADE_DEBTOR"
          name: "收债人"
          modifier_type: "buff"
          duration: 3
          tick_anchor: "source_turn_start"
          dispellable: False
          stat_effects: {}
      - effect_type: "set_resource"
        resource_id: "_debtor_on_field"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_debtor_turns"
        amount: "param(131402, 4)"

  # ── 收债人持续计数：翡翠回合开始 -1（与 source_turn_start 锚同刻——on_turn_start 钩
  # 先于 modifier 走字，同回合内自洽），归零摘闩 ──
  - event: "on_turn_start"
    condition: "$event.actor == '1314' && res__debtor_on_field >= 1 && res__debtor_turns > 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_debtor_turns"
        amount: -1
  - event: "on_turn_start"
    condition: "$event.actor == '1314' && res__debtor_on_field >= 1 && res__debtor_turns <= 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_debtor_turns"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_debtor_on_field"
        amount: 0

  # ── 收债人攻击链：对命中的每个敌人各触发 1 次附加伤害（逐受击目标发射=官方"每个敌人"）──
  # 覆盖翡翠自任收债人（has_modifier 化——draft 排 source==1314 漏自任件，过堂⑥）；
  # 伤害基数 = 翡翠现场 ATK（$self=hook 持有者；过堂⑦白值烘焙勘正——三月七/卡芙卡同通道先例）；
  # category "additional"（附加伤害正籍：不吃类型限定增伤桶；action_type 闩=自递归闸——
  # 伪行动类别 'additional' 的自身命中出集，族谱#12）；附伤是否吃翡翠暴击/增伤、
  # 命中即触发边界 待实测（B19 候选——现按直伤全乘区结算，伪类别决定类型桶不命中）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && $event.action_type != 'additional' && has_modifier($event.source, 'JADE_DEBTOR') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "恣肆吞併的担保·附加伤害"
        target: "$event.target"
        damage_type: "quantum"
        category: "additional"
        amount: "$self.atk * param(131402, 3)"          # #3 随档（lv10=0.25）

  # ── 收债人烧血：每次攻击后消耗收债人 2% 最大生命（#2），当前不足降至 1（非致死——floor 1）──
  # 翡翠自己为收债人时不烧血（官方明示——排除 self）；攻击过滤=目标为怪物（过堂⑤——
  # 卡芙卡勘正②同族：对友方增益/治疗不烧）；insert 放开=追击/反击同烧（"施放攻击"宽口径，待实测在案）
  - event: "on_action"
    condition: "$event.actor != '1314' && has_modifier($event.actor, 'JADE_DEBTOR') >= 1 && actor_type_of($event.target) == 'monster'"
    effects:
      - effect_type: "drain_hp"
        target: "$event.actor"
        amount: "param(131402, 2) * $target.max_hp"   # #2=0.02（全档恒定）× 收债人现场生命上限
        floor: 1
        drain_ratio: 0

  # ── 天赋充能①：翡翠（攻击三技白名单——天赋追击/秘技进战伪类别均归 follow_up 天然出集）
  # 或收债人（排附加伤害 additional）攻击，每命中 1 个敌人 +1 充能（逐受击目标记账）──
  # 收债人的追击/反击不排（官方"施放攻击"含追击——翡翠+姬子配队实证口径，过堂⑧）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && $event.action_type != 'additional' && (($event.source == '1314' && ($event.action_type == 'basic' || $event.action_type == 'skill' || $event.action_type == 'ultimate')) || ($event.source != '1314' && has_modifier($event.source, 'JADE_DEBTOR') >= 1))"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_charge"
        amount: 1
  # ── 天赋充能②：翡翠自身为收债人时每击中 1 名额外 +1（双倍叠层——社区证据：HoYoLAB
  # 攻略"翡翠自己成为【收债人】时攻击可以双倍叠层"；按击不按次，普攻/战技/终结技同盖；
  # 过堂⑨：draft 普攻 flat +3 幻模勘正。实测终审候选 B19）──
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && $event.source == '1314' && ($event.action_type == 'basic' || $event.action_type == 'skill' || $event.action_type == 'ultimate') && has_modifier($event.source, 'JADE_DEBTOR') >= 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_charge"
        amount: 1

  # ── 天赋追击发射：充能满 #3=8（含本次 +1；自任双倍分支 +2）→ 全体量子伤
  #（基数 $self.atk×[#5+终结技强化]，米游社："buff 给的追击倍率加成作用在倍率区"——加算）
  # + 溢出结转（set=现场新值-8——effects 序读现场，增益钩已落地，族谱#9 勘正）
  # + 立即获得 #4=5 层当品 + 回能 10（tbgd 权威——deal_damage 不过 action 路由，hook 补记）
  # + 强化次数扣 1（max(0,res-1) 幂等——并钩压缩，过堂⑫）
  # + _in_fua 发射闩 set 1→发射→set 0（族谱#12——E1 真伤段只认闩内命中，秘技伪 follow_up 出集）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && $event.action_type != 'additional' && (($event.source == '1314' && ($event.action_type == 'basic' || $event.action_type == 'skill' || $event.action_type == 'ultimate')) || ($event.source != '1314' && has_modifier($event.source, 'JADE_DEBTOR') >= 1)) && (res__charge + 1 >= param(131404, 3) || ($event.source == '1314' && has_modifier($event.source, 'JADE_DEBTOR') >= 1 && res__charge + 2 >= param(131404, 3)))"
    effects:
      - effect_type: "set_resource"
        resource_id: "_in_fua"
        amount: 1
      - effect_type: "deal_damage"
        name: "剔烁之牙"
        target: "all_enemies"
        damage_type: "quantum"
        amount: "$self.atk * (param(131404, 5) + param(131403, 1) * min(res__ult_stacks, 1))"
        toughness_dmg: "10 + 10 * min(res__ult_stacks, 1)"   # 米游社：追击 10 / 强化后 20（过堂⑬ 收编）
      - effect_type: "set_resource"
        resource_id: "_in_fua"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_charge"
        amount: "max(0, res__charge - param(131404, 3))"
      - effect_type: "gain_resource"
        resource_id: "_mortgage"
        amount: "param(131404, 4)"    # #4=5 层当品
      - effect_type: "gain_energy"
        target: "self"
        amount: 10                    # 天赋回能 10（tbgd SPBase 权威）
      - effect_type: "set_resource"
        resource_id: "_ult_stacks"
        amount: "max(0, res__ult_stacks - 1)"

  # ── 131403 终结技：武装追击倍率强化 2 次（#2）──
  - event: "on_action"
    condition: "$event.actor == '1314' && $event.action_id == '131403' && !$event.insert"
    effects:
      - effect_type: "set_resource"
        resource_id: "_ult_stacks"
        amount: "param(131403, 2)"     # #2=2（全档恒定）

  # ── 当品属性主干（战斗开始挂载一次，stat_exprs 现场求值——04_modifier §4.16 面板读取
  # 即重估；过堂④：draft stat_effects 挂点烘焙=恒 0 死件，族谱#10 勘正）──
  # 每层：+param(131404,1) 暴击伤害（天赋 #1）+ 0.5% ATK（行迹 1314103 #1）；上限 50 层钳制
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "JADE_GOODS_STAT"
          name: "当品"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            crit_dmg: "param(131404, 1) * min(res__mortgage, param(131404, 2))"
            atk_pct: "0.005 * min(res__mortgage, param(131404, 2))"   # 行迹 1314103（atk_pct 在案键）

  # ── 大行迹「折牙票」：战斗开始翡翠行动提前 50%（#1——amount 百分数，05_effects §advance_action）──
  - event: "on_battle_start"
    effects:
      - effect_type: "advance_action"
        target: "self"
        amount: 50

  # ── 大行迹「逆回购」①：敌方目标入战时翡翠 +1 层当品（#2）——首发阵容引擎不发
  # actor_enter（仅波次/召唤/回场），on_battle_start 按存活敌数一次性补齐（过堂⑰）──
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_mortgage"
        amount: "enemies_alive()"
  - event: "actor_enter"
    condition: "$event.actor_type == 'monster'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_mortgage"
        amount: 1

  # ── 大行迹「逆回购」②：收债人角色回合开始时额外 +3 层当品（#1——主体=收债人 actor，
  # 翡翠自任同吃——官方"处于【收债人】状态的角色"）──
  - event: "on_turn_start"
    condition: "has_modifier($event.actor, 'JADE_DEBTOR') >= 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_mortgage"
        amount: 3

scaling_notes:
  - 战技可用性硬闸（131402 available_if）：场上存在收债人时不可再用（官方原文）——以 _debtor_on_field
    闩承载（政策/手动/web 同一漏斗，03_actor §3.8.1 行动级可用条件）
  - 天赋追击（131404）走 hook deal_damage 发射（充能阈值判定 + 终结技强化 + 当品叠层 + 回能同链）——
    actions 块 scaling = params 第 5 列（档案口径=伤害列，姬子/卡芙卡同；实际发射倍率走 param(131404, 5)，
    基数 $self.atk 现场面板）
  - 终结技 scaling = params 第 3 列（全体伤害——过堂①勘正；第 1 列为追击强化倍率，走 hooks min(res__ult_stacks,1) 门控）
  - 收债人附加伤害基数=翡翠现场 ATK（官方"翡翠攻击力"域——$self=hook 持有者；伪类别 additional 不吃
    类型限定增伤桶，吃元素/全伤桶与翡翠双暴/穿透/无视防御全乘区——E4 def_pen 同盖）
  - 终结技追击倍率强化按米游社"作用在倍率区"读法与 #5 加算——与 E1 +32% 的叠加顺序/同区判定待实测
  - 待收总账（挡因见头注）：①E1 额外充能（攻击级命中数通道缺）②E4 当次终结技自吃判定（挂载点后行）
    ③秘技【盲从】状态机 ④充能溢出存储上限 ⑤自任双倍叠层实测终审 ⑥烧血插入式口径边界
