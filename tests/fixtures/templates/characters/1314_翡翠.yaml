# 角色模板：翡翠（1314）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 版本双轨：1314 不在 3.x 加强名单（1004/1005/1006/1102/1205/1212/1217/1306/1307/1310）
# ——单轨现役，无新旧两轨。
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
#
# 过堂收编/勘正二十件：① 终结技 scaling 列错位勘正——draft 照抄 params #1 列
#   （追击强化倍率 0.4..1.0），官方文本伤害引 #3[i]（全体 1.2..3.0）——引擎实放
#   终结技按错列结算会亏 2/3 伤害；天赋 action 同病（抄 #1 暴伤列 → 改 #5 追击
#   伤害列，姬子/卡芙卡档案口径=伤害列）；② 行迹幻名勘正——1314102 官方名
#   「折牙票」（draft「担保票据」）、1314103 官方名「绝当品」（draft「资产没收」）；
#   ③ 行迹属性小节点收编——量子增伤 22.4%/攻击 18%/效果抵抗 10%（StarRailRes
#   行迹节点表），trace_stat_effects 不再留空；④ 当品属性件蒙福者烘焙病勘正
#   （族谱#10）——draft stat_effects 字串读 res__mortgage，on_battle_start 挂点
#   当品=0 烘焙恒 0=死件；正解 stat_exprs 现场求值（04_modifier §4.16）；
#   ⑤ 烧血钩补攻击过滤——draft 无 actor_type_of($event.target)=='monster'
#   （卡芙卡勘正②同族：收债人对友方增益/治疗会白烧血）；并按"施放攻击"宽口径
#   放开 !insert（插入式追击/反击同为攻击——边界待实测在案）；⑥ 附加伤害
#   补 category:"additional"——draft 缺类别默认伪 follow_up：误吃追击类型增伤
#   桶、被 E1 真伤钩当追加攻击双击、翡翠自任收债人时自递归；加 action_type
#   !='additional' 闩（族谱#12）；⑦ 三处白值烘焙勘正——draft 以 659.736 定值
#   承载附加伤害/追击/秘技基数（"通道缺"挡因被三月七/卡芙卡 $self.atk 先例
#   证伪），改 $self.atk 现场面板（吃当品 ATK/行迹/遗器）；⑧ 充能钩条件两错
#   勘正——'!='follow_up' 把收债人的追击/反击误排（官方"施放攻击"含追击，
#   翡翠+姬子配队实证口径）；翡翠分支改白名单 basic/skill/ultimate（排天赋
#   追击与秘技伪类别），收债人分支排 additional；⑨ 自任收债人充能幻模
#   勘正——draft 普攻 flat +3（烘焙 3 目标扩散假设且只盖普攻）；社区证据
#   （HoYoLAB 攻略"翡翠自己成为收债人时攻击可以双倍叠层"）= 每击中 1 名
#   额外 +1——逐 hit 钩（普攻/战技/终结技同盖，按击不按次，实测终审候选）；
#   ⑩ 发射钩快照补偿错位勘正（族谱#9）——draft set 表达式 res__charge+1-8：
#   effects 读现场新值（增益钩已 +1）= 多结转 1；正解 max(0,res__charge-8)，
#   加倍分支发射条件补 res__charge+2>=8 OR 句；⑪ 追击回能 10 补记（卡芙卡
#   同族）——deal_damage 不过 action energy_gain 路由，hook gain_energy 补；
#   ⑫ ult_stacks 扣减并钩（压缩）——独立钩五重条件重复，并入发射钩 effects
#   （max(0,res-1) 幂等）；⑬ 强化追击削韧 20 收编——draft"覆写通道缺"挡因
#   过期：hook toughness_dmg 表达式通道在库（米游社"强化后削韧 20"单源）；
#   ⑭ E4 收编——draft"def-ignore 通道缺"挡因证伪：def_pen 键在库且
#   _def_multi_eff 消费（官方"翡翠造成的伤害"=全域非技域限定，全局槽正好）；
#   on_action(终结技) 挂 def_pen 0.12 持续 3 回合——挂载点在当次终结技伤害
#   结算后（引擎无星魂门控的伤害前挂载通道），当次是否自吃待实测在案；
#   ⑮ 自任收债人 SPD+30 病勘正——官方"若翡翠成为【收债人】时，无法获得
#   速度提高效果"：战技钩拆二（目标≠翡翠=spd 件 / 目标=翡翠=无 spd 件），
#   E6 自挂件同无 spd 形且排 target==1314 防重复挂；⑯ 收债人计时锚
#   owner_turn_start→source_turn_start（施加者=翡翠回合开始走字——官方
#   "翡翠每回合开始时减 1"精确命中，长夜月 141302 族通道在库；draft 近似
#   锚退役）；⑰ 逆回购①开局阵容补收——actor_enter 引擎不对首发阵容发射
#   （仅波次/召唤/回场），on_battle_start enemies_alive() 一次性补齐；后续
#   入战读载荷 $event.actor_type=='monster'；⑱ 战技 target_type 'single'→
#   'ally_single'（我方单体选择口径——'single' 会让政策把战技选到敌人头上），
#   damage_type 摘 null（纯挂载技，星期日先例）；⑲ 天赋 action 补
#   level_key:'talent'（三月七先例——缺省 follow_up 归 ultimate 轨道，E5
#   ult+2 会误抬档）；⑳ 秘技基数 $self.atk 化 + E1 防误击改 _in_fua 发射闩——
#   伪行动类别闭合词表（六类）无 technique 键，秘技进战伤害只能伪 follow_up，
#   会被 E1 真伤钩误当天赋追击；正解 set 1→发射→set 0 闩（族谱#12 同族），
#   E1 只认闩内命中（伪 follow_up 类型桶"追击增伤"偏差在案）。
# 收录：充能-追击-当品全链（阈值 8 发射/溢出结转/逐击记账/自任双倍）/收债人
#   全件（挂摘双形/烧血/逐击附加伤害/source_turn_start 精确计时/战技硬闸）/
#   终结技强化追击（倍率区加算+次数扣减+削韧变档）/行迹三件（折牙票拉条/
#   逆回购双源当品/绝当品 ATK）/秘技两件（进战 AoE+15 层当品）/E1 真伤段/
#   E2 门控暴击率/E3E5 等级联动/E4 无视防御/E6 双件（抗穿门控+自任收债人）。
# 待收（均带挡因）：E1 额外充能（收债人攻击击中 2/1 名 +1/+2）——
#   after_being_hit 载荷含 hit_targets 全集但逐目标发射，按"一次攻击"去重需
#   攻击实例 id/攻击结束事件（缺）；逐事件 ÷N 重建对多段行动失真（段级目标
#   集≠攻击级），不收 / E4 当次终结技是否自吃 12% 无视防御——挂载点=伤害
#   结算后（引擎无星魂门控伤害前通道），待实测 / 秘技【盲从】状态机（敌人
#   不主动攻击/同入战）——通道缺 / 充能溢出存储上限——官方"溢出不浪费"
#   上限未给（现 max: inf 全结转），待实测 / 自任双倍叠层实测终审——社区
#   单源（HoYoLAB），按证据层④标源 / 烧血插入式口径——追击/反击（insert）
#   同烧按"施放攻击"宽口径收，实测边界在案。
actor_id: "1314"
name: "翡翠"
level: 80
path: "erudition"      # 命途：智识（官方对轴表 path=Mage→Erudition）
groups: ["faction:ipc"]  # 名册：星际和平公司（官方背景文本；roster 推断——与 count_team 编成计数并行，在案）
element: "quantum"     # 元素（官方数据照抄）
base_stats:
  hp: 1086.624
  atk: 659.736
  def: 509.355
  spd: 103
  crit_rate: 0.05      # 管线实值（本体行迹无暴击率节点——社区页数值一律不采）
  crit_dmg: 0.5        # 管线实值（当品暴伤走 modifier 通道，不并入 base_stats）
  max_energy: 140      # 能量上限 140（官方对轴表 energy_max=140 + 米游社双源一致）
trace_notes:
  - 大行迹「折牙票」（1314102）已收：战斗开始翡翠行动提前 50%（#1，官方文本）——见 hooks on_battle_start（draft 幻名「担保票据」已勘正）
  - 大行迹「逆回购」（1314101）已收两件：敌方目标入战 +1 层当品（#2——on_battle_start enemies_alive() 补首发阵容 + actor_enter 后续入战）/ 收债人角色回合开始 +3 层当品（#1——主体=收债人 actor）
  - 大行迹「绝当品」（1314103）已收：天赋每层当品额外 +0.5% ATK（#1；50 层=+25% ATK，米游社交叉一致）——atk_pct 在案键（draft 幻名「资产没收」已勘正）
  - 行迹属性小节点（StarRailRes）：量子增伤 0.032×2+0.048×2+0.064=0.224 / 攻击 0.04+0.06+0.08=0.18 / 效果抵抗 0.04+0.06=0.10——trace_stat_effects 通道（pct/增伤白值口径由引擎结算）
  - 本体三行迹均为资源/拉条/属性，无 revive / immune / special-ratio 项【官方文本】
trace_stat_effects:
  dmg_quantum: 0.224   # 行迹量子增伤小节点 ×5（0.032+0.032+0.048+0.048+0.064——dmg_<element> 前缀路由元素桶，艾丝妲 dmg_fire 同族）
  atk_pct: 0.18        # 行迹攻击小节点 ×3（0.04+0.06+0.08）
  effect_res: 0.1      # 行迹效果抵抗小节点 ×2（0.04+0.06）

