custom_resources:
  _charge:
    name: "充能"
    max: "inf"           # 阈值 8 发动追击；官方"溢出不浪费"（米游社）——溢出存储上限官方未给，待实测（B19 候选）
  _mortgage:
    name: "当品"
    max: 50              # 层数上限 #2=50（官方文本）
  _ult_stacks:
    max: 2               # 终结技追击倍率强化可生效次数 #2=2（官方文本）
  _debtor_on_field:
    max: 1               # 收债人在场闩（战技可用性 + E6 门控读它）
  _debtor_turns:
    max: 3               # 收债人剩余翡翠回合计数（=param(131402,4) 轨道；与 source_turn_start 锚同节奏——E6 门控精度）
  _in_fua:
    max: 1               # 剔烁之牙发射闩（set 1→发射→set 0，族谱#12 同族）——E1 真伤段只认
                         # 天赋追击（秘技进战伤害伪类别闭合词表只能 follow_up，靠本闩出集）

# 秘技（131407 猎手的视界）：区域内敌人施加【盲从】10s（不主动攻击——状态机通道缺，待收）；
# 主动攻击盲从敌人时全体一同入战；入战对敌方全体造成 50% ATK 量子伤害（#2）+ 立即获得 15 层当品（#3）
techniques:
  - technique_id: "131407"
    name: "猎手的视界"
    point_cost: 1
    effects:                              # 进战一次性（战前装填预置；施放者=翡翠）
      - effect_type: "deal_damage"
        name: "猎手的视界"
        target: "all_enemies"
        damage_type: "quantum"
        # 伪行动类别缺省 follow_up（闭合词表六类无 technique 键——类型桶"追击增伤"偏差在案）；
        # 与天赋追击的区分走 _in_fua 闩（E1 真伤段只认闩内命中——custom_resources 注）
        amount: "0.5 * $self.atk"         # #2=0.5 × 翡翠现场 ATK（$self=hook 持有者——过堂⑦：draft 白值烘焙勘正）
      - effect_type: "gain_resource"
        resource_id: "_mortgage"
        amount: 15                        # #3=15 层当品

actions:
  - action_id: "131401"
    name: "挞楚抽薪"
    action_type: "basic"
    target_type: "blast"
    damage_type: "quantum"
    scaling: [{"atk": 0.45}, {"atk": 0.54}, {"atk": 0.63}, {"atk": 0.72}, {"atk": 0.81},
