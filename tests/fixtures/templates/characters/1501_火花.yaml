# 角色模板：火花（1501）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging 1501_火花.yaml）+ 过堂勘正（staging→fixtures 合并流水线）。
#   官方对照：StarRailRes index_new cn/en（技能/星魂/行迹原文 + params 逐行）、tbgd
#   AvatarSkillConfig（SP 耗产/回能/ShowStanceList——显示削韧=raw÷3，遐蝶 [60,0,30]↔mys 20
#   实证换算率）、米游社开拓者笔记五项标签。欢愉（Elation）新命途首模板。
#
# 收录：直播态换技能（150101↔150108 available_if 互斥 + _live 闩，150108 结算下播）/
#   好活当赏天赋附伤（强化普攻主段 #3=40%；终结技全体 #2=48%——两子句同吃好活当赏门，
#   CN「持有【好活当赏】时：」冒号统摄）/ 笑点经济（终结技 +2、大行迹 1501102 按队伍欢愉
#   角色数 1/2/≥3 → +2/4/8 笑点 +1/1/4 爆点、E4 开大再 +5）/ 1501103 每笑点全队暴伤
#   +8% 上限 80%（on_resource_gain 重挂 replace 烘焙，1407 荒芜同构）/ E1 每笑点全体
#   抗穿 +1.5% 上限 15%（同构光环——「当前每拥有」为常驻件，与阿哈时刻无关）/
#   互动陷阱发动计数（_engagement 容器上限 20=param(150102,1)；150109 available_if
#    gated——「本次技能内最多发动 20 次」；150102 免费发动那次是否计入待实测）/
#   欢愉技 150120（全体 #2=50% + 20 段随机单体 #1=25% 逐段照抄——expected 确定化按序
#   取首 B22；level_key: elation_skill 取档键，E3/E5 slo 同键对接）/ 行迹暴击率 +12%、
#   暴伤 +13.3%（trace_stat_effects）/ 秘技进战全体 50% 火伤 + 回 2 战技点
#   （gain_skill_point 在案）/ E6 全属性抗穿 +20%。
# 勘正十二件：①150120 hook 全体主段与 action scaling 重复结算（双倍伤）→ 删 hook
#   全体段，action scaling 单承；②天赋终结技附伤钩漏好活当赏门 → 补 has_modifier
#   条件；③行迹 crit 数值节点漏收（draft trace_stat_effects 空）→ 收 crit_rate 0.12 /
#   crit_dmg 0.133；④「Engagement Farming」=【互动陷阱】150109 本体（EN 名直译差——
#   draft 误判为未知独立机制「触发挂点待实测」）→ 计数钩 + 20 次闸收编；⑤E1 抗穿半件
#   draft 随阿哈时刻整体待收 → 官方「当前每拥有」常驻可收，1501103 同构收编；
#   ⑥E6 注文误读「+40 → 60 段」→ 官方「最多增加至 40 次」=段数上限 40；⑦palette 初挂
#   缺 stack_mode（表达式烘焙件闸，1207 驭空案）→ 初挂/重挂统一 replace；⑧150110
#   available_if "false" 裸字面量（Name 运行期未定义 → B8 ⚠ 噪音）→ 良构 "1 < 0"；
#   ⑨150120 action 缺 level_key（归 skill 类会被 E3 战技+2 误抬 lv12 档）→ 补
#   level_key: "elation_skill"（E0 回落 ultimate=10 与欢愉技基础档同值自洽）；
#   ⑩秘技「恢复 #1[i]=2 战技点」draft 标「批量授予通道缺」→ gain_skill_point 在案
#   （花火溢出池先例）收编；⑪削韧 provenance 注过期（draft「mys 未拆分/冲突」——
#   tbgd÷3 全链对轴一致：基础普攻 30→10、强化普攻 [30,0,15]→主 10 邻 5、天赋 15→5、
#   终结技 60→20；mys「30+15×2」条为原始单位未换算标签）；⑫E3 注文普攻档幻视
#   （「实取 lv11」——普攻默认 lv6，E3+1 → lv7=index 6）。
# 待收（均带挡因）：欢愉体系整体未实装（21_elation 章首注——欢愉度面板属性/欢愉伤害
#   公式路由/阿哈时刻/笑点全队共享 scope 均无引擎路径）：1501101 攻击转欢愉度、
#   150103 #3=0.6×欢愉度段、E4 欢愉度 +36%、行迹欢愉度 +28%（5 节点）；天赋/欢愉技的
#   「欢愉伤害」类别按火直伤近似（欢愉区/不享受增伤差异在案）/ 天赋 #1 互动陷阱追加段
#   （每发动 1 次互动陷阱→强化普攻额外 1 段随机受击目标——hook 动态段数无循环原语
#   +「受到攻击的目标」池无目标代数）/ 天赋 #4 强化普攻相邻段（hook 目标代数无「相邻
#   于主目标」词表）/ 150109 随机礼物二选一（chance 需 rng、expected 无随机源——分支
#   通道缺；红红火火=笑点 2+战技点 2、恍恍惚惚=笑点 1，随手分支同挂）与 #4/#5 倍率提高
#   （scaling 覆写通道缺 + 持续域待实测）/ 爆点抵扣战技点（「消耗爆点视为消耗战技点」
#   ——战技点消耗代扣通道缺，before_consume 仅覆盖 custom_resources 自耗）与 E2 消耗
#   爆点暴伤件（同挂）/ E1 阿哈时刻结束 +5 笑点、E2 阿哈时刻额外回合 +2 爆点（阿哈
#   时刻起止机制未实装）/ E6 笑点驱动追加段数（同 #1 动态段数挡因）/ 秘技拉黑 10 秒
#   （秒级 duration=回合数内建键 + 无法探测语义通道缺）/ 150120 削韧（tbgd [5,20,0]
#   ÷3 非整数——欢愉技削韧口径待实测，保守 0）/ 好活当赏来源（官方体系归阿哈时刻
#   授予——未实装；本版按直播态同域推定挂 150102，B19 候选待实测）/
#   150102 params #2..#5=[28,3,7,4] 官方文本未引用（隐藏参数，语义待实测）。
