#   是否含额外档待实测）；E2 消耗爆点暴伤件仍待收（抵扣代扣通道缺）。
#   ⓹ 欢愉度四件收编——行迹 +0.28 trace_stat_effects elation 键（5 节点
#   ElationDamageAddedRatioBase 聚合，映射终审勿 elation_dmg_boost）/ 1501101 ATK 转化
#  （常驻件 stat_exprs：0.05×min(16, max(0,($self.atk-2000)//100))——火花实战 ATK
