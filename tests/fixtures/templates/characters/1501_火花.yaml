custom_resources:
  #（punchline 声明退役——笑点=队伍账引擎原生 state.punchline（B40 P1b/P2b，21_elation
  # §21.7；res_punchline 读通道 _res_ns 恒定义）；1501103 暴伤/E1 抗穿的 min(...,10) 封顶
  # 为官方文本字面值（80%/8%、15%/1.5%），与声明无关——不随摘）
  thrill:
    name: "爆点"       # Thrill（可抵扣火花战技点消耗——抵扣通道待收，本版只收授予/计数）
    max: 10          # 官方未明示上限——保守默认，待实测
  banger_turns:
    name: "好活当赏回合数档"
    max: 99
    current: 2          # spec 固定 2 回合（缺省档——爻光行迹 +1 族覆写先例；本角色无延时件）
  _live:
    max: 1           # 直播态闩（150102 开播置 1 / 150108 结算置 0）
  _engagement:
    max: 20          # 互动陷阱本次直播内发动计数（param(150102,1)=20 上限；150102 开播复位）

# 秘技 150107 流量变现：使区域内敌人【拉黑】10 秒（无法发现我方——避战）；
# 秒级 duration 通道缺 → 待收；主动攻击被拉黑敌人进战后全体 50% ATK 火伤 + 回 2 战技点
techniques:
  - technique_id: "150107"
    name: "流量变现"
    point_cost: 1
    effects:                                # 进战一次性（施放者=火花）
      - effect_type: "deal_damage"          # #2：全体敌人 50% ATK 火伤（lv 单档 #2=0.5）
        name: "流量变现"
        target: "all_enemies"
        damage_type: "fire"
        amount: "0.5 * $self.atk"
        toughness_dmg: 0
      - effect_type: "gain_skill_point"     # #1：为我方恢复 2 点战技点
        amount: 2
    # 待收：「拉黑」10 秒（duration 内建键=回合数，不支持秒——避战/无法发现语义无通道）

actions:
  - action_id: "150101"
    name: "哑火了吗"
    action_type: "basic"
    target_type: "single"
    damage_type: "fire"
    available_if: "res__live < 1"          # 直播态中普攻被替换为 150108（官方 150102 desc）
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    toughness_dmg: 10                       # tbgd stance [30,0,0]÷3=10（mys 单攻 10 一致）
    skill_point_gain: 1                     # tbgd：产 1 点
    energy_gain: 20                         # tbgd：回能 20

  - action_id: "150102"
    name: "尖叫！火花花连线中"
    action_type: "skill"
    target_type: "self"
    damage_type: "fire"
    available_if: "res__live < 1"          # 开播一次（直播态内再施放走 150109）
    skill_point_cost: 1                     # tbgd BPNeed sp_cost=1 权威（mys 无耗点标为对轴冲突，以 tbgd 为准）
    energy_gain: 0                          # tbgd：回能 0
    # 备注①：「施放本技能不视为使用战技」——不计入「使用战技」相关计数/遗器光锥触发
    #（触发域排除通道缺，在案；本 action_type 保持 skill 仅为槽位归类）
    # 备注②：开启直播态：普攻替换为 150108（available_if 互斥）+ 发动 1 次【互动陷阱】
    #（=150109，EN "Engagement Farming" 本体）——免费那次的效果随 150109 随机礼物同待收；
    # 本次技能内互动陷阱最多发动 param(150102,1)=20 次 → _engagement 计数 + 150109 闸（已收）

  - action_id: "150103"
    name: "万我狂欢，镜头不要停"
    action_type: "ultimate"
    target_type: "aoe"
    damage_type: "fire"
    energy_cost: 160                        # 常规能量满开大（官方 + mys「能量160」）
    scaling: [{"atk": 0.3}, {"atk": 0.32}, {"atk": 0.34}, {"atk": 0.36}, {"atk": 0.38},
              {"atk": 0.4}, {"atk": 0.425}, {"atk": 0.45}, {"atk": 0.475}, {"atk": 0.5},
              {"atk": 0.52}, {"atk": 0.54}, {"atk": 0.56}, {"atk": 0.58}, {"atk": 0.6}]
    # 伤害 =（#3=0.6×欢愉度 + #2 随档）×ATK——本块只收 #2 ATK 段（静态档）；#3 欢愉度动态段
    # 走 on_ultimate 钩（B40 ⓹——$self.elation 面板现场求值，与该段同面板口径：获得笑点前）
    toughness_dmg: 20                       # tbgd stance [0,60,0]÷3=20（mys 20 一致）
    skill_point_gain: 0
    energy_gain: 5                          # tbgd：回能 5（使用后返能）

  - action_id: "150108"
    name: "百花齐放，胜者独享！"
    action_type: "basic"
    target_type: "blast"
    damage_type: "fire"
    available_if: "res__live >= 1"         # 仅直播态内作为普攻施放（150102 替换半）
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    scaling_blast: [{"atk": 0.25}, {"atk": 0.3}, {"atk": 0.35}, {"atk": 0.4}, {"atk": 0.45},
                    {"atk": 0.5}, {"atk": 0.55}, {"atk": 0.6}, {"atk": 0.65}, {"atk": 0.7}]
    toughness_dmg: 10                       # tbgd stance [30,0,15]÷3=主 10（mys「30+15×2」为原始单位未换算标签）
    toughness_dmg_blast: 5                  # 同上 ÷3=邻 5
    skill_point_gain: 1                     # tbgd：产 1 点
    energy_gain: 40                         # tbgd：回能 40
    # 官方 desc「结算直播连线结果」——使用本技后结束直播态（hook 置 _live=0）

  - action_id: "150109"
    name: "互动陷阱"
    action_type: "skill"
    target_type: "self"
    damage_type: "fire"
    available_if: "res__live >= 1 && res__engagement < param(150102, 1)"   # 直播态内可重复发动，本次技能内 ≤20 次（官方 150102 desc）
    skill_point_cost: 1                     # tbgd sp_cost=1 权威
    energy_gain: 0                          # tbgd：回能 0
    # 备注①：「施放本技能不视为使用战技」同 150102——不计入使用战技（触发域通道缺，在案）
    # 备注②：待收：随机礼物二选一（红红火火=笑点 param #3=2 + 战技点 #1=2 / 恍恍惚惚=笑点
    # #2=1）——chance 需 rng、expected 无随机源，随机分支通道缺（战技点授予通道本身在案，
    # 随手分支同挂）
    # 备注③：待收：#4 主目标倍率 +20%、#5 相邻 +10%——scaling 覆写通道缺 + 持续域
    #（当次/常驻/叠层）官方未明示待实测，实测后按追加 deal_damage 段等值承载

  - action_id: "150110"
    name: "百花齐放，胜者独享！"
    action_type: "basic"
    target_type: "blast"
    damage_type: "fire"
    available_if: "1 < 0"                   # 150108 内部重复/多源变体（同名同参、desc 空）——区分度
                                            # 待实测，恒不可用保单施放通道（金样闸要求块在册；实测确认独立通道后解除）
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    scaling_blast: [{"atk": 0.25}, {"atk": 0.3}, {"atk": 0.35}, {"atk": 0.4}, {"atk": 0.45},
                    {"atk": 0.5}, {"atk": 0.55}, {"atk": 0.6}, {"atk": 0.65}, {"atk": 0.7}]
    toughness_dmg: 10
    toughness_dmg_blast: 5
    skill_point_gain: 1
    energy_gain: 40

  - action_id: "150120"
    name: "信号溢出：好戏返场！"
    action_type: "elation_skill"            # 欢愉技（B40 ⓵ 正身——枚举入闸；合法行动集引擎排除，
                                            # 阿哈时刻/代放两通道驱动，旧「归 skill 类+开放施放」占位退役）
    target_type: "aoe"
    damage_type: "fire"
    level_key: "elation_skill"              # 取档键（勘正⑨：缺省按 skill 档会被 E3 战技+2 误抬；
                                            # skill_levels 无此键时回落 ultimate=10 与欢愉技基础档同值自洽，E3/E5 slo 同键对接）
    scaling: [{"elation": 0.25}, {"elation": 0.275}, {"elation": 0.3}, {"elation": 0.325},
              {"elation": 0.35}, {"elation": 0.375}, {"elation": 0.4062}, {"elation": 0.4375},
              {"elation": 0.4688}, {"elation": 0.5}, {"elation": 0.525}, {"elation": 0.55},
              {"elation": 0.575}, {"elation": 0.6}, {"elation": 0.625}]
    # 15 档全表照抄 #2 全体倍率（lv10=index 9=0.5）——action elation 行键单承（纯倍率×等级
    # 系数 7535.107 路由——ATK 占位退役，B40 ⓵）；追加 20 段随机单体 #1（lv10=0.25）见 hooks
    toughness_dmg: 0                        # 待实测（tbgd stance [5,20,0]÷3 非整数——欢愉技削韧口径未明，保守 0）
    skill_point_cost: 0                     # tbgd：本次施放不耗点
    energy_gain: 5                          # tbgd：回能 5（官方 desc 未明示——待实测）

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN；名字照 character_ranks cn（EN 名在注）
eidolons:
  E1:
    name: "#全网热搜：她是谁？"   # EN "#GoingViral #WhoIsShe"
    hooks:
      # 「当前每拥有 1 个笑点，使我方全体全属性抗性穿透提高 1.5%，最多提高 15%」——常驻件
      #（与阿哈时刻无关，勘正⑤）：1501103 同构 on_resource_gain 重挂 replace 烘焙
      - event: "on_resource_gain"
        condition: "$event.actor == '1501' && $event.resource_id == 'punchline'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "SPARXIE_E1_RESPEN"
              name: "#全网热搜：她是谁？"
              modifier_type: "buff"
              duration: 0
              effect_scope: "team"
              stack_mode: "replace"
              dispellable: False
              stat_effects: {"res_pen": "0.015 * min(res_punchline, 10)"}
      # 「阿哈时刻结束时获得 5 个笑点」（B40 ⓺ 收编——aha_instant_end 事件词表在案：
      # 引擎清池后发射 → +5 落清后池；extra 额外阿哈时刻同发射=官方「阿哈时刻结束时」
      # 字面口径，是否含额外档待实测）
      - event: "aha_instant_end"
        effects:
          - effect_type: "gain_resource"
            resource_id: "punchline"
            amount: 5
    notes: []
  E2:
    name: "#观众的眼睛是雪亮的"   # EN "#AudienceKnows"
    hooks:
      # 「阿哈时刻结束时使火花获得 1 个额外回合和 2 个爆点」（B40 ⓺ 收编——aha_instant_end
      # 事件词表 + grant_extra_turn 原语（1310 先例）双在案；额外阿哈时刻同发射，待实测同 E1）
      - event: "aha_instant_end"
        effects:
          - effect_type: "grant_extra_turn"
          - effect_type: "gain_resource"
            resource_id: "thrill"
            amount: 2
    notes:
      - "待收：「每消耗 1 个爆点使自身暴击伤害提高 10%，持续 2 回合，最多叠加 4 层」——挡因：爆点抵扣战技点的代扣通道缺（消耗事件不发生——before_consume 仅覆盖 custom_resources 自耗语义）"
  E3:
    name: "#请点击：心跳超链接"   # EN "#LinkUp #HeartSkip"
    skill_level_overrides: {"skill": 2, "basic": 1, "elation_skill": 1}   # 战技+2（≤15）、普攻+1（≤10）、欢愉技+1（≤15）
    notes:
      - "普攻+1：默认 lv6 → lv7（10 档表 index 6；勘正⑫——draft 注文「实取 lv11」幻视）"
      - "战技+2：150102/150109 无 scaling（enhance 类），随档段仅 150109 #4/#5 倍率（待收件）；欢愉技+1：150120 scaling 实取 lv11 档 + param(150120,1/2) 随档（level_key elation_skill 对接）"
  E4:
    name: "#硬控！顶级表情管理"   # EN "#LockedIn #FaceCard"
    hooks:
      # 施放终结技时额外获得 5 个笑点（官方文本字面值）+ 自身欢愉度 +36% 持续 3 回合
      #（B40 ⓹ 收编——modifier stat_effects elation 面板通道；星魂钩在模板钩之后发射=
      # 本发终结技 #3 欢愉度段与天赋附伤均不吃，下次起吃——官方时序待实测；
      # 可驱散性官方未明，按 buff 常规可驱散待实测）
      - event: "on_ultimate"
        condition: "$event.source == '1501'"
        effects:
          - effect_type: "gain_resource"
            resource_id: "punchline"
            amount: 5
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "SPARXIE_E4_ELATION"
              name: "#硬控！顶级表情管理"
              modifier_type: "buff"
              duration: 3
              dispellable: True
              stat_effects: {"elation": 0.36}
    notes: []
  E5:
    name: "#世界破烂，小花缝补"   # EN "#HealingTheWorld #GoodVibesOnly"
    skill_level_overrides: {"ultimate": 2, "talent": 2, "elation_skill": 1}   # 终结技+2（≤15）、天赋+2（≤15）、欢愉技+1（≤15）
    notes:
      - "终结技+2：scaling 实取 lv12 档（ATK 段 index 11=0.54）；欢愉度段 #3 全档恒 0.6 不随档（param(150103,3) 常量——钩 amount 实取不变）"
      - "天赋+2：附伤各段 param(150104,1/2/3/4) 随档实取 lv12（index 11——终结技全体 0.528/强化普攻主 0.44）；欢愉技+1：150120 实取 lv12 档"
  E6:
    name: "#锵锵，即将绝版的我"   # EN "#BuiltDifferent #GoingExtinct"
    stat_effects: {"res_pen": 0.2}          # 全属性抗性穿透提高 20%（官方文本字面值）
    hooks: []
    notes:
      - "待收：欢愉技（150120）每计入 1 个笑点使额外伤害次数 +1，最多增加至 40 次（勘正⑥——官方上限=总段数 40，非 draft 注「+40→60」；基础 20 段 + 笑点 ≤10 → 现实域 ≤30）——挡因：动态段数无循环原语（every_n/循环糖键未接线），同天赋 #1 挡因"

hooks:
  # 资源初始化（内部闩/计数读前必写——res_ 平铺未定义变量实证教训）
  - event: "on_battle_start"
    effects:
      - effect_type: "set_resource"
        resource_id: "_live"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_engagement"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "thrill"
        amount: 0
      #（punchline 零初始化摘除——笑点队伍账归引擎原生（B40 P1b/P2b _init_aha 进战 +1/名
      # 统发），本写会把池清回 0 吃掉原生发放；res_punchline 读通道由 engine._res_ns 恒定义）
      # 大行迹 1501103「沸腾！真伪调色盘」：每持有 1 个笑点 → 我方全体暴伤 +8%（#1），
      # 最大 +80%（#2，=10 点封顶）——挂火花 team 光环（进战池 1 → 初挂烘焙 0.08，replace 口径统一）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SPARXIE_PALETTE_CRITDMG"
          name: "Frenzy! Palette of Truth and Lies"
          modifier_type: "buff"
          duration: 0
          effect_scope: "team"
          stack_mode: "replace"
          dispellable: False
          stat_effects: {"crit_dmg": "0.08 * min(res_punchline, 10)"}
      # 大行迹 1501101「甜蜜！笑点签售会」：ATK 超 2000 后每 100 点 → 欢愉度 +5%，上限 +80%
      #（B40 ⓹ 收编——elation 面板通道；常驻件 stat_exprs 现场求值（$self.atk=无条件件
      # 面板——装备/光环全吃进；// 整除向下取整=params「每 100 点」语义；火花裸装 ATK
      # 640<2000 → +0，堆装/光环过线后按档给）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TRACE_1501101"
          name: "Sweet! Punchline Signing"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            elation: "0.05 * min(16, max(0, ($self.atk - 2000) // 100))"

  # 150102 开播：进入直播态（_live=1）+ 互动陷阱计数复位（本次技能内 ≤20 容器）
  #（好活当赏推定挂退役——B40 ⓶：官方体系归阿哈时刻授予（引擎 _run_aha_turn 原生
  # 授值=消耗池）+ 进战 §8.1 统发 20（_init_aha），draft「直播态同域推定挂 150102」
  # B19 候选随真源落地摘除防双发；火花是否另有自体好活当赏来源仍待实测在案）
  - event: "on_action"
    condition: "$event.actor == '1501' && $event.action_id == '150102' && !$event.insert"
    effects:
      - effect_type: "set_resource"
        resource_id: "_live"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_engagement"
        amount: 0

  # 互动陷阱发动计数（「本次技能内……最多发动 #1[i] 次」——_engagement 容器上限 20；
  # 150102 免费发动的 1 次是否计入官方未明示，本版只数手动施放——待实测）
  - event: "on_action"
    condition: "$event.actor == '1501' && $event.action_id == '150109' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_engagement"
        amount: 1

  # 150108 结算直播连线结果：结束直播态（官方 desc；150110 重名变体同挂——恒不可用，防御）
  - event: "on_action"
    condition: "$event.actor == '1501' && ($event.action_id == '150108' || $event.action_id == '150110') && !$event.insert"
    effects:
      - effect_type: "set_resource"
        resource_id: "_live"
        amount: 0

  # 天赋 150104·强化普攻附伤（持有好活当赏时生效）：主目标 40% 火属性欢愉伤害（#3；
  # B40 ⓷ 真路由——category "elation" + amount 纯倍率 + punchline_source 缺省定槽
  #=持有者好活当赏合并值，21_elation §21.2；门控 has_modifier → resource_of——
  # emit 快照 condition 读事件开始旧值，族谱#9）——主目标段 target $event.target 通道；
  # 相邻 20%（#4）与互动陷阱追加段（#1）待收（挡因见头注）；
  # 削韧 5（tbgd÷3）摘除——category elation 与 toughness_dmg 编译互斥（欢愉段削韧
  # 无通道=引擎缺口在案，见头注迁移记⓷）
  - event: "on_action"
    condition: "$event.actor == '1501' && ($event.action_id == '150108' || $event.action_id == '150110') && !$event.insert && resource_of('1501', 'certified_banger') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "幕后花手"
        category: "elation"
        target: "$event.target"
        damage_type: "fire"
        amount: "param(150104, 3)"

  # 150103 终结技·#3 欢愉度段：（#3=0.6×欢愉度 + #2%）×ATK 全体的动态项（B40 ⓹ 收编——
  # $self.elation 面板现场求值；普通火直伤非欢愉伤害，官方文本 "Fire DMG" 对照天赋
  # "Fire Elation DMG" 措辞分野在案）；钩序在天赋附伤/获得笑点钩之前=与 action 层 #2 段
  # 同面板口径（官方「先获得笑点再结算」序对 action 段本无观察通道——两段同口径优先）
  - event: "on_ultimate"
    condition: "$event.source == '1501' && $event.action == '150103'"
    effects:
      - effect_type: "deal_damage"
        name: "万我狂欢，镜头不要停·欢愉度段"
        target: "all_enemies"
        damage_type: "fire"
        amount: "param(150103, 3) * $self.elation * $self.atk"

  # 天赋 150104·终结技附伤：全体敌人 48% 火属性欢愉伤害（lv10 #2）——勘正②：好活当赏门
  #（CN「火花持有【好活当赏】时：」冒号统摄强化普攻/终结技两子句）；B40 ⓷ 真路由同强普半
  #（category elation + 缺省定槽；削韧 5 随互斥闸摘除——引擎缺口在案）
  - event: "on_ultimate"
    condition: "$event.source == '1501' && $event.action == '150103' && resource_of('1501', 'certified_banger') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "幕后花手"
        category: "elation"
        target: "all_enemies"
        damage_type: "fire"
        amount: "param(150104, 2)"

  # 大行迹 1501102「炫目！人设万花筒」：施放终结技时按队伍欢愉角色数 1/2/≥3
  # 额外获得笑点 2/4/8（#1/#2/#3）+ 爆点 1/1/4（#4/#5/#6）
  - event: "on_ultimate"
    condition: "$event.source == '1501' && count_team('elation') == 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: 2
      - effect_type: "gain_resource"
        resource_id: "thrill"
        amount: 1
  - event: "on_ultimate"
    condition: "$event.source == '1501' && count_team('elation') == 2"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: 4
      - effect_type: "gain_resource"
        resource_id: "thrill"
        amount: 1
  - event: "on_ultimate"
    condition: "$event.source == '1501' && count_team('elation') >= 3"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: 8
      - effect_type: "gain_resource"
        resource_id: "thrill"
        amount: 4

  # 150103 终结技本体：获得 2 个笑点（#1）——伤害段在 action scaling（#2 ATK 段）+
  # 前置 on_ultimate 钩（#3 欢愉度动态段，B40 ⓹）；钩序纪律=伤害钩在先获得钩在后
  #（8009 文本序实证——段读获得笑点前面板，与 action 层同口径）
  - event: "on_ultimate"
    condition: "$event.source == '1501' && $event.action == '150103'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: "param(150103, 1)"

  # 大行迹 1501103：笑点变化重算全队暴伤光环（replace 覆写重烘——1407 荒芜增伤同构；
  # gain 后事件，res_punchline 读新值）
  - event: "on_resource_gain"
    condition: "$event.actor == '1501' && $event.resource_id == 'punchline'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SPARXIE_PALETTE_CRITDMG"
          name: "Frenzy! Palette of Truth and Lies"
          modifier_type: "buff"
          duration: 0
          effect_scope: "team"
          stack_mode: "replace"
          dispellable: False
          stat_effects: {"crit_dmg": "0.08 * min(res_punchline, 10)"}

  # 150120 欢愉技：追加 20 段随机单体 25% 火属性欢愉伤害（lv10 #1=0.25；lv10 #3=20 段——
  # 目标代数 mode random ×20 逐段照抄，expected 确定化按序取首 B22；全体主段 #2 由 action
  # scaling elation 行键单承，勘正①）；B40 ⓵ 真路由——category "elation" + amount 纯倍率
  # + punchline_source "res_punchline"（欢愉技=阿哈笑点池实时值，21_elation §21.2 定槽；
  # 终结技代放/额外阿哈经 _aha_pool_override 覆写锚）+ action_type "elation_skill" 声明槽
  #（on_hp_decrease 伪行动类别正身）；insert 闩摘除——阿哈时刻代放（trigger_action
  # insert=True）同发射（8009 迁移记⓵同案——旧闩会吃掉代放的全部 20 段）；
  # E6 追加段（每笑点 +1 段，总段数上限 40）待收（动态段数挡因）
