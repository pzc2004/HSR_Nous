    toughness_dmg_blast: 5                  # 同上 ÷3=邻 5
    skill_point_gain: 1                     # tbgd：产 1 点
    energy_gain: 40                         # tbgd：回能 40
    # 官方 desc「结算直播连线结果」——使用本技后结束直播态（hook 置 _live=0）

  - action_id: "150109"
    name: "互动陷阱"
    action_type: "skill"
    target_type: "self"
    damage_type: "fire"
    available_if: "res__live >= 1 && res__engagement < param(150102, 1)"   # 直播态内可重复发动，本次技能内 ≤20 次（官方 150102 desc）
    skill_point_cost: 1                     # tbgd sp_cost=1 权威
    energy_gain: 0                          # tbgd：回能 0
    # 备注①：「施放本技能不视为使用战技」同 150102——不计入使用战技（触发域通道缺，在案）
    # 备注②：待收：随机礼物二选一（红红火火=笑点 param #3=2 + 战技点 #1=2 / 恍恍惚惚=笑点
    # #2=1）——chance 需 rng、expected 无随机源，随机分支通道缺（战技点授予通道本身在案，
    # 随手分支同挂）
    # 备注③：待收：#4 主目标倍率 +20%、#5 相邻 +10%——scaling 覆写通道缺 + 持续域
    #（当次/常驻/叠层）官方未明示待实测，实测后按追加 deal_damage 段等值承载

  - action_id: "150110"
    name: "百花齐放，胜者独享！"
    action_type: "basic"
    target_type: "blast"
    damage_type: "fire"
    available_if: "1 < 0"                   # 150108 内部重复/多源变体（同名同参、desc 空）——区分度
                                            # 待实测，恒不可用保单施放通道（金样闸要求块在册；实测确认独立通道后解除）
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    scaling_blast: [{"atk": 0.25}, {"atk": 0.3}, {"atk": 0.35}, {"atk": 0.4}, {"atk": 0.45},
                    {"atk": 0.5}, {"atk": 0.55}, {"atk": 0.6}, {"atk": 0.65}, {"atk": 0.7}]
    toughness_dmg: 10
    toughness_dmg_blast: 5
    skill_point_gain: 1
    energy_gain: 40

  - action_id: "150120"
    name: "信号溢出：好戏返场！"
    action_type: "skill"                    # 欢愉技专属槽（action_type 词表无欢愉键——归 skill 类，
                                            # 槽位语义待实测；欢愉技施放模型随阿哈时刻体系待收，本版开放）
    target_type: "aoe"
    damage_type: "fire"
    level_key: "elation_skill"              # 取档键（勘正⑨：缺省按 skill 档会被 E3 战技+2 误抬；
                                            # skill_levels 无此键时回落 ultimate=10 与欢愉技基础档同值自洽，E3/E5 slo 同键对接）
    available_if: "true"                    # 乐命点/赛点解锁模型待实测——本版开放
    scaling: [{"atk": 0.25}, {"atk": 0.275}, {"atk": 0.3}, {"atk": 0.325}, {"atk": 0.35},
              {"atk": 0.375}, {"atk": 0.4062}, {"atk": 0.4375}, {"atk": 0.4688}, {"atk": 0.5},
              {"atk": 0.525}, {"atk": 0.55}, {"atk": 0.575}, {"atk": 0.6}, {"atk": 0.625}]
    # 全体主段 #2（lv10=index 9=0.5）由本 scaling 单承；追加 20 段随机单体 #1（lv10=0.25）
    # 见 hooks 逐段照抄（勘正①：hook 全体段已删——重复结算双倍伤）
    toughness_dmg: 0                        # 待实测（tbgd stance [5,20,0]÷3 非整数——欢愉技削韧口径未明，保守 0）
    skill_point_cost: 0                     # tbgd：本次施放不耗点
    energy_gain: 5                          # tbgd：回能 5（官方 desc 未明示——待实测）

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN；名字照 character_ranks cn（EN 名在注）
eidolons:
  E1:
    name: "#全网热搜：她是谁？"   # EN "#GoingViral #WhoIsShe"
    hooks:
      # 「当前每拥有 1 个笑点，使我方全体全属性抗性穿透提高 1.5%，最多提高 15%」——常驻件
      #（与阿哈时刻无关，勘正⑤）：1501103 同构 on_resource_gain 重挂 replace 烘焙
      - event: "on_resource_gain"
        condition: "$event.actor == '1501' && $event.resource_id == 'punchline'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "SPARXIE_E1_RESPEN"
              name: "#全网热搜：她是谁？"
              modifier_type: "buff"
              duration: 0
              effect_scope: "team"
              stack_mode: "replace"
              dispellable: False
              stat_effects: {"res_pen": "0.015 * min(res_punchline, 10)"}
    notes:
      - "待收：「阿哈时刻结束时获得 5 个笑点」——挡因：阿哈时刻起止机制未实装（21_elation 章首注，触发/结束事件源缺）"
  E2:
    name: "#观众的眼睛是雪亮的"   # EN "#AudienceKnows"
    hooks: []
    notes:
      - "待收：①「阿哈时刻结束时使火花获得 1 个额外回合和 2 个爆点」——挡因：阿哈时刻起止机制未实装（grant_extra_turn 原语在案，缺触发源）；②「每消耗 1 个爆点使自身暴击伤害提高 10%，持续 2 回合，最多叠加 4 层」——挡因：爆点抵扣战技点的代扣通道缺（消耗事件不发生——before_consume 仅覆盖 custom_resources 自耗语义）"
  E3:
    name: "#请点击：心跳超链接"   # EN "#LinkUp #HeartSkip"
    skill_level_overrides: {"skill": 2, "basic": 1, "elation_skill": 1}   # 战技+2（≤15）、普攻+1（≤10）、欢愉技+1（≤15）
    notes:
      - "普攻+1：默认 lv6 → lv7（10 档表 index 6；勘正⑫——draft 注文「实取 lv11」幻视）"
      - "战技+2：150102/150109 无 scaling（enhance 类），随档段仅 150109 #4/#5 倍率（待收件）；欢愉技+1：150120 scaling 实取 lv11 档 + param(150120,1/2) 随档（level_key elation_skill 对接）"
  E4:
    name: "#硬控！顶级表情管理"   # EN "#LockedIn #FaceCard"
    hooks:
      # 施放终结技时额外获得 5 个笑点（官方文本字面值）
      - event: "on_ultimate"
        condition: "$event.source == '1501'"
        effects:
          - effect_type: "gain_resource"
            resource_id: "punchline"
            amount: 5
    notes:
      - "待收：使自身欢愉度提高 36%，持续 3 回合——挡因：欢愉度面板属性未实装（同 1501101 挡因）"
  E5:
    name: "#世界破烂，小花缝补"   # EN "#HealingTheWorld #GoodVibesOnly"
    skill_level_overrides: {"ultimate": 2, "talent": 2, "elation_skill": 1}   # 终结技+2（≤15）、天赋+2（≤15）、欢愉技+1（≤15）
    notes:
      - "终结技+2：scaling 实取 lv12 档（ATK 段 index 11=0.54）；欢愉度段 #3 常量待收"
      - "天赋+2：附伤各段 param(150104,1/2/3/4) 随档实取 lv12（index 11）；欢愉技+1：150120 实取 lv12 档"
  E6:
    name: "#锵锵，即将绝版的我"   # EN "#BuiltDifferent #GoingExtinct"
    stat_effects: {"res_pen": 0.2}          # 全属性抗性穿透提高 20%（官方文本字面值）
    hooks: []
    notes:
      - "待收：欢愉技（150120）每计入 1 个笑点使额外伤害次数 +1，最多增加至 40 次（勘正⑥——官方上限=总段数 40，非 draft 注「+40→60」；基础 20 段 + 笑点 ≤10 → 现实域 ≤30）——挡因：动态段数无循环原语（every_n/循环糖键未接线），同天赋 #1 挡因"

hooks:
  # 资源初始化（内部闩/计数读前必写——res_ 平铺未定义变量实证教训）
  - event: "on_battle_start"
    effects:
      - effect_type: "set_resource"
        resource_id: "_live"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_engagement"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "punchline"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "thrill"
        amount: 0
      # 大行迹 1501103「沸腾！真伪调色盘」：每持有 1 个笑点 → 我方全体暴伤 +8%（#1），
      # 最大 +80%（#2，=10 点封顶）——挂火花 team 光环（初挂 0 值占位，replace 口径统一）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SPARXIE_PALETTE_CRITDMG"
          name: "Frenzy! Palette of Truth and Lies"
          modifier_type: "buff"
          duration: 0
          effect_scope: "team"
          stack_mode: "replace"
          dispellable: False
          stat_effects: {"crit_dmg": "0.08 * min(res_punchline, 10)"}

  # 150102 开播：进入直播态（_live=1）+ 互动陷阱计数复位（本次技能内 ≤20 容器）
  # 好活当赏（天赋生效条件）：官方体系归阿哈时刻授予（21_elation）——未实装，按与直播态
  # 同域推定挂此（B19 候选待实测）
  - event: "on_action"
    condition: "$event.actor == '1501' && $event.action_id == '150102' && !$event.insert"
    effects:
      - effect_type: "set_resource"
        resource_id: "_live"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_engagement"
        amount: 0
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CERTIFIED_BANGER"
          name: "好活当赏"
          modifier_type: "buff"
          duration: 0
          dispellable: False

  # 互动陷阱发动计数（「本次技能内……最多发动 #1[i] 次」——_engagement 容器上限 20；
  # 150102 免费发动的 1 次是否计入官方未明示，本版只数手动施放——待实测）
  - event: "on_action"
    condition: "$event.actor == '1501' && $event.action_id == '150109' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_engagement"
        amount: 1

  # 150108 结算直播连线结果：结束直播态（官方 desc；150110 重名变体同挂——恒不可用，防御）
  - event: "on_action"
    condition: "$event.actor == '1501' && ($event.action_id == '150108' || $event.action_id == '150110') && !$event.insert"
    effects:
      - effect_type: "set_resource"
        resource_id: "_live"
        amount: 0

  # 天赋 150104·强化普攻附伤（持有好活当赏时生效）：主目标 40% 火伤（#3，欢愉伤害按火
  # 直伤近似——类别差异在案）——主目标段 target $event.target 通道；
  # 相邻 20%（#4）与互动陷阱追加段（#1）待收（挡因见头注）
  - event: "on_action"
    condition: "$event.actor == '1501' && ($event.action_id == '150108' || $event.action_id == '150110') && !$event.insert && has_modifier($self, 'CERTIFIED_BANGER') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "幕后花手"
        target: "$event.target"
        damage_type: "fire"
        amount: "param(150104, 3) * $self.atk"
        toughness_dmg: 5                     # tbgd stance [15,0,0]÷3=5（mys 天赋 5 一致；作用域按单段，待实测）

  # 天赋 150104·终结技附伤：全体敌人 48% 火伤（lv10 #2）——勘正②：补好活当赏门
  #（CN「火花持有【好活当赏】时：」冒号统摄强化普攻/终结技两子句）
  - event: "on_ultimate"
    condition: "$event.source == '1501' && $event.action == '150103' && has_modifier($self, 'CERTIFIED_BANGER') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "幕后花手"
        target: "all_enemies"
        damage_type: "fire"
        amount: "param(150104, 2) * $self.atk"
        toughness_dmg: 5                     # tbgd [15,0,0]÷3=5（全体作用域 tbgd 未拆分，按单值各目标，待实测）

  # 大行迹 1501102「炫目！人设万花筒」：施放终结技时按队伍欢愉角色数 1/2/≥3
  # 额外获得笑点 2/4/8（#1/#2/#3）+ 爆点 1/1/4（#4/#5/#6）
  - event: "on_ultimate"
    condition: "$event.source == '1501' && count_team('elation') == 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: 2
      - effect_type: "gain_resource"
        resource_id: "thrill"
        amount: 1
  - event: "on_ultimate"
    condition: "$event.source == '1501' && count_team('elation') == 2"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: 4
      - effect_type: "gain_resource"
        resource_id: "thrill"
        amount: 1
  - event: "on_ultimate"
    condition: "$event.source == '1501' && count_team('elation') >= 3"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: 8
      - effect_type: "gain_resource"
        resource_id: "thrill"
        amount: 4

  # 150103 终结技本体：获得 2 个笑点（#1）——伤害段在 action scaling（ATK 段）；
  # 欢愉度段 0.6×欢愉度待收（欢愉度面板未实装）
  - event: "on_ultimate"
    condition: "$event.source == '1501' && $event.action == '150103'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: "param(150103, 1)"

  # 大行迹 1501103：笑点变化重算全队暴伤光环（replace 覆写重烘——1407 荒芜增伤同构；
  # gain 后事件，res_punchline 读新值）
  - event: "on_resource_gain"
    condition: "$event.actor == '1501' && $event.resource_id == 'punchline'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SPARXIE_PALETTE_CRITDMG"
          name: "Frenzy! Palette of Truth and Lies"
          modifier_type: "buff"
          duration: 0
          effect_scope: "team"
          stack_mode: "replace"
          dispellable: False
