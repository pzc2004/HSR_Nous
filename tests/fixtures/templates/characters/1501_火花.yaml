# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging 1501_火花.yaml）+ 过堂勘正（staging→fixtures 合并流水线）。
#   官方对照：StarRailRes index_new cn/en（技能/星魂/行迹原文 + params 逐行）、tbgd
#   AvatarSkillConfig（SP 耗产/回能/ShowStanceList——显示削韧=raw÷3，遐蝶 [60,0,30]↔mys 20
#   实证换算率）、米游社开拓者笔记五项标签。欢愉（Elation）新命途首模板。
#
# 收录：直播态换技能（150101↔150108 available_if 互斥 + _live 闩，150108 结算下播）/
#   好活当赏天赋附伤（强化普攻主段 #3=40%；终结技全体 #2=48%——两子句同吃好活当赏门，
#   CN「持有【好活当赏】时：」冒号统摄；B40 后=火属性欢愉伤害真路由）/ 笑点经济（终结技
#   +2、大行迹 1501102 按队伍欢愉角色数 1/2/≥3 → +2/4/8 笑点 +1/1/4 爆点、E4 开大再 +5）
#   / 1501103 每笑点全队暴伤 +8% 上限 80%（on_resource_gain 重挂 replace 烘焙，1407 荒芜
#   同构）/ E1 每笑点全体抗穿 +1.5% 上限 15%（同构光环——「当前每拥有」为常驻件，与阿哈
#   时刻无关）+ E1 阿哈时刻结束 +5 笑点 / E2 阿哈时刻结束额外回合 +2 爆点 /
#   互动陷阱发动计数（_engagement 容器上限 20=param(150102,1)；150109 available_if
#    gated——「本次技能内最多发动 20 次」；150102 免费发动那次是否计入待实测）/
#   欢愉技 150120（全体 #2=50% + 20 段随机单体 #1=25% 逐段照抄——expected 确定化按序
#   取首 B22；action_type/level_key: elation_skill 正身，E3/E5 slo 同键对接）/
#   行迹暴击率 +12%、暴伤 +13.3%、欢愉度 +28%（trace_stat_effects）/ 1501101 ATK 转化
#   欢愉度（stat_exprs 常驻件）/ E4 欢愉度 +36%·3 回合 / 150103 #3=0.6×欢愉度段
#   （on_ultimate 动态项）/ 秘技进战全体 50% 火伤 + 回 2 战技点（gain_skill_point 在案）/
#   E6 全属性抗穿 +20%。
# 勘正十二件：①150120 hook 全体主段与 action scaling 重复结算（双倍伤）→ 删 hook
#   全体段，action scaling 单承；②天赋终结技附伤钩漏好活当赏门 → 补 has_modifier
#   条件；③行迹 crit 数值节点漏收（draft trace_stat_effects 空）→ 收 crit_rate 0.12 /
#   crit_dmg 0.133；④「Engagement Farming」=【互动陷阱】150109 本体（EN 名直译差——
#   draft 误判为未知独立机制「触发挂点待实测」）→ 计数钩 + 20 次闸收编；⑤E1 抗穿半件
#   draft 随阿哈时刻整体待收 → 官方「当前每拥有」常驻可收，1501103 同构收编；
#   ⑥E6 注文误读「+40 → 60 段」→ 官方「最多增加至 40 次」=段数上限 40；⑦palette 初挂
#   缺 stack_mode（表达式烘焙件闸，1207 驭空案）→ 初挂/重挂统一 replace；⑧150110
#   available_if "false" 裸字面量（Name 运行期未定义 → B8 ⚠ 噪音）→ 良构 "1 < 0"；
#   ⑨150120 action 缺 level_key（归 skill 类会被 E3 战技+2 误抬 lv12 档）→ 补
#   level_key: "elation_skill"（E0 回落 ultimate=10 与欢愉技基础档同值自洽）；
#   ⑩秘技「恢复 #1[i]=2 战技点」draft 标「批量授予通道缺」→ gain_skill_point 在案
#   （花火溢出池先例）收编；⑪削韧 provenance 注过期（draft「mys 未拆分/冲突」——
#   tbgd÷3 全链对轴一致：基础普攻 30→10、强化普攻 [30,0,15]→主 10 邻 5、天赋 15→5、
#   终结技 60→20；mys「30+15×2」条为原始单位未换算标签）；⑫E3 注文普攻档幻视
#   （「实取 lv11」——普攻默认 lv6，E3+1 → lv7=index 6）。
# 待收（均带挡因）：
#   天赋 #1 互动陷阱追加段（每发动 1 次互动陷阱→强化普攻额外 1 段随机受击目标——hook
#   动态段数无循环原语 +「受到攻击的目标」池无目标代数）/ 天赋 #4 强化普攻相邻段
#   （hook 目标代数无「相邻于主目标」词表）/ 150109 随机礼物二选一（chance 需 rng、
#   expected 无随机源——分支通道缺；红红火火=笑点 2+战技点 2、恍恍惚惚=笑点 1，随手
#   分支同挂）与 #4/#5 倍率提高（scaling 覆写通道缺 + 持续域待实测）/ 爆点抵扣战技点
#   （「消耗爆点视为消耗战技点」——战技点消耗代扣通道缺，before_consume 仅覆盖
#   custom_resources 自耗）与 E2 消耗爆点暴伤件（同挂）/ E6 笑点驱动追加段数（同 #1
#   动态段数挡因）/ 秘技拉黑 10 秒（秒级 duration=回合数内建键 + 无法探测语义通道缺）/
#   150120 削韧（tbgd [5,20,0]÷3 非整数——欢愉技削韧口径待实测，保守 0）/ 欢愉段削韧
#   无通道=引擎缺口（天赋附伤 tbgd÷3=5 在案——category elation 与 toughness_dmg 编译
#   互斥强制摘除；action 层 150120 同未明，报修不修引擎）/ 火花自体好活当赏来源
#   （官方来源=进战 20+阿哈授予已全收；是否另有自体来源待实测）/ E1/E2 阿哈时刻结束
#   两件：额外阿哈时刻（爻光终结技族）是否同触发待实测（现按字面「阿哈时刻结束时」
#   同发射）/ E4 欢愉度件时序（本发终结技不吃——星魂钩晚模板钩，官方时序待实测）与
#   可驱散性（按 buff 常规可驱散，待实测）/ E1 阿哈结束 +5 与 1501103/E1 光环
#   min(...,10) 封顶的官方上限口径（10 为文本封顶值非池上限——池无上限，实测若池
#   可超 10 各处 min 不动）/ 150102 params #2..#5=[28,3,7,4] 官方文本未引用（隐藏
#   参数，语义待实测）。
#
# B40 迁移记（2026-09-15——欢愉体系基建落地后摘待收，头注旧待收「欢愉体系整体未实装」
# 整条兑现；试点 8009 迁移记同格式）：
#   ⓵ 欢愉技 150120 正身——action_type skill → elation_skill（枚举入闸；合法行动集
#   引擎排除（policy_api），阿哈时刻/代放两通道驱动；旧「归 skill 类 + available_if
#   "true" 开放施放」占位全摘——免费手动后门随枚举封闭）；scaling 行键 atk → elation
#   纯倍率（15 档数值不动——等级系数 7535.107 路由，ATK 占位退役）；20 段随机钩
#   amount×ATK → category "elation" + amount param(150120,1) 纯倍率 + punchline_source
#   "res_punchline"（欢愉技=阿哈笑点池实时值，21_elation §21.2 定槽；代放/额外阿哈经
#   _aha_pool_override 覆写锚）+ action_type "elation_skill" 声明槽（on_hp_decrease 伪
#   行动类别）；!$event.insert 闩摘除——阿哈代放（trigger_action insert=True）同发射，
#   旧闩会吃掉代放全部 20 段（8009 迁移记⓵同案）。
#   ⓶ 好活当赏真源落地——draft「直播态同域推定挂 150102」modifier 层账 B19 候选摘除
#  （官方来源全引擎原生：_init_aha 进战 20 条目 + _run_aha_turn 授予=消耗池值，防双发；
#   火花自体是否另有来源待实测在案）；天赋门控 has_modifier('CERTIFIED_BANGER') →
#   resource_of('1501','certified_banger') >= 1（emit 快照 condition 读旧值，族谱#9 同
#   口径）；banger_turns 缺省 2 档声明（spec 固定时长，8009 先例）；custom_resources
#   punchline 声明退役（队伍账引擎原生 state.punchline，res_punchline 读通道恒定义——
#   1501103 暴伤/E1 抗穿 min(...,10) 为官方文本封顶字面值，与声明无关不随摘）。
#   ⓷ 天赋附伤真路由——强化普攻主段 #3 / 终结技全体 #2：amount×ATK 火直伤近似 →
#   category "elation" + amount param(150104,3/2) 纯倍率 + punchline_source 缺省定槽
#  （=持有者好活当赏合并值，21_elation §21.2「其他欢愉伤害」）；**引擎缺口在案**：
#   hook 欢愉段削韧无通道——两段削韧 5（tbgd stance [15,0,0]÷3，mys 天赋 5 互证）随
#   category elation × toughness_dmg 编译互斥闸强制摘除（elation_damage 路由不消费
#   toughness；action 层 150120 削韧同未明保守 0）——报修不修引擎。
#   ⓸ 阿哈联动两件——E1「阿哈时刻结束时 +5 笑点」/ E2「阿哈时刻结束时 1 额外回合
#   +2 爆点」挂 aha_instant_end（B40 P2b 事件词表兑现：引擎清池后发射 → E1 +5 落清后
