# 角色模板：驭空（1207）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂复核结论：号令计数/重烘双件（遐蝶先例）、Bowmaster 元素门控（enable_if
#   以持有者为语境——虚数角色才吃，HSR 全技能单元素等价无观察差）、E4 条件
#   光环 res_ 平铺（1507 先例）、青镞免疫闩（140805 先例）、天赋 rider 冷却
#   闩全部在轨。
# 过堂勘正（e2e 首跑钓出，staging+fixture 同步）：ROARING_BOWSTRINGS_ATK 四处
#   挂载点漏写 `stack_mode: "replace"`——默认 refresh 语义重挂只刷层数/时长、
#   stat_effects 保留旧值（modifiers._apply_modifier），重烘链全挂 0；设计
#   note 自称「replace 重烘焙」但字段未落地，注释与实现脱节。已补字段对齐
#   遐蝶 NEWBUD 先例。**教训：重烘双件=计数资源+replace 修饰符，缺后件即哑。**
#
# 收录：普攻流镝 / 战技天阙鸣弦（号令 2 层 + 全队 ATK+80%/层 lv10——
#       计数+重烘双件，自身回合结束不耗层）/ 号令衰减（他人回合结束 -1
#       层并重烘）/ 终结技贯云饮羽（3.8 lv10 + 号令在场全队暴击 28%/暴伤
#       65% 1 回合 lv10）/ Majestas（号令在场队友行动 +2 能量——按不含
#       驭空自身保守读在案）/ 天赋箭彻七札（普攻附加 80% lv10 虚数伤——40% 系 lv1 档，头注前版误植 +
#       1 回合冷却闩）/ 大行迹青镞（免疫 debuff + 触发后 2 回合冷却闩）/
#       Bowmaster（虚数角色 +12%）/ 秘技进战号令 2 层 /
#       E1 全队 SPD+10% 2 回合 / E3/E5 等级族 / E4 号令在场增伤 30% /
#       E6 终结技授 1 层（cap 2）
# 待收（均带挡因）：E2 满能回能（on_gain_energy 满能判定点/载荷未接线
#       + energy 访问器缺 + 逐队友计数槽）/ 终结技暴击双增时长（官方未给
#       保守 1 回合）/ 号令层数刷新语义（战技 set 2 与残余层关系待实测）/
#       Majestas 含驭空自身与否（按不含保守读）
actor_id: "1207"
name: "驭空"
level: 80
path: "harmony"
groups: []
element: "imaginary"
base_stats:
  hp: 917.28
  atk: 599.76
  def: 374.85
  spd: 107
  crit_rate: 0.05
  crit_dmg: 0.5
  max_energy: 130
trace_notes:
  - "大行迹「青镞」已收（grants_immune 字面 kind 词表 [debuff/dot/control] 全负面免疫 + _archerion_cd 2 回合冷却闩——条件件免疫随 enable_if 开关已由引擎补口（pipeline.modifier_enabled），on_immune 载荷字段待实测不改语义断言）"
  - "大行迹「Bowmaster」已收（虚数伤 +12% 压缩为 element 门控 + all_dmg 0.12——HSR 元素固定，仅虚数角色产虚数伤，数值等价无观察差）"
  - "大行迹「Majestas」已收（号令激活时队友行动 +2 能量；EN \"an ally takes action\" 是否含驭空自身官方未排除 → 本版按不含自队（$event.actor != '1207'）保守读，待实测）"
  - "行迹无暴击/暴伤/速度百分比节点（管线实值即白值），trace_stat_effects 通道空转"
trace_stat_effects: {}

