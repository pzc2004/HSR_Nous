    energy_gain: 5

eidolons:
  E1:
    name: "Aerial Marshal"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "all_allies"
            modifier:
              modifier_id: "E1_AERIAL_MARSHAL"
              name: "Aerial Marshal"
              modifier_type: "buff"
              duration: 2
              stat_effects: {"spd_pct": 0.1}
  E2:
    name: "Skyward Command"
    notes:
      - "待收（挡因）：队友当前能量达到上限时驭空回 5 能量、每人限 1 次、驭空开大重置——on_gain_energy 为已登记瀑布但满能判定点/载荷字段未接线，宿主函数表无 energy 访问器；per-ally 计数器需逐队友 id 建槽（编队动态）——不脑补，等事件载荷落地再收"
  E3:
    name: "Torrential Fusillade"
    skill_level_overrides: {"skill": 2, "basic": 1}
    notes:
      - "战技+2 实取 lv12 档：[2, 0.88]（ATK% 加成 88%）；普攻+1 实取 lv7 档：[1.1]（默认 lv6+1，10 档表内）；号令层数 #1 全档恒定 2 不随档"
  E4:
    name: "Zephyrean Echoes"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_ZEPHYREAN_ECHOES"
              name: "Zephyrean Echoes"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "res__bowstrings >= 1"
              stat_effects: {"all_dmg": 0.3}
  E5:
    name: "August Deadshot"
    skill_level_overrides: {"ultimate": 2, "talent": 2}
    notes:
      - "终结技+2 实取 lv12 档：[4.104, 0.294, 0.702]（410.4% ATK / +29.4% CR / +70.2% CD）；天赋+2 实取 lv12 档：[0.88, 1, 1]（附加段 88% ATK）"
  E6:
    name: "Bowstring Thunderclap"
    hooks:
      - event: "on_ultimate"
        condition: "$event.source == '1207' && $event.action == '120703'"
        effects:
          - effect_type: "set_resource"
            resource_id: "_bowstrings"
            amount: "min(res__bowstrings + 1, 2)"
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "ROARING_BOWSTRINGS_ATK"
              name: "鸣弓号令"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              effect_scope: "team"
              dispellable: False
              stat_effects:
                atk_pct: "param(120702, 2) * res__bowstrings"

hooks:
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ROARING_BOWSTRINGS_ATK"
          name: "鸣弓号令"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          effect_scope: "team"
          dispellable: False
          stat_effects:
            atk_pct: "param(120702, 2) * res__bowstrings"

  - event: "on_action"
    condition: "$event.actor == '1207' && $event.action_id == '120702' && !$event.insert"
    effects:
      - effect_type: "set_resource"
        resource_id: "_bowstrings"
        amount: 2
      - effect_type: "set_resource"
        resource_id: "_skill_turn"
        amount: 1
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ROARING_BOWSTRINGS_ATK"
          name: "鸣弓号令"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          effect_scope: "team"
          dispellable: False
          stat_effects:
            atk_pct: "param(120702, 2) * res__bowstrings"

  - event: "on_turn_end"
    condition: "$event.actor == '1207' && res__skill_turn >= 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_skill_turn"
        amount: 0

  - event: "on_turn_end"
    condition: "actor_type_of($event.actor) != 'monster' && res__bowstrings >= 1 && !($event.actor == '1207' && res__skill_turn >= 1)"
    effects:
      - effect_type: "set_resource"
        resource_id: "_bowstrings"
        amount: "res__bowstrings - 1"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ROARING_BOWSTRINGS_ATK"
          name: "鸣弓号令"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          effect_scope: "team"
          dispellable: False
          stat_effects:
            atk_pct: "param(120702, 2) * res__bowstrings"

  - event: "on_become_target"
    condition: "$event.source == '1207' && $event.action_id == '120703' && res__bowstrings >= 1"
    effects:
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "ROARING_ULT_BURST"
          name: "贯云饮羽·暴击双增"
          modifier_type: "buff"
          duration: 1
          dispellable: False
          stat_effects:
            crit_rate: "param(120703, 2)"
            crit_dmg: "param(120703, 3)"

  - event: "on_action"
    condition: "$event.actor == '1207' && $event.action_type == 'basic' && !$event.insert && res__talent_cd <= 0"
    effects:
      - effect_type: "deal_damage"
        name: "箭彻七札"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "param(120704, 1) * $self.atk"
        toughness_dmg: 10
      - effect_type: "set_resource"
        resource_id: "_talent_cd"
        amount: 1

  - event: "on_turn_start"
    condition: "$event.actor == '1207'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_talent_cd"
        amount: "max(res__talent_cd - 1, 0)"
      - effect_type: "set_resource"
        resource_id: "_archerion_cd"
        amount: "max(res__archerion_cd - 1, 0)"

  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ARCHERION_GUARD"
          name: "青镞"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "res__archerion_cd <= 0"
          grants_immune: ["debuff", "dot", "control"]
  - event: "on_immune"
    condition: "$event.target == '1207'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_archerion_cd"
        amount: 2

  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "BOWMASTER_IMAGINARY"
          name: "Bowmaster"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "element_of($self) == 'imaginary'"
          stat_effects: {"all_dmg": 0.12}

  - event: "on_action"
    condition: "$event.actor != '1207' && actor_type_of($event.actor) != 'monster' && res__bowstrings >= 1"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 2

scaling_notes:
  - "号令（_bowstrings）用计数资源承载而非 modifier stacks：战技 set 2 / E6 +1（cap 2）/ 回合结束 -1，语义取 set_resource 表达式路径，避免未登记 stack_mode 词表风险；队伍 ATK 光环在每个层数变化点 replace 重烘焙（遐蝶 NEWBUD 双件先例），值恒等于 param(120702,2)×层数"
  - "天赋 120704 为纯强化型：action_type 词表无 talent 键——不落 actions，普攻 rider + 冷却资源承载；削韧 +100% 折算 rider 段 toughness_dmg 10（普攻基 10——米游社兜底）"
  - "终结技条件双增 duration 保守默认 1 回合（官方未给时长）；E6 授层后置于条件 hook（官方先后序缺失，待实测清单第 1 项）"
