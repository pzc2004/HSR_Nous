custom_resources:
  _bowstrings:
    max: 2
  _skill_turn:
    max: 1
  _talent_cd:
    max: 3
  _archerion_cd:
    max: 3

techniques:
  - technique_id: "120707"
    name: "云鸢逐风"
    point_cost: 1
    effects:
      - effect_type: "set_resource"
        resource_id: "_bowstrings"
        amount: 2

actions:
  - action_id: "120701"
    name: "流镝"
    action_type: "basic"
    target_type: "single"
    damage_type: "imaginary"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    toughness_dmg: 10
    skill_point_gain: 1
    energy_gain: 20

  - action_id: "120702"
    name: "天阙鸣弦"
    action_type: "skill"
    target_type: "self"
    damage_type: "imaginary"
    skill_point_cost: 1
    energy_gain: 30

  - action_id: "120703"
    name: "贯云饮羽"
    action_type: "ultimate"
    target_type: "single"
    damage_type: "imaginary"
    energy_cost: 130
    scaling: [{"atk": 2.28}, {"atk": 2.432}, {"atk": 2.584}, {"atk": 2.736}, {"atk": 2.888},
              {"atk": 3.04}, {"atk": 3.23}, {"atk": 3.42}, {"atk": 3.61}, {"atk": 3.8},
              {"atk": 3.952}, {"atk": 4.104}, {"atk": 4.256}, {"atk": 4.408}, {"atk": 4.56}]
