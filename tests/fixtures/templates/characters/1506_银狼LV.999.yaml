eidolons:
  E1:
    name: "Aether Editing: Eidolon +1"   # 以太编辑：星魂+1（en/cn 官方名核一致）
    hooks:
      # 结界中的敌方目标受到伤害 +20%（勘正⑦——vulnerability 在案收编；挂点=进状态
      # on_ultimate + 多波次新敌补挂 on_wave_start；摘除=主干退出 hook remove no-op 安全）
      - event: "on_ultimate"
        condition: "$event.source == '1506' && $event.action == '150603'"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E1_ZONE_VULN"
              name: "以太编辑·结界易伤"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              stat_effects: {"vulnerability": 0.2}
      - event: "on_wave_start"
        condition: "res__godmode >= 1"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E1_ZONE_VULN"
              name: "以太编辑·结界易伤"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              stat_effects: {"vulnerability": 0.2}
    notes:
      - "E1②退出状态不清空 Hidden MMR、改为保留 20%——待收：同事件快照语义下星魂分支覆写主 hook 数值无稳定挂点（主干退出钩先 set 0，E1 钩读不到退出前快照；钩序/快照通道接线后回填）"
      - "结界易伤多波次补挂=领域语义近似（zone 系统未落——状态存续=领域存续口径；目标被击败后新入场敌人补挂同口径）"
  E2:
    name: "It's a Feature, Not a Bug"    # 是机制，不是BUG
    hooks:
      # 状态内每累计 120 点 Hidden MMR 增量（含进入时初始量——口径待实测）→ 额外回合
      #（勘正⑤——grant_extra_turn 在案收编，draft advance_action 承载+「通道待收」挡因过期）
      # + 恢复 1 次强化普攻使用次数：增量记账（on_resource_gain）+ 阈值档（快照补偿族谱 9）
      - event: "on_resource_gain"
        condition: "$event.resource_id == 'hidden_mmr' && res__godmode >= 1"
        effects:
          - effect_type: "gain_resource"
            resource_id: "_e2_mmr_delta"
            amount: "$event.amount"
      - event: "on_resource_gain"
        condition: "$event.resource_id == 'hidden_mmr' && res__godmode >= 1 && res__e2_mmr_delta + $event.amount >= 120"
        effects:
          - effect_type: "grant_extra_turn"
            target: "self"
          - effect_type: "gain_resource"
            resource_id: "_godmode_uses"
            amount: -1           # 恢复 1 次强化普攻使用次数
          - effect_type: "set_resource"
            resource_id: "_e2_mmr_delta"
            amount: 0            # 每档重置（每 120 一档——跨档余量截断，待实测）
    notes:
      - "E2 buff 延长 1 回合待收：adjust_duration 仅 modifier_id 定点（05_effects §），「自身所有增益批量 +1」通道缺；「含进入时初始量」计数口径与天赋 #5 三计数交互待实测"
  E3:
    name: "Max Lv. 15? Says who?"        # 只有15级？谁填的
    skill_level_overrides: {"skill": 2, "basic": 1, "elation_skill": 1}   # 战技+2、普攻+1、欢愉技+1（勘正⑨⑩——欢愉技独立档键全收）
    notes:
      - "战技+2 随档段：150602 倍率实取 lv12=1.76、Punchline 5 全档恒定；盲盒 #3/#4/#5/#6/#7 走 param(150603,*) 随终结技档（E3 不动终结技）"
      - "普攻+1：默认 lv6 → lv7——150601 实取 1.1、150608 实取 [2.64,0,100,1.1,3,60,2,0.15]（draft「实取 lv10」勘误——默认档 lv6）"
      - "欢愉技+1：默认 lv10（缺省回退 ultimate 档）→ lv11——150620 全档 15 无差、150621 实取 [0.945,6]"
  E4:
    name: "I Came. I Saw. I One-Shot."   # 我来，我见，我..秒了
    notes:
      - "待收：150621 欢愉伤害额外计入 Punchline = 原量×5——挡因：笑点计入本身=欢愉体系 punchline_source 通道（21_elation 未实装），结算层（乘区还是资源联动）与「原量」基数口径待实测，数值表达式不可先写（避免错乘区固化）"
  E5:
    name: "Basic ATK Is the New Ultimate"   # 平A即是大招
    skill_level_overrides: {"ultimate": 2, "talent": 2, "elation_skill": 1}   # 终结技+2、天赋+2、欢愉技+1
    notes:
      - "终结技+2 随档段：盲盒倍率 param(150603, 3)（lv12=0.99）；#1=60/#4=0.2/#5=0.2/#6=3/#7=2 全档恒定"
      - "天赋+2 随档段：追加欢愉倍率 param(150604, 3)（lv12=0.44——lv 行对轴勘误：lv12 非 0.46）、CR param(150604, 4)（lv12=0.0044）、CD param(150604, 6)（lv12=0.0088）；#1/#2/#5 恒定"
      - "欢愉技+1：同 E3——150621 实取 lv11=[0.945,6]"
  E6:
    name: "Solo Maxxing!"                # 我独自满级！
    hooks:
      # 禁限弱点（勘正④——cn 官方名；en=Absolute Weakness）：全属性弱点 + 全属性基础抗性
      # 降至 0——按 res_pen 1.0 保守读（攻击方面板通道；Base RES==0 → -20% 分支待收）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_ABSOLUTE_WEAKNESS"
              name: "禁限弱点"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"res_pen": 1.0}
      # 强化普攻期间欢愉伤害 merrymakes +50%（勘正——draft on_action 挂点+duration 1
      # owner_turn_end 是静默死件：主干伤害钩先于星魂钩执行（编译序），挂上时本次
      # 伤害已结算，当回合结束又摘——永远不吃。改 on_battle_start 常驻：官方仅覆盖
      # 强化普攻期间——常驻近似下追加/盲盒/150621 欢愉伤同吃的口径偏差在案；
      # merrymake 独立乘区未接路由（21_elation），按 all_dmg 0.5 承载——欢愉伤不吃
      # 通用增伤，乘区归属偏差在案）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_MERRYMAKES"
              name: "Solo Maxxing!·增笑"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"all_dmg": 0.5}
    stat_effects: {}
    notes:
      - "「禁限弱点」：拥有全属性弱点（弱点植入语义未建——假人配弱点匹配测试口径下无观察差）+ Base RES→0（res_pen 1.0 保守读）；Base RES==0 时改对应属性抗性 -20% 的条件分支待收（按目标 Base RES 的分支通道未登记）"
      - "merrymakes 与行迹 1506101 欢愉度加成的叠算关系待实测（乘区归属）"

hooks:
  # 战斗开始：闩归零 + 天赋 CR/CD 转模常驻件（勘正③——stat_exprs 现场追踪通道；
  # E6 件已挪入星魂块，勘正④）
  - event: "on_battle_start"
    effects:
      - effect_type: "set_resource"
        resource_id: "_godmode"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_godmode_uses"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_lootbox_p"
        amount: 1.0
      - effect_type: "set_resource"
        resource_id: "_e2_mmr_delta"
        amount: 0
      # 天赋 150604：每点 Hidden MMR CR +#4；CR 到 100%（面板上限）后溢出点数转 CD +#6
      # ——stat_exprs 现场追踪（条件光环域 res_ 平铺三域同槽；draft stat_effects 字串
      # 挂点烘焙=永久 0 死件，勘正③）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "HIDDEN_MMR_CRIT"
          name: "Hidden MMR 转模"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            crit_rate: "min(res_hidden_mmr * param(150604, 4), 0.95)"
            crit_dmg: "max(0, (res_hidden_mmr - 0.95 / param(150604, 4)) * param(150604, 6))"

  # 150603 终结技：进入 Godmode Player（免疫控制类 debuff）+ 行动提前 100%（官方文本
  # "advances action by 100%"——非额外回合）+ Certified Banger 挂件 + 计数闩归零
  # + 盲盒概率闩置 1.0
  - event: "on_ultimate"
    condition: "$event.source == '1506' && $event.action == '150603'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_godmode"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_godmode_uses"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_lootbox_p"
        amount: 1.0
      - effect_type: "set_resource"
        resource_id: "_e2_mmr_delta"
        amount: 0        # E2 计数窗随状态重开（E2 未激活时无观察差）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "GODMODE_PLAYER"
          name: "Godmode Player"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          grants_immune: ["control"]
      - effect_type: "apply_modifier"   # Certified Banger「好活当赏」——官方未明示获得途径，
        target: "self"                  # 按随状态挂载保守读（待实测；机制文档 08：进战 +20/
        modifier:                       # 阿哈时刻结算——布尔闩不记点数，点数=欢愉乘区通道待收①）
          modifier_id: "CERTIFIED_BANGER"
          name: "好活当赏"
          modifier_type: "buff"
          duration: 0
          dispellable: False
      # 150608 增伤档随状态挂载（勘正⑭——draft 挂 on_action 永远晚于行动结算=本体静默
      # 不吃：on_action 在 _execute_action 之后；且 refresh 烘焙陈旧 1207 案。正解：进状态
      # 挂 + dmg_basic_dmg_boost 类型桶 stat_exprs 动态追踪——godmode 内 basic 类型只有
      # 150608（150601 available_if 互斥），桶命中域=官方「强化普攻期间」精确对齐；
      # Final Hit 伪行动经 action_type: "basic" 声明槽同吃——1220 飞霄先例）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ENH_BASIC_DMG"
          name: "狼尊时刻·Hidden MMR 增伤"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            dmg_basic_dmg_boost: "param(150608, 8) * min(round(res_hidden_mmr / param(150608, 6)), param(150608, 7))"
      - effect_type: "advance_action"
        target: "self"
        amount: 100

  # 150602 战技：获得 #2 点 Punchline（天赋再等量联动 Hidden MMR——见 on_resource_gain）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150602' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: "param(150602, 2)"

  # 天赋 150604：获得 Punchline 时获得等量 Hidden MMR——笑点全队共享语义（21.3），
  # 故意不判 $event.actor：任何来源获得 punchline 银狼都得等量 MMR（引擎 per-actor
  # 账下的团队资源近似）
  - event: "on_resource_gain"
    condition: "$event.resource_id == 'punchline'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hidden_mmr"
        amount: "$event.amount"

  # 150620 欢愉技（前形态）：获得 #1=15 点 Hidden MMR
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150620' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hidden_mmr"
        amount: "param(150620, 1)"

  # 150621 欢愉技（Godmode 内）：#2=6 段、每段随机单体 atk×#1 虚数欢愉伤
  #（普通伤近似——欢愉路由未接待收①；expected 确定化按序取首——B22 纪律）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150621' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "崩坏级伤害演示"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(150621, 1) * $self.atk"
      - effect_type: "deal_damage"
        name: "崩坏级伤害演示"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(150621, 1) * $self.atk"
      - effect_type: "deal_damage"
        name: "崩坏级伤害演示"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(150621, 1) * $self.atk"
      - effect_type: "deal_damage"
        name: "崩坏级伤害演示"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(150621, 1) * $self.atk"
      - effect_type: "deal_damage"
        name: "崩坏级伤害演示"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(150621, 1) * $self.atk"
      - effect_type: "deal_damage"
        name: "崩坏级伤害演示"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(150621, 1) * $self.atk"
      # 将 Top Loot Box 固定概率重置回初始值（100%）
      - effect_type: "set_resource"
        resource_id: "_lootbox_p"
        amount: 1.0

  # 大行迹 1506102：施放欢愉技计入的笑点 ≥20 → +20 Hidden MMR；≥40 再 +20（字面值；
  # 「计入的笑点」=施放时点当前笑点——on_action 快照语义正合（族谱 9），21.2
  # punchline_source 同读法）
  - event: "on_action"
    condition: "$event.actor == '1506' && ($event.action_id == '150620' || $event.action_id == '150621') && res_punchline >= 20"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hidden_mmr"
        amount: 20
  - event: "on_action"
    condition: "$event.actor == '1506' && ($event.action_id == '150620' || $event.action_id == '150621') && res_punchline >= 40"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hidden_mmr"
        amount: 20

  # 大行迹 1506103：进入 Godmode Player 状态后获得 #1=20 Hidden MMR（字面值）
  - event: "on_ultimate"
    condition: "$event.source == '1506' && $event.action == '150603'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hidden_mmr"
        amount: 20

  # 天赋 150604：持有 Certified Banger 时，用战技对被攻击目标追加 atk×#3 虚数欢愉伤
  #（普通伤近似——待收①；战技 AoE「被攻击目标」=全体）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150602' && !$event.insert && has_modifier($self, 'CERTIFIED_BANGER') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "好活当赏"
        target: "all_enemies"
        damage_type: "imaginary"
        amount: "param(150604, 3) * $self.atk"

  # 天赋 150604：同上半件——普攻对被攻击目标追加（勘正⑥收录：on_action 载荷 target
  # + pool "$event.target" 通道；强化普攻不追加——官方明示其本体变欢愉伤同倍率）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150601' && !$event.insert && has_modifier($self, 'CERTIFIED_BANGER') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "好活当赏"
        target: {pool: "$event.target"}
        damage_type: "imaginary"
        amount: "param(150604, 3) * $self.atk"

  # 150608 强化普攻：Final Hit 终结一击 atk×#4 全体均分（伪行动 action_type 声明 basic
  # ——官方「强化普攻期间 DMG+#8%」覆盖 Final Hit，随 ENH_BASIC_DMG 类型桶同吃）→ 计数 +1
  #（增伤档已挪 on_ultimate 随状态挂载——勘正⑭；100 段弹射总倍率 #1 由 action 层
  # scaling 承载——勘正⑮；退出摘除见退出 hook）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150608' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "狼尊时刻·终结一击"
        target: "all_enemies"
        damage_type: "imaginary"
        action_type: "basic"
        amount: "param(150608, 4) * $self.atk"
      - effect_type: "gain_resource"
        resource_id: "_godmode_uses"
        amount: 1

  # 天赋 150604：完整用完 #5=3 次强化普攻后退出 Godmode Player（快照口径 +1 补偿——
  # 1408 弑魂同先例）：摘状态/好活当赏/增伤档/结界易伤（E1 件——E0 时 remove no-op
  # 无害）、清空 Hidden MMR、闩归零（E1②保留 20% 分支待收④）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150608' && !$event.insert && res__godmode_uses + 1 >= param(150604, 5)"
    effects:
      - effect_type: "remove_modifier"
        modifier_id: "GODMODE_PLAYER"
      - effect_type: "remove_modifier"
        modifier_id: "CERTIFIED_BANGER"
      - effect_type: "remove_modifier"
        modifier_id: "ENH_BASIC_DMG"
      - effect_type: "remove_modifier"
        modifier_id: "E1_ZONE_VULN"
        target: "all_enemies"
      - effect_type: "set_resource"
        resource_id: "hidden_mmr"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_godmode"
        amount: 0

  # Top Loot Box 主干：Godmode Player 状态内、持有 Certified Banger，我方每消耗 1 个
  # 战技点（勘正⑬——before>after 消耗判定，载荷词表在案）→ 按当前固定概率
  #（mechanic_chance 读 res__lootbox_p——勘正①）触发 1 次盲盒：基础虚数欢愉伤 atk×#3
  # 全体均分（普通伤近似——待收①），随后概率 ×#4
  - event: "on_skill_point_change"
    condition: "$event.before > $event.after && res__godmode >= 1 && has_modifier($self, 'CERTIFIED_BANGER') >= 1 && mechanic_chance(res__lootbox_p)"
    effects:
      - effect_type: "deal_damage"
        name: "Top Loot Box 头号补给盲盒"
        target: "all_enemies"
        damage_type: "imaginary"
        amount: "param(150603, 3) * $self.atk"
      - effect_type: "set_resource"
        resource_id: "_lootbox_p"
        amount: "res__lootbox_p * param(150603, 4)"

  # 盲盒三选一——全摘待收③（chance() hook 域编译期硬闸 + 概率分配官方未明示不脑补）：
  # ① 大剑：对生命值最高的敌人额外造成 = 本次总伤害 #5 的真伤——正解
  #   deal_damage category "true" + target {pool: "enemies", order_by: "-$it.hp", take: 1}
  #   （draft order_by 漏 `-` 降序前缀——族谱 13；amount 以本次盲盒实伤为基数的通道
  #   $last.actual_amount 链槽在案）
  # ② 炸蛋：恢复 #7=2 个战技点——gain_skill_point 通道在案（draft「未登记」挡因过期）
  # ③ 怪味豆：获得 #6=3 点 Punchline（天赋再等量联动 Hidden MMR）

  # 秘技 150607：豆在场时每波次开始触发 1 次来自豆的 Top Loot Box（#1=99 点好活当赏
  # 计入笑点乘区——punchline_source 通道未接待收①，按盲盒同基数普通伤近似——勘正⑫；
  # 并刷新好活当赏保守承载）
  - event: "on_wave_start"
    condition: "has_modifier($self, 'TECH_MUNCH_BEAN') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "朋友，这才是T0级秘技·盲盒"
        target: "all_enemies"
        damage_type: "imaginary"
        amount: "param(150603, 3) * $self.atk"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CERTIFIED_BANGER"
          name: "好活当赏"
          modifier_type: "buff"
          duration: 0
          dispellable: False

scaling_notes:
  - 欢愉体系整体未实装（21_elation：公式入簿备镜、路由未接）——模板内一切「欢愉伤」（150608 本体转化/天赋追加/盲盒/150621/秘技豆）均按普通虚数伤近似承载（等级系数×倍率公式、笑点/增笑乘区全未接），接线后整体回填
  - 150608 100 段随机弹射压缩：官方 #1 总倍率均分 100 段随机敌人（#3=100）——由 action 层 scaling 承载（主目标单体近似，压缩口径下同总量；draft hook 内重复落=双倍结算，勘正⑮摘除）；随机目标/多段逐段/清场续打（保留剩余段数/新敌额外回合/buff 延长 1 回合）事件序列通道未接线，待收②；#2=0（触发盲盒节奏）官方值为 0，节奏待实测；fandom 削韧三值冲突随此待收
  - 欢愉技 150620/150621 action_type 落 "follow_up"（阿哈时刻插入式自动件语义；编译词表 basic/skill/ultimate/follow_up/memosprite_skill/assist 无 elation_skill 类——action.py 注释提到的 elation_damage 未进词表）；level_key 自定义 "elation_skill" 独立档轨
  - Certified Banger 获得途径官方文本未明示——按进入 Godmode Player 时挂载 + 秘技豆每波刷新保守读，待实测（机制文档通用途径：进战 +20/阿哈时刻结算——点数制，布尔闩近似）
  - 状态内不能再次释放终结技：ult_cost_amount 60 扣空后门槛不可达（非额外 available_if 声明）；行动提前 100%（官方文本明示，非额外回合）
  - 大行迹 1506101 欢愉度、E1②保留 20%、E2 buff 批量延长、E4 Punchline×5、E6 merrymakes 独立乘区/弱点植入语义：均待收（挡因见头注与 eidolons notes）
  - 150606「攻击」（入场削韧，params 空）为战外自动件——按锚纪律不入 actions
