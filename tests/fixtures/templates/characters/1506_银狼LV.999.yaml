eidolons:
  E1:
    name: "Aether Editing: Eidolon +1"   # 以太编辑：星魂+1（en/cn 官方名核一致）
    hooks:
      # 结界中的敌方目标受到伤害 +20%（勘正⑦——vulnerability 在案收编；挂点=进状态
      # on_ultimate + 多波次新敌补挂 on_wave_start；摘除=主干退出 hook remove no-op 安全）
      - event: "on_ultimate"
        condition: "$event.source == '1506' && $event.action == '150603'"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E1_ZONE_VULN"
              name: "以太编辑·结界易伤"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              stat_effects: {"vulnerability": 0.2}
      - event: "on_wave_start"
        condition: "res__godmode >= 1"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E1_ZONE_VULN"
              name: "以太编辑·结界易伤"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              stat_effects: {"vulnerability": 0.2}
    notes:
      - "E1②退出状态不清空 Hidden MMR、改为保留 20%——待收：同事件快照语义下星魂分支覆写主 hook 数值无稳定挂点（主干退出钩先 set 0，E1 钩读不到退出前快照；钩序/快照通道接线后回填）"
      - "结界易伤多波次补挂=领域语义近似（zone 系统未落——状态存续=领域存续口径；目标被击败后新入场敌人补挂同口径）"
  E2:
    name: "It's a Feature, Not a Bug"    # 是机制，不是BUG
    hooks:
      # 状态内每累计 120 点 Hidden MMR 增量（含进入时初始量——口径待实测）→ 额外回合
      #（勘正⑤——grant_extra_turn 在案收编，draft advance_action 承载+「通道待收」挡因过期）
      # + 恢复 1 次强化普攻使用次数：增量记账（on_resource_gain）+ 阈值档（快照补偿族谱 9）
      - event: "on_resource_gain"
        condition: "$event.resource_id == 'hidden_mmr' && res__godmode >= 1"
        effects:
          - effect_type: "gain_resource"
            resource_id: "_e2_mmr_delta"
            amount: "$event.amount"
      - event: "on_resource_gain"
        condition: "$event.resource_id == 'hidden_mmr' && res__godmode >= 1 && res__e2_mmr_delta + $event.amount >= 120"
        effects:
          - effect_type: "grant_extra_turn"
            target: "self"
          - effect_type: "gain_resource"
            resource_id: "_godmode_uses"
            amount: -1           # 恢复 1 次强化普攻使用次数
          - effect_type: "set_resource"
            resource_id: "_e2_mmr_delta"
            amount: 0            # 每档重置（每 120 一档——跨档余量截断，待实测）
    notes:
      - "E2 buff 延长 1 回合待收：adjust_duration 仅 modifier_id 定点（05_effects §），「自身所有增益批量 +1」通道缺；「含进入时初始量」计数口径与天赋 #5 三计数交互待实测"
  E3:
    name: "Max Lv. 15? Says who?"        # 只有15级？谁填的
    skill_level_overrides: {"skill": 2, "basic": 1, "elation_skill": 1}   # 战技+2、普攻+1、欢愉技+1（勘正⑨⑩——欢愉技独立档键全收）
    notes:
      - "战技+2 随档段：150602 倍率实取 lv12=1.76、Punchline 5 全档恒定；盲盒 #3/#4/#5/#6/#7 走 param(150603,*) 随终结技档（E3 不动终结技）"
      - "普攻+1：默认 lv6 → lv7——150601 实取 1.1、150608 实取 [2.64,0,100,1.1,3,60,2,0.15]（draft「实取 lv10」勘误——默认档 lv6）"
      - "欢愉技+1：默认 lv10（缺省回退 ultimate 档）→ lv11——150620 全档 15 无差、150621 实取 [0.945,6]"
  E4:
    name: "I Came. I Saw. I One-Shot."   # 我来，我见，我..秒了
    hooks:
      # 150621 欢愉伤害额外计入 Punchline=原量×5（B40 ⓸ 收编——punchline_source 通道
      # 真路由，旧「通道未实装」挡因兑现）：EN "additionally takes into account
      # Punchline, equal to the original amount multiplied by 5" → 计入总量=原量×(1+5)
      # ——闩值 5 字面值（星魂无等级轨道）；150621 段 punchline_source 与 1506102
      # 两档同读 res__e4_pl_mult
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e4_pl_mult"
            amount: 5
    notes:
      - "「原量」基数=不计 E4 时 150621 的笑点计入值=施放时阿哈笑点池实时值（欢愉技 21_elation §21.2 定槽）；乘区读按 EN 文本在案，终审待实测"
      - "复合 punchline_source 表达式绕 pool_override 字面锚（在案㈡——爻光跨队额外阿哈固定档场景 150621 读活池×6）"
  E5:
    name: "Basic ATK Is the New Ultimate"   # 平A即是大招
    skill_level_overrides: {"ultimate": 2, "talent": 2, "elation_skill": 1}   # 终结技+2、天赋+2、欢愉技+1
    notes:
      - "终结技+2 随档段：盲盒倍率 param(150603, 3)（lv12=0.99）；#1=60/#4=0.2/#5=0.2/#6=3/#7=2 全档恒定"
      - "天赋+2 随档段：追加欢愉倍率 param(150604, 3)（lv12=0.44——lv 行对轴勘误：lv12 非 0.46）、CR param(150604, 4)（lv12=0.0044）、CD param(150604, 6)（lv12=0.0088）；#1/#2/#5 恒定"
      - "欢愉技+1：同 E3——150621 实取 lv11=[0.945,6]"
  E6:
    name: "Solo Maxxing!"                # 我独自满级！
    hooks:
      # 禁限弱点（勘正④——cn 官方名；en=Absolute Weakness）：全属性弱点 + 全属性基础抗性
      # 降至 0——按 res_pen 1.0 保守读（攻击方面板通道；Base RES==0 → -20% 分支待收）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_ABSOLUTE_WEAKNESS"
              name: "禁限弱点"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"res_pen": 1.0}
      # 强化普攻期间欢愉伤害 merrymakes +50%（B40 ⓺ 收编——merrymake 增笑独立乘区真
      # 路由，旧 all_dmg 0.5 近似退役：欢愉伤不吃通用增伤，乘区归属偏差就此关闭；
      # 常驻近似域偏差仍在案㈢——官方仅覆盖强化普攻期间，追加/盲盒/150621 同吃；
      # 挂点沿革：draft on_action+duration 1 静默死件 → on_battle_start 常驻）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_MERRYMAKES"
              name: "Solo Maxxing!·增笑"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"merrymake": 0.5}
    stat_effects: {}
    notes:
      - "「禁限弱点」：拥有全属性弱点（弱点植入语义未建——假人配弱点匹配测试口径下无观察差）+ Base RES→0（res_pen 1.0 保守读）；Base RES==0 时改对应属性抗性 -20% 的条件分支待收（按目标 Base RES 的分支通道未登记）"
      - "merrymakes 与行迹欢愉度加成的叠算关系：merrymake_multi=1+merrymake 独立乘区、elation_multi=1+elation 独立乘区（rulebook elation_damage 链在案——旧「叠算待实测」按公式链关闭）；域偏差在案㈢"

hooks:
  # 战斗开始：闩归零 + 天赋 CR/CD 转模常驻件（勘正③——stat_exprs 现场追踪通道；
  # E6 件已挪入星魂块，勘正④）
  - event: "on_battle_start"
    effects:
      - effect_type: "set_resource"
        resource_id: "_godmode"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_godmode_uses"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_lootbox_p"
        amount: 1.0
      - effect_type: "set_resource"
        resource_id: "_e2_mmr_delta"
        amount: 0
      # 天赋 150604：每点 Hidden MMR CR +#4；CR 到 100%（面板上限）后溢出点数转 CD +#6
      # ——stat_exprs 现场追踪（条件光环域 res_ 平铺三域同槽；draft stat_effects 字串
      # 挂点烘焙=永久 0 死件，勘正③）；封顶动态化（B40 在案㈣——行迹 crit 0.147 回填
      # 后旧 0.95=「100%−基础 0.05」基数失效：max(0, 1-$self.crit_rate)=100%−无条件件
      # 面板，防自指环域读 8008 先例；面板已 ≥100% 时全点转 CD）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "HIDDEN_MMR_CRIT"
          name: "Hidden MMR 转模"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            crit_rate: "min(res_hidden_mmr * param(150604, 4), max(0, 1 - $self.crit_rate))"
            crit_dmg: "max(0, (res_hidden_mmr - max(0, 1 - $self.crit_rate) / param(150604, 4)) * param(150604, 6))"

      # 大行迹 1506101「假结局速通攻略」：SPD≥160 → 欢愉度 +50%、每超 1 点 +2% 计至
      # 100 超额（B40 ⓹ 收编——elation 面板通道常驻件 stat_exprs 现场求值；字面值
      # [160,0.5,1,0.02,100] 行迹无等级轨道；三元式 1406 先例；$self.spd=无条件件
      # 面板——行迹 SPD 节点/装备/光环全吃进）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TRACE_1506101"
          name: "假结局速通攻略"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            elation: "($self.spd >= 160 ? 0.5 + 0.02 * min($self.spd - 160, 100) : 0)"

  # 150603 终结技：进入 Godmode Player（免疫控制类 debuff）+ 行动提前 100%（官方文本
  # "advances action by 100%"——非额外回合）+ 计数闩归零 + 盲盒概率闩置 1.0
  #（B40 ⓶——CERTIFIED_BANGER 挂载件摘除：官方 "While holding Certified Banger"=
  # 持有前提非获得途径，好活当赏供给=引擎进战 20 条目+阿哈结算授）
  - event: "on_ultimate"
    condition: "$event.source == '1506' && $event.action == '150603'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_godmode"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_godmode_uses"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_lootbox_p"
        amount: 1.0
      - effect_type: "set_resource"
        resource_id: "_e2_mmr_delta"
        amount: 0        # E2 计数窗随状态重开（E2 未激活时无观察差）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "GODMODE_PLAYER"
          name: "Godmode Player"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          grants_immune: ["control"]
      # 150608 增伤档随状态挂载（勘正⑭+B40 ⓺——draft 挂 on_action 永远晚于行动结算=
      # 本体静默不吃：on_action 在 _execute_action 之后；且 refresh 烘焙陈旧 1207 案。
      # 进状态挂 + stat_exprs 动态追踪；欢愉伤不吃通用增伤乘区——「为原伤害的 X%」族
      #（"increases DMG dealt ... by #8% of the original DMG"）归 dmg_final_dmg_boost
      # 槽，爻光 E4 先例；域偏差在案㈢：final_dmg_boost 池无按行动隔离通道——Godmode
      # 内 150621/盲盒同吃，同 E6 merrymake 常驻近似先例）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ENH_BASIC_DMG"
          name: "狼尊时刻·Hidden MMR 增伤"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            dmg_final_dmg_boost: "param(150608, 8) * min(round(res_hidden_mmr / param(150608, 6)), param(150608, 7))"
      - effect_type: "advance_action"
        target: "self"
        amount: 100

  # 150602 战技：获得 #2 点 Punchline（天赋再等量联动 Hidden MMR——见 on_resource_gain）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150602' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: "param(150602, 2)"

  # 天赋 150604：获得 Punchline 时获得等量 Hidden MMR——笑点全队共享语义（21.3），
  # 故意不判 $event.actor：任何来源获得 punchline 银狼都得等量 MMR（引擎 per-actor
  # 账下的团队资源近似）
  - event: "on_resource_gain"
    condition: "$event.resource_id == 'punchline'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hidden_mmr"
        amount: "$event.amount"

  # 150620 欢愉技（前形态）：获得 #1=15 点 Hidden MMR（B40 ⓵——insert 闩摘除：
  # trigger_action/阿哈时刻 insert=True 同发射，8009 先例）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150620'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hidden_mmr"
        amount: "param(150620, 1)"

  # 150621 欢愉技（Godmode 内）：#2=6 段、每段随机单体 #1 虚数欢愉伤（B40 ⓵ 真路由——
  # category "elation" + amount 纯倍率 + punchline_source 笑点池实时值 ×(1+E4 闩)，
  # 21_elation §21.2 定槽；action_type "elation_skill" 声明段；expected 确定化按序取首
  # ——B22 纪律；insert 闩摘除同上；文本序「Deals... Then, resets」伤害在先重置在后）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150621'"
    effects:
      - effect_type: "deal_damage"
        name: "崩坏级伤害演示"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(150621, 1)"
        punchline_source: "res_punchline * (1 + res__e4_pl_mult)"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "崩坏级伤害演示"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(150621, 1)"
        punchline_source: "res_punchline * (1 + res__e4_pl_mult)"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "崩坏级伤害演示"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(150621, 1)"
        punchline_source: "res_punchline * (1 + res__e4_pl_mult)"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "崩坏级伤害演示"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(150621, 1)"
        punchline_source: "res_punchline * (1 + res__e4_pl_mult)"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "崩坏级伤害演示"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(150621, 1)"
        punchline_source: "res_punchline * (1 + res__e4_pl_mult)"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "崩坏级伤害演示"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(150621, 1)"
        punchline_source: "res_punchline * (1 + res__e4_pl_mult)"
        action_type: "elation_skill"
      # 将 Top Loot Box 固定概率重置回初始值（100%）
      - effect_type: "set_resource"
        resource_id: "_lootbox_p"
        amount: 1.0

  # 大行迹 1506102：施放欢愉技计入的笑点 ≥20 → +20 Hidden MMR；≥40 再 +20（字面值
  # [20,40,20,20]；「计入的笑点」=施放时点计入值——on_action 快照语义正合（族谱 9）。
  # B40 ⓸ per-action 拆钩：150621 档读含 E4 倍加计入值（官方 E4 "additionally takes
  # into account" 与行迹 "taken into account" 同词联动）、150620 档读池快照——E4 仅及
  # 150621（"by Honkai-DMG Demo"），150620 无伤害段不计倍）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150620' && res_punchline >= 20"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hidden_mmr"
        amount: 20
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150620' && res_punchline >= 40"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hidden_mmr"
        amount: 20
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150621' && res_punchline * (1 + res__e4_pl_mult) >= 20"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hidden_mmr"
        amount: 20
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150621' && res_punchline * (1 + res__e4_pl_mult) >= 40"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hidden_mmr"
        amount: 20

  # 大行迹 1506103：进入 Godmode Player 状态后获得 #1=20 Hidden MMR（字面值）
  - event: "on_ultimate"
    condition: "$event.source == '1506' && $event.action == '150603'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hidden_mmr"
        amount: 20

  # 天赋 150604：持有好活当赏时，用战技对被攻击目标追加 #3 虚数欢愉伤（B40 ⓷ 真路由
  # ——category "elation" + amount 纯倍率；punchline_source 缺省=持有者好活当赏合并值，
  # 21_elation §21.2；门控 resource_of 合并值——进战 20 点引擎统发起即持，旧 modifier
  # 布尔闩翻案；战技 AoE「被攻击目标」=全体。钩序：官方 150602 文本 "Gains Punchline
  # ... and deals"=获得在先（与 8009 先伤后得相反——按本角色文本序），本钩在笑点
  # 发放钩之后=追加吃发放后 MMR 面板）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150602' && !$event.insert && resource_of('1506', 'certified_banger') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "好活当赏"
        category: "elation"
        target: "all_enemies"
        damage_type: "imaginary"
        amount: "param(150604, 3)"

  # 天赋 150604：同上半件——普攻对被攻击目标追加（勘正⑥收录：on_action 载荷 target
  # + pool "$event.target" 通道；强化普攻不追加——官方明示其本体变欢愉伤同倍率）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150601' && !$event.insert && resource_of('1506', 'certified_banger') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "好活当赏"
        category: "elation"
        target: {pool: "$event.target"}
        damage_type: "imaginary"
        amount: "param(150604, 3)"

  # 150608 强化普攻：本体欢愉伤 hook 承载（B40 ⓷——天赋 "ability DMG changes to Elation
  # DMG at the same multiplier"：punchline_source 缺省=好活当赏合并值，非欢愉技故不用
  # 笑点池槽/action 层 elation 行键）：弹射段压缩单段 #1 总倍率主目标（100 段随机逐段
  # 待收②——主目标单体近似同总量，勘正⑮）→ Final Hit #4 全体均分（迁移钓出：官方
  # "split evenly among all enemies" 明示，旧实现全体各吃全额与注释「均分」矛盾——
  # enemies_alive() 手算分母，8010 先例）→ 计数 +1（增伤档随状态挂载——勘正⑭/B40 ⓺
  # final_dmg_boost 槽；两段 action_type "basic" 伪行动声明——1220 飞霄先例；退出摘除
  # 见退出 hook）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150608' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "狼尊时刻·弹射（压缩单段）"
        category: "elation"
        target: {pool: "$event.target"}
        damage_type: "imaginary"
        action_type: "basic"
        amount: "param(150608, 1)"
      - effect_type: "deal_damage"
        name: "狼尊时刻·终结一击"
        category: "elation"
        target: "all_enemies"
        damage_type: "imaginary"
        action_type: "basic"
        amount: "param(150608, 4) / enemies_alive()"
      - effect_type: "gain_resource"
        resource_id: "_godmode_uses"
        amount: 1

  # 天赋 150604：完整用完 #5=3 次强化普攻后退出 Godmode Player（快照口径 +1 补偿——
  # 1408 弑魂同先例）：摘状态/增伤档/结界易伤（E1 件——E0 时 remove no-op 无害）、
  # 清空 Hidden MMR、闩归零（E1②保留 20% 分支待收④；B40 ⓶——好活当赏摘除同步删：
  # 官方退出只清 Hidden MMR，条目自然 2 回合计时）
  - event: "on_action"
    condition: "$event.actor == '1506' && $event.action_id == '150608' && !$event.insert && res__godmode_uses + 1 >= param(150604, 5)"
    effects:
      - effect_type: "remove_modifier"
        modifier_id: "GODMODE_PLAYER"
      - effect_type: "remove_modifier"
        modifier_id: "ENH_BASIC_DMG"
      - effect_type: "remove_modifier"
        modifier_id: "E1_ZONE_VULN"
        target: "all_enemies"
      - effect_type: "set_resource"
        resource_id: "hidden_mmr"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_godmode"
        amount: 0

  # Top Loot Box 主干：Godmode Player 状态内、持有好活当赏（B40 ⓶ 条目门控），我方每
  # 消耗 1 个战技点（勘正⑬——before>after 消耗判定，载荷词表在案）→ 按当前固定概率
  #（mechanic_chance 读 res__lootbox_p——勘正①）触发 1 次盲盒：#3 虚数欢愉伤全体均分
  #（B40 ⓷ 真路由 + 迁移钓出均分兑现——官方 "distributed evenly among all enemies"，
  # 旧实现全体各吃全额与注释「均分」矛盾；enemies_alive() 手算分母 8010 先例；
  # punchline_source 缺省=好活当赏合并值），随后概率 ×#4
  - event: "on_skill_point_change"
    condition: "$event.before > $event.after && res__godmode >= 1 && resource_of('1506', 'certified_banger') >= 1 && mechanic_chance(res__lootbox_p)"
    effects:
      - effect_type: "deal_damage"
        name: "Top Loot Box 头号补给盲盒"
        category: "elation"
        target: "all_enemies"
        damage_type: "imaginary"
        amount: "param(150603, 3) / enemies_alive()"
      - effect_type: "set_resource"
        resource_id: "_lootbox_p"
        amount: "res__lootbox_p * param(150603, 4)"

  # 盲盒三选一——全摘待收③（chance() hook 域编译期硬闸 + 概率分配官方未明示不脑补）：
  # ① 大剑：对生命值最高的敌人额外造成 = 本次总伤害 #5 的真伤——正解
  #   deal_damage category "true" + target {pool: "enemies", order_by: "-$it.hp", take: 1}
  #   （draft order_by 漏 `-` 降序前缀——族谱 13；amount 以本次盲盒实伤为基数的通道
  #   $last.actual_amount 链槽在案）
  # ② 炸蛋：恢复 #7=2 个战技点——gain_skill_point 通道在案（draft「未登记」挡因过期）
  # ③ 怪味豆：获得 #6=3 点 Punchline（队伍账写入——B40 原生；天赋再等量联动 Hidden MMR）

  # 秘技 150607：豆在场时每波次开始触发 1 次来自豆的 Top Loot Box（B40 ⓷ 真路由——
  # 官方 "A fixed amount of #1[i] Certified Banger is taken into account for the Elation
  # DMG dealt in this instance"：punchline_source 99 字面，勘正⑫ 兑现；均分同主干；
  # 旧「并刷新好活当赏」保守承载摘除——官方无此发放，placeholder 退役）
  - event: "on_wave_start"
    condition: "has_modifier($self, 'TECH_MUNCH_BEAN') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "朋友，这才是T0级秘技·盲盒"
        category: "elation"
        target: "all_enemies"
        damage_type: "imaginary"
        amount: "param(150603, 3) / enemies_alive()"
        punchline_source: 99

scaling_notes:
