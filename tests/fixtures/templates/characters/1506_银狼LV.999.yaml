# B40 迁移记（2026-09-15——欢愉体系基建落地后摘待收，旧待收①⑤⑦ 全兑现）：
#   ⓵ 欢愉技 150620/150621 正身——action_type follow_up → elation_skill（合法行动
#   集引擎排除手动施放；available_if Godmode 形态互斥闩保留——非 res_aha_turn 类
#   锚）；150621 六段 hook 普通伤近似 → category "elation" + amount 纯倍率 +
#   punchline_source 笑点池槽 + action_type "elation_skill" 声明；两技 hook 的
#   !$event.insert 闩摘除（trigger_action/阿哈时刻 insert=True 同发射——8009 先例）。
#   ⓶ 好活当赏 modifier 布尔闩翻案——CERTIFIED_BANGER 挂载件全摘：官方终结技/天赋
#   文本 "While holding Certified Banger"=持有前提非获得途径，旧「随状态挂载/秘技
#   刷新」保守读两件 placeholder 退役；供给=引擎 _init_aha 进战 20 点条目 + 阿哈
#   时刻结算授（值=消耗池）；门控 has_modifier → resource_of('1506',
#   'certified_banger') >= 1；退出 hook 的 banger 摘除同步删（官方退出只清 Hidden
#   MMR——条目自然 2 回合计时）；custom_resources punchline 声明退役（队伍账引擎
#   原生，8009 同案）+ banger_turns 缺省档声明（2 回合——本角色无延时件）。
#   ⓷ 欢愉伤害真路由四类——天赋追加段（150601/150602）/150608 本体（弹射压缩单段
#   +Final Hit）/盲盒主干/秘技豆：category "elation" + amount 纯倍率（ATK×倍率
#   占位退役）；punchline_source 缺省=持有者好活当赏合并值（21_elation §21.2），
#   秘技豆写 99 字面（官方 #1=99 "fixed amount ... taken into account"——勘正⑫
#   兑现）；150608 本体改 hook 承载（action 层 elation 行键=笑点池定槽，强化普攻
#   非欢愉技正解=好活当赏合并值——路由错槽不用，action scaling 摘空成容器）；
#   迁移钓出均分兑现——Final Hit "split evenly"/盲盒 "distributed evenly" 官方
#   明示，旧实现全体各吃全额（注释「均分」与代码矛盾）改 amount/enemies_alive()
#   手算分母（8010 hook 分母先例）。
#   ⓸ E4 收编——「150621 欢愉伤害额外计入 Punchline=原量×5」→ 计入总量=原量
#   ×(1+5)（EN "additionally takes into account Punchline, equal to the original
#   amount multiplied by 5"）：段 punchline_source 挂 _e4_pl_mult 闩（E4
#   on_battle_start set 5——星魂无等级轨道字面值）；大行迹 1506102 两档按官方
#   "taken into account" 拆 per-action 钩——150621 档读含倍加计入值、150620 档
#   读池快照（E4 仅及 150621）。
#   ⓹ 欢愉度两路收编——行迹属性节点 ElationDamageAddedRatioBase 0.04+0.06 折入
#   trace_stat_effects elation（B40 P1b 终审映射——CN「欢愉度强化」勿按 property
#   名映射 elation_dmg_boost；回填钓出见在案㈣）；大行迹 1506101（SPD≥160 →
#   +50%、每超 1 点 +2% 计至 100 超额——字面值 [160,0.5,1,0.02,100]）常驻件
#   stat_exprs 现场求值（三元式 1406 先例）。
#   ⓺ E6 merrymake 键收编（stat_effects all_dmg 0.5 → merrymake 0.5 增笑独立乘区，
#   乘区归属偏差就此关闭；域偏差仍在案㈢）+ 150608 增伤档换槽
#   dmg_basic_dmg_boost → dmg_final_dmg_boost（欢愉伤不吃通用增伤乘区，「为原伤害
#   的 X%」族归 final_dmg_boost 槽——爻光 E4 先例；域偏差在案㈢）+ CR 转模封顶
#   动态化（连坐勘正见在案㈣）。
