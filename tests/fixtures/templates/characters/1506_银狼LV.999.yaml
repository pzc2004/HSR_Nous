# 角色模板：银狼LV.999（1506）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 同人物多实体消歧：银狼LV.999（1506，欢愉/虚数）≠ 银狼（1106，虚无/量子）——
# 引用必须全称（AGENTS.md 命名两态）。
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
#   技能/星魂/行迹文本与 params 全表已对官方数据逐项核对（StarRailRes cn/en +
#   tbgd BPNeed/BPAdd/SPNeed + fandom 削韧；米游社无 1506 覆盖——draft 注释
#   所称「米游社 sub_tag」出处不存在，削韧实源 fandom）。
#
# 过堂勘正十四件：
#   ① mechanic_chance 字串调用（族谱 4）：draft `mechanic_chance('_lootbox_p')`
#     ——float() 死钩必炸；正解 res_ 平铺 `mechanic_chance(res__lootbox_p)`；
#   ② 盲盒三选一 `chance(0.34)` 两处：hook 域 chance() 编译期硬闸（不注入 rng），
#     且 0.34 三等分是脑补（官方未给概率分配）——三选一分支 hooks 全摘转待收
#     （产物 action 150610/150612/150618 保留；大剑 `order_by: "$it.hp"` 漏 `-`
#     降序前缀（族谱 13）、炸蛋 gain_skill_point 通道在案（draft「未登记」挡因
#     过期）一并记待收正解）；
#   ③ 天赋 CR/CD 转模烘焙死件（族谱 10）：draft HIDDEN_MMR_CRIT 走 stat_effects
#     字串——on_battle_start 挂点 res=0 烘焙成永久 0；正解 stat_exprs 通道
#     （条件光环域 res_ 平铺三域同槽，现场追踪）；
#   ④ E6 星魂件主干泄漏：draft E6_ABSOLUTE_WEAKNESS 挂主干 on_battle_start——
#     星魂前缀闸 `^(E[1-6]|S[1-6])_` 编译期炸 + E0 生效错；挪入 eidolons.E6.hooks，
#     modifier 名按 cn 官方改「禁限弱点」（draft「绝对弱点」= en 直译）；
#   ⑤ E2 额外回合：draft advance_action 100 承载 +「extra_turn 通道待收」——
#     挡因过期，grant_extra_turn 已实现（scheduler EXTRA_NORMAL 族），勘正收编；
#   ⑥ 天赋普攻追加收录：draft 挡因「on_action 载荷目标字段未登记」过期——载荷
#     词表有 target + pool "$event.target" 动态前缀通道（星期日/蒙福者族先例）；
#   ⑦ E1 易伤收录：draft 挡因「易伤乘区键未登记」过期——vulnerability 在案
#     （1306 SPK_VULN/1222 BEFOG 同族）：on_ultimate/多波次补挂 all_enemies
#     vulnerability 0.2 + 退出 hook 摘除（E0 时 remove no-op 无害）；E1②保留
#     20% MMR 维持待收（挡因改写：同事件快照语义下星魂分支覆写主 hook 数值
#     无稳定挂点——主干先 set 0，E1 钩读不到退出前快照）；
#   ⑧ 欢愉技免费施放后门（族谱 15 变体）：draft 150620/150621 挂 action_type
#     "skill" 0 SP——SP 不足时 policy want=skill 会选中欢愉技（回合内施放=
#     官方只有阿哈时刻触发）；改 "follow_up"（插入式自动件语义最近，类型不
#     匹配 policy 不会被选；阿哈时刻路由未接在案——21_elation 整体未实装）；
#   ⑨ 欢愉技+1 收录（E3/E5）：draft「挂 skill 档串档待收」——自定义 level_key
#     "elation_skill"（action + skill_params 同键；缺省回退 ultimate=10，
#     overrides {"elation_skill": 1} → lv11）——不与战技+2 串档，全收；
#   ⑩ E3 notes 实取档勘误：draft「普攻+1 实取 lv10」错——默认 basic lv6，
#     E3 → lv7（150601=1.1 / 150608=[2.64,0,100,1.1,3,60,2,0.15]）；
#   ⑪ 150601 普攻削韧补写 fandom 10（draft 漏——缺省 0=不削韧与官方不符）；
#     150602 削韧出处勘正为 fandom 10（米游社无 1506 数据）；150608 fandom
#     削韧「0.1/段+Final Hit 10 均分+总 50」三值口径冲突——段数压缩下削韧
#     总量口径不明，记待收不脑补；
#   ⑫ 秘技 99 误读：draft deal_damage amount: 99 flat（脑补占位）——官方语义=
#     该次盲盒欢愉伤按 99 点好活当赏计入笑点乘区（punchline_source；欢愉路由
#     未接——21_elation 整体未实装）；改按盲盒同基数 param(150603,3)*$self.atk
#     普通伤近似 + 注释在案；
#   ⑬ 盲盒主干条件补消耗判定：on_skill_point_change 载荷 before/after 在案——
#     官方「每消耗 1 个战技点」补 `$event.before > $event.after`（draft「增减
#     不区分或有误触发」就此关闭；花火 11306101② 同先例）；
#   ⑭ 150608 增伤档通道换位：draft 挂 on_action + stat_effects 字串烘焙——on_action
#     在 _execute_action 之后，行动本体静默不吃增伤（e2e 钓出：本体 539 无增伤、
#     Final Hit 292 有）；且 refresh 重挂烘焙陈旧（1207 驭空案）。正解：
#     dmg_basic_dmg_boost 类型桶 stat_exprs 动态追踪 + 随状态挂载（godmode 内
#     basic 类型只有 150608——150601 available_if 互斥，桶命中域与官方「强化
#     普攻期间」精确对齐；1008 阿兰 dmg_skill_dmg_boost 同族先例）；Final Hit
#     伪行动经 action_type: "basic" 声明槽同吃（1220 飞霄先例）；
#   ⑮ 150608 弹射段双倍结算摘除：draft 在 action scaling（10 档）与 hook
#     deal_damage 两处同落 #1 总倍率——e2e 实测=2.4+2.4+1.0 三倍；弹射段归
#     action 层承载（主目标单体近似、同总量），hook 只补 Final Hit 全体。
# 收录：Hidden MMR/Punchline 双自定义资源（天赋等量联动 on_resource_gain——笑点
#       全队共享语义按「不判 $event.actor」承载：任何来源获得 punchline 银狼都得
#       等量 MMR）/ 终结技 Godmode Player 状态（_godmode 闩 + grants_immune
#       ["control"] + 行动提前 100% + ult_cost_resource hidden_mmr 60 门槛扣空）
#       / 强化普攻 150608（MMR 增伤档快照烘焙 + 弹射段压缩单段 + Final Hit 全体
#       + 3 次用尽退出清资源）/ Top Loot Box 概率衰减闩（res__lootbox_p + 每次
#       成功 ×0.2、150621 重置 1.0）/ 天赋 CR/CD 转模（stat_exprs 现场追踪：CR
#       封顶 0.95=面板 100%−基础 0.05、溢出点转 CD）/ 欢愉技 150620（+15 MMR）
#       / 150621（6 段随机单体 + 概率闩重置）/ 秘技 150607（0 秘技点 + 豆在场
#       on_wave_start 盲盒同基数）/ 大行迹 1506102（两档阈值 +20/+20——「施放
#       欢愉技计入的笑点」按施放时点当前笑点快照口径）/ 1506103（进状态 +20）/
#       天赋追加（战技 all_enemies + 普攻 $event.target，Certified Banger 持有
#       条件）/ 星魂 E1（结界易伤 20%）/ E2（120/档增量 → 额外回合 + 回次数）
#       / E3/E5 等级族（含欢愉技+1）/ E6（禁限弱点 res_pen 1.0 保守读 +
#       merrymakes 按 all_dmg 0.5 承载——乘区归属偏差在案）
# 待收：①欢愉体系整体（21_elation 未实装——欢愉伤等级系数公式/笑点乘区/欢愉度
#       面板/阿哈行动条全未接路由，现役一切「欢愉伤」=普通伤近似；150608 本体
#       变欢愉伤、秘技 99 点计入、E4 Punchline×5、E6 merrymake 独立乘区同此
#       总挡因）②100 段随机弹射逐段+清场续打/额外回合事件序列（压缩为单段全额
#       随机目标+Final Hit；fandom 削韧三值冲突随此待收）③盲盒随机三选一（无
#       random-choice 通道 + 概率分配官方未明示不脑补——大剑真伤正解
#       order_by: "-$it.hp"、炸蛋 gain_skill_point 2 在案、怪味豆 punchline 3
#       在案；产物 action 保留）④E1②退出保留 20% MMR（快照覆写挂点缺）
#       ⑤大行迹 1506101 欢愉度（elation 面板键未实装；数值在案 [160,0.5,1,
#       0.02,100]）⑥E2 buff 批量延长 1 回合（adjust_duration 仅 modifier_id
#       定点，无批量通道）⑦E6 merrymake 独立乘区（现 all_dmg 0.5 近似——欢愉
#       伤不吃通用增伤，乘区归属偏差在案；且常驻近似=追加/盲盒同吃的口径偏差
#       在案）⑧目标被击败转新入场敌人的盲盒转移语义 ⑨强化普攻清场续打「每
#       回合首次触发延长全部 buff 1 回合」（同⑥批量通道缺）
