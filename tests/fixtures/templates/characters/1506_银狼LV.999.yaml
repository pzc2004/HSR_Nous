#   ① mechanic_chance 字串调用（族谱 4）：draft `mechanic_chance('_lootbox_p')`
#     ——float() 死钩必炸；正解 res_ 平铺 `mechanic_chance(res__lootbox_p)`；
#   ② 盲盒三选一 `chance(0.34)` 两处：hook 域 chance() 编译期硬闸（不注入 rng），
#     且 0.34 三等分是脑补（官方未给概率分配）——三选一分支 hooks 全摘转待收
#     （产物 action 150610/150612/150618 保留；大剑 `order_by: "$it.hp"` 漏 `-`
#     降序前缀（族谱 13）、炸蛋 gain_skill_point 通道在案（draft「未登记」挡因
#     过期）一并记待收正解）；
#   ③ 天赋 CR/CD 转模烘焙死件（族谱 10）：draft HIDDEN_MMR_CRIT 走 stat_effects
#     字串——on_battle_start 挂点 res=0 烘焙成永久 0；正解 stat_exprs 通道
#     （条件光环域 res_ 平铺三域同槽，现场追踪）；
#   ④ E6 星魂件主干泄漏：draft E6_ABSOLUTE_WEAKNESS 挂主干 on_battle_start——
#     星魂前缀闸 `^(E[1-6]|S[1-6])_` 编译期炸 + E0 生效错；挪入 eidolons.E6.hooks，
#     modifier 名按 cn 官方改「禁限弱点」（draft「绝对弱点」= en 直译）；
#   ⑤ E2 额外回合：draft advance_action 100 承载 +「extra_turn 通道待收」——
#     挡因过期，grant_extra_turn 已实现（scheduler EXTRA_NORMAL 族），勘正收编；
#   ⑥ 天赋普攻追加收录：draft 挡因「on_action 载荷目标字段未登记」过期——载荷
#     词表有 target + pool "$event.target" 动态前缀通道（星期日/蒙福者族先例）；
#   ⑦ E1 易伤收录：draft 挡因「易伤乘区键未登记」过期——vulnerability 在案
#     （1306 SPK_VULN/1222 BEFOG 同族）：on_ultimate/多波次补挂 all_enemies
#     vulnerability 0.2 + 退出 hook 摘除（E0 时 remove no-op 无害）；E1②保留
#     20% MMR 维持待收（挡因改写：同事件快照语义下星魂分支覆写主 hook 数值
#     无稳定挂点——主干先 set 0，E1 钩读不到退出前快照）；
#   ⑧ 欢愉技免费施放后门（族谱 15 变体）：draft 150620/150621 挂 action_type
