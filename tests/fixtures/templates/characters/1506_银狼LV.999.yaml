#   ⑨ 欢愉技+1 收录（E3/E5）：draft「挂 skill 档串档待收」——自定义 level_key
#     "elation_skill"（action + skill_params 同键；缺省回退 ultimate=10，
#     overrides {"elation_skill": 1} → lv11）——不与战技+2 串档，全收；
#   ⑩ E3 notes 实取档勘误：draft「普攻+1 实取 lv10」错——默认 basic lv6，
#     E3 → lv7（150601=1.1 / 150608=[2.64,0,100,1.1,3,60,2,0.15]）；
#   ⑪ 150601 普攻削韧补写 fandom 10（draft 漏——缺省 0=不削韧与官方不符）；
#     150602 削韧出处勘正为 fandom 10（米游社无 1506 数据）；150608 fandom
#     削韧「0.1/段+Final Hit 10 均分+总 50」三值口径冲突——段数压缩下削韧
#     总量口径不明，记待收不脑补；
#   ⑫ 秘技 99 误读：draft deal_damage amount: 99 flat（脑补占位）——官方语义=
#     该次盲盒欢愉伤按 99 点好活当赏计入笑点乘区（punchline_source；欢愉路由
#     未接——21_elation 整体未实装）；改按盲盒同基数 param(150603,3)*$self.atk
#     普通伤近似 + 注释在案；
#   ⑬ 盲盒主干条件补消耗判定：on_skill_point_change 载荷 before/after 在案——
#     官方「每消耗 1 个战技点」补 `$event.before > $event.after`（draft「增减
#     不区分或有误触发」就此关闭；花火 11306101② 同先例）；
#   ⑭ 150608 增伤档通道换位：draft 挂 on_action + stat_effects 字串烘焙——on_action
#     在 _execute_action 之后，行动本体静默不吃增伤（e2e 钓出：本体 539 无增伤、
#     Final Hit 292 有）；且 refresh 重挂烘焙陈旧（1207 驭空案）。正解：
#     dmg_basic_dmg_boost 类型桶 stat_exprs 动态追踪 + 随状态挂载（godmode 内
#     basic 类型只有 150608——150601 available_if 互斥，桶命中域与官方「强化
#     普攻期间」精确对齐；1008 阿兰 dmg_skill_dmg_boost 同族先例）；Final Hit
#     伪行动经 action_type: "basic" 声明槽同吃（1220 飞霄先例）；
#   ⑮ 150608 弹射段双倍结算摘除：draft 在 action scaling（10 档）与 hook
#     deal_damage 两处同落 #1 总倍率——e2e 实测=2.4+2.4+1.0 三倍；弹射段归
#     action 层承载（主目标单体近似、同总量），hook 只补 Final Hit 全体。
# 收录：Hidden MMR 资源 + 笑点队伍账（天赋等量联动 on_resource_gain——B40 后笑点
#       =引擎原生队伍账，语义按「不判 $event.actor」承载：任何来源获得 punchline
#       银狼都得等量 MMR）/ 终结技 Godmode Player 状态（_godmode 闩 + grants_immune
#       ["control"] + 行动提前 100% + ult_cost_resource hidden_mmr 60 门槛扣空）
#       / 强化普攻 150608（本体欢愉伤 hook 承载——弹射压缩单段主目标 + Final Hit
#       全体均分 + MMR 增伤档 dmg_final_dmg_boost 动态追踪 + 3 次用尽退出清资源）
#       / Top Loot Box 概率衰减闩（res__lootbox_p + 每次成功 ×0.2、150621 重置
#       1.0；基础欢愉伤全体均分）/ 天赋 CR/CD 转模（stat_exprs 现场追踪：动态封顶
#       =100%−无条件件面板、溢出点转 CD）/ 欢愉技 150620（elation_skill 正身，
#       +15 MMR）/ 150621（6 段随机单体欢愉伤 + 概率闩重置）/ 秘技 150607（0
#       秘技点 + 豆在场 on_wave_start 盲盒同基数 + 99 点好活当赏计入）/ 大行迹
#       1506101（SPD→欢愉度 stat_exprs 常驻件）/ 1506102（两档阈值 +20/+20——
#       「计入的笑点」快照口径，E4 倍加随 150621 档）/ 1506103（进状态 +20）/
#       天赋追加（战技 all_enemies + 普攻 $event.target，好活当赏条目门控）/ 星魂
#       E1（结界易伤 20%）/ E2（120/档增量 → 额外回合 + 回次数）/ E3/E5 等级族
#      （含欢愉技+1）/ E4（150621 笑点计入 ×(1+5) 闩）/ E6（禁限弱点 res_pen
#       1.0 保守读 + merrymake 0.5 增笑乘区——域偏差在案㈢）
