# 角色模板：昔涟（1415）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 收录：追忆特殊充能（上限 27 = 门槛 24 + 溢出 3（141504 #3"达到上限后还可最多溢出至
#       #3[i]点"CN 原文钉死），门槛≠扣量：首开门槛 24 实扣 12（ult_consume_amount 首实例——
#       fandom energy_cost 与 141503 params #4 双源）；涟漪态再开（141514）门槛/扣量 12（#5））/
#       战技结界（真伤压缩口径：hook on 受击事件（source=我方）→ deal_damage category:"true"
#       追加原伤害 24%——不用 Zone 系统，遐蝶境界同先例；防递归 = damage_type != 'true' 闸）/
#       141503（每场 1 次）：召唤德谬歌 + 德谬歌立即额外回合 + **activate_ultimate 全队免费开大**
#       （新原语首实例——v1 口径：插入立即发动、不耗充能，B19 待实测"是否白嫖/是否耗正常回合"）
#       + 涟漪态（state_config：普攻→141508、终结技→141514、锁战技——replaces ultimate
#       形态感知解析首实例；永续=无退出条件不授倒计时、entry_end_turn false 无"结束本回合"
#       文本；双方暴击率 +50%=昔涟形态 stat_effects + 德谬歌永续件——继承快照=编译期面板
#       不含战斗内形态件（12_summon §12.5））+ 结界永续件 /
#       141504 天赋：未来（进战+昔涟行动后授予；1415101 忆灵被召唤亦获但忆灵不消耗——
#       consume 限 character）/ 消耗未来产点（来源=行动队友——gain_resource source 覆写
#       首实例，Ode to Ego 多段计数前提）/ 开大驱散自身全部非 buff 件（读法在案：施放瞬间）/
#       全队增伤 20% 光环（effect_scope team，含后入场）/
#       1415102 战斗开始追忆档（除昔涟外「记忆」命途**或黄金裔** 1/2/≥3 名 → +2/3/6——
#       count_team(path, group) 析取通道，2026-09-10 faction/in_group 收编）/
#       1415103 三相的因果三件（速度≥180 门控：我方全体增伤 20% 光环 + 昔涟/德谬歌
#       冰抗穿超速度档——enable_if + stat_exprs 条件光环原语；忆灵侧读忆师 stat_of）/
#       德谬歌：界外三关（av:false + enemy_targetable:false + ally_targetable:false——
#       12_summon 已登记；目标池剔除由引擎通用口径承担）+ SPD 0 + Max HP=昔涟白值×(1+HP_P%)
#       活同步（2026-09-23 R-CY1 收口——base_stats 白值烘焙 + 行迹 0.1 镜像件 DEM_TRACE_HP
#       + DEM_MAXHP param(1141503,1)；team 光环辐射天然活同步，非 max_hp_ratio 定格）+ 双方 Max HP+33.6% /
#       HP% 双向同步（on_hp_decrease+on_hp_increase → set_hp_to_percent self，max_hp_of 首实例）/ 1141505 召唤驱散全队控制 /
#       1141526：Story 3 点（开大+被召唤各 +1）→ 全耗自动 Minuet（"额外回合+自动施放"
#       压缩为 trigger_action 插入施放——av:false 忆灵的额外回合唯一可观察行为即该次施放）+
#       每不同队友来源追忆 → Minuet 追加段（unique_sources−1 烘焙 ×param(1141526,1)——总伤等价、
#       实例数与官方有差在案（1141307 补差法同先例）；昔涟自身必在来源集合（首开必经其行动产点），
#       未行动纯未来灌满 24 的假想路径下 −1 少计 1 段在案）/
#       Ode 系列只做本队三件：1141519（风堇：充能 33.6 + 挂 2 层标记 + tally 加账 100.8%
#       ——gain_resource 跨 actor 写风堇 tally 首实例 + 施放战技/终结技消耗 1 层——
#       adjust_stacks 跨 actor 首实例，单通道 on_action（B37 方案 A：终结技同发，
#       双通道收编），层数门控 = stacks() 跨 actor 读首实例）/1141524（长夜月：整战斗
#       标记 + 长夜增伤件——挂/重挂双通道 + 施放战技/终结技忆质 +1——gain_resource 跨
#       actor 单通道同上）/1141517（遐蝶：整件 2026-09-10 收编——新蕊上限 max_override
#       覆写至 200% + 召唤死龙消耗溢出烘焙晦翼倍率）/1141502 泛用
#       （非黄金裔 +56% 增伤 2 回合）/
#       星魂 E1-E6（见 eidolons 块——E1 追忆+6+弹射+12 / E2 进战+12+结界真伤变档 /
#       E4 弹射倍率叠层 / E6 首开全队拉条+Ode 次数档；E3/E5 等级族）
# 待收：1141524 ②战技光环暴伤 +12%×暴伤（lv6 #3；长夜月侧烘焙联动——光环由 1413 模板自挂，
#       跨模板烘焙无通道）/
#       1141503 末句"德谬歌施放技能后持续效果 -1 回合"（其 modifier 全 duration 0 永续——
#       无可观察对象，在案）/ 1415103 冰抗穿按全队共享 res_pen 单通道承载（双方仅冰伤——
#       元素粒度不可观察，元素级 res_pen 待首个跨元素实例再收）/
#       结界真伤触发域 v1 = reason 'hit' 受击族（DoT/击破是否触发待实测 B19）/
#       141504"达到 24 驱散"读法（本版按施放瞬间驱散——"可激活终结技并解除"并列读法；
#       若实为跨档即驱散待实测 B19；remove_modifier 仅 dispellable 同长夜月口径）/
#       结界"昔涟倒下解除"（引擎口径兜住：owner 死亡其 emit hook 不执行——结界真伤自然停摆，
#       无显式摘除件）/ 忆灵技削韧回能（米游社无 1415 键、fandom 无
#       忆灵行——无源在案 0；141508 战技点 fandom +1 vs 官方"不能恢复战技点"按官方 0 在案）
# 数值：照 query-game-data params 表；action 倍率全表照抄，hook/modifier 侧系数走
#       skill_params 表 + param() 编译期引用（05_effects §5.1——2026-09-08 回填，随档）
actor_id: "1415"
name: "昔涟"
level: 80
path: "remembrance"   # 命途（count_team 编成计数口径——1415102 除昔涟计数 / 长夜月 1413103 读）
groups: ["faction:chrysos_heir"]   # 黄金裔名册（03_actor §3.1——官方献予诗系列 1141513-1141526 逐目标诗权威推断，生成器 _FACTION_ROSTERS 同源；in_group/count_team(group=) 口径）
element: "ice"   # 元素（element_of 取数源——动态元素族，03_actor §3.1；官方数据照抄）
energy_name: "追忆"      # 特殊充能显示名（官方文本「追忆」在案；遐蝶新蕊同通道）
base_stats:
  hp: 1397.088
  atk: 446.292
  def: 582.12
  spd: 110            # 101 + 行迹速度节点 ×3（+9）
  crit_rate: 0.05
  crit_dmg: 0.873     # 0.5 + 行迹暴伤节点 ×5（0.373）
  max_energy: 0       # 特殊充能：非常规能量槽（追忆激活终结技，141504；fandom 全技能回能 0）
trace_stat_effects:
  hp_pct: 0.1         # 行迹生命节点 ×2（初始 modifier 通道——pct 白值口径由引擎结算，非烘焙）
trace_notes:
  - 大行迹「记忆的净子」（1415101）：已收（队友忆灵被召唤时获【未来】；忆灵持有的【未来】
    不会被消耗——消耗 hook 限 actor_type == 'character'）
  - 大行迹「岁月的旅人」（1415102）：已收全量（战斗开始追忆档——我方除昔涟外「记忆」命途**或黄金裔** 1/2/≥3 名 → +2/3/6 点，count_team(path='remembrance', group='faction:chrysos_heir')−1 析取通道——"黄金裔或"析取支 2026-09-10 收编：Actor.groups + in_group + count_team group 参三件；名册=官方献予诗系列 1141513-1141526 逐目标诗权威推断，生成器 _FACTION_ROSTERS 单点维护）
  - 大行迹「三相的因果」（1415103）：已收三件（昔涟速度≥180 门控：①我方全体增伤 20%
    （effect_scope team 光环）②昔涟冰抗穿 = min(超出速度, 60)×2%（stat_exprs 现场求值）
    ③德谬歌同档（忆灵侧件读忆师 stat_of($self.summoner_id, 'spd')）——enable_if 门控
    04_modifier §4.16；冰抗穿按 res_pen 单通道承载——双方仅冰伤，元素粒度不可观察）

