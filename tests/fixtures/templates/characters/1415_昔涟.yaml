# 角色模板：昔涟（1415）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 收录：追忆特殊充能（上限 27 = 门槛 24 + 溢出 3（141504 #3"达到上限后还可最多溢出至
#       #3[i]点"CN 原文钉死），门槛≠扣量：首开门槛 24 实扣 12（ult_consume_amount 首实例——
#       fandom energy_cost 与 141503 params #4 双源）；涟漪态再开（141514）门槛/扣量 12（#5））/
#       战技结界（真伤压缩口径：hook on 受击事件（source=我方）→ deal_damage category:"true"
#       追加原伤害 24%——不用 Zone 系统，遐蝶境界同先例；防递归 = damage_type != 'true' 闸）/
#       141503（每场 1 次）：召唤德谬歌 + 德谬歌立即额外回合 + **activate_ultimate 全队免费开大**
#       （新原语首实例——v1 口径：插入立即发动、不耗充能，B19 待实测"是否白嫖/是否耗正常回合"）
#       + 涟漪态（state_config：普攻→141508、终结技→141514、锁战技——replaces ultimate
#       形态感知解析首实例；永续=无退出条件不授倒计时、entry_end_turn false 无"结束本回合"
#       文本；双方暴击率 +50%=昔涟形态 stat_effects + 德谬歌永续件——继承快照=编译期面板
#       不含战斗内形态件（12_summon §12.5））+ 结界永续件 /
#       141504 天赋：未来（进战+昔涟行动后授予；1415101 忆灵被召唤亦获但忆灵不消耗——
#       consume 限 character）/ 消耗未来产点（来源=行动队友——gain_resource source 覆写
#       首实例，Ode to Ego 多段计数前提）/ 开大驱散自身全部非 buff 件（读法在案：施放瞬间）/
#       全队增伤 20% 光环（effect_scope team，含后入场）/
#       1415102 战斗开始追忆档（除昔涟外「记忆」命途 1/2/≥3 名 → +2/3/6——count_team
#       编成计数通道，04_modifier §4.16；黄金裔析取支待 faction 通道在案）/
#       1415103 三相的因果三件（速度≥180 门控：我方全体增伤 20% 光环 + 昔涟/德谬歌
#       冰抗穿超速度档——enable_if + stat_exprs 条件光环原语；忆灵侧读忆师 stat_of）/
#       德谬歌：界外三关（av:false + enemy_targetable:false + ally_targetable:false——
#       12_summon 已登记；目标池剔除由引擎通用口径承担）+ SPD 0 + Max HP=昔涟×100%
#       （max_hp_ratio 1.0）+ 双方 Max HP+33.6% / HP% 双向同步（on_hp_decrease+on_hp_increase
#       → set_hp_to_percent self，max_hp_of 首实例）/ 1141505 召唤驱散全队控制 /
#       1141526：Story 3 点（开大+被召唤各 +1）→ 全耗自动 Minuet（"额外回合+自动施放"
#       压缩为 trigger_action 插入施放——av:false 忆灵的额外回合唯一可观察行为即该次施放）+
#       每不同队友来源追忆 → Minuet 追加段（unique_sources−1 烘焙 ×0.84——总伤等价、
#       实例数与官方有差在案（1141307 补差法同先例）；昔涟自身必在来源集合（首开必经其行动产点），
#       未行动纯未来灌满 24 的假想路径下 −1 少计 1 段在案）/
#       Ode 系列只做本队三件：1141519（风堇：充能 33.6 + 挂 2 层标记 + tally 加账 100.8%
#       ——gain_resource 跨 actor 写风堇 tally 首实例 + 施放战技/终结技消耗 1 层——
#       adjust_stacks 跨 actor 首实例，on_action/on_ultimate 双通道（终结技不发 on_action，
#       1413102 同先例），层数门控 = stacks() 跨 actor 读首实例）/1141524（长夜月：整战斗
#       标记 + 长夜增伤件——挂/重挂双通道 + 施放战技/终结技忆质 +1——gain_resource 跨
#       actor 双通道同上）/1141517（遐蝶：整件待收仅挂标记）/1141502 泛用
#       （非黄金裔 +56% 增伤 2 回合）/
#       星魂 E1-E6（见 eidolons 块——E1 追忆+6+弹射+12 / E2 进战+12+结界真伤变档 /
#       E4 弹射倍率叠层 / E6 首开全队拉条+Ode 次数档；E3/E5 等级族）
# 待收：1141517 献予「生死」之诗整件（新蕊溢出上限 = 资源 max 跨模板覆写——16.2
#       max_override 未收，跨 actor 写通道组不出（获得统一入口 clamp 先于一切 hook 发射，
#       溢出量在发射点已丢失）；溢出消耗/倍率烘焙随之上游缺，仅挂整战斗标记在案）/
#       1141524 ②战技光环暴伤 +16.8%×暴伤（长夜月侧烘焙联动——光环由 1413 模板自挂，
#       跨模板烘焙无通道）/
#       1141503 末句"德谬歌施放技能后持续效果 -1 回合"（其 modifier 全 duration 0 永续——
#       无可观察对象，在案）/ 1415103 冰抗穿按全队共享 res_pen 单通道承载（双方仅冰伤——
#       元素粒度不可观察，元素级 res_pen 待首个跨元素实例再收）/
#       结界真伤触发域 v1 = reason 'hit' 受击族（DoT/击破是否触发待实测 B19）/
#       141504"达到 24 驱散"读法（本版按施放瞬间驱散——"可激活终结技并解除"并列读法；
#       若实为跨档即驱散待实测 B19；remove_modifier 仅 dispellable 同长夜月口径）/
#       结界"昔涟倒下解除"（引擎口径兜住：owner 死亡其 emit hook 不执行——结界真伤自然停摆，
#       无显式摘除件）/ 忆灵技削韧回能（米游社无 1415 键、fandom 无
#       忆灵行——无源在案 0；141508 战技点 fandom +1 vs 官方"不能恢复战技点"按官方 0 在案）
# 数值：照 query-game-data params 表；action 倍率全表照抄，hook 烘焙值按 fixtures 约定
#       取默认档（basic 6 / skill 10 / ult 10 / talent 10 / 忆灵 10——数组 index = 等级-1）
actor_id: "1415"
name: "昔涟"
level: 80
path: "remembrance"   # 命途（count_team 编成计数口径——1415102 除昔涟计数 / 长夜月 1413103 读）
energy_name: "追忆"      # 特殊充能显示名（官方文本「追忆」在案；遐蝶新蕊同通道）
base_stats:
  hp: 1397.088
  atk: 446.292
  def: 582.12
  spd: 110            # 101 + 行迹速度节点 ×3（+9）
  crit_rate: 0.05
  crit_dmg: 0.873     # 0.5 + 行迹暴伤节点 ×5（0.373）
  max_energy: 0       # 特殊充能：非常规能量槽（追忆激活终结技，141504；fandom 全技能回能 0）
trace_stat_effects:
  hp_pct: 0.1         # 行迹生命节点 ×2（初始 modifier 通道——pct 白值口径由引擎结算，非烘焙）
trace_notes:
  - 大行迹「记忆的净子」（1415101）：已收（队友忆灵被召唤时获【未来】；忆灵持有的【未来】
    不会被消耗——消耗 hook 限 actor_type == 'character'）
  - 大行迹「岁月的旅人」（1415102）：已收（战斗开始追忆档——我方除昔涟外「记忆」命途角色
    1/2/≥3 名 → +2/3/6 点，count_team(path='remembrance')−1 编成计数通道，04_modifier §4.16；
    "黄金裔或"析取支待 faction 通道（in_group 登记未接线）——非「记忆」黄金裔不计入在案）
  - 大行迹「三相的因果」（1415103）：已收三件（昔涟速度≥180 门控：①我方全体增伤 20%
    （effect_scope team 光环）②昔涟冰抗穿 = min(超出速度, 60)×2%（stat_exprs 现场求值）
    ③德谬歌同档（忆灵侧件读忆师 stat_of($self.summoner_id, 'spd')）——enable_if 门控
    04_modifier §4.16；冰抗穿按 res_pen 单通道承载——双方仅冰伤，元素粒度不可观察）

custom_resources:
  recollection:
    name: "追忆"
    max: 27           # 141504 #3：门槛 24 + 溢出 3（CN"达到上限后还可最多溢出至#3[i]点"）
    ult_threshold: 24 # 141504 #4（登记口径——运行期门槛走 action.ult_cost_amount 同值）
    provenance: true  # 1141526"每 1 个不同队友来源"计数前提（"当前持有"口径，耗尽清空重计）
  _zone_ripples_latch:
    max: 1            # 预留闩（v1 未用——结界永续件靠 replace 整换幂等）

# 秘技（141507 西风尽头，宁谧永恒）：异空间（地图件不收）；持续时间内进战 → 展开战技结界
techniques:
  - technique_id: "141507"
    name: "西风尽头，宁谧永恒"
    point_cost: 1
    effects:                              # 进战一次性（战前装填预置，18.3；施放者=昔涟）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CYRENE_ZONE"
          name: "盛放吧，来世的乐土"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2                     # 与战技同款 2 回合档（#2）
          tick_anchor: "owner_turn_start" # 官方原文：昔涟每回合开始时持续回合数减 1
          dispellable: False

actions:
  - action_id: "141501"
    name: "看，希望的起始！"
    action_type: "basic"
    target_type: "single"
    damage_type: "ice"
    scaling: [{"hp": 0.25}, {"hp": 0.3}, {"hp": 0.35}, {"hp": 0.4}, {"hp": 0.45},
              {"hp": 0.5}, {"hp": 0.55}, {"hp": 0.6}, {"hp": 0.65}, {"hp": 0.7}]
    # 生命倍率普攻（官方 desc "Ice DMG equal to #1[i]% of Cyrene's Max HP"）
    toughness_dmg: 10
    skill_point_gain: 1     # fandom：战技点 +1
    energy_gain: 0          # fandom：回能 0（特殊充能角色无能量槽）
    resource_gain: {"recollection": 1}   # #2：获得 1 点追忆（全档恒 1；来源=自身——不计 Ode 队友数）

  - action_id: "141502"
    name: "盛放吧，来世的乐土"
    action_type: "skill"
    target_type: "self"     # 官方技能无选取目标（结界经本模板 hooks 结算）
    skill_point_cost: 1     # fandom：战技点 -1
    energy_gain: 0
    resource_gain: {"recollection": 3}   # #3：获得 3 点追忆（全档恒 3）

  - action_id: "141503"
    name: "诗的「◦」誓约的「∞」"
    action_type: "ultimate"
    target_type: "self"     # 召唤+状态技（副作用经本模板 hooks 结算）
    energy_gain: 0
    toughness_dmg: 0        # fandom 无削韧行——在案 0
    ult_cost_resource: "recollection"
    ult_cost_amount: 24     # 激活门槛（141504 #4：达到 24 点可激活终结技）
    ult_consume_amount: 12  # 实扣 12（fandom energy_cost "12 Recollection"+141503 params #4
                            # 双源；门槛≠扣量首实例——非遐蝶全扣族）
    ult_quick_cast: true    # 召唤+激活族（遐蝶 140703 同通道——按下即放不进确认态）

  - action_id: "141508"
    name: "向着爱与明天♪"
    action_type: "basic"
    target_type: "single"
    damage_type: "ice"
    scaling: [{"hp": 0.15}, {"hp": 0.18}, {"hp": 0.21}, {"hp": 0.24}, {"hp": 0.27},
              {"hp": 0.3}, {"hp": 0.33}, {"hp": 0.36}, {"hp": 0.39}, {"hp": 0.42}]
    # 涟漪态强化普攻（#3 单体段——lv6 0.3；#1 全体段经 hook 结算）
    toughness_dmg: 5        # fandom：主目标 5（全体段 5 在案——hook 伤害通道不削韧，1409 同先例）
    skill_point_gain: 0     # 官方 desc "cannot recover Skill Points"（fandom +1 矛盾——按官方）
    energy_gain: 0
    resource_gain: {"recollection": 3}   # #2：获得 3 点追忆（全档恒 3）

  - action_id: "141514"
    name: "一如初见的重逢"
    action_type: "ultimate"
    target_type: "self"
    energy_gain: 0
    toughness_dmg: 0
    ult_cost_resource: "recollection"
    ult_cost_amount: 12     # 涟漪态激活门槛=扣量（141504 #5；fandom "12 Recollection" 同值无冲突）
    ult_quick_cast: true

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN（数值/机制照抄 ranks_detail desc）
eidolons:
  E1:
    name: "空白，在诗篇的起点"
    hooks:
      # 德谬歌触发【献予「真我」之诗】施放【花与箭的舞曲】时：获得 6 点追忆 + 本次攻击
      # 弹射次数额外 +12——触发点与 1141526 多段 hook 同（on_action 1141501；模板建模=
      # 一切 Minuet 施放，在案）；+12 段按段倍率 84%×德谬歌生命上限烘焙单段化（1141526
      # 总伤等价同先例；随机单体；来源=昔涟——provenance −1 口径不计队友数）
      - event: "on_action"
        condition: "$event.actor == '1415_dem' && $event.action_id == '1141501'"
        effects:
          - effect_type: "gain_resource"
            resource_id: "recollection"
            amount: 6
          - effect_type: "deal_damage"
            name: "献予「真我」之诗·E1"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "ice"
            amount: "12 * 0.84 * max_hp_of('1415_dem')"
  E2:
    name: "十三种光彩，倒映明天"
    hooks:
      # ① 进入战斗额外获得 12 点追忆（与 1415102 编成档同事件叠加——官方"额外"）
      - event: "on_battle_start"
        effects:
          - effect_type: "gain_resource"
            resource_id: "recollection"
            amount: 12
      # ② 每 1 名不同我方角色获得德谬歌忆灵技增益 → 结界真伤倍率 +6%（至多 +24%=4 名）：
      # 首获去重标记（E2_ODE_COUNTED）+ 昔涟侧计数层；追加真伤 = 原伤害 ×6%×计数——
      # 与基础 24% 加算=官方"倍率提高 6%"（结界压缩口径同通道，防递归闸同 141502）
      - event: "on_action"
        condition: "$event.actor == '1415_dem' && $event.action_id == '1141502' && actor_type_of($event.target) == 'character' && !has_modifier($event.target, 'E2_ODE_COUNTED')"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "E2_ODE_COUNTED"
              name: "十三种光彩·已计"
              modifier_type: "buff"
              duration: 0
              dispellable: False
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_ZONE_ALLIES"
              name: "十三种光彩，倒映明天"
              modifier_type: "buff"
              stacks: 1
              max_stack: 4
              stack_mode: "refresh"
              duration: 0
              dispellable: False
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.damage_type != 'true' && actor_type_of($event.target) == 'monster' && actor_type_of($event.source) != 'monster' && has_modifier($self, 'CYRENE_ZONE') >= 1 && stacks($self, 'E2_ZONE_ALLIES') > 0"
        effects:
          - effect_type: "deal_damage"
            name: "十三种光彩，倒映明天"
            target: "$event.target"
            damage_type: "true"
            category: "true"
            amount: "0.06 * min(stacks($self, 'E2_ZONE_ALLIES'), 4) * $event.amount"
  E3:
    name: "因你而在，如我所书"
    skill_level_overrides: {"ultimate": 2, "talent": 2}   # 终结技+2、天赋+2
    notes:
      - "终结技+2（德谬歌生命比例/双方暴率烘焙）与天赋+2（追忆产点/全队增伤 20% 烘焙）不随档——hook 烘焙值等级参数化通道缺"
      - "忆灵技+1：官方数据忆灵技上限 10 档（StarRailRes max_level=10、params 10 行），无第 11 档可取——不脑补数值，跳过"
  E4:
    name: "请笑着，写就下一页"
    hooks:
      # 德谬歌每施放 1 次【花与箭的舞曲】→ 本场【献予「真我」之诗】弹射伤害倍率 +6%
      #（至多 24 层）：计数层 + 追加段（段数 = unique_sources−1 + E1 的 12——星魂累计
      # 激活 E4 蕴含 E1 在档，注记钉死）；声明序=先追加后叠层（本次施放不吃新层——
      # 官方"每施放 1 次后"读法，西风驻足同先例）
      - event: "on_action"
        condition: "$event.actor == '1415_dem' && $event.action_id == '1141501' && stacks($self, 'E4_MINUET_N') > 0"
        effects:
          - effect_type: "deal_damage"
            name: "献予「真我」之诗·E4"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "ice"
            amount: "(max(unique_sources('recollection') - 1, 0) + 12) * 0.06 * stacks($self, 'E4_MINUET_N') * max_hp_of('1415_dem')"
      - event: "on_action"
        condition: "$event.actor == '1415_dem' && $event.action_id == '1141501'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_MINUET_N"
              name: "请笑着，写就下一页"
              modifier_type: "buff"
              stacks: 1
              max_stack: 24
              stack_mode: "refresh"
              duration: 0
              dispellable: False
  E5:
    name: "目光，流溢昨日的花圃"
    skill_level_overrides: {"skill": 2, "basic": 1}     # 战技+2、普攻+1
    notes:
      - "战技+2（结界真伤 24% 烘焙）不随档——hook 烘焙值等级参数化通道缺；action 层普攻/强化普攻有 scaling（实取 lv7 档）"
      - "忆灵天赋+1：官方数据忆灵天赋 10 档上限，无第 11 档——跳过"
  E6:
    name: "记忆，化作涟漪片片♪"
    hooks:
      # ① 昔涟首次施放终结技 → 我方全体行动提前 100%——141503 结构性每场 1 次（涟漪态
      # 入口+不退出），无需闩
      - event: "on_ultimate"
        condition: "$event.source == '1415' && $event.action == '141503'"
        effects:
          - effect_type: "advance_action"
            target: "all_allies"
            amount: 100
      # ② 触发【献予「真我」之诗】施放 Minuet 的次数档：1 次 → 德谬歌在场时敌方全体
      # 防御 -20%（永续——德谬歌无离场路径在案）；≥2 次 → 我方全体行动提前 24%。
      # 计数层读旧值（声明序：档位件先于叠层——第 1 次 0 层判入①档，第 2 次起入②档）
      - event: "on_action"
        condition: "$event.actor == '1415_dem' && $event.action_id == '1141501' && stacks($self, 'E6_ODE_N') < 1"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E6_ODE_DEF_SHRED"
              name: "记忆，化作涟漪片片♪"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              stat_effects: {"def_pct": -0.2}
      - event: "on_action"
        condition: "$event.actor == '1415_dem' && $event.action_id == '1141501' && stacks($self, 'E6_ODE_N') >= 1"
        effects:
          - effect_type: "advance_action"
            target: "all_allies"
            amount: 24
      - event: "on_action"
        condition: "$event.actor == '1415_dem' && $event.action_id == '1141501'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_ODE_N"
              name: "记忆，化作涟漪片片♪·计数"
              modifier_type: "buff"
              stacks: 1
              max_stack: 99
              stack_mode: "refresh"
              duration: 0
              dispellable: False

state_config:
  state: "ripples"
  name: "往昔的涟漪"                    # 141503"随后进入【往昔的涟漪】状态"
  replaces_actions: {"basic": "141508", "ultimate": "141514"}
  locked_actions: ["skill"]             # 官方原文"仅能使用该普攻"
  entry_action_id: "141503"             # 首开即入涟漪（永续——"每场 1 次"由替换+不再退出结构性钉死）
  entry_end_turn: false                 # 官方无"结束本回合"文本（白厄/流萤变身族为 true 缺省）
  stat_effects: {"crit_rate": 0.5}      # 141503 #3：昔涟暴击率 +50%（并进形态标记；
                                        # 德谬歌另挂永续件——继承快照=编译期面板不含形态件）

hooks:
  # 141504 天赋·进战未来：其他我方角色及其忆灵获【未来】（我方池经 ally_targetable
  # 通用口径剔除德谬歌——"其他角色及其忆灵"本就不含她自己的忆灵）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id != '1415'"}
        modifier:
          modifier_id: "CYRENE_FUTURE"
          name: "未来"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False

  # 1415102 岁月的旅人：战斗开始追忆档——我方除昔涟外「记忆」命途 1/2/≥3 名 → +2/3/6
  #（count_team(path='remembrance')−1 编成计数通道首实例，04_modifier §4.16；
  #  "黄金裔或"析取支待 faction 通道——非「记忆」黄金裔不计入在案，见 trace_notes）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_resource"
        resource_id: "recollection"
        amount: "count_team(path='remembrance') - 1 >= 3 ? 6 : count_team(path='remembrance') - 1 == 2 ? 3 : count_team(path='remembrance') - 1 == 1 ? 2 : 0"

  # 1415103 三相的因果：昔涟速度≥180（#1）门控——①我方全体增伤 +20%（#4，effect_scope
  # team 光环，条件读携带者面板）②昔涟冰抗穿 = min(超出速度, 60（#3）)×2%（#2）（stat_exprs
  # 现场求值——速度战中变化立即变档）；德谬歌同档件见 summons hooks（04_modifier §4.16）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CYRENE_SPD_AURA"
          name: "三相的因果"
          modifier_type: "buff"
          duration: 0
          effect_scope: "team"
          dispellable: False
          enable_if: "$self.spd >= 180"
          stat_effects: {"all_dmg": 0.2}
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CYRENE_SPD_PEN"
          name: "三相的因果·冰抗穿"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "$self.spd >= 180"
          stat_exprs:
            res_pen: "min(max($self.spd - 180, 0), 60) * 0.02"

  # 141504 天赋·昔涟行动后重授未来（终结技不发 on_action——烛火起同先例双通道补发；
  # replace 幂等：已持有者整换不双计）
  - event: "on_action"
    condition: "$event.actor == '1415' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id != '1415'"}
        modifier:
          modifier_id: "CYRENE_FUTURE"
          name: "未来"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
  - event: "on_ultimate"
    condition: "$event.source == '1415'"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id != '1415'"}
        modifier:
          modifier_id: "CYRENE_FUTURE"
          name: "未来"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False

  # 1415101 记忆的净子：队友的忆灵被召唤时获【未来】（忆灵持有不消耗——见 consume hook
  # 的 character 闸；德谬歌自身排除——"队友的忆灵"）
  - event: "actor_enter"
    condition: "$event.reason == 'summon' && actor_type_of($event.actor) == 'summon' && $event.actor != '1415_dem'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "CYRENE_FUTURE"
          name: "未来"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False

  # 141504 天赋·消耗未来产点：持有【未来】的我方【角色】行动时消耗 → 昔涟 +1 追忆
  #（#1；来源 = 行动队友——gain_resource source 覆写首实例，1141526 多段计数前提；
  #  忆灵不消耗（1415101）；插入行动同消耗（v1 口径——"行动时"按 on_action 全量，B19 候选））
  - event: "on_action"
    condition: "actor_type_of($event.actor) == 'character' && $event.actor != '1415' && has_modifier($event.actor, 'CYRENE_FUTURE') >= 1"
    effects:
      - effect_type: "remove_modifier"
        target: "$event.actor"
        modifier_id: "CYRENE_FUTURE"
      - effect_type: "gain_resource"
        resource_id: "recollection"
        amount: 1
        source: "$event.actor"

  # 141504 天赋·全队增伤光环：昔涟在场时我方全体造成伤害 +20%（#2）——挂昔涟辐射全队
  #（effect_scope team，遐蝶境界同通道；含后入场忆灵）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CYRENE_TEAM_DMG"
          name: "众愿啊，汇流如歌"
          modifier_type: "buff"
          duration: 0
          effect_scope: "team"
          dispellable: False
          stat_effects: {"all_dmg": 0.2}

  # 141502 战技：展开结界（lv10 #2=2 回合，昔涟每回合开始 -1——owner_turn_start 锚）+
  # 追忆 +3 走 action.resource_gain（来源=自身）。真伤追加见下条；重挂 replace 整换刷新
  - event: "on_action"
    condition: "$event.actor == '1415' && $event.action_id == '141502' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CYRENE_ZONE"
          name: "盛放吧，来世的乐土"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          tick_anchor: "owner_turn_start"
          dispellable: False

  # 141502 结界·真伤追加（压缩口径——遐蝶境界同先例，不用 Zone 系统）：每次我方目标
  # 造成受击伤害时对同目标追加 1 段真伤 = 原伤害 ×24%（lv10 #1）。
  # 防递归闸：damage_type != 'true'（真伤自身发射带 'true'，不再触发）；触发域 v1 =
  # reason 'hit' 受击族（DoT/击破待实测 B19 在案）。"昔涟倒下结界解除"由引擎口径兜住
  #（owner 死亡其 emit hook 不执行）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && $event.damage_type != 'true' && actor_type_of($event.target) == 'monster' && actor_type_of($event.source) != 'monster' && has_modifier($self, 'CYRENE_ZONE') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "盛放吧，来世的乐土"
        target: "$event.target"
        damage_type: "true"
        category: "true"
        amount: "0.24 * $event.amount"

  # 141503 终结技（每场 1 次）：驱散自身全部非 buff 件（141504 读法：施放瞬间驱散在案；
  # remove_modifier filter 仅 dispellable——长夜月同通道口径）→ 召唤德谬歌 → 激活全队
  # 终结技（activate_ultimate 首实例：队友 ult 按编队序插入发动、不耗充能——v1 口径，
  # B19 待实测"是否白嫖/是否耗正常回合"；真人实机逐个点放选目标在案）→ 结界转永续
  #（"使战技的结界没有持续时间"——replace 整换 duration 0）。德谬歌额外回合由忆灵侧
  # actor_enter hook 授予（on_ultimate 快照时德谬歌未在场，挂不上——见 summons hooks）
  - event: "on_ultimate"
    condition: "$event.source == '1415' && $event.action == '141503'"
    effects:
      - effect_type: "remove_modifier"
        target: "self"
        filter: "$mod.kind != 'buff'"
        reason: "purify"
      - effect_type: "summon"
        summon_id: "1415_dem"
      - effect_type: "activate_ultimate"      # 缺省 other_allies（官方主语"全体队友"）
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CYRENE_ZONE"
          name: "盛放吧，来世的乐土"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0                         # 涟漪态结界没有持续时间
          dispellable: False

  # 141508 强化普攻·全体段：单体段（action scaling #3）后对敌方全体冰伤 = 昔涟生命上限
  # ×#1（lv6 0.3——两档同值）。"不能恢复战技点"已由 action.skill_point_gain 0 承载
  - event: "on_action"
    condition: "$event.actor == '1415' && $event.action_id == '141508'"
    effects:
      - effect_type: "deal_damage"
        name: "向着爱与明天♪·群攻"
        target: "all_enemies"
        damage_type: "ice"
        amount: "0.3 * $self.max_hp"

  # 1141526 献予「真我」之诗·多段：德谬歌施放 Minuet 时，每 1 个不同队友来源的追忆
  # 追加 1 段冰伤 = 德谬歌生命上限 ×84%（#1）打随机单体——unique_sources 读忆师侧
  # provenance（本 hook 挂昔涟=self 口径正确；伤害基数跨 actor 读 max_hp_of；
  # 段数烘焙单段化——总伤等价、实例数与官方有差在案（1141307 补差法同先例）；
  # −1 = 剔除昔涟自身来源（队友才计——她首开前必经行动产点必在集合；假想纯未来
  # 灌满 24 未行动路径下少计 1 段在案）；归属记昔涟（官方为德谬歌——140709 死龙半
  # 同先例在案，乘区等价、仅 damage_by_actor 分账差）
  - event: "on_action"
    condition: "$event.actor == '1415_dem' && $event.action_id == '1141501'"
    effects:
      - effect_type: "deal_damage"
        name: "献予「真我」之诗"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "ice"
        amount: "max(unique_sources('recollection') - 1, 0) * 0.84 * max_hp_of('1415_dem')"

  # 1141502 此诗，献予一切生命·泛用档：非黄金裔目标 → 增伤 +56% 2 回合（lv10 #2/#3；
  # "对忆灵也生效"由统一目标解析覆盖——本队无泛用实例，e2e 用内联队友对轴）
  - event: "on_action"
    condition: "$event.actor == '1415_dem' && $event.action_id == '1141502' && $event.target != '1407' && $event.target != '1409' && $event.target != '1413'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "CYRENE_ODE_GENERIC"
          name: "此诗，献予一切生命"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 2
          dispellable: False
          stat_effects: {"all_dmg": 0.56}

  # 1141519 献予「天空」之诗（风堇档）：施放于风堇 → 充能 33.6（lv10 #2——$event 寻址
  # 单充族同 131303 通道）+ 挂 2 层「天空」标记（持续件层数=可消耗次数）
  - event: "on_action"
    condition: "$event.actor == '1415_dem' && $event.action_id == '1141502' && $event.target == '1409'"
    effects:
      - effect_type: "gain_energy"
        target: "$event.target"
        amount: 33.6
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "CYRENE_ODE_SKY"
          name: "献予「天空」之诗"
          modifier_type: "buff"
          stacks: 2
          max_stack: 99
          stack_mode: "refresh"
          duration: 0
          dispellable: False

  # 1141519·加账：风堇持「天空」（层数>0）且提供治疗时，tally 额外多记 100.8%（lv10 #1——
  # 官方"increases the amount to be included in the tally of Little Ica's Memosprite Skill
  # by an amount equal to #1[i]% of the current healing amount"；门控源 = 风堇本人治疗，
  # 小伊卡治疗不加账）。tally 账挂风堇（1409 侧——跨重召保留）→ gain_resource 跨 actor
  # 写首实例；层数门控 = stacks() 跨 actor 读首实例（0 层视同无件——消耗尽不再加账）
  - event: "on_hp_increase"
    condition: "$event.reason == 'heal' && $event.source == '1409' && stacks('1409', 'CYRENE_ODE_SKY') > 0"
    effects:
      - effect_type: "gain_resource"
        target: "$event.source"
        resource_id: "hyacine_cumulative_heal"
        amount: "$event.amount * 1.008"

  # 1141519·消耗层：风堇施放战技/终结技后消耗 1 层「天空」（官方"After Hyacine uses
  # Skill/Ultimate, consumes 1 stack of Ode to Sky"）——on_action/on_ultimate 双通道
  #（终结技不发 on_action，1413 大行迹同先例）；adjust_stacks 跨 actor 首实例。
  # 结算序在案：同次施放先加账后消耗依赖 1409 治疗 hook 注册序先于本 hook（队伍序
  # 1409 前于 1415 即满足——demo 队天然成立；跨队序依赖的显式闸 = global/trigger_order.yaml，
  # §23.11 通道在案）
  - event: "on_action"
    condition: "$event.actor == '1409' && $event.action_id == '140902' && !$event.insert && stacks('1409', 'CYRENE_ODE_SKY') > 0"
    effects:
      - effect_type: "adjust_stacks"
        target: "$event.actor"
        modifier_id: "CYRENE_ODE_SKY"
        delta: -1
  - event: "on_ultimate"
    condition: "$event.source == '1409' && $event.action == '140903' && stacks('1409', 'CYRENE_ODE_SKY') > 0"
    effects:
      - effect_type: "adjust_stacks"
        target: "$event.source"
        modifier_id: "CYRENE_ODE_SKY"
        delta: -1

  # 1141524 献予「岁月」之诗（长夜月档）：整战斗标记挂长夜月；在场长夜增伤 +25.2%
  #（lv10 #1——all_dmg 口径，官方限定 1141307 迷梦如露，长夜 1141301 同吃在案偏差；
  #  长夜不在场=空目标 no-op）。"战技光环暴伤 +16.8%×暴伤"待收（跨模板烘焙通道缺——
  #  见文件头待收）；"施放战技/终结技后额外 +1 忆质"已收（下方双通道 hook）
  - event: "on_action"
    condition: "$event.actor == '1415_dem' && $event.action_id == '1141502' && $event.target == '1413'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "CYRENE_ODE_TIME"
          name: "献予「岁月」之诗"
          modifier_type: "buff"
          duration: 0                         # 官方原文"整场战斗生效"
          dispellable: False
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1413_evey'"}
        modifier:
          modifier_id: "CYRENE_ODE_TIME_DMG"
          name: "献予「岁月」之诗"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"all_dmg": 0.252}

  # 1141524·重挂：长夜被重新召唤时若长夜月持有「岁月」标记 → 增伤件补挂
  #（忆灵件随灭重挂通道——actor_enter 嵌套派发同 1413 E0u 先例）
  - event: "actor_enter"
    condition: "$event.actor == '1413_evey' && $event.reason == 'summon' && has_modifier('1413', 'CYRENE_ODE_TIME') >= 1"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "CYRENE_ODE_TIME_DMG"
          name: "献予「岁月」之诗"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"all_dmg": 0.252}

  # 1141524·忆质：长夜月持「岁月」标记后施放战技/终结技 → 额外 +1 忆质（lv10 #2——官方
  # "After Evernight uses Skill/Ultimate, additionally gains #2[i] Memoria"；整战斗生效=
  # 以标记持有为闸）。gain_resource 跨 actor 写（忆质 = 1413 侧资源）——on_action/
  # on_ultimate 双通道（终结技不发 on_action，1141519 消耗层同先例）
  - event: "on_action"
    condition: "$event.actor == '1413' && $event.action_id == '141302' && !$event.insert && has_modifier('1413', 'CYRENE_ODE_TIME') >= 1"
    effects:
      - effect_type: "gain_resource"
        target: "$event.actor"
        resource_id: "memoria"
        amount: 1
  - event: "on_ultimate"
    condition: "$event.source == '1413' && $event.action == '141303' && has_modifier('1413', 'CYRENE_ODE_TIME') >= 1"
    effects:
      - effect_type: "gain_resource"
        target: "$event.source"
        resource_id: "memoria"
        amount: 1

  # 1141517 献予「生死」之诗（遐蝶档）：整件待收（新蕊溢出上限需 16.2 max_override 跨模板
  # 覆写——跨 actor 写通道组不出，见文件头待收），仅挂整战斗标记（施放非静默 no-op，调试可见）
  - event: "on_action"
    condition: "$event.actor == '1415_dem' && $event.action_id == '1141502' && $event.target == '1407'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "CYRENE_ODE_LIFE_DEATH"
          name: "献予「生死」之诗"
          modifier_type: "buff"
          duration: 0
          dispellable: False

summons:
  "1415_dem":
    name: "德谬歌"
    inheritance: ["atk", "def", "crit_rate", "crit_dmg", "break_effect", "effect_hit",
                  "effect_res", "max_energy", "energy_regen", "taunt", "dmg_bonus"]
    # 部分继承（12.4 通用约定"其余面板继承忆师"的落地形）：hp 分量由 max_hp_ratio 覆写、
    # spd 由 base_stats 覆写（1141503"速度保持为 0"不随忆师——长夜 160 同先例）
    max_hp_ratio: 1.0         # 141503 #1：初始生命上限 = 昔涟 ×100%（召唤时刻有效上限定格）
    capabilities:
      av: false               # 1141503：不上行动条，只能通过额外回合行动
      enemy_targetable: false # 1141503：在场视为界外（Out-of-Bounds）——12_summon 已登记
      ally_targetable: false  # 界外=双方皆不可选（我方池通用剔除口径；单体奶/盾指不到，
                              # 全体光环/hook 直选不受影响——engine 881 注同口径）
    base_stats:
      hp: 1000                # max_hp_ratio 覆写——本块仅编译闸占位（1409/1413 同例）
      spd: 0                  # 1141503：速度保持为 0（固定值，不随忆师）
    custom_resources:
      story:
        name: "故事"
        max: 3                # 1141526 #2：Story 累计 3 点 → 全耗自动 Minuet
    actions:
      - action_id: "1141501"
        name: "花与箭的舞曲"
        action_type: "memosprite_skill"
        target_type: "aoe"
        damage_type: "ice"
        scaling: [{"hp": 0.3}, {"hp": 0.36}, {"hp": 0.42}, {"hp": 0.48}, {"hp": 0.54},
                  {"hp": 0.6}, {"hp": 0.66}, {"hp": 0.72}, {"hp": 0.78}, {"hp": 0.84}]
        # 生命倍率忆灵技（官方 desc "Ice DMG to all enemies equal to #1[i]% of Demiurge's
        # Max HP"——action 层主段；1141526 追加段由昔涟侧 hook 结算）
        toughness_dmg: 0      # 无源（米游社无 1415 键 / fandom 无忆灵行）——在案 0
        energy_gain: 0        # 无源——在案 0
      - action_id: "1141502"
        name: "此诗，献予一切生命"
        action_type: "memosprite_skill"
        target_type: "ally_single"   # 支援技：对指定我方单体（黄金裔特殊件/泛用 56% 由
                                     # 昔涟侧 hooks 按 $event.target 分档结算）
        toughness_dmg: 0
        energy_gain: 0
    hooks:
      # 1415103 三相的因果·德谬歌侧：冰抗穿超速度档读**忆师**面板（stat_of($self.summoner_id,
      # 'spd')——官方"昔涟与德谬歌的冰属性抗性穿透"按昔涟速度计档；忆灵自身 SPD 0 与判定无关；
      # res_pen 单通道承载——德谬歌仅冰伤，元素粒度不可观察，见 trace_notes）
      - event: "actor_enter"
        condition: "$event.actor == '1415_dem' && $event.reason == 'summon'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "CYRENE_SPD_PEN_DEM"
              name: "三相的因果·冰抗穿"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "stat_of($self.summoner_id, 'spd') >= 180"
              stat_exprs:
                res_pen: "min(max(stat_of($self.summoner_id, 'spd') - 180, 0), 60) * 0.02"

      # 1141505「你好，世界♪」：被召唤时解除我方全体控制类负面（remove_modifier filter
      # 首实例 141304 同通道；我方池剔除德谬歌=天然不含自身）+
      # 1141503：双方生命上限 +33.6%（lv10 #1——在场存续件）+
      # 1141526：被召唤时 Story +1 +
      # 141503："使其立即获得 1 个额外回合"（德谬歌仅由终结技召唤——召唤即授予与官方
      # 语境等价；on_ultimate 快照时未在场挂不上，故挂 actor_enter，1413 E0u 同先例）
      - event: "actor_enter"
        condition: "$event.actor == '1415_dem' && $event.reason == 'summon'"
        effects:
          - effect_type: "remove_modifier"
            target: "all_allies"
            filter: "$mod.kind == 'control'"
            reason: "purify"
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "DEM_MAXHP"
              name: "等待，在所有的过去"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"hp_pct": 0.336}
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id == '1415'"}
            modifier:
              modifier_id: "DEM_MAXHP"
              name: "等待，在所有的过去"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"hp_pct": 0.336}
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "DEM_RIPPLES_CRIT"
              name: "诗的「◦」誓约的「∞」"
              modifier_type: "buff"
              duration: 0                       # 涟漪永续——德谬歌仅由终结技召唤，进场即同寿
              dispellable: False
              stat_effects: {"crit_rate": 0.5}  # 141503 #3：德谬歌暴击率 +50%（继承快照=
                                              # 编译期面板不含战斗内形态件（12_summon §12.5），
                                              # 故另挂永续件——与昔涟侧形态件不双计）
          - effect_type: "gain_resource"
            resource_id: "story"
            amount: 1
          - effect_type: "grant_extra_turn"   # 缺省 self = 德谬歌

      # 1141526：昔涟开大时 Story +1（141503 首开档由 actor_enter 的"被召唤 +1"覆盖；
      # 本 hook 只接涟漪态再开 141514——首开瞬间德谬歌未在场快照挂不上，不会双计）
      - event: "on_ultimate"
        condition: "$event.source == '1415'"
        effects:
          - effect_type: "gain_resource"
            resource_id: "story"
            amount: 1
          - effect_type: "grant_extra_turn"   # 141514：使德谬歌立即获得 1 个额外回合

      # 1141526：Story 满 3 → 全耗 + 自动施放 Minuet（"获得 1 个额外回合并自动施放"
      # 压缩为 trigger_action 插入施放——av:false 忆灵额外回合的唯一可观察行为即该次
      # 施放；grant_extra_turn 留政策选招反而不确定，在案）
      - event: "on_resource_gain"
        condition: "$event.actor == '1415_dem' && $event.resource_id == 'story' && $event.current >= 3"
        effects:
          - effect_type: "set_resource"
            resource_id: "story"
            amount: 0
          - effect_type: "trigger_action"
            action_id: "1141501"

      # 1141503：昔涟 HP% 变化 → 德谬歌 HP% 同步（双向=增/减两通道；"HP 百分比"按
      # 昔涟当前/上限——max_hp_of 首实例；set_hp_to_percent 只作用 self 既有语义，
      # 故挂忆灵侧）。德谬歌界外不可被选——其 HP 只会经本同步变化，无反向同步需求
      - event: "on_hp_decrease"
        condition: "$event.target == '1415'"
        effects:
          - effect_type: "set_hp_to_percent"
            percent: "hp_of('1415') / max_hp_of('1415')"
      - event: "on_hp_increase"
        condition: "$event.target == '1415'"
        effects:
          - effect_type: "set_hp_to_percent"
            percent: "hp_of('1415') / max_hp_of('1415')"

scaling_notes:
  - 141503 实扣口径：门槛 24 激活、实扣 12（fandom energy_cost "12 Recollection point(s)"
    + params 第4档=12 双源）；首开余 12 恰接涟漪态 141514 门槛（天赋第5档=12）——若实测
    为全扣 24（遐蝶新蕊族口径），删 ult_consume_amount 即回落，B19 在案
  - 结界真伤基数 = $event.amount（受击实扣 HP——护盾场景按溢出后口径；demo 假人无盾
    无差，"原伤害"指乘区结算后单段值，B19 在案）
  - 未来消耗域 v1 = on_action 全量（含 trigger_action 插入施放——"行动时"按字面全收；
    终结技不发 on_action 故激活/自开的终结技不消耗未来，读法在案 B19）
  - 德谬歌暴击率：召唤继承快照=编译期面板（12_summon §12.5——不含战斗内形态件），官方
    "昔涟和德谬歌暴击率提高 50%"由忆灵侧永续件 DEM_RIPPLES_CRIT 承载（德谬歌仅由终结技
    召唤，进场即涟漪同寿）；昔涟侧走形态 stat_effects，两通道不双计
