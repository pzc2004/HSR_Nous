# 角色模板：风堇（1409）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 收录：召唤小伊卡（max_hp_ratio 0.5，12_summon v1.1 首实例）/ 双段治疗（比例+定值，
#       heal amount 首实例）/ 雨过天晴（挂风堇辐射全队生命光环，风堇回合开始走字）/
#       累计治疗 tally（挂风堇——官方"本场累计"跨重召保留：忆灵离场布场重置会清账，
#       2026-09-07 自忆灵侧迁入；忆灵技经 resource_of 读 + set_resource target 写）/
#       忆灵技 tally 直写基数区（deal_damage amount 首实例）+ 施放后清 50% + 削韧 10
#       （hook toughness_dmg 收编首实例——2026-09-07）/
#       忆灵天赋累积窗治疗（§23.9 双人件：风堇侧治疗 + 小伊卡侧自耗 4%）/
#       首召回能 45·非首召 15 / 消失拉条 30%（advance_action 收编首实例）/
#       忆灵免 debuff / 忆灵持续效果按"小伊卡施放技能"走字（双通道：回合末锚 + 插入补 tick）/
#       大行迹「暴风停歇」双件（spd>200 条件生命+20% + 超速度档治疗量——条件光环
#       enable_if/stat_exprs 首实例（04_modifier §4.16）；小伊卡侧读忆师 stat_of）
# 待收：大行迹「阴云莞尔」治疗量提高段（≤50% HP 条件治疗加成——heal 管线无命中域条件通道）、
#       大行迹「雷雨轻柔」净化段（战技/终结技解除全体 1 个负面——hook 无按数净化原语）、
#       星魂
# 数值：照 query-game-data params 表；action 倍率全表照抄，hook 烘焙值按 fixtures 约定
#       取默认档（basic 6 / skill 10 / ult 10 / talent 10 / 忆灵 10——数组 index = 等级-1）
actor_id: "1409"
name: "风堇"
level: 80
path: "remembrance"   # 命途（count_team 编成计数口径——昔涟 1415102 / 长夜月 1413103 读）
base_stats:
  hp: 1086.624
  atk: 388.08
  def: 630.63
  spd: 124            # 110 + 行迹速度节点（生成器口径照抄）
  crit_rate: 1.0      # 0.05 + 阴云莞尔 #1 暴击率+100% = 1.05（大行迹无条件段，烘焙面板——phainon 行迹
                      # 同先例）；按游戏暴击率硬上限 100% 记（rulebook crit_expected_multi/roll 双通道同口径封顶）
  crit_dmg: 0.5
  max_energy: 140     # 终结技 140（米游社/fandom 双源）
  effect_res: 0.68    # 行迹效果抵抗节点 0.18 + 雷雨轻柔 #1 效果抵抗+50%（无条件段，烘焙面板）
trace_stat_effects:
  hp_pct: 0.1         # 行迹生命节点 ×2（初始 modifier 通道——pct 白值口径由引擎结算，非烘焙）
trace_notes:
  - 大行迹「阴云莞尔」：暴击率+100% 已烘焙入 crit_rate；"为当前生命值≤50% 的我方目标提供治疗时，风堇和小伊卡的治疗量提高 25%" 待收（heal 无条件加成通道）
  - 大行迹「雷雨轻柔」：效果抵抗+50% 已烘焙入 effect_res；"施放战技和终结技时，解除我方全体 1 个负面效果" 待收（hook 无按数净化原语——remove_modifier 仅定点摘除）
  - 大行迹「暴风停歇」：已收双件（速度>200 时她与小伊卡生命上限+20%、之后每超出 1 点速度治疗量+1%（至多计入 200 点）——enable_if 门控 + stat_exprs 现场求值，04_modifier §4.16；小伊卡侧忆灵件读忆师 stat_of($self.summoner_id, 'spd')，见 summons hooks）

custom_resources:
  _ika_first_summon:
    max: 1            # 1140905「首次被召唤」每场一次标记（内部资源，_ 前缀放行）
  hyacine_cumulative_heal:
    name: "本场累计治疗"  # 1140901：本场战斗风堇与小伊卡累计治疗数值——挂风堇（官方"本场
                        # 累计"跨重召保留；曾挂小伊卡=忆灵 custom_resources v1.2 首实例，
                        # 布场重置清账偏离在案，2026-09-07 迁入忆师）
    max: "inf"

# 秘技（140907 天气正好，万物可爱！）：下次战斗开始全体治疗 30%+600、生命上限+20% 持续 2 回合
techniques:
  - technique_id: "140907"
    name: "天气正好，万物可爱！"
    point_cost: 1
    effects:                              # 进战一次性（战前装填预置，18.3；施放者=风堇）
      - effect_type: "heal"
        target: "all_allies"
        ratio: 0.3                        # #1：风堇生命上限 ×30%
        amount: 600                       # #2：+600
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "HYACINE_TECHNIQUE_HP"
          name: "天气正好，万物可爱！"
          modifier_type: "buff"
          duration: 2                     # #4：持续 2 回合
          stat_effects: {"hp_pct": 0.2}   # #3：生命上限 +20%

actions:
  - action_id: "140901"
    name: "当微风轻吻云沫"
    action_type: "basic"
    target_type: "single"
    damage_type: "wind"
    scaling: [{"hp": 0.25}, {"hp": 0.3}, {"hp": 0.35}, {"hp": 0.4}, {"hp": 0.45},
              {"hp": 0.5}, {"hp": 0.55}, {"hp": 0.6}, {"hp": 0.65}, {"hp": 0.7}]
    # 生命倍率普攻（官方 desc "Wind DMG equal to #1[i]% of Hyacine's Max HP"——
    # 生成器骨架按 atk 生成系占位误产，本版按 params 改正为 hp 系）
    toughness_dmg: 10
    skill_point_gain: 1     # 米游社：战技点 +1
    energy_gain: 20         # 米游社：回能 20

  - action_id: "140902"
    name: "爱在虹光洒落时"
    action_type: "skill"
    target_type: "self"     # 官方技能无选取目标（召唤+全体治疗经本模板 hooks 结算）
    skill_point_cost: 1     # 米游社：战技点 -1
    energy_gain: 30         # 米游社：回能 30

  - action_id: "140903"
    name: "飞入晨昏的我们"
    action_type: "ultimate"
    target_type: "self"
    energy_cost: 140
    energy_gain: 5          # 米游社：回能 5
    apply_modifiers:
      # 【雨过天晴】（lv10 #5/#3/#4：持续 3 回合，我方全体生命上限 +30% + 600）
      # 挂风堇辐射全队（含小伊卡——"我方全体目标"口径）；行动级施加=先于 on_action
      # 事件挂上，忆灵"雨过天晴期间自动施放"hook 同事件即可见
      - target: "self"
        modifier_id: "AFTER_RAIN"
        name: "雨过天晴"
        modifier_type: "buff"
        duration: 3
        tick_anchor: "owner_turn_start"   # 官方原文：风堇每回合开始时持续回合数减 1
        effect_scope: "team"
        dispellable: False
        stat_effects: {"hp_pct": 0.3, "hp": 600}

hooks:
  # 1409103 大行迹「暴风停歇」：速度>200 时她与小伊卡生命上限+20%（#2）、之后每超出 1 点
  # 速度治疗量+1%（#4，至多计入 200 点 #5）——条件光环原语首实例（04_modifier §4.16：
  # enable_if 门控 + stat_exprs 现场求值——速度战中变化立即变档；小伊卡侧件见 summons hooks）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "HYACINE_STORM_CALM"
          name: "暴风停歇"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "$self.spd > 200"
          stat_effects: {"hp_pct": 0.2}
          stat_exprs:
            heal_bonus: "min(max($self.spd - 200, 0), 200) * 0.01"

  # 140902 战技：召唤小伊卡 + 双段治疗（lv10：除小伊卡全体 8%+160 / 小伊卡 10%+200）
  - event: "on_action"
    condition: "$event.actor == '1409' && $event.action_id == '140902' && !$event.insert"
    effects:
      - effect_type: "summon"
        summon_id: "1409_ika"
      - effect_type: "heal"
        target: {pool: "allies", where: "$it.actor_id != '1409_ika'"}
        ratio: 0.08
        amount: 160
      - effect_type: "heal"
        target: {pool: "allies", where: "$it.actor_id == '1409_ika'"}
        ratio: 0.1
        amount: 200

  # 140903 终结技：召唤 + 双段治疗（lv10：除小伊卡全体 10%+200 / 小伊卡 12%+240）
  # + 1140903 雨过天晴进入档：小伊卡获 1 个额外回合
  #（"施放技能后立即获得 1 个额外回合并自动施放"——频次口径待实测（B19 候选）：
  #  官方文本亦可读作每次施放即授额外回合；本版按"进入授 1 次 + 每次施放自动施放"
  #  （下条忆灵 hook trigger_action）建模，两路径均有 e2e 覆盖）
  - event: "on_action"
    condition: "$event.actor == '1409' && $event.action_id == '140903' && !$event.insert"
    effects:
      - effect_type: "summon"
        summon_id: "1409_ika"
      - effect_type: "heal"
        target: {pool: "allies", where: "$it.actor_id != '1409_ika'"}
        ratio: 0.1
        amount: 200
      - effect_type: "heal"
        target: {pool: "allies", where: "$it.actor_id == '1409_ika'"}
        ratio: 0.12
        amount: 240
      - effect_type: "grant_extra_turn"
        target: {pool: "allies", where: "$it.actor_id == '1409_ika'"}

  # tally 记账（账挂风堇——跨重召保留，见 custom_resources 注）：风堇/小伊卡提供治疗时，
  # 按治疗实例逐目标各记一笔（与小伊卡侧 140904 增伤 hook 同一发射点、同粒度口径）
  - event: "on_hp_increase"
    condition: "$event.reason == 'heal' && ($event.source == '1409' || $event.source == '1409_ika')"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hyacine_cumulative_heal"
        amount: "$event.amount"

  # 1140905 展翼，奔向日辉：被召唤时风堇回能 15；首次被召唤额外 30（每场一次标记）
  - event: "actor_enter"
    condition: "$event.actor == '1409_ika' && $event.reason == 'summon'"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 15
  - event: "actor_enter"
    condition: "$event.actor == '1409_ika' && $event.reason == 'summon' && res__ika_first_summon < 1"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 30
      - effect_type: "gain_resource"
        resource_id: "_ika_first_summon"
        amount: 1

  # 1140906 坠落，然后飞翔：消失时风堇行动提前 30%（advance_action 收编首实例）
  - event: "actor_exit"
    condition: "$event.actor == '1409_ika'"
    effects:
      - effect_type: "advance_action"
        target: "self"
        amount: 30

  # 1140903 牵起晴空的手·治疗半（§23.9 累积窗）：除小伊卡外的我方目标 HP 降低入队，
  # 任一目标回合开始或行动后统一结算——治疗 HP 降低目标 2.8%+28（lv10 #2/#3）
  # + 额外全体 2.8%+28（#4/#5，含小伊卡）。actor_type_of 判别我方（敌方掉血不入队——
  # 忆灵技/普攻全程在打敌方，无此闸会奶到敌方还白扣小伊卡 4%）
  # 治疗挂风堇 = 比例口径正确（风堇生命上限×2.8%；官方治疗源为小伊卡——归属差异对
  # 本模板零可观察影响：tally 与 140904 增伤的双源集合都含风堇+小伊卡）
  - event: "on_hp_decrease"
    condition: "$event.target != '1409_ika' && actor_type_of($event.target) != 'monster'"
    accumulated: true
    flush_triggers: ["on_turn_start", "on_action"]
    effects:
      - effect_type: "heal"
        target: "$event.targets"
        ratio: 0.028
        amount: 28
      - effect_type: "heal"
        target: "all_allies"
        ratio: 0.028
        amount: 28

summons:
  "1409_ika":
    name: "小伊卡"
    inheritance: "full"       # 忆灵默认继承忆师面板（12.4 通用约定）；1140903"速度保持为 0"
                              # 由 capabilities.av 冻结承载（冻结后速度值不上条，纯展示差异）
    max_hp_ratio: 0.5         # 140904 #1：初始生命上限 = 风堇 ×50%（12_summon v1.1 首实例）
    capabilities:
      av: false               # 1140903：不上行动条，只能通过额外回合行动
    base_stats:
      hp: 1000                # full 继承 + max_hp_ratio 双覆写——本块仅编译闸占位
      spd: 100
    actions:
      - action_id: "1140901"
        name: "乌云乌云快走开！"
        action_type: "memosprite_skill"
        target_type: "aoe"
        damage_type: "wind"
        # 无 scaling：伤害 = tally ×28%，由本块 hooks 的 deal_damage amount 直写基数区承载；
        # 削韧 10（米游社）由该 hook deal_damage toughness_dmg 承担（action 无 scaling 不落段）
        energy_gain: 5          # 米游社：回能 5（归小伊卡——无忆灵终结技可用，纯记账）
    hooks:
      # 1140903 被动：免疫负面效果（常驻件硬拒——debuff/control/dot 三类全覆）
      - event: "actor_enter"
        condition: "$event.actor == '1409_ika'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "IKA_DEBUFF_IMMUNE"
              name: "牵起晴空的手"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              grants_immune: ["debuff", "control", "dot"]

      # 1409103「暴风停歇」小伊卡侧（条件/档位读**忆师**面板——官方"风堇的速度大于200时…
      # 她与小伊卡"：忆灵自身速度与判定无关，stat_of($self.summoner_id, 'spd') 唯一通道；
      # 重召 actor_enter 重挂——refresh 幂等）
      - event: "actor_enter"
        condition: "$event.actor == '1409_ika'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "HYACINE_STORM_CALM_IKA"
              name: "暴风停歇"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "stat_of($self.summoner_id, 'spd') > 200"
              stat_effects: {"hp_pct": 0.2}
              stat_exprs:
                heal_bonus: "min(max(stat_of($self.summoner_id, 'spd') - 200, 0), 200) * 0.01"

      # 140904 增伤（发射点与风堇侧 tally 记账 hook 同）：风堇/小伊卡提供治疗时——
      # 按治疗实例逐目标各记一层（"提供治疗时"按实例触发口径，与 tally 同粒度；
      # 若官方实为按施放一次计 1 层，待实测后改挂施放点——B19 候选）
      - event: "on_hp_increase"
        condition: "$event.reason == 'heal' && ($event.source == '1409' || $event.source == '1409_ika')"
        effects:
          # 140904 #3/#4/#5（lv10）：小伊卡伤害 +80%/层、持续 2 回合、至多 3 层——
          # 计数层 + 烘焙值双件组合（modifier stat_effects 不随层数缩放：计数值在
          # 挂新件时经 stacks() 现场烘焙，replace 整换重算——两现有件组合，零新原语）
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "IKA_HEAL_STACKS"
              name: "疗愈世间的晨曦"
              modifier_type: "buff"
              stacks: 1
              max_stack: 3
              stack_mode: "refresh"
              duration: 2
              # 1140903 末句"小伊卡施放技能后其所有持续效果 -1 回合"双通道：
              # 额外回合施放（非插入）= owner_turn_end 锚在小伊卡回合末走字（结算序在
              # 该回合忆灵技伤害之后——on_action 锚会在 _execute_action 内先于 hook 伤害
              # 走字，本回合增伤被提前吃掉，故不用）；插入式自动施放 = 下方补 tick hook
              dispellable: False
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "IKA_DMG_BOOST"
              name: "晨曦增伤"
              modifier_type: "buff"
              stack_mode: "replace"       # replace = 新件整换（烘焙值随新层数重算）
              duration: 2                 # 走字通道同 IKA_HEAL_STACKS 注
              dispellable: False
              stat_effects:
                all_dmg: "0.8 * min(stacks($self, 'IKA_HEAL_STACKS'), 3)"

      # 1140903 雨过天晴：风堇施放技能后小伊卡立即自动施放【乌云乌云快走开！】
      - event: "on_action"
        condition: "$event.actor == '1409' && !$event.insert && has_modifier('1409', 'AFTER_RAIN')"
        effects:
          - effect_type: "trigger_action"
            action_id: "1140901"

      # 1140901 结算：全体风伤 = tally ×28%（lv10 #1，amount 直写基数区——16.8 设计通道
      # 收编），施放后清空 tally 的 50%（#2；同 hook 顺序执行——先读后清，无跨 hook 时序依赖）。
      # 账挂风堇：读走 resource_of 跨 actor 通道，清走 set_resource target 跨 actor 写通道
      - event: "on_action"
        condition: "$event.actor == '1409_ika' && $event.action_id == '1140901'"
        effects:
          - effect_type: "deal_damage"
            name: "乌云乌云快走开！"
            target: "all_enemies"
            damage_type: "wind"
            amount: "resource_of('1409', 'hyacine_cumulative_heal') * 0.28"
            toughness_dmg: 10     # 米游社：忆灵技削韧 10（hook 伤害通道——2026-09-07 收编）
          - effect_type: "set_resource"
            target: {pool: "allies", where: "$it.actor_id == '1409'"}
            resource_id: "hyacine_cumulative_heal"
            amount: "resource_of('1409', 'hyacine_cumulative_heal') * 0.5"

      # 1140903 末句补：插入式施放（雨过天晴自动施放）不走回合、owner_turn_end 锚不覆盖——
      # 插入档持续效果 -1 由本 hook 补齐（声明序在结算 hook 之后=先伤害后走字；
      # 非插入档由小伊卡回合末锚走字承担，两通道按 $event.insert 互斥不重叠）
      - event: "on_action"
        condition: "$event.actor == '1409_ika' && $event.action_id == '1140901' && $event.insert"
        effects:
          - effect_type: "adjust_duration"
            modifier_id: "IKA_HEAL_STACKS"
            delta: -1
          - effect_type: "adjust_duration"
            modifier_id: "IKA_DMG_BOOST"
            delta: -1

      # 1140903 自耗半（与治疗半同累积窗同触发）：消耗自身 4% 生命上限（lv10 #1）。
      # 结算序在案：风堇侧治疗半先于本件（模板 hooks 注册序）——加算可交换，
      # 数值差异仅在贴顶/致死边界（官方序为自耗→治疗；本场景不触碰，e2e 避开边界）
      - event: "on_hp_decrease"
        condition: "$event.target != '1409_ika' && actor_type_of($event.target) != 'monster'"
        accumulated: true
        flush_triggers: ["on_turn_start", "on_action"]
        effects:
          - effect_type: "set_hp_to_percent"
            target: "self"
            percent: "$self.hp / $self.max_hp - 0.04"
