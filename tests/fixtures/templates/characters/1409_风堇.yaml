# 秘技（140907 天气正好，万物可爱！）：下次战斗开始全体治疗 30%+600、生命上限+20% 持续 2 回合
techniques:
  - technique_id: "140907"
    name: "天气正好，万物可爱！"
    point_cost: 1
    effects:                              # 进战一次性（战前装填预置，18.3；施放者=风堇）
      - effect_type: "heal"
        target: "all_allies"
        ratio: 0.3                        # #1：风堇生命上限 ×30%
        amount: 600                       # #2：+600
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "HYACINE_TECHNIQUE_HP"
          name: "天气正好，万物可爱！"
          modifier_type: "buff"
          duration: 2                     # #4：持续 2 回合
          stat_effects: {"hp_pct": 0.2}   # #3：生命上限 +20%

actions:
  - action_id: "140901"
    name: "当微风轻吻云沫"
    action_type: "basic"
    target_type: "single"
    damage_type: "wind"
    scaling: [{"hp": 0.25}, {"hp": 0.3}, {"hp": 0.35}, {"hp": 0.4}, {"hp": 0.45},
              {"hp": 0.5}, {"hp": 0.55}, {"hp": 0.6}, {"hp": 0.65}, {"hp": 0.7}]
    # 生命倍率普攻（官方 desc "Wind DMG equal to #1[i]% of Hyacine's Max HP"——
    # 生成器骨架按 atk 生成系占位误产，本版按 params 改正为 hp 系）
    toughness_dmg: 10
    skill_point_gain: 1     # 米游社：战技点 +1
    energy_gain: 20         # 米游社：回能 20

  - action_id: "140902"
    name: "爱在虹光洒落时"
    action_type: "skill"
    target_type: "self"     # 官方技能无选取目标（召唤+全体治疗经本模板 hooks 结算）
    skill_point_cost: 1     # 米游社：战技点 -1
    energy_gain: 30         # 米游社：回能 30

  - action_id: "140903"
    name: "飞入晨昏的我们"
    action_type: "ultimate"
    target_type: "self"
    energy_cost: 140
    energy_gain: 5          # 米游社：回能 5
    apply_modifiers:
      # 【雨过天晴】（#5/#3/#4：持续 3 回合，我方全体生命上限 +比例 + 定值——param 引用随档）
      # 挂风堇辐射全队（含小伊卡——"我方全体目标"口径）；行动级施加=先于 on_action
      # 事件挂上，忆灵"雨过天晴期间自动施放"hook 同事件即可见
      - target: "self"
        modifier_id: "AFTER_RAIN"
        name: "雨过天晴"
        modifier_type: "buff"
        duration: 3
        tick_anchor: "owner_turn_start"   # 官方原文：风堇每回合开始时持续回合数减 1
        effect_scope: "team"
        dispellable: False
        stat_effects: {"hp_pct": "param(140903, 3)", "hp": "param(140903, 4)"}

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN（数值/机制照抄 ranks_detail desc）
eidolons:
  E1:
    name: "呵护黑夜中的烛火"
    hooks:
      # ① 雨过天晴状态期间我方全体生命上限额外 +50%——与 140903 雨过天晴同事件同档
      #（持续 3 回合、风堇回合开始走字、挂风堇 team 光环；官方"额外提高"=独立件叠加）
      - event: "on_action"
        condition: "$event.actor == '1409' && $event.action_id == '140903' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_AFTER_RAIN_HP"
              name: "呵护黑夜中的烛火"
              modifier_type: "buff"
              duration: 3
              tick_anchor: "owner_turn_start"
              effect_scope: "team"
              dispellable: False
              stat_effects: {"hp_pct": 0.5}
      # ② 雨过天晴期间我方目标施放攻击后立即回复 = 风堇生命上限 ×8%——"施放攻击后"按
      # 我方造成受击伤害口径（reason hit、非真伤——真伤追加段为结界衍生物非"攻击"，昔涟
      # 结界防递归同闸），每次行动限 1 次（trigger_limit per_action——按次不按段/目标数）
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.damage_type != 'true' && actor_type_of($event.target) == 'monster' && actor_type_of($event.source) != 'monster' && has_modifier($self, 'AFTER_RAIN') >= 1"
        trigger_limit: {per_action: 1}
        effects:
          - effect_type: "heal"
            target: "$event.source"
            ratio: 0.08
  E2:
    name: "请来我的庭院坐坐"
    hooks:
      # 我方目标生命值降低时速度 +30%（持续 2 回合）——官方无原因限定（受击/耗血/DoT 全
      # 触发）；replace 整换刷新；23 章登记表在案实例（风堇 M2 → on_hp_decrease 速度+30%）
      - event: "on_hp_decrease"
        condition: "actor_type_of($event.target) != 'monster'"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "E2_COURTYARD_SPD"
              name: "请来我的庭院坐坐"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 2
              stat_effects: {"spd_pct": 0.3}
  E3:
    name: "出发！向阳的历险"
    skill_level_overrides: {"ultimate": 2, "basic": 1}   # 终结技+2、普攻+1
    notes:
      - "终结技+2 随档段：雨过天晴生命档（param(140903,3/4)——action apply_modifiers）+ 双段治疗（param(140903,1/2/6/7)）；小伊卡回能 1140905 属忆灵天赋档（10 档封顶不变）；action 层普攻 scaling 实取 lv7 档"
      - "忆灵技+1：官方数据忆灵技上限 10 档（StarRailRes max_level=10、params 10 行），无第 11 档可取——不脑补数值，跳过（param() 引用若越档按 cap 钳表尾+⚠编译警告，05_effects §5.1）"
  E4:
    name: "送你一颗橙晖琥珀"
    hooks:
      # 行迹【暴风停歇】强化：每超过 1 点速度（同暴风停歇口径——200 以上、至多计入 200 点）
      # 风堇与小伊卡暴击伤害额外 +2%——条件光环双件（同 1409103 通道：风堇侧读自身、
      # 小伊卡侧读忆师 stat_of；重召 actor_enter 重挂幂等）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "HYACINE_STORM_CALM_E4"
              name: "送你一颗橙晖琥珀"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "$self.spd > 200"
              stat_exprs:
                crit_dmg: "min(max($self.spd - 200, 0), 200) * 0.02"
      - event: "actor_enter"
        condition: "$event.actor == '1409_ika'"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id == '1409_ika'"}
            modifier:
              modifier_id: "HYACINE_STORM_CALM_E4_IKA"
              name: "送你一颗橙晖琥珀"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "stat_of($self.summoner_id, 'spd') > 200"
              stat_exprs:
                crit_dmg: "min(max(stat_of($self.summoner_id, 'spd') - 200, 0), 200) * 0.02"
  E5:
    name: "红霞映入海的背面"
    skill_level_overrides: {"skill": 2, "talent": 2}     # 战技+2、天赋+2
    notes:
      - "战技+2 随档段：双段治疗（param(140902,1-4)——140902 无 scaling，hook 侧治疗承接等级覆写）；天赋+2：疗愈晨曦增伤/层随档（param(140904,3)）；小伊卡生命比例 #1 维持字面值（summons max_hp_ratio 非 hook 数值槽，05_effects §5.1 边界在案）"
      - "忆灵天赋+1：官方数据忆灵天赋 10 档上限（params 10 行），无第 11 档——跳过（param() 越档钳表尾+⚠编译警告口径）"
  E6:
    name: "天空…应我的祈愿"
    hooks:
      # ① 小伊卡施放忆灵技清 tally 改为 12%（官方"清空…改为12%"=余 88%）：基础 hook 先清
      # 50%（模板声明序先于星魂——§23.11 星魂追加序），本钩把余量重设 ×1.76（=0.88/0.5）
      - event: "on_action"
        condition: "$event.actor == '1409_ika' && $event.action_id == '1140901'"
        effects:
          - effect_type: "set_resource"
            target: {pool: "allies", where: "$it.actor_id == '1409'"}
            resource_id: "hyacine_cumulative_heal"
            amount: "resource_of('1409', 'hyacine_cumulative_heal') * 1.76"
      # ② 小伊卡在场时我方全体全属性抗性穿透 +20%——进场挂/离场摘（挂风堇 team 光环，
      # 重召 replace 幂等；res_pen 单通道承载，mechanics 02 口径）
      - event: "actor_enter"
        condition: "$event.actor == '1409_ika' && $event.reason == 'summon'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_SKY_RES_PEN"
              name: "天空…应我的祈愿"
              modifier_type: "buff"
              duration: 0
              effect_scope: "team"
              dispellable: False
              stat_effects: {"res_pen": 0.2}
      - event: "actor_exit"
        condition: "$event.actor == '1409_ika'"
        effects:
          - effect_type: "remove_modifier"
            modifier_id: "E6_SKY_RES_PEN"

hooks:
  # 1409103 大行迹「暴风停歇」：速度>200 时她与小伊卡生命上限+20%（#2）、之后每超出 1 点
  # 速度治疗量+1%（#4，至多计入 200 点 #5）——条件光环原语首实例（04_modifier §4.16：
  # enable_if 门控 + stat_exprs 现场求值——速度战中变化立即变档；小伊卡侧件见 summons hooks）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "HYACINE_STORM_CALM"
          name: "暴风停歇"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "$self.spd > 200"
          stat_effects: {"hp_pct": 0.2}
          stat_exprs:
            heal_bonus: "min(max($self.spd - 200, 0), 200) * 0.01"

  # 1409102 大行迹「雷雨轻柔」净化段（#2=1）：施放战技/终结技时解除我方全体 1 个负面——
  # remove_modifier filter+max_count 收编（龙灵同通道，逐目标 LIFO 截断；摘哪枚官方未指明
  # 待实测 B19）；双通道（B37：终结技不发 on_action——战技走 on_action、终结技走 on_ultimate）
  - event: "on_action"
    condition: "$event.actor == '1409' && $event.action_id == '140902' && !$event.insert"
    effects:
      - effect_type: "remove_modifier"
        target: "all_allies"
        filter: "$mod.modifier_type == 'debuff'"
        max_count: 1
        reason: "purify"
  - event: "on_ultimate"
    condition: "$event.source == '1409' && $event.action == '140903'"
    effects:
      - effect_type: "remove_modifier"
        target: "all_allies"
        filter: "$mod.modifier_type == 'debuff'"
        max_count: 1
        reason: "purify"

  # 140902 战技：召唤小伊卡 + 双段治疗（除小伊卡全体 #1/#2 / 小伊卡 #3/#4——param 引用随档）
  - event: "on_action"
    condition: "$event.actor == '1409' && $event.action_id == '140902' && !$event.insert"
    effects:
      - effect_type: "summon"
        summon_id: "1409_ika"
      - effect_type: "heal"
        target: {pool: "allies", where: "$it.actor_id != '1409_ika'"}
        ratio: "param(140902, 1)"
        amount: "param(140902, 2)"
      - effect_type: "heal"
        target: {pool: "allies", where: "$it.actor_id == '1409_ika'"}
        ratio: "param(140902, 3)"
        amount: "param(140902, 4)"

  # 140903 终结技：召唤 + 双段治疗（除小伊卡全体 #1/#2 / 小伊卡 #6/#7——param 引用随档）
  # + 1140903 雨过天晴进入档：小伊卡获 1 个额外回合
  #（"施放技能后立即获得 1 个额外回合并自动施放"——频次口径待实测（B19 候选）：
  #  官方文本亦可读作每次施放即授额外回合；本版按"进入授 1 次 + 每次施放自动施放"
  #  （下条忆灵 hook trigger_action）建模，两路径均有 e2e 覆盖）
  - event: "on_action"
    condition: "$event.actor == '1409' && $event.action_id == '140903' && !$event.insert"
    effects:
      - effect_type: "summon"
        summon_id: "1409_ika"
      - effect_type: "heal"
        target: {pool: "allies", where: "$it.actor_id != '1409_ika'"}
        ratio: "param(140903, 1)"
        amount: "param(140903, 2)"
      - effect_type: "heal"
        target: {pool: "allies", where: "$it.actor_id == '1409_ika'"}
        ratio: "param(140903, 6)"
        amount: "param(140903, 7)"
      - effect_type: "grant_extra_turn"
        target: {pool: "allies", where: "$it.actor_id == '1409_ika'"}

  # tally 记账（账挂风堇——跨重召保留，见 custom_resources 注）：风堇/小伊卡提供治疗时，
  # 按治疗实例逐目标各记一笔（与小伊卡侧 140904 增伤 hook 同一发射点、同粒度口径）
  - event: "on_hp_increase"
    condition: "$event.reason == 'heal' && ($event.source == '1409' || $event.source == '1409_ika')"
    effects:
      - effect_type: "gain_resource"
        resource_id: "hyacine_cumulative_heal"
        amount: "$event.amount"

  # 1140905 展翼，奔向日辉：被召唤时风堇回能 #1；首次被召唤额外 #2（每场一次标记）
  - event: "actor_enter"
    condition: "$event.actor == '1409_ika' && $event.reason == 'summon'"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: "param(1140905, 1)"
  - event: "actor_enter"
    condition: "$event.actor == '1409_ika' && $event.reason == 'summon' && res__ika_first_summon < 1"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: "param(1140905, 2)"
      - effect_type: "gain_resource"
        resource_id: "_ika_first_summon"
        amount: 1

  # 1140906 坠落，然后飞翔：消失时风堇行动提前（#1——advance_action 为百分数槽 ×100）
  - event: "actor_exit"
    condition: "$event.actor == '1409_ika'"
    effects:
      - effect_type: "advance_action"
        target: "self"
        amount: "param(1140906, 1) * 100"

  # 1140903 牵起晴空的手·治疗半（§23.9 累积窗）：除小伊卡外的我方目标 HP 降低入队，
  # 任一目标回合开始或行动后统一结算——治疗 HP 降低目标 #2/#3 + 额外全体 #4/#5（含小伊卡）。
  # actor_type_of 判别我方（敌方掉血不入队——忆灵技/普攻全程在打敌方，无此闸会奶到敌方
  # 还白扣小伊卡 4%）
  # 治疗挂风堇 = 比例口径正确（风堇生命上限×比例；官方治疗源为小伊卡——归属差异对
  # 本模板零可观察影响：tally 与 140904 增伤的双源集合都含风堇+小伊卡）
  - event: "on_hp_decrease"
    condition: "$event.target != '1409_ika' && actor_type_of($event.target) != 'monster'"
    accumulated: true
    flush_triggers: ["on_turn_start", "on_action"]
    effects:
      - effect_type: "heal"
        target: "$event.targets"
        ratio: "param(1140903, 2)"
        amount: "param(1140903, 3)"
      - effect_type: "heal"
        target: "all_allies"
        ratio: "param(1140903, 4)"
        amount: "param(1140903, 5)"

summons:
  "1409_ika":
    name: "小伊卡"
    inheritance: "full"       # 忆灵默认继承忆师面板（12.4 通用约定）；1140903"速度保持为 0"
                              # 由 capabilities.av 冻结承载（冻结后速度值不上条，纯展示差异）
    max_hp_ratio: 0.5         # 140904 #1：初始生命上限 = 风堇 ×50%（12_summon v1.1 首实例）
    capabilities:
      av: false               # 1140903：不上行动条，只能通过额外回合行动
    base_stats:
      hp: 1000                # full 继承 + max_hp_ratio 双覆写——本块仅编译闸占位
      spd: 100
    actions:
      - action_id: "1140901"
        name: "乌云乌云快走开！"
        action_type: "memosprite_skill"
        target_type: "aoe"
        damage_type: "wind"
        # 无 scaling：伤害 = tally ×28%，由本块 hooks 的 deal_damage amount 直写基数区承载；
        # 削韧 10（米游社）由该 hook deal_damage toughness_dmg 承担（action 无 scaling 不落段）
        energy_gain: 5          # 米游社：回能 5（归小伊卡——无忆灵终结技可用，纯记账）
    hooks:
      # 1140903 被动：免疫负面效果（常驻件硬拒——debuff/control/dot 三类全覆）
      - event: "actor_enter"
        condition: "$event.actor == '1409_ika'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "IKA_DEBUFF_IMMUNE"
              name: "牵起晴空的手"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              grants_immune: ["debuff", "control", "dot"]

      # 1409103「暴风停歇」小伊卡侧（条件/档位读**忆师**面板——官方"风堇的速度大于200时…
      # 她与小伊卡"：忆灵自身速度与判定无关，stat_of($self.summoner_id, 'spd') 唯一通道；
      # 重召 actor_enter 重挂——refresh 幂等）
      - event: "actor_enter"
        condition: "$event.actor == '1409_ika'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "HYACINE_STORM_CALM_IKA"
              name: "暴风停歇"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "stat_of($self.summoner_id, 'spd') > 200"
              stat_effects: {"hp_pct": 0.2}
              stat_exprs:
                heal_bonus: "min(max(stat_of($self.summoner_id, 'spd') - 200, 0), 200) * 0.01"

      # 140904 增伤（发射点与风堇侧 tally 记账 hook 同）：风堇/小伊卡提供治疗时——
      # 按治疗实例逐目标各记一层（"提供治疗时"按实例触发口径，与 tally 同粒度；
      # 若官方实为按施放一次计 1 层，待实测后改挂施放点——B19 候选）
      - event: "on_hp_increase"
        condition: "$event.reason == 'heal' && ($event.source == '1409' || $event.source == '1409_ika')"
        effects:
          # 140904 #3/#4/#5（lv10）：小伊卡伤害 +80%/层、持续 2 回合、至多 3 层——
          # 计数层 + 烘焙值双件组合（modifier stat_effects 不随层数缩放：计数值在
          # 挂新件时经 stacks() 现场烘焙，replace 整换重算——两现有件组合，零新原语）
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "IKA_HEAL_STACKS"
              name: "疗愈世间的晨曦"
              modifier_type: "buff"
              stacks: 1
              max_stack: 3
              stack_mode: "refresh"
              duration: 2
              # 1140903 末句"小伊卡施放技能后其所有持续效果 -1 回合"双通道：
              # 额外回合施放（非插入）= owner_turn_end 锚在小伊卡回合末走字（结算序在
              # 该回合忆灵技伤害之后——on_action 锚会在 _execute_action 内先于 hook 伤害
              # 走字，本回合增伤被提前吃掉，故不用）；插入式自动施放 = 下方补 tick hook
              dispellable: False
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "IKA_DMG_BOOST"
              name: "晨曦增伤"
              modifier_type: "buff"
              stack_mode: "replace"       # replace = 新件整换（烘焙值随新层数重算）
              duration: 2                 # 走字通道同 IKA_HEAL_STACKS 注
              dispellable: False
              stat_effects:
                all_dmg: "param(140904, 3) * min(stacks($self, 'IKA_HEAL_STACKS'), 3)"

      # 1140903 雨过天晴：风堇施放技能后小伊卡立即自动施放【乌云乌云快走开！】
      - event: "on_action"
        condition: "$event.actor == '1409' && !$event.insert && has_modifier('1409', 'AFTER_RAIN')"
        effects:
          - effect_type: "trigger_action"
            action_id: "1140901"

      # 1140901 结算：全体风伤 = tally ×#1（amount 直写基数区——16.8 设计通道
      # 收编），施放后清空 tally 的 #2（同 hook 顺序执行——先读后清，无跨 hook 时序依赖）。
      # 账挂风堇：读走 resource_of 跨 actor 通道，清走 set_resource target 跨 actor 写通道
      - event: "on_action"
        condition: "$event.actor == '1409_ika' && $event.action_id == '1140901'"
        effects:
          - effect_type: "deal_damage"
            name: "乌云乌云快走开！"
            target: "all_enemies"
            damage_type: "wind"
            amount: "resource_of('1409', 'hyacine_cumulative_heal') * param(1140901, 1)"
            toughness_dmg: 10     # 米游社：忆灵技削韧 10（hook 伤害通道——2026-09-07 收编）
          - effect_type: "set_resource"
            target: {pool: "allies", where: "$it.actor_id == '1409'"}
            resource_id: "hyacine_cumulative_heal"
            amount: "resource_of('1409', 'hyacine_cumulative_heal') * param(1140901, 2)"

      # 1140903 末句补：插入式施放（雨过天晴自动施放）不走回合、owner_turn_end 锚不覆盖——
      # 插入档持续效果 -1 由本 hook 补齐（声明序在结算 hook 之后=先伤害后走字；
      # 非插入档由小伊卡回合末锚走字承担，两通道按 $event.insert 互斥不重叠）
      - event: "on_action"
        condition: "$event.actor == '1409_ika' && $event.action_id == '1140901' && $event.insert"
        effects:
          - effect_type: "adjust_duration"
            modifier_id: "IKA_HEAL_STACKS"
            delta: -1
          - effect_type: "adjust_duration"
            modifier_id: "IKA_DMG_BOOST"
            delta: -1

      # 1140903 自耗半（与治疗半同累积窗同触发）：消耗自身生命上限 #1（4% 族）。
      # 结算序在案：风堇侧治疗半先于本件（模板 hooks 注册序）——加算可交换，
      # 数值差异仅在贴顶/致死边界（官方序为自耗→治疗；本场景不触碰，e2e 避开边界）
      - event: "on_hp_decrease"
        condition: "$event.target != '1409_ika' && actor_type_of($event.target) != 'monster'"
        accumulated: true
        flush_triggers: ["on_turn_start", "on_action"]
        effects:
          - effect_type: "set_hp_to_percent"
            target: "self"
            percent: "$self.hp / $self.max_hp - param(1140903, 1)"
