      - "已收于神君 hooks（每段命中 → 目标 vulnerability +0.12（过堂修正：draft 误写 dmg_taken 未知键=静默死键），max_stack 3，duration 1 tick_anchor owner_turn_end）"
      - "堆叠语义勘正：refresh 实为**累加** stacks（min(存+新, max_stack)——modifiers 合层逻辑，层数可至 cap 3）；数值欠叠加的真因 = stat_effects flat 不按层乘（l1 平铺每件计一次）——按层伸缩值通道 hit_stat_exprs 在库（per-hit 按层数伸缩，2026-09-23 落地），迁移待判例；「持续至神君当前回合结束」精确清除时点待实测"

