  E6:
    name: "Sweep, Souls Slain"
    hooks:
      # 神君命中 → 目标易伤 +12%（叠层上限 3）——E6 机制挂 E6 块（draft 错挂常驻神君钩
      # 导致 E0 也生效：首段 213 挂易伤后段 238 的实证钓出；叠层 refresh 承载，叠加通道在案）
