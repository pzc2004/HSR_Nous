# 角色模板：景元（1204）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂修正（staging→fixtures 合并流水线）
#
# 过堂修正三件（打标稿实证 bug）：① LORD_SPD 段速公式（draft 写 10×(3+hits) 开局
#   30 误——官方"基础速度 60，每叠加一段 +10"=60+增量×10，base_stats.spd=60 承载）
#   ② E6 易伤键 dmg_taken（未知 stat 键=静默死键）→ vulnerability 0.12
#   ③ WAR_MARSHAL crit_rate 字面量归 stat_effects（stat_exprs 是动态求值槽，通道误用）
#
# 收录：开战召唤神君（独立面板=景元白值烘焙+spd 60+全自动）/ 段数计数与行动末清零
#       / 战技 +2 段、终结技 +3 段（cap 10）/ 段速 60+增量×10（stat_exprs 动态）/
#       神君分段弹射（基础 3 段 + 条件段逐档放行至 10，expected 确定化按序取首）/
#       每段削韧 5（hook toughness_dmg 通道）/ Battalia Crush ≥6 段暴伤门控 /
#       Savant Providence 进战回 15 能 / War Marshal 战技后暴击率 +10% /
#       秘技首回合 +3 段（闩读到+末清）/ E2 景元增伤 / E4 每段回能 2 /
#       E6 易伤叠层（refresh 承载，叠加通道待编译确认在案）/ E3/E5 等级族
# 待收（均带挡因）：神君相邻溅射 25%（120404 #5 / E1 追加 +25%——相邻谓词通道缺，
#       host 函数表无 adjacency 项；demo 单体无观察差，多体实例到达时须补）/
#       神君受景元控制类 debuff 无法行动（召唤物行动门控通道未接线）/
#       景元行迹平铺属性节点（官方节点明细未见）/ 120406「攻击」占位条目
actor_id: "1204"
name: "景元"
level: 80
path: "erudition"     # 智识（官方内部类目 Mage ↔ erudition canonical；count_team 编成计数口径）
groups: ["faction:xianzhou_luofu"]   # 仙舟「罗浮」云骑将军（官方阵营文本；in_group 口径）
element: "thunder"    # 元素（element_of 取数源——官方数据照抄）
base_stats:
  hp: 1164.24         # 官方 calc lv80（唯一照抄源；tbgd 白值页交叉一致）
  atk: 698.544
  def: 485.1
  spd: 99             # 管线实值；行迹速度百分比节点不并入（trace_stat_effects 通道）
  crit_rate: 0.05     # 管线实值（景元行迹无暴击率平铺节点数据在案）
  crit_dmg: 0.5       # 管线实值
  max_energy: 130     # 终结技需求能量（官方本体；tbgd「能量 130」交叉一致）
trace_stat_effects: {}
trace_notes:
  - "大行迹「Battalia Crush」（1204101）已收：神君下一次行动段数 ≥6（字面值 6）时该次行动暴伤 +25%（字面值 0.25）——enable_if 门控挂神君（04_modifier §4.16 面板读取即重估，段数资源为动态表达式）"
  - "大行迹「Savant Providence」（1204102）已收：战斗开始回复 15 能量（字面值 15，行迹无等级轨道）——gain_energy 钩（energy 内建资源，禁 res_ 化）"
  - "大行迹「War Marshal」（1204103）已收：使用战技后景元暴击率 +10%（字面值 0.10），持续 2 回合（字面值 2）——EN \"After the Skill is used\" 仅战技（on_action 过滤 action_id 120402）"
  - "景元行迹平铺属性节点（雷伤/攻/HP 等）未见官方节点明细——base_stats 维持 calc 管线实值；若有平铺节点数据再行并入（≥管线值口径）"

