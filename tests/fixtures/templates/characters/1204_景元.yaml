        condition: "$event.source == '1204_lord' && $event.reason == 'hit'"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "S6_LORD_VULNERABLE"
              name: "Sweep, Souls Slain"
              modifier_type: "debuff"
              stacks: 1
              max_stack: 3
              stack_mode: "refresh"
              duration: 1
              tick_anchor: "owner_turn_end"
              dispellable: True
              stat_effects: {"vulnerability": 0.12}
