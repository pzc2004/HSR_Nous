summons:
  "1204_lord":
    name: "神君"
    control: "auto"       # 全自动：按自身速度条行动，玩家不可直接操控、目标随机不可选（官方文本）
    inheritance: "none"   # 面板照景元 lv80 面板烘焙互指（官方每段倍率基数为景元 ATK）；hp 分量不继承
    base_stats:
      hp: 1164.24         # 照景元面板烘焙（神君 HP 无官方语义——不参与承伤模型，占位）
      atk: 698.544        # 照景元面板烘焙（改景元面板须同步）
      def: 485.1
      spd: 60             # 120404 #1：基础速度 60（各档不变）；段数加成见 LORD_SPD modifier
      crit_rate: 0.05     # 照景元面板烘焙
      crit_dmg: 0.5       # 照景元面板烘焙（1204101 暴伤件挂本体 modifier 通道）
    custom_resources:
      lord_hits:          # 段数增量计数（基础段数 3 隐含；总段数 = min(3 + res_lord_hits, 10)）
        max: 7            # = 段数上限 10 - 基础 3
    actions:
      - action_id: "120404"
        name: "斩勘神形"
        action_type: "follow_up"   # 官方 Talent 类攻击 → follow_up（EN：hits are considered as Follow-Up ATKs）
        target_type: "aoe"         # 弹射随机单体走 hook 目标代数（bounce 类型通道未接线——占位 aoe）
        damage_type: "thunder"
        # 无 scaling：每段伤害 = param(120404,2)×景元 ATK，走 hook deal_damage（逐段随机单体）
        toughness_dmg: 0  # 逐段削韧 5 由 hook deal_damage 各段承担
        energy_gain: 0    # tbgd：神君行动本体回能 0
    hooks:
      - event: "on_action"
        condition: "$event.actor == '1204' && $event.action_id == '120402' && !$event.insert"
        effects:
          - effect_type: "gain_resource"
            resource_id: "lord_hits"
            amount: "min(param(120402, 2), 7 - res_lord_hits)"
      - event: "on_action"
        condition: "$event.actor == '1204' && $event.action_id == '120403' && !$event.insert"
        effects:
          - effect_type: "gain_resource"
            resource_id: "lord_hits"
            amount: "min(param(120403, 2), 7 - res_lord_hits)"
      - event: "on_turn_start"
        condition: "$event.actor == '1204_lord' && resource_of('1204', '_tech_armed') >= 1"
        effects:
          - effect_type: "gain_resource"
            resource_id: "lord_hits"
            amount: "min(3, 7 - res_lord_hits)"

      - event: "actor_enter"
        condition: "$event.actor == '1204_lord'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "LORD_SPD"
              name: "神君·段数加速"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_exprs: {"spd": "10 * res_lord_hits"}   # 官方：每叠加一段 +10（增量计数）
                                    # ——draft 误写 10×(3+hits)（开局 30 段速=公式误读，过堂钓出；
                                    #    基础速度 60 由 base_stats 承载）

      - event: "on_action"
        condition: "$event.actor == '1204_lord' && $event.action_id == '120404' && !$event.insert"
        effects:
          - effect_type: "deal_damage"
            name: "斩勘神形"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "thunder"
            amount: "param(120404, 2) * $self.atk"
            toughness_dmg: 5
          - effect_type: "deal_damage"
            name: "斩勘神形"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "thunder"
            amount: "param(120404, 2) * $self.atk"
            toughness_dmg: 5
          - effect_type: "deal_damage"
