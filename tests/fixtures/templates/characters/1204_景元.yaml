hooks:
  - event: "on_battle_start"
    effects:
      - effect_type: "summon"
        summon_id: "1204_lord"
      - effect_type: "gain_energy"
        amount: 15
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1204_lord'"}
        modifier:
          modifier_id: "LORD_BATTALIA_CRUSH"
          name: "Battalia Crush"
          modifier_type: "buff"
          duration: 1
          tick_anchor: "owner_turn_start"
          dispellable: False
          enable_if: "3 + res_lord_hits >= 6"
          stat_exprs: {"crit_dmg": "0.25"}

  - event: "on_hp_decrease"
    condition: "$event.target == '1204' && hp_of($event.target) <= 0"
    effects:
      - effect_type: "dismiss_summon"
        summon_id: "1204_lord"

  - event: "on_turn_end"
    condition: "$event.actor == '1204_lord'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_tech_armed"
        amount: 0

  - event: "on_action"
    condition: "$event.actor == '1204' && $event.action_id == '120402' && !$event.insert"
    effects:
