        toughness_dmg: 20

hooks:
  # 天赋 130804：任意单位施放技能期间使敌方陷入负面 → 黄泉 +1 残梦 + 集真赤最多敌 +1 结
  #（「每次施放技能最多触发 1 次」上限闩待收——现每次 debuff 应用计 1）；
  # _talent_guard 递归闩：本钩自身挂的结不再触发本钩（1102 _bf_proc/1308 _seg_guard
  # 同族——无闩时 debuff→结→再触发 链式打到双 cap 实证）
  - event: "after_apply_modifier"
    condition: "$event.modifier_type == 'debuff' && actor_type_of($event.target) == 'monster' && has_modifier($self, 'ULT_KNOT_LOCK') < 1 && res__talent_guard < 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "slashed_dream"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_talent_guard"
        amount: 1
      - effect_type: "apply_modifier"
        target: {pool: "enemies", order_by: "-stacks($it, 'CRIMSON_KNOT')", take: 1}
        modifier:
          modifier_id: "CRIMSON_KNOT"
          name: "绯红结"
          modifier_type: "debuff"
          stacks: 1
          max_stack: 9
          duration: 0
          dispellable: False
      - effect_type: "set_resource"
        resource_id: "_talent_guard"
        amount: 0

  # 天赋：敌离场/被灭 → 集真赤转移至全场结最多敌
  - event: "actor_exit"
    condition: "actor_type_of($event.actor) == 'monster' && stacks($event.actor, 'CRIMSON_KNOT') >= 1"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "enemies", order_by: "-stacks($it, 'CRIMSON_KNOT')", take: 1}
        modifier:
          modifier_id: "CRIMSON_KNOT"
          name: "绯红结"
          modifier_type: "debuff"
          stacks: "stacks($event.actor, 'CRIMSON_KNOT')"
          max_stack: 9
          duration: 0
          dispellable: False

  # 战技：+1 残梦 + 指定目标 +1 结（draft「指定目标待收」补收——$event.target 通道）
  - event: "on_action"
    condition: "$event.actor == '1308' && $event.action_id == '130802' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "slashed_dream"
        amount: 1
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "CRIMSON_KNOT"
          name: "绯红结"
          modifier_type: "debuff"
          stacks: 1
          max_stack: 9
          duration: 0
          dispellable: False

  # 行迹 1 溢出半：残梦溢出 → 四相断我层数（on_resource_gain overflow 字段——引擎补口；
  # stacks 只收 int 字面量（1218 E6 同族钉）：apply 1 层建件 + adjust_stacks 补
  # （overflow-1）表达式差量（max_stack 3 自然截断，与秘技/波次层同池）
  - event: "on_resource_gain"
    condition: "$event.resource_id == 'slashed_dream' && $event.overflow > 0"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "QUADRIVALENT_ASCENDANCE"
          name: "四相断我状态"
          modifier_type: "buff"
          stacks: 1
          max_stack: 3
          duration: 0
          dispellable: False
      - effect_type: "adjust_stacks"
        modifier_id: "QUADRIVALENT_ASCENDANCE"
        delta: "$event.overflow - 1"

  # 啼泽雨斩段序计数 + 摘结 + 结爆（单钩三件——on_hp_decrease 载荷无 action_id/
  # target_type，以 action_type='ultimate' 兜全部大招命中；结爆嵌套命中经 _seg_guard
  # 闩出集（否则结爆自身也进计数——1102 _bf_proc/1004 _e1_proc 同族）：
  # effects 序读现场——先计数、_ult_seg 1-3 才摘结/结爆、n=0 结爆量 0=不发
  - event: "on_hp_decrease"
    condition: "$event.source == '1308' && $event.action_type == 'ultimate' && $event.reason == 'hit' && actor_type_of($event.target) == 'monster' && res__seg_guard < 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_ult_seg"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_knots_n"
        amount: "min(3, stacks($event.target, 'CRIMSON_KNOT')) * (res__ult_seg <= 3)"
      - effect_type: "adjust_stacks"
        target: "$event.target"
        modifier_id: "CRIMSON_KNOT"
        delta: "-res__knots_n"
      - effect_type: "set_resource"
        resource_id: "_seg_guard"
        amount: 1
      - effect_type: "deal_damage"
        name: "啼泽雨斩·结爆"
        target: "all_enemies"
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "min(param(130803, 2) * (1 + res__knots_n), param(130803, 5)) * $self.atk * (res__knots_n > 0)"
      - effect_type: "set_resource"
        resource_id: "_seg_guard"
        amount: 0

  # 大招后处理（on_ultimate 在全部 4 段结算后发射）：禁结闩 + 段计数复位 +
  # 行迹 3 Thunder Core 6 段随机单体 25% ATK（视为终结技伤害——action_type 声明槽）
  - event: "on_ultimate"
    condition: "$event.source == '1308' && $event.action == '130803'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ULT_KNOT_LOCK"
          name: "大招期间禁结"
          modifier_type: "buff"
          duration: 1
          tick_anchor: "owner_turn_end"
          dispellable: False
      - effect_type: "remove_modifier"
        target: "all_enemies"
        modifier_id: "CRIMSON_KNOT"   # 黄泉返渡「并移除所有集真赤」
      - effect_type: "deal_damage"
        name: "Thunder Core"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "0.25 * $self.atk"
      - effect_type: "deal_damage"
        name: "Thunder Core"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "0.25 * $self.atk"
      - effect_type: "deal_damage"
        name: "Thunder Core"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "0.25 * $self.atk"
      - effect_type: "deal_damage"
        name: "Thunder Core"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "0.25 * $self.atk"
      - effect_type: "deal_damage"
        name: "Thunder Core"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "0.25 * $self.atk"
      - effect_type: "deal_damage"
        name: "Thunder Core"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "0.25 * $self.atk"
      # 段计数复位挪到 Thunder Core 后（Core 段也标 ultimate 会进计数——末位复位保下一大招干净）
      - effect_type: "set_resource"
        resource_id: "_ult_seg"
        amount: 0

  # 四相断我消耗（QA ≥ 1 才发）：施放终结技后消耗 1 层 → +1 残梦 + 随机敌 +1 集真赤
  - event: "on_ultimate"
    condition: "$event.source == '1308' && $event.action == '130803' && stacks($self, 'QUADRIVALENT_ASCENDANCE') >= 1"
    effects:
      - effect_type: "adjust_stacks"
        modifier_id: "QUADRIVALENT_ASCENDANCE"
        delta: -1
      - effect_type: "gain_resource"
        resource_id: "slashed_dream"
        amount: 1
      - effect_type: "apply_modifier"
