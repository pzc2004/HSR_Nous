eidolons:
  E1:
    name: "Silenced Sky Spake Sooth"
    notes:
      - "对处于 debuff 状态的敌人造成伤害时暴击率 +18%——待收。挡因：目标条件化面板无通道（enable_if 只读自身面板，无按受击目标状态门控的攻击者暴击槽——1004 E6/1102 E1 同族）；'debuff 判定集合是否含绯红结/破韧标记'官方未定义，一并待实测"
  E2:
    name: "Mute Thunder in Still Tempest"
    hooks:
      # The Abyss 最高数值所需人数 -1（==2 虚无时差额 +45% 使 0.15→0.60——3 虚无时
      # 基础件 0.60 独立成立，差额件不加（draft enable_if >=2 双重计算勘正））
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_ABYSS_DELTA"
              name: "Mute Thunder in Still Tempest·The Abyss 差额"
              modifier_type: "buff"
              duration: 0
              enable_if: "count_team(path='nihility') == 2"
              dispellable: False
              stat_effects: {"all_dmg": 0.45}
      # 自身回合开始：+1 残梦 + 集真赤最多敌 +1 结
      - event: "on_turn_start"
        condition: "$event.actor == '1308'"
        effects:
          - effect_type: "gain_resource"
            resource_id: "slashed_dream"
            amount: 1
          - effect_type: "apply_modifier"
            target: {pool: "enemies", order_by: "-stacks($it, 'CRIMSON_KNOT')", take: 1}
            modifier:
              modifier_id: "CRIMSON_KNOT"
              name: "绯红结"
              modifier_type: "debuff"
              stacks: 1
              max_stack: 9
              duration: 0
              dispellable: False
  E3:
    name: "Frost Bites in Death"
    skill_level_overrides: {"ultimate": 2, "basic": 1}
    notes:
      - "大招 +2 随档段：130803 scaling 与 variants 段各自 15 档实取 lv12（段缩放按 level_key ultimate 同表）；普攻 scaling 实取 lv8 档（10 档表内）"
  E4:
    name: "Shrined Fire for Mirrored Soul"
    hooks:
      # 敌人进入战斗时受到的大招伤害 +8%——vulnerability + hit_condition ult 限定
      #（1222 BEFOG scoped 先例；actor_enter 通道——波次切换入场同发）
      - event: "actor_enter"
        condition: "actor_type_of($event.actor) == 'monster'"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.actor"
            modifier:
              modifier_id: "E4_ULT_VULN"
              name: "Shrined Fire·大招易伤"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              hit_condition: "$event.action_type == 'ultimate'"
              stat_effects: {"vulnerability": 0.08}
  E5:
    name: "Strewn Souls on Erased Earths"
    skill_level_overrides: {"skill": 2, "talent": 2}
    notes:
      - "战技 +2 随档段：130802 scaling/scaling_blast 15 档实取 +1 残梦/结层数 #3 恒 1 不变档；天赋 +2 随档段：大招期间抗性降低 param(130804,2)（对应修饰待收——档值在案 lv12=0.22）；残梦需求 #1 恒 9 不变档"
  E6:
    name: "Apocalypse, the Emancipator"
    stat_effects: {"res_pen": 0.2}
    notes:
      - "res_pen 20% 以常驻件承载：S6 后普攻/战技亦视为大招伤害，黄泉全部伤害皆属大招判据 → 单通道无观察差（同锚 E6 元素粒度先例）"
      - "'普攻与战技视为大招伤害' + '无视弱点削韧（含击破触发雷击破）' 待收。挡因：星魂档覆写 action 的伤害类别/弱点域无通道（toughness_scope 仅 action 层现役，eidolon overrides 不消费 action 键）"
      - "与 Thunder Core 6 段'视为大招伤害'的乘区叠乘顺序官方无裁定 → 待实测 B19 候选"

scaling_notes:
  - "残梦经济链（官方文本拼合）：开局 +5（行迹1）→ 战技每次 +1（主动）→ 任意 debuff 落敌 +1（天赋引擎——after_apply_modifier 宽口径：开战/波次/QA 补结同计入（每次施放技能最多触发 1 次的上限闩与开战/QA 是否计入官方未明，一并待实测）+ 自身挂结递归闩）→ 满 9 开大 → 溢出转四相断我（上限 3，on_resource_gain overflow 通道）→ QA 消耗后 +1 残梦 / 随机敌 +1 结。E2 每回合 +1 残梦/+1 结另计"
  - "绯红结经济：战技 +1（指定目标——$event.target 通道已收）/ 被动引擎 +1（落点=结最多敌）/ E2 每回合 +1 / QA 随机 +1 → 大招内啼泽雨斩逐段摘至多 3 层（已收）→ 黄泉返渡+on_ultimate 全摘 → 敌退场转移至结最多敌"
  - "对轴冲突处理：130802 sp_cost tbgd=1（权威）↔ 米游社 '战技点 -1'（同结论：耗 1 不产）——以 tbgd=1 为准，无实质数值分歧"
  - "削韧/回能单一来源声明：fandom 本角色字段为空，削韧（普攻 10 / 战技 20+10×2 / 大招 单20群20 / 秘技 20）与回能（普攻/战技/大招残梦回能 0/1/0）均来自米游社 sub_tag，实装建议复测"
  - "秘技 130807 无等级轨道（官方单档 [2.0, 1]）→ hook/technique 侧系数走字面值（damage 2.0×ATK / QA +1 残梦与 +1 结）+ 注释标档，不入 param() 等级表"
