# 角色模板：黄泉（1308）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
#
# 过堂收编/勘正八件：① 大招结构重锤——draft 把 130803 落成「#1 倍率 AoE 单发」
#   近似 + 130814-130817 四个**零成本自由施放**的散装 action（无 ult_cost_resource
#   无 available_if=免费终结技后门，严重 bug 摘除）；正解=B35 段机制：130803
#   instances 4 + segment_confirm（黄泉族逐段确认）+ instance_variants 下标对齐
#   （3×啼泽雨斩单体 #1 + 1×黄泉返渡 AoE #3——B35 建族本来就在等她）；② 摘结
#   段收编——啼泽雨斩每段消去至多 3 层集真赤 + 全体结爆 min(#2×(1+n), #5)
#   （_ult_seg 段计数 + _knots_n 快照——on_hp_decrease 载荷无 target_type，
#   以段序 1-3 鉴别雨斩与返渡）；③ 残梦溢出→四相断我收编——on_resource_gain
#   载荷增 overflow 字段（引擎补口——draft「溢出量无事件字段」挡因过期）；
#   ④ ULT_RES_SHRED 死键摘除——res_pen 挂敌方=读攻击方面板死键（1004 E4/1006
#   战技同族），「敌方全体全属性抗性降低 20%」待收（敌方抗性削减修饰通道缺，
#   不许静默死件）；⑤ E2 门控勘正——draft enable_if >=2 在 3 虚无时与基础件
#   双重计算（0.6+0.45=1.05 幻视）；正解 ==2（E2 语义=最高数值所需人数-1：
#   2 虚无时 0.15+0.45=0.60、3 虚无时基础 0.60 不加）；⑥ E4 收编——进战
#   敌人受大招伤害 +8%（vulnerability + hit_condition "$event.action_type ==
#   'ultimate'"——1222 BEFOG scoped 先例，draft「ult_vuln 键缺」挡因过期）；
#   ⑦ Thunder Core 6 段/结爆段 deal_damage 加 action_type: "ultimate" 声明槽
#   （1220 先例——官方「视为终结技伤害」，E4 scoped 命中域同齿）；⑧ 秘技削韧
#   补 toughness_scope: "all"（hook deal_damage 该键通道本批落地——官方
#   「无视弱点属性削减敌方全体的韧性」）。
# 待收（均带挡因）：大招期间「敌方全体全属性抗性降低 20%」（见④）/ E1 对
#       debuff 敌人暴击率 +18%（目标依赖型 crit 通道缺——1004 E6/1102 E1 同族）/
#       大招期间抗性降低与「持续至终结技结束」的窗口（随④同收）/ 啼泽雨斩
#       消去 0 层时结爆是否照发（#2 基率档，官方文本歧——现按 n>=1 才发）/
#       大招总倍率上限 #6/#7（现值=理论极大，天然不触）/ E6「普攻战技视为
#       大招伤害」与无视弱点削韧（action 键星魂覆写通道缺）/ 秘技秒杀普通
#       敌人（大世界语义不进战斗管线）/ 行迹白值节点（未下发不并入）/
#       Thunder Core 随机 6 段是否有放回（mode random 按序取首近似）
