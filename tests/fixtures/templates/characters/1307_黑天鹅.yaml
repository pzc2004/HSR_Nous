# 角色模板：黑天鹅（1307）·**加强后**（enhanced，默认真身）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 版本双轨：3.x 官方加强角色（新版 11307xx 现役；旧版 1307xx 仅 skill_params
# 历史对照不建行动块——legacy 文件留待需要时补，B39④ 流程）。
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
#
# 过堂收编/勘正七件：① mechanic_chance 字符串调用全灭（mechanic_chance('_x')=
#   float() 必炸死钩——1224/1004 同族实证；全改 res_ 平铺 mechanic_chance(res__x)）；
#   ② 顿悟承伤键勘正——dmg_taken 死键 → vulnerability 在案键（1222 BEFOG/1225
#   同族；「限敌方自身回合内」窗口无通道——全域近似，我方回合直击吃承伤溢出在案）；
#   ③ 11307102 残钩补全+数值勘正——staging 文件在行迹钩注释处截断未写钩体；
#   #2=1 是 **100%**（draft 误读 1%）——进战 65%+1 层、普攻/终结技命中 100%
#   施战技 DEF 降低全收（actor_enter/on_hp_decrease 双通道）；④ E2 新版收编——
#   进战 100% 基础概率陷入 **30 层**奥迹（actor_enter；draft 按旧版「阵亡扩散
#   相邻 6 层」待收——旧版机制随版本退役，新版大幅简化）；⑤ E4 新版收编——
#   揭露中敌方受到伤害额外 +20%（E4_VULN——vulnerability 在案键）+ 回能**去闩**
#   （新版「每回合开始时或被消灭时回 8 能量」无每轮 1 次限制——draft 的
#   _e4_used 闩是旧版模型，连同 on_ultimate 重置钩一并摘除）；⑥ E6 新版——
#   机制 2 追加层去 50% 概率改**必发**（_ch_e6_extra 池退役；再入闩保留）；
#   ⑦ 顿悟承伤 lv10=25%（param(1130703,3)——与①同键并入 EPIPHANY stat_effects）。
# 待收（均带挡因）：奥迹相邻扩散（1130704 #5=180% ATK 相邻段——目标代数无
#       adjacent 词表）/ 奥迹 DoT 的 20% DEF 无视（#6/#7——无视防御通道缺，
#       1212 霜魄/1102 E1 同族）/ 终结技「每 1 层已施加奥迹 → 50% fixed chance
#       本次叠层 +1」（逐层独立掷骰循环词表缺）/ 秘技链式递归（150%×50%^(n-1)——
#       无递归词表，仅收首环）/ E1 四组 DoT→抗性映射（风化等 modifier id 词表
#       未下发）/ E6 上限 50→80（modifier max_stack 星魂覆写通道缺——1205/1212
#       E6 同族）/ 顿悟承伤限敌方回合内窗口（见②）/ 奥迹/顿悟净化交互、
#       mechanic_chance 资源槽 base/fixed 分槽语义（待实测）
#
# 【DoT 双通道合并·迁移记录 2026-09-22】奥迹 DoT 已迁声明式 dot 通道——断点消解：
# 引擎新增 dot_ratio **跳伤时求值**（dot_ratio_expr，owner 定案不加专用字段）——
# 跳伤时刻以持有者为语境求表达式（持有者现值 $self + 施加者快照 $snapshot + modifier
# 自身层数 $modifier.stacks），表达式值即当跳基数（不再 ×快照atk/×stacks，层数语义
# 自含）。奥迹 dot_ratio = (param(1130704,1) + param(1130704,3)×($modifier.stacks−1))
# × $snapshot.atk（base+increment 仿射叠层——旧通道 ratio×stacks 表达不出的首实例）。
# 同步：① ARCANA modifier_type→dot（7 处施加全迁）+ 顿悟减半结算钩随迁 on_dot_retrigger
# （限 modifier_id=='ARCANA'——跳伤→+1层→减半序与旧 turn_start 钩序一致；+1层钩同迁
# on_dot_retrigger 逐 DoT 实例判定，更贴官方「每收到 1 次持续伤害」）；
# ② 不暴击+施加时刻快照——旧 deal_damage 钩期望暴击区偏差（R-SV1 族）随迁移消灭；
# ③ e2e 重基线（Z 去 1.025 暴击因子）。海瑟音 1410 同批迁移（4 色 dot+Zone 载荷）。
# 1307_黑天鹅.yaml
# 角色模板：黑天鹅（1307）——**现役技能=加强版 11307xx（官方清单并存，以加强版建模）；原版 1307xx 仅 skill_params 历史对照，不建行动块**
#
# 收录：base_stats 官方管线实值（hp 1086.624 / atk 659.736 / def 485.1 / spd 102 / crit 0.05/0.5）+ max_energy 120（官方+米游社双证）/
#       1130701 普攻（140% ATK 单体，sp +1 / 回 20 / 削韧 10）/
#       1130702 战技（Blast 90% ATK 主+相邻，DEF -20.8% 3 回合，sp -1 / 回 30 / 削韧 20+10×2）/
#       1130703 终结技（AoE 120% ATK + 顿悟 2 回合 + 25% 承伤「限敌方自身回合」+ 能耗 120 + 释放后回 5）/
#       1130704 天赋：奥迹**声明式 dot 件**（stack 上限 50；2026-09-22 双通道合并迁移——
#       dot_ratio 跳伤时求值 (#1 + #3×(层数-1))×快照atk 加法口径——待实测）
#       + DoT 实例触发 65% base chance 追加 1 层（on_dot_retrigger 逐实例判定）+ 结算后减半
#       + 顿悟首跳免减半闩（整场顿悟 1 次，再次施放顿悟重置——_epiphany_saved）/
#       行迹 11307101（被黑天鹅攻击 65% +5 层）/ 11307102（进战 +1 层、1% DEF down；普攻/终结技命中 1% DEF down 3 回合）/
#       11307103（全队增伤 60%×自身 EHR 封顶 72%——加强版从单体泛化全队）/
#       秘技 1130707：下场战斗全体敌人 +1 层奥迹（首环 150% base chance；链式递减待收）/
#       星魂 E3/E5 等级族（skill+2/talent+2；ultimate+2/basic+1）+ E4 能量半（顿悟目标回合开始/被击败回 8，每轮顿悟 1 次）
#       + E6 队友攻击 65% +1 层 + 每次施加奥迹 50% fixed chance 追加 +1（after_apply_modifier 汇聚钩 + 再入闩）
#
# 待收（附挡因）：
# - 奥迹相邻扩散（1130704 #5=180% ATK 相邻段）：目标代数无 adjacent 词表（blast 仅 action 层）——待收
# - 奥迹 DoT 的 20% DEF 无视（#6/#7，加强版常驻）：deal_damage 无视防御通道缺——待收
# - 加强版终结技「每 1 层已施加奥迹 → 50% fixed chance 本次叠层 +1」（#4）：需逐层独立掷骰循环，无循环词表——待收
# - 秘技 1130707 链式递归（150%×50%^(n-1) 直到失败）：无递归/循环词表、递归 hook 支持待实测——仅收首环
# - E1 四组 DoT→抗性映射：风化/裂伤/灼烧/触电 modifier id 词表未下发（本模板只登记自有件 ARCANA）——待收
# - E2 带奥迹敌人被击败 → 相邻 +6 层：相邻目标通道缺 + on_kill 载荷主体待验——待收
# - E4 顿悟中敌人效果抵抗 -10%：effect_res stat 键未下发——待收（能量半已收）
# - 奥迹/顿悟 dispellable、50 层溢出（加强版结算后才移除超出）、顿悟增伤是否覆盖回合外 DoT——待实测
# - mechanic_chance 资源槽语义与 base chance / fixed chance 双通道区分——待实测
# - 站位、自动战斗 AI 施放优先级、130706 fallback 攻击（tbgd 空值）——待实测/不落 actions
