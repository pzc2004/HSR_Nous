    name: "取此真相，弃舍表征"
    point_cost: 1
    effects:
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "ARCANA"
          name: "奥迹"
          modifier_type: "dot"      # 声明式 DoT 通道（2026-09-22 双通道合并迁移）
          dot_element: "wind"
          dot_ratio: "(param(1130704, 1) + param(1130704, 3) * ($modifier.stacks - 1)) * $snapshot.atk"
          stacks: 1
          max_stack: 50
          stack_mode: "refresh"
          duration: 0
          dispellable: True      # 官方文本未提净化交互——待实测

