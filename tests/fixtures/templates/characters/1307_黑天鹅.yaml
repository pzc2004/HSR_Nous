trace_notes:
  - "行迹 11307103（加强版）：全队伤害提升 = 60% × 黑天鹅效果命中，封顶 72%——挂 self + effect_scope team 光环；EHR 读 stat_of($self,'ehr')（stat 键词表若异待实测）"
  - "行迹（113071xx）/秘技（1130707）无等级轨道：数值一律字面值，不进 skill_params、不走 param()"
  - "行迹白值节点（效果命中/增伤等百分比节点）数据未下发——未并入 base_stats、trace_stat_effects 留空；到达后走 trace_stat_effects 通道回填"
  - "顿悟（1130703）语义：带奥迹的敌人视为同时带有风化/裂伤/灼烧/触电（EN 'are also considered to be'）——跨模板 DoT 协同语义，本模板内不建 modifier 件，仅登记在案"
