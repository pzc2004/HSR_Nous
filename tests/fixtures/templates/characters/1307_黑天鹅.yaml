    target_type: "single"
    damage_type: "wind"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    # lv10 = index 9 = 140% ATK（加强版无奥迹附加——移交行迹 11307101）
    toughness_dmg: 10       # 米游社：削韧 10
    skill_point_gain: 1     # tbgd 权威（+ 米游社「战技点 +1」双证）
    energy_gain: 20         # tbgd

  - action_id: "1130702"
    name: "失坠，伪神的黄昏"
    action_type: "skill"
    target_type: "blast"
    damage_type: "wind"
    scaling: [{"atk": 0.45}, {"atk": 0.495}, {"atk": 0.54}, {"atk": 0.585}, {"atk": 0.63},
              {"atk": 0.675}, {"atk": 0.7312}, {"atk": 0.7875}, {"atk": 0.8438}, {"atk": 0.9},
              {"atk": 0.945}, {"atk": 0.99}, {"atk": 1.035}, {"atk": 1.08}, {"atk": 1.125}]
    # lv10 = index 9 = 90% ATK 主目标（加强版）
    scaling_blast: [{"atk": 0.45}, {"atk": 0.495}, {"atk": 0.54}, {"atk": 0.585}, {"atk": 0.63},
                    {"atk": 0.675}, {"atk": 0.7312}, {"atk": 0.7875}, {"atk": 0.8438}, {"atk": 0.9},
                    {"atk": 0.945}, {"atk": 0.99}, {"atk": 1.035}, {"atk": 1.08}, {"atk": 1.125}]
    # lv10 相邻 = 同倍率 90% ATK（EN "and any adjacent targets"）
    toughness_dmg: 20           # 米游社：主 20 / 相邻 10
    toughness_dmg_blast: 10
    skill_point_cost: 1         # tbgd 权威（130702 冲突已裁决：mys「战技点 -1」一致）
    energy_gain: 30             # tbgd

  - action_id: "1130703"
    name: "沉醉于彼界的臂湾"
    action_type: "ultimate"
    target_type: "aoe"
    damage_type: "wind"
    energy_cost: 120            # 官方 max_sp 120（内建能量通道——不走 custom_resources）
    scaling: [{"atk": 0.72}, {"atk": 0.768}, {"atk": 0.816}, {"atk": 0.864}, {"atk": 0.912},
              {"atk": 0.96}, {"atk": 1.02}, {"atk": 1.08}, {"atk": 1.14}, {"atk": 1.2},
              {"atk": 1.248}, {"atk": 1.296}, {"atk": 1.344}, {"atk": 1.392}, {"atk": 1.44}]
    # lv10 = index 9 = 120% ATK 全体
    toughness_dmg: 20           # 米游社：削韧 20
    skill_point_cost: 0
    skill_point_gain: 0
    energy_gain: 5              # tbgd：释放后回能 5
    apply_modifiers:
      # 顿悟 Epiphany：lv10 #3 = 25% 承伤提升，仅限敌方自身回合内（EN "in their turn"）——
      # stat 键 dmg_taken 承载（管线承伤提高槽；词表若异待实测）；持续 2 回合（#2）
      - target: "all_enemies"
        modifier_id: "EPIPHANY"
        name: "顿悟"
        modifier_type: "debuff"
        duration: 2
        dispellable: True       # 官方未提净化交互——待实测
        stat_effects: {"vulnerability": "param(1130703, 3)"}

  # 1130704 天赋：纯机制 + DoT 输出——不落 actions（action_type 词表无 talent；官方 Talent
  # 攻击件走 follow_up，本天赋为 debuff 事件驱动，全量走 hooks）
  # 130706/1130706「攻击」placeholder：战技点不足 fallback 表现层，tbgd 空值——不落 actions

# 星魂（build.yaml member.eidolon: N 激活 E1..EN）
eidolons:
  E1:
    name: "七重智言"
    notes:
      - "敌人带有风化/裂伤/灼烧/触电 → 对应风/物理/火/雷抗性 -25%——待收：风化等四种 DoT 的 modifier id 词表未下发（本模板仅登记自有件 ARCANA），enable_if 无法求值；四组映射是否可叠加（同时带两种 DoT 双抗同降）待实测"
  E2:
    name: "别为我哭泣，我的羔羊"
    hooks:
      # 新版：敌方目标进入战斗时，100% 基础概率陷入 **30 层**奥迹（actor_enter 通道——
      # 波次切换入场同发；基础概率判定走 mechanic_chance(res_ 平铺））
      - event: "actor_enter"
        condition: "actor_type_of($event.actor) == 'monster' && mechanic_chance(res__ch_trace2_def)"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.actor"
            modifier:
              modifier_id: "ARCANA"
              name: "奥迹"
              modifier_type: "dot"      # 声明式 DoT 通道（2026-09-22 迁移）
              dot_element: "wind"
              dot_ratio: "(param(1130704, 1) + param(1130704, 3) * ($modifier.stacks - 1)) * $snapshot.atk"
              stacks: 30
              max_stack: 50
              stack_mode: "refresh"
              duration: 0
              dispellable: True
    notes:
      - "版本审计勘正（2026-09-14 B39③）：draft 按**旧版**建模（阵亡扩散相邻 +6 层——旧版机制随版本退役，相邻通道缺问题随之消解）；新版=进战 30 层（判定槽复用 _ch_trace2_def=100%——同值 100% base chance）"
  E3:
    name: "上行下效"
    skill_level_overrides: {"skill": 2, "talent": 2}   # 战技+2、天赋+2（实取 lv12=index 11）
    notes:
      - "战技+2 随档段：1130702 scaling/scaling_blast 实取 lv12=99% ATK、DEF down 22%（param(1130702,4) 随档）；天赋+2 随档段：奥迹 DoT 倍率/每层加成（param(1130704,1/3) 随档）"
  E4:
    name: "泪中赠礼"
    hooks:
      # 新版①：【揭露】状态下敌方目标受到的伤害额外提高 20%（vulnerability 在案键——
      # 随大招同挂同时长 2 回合近似在案）
      - event: "on_ultimate"
        condition: "$event.source == '1307' && $event.action == '1130703'"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E4_VULN"
              name: "泪中赠礼"
              modifier_type: "debuff"
              duration: 2
              dispellable: True
              stat_effects: {"vulnerability": 0.2}
      # 新版②：顿悟中敌人在其回合开始或其被击败时黑天鹅回 8 能量——**无每轮次数限制**
      #（新版文本删去了旧版「最多触发 1 次」——_e4_used 闩随版本退役）
      - event: "on_turn_start"
        condition: "actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'EPIPHANY') >= 1"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 8
      - event: "on_kill"
        condition: "actor_type_of($event.target) == 'monster' && has_modifier($event.target, 'EPIPHANY') >= 1"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 8
    notes:
      - "版本审计勘正（2026-09-14 B39③）：draft 按**旧版**建模（效果抵抗 -10% 待收 + 每轮 1 次闩）——新版=承伤+20%（已收）+ 回能无限制（已收）；旧版效果抵抗件随版本退役"
  E5:
    name: "鸟道横空"
    skill_level_overrides: {"ultimate": 2, "basic": 1}  # 终结技+2、普攻+1
    notes:
      - "终结技+2 随档段：1130703 scaling 实取 lv12=129.6% ATK、顿悟承伤 27%（param(1130703,3) 随档）；普攻+1：1130701 官方数据 10 档上限，lv10 已封顶——无第 11 档可取，跳过（param() 越档钳表尾+⚠编译警告口径）"
  E6:
    name: "万民受祉，神座垂怜"
    hooks:
      # 机制 1：队友（非黑天鹅自身）攻击敌人 → 65% base chance +1 层奥迹
      - event: "on_hp_decrease"
        condition: "actor_type_of($event.target) == 'monster' && $event.source != '1307' && actor_type_of($event.source) != 'monster' && mechanic_chance(res__ch_e6_team)"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "ARCANA"
              name: "奥迹"
              modifier_type: "dot"      # 声明式 DoT 通道（2026-09-22 迁移）
              dot_element: "wind"
              dot_ratio: "(param(1130704, 1) + param(1130704, 3) * ($modifier.stacks - 1)) * $snapshot.atk"
              stacks: 1
              max_stack: 50
              stack_mode: "refresh"
              duration: 0
              dispellable: True
      # 机制 2：每次黑天鹅施加奥迹（含行迹/秘技/终结技逐层件的全部施加源）→ 本次叠层数
      # **必发** +1（新版文本删去 50% fixed chance——_ch_e6_extra 池退役）；
      # after_apply_modifier 汇聚钩 + 再入闩（追加件自身不再触发追加）
      - event: "after_apply_modifier"
        condition: "$event.modifier_id == 'ARCANA' && actor_type_of($event.target) == 'monster' && res__e6_guard < 1"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e6_guard"
            amount: 1
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "ARCANA"
              name: "奥迹"
              modifier_type: "dot"      # 声明式 DoT 通道（2026-09-22 迁移）
              dot_element: "wind"
              dot_ratio: "(param(1130704, 1) + param(1130704, 3) * ($modifier.stacks - 1)) * $snapshot.atk"
              stacks: 1
              max_stack: 50
              stack_mode: "refresh"
              duration: 0
              dispellable: True
          - effect_type: "set_resource"
            resource_id: "_e6_guard"
            amount: 0
    notes:
      - "奥迹层数上限 +30（50→80）：modifier max_stack 星魂覆写通道缺（1205/1212 E6 同族）——待收，现按 50 档"
      - "after_apply_modifier 载荷字段（modifier_id/target）与嵌套再入时序待实测"

hooks:
  # 初始化：闩归零 + mechanic_chance 判定槽装填（p = current/max 口径；随档值走 param()）
  - event: "on_battle_start"
    effects:
      - effect_type: "set_resource"
        resource_id: "_epiphany_saved"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_e6_guard"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_ch_talent_dot"
        amount: "param(1130704, 2) * 10000"      # lv10 #2 = 65%
      - effect_type: "set_resource"
        resource_id: "_ch_trace1"
        amount: 6500                             # 行迹 11307101 = 65%（无等级轨道，字面值）
      - effect_type: "set_resource"
        resource_id: "_ch_trace2_enter"
        amount: 6500                             # 行迹 11307102 进战叠层 = 65%（#1=0.65）
      - effect_type: "set_resource"
        resource_id: "_ch_trace2_def"
        amount: 10000                            # 行迹 11307102 DEF 降低 = 100%（#2=1——draft 误读 1%）
      - effect_type: "set_resource"
        resource_id: "_ch_e6_team"
        amount: 6500                             # E6 机制 1 = 65%（星魂字面值）

  # ---- 行迹 11307103（加强版）：我方全体增伤 = 60%×自身效果命中、封顶 72%——
  # team 光环 + stat_exprs 现场求值（EHR 读 effect_hit 在案键——draft 计划槽「ehr」
  # 键名幻视勘正；draft 未写钩体，本件补全）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TRACE3_TEAM_DMG"
          name: "烛影朕兆"
          modifier_type: "buff"
          duration: 0
          effect_scope: "team"
          dispellable: False
          stat_exprs:
            all_dmg: "min(0.6 * stat_of($self, 'effect_hit'), 0.72)"

  # ---- 天赋 1130704 · 奥迹 DoT：声明式 dot 通道承载（2026-09-22 双通道合并迁移）----
  # 跳伤走引擎 A 类结算（modifier_type dot + dot_ratio 跳伤时求值表达式——基数 =
  # (#1 + #3×(层数−1))×施加者快照 atk，加法口径在案；不暴击+施加时刻快照+全乘区，
  # 旧 deal_damage 钩（含期望暴击偏差）退役）。层数语义由表达式自含（$modifier.stacks
  # 跳伤时刻现值），引擎不再 ×max(1,stacks)。
  #
  # ---- 加强版天赋触发域：每收到 1 次 DoT 实例 → 65% base chance +1 层 ----
  # 随迁 on_dot_retrigger（声明式跳伤单件结算后广播，modifier_id+target 载荷）——
  # 逐 DoT 实例判定（官方「每收到 1 次持续伤害」；旧 on_turn_start 每回合 1 次近似
  # 只对奥迹自身跳伤计数，迁移后他源 DoT 实例同触发，更贴官方）。奥迹自身跳伤即一次实例。
  - event: "on_dot_retrigger"
    condition: "actor_type_of($event.target) == 'monster' && has_modifier($event.target, 'ARCANA') >= 1 && mechanic_chance(res__ch_talent_dot)"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "ARCANA"
          name: "奥迹"
          modifier_type: "dot"      # 声明式 DoT 通道（2026-09-22 迁移）
          dot_element: "wind"
          dot_ratio: "(param(1130704, 1) + param(1130704, 3) * ($modifier.stacks - 1)) * $snapshot.atk"
          stacks: 1
          max_stack: 50
          stack_mode: "refresh"
          duration: 0
          dispellable: True

  # ---- 奥迹结算后减半（加强版默认；顿悟首跳豁免）----
  # 随迁 on_dot_retrigger 且限 modifier_id=='ARCANA'（只在奥迹自身跳伤后减半一次——
  # 他源 DoT 实例只触发上方 +1 层，不触发减半；旧 on_turn_start 序=跳伤→追加层→减半，
  # 声明式跳伤在 on_turn_start 钩之后引擎 A 类结算，钩留 turn_start 会序乱（减半先于
  # 跳伤），随迁 dot 事件重排为 跳伤→+1层→减半，与旧序一致）。
  # 声明序=先于下方闩置位：同一事件内本 hook 先读 latch（0=本场顿悟尚未豁免 → 不减半），
  # 随后闩置 1 → 后续顿悟回合正常减半（"整场顿悟最多 1 次"）。
  # 减半取整：round() 词表口径（floor 未下发）——取整规则待实测
  - event: "on_dot_retrigger"
    condition: "actor_type_of($event.target) == 'monster' && $event.modifier_id == 'ARCANA' && has_modifier($event.target, 'ARCANA') >= 1 && !(has_modifier($event.target, 'EPIPHANY') >= 1 && res__epiphany_saved < 1)"
    effects:
      - effect_type: "adjust_stacks"
        target: "$event.target"
        modifier_id: "ARCANA"
        delta: "-round(stacks($event.target, 'ARCANA') / 2)"
  - event: "on_dot_retrigger"
    condition: "actor_type_of($event.target) == 'monster' && $event.modifier_id == 'ARCANA' && has_modifier($event.target, 'EPIPHANY') >= 1 && res__epiphany_saved < 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_epiphany_saved"
        amount: 1

  # ---- 终结技 1130703：顿悟重置免减半闩（"再次施加顿悟时重置"；E4 回能闩已随新版无限制
  # 移除——新版 E4 回能无每轮次数限制）
  - event: "on_ultimate"
    condition: "$event.source == '1307' && $event.action == '1130703'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_epiphany_saved"
        amount: 0

  # ---- 战技 1130702：DEF -20.8%（主+相邻，3 回合）——100% base chance 直挂（敌方效果
  # 抵抗/EHR 乘区模型待收）；Blast 命中域由受击事件天然收敛（只有被战技打到的目标挂上）
  - event: "on_hp_decrease"
    condition: "$event.source == '1307' && $event.action_type == 'skill' && actor_type_of($event.target) == 'monster'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "ARCANA_DEF_DOWN"
          name: "失坠，伪神的黄昏"
          modifier_type: "debuff"
          duration: 3
          stack_mode: "replace"
          dispellable: True
          stat_effects: {"def_pct": "-param(1130702, 4)"}   # def_pct 管线防御降低槽（词表若异待实测）

  # ---- 行迹 11307101（加强版）：敌人被黑天鹅攻击 → 65% base chance +5 层奥迹 ----
  - event: "on_become_target"
    condition: "$event.source == '1307' && actor_type_of($event.target) == 'monster' && mechanic_chance(res__ch_trace1)"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "ARCANA"
          name: "奥迹"
          modifier_type: "dot"      # 声明式 DoT 通道（2026-09-22 迁移）
          dot_element: "wind"
          dot_ratio: "(param(1130704, 1) + param(1130704, 3) * ($modifier.stacks - 1)) * $snapshot.atk"
          stacks: 5
          max_stack: 50
          stack_mode: "refresh"
          duration: 0
          dispellable: True

  # ---- 行迹 11307102（加强版）：① 敌人进入战斗 → 65% base chance +1 层奥迹
  #（actor_enter 通道——波次切换入场同发；判定槽 _ch_trace2_enter=65%）；
  # ② 施放普攻/终结技命中 → **100%** base chance 施加战技的防御力降低（#2=1——
  # draft 误读 1%；与战技自挂同件 ARCANA_DEF_DOWN 同档位 param(1130702,4)，
  # 命中域由受击事件天然收敛）
  - event: "actor_enter"
    condition: "actor_type_of($event.actor) == 'monster' && mechanic_chance(res__ch_trace2_enter)"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "ARCANA"
          name: "奥迹"
          modifier_type: "dot"      # 声明式 DoT 通道（2026-09-22 迁移）
          dot_element: "wind"
          dot_ratio: "(param(1130704, 1) + param(1130704, 3) * ($modifier.stacks - 1)) * $snapshot.atk"
          stacks: 1
          max_stack: 50
          stack_mode: "refresh"
          duration: 0
          dispellable: True
  - event: "on_hp_decrease"
    condition: "$event.source == '1307' && ($event.action_type == 'basic' || $event.action_type == 'ultimate') && actor_type_of($event.target) == 'monster' && mechanic_chance(res__ch_trace2_def)"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "ARCANA_DEF_DOWN"
          name: "失坠，伪神的黄昏"
          modifier_type: "debuff"
          duration: 3
          stack_mode: "replace"
          dispellable: True
          stat_effects: {"def_pct": "-param(1130702, 4)"}
