    stat_effects: {"def_pen": 0.15}   # 无视 15% 防御——无条件全伤害=攻击方全局槽正解
  E5:
    name: "Arcadia: A Glimpse of Fates"   # CN：乐园，见悲喜苦乐
    skill_level_overrides: {"skill": 2, "talent": 2, "elation_skill": 1}
    notes:
      - "战技+2（lv12：主 3.3/邻 1.65）+天赋+2（lv12：狐狸 #1=1.1、欢愉 #2=0.275/#6=0.264/#7=0.176/#8=0.308）+欢愉技+1（lv12=1.21）"
  E6:
    name: "Maiden: A Step into Dreams"   # CN：少女，见浮生入梦
    hooks:
      # 增笑（Merrymake）=欢愉伤害专属乘区（勘正⑫/B40 ⓻ 翻案）：merrymake 真键——
      # pipeline.elation_damage 直读攻击方面板（物理段不读=乘区错配构造性消除，
      # scoped hit_condition 退役）；stat_exprs 现场求值（res_certified_banger 合并
      # 值——面板读取即重估懒求值零 stale，旧 on_resource_gain 重烘钩退役）；官方
      # 0.15+0.02×每 100 点、至多计入 1000 → min 槽自限（旧 banger max 1000 借
      # 口径随 decl 摘除退役——待收⑨核销）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_MERRYMAKE"
              name: "少女，见浮生入梦·增笑"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_exprs:
                merrymake: "0.15 + 0.02 * min(res_certified_banger / 100, 10)"
      # 好活当赏持续时间 +1 回合（B40 ⓻ 收编——旧待收②半兑现）：回合数档 +1（2→3，
      # 授予时点读档——引擎 _init_aha 进战发放/秘技装填先于本钩，该两笔按缺省 2 回
      # 合、其后发放全 3 回合；引擎序缺口迁移记⓼ 同族，e2e 不跨回合无数值差）
      - event: "on_battle_start"
        effects:
          - effect_type: "gain_resource"
            resource_id: "banger_turns"
            amount: 1
      # 首次/每再 4 次终结技 → 固定回 120（勘正⑬ %4 闩；快照读计数前值：
      # 第 1 次 n=0 ✓、第 5 次 n=4 ✓、第 9 次 n=8 ✓——1/5/9 节拍）
      - event: "on_ultimate"
        condition: "$event.source == '1505' && $event.action == '150503' && res__e6_n % 4 == 0"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 120
            err_exempt: true          # 官方「固定恢复」=不吃能量恢复效率（停云族先例）
      - event: "on_ultimate"
        condition: "$event.source == '1505' && $event.action == '150503'"
        effects:
          - effect_type: "gain_resource"
            resource_id: "_e6_n"
            amount: 1

hooks:
  # —— 进战转化镜像（B40 ⓼ 引擎序缺口兜底——报告单列嫌疑）：引擎 _init_aha 先于
  #   hook 订阅统发进战 20 好活当赏（engine.py「初始 modifier 挂载之后、hook 订阅
  #   之前」——「进战即得」非事件语义，待实测终审），天赋③触不到该笔；官方「获得
  #   好活当赏时同步获得等值能量」涵盖进战发放（打标原案 energy 20 在案）→ 镜像③
  #   单步锁语义（挂锁→+20 能→卸锁；②镜像累计自然 +20）。**引擎若改序（进战发放
  #   移至订阅后/补发事件）本钩即双发，须即摘——锚定引擎 _init_aha 序**
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CONV_LOCK"
          name: "转化锁"
          modifier_type: "buff"
          duration: 1
          dispellable: False
      - effect_type: "gain_energy"
        target: "self"
        amount: 20                  # 进战 20 好活当赏等值（08 §8.1 固定值；单次 ≤100 不触）
      - effect_type: "remove_modifier"
        modifier_id: "CONV_LOCK"

  # —— 天赋 #5：欢愉度 = #5×暴击伤害（EN "gains Elation equal to #5[i]% of CRIT DMG"；
  #   B40 ⓹ 收编——elation 面板通道；常驻件 stat_exprs 现场求值（$self.crit_dmg=无条
  #   件件面板——E2 +0.36 等 modifier 全吃进）；旧 (1+#5×crit_dmg) 折入段表达式翻案）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TALENT_ELATION"
          name: "青春•韶华无限·欢愉度"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            elation: "param(150504, 5) * $self.crit_dmg"

  # —— 天赋①：获得能量 → 同步等值好活当赏（**无**单次上限——勘正④方向；B40 ⓶ 条
  #   目化——逐条目独立计时+合并加和）；CONV_LOCK 互锁（勘正⑤）：挂锁→产条目（产物
  #   事件见锁跳过）→卸锁=单步转化不链式。waterfall 链逐钩现场判定（非快照），锁在
  #   嵌套事件全程在场
  - event: "on_gain_energy"
    condition: "$event.actor == '1505' && $event.amount > 0 && !has_modifier($self, 'CONV_LOCK')"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CONV_LOCK"
          name: "转化锁"
          modifier_type: "buff"
          duration: 1
          dispellable: False
      - effect_type: "gain_resource"
        resource_id: "certified_banger"
        amount: "$event.amount"
      - effect_type: "remove_modifier"
        modifier_id: "CONV_LOCK"

  # —— 天赋②：获得能量 → _fox_meter 镜像累计（单次 ≤240——勘正⑥；注册序在转化钩后
  #   =好活当赏先入账，狐狸欢愉段读到转化后新值）
  - event: "on_gain_energy"
    condition: "$event.actor == '1505' && $event.amount > 0"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_fox_meter"
        amount: "min($event.amount, param(150504, 3))"

  # —— 天赋③：获得好活当赏 → 同步等值能量（单次计入 ≤100——勘正④；同锁单步；
  #   B40 ⓶ 事件源改引擎条目发放——进战统发笔触不到（先于订阅），由 ⓼ 镜像钩兑现）
  - event: "on_resource_gain"
    condition: "$event.actor == '1505' && $event.resource_id == 'certified_banger' && $event.amount > 0 && !has_modifier($self, 'CONV_LOCK')"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CONV_LOCK"
          name: "转化锁"
          modifier_type: "buff"
          duration: 1
          dispellable: False
      - effect_type: "gain_energy"
        target: "self"
        amount: "min($event.amount, 100)"
      - effect_type: "remove_modifier"
        modifier_id: "CONV_LOCK"

  # —— 狐狸老师·欢愉段（注册序在主段前=先结欢愉后回能——欢愉 X 读回能前好活当赏；
  #   B40 ⓸ 真路由——category elation + 纯倍率 + punchline_source 缺省=持有者好活
  #   当赏合并值；持有好活当赏门控同 21_elation §21.7 读取口径）
  - event: "on_resource_gain"
    condition: "$event.actor == '1505' && $event.resource_id == '_fox_meter' && $event.current >= param(150504, 3) && resource_of($self, 'certified_banger') > 0"
    effects:
      - effect_type: "deal_damage"
        name: "狐狸老师·欢愉"
        target: "all_enemies"
        damage_type: "physical"
        category: "elation"
        amount: "param(150504, 2)"

  # —— 狐狸老师主段：240 即触发（勘正⑦ $event.current=新值免快照补偿）→ **先消耗 240**
  #   （官方「消耗 #3[i] 点累计值，【狐狸老师】发动追加攻击」——消耗在攻击前；且 set
  #   若置末，狐狸自身回能 +10 会让嵌套重触发抢在消耗前=永动机，128 重入帽实证）→
  #   物理 #1 全体（追加攻击身份=follow_up 缺省；削韧 10 米游社天赋档）→ 行裁断易伤
  #   （伤害后挂——本段不吃待实测）→ 回能 #4（余量保留：set 现值-#3 后 +10 自然累计）
  - event: "on_resource_gain"
    condition: "$event.actor == '1505' && $event.resource_id == '_fox_meter' && $event.current >= param(150504, 3)"
    effects:
      - effect_type: "set_resource"
        resource_id: "_fox_meter"
        amount: "res__fox_meter - param(150504, 3)"
      - effect_type: "deal_damage"
        name: "狐狸老师·追加攻击"
        target: "all_enemies"
        damage_type: "physical"
        toughness_dmg: 10
        amount: "param(150504, 1) * $self.atk"
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "FOX_VULN"
          name: "行裁断"
          modifier_type: "debuff"
          duration: 3
          dispellable: True
          stat_effects: {"vulnerability": 0.12}   # 行迹无等级轨道字面化（#1=0.12/#2=3）
      - effect_type: "gain_energy"
        target: "self"
        amount: "param(150504, 4)"

  # —— 天赋·战技欢愉段：持有好活当赏时，对受到攻击的敌方目标（主+邻——take:3 站位
  #   序近似，勘正⑯/待收⑦）造成 #7 欢愉伤害（B40 ⓸ 真路由——punchline_source 缺省
  #   =持有者合并值；on_action 时点=能量转化已入账，族谱#9 快照域不适用——本钩读现值）
  - event: "on_action"
    condition: "$event.actor == '1505' && $event.action_id == '150502' && !$event.insert && resource_of($self, 'certified_banger') > 0"
    effects:
      - effect_type: "deal_damage"
        name: "韶华无限·战技欢愉"
        target: {pool: "enemies", take: 3, mode: "deterministic"}
        damage_type: "physical"
        category: "elation"
        amount: "param(150504, 7)"

  # —— 天赋·终结技全体欢愉段：#6 全体（B40 ⓸ 真路由——X 保底能量上限 480：官方「至
