hooks:
  # —— 进战：+20 好活当赏（08 §8.1 获取表——同步转化 +20 能量）+ 每欢愉角色 +1 笑点
  #   （08 §8.2——count_team(path=) 编成口径，黄泉 1308 先例）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_resource"
        resource_id: "banger"
        amount: 20
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: "count_team(path='elation')"

  # —— 天赋①：获得能量 → 同步等值好活当赏（**无**单次上限——勘正④方向）；CONV_LOCK
  #   互锁（勘正⑤）：挂锁→产 banger（产物事件见锁跳过）→卸锁=单步转化不链式。
  #   waterfall 链逐钩现场判定（非快照），锁在嵌套事件全程在场
  - event: "on_gain_energy"
    condition: "$event.actor == '1505' && $event.amount > 0 && !has_modifier($self, 'CONV_LOCK')"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CONV_LOCK"
          name: "转化锁"
          modifier_type: "buff"
          duration: 1
          dispellable: False
      - effect_type: "gain_resource"
        resource_id: "banger"
        amount: "$event.amount"
      - effect_type: "remove_modifier"
        modifier_id: "CONV_LOCK"

  # —— 天赋②：获得能量 → _fox_meter 镜像累计（单次 ≤240——勘正⑥；注册序在转化钩后
  #   =好活当赏先入账，狐狸欢愉段读到转化后新值）
  - event: "on_gain_energy"
    condition: "$event.actor == '1505' && $event.amount > 0"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_fox_meter"
        amount: "min($event.amount, param(150504, 3))"

  # —— 天赋③：获得好活当赏 → 同步等值能量（单次计入 ≤100——勘正④；同锁单步）
  - event: "on_resource_gain"
    condition: "$event.actor == '1505' && $event.resource_id == 'banger' && $event.amount > 0 && !has_modifier($self, 'CONV_LOCK')"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CONV_LOCK"
          name: "转化锁"
          modifier_type: "buff"
          duration: 1
          dispellable: False
      - effect_type: "gain_energy"
        target: "self"
        amount: "min($event.amount, 100)"
      - effect_type: "remove_modifier"
        modifier_id: "CONV_LOCK"

  # —— 狐狸老师·欢愉段（注册序在主段前=先结欢愉后回能——欢愉 X 读回能前好活当赏；
  #   持有好活当赏门控：min(resource_of,1) 写法退役为 > 0 直读）
  - event: "on_resource_gain"
    condition: "$event.actor == '1505' && $event.resource_id == '_fox_meter' && $event.current >= param(150504, 3) && resource_of($self, 'banger') > 0"
    effects:
      - effect_type: "deal_damage"
        name: "狐狸老师·欢愉"
        target: "all_enemies"
        damage_type: "physical"
        category: "additional"
        amount: "7535.107 * param(150504, 2) * 1.18 * (1 + param(150504, 5) * $self.crit_dmg) * (1 + 5 * resource_of($self, 'banger') / (resource_of($self, 'banger') + 240))"

  # —— 狐狸老师主段：240 即触发（勘正⑦ $event.current=新值免快照补偿）→ **先消耗 240**
  #   （官方「消耗 #3[i] 点累计值，【狐狸老师】发动追加攻击」——消耗在攻击前；且 set
  #   若置末，狐狸自身回能 +10 会让嵌套重触发抢在消耗前=永动机，128 重入帽实证）→
  #   物理 #1 全体（追加攻击身份=follow_up 缺省；削韧 10 米游社天赋档）→ 行裁断易伤
  #   （伤害后挂——本段不吃待实测）→ 回能 #4（余量保留：set 现值-#3 后 +10 自然累计）
  - event: "on_resource_gain"
    condition: "$event.actor == '1505' && $event.resource_id == '_fox_meter' && $event.current >= param(150504, 3)"
    effects:
      - effect_type: "set_resource"
        resource_id: "_fox_meter"
        amount: "res__fox_meter - param(150504, 3)"
      - effect_type: "deal_damage"
        name: "狐狸老师·追加攻击"
        target: "all_enemies"
        damage_type: "physical"
        toughness_dmg: 10
        amount: "param(150504, 1) * $self.atk"
