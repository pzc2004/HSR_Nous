scaling_notes:
  - "欢愉伤害公式直消费 docs/mechanics 02 §2.14/08 §8.1：基数=7535.107(lv80)×倍率×(1+行迹欢愉增伤0.18)×(1+param(150504,5)×暴伤)×(1+5X/(X+240))；X=好活当赏（终结技系保底 max(好活当赏,能量上限480)）/施放欢愉技=笑点；category additional 承载（不吃类型桶——欢愉伤害不吃通用增伤，绯英 kit 无 all_dmg/物理增伤来源实战零差，理论偏离待收⑫）；防御/抗性/易伤/暴击/韧性区由管线直伤链施加（与官方乘区表一致）"
  - "终结技弹射段数=存活敌数三支（6/7/9——行迹 1505101 #2/#3/#4 + 基础 #2=5）；快照条件锁段数、目标现场解析（段间死亡目标自然出池）；expected 落点=布场序首敌"
  - "_fox_meter 为「累计获得能量」镜像（内置 energy 无 consume/累计槽）；回能预 ERR 口径（on_gain_energy=before_gain waterfall——ERR 加成前后的计入差待实测，e2e ERR=0 无差）"
  - "150503 #4=88 全档常量不入文本（EN/CN 均未引用——占位列不取）"
