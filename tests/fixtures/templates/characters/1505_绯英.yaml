# 角色模板：绯英（1505）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
# 绯英不在 3.x 加强名单（1004/1005/1006/1102/1205/1212/1217/1306/1307/1310），
# 星魂单轨无新旧版问题；星魂 name 键取官方 EN（character_ranks.json 核过，
# 与 1306 花火 fixture 同例）；欢愉体系 spec = docs/mechanics 08 + 02 §2.14。
#
# 过堂勘正十七件：① 战技主目标倍率错列——draft scaling 全 1.0（误取 #1 占位
#   常量列）；官方主目标=#2 列（lv10=3.0），param 列错位族，#1=1 全档常量不入
#   文本。② 终结技耗能 480→240——draft 把能量上限当耗能；米游社「能量 240」+
#   fandom energy_cost 240 双源一致（上限 480 另物）。③ 战技 #4 笑点当好活当赏
#   ——官方「额外获得 #4[i] 点笑点」（Punchline 团队共享池，08 §8.2），draft
#   gain_resource banger 资源幻视；正解 action resource_gain punchline:10（团队
#   池近似自持——单欢愉队等价，scope:team v1 未消费在案）。④ 双向转化 100 上限
#   方向挂反——官方「获得好活当赏→同步等值能量，单次计入 ≤100」；能量→好活
#   当赏等值**无**上限。draft 把 min(,100) 挂能量侧、banger 侧反无 cap。⑤ 转化
#   锁半挂死件——draft 条件查 BANGER_CONV_LOCK 但全模板无施加点（死条件）+
#   转化能量再产好活当赏双重计数；正解单一 CONV_LOCK 互锁（施放方挂锁→产物
#   事件见锁即跳过），单步转化不链式（链式=in-game 亦无穷，保守在案）。⑥
#   _fox_meter 累计缺单次上限——官方「单次获得能量时最多获得 #3=240 点累计
#   值」→ min($event.amount, 240)。⑦ 狐狸触发时机+清算——官方「累计获得 240
#   点能量时」立即发动、消耗 240（余量保留）；draft 挂 on_turn_start（时机偏
#   离）+ set 0（余量清零）。正解 on_resource_gain(_fox_meter) 读 $event.current
#   阈值（载荷即新值免快照补偿）+ set 现值-240。⑧ 欢愉伤害基数区全错——draft
#   把天赋 #2/#6/#7/#8 欢愉倍率 ×$self.atk 折入物理段；官方欢愉伤害=等级系数
#   （7535.107@lv80）×倍率×欢愉增伤×欢愉度×笑点/好活当赏乘区×增笑×防御/抗性/
#   易伤/韧性（02 §2.14），**与 ATK 无关**。正解 deal_damage category additional
#   + amount 全公式直写（spec 直消费）。⑨ 欢愉技 150520 散装零成本 action——
#   施放通道=阿哈时刻（行动条特殊单位，引擎未实装欢愉，rulebook 路由未接），
#   draft follow_up 0 费手点=后门（幻视族谱 #15）；摘除 action，E1 触发走 hook
#   段承载。⑩ E1 狐狸双重触发——E1 钩与本体狐狸钩同事件同条件，E1 下狐狸打
#   两次；正解 E1 钩只承载「狐狸攻击后追加一次欢愉技」段。⑪ E1 能量 +5 无出处
#   ——150520 文本只给 #1=5 点好活当赏，能量由好活当赏→能量转化自然产出，draft
#   另写 gain_energy 5 删除（E1 额外 10 点 → 合计 15 好活当赏）。⑫ E6 增笑挂
#   all_dmg——增笑（Merrymake）是欢愉伤害专属乘区（merrymakeMulti，08 §8.1），
#   all_dmg 连物理段一起吃=乘区错配；正解 hit_condition scoped 件（additional +
#   physical）只罩欢愉段，值随好活当赏烘焙+变动重烘（族谱 #10）。⑬ E6 回能节拍
#   错——官方「首次施放终结技后回 120，每再施放 4 次触发 1 次」=第 1/5/9… 次；
#   draft 置 0 后 n==0 分支再触发（第 6 次即回）。正解 res__e6_n % 4 == 0 单计数
#   闩；「固定恢复」→ err_exempt（停云族先例）。⑭ 行迹小节点漏收——draft 只收
#   大行迹暴击 0.3；character_skill_trees 实有 crit 0.027+0.027+0.04+0.04+0.053
#   =0.187、SPD+5、欢愉增伤 0.04+0.06+0.08=0.18——crit/spd 入 trace_stat_effects，
#   欢愉增伤无引擎槽（elationDmgBoostMulti 路由未接）→ 字面 1.18 折入欢愉段。
#   ⑮ on_gain_energy 钩无 actor 过滤——全队任何人回能都会给她产好活当赏/累计，
#   补 $event.actor == '1505'。⑯ 战技欢愉段目标错——官方「受到攻击的敌方目标」
#   （主+邻），draft take 3 random；正解 take:3 deterministic 站位序近似（blast
#   命中域寻址通道缺，注）。⑰ E3/E5 欢愉技 +1 误标待收——skill_level_overrides
#   通用键通道在（levels.get(k,10)+v，满行迹=10 约定；1505420 节点 max_level 10
#   佐证欢愉技行迹轨道 10 级）。
# 收录：普攻/战技/终结技基础段（倍率/削韧/回能/SP——米游社+fandom 双源一致）/
#       秘技全链（100% ATK 全体 + 好活当赏 20 + 削韧 20）/ 天赋双向转化（能量↔
#       好活当赏，CONV_LOCK 互锁单步）/ _fox_meter 镜像累计 + 狐狸老师追加攻击
#       （240 阈值即触发、物理 100% ATK 全体 + 行裁断 12% 易伤 3 回合 + 回能 10，
#       消耗 240 余量保留）/ 欢愉伤害全族（战技 #7 主+邻、终结技 #6 全体 + #8 随
#       弹射、狐狸 #2——公式直消费，终结技系 X 保底 480）/ 终结技弹射 6/7/9 段
#       （按存活敌数，行迹 #2/#3/#4）/ 进战 +20 好活当赏 + 每欢愉角色 +1 笑点
#       （08 §8.1/§8.2）/ E1 抗穿 20% + 狐狸后欢愉技（X=笑点）/ E2 暴伤 36% /
#       E3/E5 等级覆写全接（含 elation_skill）/ E4 无视 15% 防御（def_pen 全局
#       槽——无条件全伤害，非技域限定，与 1302 E6 待收案不同形）/ E6 增笑
#       （scoped 烘焙）+ 首次/每 4 次终结技回 120（%4 闩）
# 待收（均带挡因）：① 阿哈时刻全 subsystem（特殊单位上条/笑点清算/按欢愉编号
#       顺次施放欢愉技/解控/事后好活当赏授予）——引擎未实装欢愉（rulebook 欢愉
#       路由未接）；150520 常规施放通道随之待收（不进 actions=无免费后门）②
#       好活当赏 2 回合持续+独立计时+到期合并笑点账（08 §8.4）——资源无按授予
#       计时通道；E6「持续+1 回合」同因无所附着 ③ 行迹 1505101 #5（参演编号较
#       低队友获得好活当赏时转化 50%）+ 1505103（队友好活当赏结束转化 50%）——
#       参演编号数据源缺 + 队友资源获得/结束事件通道缺 + 依赖②到期语义 ④ E2
#       触发行迹③两件时额外获得 50%/100% 好活当赏——依赖③通道 ⑤ 欢愉度
#       （Elation）面板槽+欢愉增伤区槽——现折入段表达式（光锥/队友供欢愉度无
#       挂点）⑥ roll 模式物理/欢愉弹射段对落点独立抽样（绑定通道缺；expected
#       确定化一致）⑦ 战技欢愉段命中域=take:3 站位序近似（blast 主+邻寻址通道
#       缺）⑧ 狐狸触发即结算 vs in-game 追加攻击行动后排队——无 FU 延迟队列，
#       同行动回能过阈时本段先于行动伤害（e2e 回避跨阈行动断伤害）⑨ 好活当赏
#       上限 1000 借 E6 计入口径（官方未给上限，保守 cap+标注）⑩ 转化能量计入
#       240 累计（官方未排除——「获得能量」宽读，待实测终审）⑪ 欢愉技 150520
#       削韧/回能五项（米游社/fandom 均未收录欢愉技——E1 触发段除好活当赏转化
#       外不回能）⑫ 欢愉段伪 additional 身份吃通用增伤/虚弱区（理论偏离——绯
#       英 kit 无该二区来源，实战零差；scoped 增笑=唯一入网件）
# 数值：白值照 pipeline（atk 737.352 等）；params 全表与官方逐行程序比对一致；
#       action 倍率全表照抄，hook 侧系数走 skill_params + param() 编译期引用
#       （05_effects §5.1）；行迹/秘技无等级轨道一律字面值
