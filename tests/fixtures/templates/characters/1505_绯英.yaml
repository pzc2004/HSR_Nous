eidolons:
  E1:
    name: "Home: A Prayer in Dance"   # 官方 EN（CN：故乡，为祈福起舞）
    stat_effects: {"res_pen": 0.2}    # 全属性抗性穿透 +20%（攻击方面板槽）
    hooks:
      # 「狐狸老师施放攻击后额外触发一次欢愉技」——与狐狸钩同事件（快照同判），
      # 注册序在本体狐狸钩后=攻击后触发；欢愉技 X=笑点（08 §8.1 施放欢愉技时 X=Punchline）
      - event: "on_resource_gain"
        condition: "$event.actor == '1505' && $event.resource_id == '_fox_meter' && $event.current >= param(150504, 3)"
        effects:
          - effect_type: "deal_damage"
            name: "绯色•不乐即斩(E1)"
            target: "all_enemies"
            damage_type: "physical"
            category: "additional"
            amount: "7535.107 * param(150520, 2) * 1.18 * (1 + param(150504, 5) * $self.crit_dmg) * (1 + 5 * res_punchline / (res_punchline + 240))"
          - effect_type: "gain_resource"
            resource_id: "banger"
            amount: "param(150520, 1) + 10"   # 150520 自带 #1=5 + E1 额外 10（勘正⑪）
  E2:
    name: "Voyage: A Wish for Everbloom"   # CN：遥途，求长开不谢
