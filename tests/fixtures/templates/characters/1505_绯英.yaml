      # 首次/每再 4 次终结技 → 固定回 120（勘正⑬ %4 闩；快照读计数前值：
      # 第 1 次 n=0 ✓、第 5 次 n=4 ✓、第 9 次 n=8 ✓——1/5/9 节拍）
      - event: "on_ultimate"
        condition: "$event.source == '1505' && $event.action == '150503' && res__e6_n % 4 == 0"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 120
