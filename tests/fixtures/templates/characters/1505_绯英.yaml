# 角色模板：绯英（1505）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
# 绯英不在 3.x 加强名单（1004/1005/1006/1102/1205/1212/1217/1306/1307/1310），
# 星魂单轨无新旧版问题；星魂 name 键取官方 EN（character_ranks.json 核过，
# 与 1306 花火 fixture 同例）；欢愉体系 spec = docs/mechanics 08 + 02 §2.14 +
# sim_schema/docs/21_elation.md（B40 落地——elation 面板/笑点队伍账/好活当赏
# 条目列表/阿哈时刻主体全在案）。
#
# 过堂勘正十七件（B40 前在案；⑧⑨⑫⑭ 经 B40 迁移翻案——见迁移记）：① 战技
#   主目标倍率错列——draft scaling 全 1.0（误取 #1 占位常量列）；官方主目标=#2
#   列（lv10=3.0），param 列错位族，#1=1 全档常量不入文本。② 终结技耗能
#   480→240——draft 把能量上限当耗能；米游社「能量 240」+ fandom energy_cost
#   240 双源一致（上限 480 另物）。③ 战技 #4 笑点当好活当赏——官方「额外获得
#   #4[i] 点笑点」（Punchline 团队共享池，08 §8.2），draft gain_resource banger
#   资源幻视；正解 action resource_gain punchline:10（团队池近似自持——单欢愉
#   队等价）。④ 双向转化 100 上限方向挂反——官方「获得好活当赏→同步等值能量，
#   单次计入 ≤100」；能量→好活当赏等值**无**上限。draft 把 min(,100) 挂能量侧、
#   banger 侧反无 cap。⑤ 转化锁半挂死件——draft 条件查 BANGER_CONV_LOCK 但全
#   模板无施加点（死条件）+ 转化能量再产好活当赏双重计数；正解单一 CONV_LOCK
#   互锁（施放方挂锁→产物事件见锁即跳过），单步转化不链式（链式=in-game 亦无
#   穷，保守在案）。⑥ _fox_meter 累计缺单次上限——官方「单次获得能量时最多获
#   得 #3=240 点累计值」→ min($event.amount, 240)。⑦ 狐狸触发时机+清算——官
#   方「累计获得 240 点能量时」立即发动、消耗 240（余量保留）；draft 挂
#   on_turn_start（时机偏离）+ set 0（余量清零）。正解 on_resource_gain(_fox_meter)
#   读 $event.current 阈值（载荷即新值免快照补偿）+ set 现值-240。⑧ 欢愉伤害
#   建模——draft 把天赋 #2/#6/#7/#8 欢愉倍率 ×$self.atk 折入物理段（全错）；
#   B40 前占位=deal_damage category additional + 全公式直写（spec 直消费）；
#   **B40 ⓸ 翻案=category elation 真路由**（纯倍率+punchline_source 定槽）。
#   ⑨ 欢愉技 150520 散装零成本 action——draft follow_up 0 费手点=后门（幻视族
#   谱 #15）；B40 前摘除 action 由 hook 段承载；**B40 ⓵ 翻案=elation_skill 正身
#   落 actions**（合法行动集引擎排除手动施放——无免费后门同语义）。⑩ E1 狐狸
#   双重触发——E1 钩与本体狐狸钩同事件同条件，E1 下狐狸打两次；正解 E1 钩只
#   承载「狐狸攻击后追加一次欢愉技」段（B40 ⓺ trigger_action 真路由）。⑪ E1
#   能量 +5 无出处——150520 文本只给 #1=5 点好活当赏，能量由好活当赏→能量转
#   化自然产出，draft 另写 gain_energy 5 删除。⑫ E6 增笑挂 all_dmg——增笑
#   （Merrymake）是欢愉伤害专属乘区（merrymakeMulti，08 §8.1），all_dmg 连物理
#   段一起吃=乘区错配；B40 前正解 hit_condition scoped 件只罩欢愉段；**B40 ⓻
#   翻案=merrymake 真键**（stat_exprs 现场求值，scoped/重烘全退役）。⑬ E6 回
#   能节拍错——官方「首次施放终结技后回 120，每再施放 4 次触发 1 次」=第
#   1/5/9… 次；draft 置 0 后 n==0 分支再触发（第 6 次即回）。正解 res__e6_n % 4
#   == 0 单计数闩；「固定恢复」→ err_exempt（停云族先例）。⑭ 行迹小节点漏收
#   ——draft 只收大行迹暴击 0.3；character_skill_trees 实有 crit 0.027+0.027+
#   0.04+0.04+0.053=0.187、SPD+5、欢愉度强化 0.04+0.06+0.08=0.18——crit/spd 入
#   trace_stat_effects；欢愉度强化 B40 前误判「欢愉增伤无引擎槽→字面 1.18 折入
#   欢愉段」；**B40 ⓹ 翻案=trace_stat_effects elation 键**（raw properties
#   type=ElationDamageAddedRatioBase=欢愉度面板，CN「欢愉度强化」——打标误读
#   证伪，数据源原文在案）。⑮ on_gain_energy 钩无 actor 过滤——全队任何人回
#   能都会给她产好活当赏/累计，补 $event.actor == '1505'。⑯ 战技欢愉段目标错
#   ——官方「受到攻击的敌方目标」（主+邻），draft take 3 random；正解 take:3
#   deterministic 站位序近似（blast 命中域寻址通道缺，注）。⑰ E3/E5 欢愉技 +1
#   误标待收——skill_level_overrides 通用键通道在（levels.get(k,10)+v，满行迹
#   =10 约定；1505420 节点 max_level 10 佐证欢愉技行迹轨道 10 级）。
#
# B40 迁移记（2026-09-15——欢愉体系基建落地摘待收，8009 试点同手册；旧待收
#   ①⑤⑨⑫ 全兑现、② 半兑现，勘正⑧⑨⑫⑭ 翻案在案）：
#   ⓵ 欢愉技 150520 正身（勘正⑨翻案）——落 actions：action_type elation_skill
#   （枚举入闸；合法行动集引擎排除手动施放=无免费后门，阿哈时刻/E1 代放两通道
#   驱动）；scaling 行键 #2 列 atk→elation 纯倍率（等级系数 7535.107 路由，行动
#   层 pool=笑点池实时值）；level_key/slo 键原已同名在案不动；#1=5 好活当赏走
#   on_action gain_resource certified_banger（文本序：伤害在先获得在后——action
#   段先结算，钩后发放）；削韧/回能保守 0（米游社/fandom 未收录欢愉技，待收⑪）。
#   ⓶ 好活当赏条目化（勘正⑧配套翻案）——自制 banger 资源（max 1000 借 E6 计入
#   口径）decl 整体摘除 → 引擎原生条目列表（21_elation §21.5：逐条目独立计时+
#   合并加和=官方「多次好活当赏笑点值合并计算」同语义）；进战 +20 归引擎
#   _init_aha 统发（旧进战发放钩摘除防双发）；天赋①能量→好活当赏/天赋③好活
#   当赏→能量/秘技 +20/150520 #1=5/E1 +10 全改 gain_resource certified_banger，
#   门控 resource_of($self,'banger') → 'certified_banger'——**记账逻辑全保留只换
#   存储**（CONV_LOCK 单步互锁/方向 cap/镜像累计逐字不动）。banger_turns decl
#   落地（缺省 2 回合一档——E6 延时件挂点，见 ⓻）。
#   ⓷ 笑点 punchline decl 摘除——队伍账引擎原生（state.punchline；res_punchline
#   读取口径不变；战技 #4=10 action resource_gain 通道不动；旧 decl max inf 注释
#   「阿哈清算未实装只涨」过期——清算已随阿哈时刻主体落地）。
#   ⓸ 欢愉伤害全族真路由（勘正⑧全翻案）——category additional + 7535.107×…全
#   公式直写 → category elation + amount 纯倍率（param 取档）+ punchline_source
#   定槽：战技 #7/狐狸 #2=缺省（持有者好活当赏合并值——21_elation §21.2 定槽口
#   径）；终结技全体 #6/弹射 #8=官方「至少计入等同于能量上限的好活当赏」→
#   max(resource_of('1505','certified_banger'), $self.max_energy) 保底表达式；
#   欢愉技段=行动层 elation 行键自带笑点池路由。旧待收⑫（伪 additional 吃通用
#   增伤理论偏离）随路由正身核销——欢愉段不再入增伤区，防御/抗性/易伤/暴击/
#   韧性区管线同链。
#   ⓹ 欢愉度两件收编（勘正⑭翻案、旧待收⑤核销）——天赋 #5「欢愉度=#5×暴伤」
#   （EN "gains Elation equal to #5[i]% of CRIT DMG"）：常驻件 stat_exprs elation
#   现场求值（$self.crit_dmg=无条件件面板——E2 +0.36 等全吃进；旧 (1+#5×crit_dmg)
#   折入段表达式翻案）；行迹小节点 1505202/06/09「欢愉度强化」0.04+0.06+0.08=
#   0.18 归 trace_stat_effects elation（raw type=ElationDamageAddedRatioBase——
#   旧打标误判「欢愉增伤」折 1.18 证伪翻案；elation_dmg_boost 槽引擎已在案但本
#   角色无实例不造）。数值随之改：综合乘区 E0 1.298→1.28、E2 1.383→1.352（e2e
#   期望值全重算——非硬凑，误读修正）。
#   ⓺ E1 代放真路由——「狐狸老师施放攻击后额外触发一次欢愉技」→ trigger_action
#   action_type "elation_skill"（caster 缺省 self；X=笑点池实时值——非固定档不写
#   pool_override；旧 deal_damage 段承载翻案）；「欢愉技额外使该单位获得 10 点
#   好活当赏」改挂 on_action 150520 独立钩——官方定语=欢愉技本体（阿哈时刻通
#   道同吃），旧「E1 触发段合并 15」口径翻案（单场景数值同构：5+10 各自独立
#   条目、各自单步转化）。
#   ⓻ E6 两件收编（勘正⑫翻案、旧待收②半兑现）——增笑：scoped all_dmg+随好活
#   当赏重烘双钩退役 → 单件常驻 stat_exprs merrymake 现场求值（res_certified_banger
#   合并值——面板读取即重估懒求值零 stale，重烘钩无存在必要；官方 0.15+0.02×
#   每 100 点、上限计入 1000 → min 槽自限，旧 banger max 1000 借口径随 decl 摘除
#   退役）；好活当赏持续 +1 回合：banger_turns decl + on_battle_start gain_resource
#   1（授予时点读档——引擎 _init_aha/秘技装填先于本钩发放，进战 20/秘技 20 两
#   笔按缺省 2 回合、其后发放全 3 回合；引擎序缺口见 ⓼，e2e 不跨回合无数值差）。
#   ⓼ 进战转化镜像（引擎序缺口兜底——报告单列嫌疑）：引擎 _init_aha 先于 hook
#   订阅统发进战 20 好活当赏（engine.py「初始 modifier 挂载之后、hook 订阅之前」
#   ——「进战即得」非事件语义待实测终审），天赋③触不到该笔；官方「获得好活当赏
#   时同步获得等值能量」涵盖进战发放（打标原案 energy 20 在案）→ on_battle_start
#   镜像钩兑现③的单步锁语义（挂锁→+20 能→卸锁；②镜像累计自然 +20）。**引擎
#   若改序（进战发放移至订阅后/补发事件）本钩即双发，须即摘——锚定引擎 _init_aha
#   序**。
#
# 收录：普攻/战技/终结技基础段（倍率/削韧/回能/SP——米游社+fandom 双源一致）/
#       秘技全链（100% ATK 全体 + 好活当赏 20 条目 + 削韧 20）/ 天赋双向转化
#       （能量↔好活当赏，CONV_LOCK 互锁单步——存储=certified_banger 条目列表）/
#       _fox_meter 镜像累计 + 狐狸老师追加攻击（240 阈值即触发、物理 100% ATK 全
#       体 + 行裁断 12% 易伤 3 回合 + 回能 10，消耗 240 余量保留）/ 欢愉伤害全族
#       真路由（战技 #7 主+邻、终结技 #6 全体 + #8 随弹射、狐狸 #2——category
#       elation 纯倍率+punchline_source 定槽，终结技系保底 480）/ 终结技弹射
#       6/7/9 段（按存活敌数，行迹 #2/#3/#4）/ 欢愉技 150520 正身（elation_skill
#       AoE + #1=5 好活当赏——阿哈时刻/E1 代放驱动）/ 进战两件（引擎统发 +20 好
#       活当赏 + 每欢愉角色 +1 笑点 + 本模板转化镜像）/ E1 抗穿 20% + 狐狸后代放
#       欢愉技 + 欢愉技额外 +10 好活当赏 / E2 暴伤 36% / E3/E5 等级覆写全接（含
#       elation_skill）/ E4 无视 15% 防御（def_pen 全局槽）/ E6 增笑（merrymake
#       真键 stat_exprs）+ 好活当赏 +1 回合（banger_turns）+ 首次/每 4 次终结技
#       回 120（%4 闩）
# 待收（均带挡因；已核销项见迁移记——②③④⑥⑦⑧⑩⑪ 在收）：② 残：好活当赏到
#       期合并笑点账（08 §8.4）——引擎条目到期除名仅日志留痕、无笑点入账/到期
#       事件通道（2 回合持续+独立计时+E6 延时已兑现，迁移记⓶⓻）③ 行迹 1505101
#       #5（参演编号较低队友获得好活当赏时转化 50%）+ 1505103（队友好活当赏结束
#       转化 50%）——elation_number 模板键已在案但跨 actor 编号比较表达式函数缺
#       + 参演编号数据源缺 + 1505103 依赖②残到期事件 ④ E2 触发行迹③两件时额外
#       获得 50%/100% 好活当赏——依赖③通道 ⑥ roll 模式物理/欢愉弹射段对落点独
#       立抽样（绑定通道缺；expected 确定化一致）⑦ 战技欢愉段命中域=take:3 站位
#       序近似（blast 主+邻寻址通道缺）⑧ 狐狸触发即结算 vs in-game 追加攻击行动
#       后排队——无 FU 延迟队列，同行动回能过阈时本段先于行动伤害（e2e 回避跨阈
#       行动断伤害）⑩ 转化能量计入 240 累计（官方未排除——「获得能量」宽读，待
#       实测终审）⑪ 欢愉技 150520 削韧/回能五项（米游社/fandom 均未收录欢愉技—
#       —保守 0/0；E1/阿哈代放除好活当赏转化外不回能）
# 数值：白值照 pipeline（atk 737.352 等）；params 全表与官方逐行程序比对一致；
