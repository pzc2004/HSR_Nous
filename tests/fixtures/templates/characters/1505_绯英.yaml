scaling_notes:
  - "欢愉伤害真路由（B40 ⓸——docs/mechanics 02 §2.14/08 §8.1 引擎消费）：category elation + amount 纯倍率（param 取档）+ punchline_source 定槽（战技 #7/狐狸 #2=缺省持有者合并值；终结技 #6/#8=max(合并值,能量上限 480) 保底；欢愉技段=行动层笑点池实时值）；elation 面板=行迹 0.18+天赋 #5×暴伤（trace_stat_effects + TALENT_ELATION stat_exprs 两通道，B40 ⓹）；merrymake=E6 真键（B40 ⓻）；防御/抗性/易伤/暴击/韧性区由管线同链施加"
  - "好活当赏形制=引擎原生条目列表（B40 ⓶——旧自制 banger 资源翻案）：进战 +20 引擎统发（转化由 ⓼ 镜像钩兑现——引擎序缺口在案）、天赋①③ 双向转化、秘技 +20、150520 #1=5、E1 +10 全经 gain_resource certified_banger；门控 resource_of($x,'certified_banger')；读取=eng._resource_value 合并值/res_certified_banger 平铺"
  - "终结技弹射段数=存活敌数三支（6/7/9——行迹 1505101 #2/#3/#4 + 基础 #2=5）；快照条件锁段数、目标现场解析（段间死亡目标自然出池）；expected 落点=布场序首敌"
  - "_fox_meter 为「累计获得能量」镜像（内置 energy 无 consume/累计槽）；回能预 ERR 口径（on_gain_energy=before_gain waterfall——ERR 加成前后的计入差待实测，e2e ERR=0 无差）"
  - "150503 #4=88 全档常量不入文本（EN/CN 均未引用——占位列不取）；150520 削韧/回能保守 0（待收⑪）"
