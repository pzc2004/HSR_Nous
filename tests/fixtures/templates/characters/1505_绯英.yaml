eidolons:
  E1:
    name: "Home: A Prayer in Dance"   # 官方 EN（CN：故乡，为祈福起舞）
    stat_effects: {"res_pen": 0.2}    # 全属性抗性穿透 +20%（攻击方面板槽）
    hooks:
      # 「狐狸老师施放攻击后额外触发一次欢愉技」——与狐狸钩同事件（快照同判——
      # $event.current 为本事件入账后新值，狐狸主段 set -240 不回写事件载荷），
      # 注册序在本体狐狸钩后=攻击后触发（行裁断易伤先入网）；B40 ⓺ trigger_action
      # 真路由代放（旧 deal_damage 段承载翻案）；caster 缺省 self=hook 持有者；
      # X=笑点池实时值（08 §8.1 施放欢愉技时 X=Punchline——非固定档不写 pool_override）
      - event: "on_resource_gain"
        condition: "$event.actor == '1505' && $event.resource_id == '_fox_meter' && $event.current >= param(150504, 3)"
        effects:
          - effect_type: "trigger_action"
            action_type: "elation_skill"
      # 「欢愉技额外使该单位获得 10 点好活当赏」——挂欢愉技施放事件本体（任何通道：
      # 狐狸代放/阿哈时刻——官方定语是欢愉技而非狐狸触发，旧「E1 触发段合并 15」口径
      # 翻案，B40 ⓺；无 insert 闩——代放（insert=True）同发；B40 ⓶ 条目化独立计时，
      # 与 #1=5 发放各自单步转化——数值同构 5+10）
      - event: "on_action"
        condition: "$event.actor == '1505' && $event.action_id == '150520'"
        effects:
          - effect_type: "gain_resource"
            resource_id: "certified_banger"
            amount: 10
  E2:
    name: "Voyage: A Wish for Everbloom"   # CN：遥途，求长开不谢
    stat_effects: {"crit_dmg": 0.36}
    notes:
