    hooks:
      # 增笑（Merrymake）=欢愉伤害专属乘区（勘正⑫）：hit_condition 只罩 category
      # additional + physical 段（=本模板全部欢愉段身份），all_dmg 经 scoped 通道入
      # 增伤区——数值上 merrymakeMulti 与 dmg_boost 换位等价（乘法交换）；值随好活
      # 当赏烘焙（挂点快照），好活当赏变动同钩重烘（族谱 #10/花火 SPK_VULN 先例）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_MERRYMAKE"
              name: "少女，见浮生入梦·增笑"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stack_mode: "replace"   # 重挂重烘（refresh 留旧烘焙——1207 驭空案编译期提示）
              hit_condition: "$event.action_type == 'additional' && $event.damage_type == 'physical'"
