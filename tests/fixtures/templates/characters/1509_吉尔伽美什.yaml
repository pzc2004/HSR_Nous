hooks:
  # 1509103 王霸的竞逐·基础半：在场时我方全体 atk +20%/暴伤 +20%（team 光环挂 self——
  # 花火夜幕先例；能量上限溢出段待收见头注）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "HEGEMONS_STRIFE"
          name: "王霸的竞逐"
          modifier_type: "buff"
          duration: 0
          effect_scope: "team"
          dispellable: False
          stat_effects: {"atk_pct": 0.2, "crit_dmg": 0.2}

  # 终结技 150903 结算：10 段随机单体弹射（每段 #2×ATK、逐段削韧 2——米游社 40+2*n
  # 双源在案）。on_action 挂载（Saber 101403 弹射同模——B37 双发 on_action 含终结技）；
  # 弹射 action_type 标 ultimate（勘正⑭——官方弹射属终结技伤害，吃王来背负
  # dmg_ultimate_dmg_boost 桶）；random 目标 EXPECTED 按序取首确定化。
  # 1509101③ 兴致 +2 拆独立钩（下条）——同钩序执行会让弹射吃到新 HERO 层（暴伤 1.2），
  # 「施放终结技时获得兴致」与本次终结技伤害的先后时序待实测；本版按结算后获得收
  #（弹射不吃 HERO 新层——快照分发下同事件各钩互不见彼此 effects，注册序保证本钩先跑）
  - event: "on_action"
    condition: "$event.actor == '1509' && $event.action_id == '150903' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "天地乖离•开辟之星·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "param(150903, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "天地乖离•开辟之星·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "param(150903, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "天地乖离•开辟之星·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "param(150903, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "天地乖离•开辟之星·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "param(150903, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "天地乖离•开辟之星·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "param(150903, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "天地乖离•开辟之星·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "param(150903, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "天地乖离•开辟之星·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "param(150903, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "天地乖离•开辟之星·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "param(150903, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "天地乖离•开辟之星·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "param(150903, 2) * $self.atk"
        toughness_dmg: 2
      - effect_type: "deal_damage"
        name: "天地乖离•开辟之星·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "thunder"
        action_type: "ultimate"
        amount: "param(150903, 2) * $self.atk"
        toughness_dmg: 2

  # 1509101③：吉尔伽美什施放终结技 → 兴致 +2（独立钩——注册在弹射钩后，见上条注）
  - event: "on_action"
    condition: "$event.actor == '1509' && $event.action_id == '150903' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "interest"
        amount: 2

  # 天赋①王来背负 + 1509101①：队友施放终结技 → 终结技增伤 #3 持续 #1=3（dmg_ultimate
  # 类型桶——勘正③）+ 兴致 +2。「我方队友」排自身（知更鸟先例——含自身待实测在案）；
  # 忆灵开大在我方队友域（actor_type != monster 放行）
  - event: "on_ultimate"
    condition: "$event.source != '1509' && actor_type_of($event.source) != 'monster'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "KINGS_BURDEN"
          name: "王来背负"
          modifier_type: "buff"
          duration: 3             # #1 全档恒 3
          dispellable: True
          stat_effects: {"dmg_ultimate_dmg_boost": "param(150904, 3)"}
      - effect_type: "gain_resource"
        resource_id: "interest"
        amount: 2

  # 天赋①：我方其他目标行动 → 兴致 +1（含 Saber/忆灵——「我方其他目标」明文排自身）
  - event: "on_action"
    condition: "$event.actor != '1509' && actor_type_of($event.actor) != 'monster' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "interest"
        amount: 1

  # 天赋①：施放战技后清空兴致（on_action 发射在结算后——时序合「施放后」；set 0 同发
  # on_resource_gain——INTEREST_SPD 随之烘焙归零、HERO_HAUTEUR 有 amount>0 门不误加）
  - event: "on_action"
    condition: "$event.actor == '1509' && $event.action_id == '150902'"
    effects:
      - effect_type: "set_resource"
        resource_id: "interest"
        amount: 0

  # 兴致变动全路径重挂（勘正⑪——draft 只挂「队友行动」一条路径，开大/E2/追击/秘技/
  # 清空全滞后）：① SPD 烘焙=每点兴致 #4%（挂点烘焙读现场新值——清空自动归零）
  - event: "on_resource_gain"
    condition: "$event.resource_id == 'interest'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "INTEREST_SPD"
          name: "兴致·速度"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          stat_effects: {"spd_pct": "param(150904, 4) * res_interest"}

  # ② 1509102 暴伤层：每获得 1 点兴致 +1 层（一次 +N 点=+N 层——apply 建层 + adjust
  # delta amount-1 组合精确，勘正⑩）；amount>0 门（清空/消耗不误加）；本场累计不清
  - event: "on_resource_gain"
    condition: "$event.resource_id == 'interest' && $event.amount > 0"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "HERO_HAUTEUR_STACKS"
          name: "英雄的孤傲"
          modifier_type: "buff"
          stacks: 1
          max_stack: 6
          stack_mode: "refresh"
          duration: 0
          dispellable: False
      - effect_type: "adjust_stacks"
        modifier_id: "HERO_HAUTEUR_STACKS"
        delta: "$event.amount - 1"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "HERO_HAUTEUR_BOOST"
          name: "英雄的孤傲·暴伤"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          stat_effects:
            crit_dmg: "0.25 * min(stacks($self, 'HERO_HAUTEUR_STACKS'), 6)"

  # ③ 兴致首次达到 #2=10 → 进入【来兴致了！】（$event.current=写入后现值——快照语义
  # 直读，勘正⑫；has_modifier 门=「首次」整场一次；状态持续整场= modifier duration 0）
  - event: "on_resource_gain"
    condition: "$event.resource_id == 'interest' && $event.current >= 10 && has_modifier($self, 'INTEREST_PIQUED') < 1"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "INTEREST_PIQUED"
          name: "来兴致了！"
          modifier_type: "buff"
          duration: 0
          dispellable: False

  # 天赋②：吉尔伽美什或 Saber 攻击 → 计数 +1（双主体——勘正⑰；deal_damage 伪行动不走
  # on_action，追击自身产物天然不计——无递归，族谱 12 免闩）
  - event: "on_action"
    condition: "($event.actor == '1509' || $event.actor == '1014') && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_atk_count"
        amount: 1

  # 天赋②触发：计数达 #5=8 → 连携追击（快照补偿 res+1>=8——同事件 condition 读事件
  # 前旧值，族谱 9）：雷段 AoE #1×ATK 削韧 10（伪 follow_up——追加攻击身份缺省）+
  # 回能 10（米游社）+ 兴致 +#3 + Saber 固定回 120（代数 where——无 Saber 空集安全）+
  # 清空计数。「任意单位攻击后判定」与双主体攻击后判定等价（计数只由双主体贡献且触发
  # 即清零——敌人攻击时计数不可能首次达 8）
  - event: "on_action"
    condition: "($event.actor == '1509' || $event.actor == '1014') && !$event.insert && res__atk_count + 1 >= 8"
    effects:
