# 角色模板：吉尔伽美什（1509）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
#
# 过堂勘正十八件：① path erudition→destruction（官方 characters.json "Warrior"/
#   米游社 destruction 双源——draft 命途幻视）；② def_ignore→def_pen 两处（150902
#   王来承认 + E1 队友件——词表外死键静默无效；rulebook def_multi 正主消费端在案）；
#   ③ ultimate_dmg→dmg_ultimate_dmg_boost（王来背负——类型桶正主 1008/1201 先例）；
#   ④ err→energy_regen（E4——1209 彦卿先例）；⑤ 行迹属性全丢→trace_stat_effects 收编
#   （draft 空 {}——暴击率+18.7%/攻击+18%/雷伤+8%，1509201-1509210 properties 实证，
#   TRACE_ modifier 通道）；⑥ E1 队友件挂 all_allies 含自身→代数 where 排自身（含自身
#   则 def_pen 双倍 0.3+0.3——官方「其他队友」；Saber 1014 fixture where 先例）；
#   ⑦ E1 能量段挡因证伪收编（gain_energy 通道在案——花火 11306101 先例，draft「未登记」
#   误；固定恢复按 05 §5.3 具名清单不豁免——Gilgamesh 未在列，吃 ERR）；⑧ 150905 削韧/
#   回能挡因证伪（米游社群攻「削韧 20/回能 10」在案——draft「均无记载」误；fandom
#   10+10 分段互证：雷 10 收、风 10 随 Saber 伤害段待收；回能走 hook gain_energy 实账
#   ——action 层账面档案，翡翠 131404 先例）；⑨ 兴致 max 20 脑补→"inf"（官方文本无上限
#   ——不脑补，待实测）；⑩ 1509102 层数语义：每获得 1 点=1 层——一次 +N 点应 +N 层
#   （draft stacks 1 字面恒 +1）；apply 建层 + adjust_stacks delta "$event.amount-1"
#   组合精确（病 11 动态层通道）；condition 补 $event.amount>0（战技清空 set 0 同发
#   on_resource_gain——不滤则误 +1 层）；⑪ INTEREST_SPD 烘焙滞后：draft 挂「队友行动」
#   钩——只覆盖 1/6 变动路径（开大+2/E2+5/追击+3/秘技+3/战技清空全滞后）→改挂
#   on_resource_gain 全路径重挂烘焙（病 10 族——烘焙追值靠重挂钩对齐变动路径）；
#   ⑫ INTEREST_PIQUED 判据改 $event.current>=10（载荷 current=写入后现值——快照语义
#   直读最稳）；⑬ E6 额外弹射段 toughness_dmg 2×10 摘除（官方「弹射倍率提高 80%」非
#   额外段——削韧不翻倍，总账 40+2×10 双源在案；deal_damage 缺省 0）；⑭ 弹射段补
#   action_type: "ultimate"（伪行动类别声明槽——飞霄 1220 先例 2026-09-14 接线；官方
#   弹射属终结技伤害，draft 缺省伪 follow_up 误出王来背负 dmg_ultimate 桶集）；
#   ⑮ E6 黄金律暴伤段→待收（on_ultimate/on_action 发射均后于伤害结算——「施放时消耗
#   使本次终结技暴伤提高」无施放前挂点；技域限定 crit_dmg 无 scoped 通道——draft
#   duration 1 件吃不到本次且泄漏后续，假；获得/消耗账目照收）；⑯ E3 普攻实取档
#   lv7=1.1 勘正（draft 注 lv8 误——编译器默认 basic 6+E3+1，行迹 level_up_skills 不
#   进 _effective_skill_levels）；E5 双天赋同升去「待实测」（引擎单档 talent 构造同升
#   +行迹 1509004 同给 150904/150905 +1 双证据）；⑰ 150905 触发钩补 Saber 主体（draft
#   挡因「Saber 未下发」过期——fixtures 1014 在案；计数 condition 双主体）；Saber 固定
#   回 120 收编（gain_energy 代数 where——1217 藿藿排自身先例；按清单不豁免）；
#   ⑱ 150905 action 补 level_key: "talent"（draft 缺——缺省 follow_up 归 ultimate 轨道
#   会被 E5 ult+2 误抬，talent+2 才是正主；翡翠先例——本角色 E5 双 +2 数值巧合同档，
#   语义病仍勘）。
#
# 收录：普攻 150901（兴致态 available_if 互斥）/ 战技 150902（Blast 主 2.8 邻 1.4 lv10
#       + 王来承认 def_pen 0.3 三回合 + 耗产 0/0）/ 自动普攻 150909（Skill 名义 basic
#       轨同账）/ 终结技 150903（全体 4.0 + 10 段随机弹射 1.0/段逐段削韧 2 标 ultimate）
#       / 天赋① 150904（王来背负 40% 终结技增伤三回合 + 兴致 SPD 每点 10% + 兴致首达
#       10 进【来兴致了！】+ 战技清空兴致）/ 天赋② 150905（吉/Saber 攻击计数 8 → 连携
#       追击 4.0 AoE 雷 + 兴致 +3 + 回能 10 + Saber 回 120）/ 行迹 1509101 兴致段（自
#       开大 +2/队友开大 +2）/ 1509102 暴伤层（每层 25% 至多 6 层，获得 N 点=+N 层）/
#       1509103 基础光环（atk/暴伤各 +20% team）/ 秘技 150907（200% 雷 + 3 兴致）/
#       E1（队友 def_pen 0.3 + 自 atk +60% + 回 40）/ E2（开战 +5/自开大 +5 兴致）/
#       E3/E5 等级族 / E4（ERR +20%）/ E6（res_pen 20% team + 黄金律获得/消耗账目 +
#       弹射倍率 +80% 等值 10 段 0.88）
# 待收（均带挡因）：1509101 能量段（队友开大固定恢复当次消耗能量 30%——on_ultimate
#       载荷 {action,source,target} 无消耗能量字段）/ 1509103 溢出段（能量上限>140 逐
#       目标加成——#4=0.01/#5=1 百分数语义未定 + 逐目标动态光环无现役通道）/ 天赋①
#       自动普攻系统代放（DSL 无 trigger_action 通道——政策层承载；「初始」与兴致态
#       交互待实测）/ 150905 风伤段（Saber 6.0×atk lv10 风 AoE + 削韧 10——deal_damage
#       结算主体=hook owner 无 source 覆盖槽：基数 Saber 面板、乘区错挂吉尔伽美什=假；
#       跨 actor 伤害结算通道缺）/ 150905 #6 Saber 下次终结技倍率 200%（scoped 乘区通道
#       缺 + EN '%' 与数值域 1.2→2.4 冲突语义待实测——Saber 1014 fixture 同类缺口在案）
#       / E2 战技倍率 +100%/+50%（星魂档覆写 action 层倍率无通道——遐蝶 E6 同挡因；
#       加算 vs 独立乘区待实测）/ E6 黄金律暴伤（勘正⑮——施放前挂点 + scoped crit 双缺）
#       / 150907 领域大世界段（10 秒/停止行动/领域互斥——场景域 DSL 不建模；伪
#       action_type 词表无 technique 键归 follow_up——类型桶偏差在案，翡翠同族）/
#       「我方队友施放终结技」是否含自身待实测（本版按排他收——知更鸟「我方队友立即
#       行动」不含自身先例；EN teammate 歧义在案）/ 兴致上限（官方未写——max "inf"
#       保守）/ 150909 与 150901 是否同轨同账待实测（本版账目照普攻：回能 20/产点 1/
#       削韧 10）/ E1 回 40 与 Saber 回 120 的 err_exempt（具名清单未列→吃 ERR；实测
#       豁免则回补）/ 弹射可否重复命中同一目标待实测（EXPECTED 按序取首确定化）/
#       150902 #3/#4/#7 无引用槽位参数（照抄保留，用途待实测）
