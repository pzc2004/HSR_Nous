# 角色模板：远坂凛（1508）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
#
# 过堂收编/勘正十六件：
#   ① E3/E5 等级族幻读勘正——draft 照「标准模板」脑补（E3=终结技+2/普攻+1、
#   E5=战技+2/天赋+2）；官方文本实证 E3=**战技+2、普攻+1**、E5=**终结技+2、
#   天赋+2**（cn/en character_ranks 双锚）。
#   ② res__gem_energy 双下划线勘正（万敌病同族）——rid gem_energy 无前导
#   下划线，平铺键=res_gem_energy；draft 双下划线映射未声明 _gem_energy，
#   available_if 运行期求值失败按不可用=普通/强化战技双死件 → res_gem_energy。
#   ③ 终结技建模式勘正——draft target_type aoe+scaling 600%：aoe=scaling 打
#   全体，其余敌人实吃 600%+hook 200%=800% 错账 → action 改 single 主目标
#   600%（削韧 30），其余 200%/削韧 20 由 hook 承担（官方「one designated
#   enemy + other enemy targets」）。
#   ④ hook 目标代数 `$it != $event.target` 恒真勘正（1005 卡芙卡同病——$it
#   是命名空间非裸 id）→ `$it.actor_id != $event.target`。
#   ⑤ 终结技副目标段补 action_type: "ultimate"（hook 伤害缺省归 follow_up/
#   additional——终结技身份族须声明，1220 飞霄先例；类型增伤桶/触发域才不错账）。
#   ⑥ 战技 150802 削韧 20 收编——draft 误判「mys_sub_tag=null/fandom 空→待
#   实测」：实为 tbgd LD ShowStanceList[60]→20 + fandom 20 + mys 削韧 20 三源一致。
#   ⑦ 强化战技 150809 首击 aoe 削韧 20 收编（tbgd[6,60]→2/20、fandom「20 AoE/
#   2 Per Bounce」、mys「削韧:2*n」三源；弹射 2/跳 随循环段待收、值在案）。
#   ⑧ 天赋 SP→Gem Energy 半件收编——draft 挡因①「事件词表无 on_sp_change
#   通道」证伪：on_skill_point_change 在库（1306 先例，载荷 before/after/
#   reason）；「每耗/产 1 点→+1 Gem Energy」两钩收（before-after 数值差）。
#   暴伤 70% 半件仍待收（载荷无消费主体字段——1306 星历②同族挡因）。
#   ⑨ 秉持优雅战技点上限+2 收编——draft 待收⑪「SP 上限通道缺」证伪：
#   set_sp_max 在库（1306 先例，state.sp_max_override）→ 开战 5+2=7。
#   ⑩ E6 额外回合收编——draft 待收⑨证伪：grant_extra_turn 原语在库（1015
#   先例；03 §3.11 正常回合类「终结技后额外回合」即词表例；新完整回合与
#   官方口径语义差待实测在案）。
#   ⑪ 终结技全体易伤 20%×3 收编——draft 待收④「DMG taken 键未实证」证伪：
#   vulnerability 在案键（1306 SPK_VULN 先例，敌方承伤区面板键，非 res_pen
#   挂敌方死键族）；param(150803,5) 随档、持续 #6=3 恒值 int 直给。
#   ⑫ E2 凛自身战技增伤 30% 收编——draft 待收⑦「键未实证」证伪：
#   dmg_skill_dmg_boost 类型桶在库（1008/1015 先例）；队友 130% 仍待收
#   （类型域最终乘区通道缺——scoped accept 只收 dmg_*，1015 E6③同族；
#   与自身 30% 叠算口径待实测）。
#   ⑬ 终结技产点+1 收编——官方文本「recovers #4[i] Skill Point(s)」+param
#   #4=1 双锚；tbgd BPAdd 空只载固有产点（效果段不入该位），fandom/mys SP
#   值为类型规则合成不采（AGENTS.md 在案）；1306 终结技回点 hook 先例 →
#   gain_skill_point param(150803,4)（待实测低优先在案）。
#   ⑭ minor 行迹白值节点收编——draft trace_stat_effects 空：官方
#   character_skill_trees properties 在库（1508201-1508210）→ crit_dmg
#   0.373/atk_pct 0.18/dmg_quantum 0.08（1312/1314 先例）。
#   ⑮ 星魂名/行迹名中文化——draft 用 EN 名：按手册核 cn character_ranks
#   （宝石翁的学徒/位面的旅行者/圣杯战争：胜利纪念/红色•恶魔•三倍速/
#   金星神的青睐/这次没掉链子！）与 character_skill_trees（秉持优雅/淑女
#   风范/财源广进，mys 额外能力名一致）；EN 名留注释。
#   ⑯ 削韧/能量/SP provenance 逐项重标三源（tbgd LD 配置/fandom/mys 五项）；
#   150809 sp_cost fandom=1 系类型合成不采（tbgd BPNeed=-1 → 0）。
# 收录：普攻 150801（单体 10 档 lv6=1.0/lv10=1.4；产点 1/回能 20/削韧 10 三源）/
#       战技 150802（单体 15 档 lv10=1.8；耗点 1/回能 30/削韧 20 三源；available_if
#       互斥半——仅 Gem<15 半，「SP≥7」半待收）/ 强化战技 150809 首击全体
#       （lv10=0.9；耗点 0/回能 30/削韧 20；available_if res_gem_energy>=15）/
#       终结技 150803（single 主 600% lv10+hook 其余 200%（ultimate 身份声明）；
#       回能 5/削韧 30+20；hook 全体易伤 param#5×3+产点 param#4=1+财源广进 12 Gem）/
#       天赋 150804（入场 +20 Gem param#1；SP 流转→每点 ±1 Gem 两钩）/
#       大行迹 秉持优雅（SP 上限 7+ATK+150%+量子穿抗 15%）/淑女风范（入场与强化
#       战技后速度+20%×3）/财源广进（终结技 12 Gem）/ minor 行迹白值（⑭）/
#       秘技 150807（进战 +10 Gem）/ 星魂 E2（自身战技增伤 30%）/E3/E5 等级族
#       （①口径）/E6（全属性穿抗 20%+终结技 24 Gem+额外回合）
# 待收（均带挡因）：天赋暴伤 70%×2 回合（on_skill_point_change 载荷无消费主体
#       字段——1306 星历②同族）与 E4 叠 2 层（依赖前件）/ 战技位「SP≥7」强化半
#       （SP 当前值读取键缺——1015 Guardian 同族）/ 150809 动态 bounce 循环（逐跳
#       耗 3 Gem、随机单体、≤33 跳、终止双分支——动态循环结算通道缺；值在案：
#       每跳 param(150809,3)×ATK、削韧 2/跳）与「SP>2 削至 2、每点回 2 Gem」段
#       （SP 削减/读取通道缺）/ 150805 联携追击（Archer 侧 Circuit Connection
#       状态/Caladbolg II 计数/Archer actor 关联通道缺+「SP≤3」判定同 SP 读取
#       挡因；值在案：凛 300%+Archer 300% lv10、产点+4 文本 vs tbgd BPAdd 空
#       冲突待实测、削韧 20（tbgd/mys）vs fandom 10+10 待实测、回能 10）/ E1
#       Shadow Gem（单次耗能≥30 计量通道缺）/ E2 队友 130%（⑫）/ 150807 参数
#       #2/#3=2（desc 未引用语义未知）/ 150803 #3=12（desc 未引用，与财源广进
#       同值疑似同源不重复计——待实测）/ 秉持优雅 Archer 继承范围歧义（待实测，
#       暂不收 Archer 侧）/ Gem 上限 99 推定（33 跳×3 反推；天赋表 #6=999 为
#       另一候选——待实测）
