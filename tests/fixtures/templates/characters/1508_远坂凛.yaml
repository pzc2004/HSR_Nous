  # 与「SP≤3」判定，两侧通道均缺；参数表已全档入 skill_params，通道到位后按
  # target_type "aoe" + scaling param(150805,1)×$self.atk + Archer 半 param(150805,4)×Archer atk 收编；
  # 值在案：产点+4（文本）vs tbgd BPAdd 空（冲突待实测）、削韧 20（tbgd[0,60]/mys 群攻 20）
  # vs fandom 10+10（待实测）、回能 10（tbgd SPBase/fandom/mys 三源）

  - action_id: "150809"
    name: "第二魔法实验"
    action_type: "skill"
    target_type: "aoe"
    damage_type: "quantum"
    available_if: "res_gem_energy >= 15"  # 强化位互斥半（过堂②；SP≥7 半待收——同 150802）
    scaling:  # 首击全体（lv1..lv15 全档照抄 params #1）；后续随机单体追加段待收（动态循环通道缺）
      - {"atk": 0.45}
      - {"atk": 0.495}
      - {"atk": 0.54}
      - {"atk": 0.585}
      - {"atk": 0.63}
      - {"atk": 0.675}
      - {"atk": 0.7312}
      - {"atk": 0.7875}
      - {"atk": 0.8438}
      - {"atk": 0.9}
      - {"atk": 0.945}
      - {"atk": 0.99}
      - {"atk": 1.035}
      - {"atk": 1.08}
      - {"atk": 1.125}
    toughness_dmg: 20       # 过堂⑦收编：首击 aoe 20（tbgd[60]→20 + fandom「20 AoE」+
                            # mys 弹射「削韧:2*n」首击位三源）；弹射 2/跳 随循环段待收
    skill_point_cost: 0     # tbgd BPNeed=-1 基准位 0；fandom sp_cost=1 系类型规则合成不采
                            #（AGENTS.md 在案）；「SP>2 削至 2、每点回 2 Gem」动态削减段
                            # 通道缺→待收（非固定 sp_cost）
    energy_gain: 30         # tbgd SPBase 30 + fandom/mys 回能 30 三源（与强化前战技同值）

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN；名按 cn character_ranks
#（EN 名注注释——过堂⑮）
eidolons:
  E1:
    name: "宝石翁的学徒"   # EN Zelretch's Apprentice
    notes:
      - "单次强化战技消耗≥30 Gem Energy → 获等量 Shadow Gem、持有期间战技保持强化、该次消耗全部 Shadow Gem 且不触发 SP→Gem Energy 转换、不消耗 Gem Energy：单次消耗量计量通道与 Shadow Gem 跨强化资源通道均缺 → 待收"
  E2:
    name: "位面的旅行者"   # EN Dimensional Traveler
    stat_effects: {"dmg_skill_dmg_boost": 0.3}   # 凛自身战技增伤 +30%（过堂⑫——类型桶在库）
    notes:
      - "凛在场时全体队友战技伤害 = 原伤害 130%：类型域最终乘区通道缺（scoped accept 只收 dmg_*——1015 E6③同族），且与凛自身 30% 的叠算口径官方未说明 → 待实测后收"
  E3:
    name: "圣杯战争：胜利纪念"   # EN Holy Grail War: Victory Memorial
    skill_level_overrides: {"skill": 2, "basic": 1}   # 过堂①勘正：官方=战技+2、普攻+1
    notes:
      - "战技+2 随档段：150802/150809 15 档 scaling 实取 lv12 档（1.98 / 0.99）；普攻+1 随档：150801 10 档表实取 lv7 档 1.1（draft 误挂终结技+2——官方文本实证勘正）"
  E4:
    name: "红色•恶魔•三倍速"   # EN Red Devil: Triple Speed
    notes:
      - "天赋暴伤效果作用于远坂凛本人时可叠加至 2 层：依赖天赋 SP 流转暴伤件（待收——载荷无消费主体字段，1306 星历②同族）；叠加口径（70%+70% 加算 or 独立实例）待实测 → 整条待收"
  E5:
    name: "金星神的青睐"   # EN Goddess of Venus's Favor
    skill_level_overrides: {"ultimate": 2, "talent": 2}   # 过堂①勘正：官方=终结技+2、天赋+2
    notes:
      - "终结技+2 随档段：主目标 scaling（action 层实取 lv12 档 6.6）+ 其余段 param(150803,2)/易伤 param(150803,5) 自动随档；天赋+2 随档段现仅入场能量 20（各档恒定），暴伤件待收后随 param(150804,3)（draft 误挂战技+2——官方文本实证勘正）"
  E6:
    name: "这次没掉链子！"   # EN Nailed It This Time!
    stat_effects: {"res_pen": 0.2}    # 全属性抗性穿透 +20%（mechanics 02：RES_PEN 含穿透/抗性降低）
    hooks:
      # 施放终结技时获得 24 Gem Energy + 1 个额外回合（过堂⑩收编——grant_extra_turn
      # 原语在库，03 §3.11 正常回合类「终结技后额外回合」即词表例）
      - event: "on_action"
        condition: "$event.actor == '1508' && $event.action_id == '150803'"
        effects:
          - effect_type: "gain_resource"
            resource_id: "gem_energy"
            amount: 24
          - effect_type: "grant_extra_turn"   # 额外回合（语义差待实测：新完整回合与
                                              # 官方口径、buff 回合计数消耗——1015 同款在案）
    notes:
      - "额外回合语义差待实测（过堂⑩在案）；24 Gem 与终结技其他回 Gem 段同钩序加算（clamp 上限 99 推定）"

hooks:
  # 150804 天赋「宝石魔术」·入场半：入场获得 20 点 Gem Energy（#1 各档恒 20）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_resource"
        resource_id: "gem_energy"
        amount: "param(150804, 1)"

  # 150804 天赋·SP 流转半（过堂⑧收编——on_skill_point_change 在库，1306 先例）：
  # 我方每消费/恢复 1 战技点 → 远坂凛 +1 Gem Energy（before/after 数值差=实变动点数；
  # clamp 顶/触底无实变动不发事件=不计，官方「消耗/恢复」按实变动读）。
  # 暴伤 70%×2 回合半件待收（载荷无消费主体字段——1306 星历②同族挡因）
  - event: "on_skill_point_change"
    condition: "$event.after < $event.before"
    effects:
      - effect_type: "gain_resource"
        resource_id: "gem_energy"
        amount: "$event.before - $event.after"
  - event: "on_skill_point_change"
    condition: "$event.after > $event.before"
    effects:
      - effect_type: "gain_resource"
        resource_id: "gem_energy"
        amount: "$event.after - $event.before"

  # 1508101 大行迹 秉持优雅：开战 SP 上限 5+2=7（#1=2——过堂⑨ set_sp_max 收编，
  # 1306 先例；与花火天赋同队覆写竞态待实测）+ 常驻 ATK +150%（#2=1.5，小数=百分比；
  # 强度异常→待实测 B19 候选）、量子抗性穿透 +15%（#3=0.15）；
  # Archer 在队同享（继承范围歧义→待实测，暂不收 Archer 侧）
  - event: "on_battle_start"
    effects:
      - effect_type: "set_sp_max"
        amount: "5 + 2"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ELEGANT_CONDUCT"
          name: "秉持优雅"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"atk_pct": 1.5, "res_pen": 0.15}

  # 1508102 大行迹 淑女风范：入场时速度 +20% 持续 3 回合
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "LADYLIKE_POISE"
          name: "淑女风范"
          modifier_type: "buff"
          duration: 3
          dispellable: False
          stat_effects: {"spd_pct": 0.2}
  # 1508102 后半：施放强化战技（150809）后速度 +20% 持续 3 回合（EN 'after using Enhanced
  # Skill'——普通战技 150802 不触发）
  - event: "on_action"
    condition: "$event.actor == '1508' && $event.action_id == '150809' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "LADYLIKE_POISE"
          name: "淑女风范"
          modifier_type: "buff"
          duration: 3
          dispellable: False
          stat_effects: {"spd_pct": 0.2}

  # 150803 终结技其余段+效果段（on_action 一发全列，effects 序=文本序：先伤害后易伤——
  # 本次伤害不吃本次易伤）：
  # ① 其余敌人 200%（lv10 param #2）攻击力量子伤+削韧 20（tbgd[60]→20+fandom「20 Others」
  #    +mys 群体削韧 20 三源）；action_type "ultimate" 声明（过堂⑤——1220 先例）
  # ② 全体易伤 param #5（lv10 20%）持续 #6=3 回合（过堂⑪——vulnerability 在案键，
  #    1306 SPK_VULN 先例；持续全档恒 3 int 直给）
  # ③ 产点 param #4=1（过堂⑬——官方文本+param 双锚，1306 回点 hook 先例；触发天赋
  #    SP→Gem 链）
  # ④ 财源广进 12 Gem Energy（1508103 #1=12）
  - event: "on_action"
    condition: "$event.actor == '1508' && $event.action_id == '150803'"
    effects:
      - effect_type: "deal_damage"
        name: "山脉震撼•明星之薪·其余"
        target: {pool: "enemies", where: "$it.actor_id != $event.target"}
        damage_type: "quantum"
        action_type: "ultimate"
        amount: "param(150803, 2) * $self.atk"
        toughness_dmg: 20
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "RIN_ULT_VULN"
          name: "山脉震撼•明星之薪·易伤"
          modifier_type: "debuff"
          duration: 3
          dispellable: True
          stat_effects:
            vulnerability: "param(150803, 5)"
      - effect_type: "gain_skill_point"
        amount: "param(150803, 4)"
      - effect_type: "gain_resource"
        resource_id: "gem_energy"
        amount: 12

scaling_notes:
  - "百分比口径：官方 Ultimate #5=0.2 → 'increases DMG taken by 20%'（官方文本+数值）佐证本数据集小数=百分比；Talent #3=0.7=70% 暴伤、1508101 #2=1.5=150% ATK（异常值标待实测）"
  - "action_type 映射：150801→basic / 150802→skill / 150803→ultimate / 150809→skill（强化替换位，available_if 互斥——03 §3.8.1 同槽双技互斥声明，140702 先例）/ 150805→follow_up（Talent 攻击，触发链待收）/ 150804 纯机制→hooks / 150807 秘技→techniques / 150806 为通用「攻击」占位（params 空，忽略）"
  - "150809 强化战技动态段待收：首击全体已入 action scaling；每 3 Gem Energy 追加随机单体 90%（≤33 跳、终止=能量不足 or 无 HP>0 敌人、能量逐跳扣除）与「SP>2 削至 2、每点回 2 Gem Energy」——动态循环结算与 SP 削减通道缺，通道到位后按目标代数 {pool: enemies, take: 1, mode: random} + param(150809,3)×$self.atk 收编；弹射削韧 2/跳（tbgd[6]/fandom/mys 三源）在案"
  - "产点口径：150803 官方文本 #4=1「recovers 1 SP」已按文本+param 双锚收（hook gain_skill_point——tbgd BPAdd 位只载固有产点，效果段不入；fandom/mys SP 值为类型规则合成不采，待实测低优先）；150805 +4 SP 随追击整条待收（文本 vs tbgd BPAdd 空冲突待实测）"
  - "本体无护盾、无净化、无免死、无免疫（官方文本全条目无相应措辞）——下游需要这四类键时证据层明确「不存在」"
  - "Gem Energy 上限 99 为推定保守值（33 跳×3 反推）；天赋表 #6=999 为另一候选；终结技参数 #3=12（desc 未引用）与财源广进 12 同值疑似同源→不重复计、待实测；150807 参数 #2/#3=2 同为未引用残留→待实测"
