trace_notes:
- 大行迹「α模组-偏时迸发」（1310101 旧版）：「完全燃烧」状态下攻击没有火属性弱点的敌人
  也能削减韧性、效果等同于原技能削韧值的 55%——待收，挡因：modifier 驱动 toughness_scope
  覆写+折算系数通道缺（mechanics 04 §4.1"折算=闸门判定后按技能自身 toughness_dmg ×55%"——
  闸门外/系数槽均无 modifier 读取端）。**行迹层版本勘正（2026-09-14 B39 补课）：旧版 α
  是折算非 BE+25%——11310101 的击破特攻 +25% 是加强版行迹，本件（旧版）不得携带
  （state_config.stat_effects 的 break_effect 0.25 已随勘正摘除）。**
- 大行迹「β模组-自限装甲」（1310102 旧版）：击破特攻 ≥200%/360% 时攻击弱点击破状态敌人
  将本次削韧值转化为 35%/50% 超击破伤害——**已收**（B38③ super_break_modifier 池键 +
  燃烧门控 + 阈值 stat_exprs 现场求值。旧版档#1/#2=200%/360%、#3/#4=35%/50%——加强版档
  150%/300%→100%/150% 见 enhanced 件）。
- 大行迹「γ模组-过载核心」（1310103）：攻击力高于 1800 每超 10 点击破特攻 +0.8%（两版同值
  [1800,10,0.008]）——阶梯转化（step/per_step_bonus）未进 modifier 词表，待收。
- 天赋 131004 两条待收：① 非燃烧期随生命值线性插值的减伤（HP≤20% 时达最大 40%——modifier
  stat_effects 编译期定值，active_when/scale_stat 宏族未接线）；② 能量恢复至上限时解除自身
  所有负面（remove_modifier 须点名 modifier_id，无全体净化原语；action cleanse_self 槽
  不适用于事件触发）。
- 终结技 131003"使敌方目标受到装甲「萨姆」造成的击破伤害提高 20%（持续至本次攻击结束）"
  待收——"本次攻击"窗口 + 击破易伤 scoped 通道缺位（hit_condition 命中域只进直伤加成，
  不进击破管线）。

custom_resources:
  _e2_cd:
    max: 1               # E2 额外回合 CD 闩（旧版「1 回合后可再次触发」——置 1，萨姆回合结束清零）

state_config:
  state: "complete_combustion"
  name: "完全燃烧"                     # 131003 官方状态名（日志显示名）
  entry_action_id: "131003"            # 施放终结技即进入形态（现役唯一形态通道，17.1.1）
  replaces_actions: {"basic": "131008", "skill": "131009"}   # 获得强化普攻和强化战技
  locked_actions: ["ultimate"]         # 131003：「完全燃烧」状态下无法施放终结技
  exit_conditions: [{"trigger": "on_action_count", "value": 3}]   # 动数窗折算见下
  stat_effects:                        # 全 lv10 档（与 build 默认 skill_levels 对齐）
    spd: 60                            # 131003 lv10 #3：速度提高 60 点
    weakness_break_efficiency_boost: 0.5   # 131003 lv10 #2：强化普攻/战技弱点击破效率 +50%
                                       # （官方"持续至本次攻击结束"——燃烧内削韧全来自强化技，
                                       #  常驻与窗口语义等价：削韧只发生在攻击命中时）
                                       # 【行迹层版本勘正】旧版不得携带 BE+25%（那是加强版 α
                                       # 11310101）——break_effect 0.25 键已摘除；旧版 α=55%
                                       # 削韧折算（待收，见 trace_notes）
    dmg_dmg_reduction: 0.4             # 131004 lv10 #1：燃烧状态减伤效果维持最大值 40%
    effect_res: 0.3                    # 131004 lv10 #4：燃烧状态效果抵抗 +30%
  # 倒计时折算（官方 131003："倒计时固定拥有 #4[i]=70 速度"）——引擎 grant_countdown 把
  # **自身回合**变为倒计时型（无独立倒计时单位原语），故按"窗口内行动数守恒"折算：
  # 70 速一条 AV=142.86 内，形态内面板 174 速（114+60）的流萤恰动 3 次（含开大"行动提前
  # 100%"的立即行动：0 / 57.5 / 114.9）→ 倒计时速度=形态内速度（ratio=174/114）、n=3、
  # 初始满条，由 hooks on_ultimate 的 immediate_action 实现"行动提前 100%"首动立即弹出。
  # 行动集合与官方一致；独立倒计时单位落地后应改回 70 速+n=1。
  countdown_spd_ratio: 1.5263157894736842   # = 174/114（见上折算注）

hooks:
  # 大行迹「β模组-自限装甲」（1310102 旧版）：燃烧内击破特攻 ≥200%/360% → 超击破转化
  # 35%/50%（super_break_modifier 池键——B38③；enable_if 燃烧门控；阈值/档位 stat_exprs
  # 现场求值——旧版档显著低于加强版（100%/150%），版本差即加强点）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "BETA_SUPER_BREAK"
          name: "β模组-自限装甲"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "$self.state != ''"
          stat_exprs:
            super_break_modifier: "(stat_of($self, 'break_effect') >= 2.0 ? 0.35 : 0) + (stat_of($self, 'break_effect') >= 3.6 ? 0.15 : 0)"

  # 131004 茧式源火中枢：战斗开始时若能量不足 50% 则使其恢复至 50%（#2 全档固定 0.5）——
  # err_exempt：mechanics 05 §5.3 豁免清单具名（Firefly Chrysalid Pyronexus 天赋）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_energy"
        amount: "max(0, 0.5 * $self.max_energy - $self.energy)"
        err_exempt: true

  # 131002 指令-天火轰击（结算点：官方为施放时，hook 通道在行动结算后——除"行动中被
  # 击倒"边缘外等价）：
  # ① 消耗 40% 生命上限（#2 全档固定 0.4）；当前生命不足时降至 1 点——下限 1/max_hp
  #    （percent:0 会触发死亡结算，绕开）
  # ② 固定恢复 65% 能量上限（#3 档表 0.50→0.65，本标注按 lv15 满级口径：0.65×240=156；
  #    err_exempt：mechanics 05 §5.3 豁免清单具名——Firefly 战技为百分比回能仍在列）
  # ③ 行动提前 25%（#4 全档固定 0.25）——advance_action hook 原语未接（05_effects §5.2
  #    待收编）；delay_action 负值 = 同一距离原子反向（scheduler 距离守恒：remaining +=
  #    10000×pct），数学等价拉条
  - event: "on_action"
    condition: "$event.actor == '1310' && $event.action_id == '131002' && !$event.insert"
    effects:
      - effect_type: "set_hp_to_percent"
        percent: "max(($self.hp - param(131002, 2) * $self.max_hp) / $self.max_hp, 1 / $self.max_hp)"
      - effect_type: "gain_energy"
        amount: "param(131002, 3) * $self.max_energy"
        err_exempt: true
      - effect_type: "delay_action"
        amount: "-param(131002, 4) * 100"

  # 131003 火萤Ⅳ型-完全燃烧：① 自身行动提前 100%（=倒计时首动立即弹出，见 state_config
  # 折算注；immediate_action 无视推条置 0，与"提前 100%"常态等价）② 终结技通用回能 5
  # （米游社标签"回能5"；变身入口技路径不经行动回能槽，模板 energy_gain: 5 不生效，此处
  # hook 补齐；非豁免清单——吃 ERR）
  - event: "on_ultimate"
    condition: "$event.source == '1310' && $event.action == '131003'"
    effects:
      - effect_type: "immediate_action"
      - effect_type: "gain_energy"
        amount: 5

  # 131008 火萤Ⅳ型-底火斩击：回复等同于自身 20% 生命上限的生命值（#2 全档固定 0.2）
  - event: "on_action"
    condition: "$event.actor == '1310' && $event.action_id == '131008' && !$event.insert"
    effects:
      - effect_type: "heal_self"
        ratio: "param(131008, 2)"

  # 131009 火萤Ⅳ型-死星过载：回复等同于自身 25% 生命上限的生命值（旧版 #3 档表 0.25——
  # 新版已字面化 25% 并将 param 清零，本件（旧版）保留 param 取档）
  - event: "on_action"
    condition: "$event.actor == '1310' && $event.action_id == '131009' && !$event.insert"
    effects:
      - effect_type: "heal_self"
        ratio: "param(131009, 3)"

  # 131009 旧版植弱：为指定敌方**单体**添加火属性弱点 2 回合（#4 档表 2）——action
  # apply_modifiers 二值表达不出"指定单体"，hook 目标代数 take:1 主目标近似
  # （on_action 载荷无施放主目标——主/邻区分通道缺，1212 E1/1205 E1 同族）
  - event: "on_action"
    condition: "$event.actor == '1310' && $event.action_id == '131009' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "enemies", take: 1}
        modifier:
          modifier_id: "FF_FIRE_WEAK"
          name: "火属性弱点植入"
          modifier_type: "debuff"
          duration: 2
          weakness_add: ["fire"]

eidolons:
  E1:
    name: "我曾安眠，赤染之茧"
    hooks:
      # 强化战技不消耗战技点——返点近似（消耗后同事件返 1，账等同；时点差/满点溢出在案）
      - event: "on_action"
        condition: "$event.actor == '1310' && $event.action_id == '131009' && !$event.insert"
        effects:
          - effect_type: "gain_skill_point"
            amount: 1
    notes:
      - "无视目标 15% 防御 待收——挡因：def_ignore/def_pen 键缺（res_pen 为抗性区不等值），1212 霜魄/1004 E6 同族"
  E2:
    name: "旧时之梦"
    hooks:
      # 燃烧内强化普攻/战技消灭或击破 → 立即额外回合（旧版 CD：「1 回合后可再次触发」
      # ——闩置 1，萨姆回合结束清零 ≈ 隔一回合；与新版"每回合 1 次"分版，见 enhanced）
      - event: "on_kill"
        condition: "$event.source == '1310' && ($event.action_id == '131008' || $event.action_id == '131009') && res__e2_cd < 1"
        effects:
          - effect_type: "grant_extra_turn"
          - effect_type: "set_resource"
            resource_id: "_e2_cd"
            amount: 1
      - event: "on_break"
        condition: "$event.source == '1310' && $self.state != '' && res__e2_cd < 1"
        effects:
          - effect_type: "grant_extra_turn"
          - effect_type: "set_resource"
            resource_id: "_e2_cd"
            amount: 1
      - event: "on_turn_end"
        condition: "$event.actor == '1310'"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e2_cd"
            amount: 0
    notes:
      - "on_break 载荷无 action_id——按燃烧内门控近似（燃烧内行动只有强化技，等价论证同 state_config 注）"
  E3:
    name: "沉睡在静默的星河"
    skill_level_overrides: {"skill": 2, "basic": 1}   # 战技+2 / 普攻+1（强化技同 level_key 随档）
  E4:
    name: "我会看见，飞萤之火"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_EFFECT_RES"
              name: "飞萤之火"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "$self.state != ''"
              stat_effects: {"effect_res": 0.5}
  E5:
    name: "自无梦的长夜亮起"
    skill_level_overrides: {"ultimate": 2, "talent": 2}   # 终结技+2 / 天赋+2
  E6:
    name: "绽放在终竟的明天"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_RES_PEN"
              name: "终竟的明天·火抗穿"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "$self.state != ''"
              stat_effects: {"res_pen": 0.2}
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_BREAK_EFF"
              name: "终竟的明天·削韧效率"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "$self.state != ''"
              stat_effects: {"weakness_break_efficiency_boost": 0.5}
    notes:
      - "削韧效率+50% 作用域=强化普攻/战技——按燃烧内常驻近似（燃烧内削韧全来自强化技，等价论证同 state_config 注；scoped hit_condition 族边界）"
