# 角色模板：流萤（1310）·**加强前**（legacy）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 版本双轨：官方加强前后差异面=强化战技弱点植入范围（单体→主+相邻）+ E2
# 额外回合重置语义（"1 回合后"→"每回合 1 次"）+ 强化战技治疗/弱点持续字面化
# （param #3/#4 新版清零）——加强后见 `1310_流萤.yaml`；build member 写
# `version: legacy` 选本件（编译期选文件，默认 enhanced——owner 裁定：加强
# 前后视为两个角色）。
#
# 出处：2026-09-05 机制标注闭环试点（生成器底+人工标注）→ 2026-09-14 版本化
# 拆分（B39）：本件按旧版文本重锤（弱点植入回单体——action apply_modifiers 仅
# self/all_enemies 二值无法表达"指定单体"，改 hook 目标代数 take:1 主目标近似；
# E2 按旧版"1 回合后可再次触发"建模）。
#
# 收录：战技 131002（耗血 40% 上限保底 1 / 回能 65% 能量上限 lv15 档·ERR 豁免 / 行动提前 25%）、
#       终结技 131003 完全燃烧（state_config：倒计时动数窗折算 / 速度+60 / 锁终结技 /
#       强化普攻战技替换 / 弱点击破效率+50% / 减伤 40% 维持 / 效果抵抗 +30% / α模组击破特攻 +25%）、
#       终结技行动提前 100%（immediate_action）+ 通用回能 5（hook 补，入口技路径不经行动回能槽）、
#       强化普攻 131008（回血 20% / 产 1 点 / 不回能）、强化战技 131009（回血 25% / 耗 1 点 /
#       不回能 / 植火弱**单体** 2 回合——hook 通道）、天赋 131004 战斗开始能量不足 50% 补至 50%（ERR 豁免）/
#       E1 强化战技不耗点（返点近似）/ E2 旧时之梦（旧版 CD）/ E3/E5 等级族 /
#       E4 燃烧内效果抵抗+50% / E6 燃烧内火抗穿+20%+削韧效率+50%
# 待收：见 trace_notes（非燃烧期线性减伤 / 能量满全净化 / α倒计时延后 / 击破易伤窗口 / β超击破 / γ阶梯转化）/
#       E1 无视防御 15%（def_ignore 键缺——1212 霜魄族）
