# 角色模板：爻光（1502）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging 1502_爻光.yaml）+ 过堂勘正（staging→fixtures 合并流水线）。
# 数据源：StarRailRes（技能/星魂/行迹文本+params 逐项对轴）+ fandom（普攻削韧 10/5、战技
# 耗 1 点回 30、大招回 5）+ docs/mechanics/08_elation_system.md（欢愉体系规则：进战 20 点
# 好活当赏 / 进战每欢愉角色 +1 笑点 / 好活当赏笑点值合并）+ sim_schema/docs/21_elation.md
# （欢愉体系未实装在案——elation 面板/punchline 乘区/阿哈行动条均无引擎路径）。
#
# 过堂勘正十五件：
#   ① 行迹白值漏收——draft trace_stat_effects 空块：小节点 crit_rate +18.7%
#     （1502201/03/05/07/10：0.027×2+0.04×2+0.053）与 SPD flat +9（1502202/06/09：2+3+4）
#     收编；欢愉度 +10%（1502204/08）无面板键待收（挡因见待收①）。draft scaling_notes
#     「行迹无 SPD 白值节点」一并证伪（1502202/06/09 在案）。
#   ② 笑点钩快照病（幻视族谱#9）——draft 条件只门 has_modifier(ELATION_ZONE)：首次施放
#     战技与挂结界同事件，多钩 condition 读事件前旧值 → 首技 0 笑点（官方：施放战技即得
#     #3=3）。补 `|| $event.action_id == '150202'` 补偿（战技施放必同时（重）挂结界）。
#   ③ 大吉大利触发者范围错——draft `$event.actor != '1502'` 排除自身且无攻击过滤（队友
#     对友支援技也误触发）；CN 原文「我方目标施放攻击后」含自身。正解：
#     actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster'
#     （攻击=以敌为主目标，1401 大黑塔先例）；draft 的 insert 闩摘除——insert 追加/反击同
#     属攻击（待实测在案），多段行动单 on_action 不重复触发。
#   ④ 好活当赏「官方未描述获取」翻案——docs/mechanics/08 §8.1 在案：进战所有欢愉角色
#     获得 20 点好活当赏（持续 2 回合；行迹 1502103 #2=1 → +1=3 回合）。on_battle_start
#     收编（stacks 20；refresh 重挂加层=「多次好活当赏笑点值合并计算」同语义），天赋钩激活。
#   ⑤ 散装零成本 action（幻视族谱#15）——draft 150220 欢愉技 0 耗 +5 回能可手动连放=
#     免费施放后门；energy_gain 5 无源脑补（fandom 无 150220 条目）。available_if
#     "res_aha_turn >= 1" 封手动（aha_turn=阿哈时刻接线锚，接入前恒 0），回能/削韧保守 0 待实测。
#   ⑥ 150220 scaling 15 行全写 1.0——只 lv10 对；官方 #2 全表照抄 0.5/0.55/…/1.25。
#   ⑦ 凶星低语全漏——150220 使敌方全体承伤 +16%（#3）持续 3 回合（#4 恒档）：action
#     apply_modifiers target all_enemies 收编（vulnerability 在案键；副作用先于伤害段
#     ——本发即吃，与官方文本序「先陷入后造成」一致）。
#   ⑧ E3/E5 欢愉技等级轨翻案——draft「欢愉技无独立等级轨键」错：引擎倍率取档
#     level_key 缺省按 action_type（follow_up 轨在案，engine.py:1117；slo 加算
#     levels.get(k,10)+v 同案）。E3/E5 slo 各补 follow_up:1（欢愉技+1 官方明文）。
#   ⑨ 行迹 1502102 战技点恢复错标待收——「施放欢愉技后为我方恢复 #1=1 点战技点」触发
#     通道在案（on_action 150220 → gain_skill_point 1），收编。
#   ⑩ 秘技回能漏——秘技=开战自动触发 1 次战技（官方「此次触发不消耗战技点」）：战技
#     回能 30 随本体（阮梅秘技同构），draft 只挂结界+笑点。补 gain_energy 30。
#   ⑪ 进战笑点漏——docs/mechanics/08 §8.2：进战每有 1 名欢愉角色 +1 笑点。
#     on_battle_start gain_resource punchline = count_team(path='elation')（命途计数正用）。
#   ⑫ 大吉大利属性写死 physical——官方「对应属性欢愉伤害」→ damage_type
#     element_of($event.actor) 动态求值（1414 丹恒•腾荒同袍先例）。
#   ⑬ 大招抗穿挂法——draft 挂 self/team-scope 按爻光回合走字；官方「我方全体…持续
#     #3=3 回合」按各持有者回合走字（1306 谜诡先例）→ on_ultimate 钩 target all_allies；
#     punchline +5（#1 恒 5）并入 action resource_gain，钩只留抗穿。
#   ⑭ E2 SPD buff 挂法——draft 只在战技 cast 挂 3 回合（秘技开战路径不起）；官方「结界
#     持续期间」→ 常驻 modifier + enable_if has_modifier($self,'ELATION_ZONE') 门控
#     （1507 千冶•刃 Zone 门控光环先例），秘技/施技双路径同真。
#   ⑮ hook deal_damage 通道错——draft 大吉大利/150220 随机段用 amount（ability_multiplier
#     基数直写槽——资源值即基数族）：0.2 当基数 → 实伤≈0.1（日志 0 伤实证）。正解
#     scaling_atk（atk 倍率槽，占位基数随欢愉管线待收②）。
#
# 收录：结界（3 回合·自身回合开始走字·门控笑点/ E2 速度）/ 笑点账（普攻·战技 +3、终结技
#   +5、进战每欢愉角色 +1）/ 终结技全队全抗穿 +20%（lv10，各持有者 3 回合）/ 好活当赏
#   （进战 20 层 3 回合）→ 大吉大利（我方攻击附加占位欢愉伤害·对应属性）/ 欢愉技 150220
#   （凶星低语易伤 16%+AoE+随机 5 段·手动封禁待阿哈时刻）/ 行迹（暴伤 +60%、暴率 +18.7%、
#   SPD +9、欢愉技回 1 点）/ 秘技（开战结界+笑点+30 能）/ E2 结界 SPD +12% / E3·E5 等级轨
#   （含 follow_up 欢愉技轨）。
#
# 待收（均带挡因）：
#   ① 欢愉值面板——elation StatBlock 键缺（21 章未实装）：行迹 1502101 SPD 转模（≥120 速
#     +30%，每超 1 点 +1% 至多计 200）、小节点 +10%、结界共享（150202 #2）、E2 +16%、
#     大吉大利「攻击者欢愉度低于爻光则用爻光欢愉度」全族待面板接入。
#   ② 欢愉伤害管线——等级系数 7535.107 基数 / punchline_multi=1+5X/(X+240) / merrymake /
#     elation_boost / 不吃通用增伤·不受虚弱特性均未接：大吉大利与 150220 伤害现为
#     ATK×倍率 占位（常规管线），数值只对轴 DSL 接线，不代表官方欢愉公式。
#   ③ 阿哈时刻——特殊行动条单位（速度 80+V1×0.2+V2×0.1+V3×0.05+V4×0.02）/ 消耗全笑点 /
#     欢愉技按欢愉编号自动触发 / 终结技授予额外回合（#4 固定 20 不耗笑点）/ E1 40 / E4 该
#     回合欢愉技 150%：调度器无 aha 单位通道；150220 触发锚 res_aha_turn 已声明待接线。
#   ④ E1② 造成欢愉伤害时全体队友无视目标 20% 防御——攻击方条件穿透键缺（def_pct 负值
#     挂敌方不合「造成欢愉伤害时」条件语义，不造键）。
#   ⑤ E6① 全体欢愉伤害增笑 25%（merrymake 乘区未接管线）；E6② 爻光欢愉技倍率 +100% 原
#     倍率（星魂覆写 action 倍率无通道——eidolon overrides 只接 state_config）。
#   ⑥ 大吉大利「本次攻击若消耗战技点额外触发 1 次」——on_action 载荷无 sp_consumed 字段。
#   ⑦ punchline 全队共享口径——16 章 scope: team 已登记未消费（指路炸），现 actor 账；
#     阿哈时刻消耗全部笑点随待收③。
#   ⑧ 150220 削韧/回能——fandom/米游社均无 150220 条目，保守 0 待实测；欢愉技是否触发
#     大吉大利按文本「施放攻击」收（待实测）。
#   ⑨ 未文本引用 param 在案：1502103 #1=20（疑=进战好活当赏值，与机制文档 20 互证待实测）；
#     1502102 #2=0.25/#3=0.4 未引用；150203 #5=1（额外回合计数，随待收③）。
