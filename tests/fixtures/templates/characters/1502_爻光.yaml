# 角色模板：爻光（1502）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging 1502_爻光.yaml）+ 过堂勘正（staging→fixtures 合并流水线）。
# 数据源：StarRailRes（技能/星魂/行迹文本+params 逐项对轴）+ fandom（普攻削韧 10/5、战技
# 耗 1 点回 30、大招回 5）+ docs/mechanics/08_elation_system.md（欢愉体系规则：进战 20 点
# 好活当赏 / 进战每欢愉角色 +1 笑点 / 好活当赏笑点值合并）+ sim_schema/docs/21_elation.md
# （欢愉体系 B40 已落地——elation 面板/punchline 乘区/阿哈行动条全通，见文末 B40 迁移记）。
#
# 过堂勘正十五件：
#   ① 行迹白值漏收——draft trace_stat_effects 空块：小节点 crit_rate +18.7%
#     （1502201/03/05/07/10：0.027×2+0.04×2+0.053）与 SPD flat +9（1502202/06/09：2+3+4）
#     收编；欢愉度 +10%（1502204/08）无面板键待收（挡因见待收①）。draft scaling_notes
#     「行迹无 SPD 白值节点」一并证伪（1502202/06/09 在案）。
#   ② 笑点钩快照病（幻视族谱#9）——draft 条件只门 has_modifier(ELATION_ZONE)：首次施放
#     战技与挂结界同事件，多钩 condition 读事件前旧值 → 首技 0 笑点（官方：施放战技即得
#     #3=3）。补 `|| $event.action_id == '150202'` 补偿（战技施放必同时（重）挂结界）。
#   ③ 大吉大利触发者范围错——draft `$event.actor != '1502'` 排除自身且无攻击过滤（队友
#     对友支援技也误触发）；CN 原文「我方目标施放攻击后」含自身。正解：
#     actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster'
#     （攻击=以敌为主目标，1401 大黑塔先例）；draft 的 insert 闩摘除——insert 追加/反击同
#     属攻击（待实测在案），多段行动单 on_action 不重复触发。
#   ④ 好活当赏「官方未描述获取」翻案——docs/mechanics/08 §8.1 在案：进战所有欢愉角色
#     获得 20 点好活当赏（持续 2 回合；行迹 1502103 #2=1 → +1=3 回合）。on_battle_start
#     收编（stacks 20；refresh 重挂加层=「多次好活当赏笑点值合并计算」同语义），天赋钩激活。
#   ⑤ 散装零成本 action（幻视族谱#15）——draft 150220 欢愉技 0 耗 +5 回能可手动连放=
#     免费施放后门；energy_gain 5 无源脑补（fandom 无 150220 条目）。available_if
#     "res_aha_turn >= 1" 封手动（aha_turn=阿哈时刻接线锚，接入前恒 0），回能/削韧保守 0 待实测。
#   ⑥ 150220 scaling 15 行全写 1.0——只 lv10 对；官方 #2 全表照抄 0.5/0.55/…/1.25。
#   ⑦ 凶星低语全漏——150220 使敌方全体承伤 +16%（#3）持续 3 回合（#4 恒档）：action
#     apply_modifiers target all_enemies 收编（vulnerability 在案键；副作用先于伤害段
#     ——本发即吃，与官方文本序「先陷入后造成」一致）。
#   ⑧ E3/E5 欢愉技等级轨翻案——draft「欢愉技无独立等级轨键」错：引擎倍率取档
#     level_key 缺省按 action_type（follow_up 轨在案，engine.py:1117；slo 加算
#     levels.get(k,10)+v 同案）。E3/E5 slo 各补 follow_up:1（欢愉技+1 官方明文）。
#   ⑨ 行迹 1502102 战技点恢复错标待收——「施放欢愉技后为我方恢复 #1=1 点战技点」触发
#     通道在案（on_action 150220 → gain_skill_point 1），收编。
#   ⑩ 秘技回能漏——秘技=开战自动触发 1 次战技（官方「此次触发不消耗战技点」）：战技
#     回能 30 随本体（阮梅秘技同构），draft 只挂结界+笑点。补 gain_energy 30。
#   ⑪ 进战笑点漏——docs/mechanics/08 §8.2：进战每有 1 名欢愉角色 +1 笑点。
#     on_battle_start gain_resource punchline = count_team(path='elation')（命途计数正用）。
#   ⑫ 大吉大利属性写死 physical——官方「对应属性欢愉伤害」→ damage_type
#     element_of($event.actor) 动态求值（1414 丹恒•腾荒同袍先例）。
#   ⑬ 大招抗穿挂法——draft 挂 self/team-scope 按爻光回合走字；官方「我方全体…持续
#     #3=3 回合」按各持有者回合走字（1306 谜诡先例）→ on_ultimate 钩 target all_allies；
#     punchline +5（#1 恒 5）并入 action resource_gain，钩只留抗穿。
#   ⑭ E2 SPD buff 挂法——draft 只在战技 cast 挂 3 回合（秘技开战路径不起）；官方「结界
#     持续期间」→ 常驻 modifier + enable_if has_modifier($self,'ELATION_ZONE') 门控
#     （1507 千冶•刃 Zone 门控光环先例），秘技/施技双路径同真。
#   ⑮ hook deal_damage 通道错——draft 大吉大利/150220 随机段用 amount（ability_multiplier
#     基数直写槽——资源值即基数族）：0.2 当基数 → 实伤≈0.1（日志 0 伤实证）。正解
#     scaling_atk（atk 倍率槽，占位基数随欢愉管线待收②）。
#
# 收录：结界（3 回合·自身回合开始走字·门控笑点/ E2 速度欢愉度·欢愉度共享光环）/ 笑点队伍账
#   （普攻·战技 +3、终结技 +5、进战每欢愉角色 +1 引擎统发）/ 终结技全队全抗穿 +20%（lv10，
#   各持有者 3 回合）+ 额外阿哈时刻（aha_instant 固定 20 不耗池照授）/ 好活当赏条目列表
#   （进战 20 点 3 回合——行迹 1502103 +1 经 banger_turns 档）→ 大吉大利（我方攻击附加欢愉
#   伤害·对应属性·真路由）/ 欢愉技 150220（elation_skill 正身——凶星低语易伤 16%+AoE+随机
#   5 段·体系触发）/ 行迹（暴伤 +60%、暴率 +18.7%、SPD +9、欢愉度 +10%、SPD 转欢愉度、
#   欢愉技回 1 点）/ 秘技（开战结界+笑点+30 能）/ E2 结界 SPD +12%·欢愉度 +16% / E3·E5
#   等级轨（含 elation_skill 欢愉技轨）/ E4 额外回合欢愉技 150% / E6① 增笑 25%。
#
# 待收（均带挡因）：
#   ① 大吉大利「攻击者欢愉度低于爻光则用爻光欢愉度」择优半件——hook deal_damage
#     category elation 伤害源恒持有者（爻光），攻击者欢愉度更高时无「用攻击者的」覆写槽
#     （引擎缺口，e2e 场景辅手欢愉度 0 恒低于爻光 → 现口径全等，不造键）。
#   ② E1① 终结技触发的阿哈额外回合固定计入笑点 20→40——aha_instant effect 固定 20
#     字面（hooks.py 无 param/表达式槽，引擎缺口）；E1② 造成欢愉伤害时全体队友无视目标
#     20% 防御——攻击方条件穿透键缺（def_pct 负值挂敌方不合「造成欢愉伤害时」条件语义，
#     不造键）。
#   ③ E6② 爻光欢愉技倍率 +100% 原倍率——倍率覆写无通道（eidolon overrides 只接
#     state_config；elation_dmg_boost 为全欢愉伤害平坦键无行动域区分，映射会误伤大吉
#     大利，不硬凑）。
#   ④ ~~大吉大利「本次攻击若消耗战技点额外触发 1 次」~~ **已收编（2026-09-23）**——
#     on_action 载荷 sp_consumed 槽落地（engine 全发射点+实际耗点净值），第二钩
#     `$event.sp_consumed > 0` 双触。
#   ⑤ 150220 削韧/回能——fandom/米游社均无 150220 条目，保守 0 待实测；欢愉技是否触发
#     大吉大利按文本「施放攻击」收（待实测）；终结技抗穿与额外阿哈回合钩序（抗穿先挂、
#     当次欢愉伤害吃抗穿——EN "This turn … and increases" 同句承载同帧生效口径）待实测。
#   ⑥ 未文本引用 param 在案：1502103 #1=20（疑=进战好活当赏值，与机制文档 20 互证待实测）；
#     1502102 #2=0.25/#3=0.4 未引用；150203 #5=1（额外回合计数，aha_instant 单发在案）。
#
# B40 迁移记（2026-09-15——欢愉体系基建落地后摘待收，旧待收①②③⑤⑦ 全兑现/部分兑现）：
#   ⓵ 欢愉技 150220 正身——action_type follow_up → elation_skill（官方 type ElationDamage
#   互证；合法行动集引擎排除手动施放，顶替旧 res_aha_turn 闩——available_if 与 aha_turn
#   声明全摘，勘正⑤闩退役）；scaling 行键 atk → elation 纯倍率（等级系数 7535.107 路由
#   ——ATK 占位退役，数值不动）；level_key/slo 键 follow_up → elation_skill 同步；随机 5 段
#   hook scaling_atk → category "elation" + amount 纯倍率 + punchline_source "res_punchline"
#   （21_elation §21.2 定槽——欢愉技=阿哈笑点池实时值，额外时刻经 _aha_pool_override 锚 20）。
#   ⓶ 好活当赏条目化——modifier CERTIFIED_BANGER 层账翻案：进战 +20 归引擎 _init_aha 统发
#   （本钩摘除，防双发）；行迹 1502103「持续 +1 回合」→ custom_resources decl banger_turns
#   current: 3（引擎条目回合数档覆写——与旧 duration 2+1=3 同值）；大吉大利门控
#   has_modifier → resource_of('1502','certified_banger') >= 1（emit 快照域同口径）。
#   ⓷ 大吉大利真路由——category "elation" + amount param(150204,1) 纯倍率 + punchline_source
#   分情况三元（触发角色持有好活当赏取其合并值、无则取爻光的——引擎定槽注释「触发角色无
#   好活用爻光的算」族）；对应属性 element_of($event.actor) 保留；占位 ATK 基数退役（旧
#   勘正⑮ scaling_atk 通道同退）。
#   ⓸ 终结技额外阿哈时刻——on_ultimate 钩末位挂 aha_instant effect（150203 #4=20/#5=1：
#   固定 20 结算不耗池、照授 20 好活当赏、代放欢愉技；钩序=抗穿先挂额外回合后发——同句
#   承载同帧生效口径，当次欢愉伤害吃抗穿，时序待实测⑤）；E1① 20→40 无槽随待收②。
#   ⓹ 欢愉度四件收编——小节点 +10%（1502204/08 ElationDamageAddedRatioBase 0.04+0.06）
#   trace_stat_effects elation 键；行迹 1502101 SPD 转模常驻件 stat_exprs 现场求值
#   （$self.spd=无条件件面板——E2 速度等条件件不计入，04_modifier §4.16 防环口径在案）；
#   结界共享 ELATION_ZONE stat_exprs elation = param(150202,2)×$self.elation（无条件件
#   面板基数=行迹 0.1——条件件贡献不计入，同防环口径）；E2 +16% 并入结界门控光环件。
#   ⓺ E4/E6 星魂收编——E4：aha_instant_start/end 双钩（$event.extra==1 门=「爻光终结技
#   触发的」在本模板唯一来源）挂/摘 dmg_final_dmg_boost 0.5（final_dmg_boost 池——
#   pipeline 注「爻光 E4 欢愉技 150% 落点」在案；平坦池无行动域——窗内大吉大利同吃，
#   官方只欢愉技，口径偏差在案）；E6① merrymake 0.25 常驻 team 件（官方「全体欢愉伤害
#   增笑」域全等）；E6② 随待收③。
