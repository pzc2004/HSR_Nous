      - "② 爻光自身欢愉技倍率 +100% 原倍率（AoE param(150220,2)×2 / 随机段 param(150220,6)×2）——待收③（星魂覆写 action 倍率无通道；elation_dmg_boost 平坦键无行动域区分，映射误伤大吉大利，不硬凑）"

hooks:
  # 战技 150202：展开结界（3 回合，自身回合开始走字；effect_scope team——欢愉度共享
  # #2 经 stat_exprs 辐射我方全体（B40 ⓹），兼门控锚：笑点钩/E2 光环 has_modifier 实读）
  - event: "on_action"
    condition: "$event.actor == '1502' && $event.action_id == '150202' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ELATION_ZONE"
          name: "十方光映，万法皆明"
          modifier_type: "buff"
          duration: 3
          tick_anchor: "owner_turn_start"   # 原文：自身每回合开始时结界持续回合数减 1
          effect_scope: "team"
          dispellable: False
          stat_exprs:        # 结界共享 #2（B40 ⓹）：我方全体欢愉度 += 爻光欢愉度×#2（$self=爻光
            elation: "param(150202, 2) * $self.elation"   # 无条件件面板基数=行迹 0.1，条件件贡献不计入——04 §4.16 防环口径）

  # 战技 150202 #3：结界持续期间，爻光施放普攻/战技后获得 #3=3 个笑点（勘正②快照补偿：
  # 首次战技与挂结界同事件，condition 读事件前旧值——`|| 150202` 补偿后首技即得）
  - event: "on_action"
    condition: "$event.actor == '1502' && !$event.insert && ($event.action_id == '150201' || $event.action_id == '150202') && (has_modifier($self, 'ELATION_ZONE') >= 1 || $event.action_id == '150202')"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: 3

  # 开局布场（B40 ⓶⓹）：① 进战笑点 +1/名 与 ② §8.1 进战 20 点好活当赏（banger_turns
  # 档 3 回合条目）全归引擎原生统发（_init_aha——本钩旧 modifier 层账全摘，防双发）；
  # 本钩只余两件常驻：行迹 1502102 暴伤 +60% + 行迹 1502101 SPD 转欢愉度（stat_exprs
  # 现场求值——$self.spd=无条件件面板：行迹 flat +9 计入，E2 速度等条件件不计入，
  # 04 §4.16 防环口径；每超 1 点整档步进（//1）=「每超过 1 点」语义，8009101 先例）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "POISED_AND_SATED_CD"
          name: "神闲意满"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"crit_dmg": 0.6}   # 1502102 #4=0.6
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TRACE_1502101"
          name: "开屏有礼"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            elation: "$self.spd >= 120 ? 0.3 + 0.01 * min(200, ($self.spd - 120) // 1) : 0"

  # 终结技 150203：我方全体全属性抗性穿透提高 #2（lv10 20%），持续 #3=3 回合
  # （勘正⑬——all_allies 每持有者各挂，缺省 owner_turn_end 按各自回合末走字，1306 谜诡先例）
  # + 使阿哈立即获得 1 个固定计入 #4=20 笑点的额外回合（B40 ⓸——aha_instant effect：
  # 固定 20 结算不耗池、照授 20 好活当赏、按编号序代放欢愉技；钩序=抗穿先挂、额外回合
  # 后发——EN "This turn … and increases" 同句承载同帧生效口径，当次欢愉伤害吃抗穿，
  # 时序待实测⑤；E1① 20→40 无槽随待收②）
  - event: "on_ultimate"
    condition: "$event.source == '1502' && $event.action == '150203'"
    effects:
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "ULT_RES_PEN"
          name: "霓裳铁羽，六爻皆吉"
          modifier_type: "buff"
          duration: 3              # #3 各档恒 3
          dispellable: True
          stat_effects: {"res_pen": "param(150203, 2)"}
      - effect_type: "aha_instant"

  # 天赋 150204：持有好活当赏时，我方目标施放攻击后触发【大吉大利】——对随机 1 个击中的
  # 目标额外造成 1 次 #1（lv10 20%）对应属性欢愉伤害（勘正③触发范围/⑫对应属性；B40 ⓷
  # 真路由——category "elation" + amount 纯倍率 + punchline_source 分情况三元：触发角色
  # 持有好活当赏取其合并值、无则取爻光的——引擎定槽注释「触发角色无好活用爻光的算」族；
  # 「攻击者欢愉度低于爻光则用爻光欢愉度」=伤害源恒爻光口径，择优半件待收①；耗点额外
  # 触发待收④；门控 resource_of 读事件开始旧值=「持有时」判定（快照域族谱#9）；
  # deal_damage 不发 on_action 无递归=官方「不视为 1 次攻击」同语义）
  - event: "on_action"
    condition: "actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster' && resource_of('1502', 'certified_banger') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "大吉大利"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "element_of($event.actor)"
        amount: "param(150204, 1)"
        punchline_source: "resource_of($event.actor, 'certified_banger') >= 1 ? resource_of($event.actor, 'certified_banger') : resource_of('1502', 'certified_banger')"

  # 大吉大利耗点额外触发（2026-09-23 收编④——on_action 载荷 sp_consumed 槽落地，
  # 实际耗点净值 after before_consume 抵扣）：官方「本次攻击若消耗战技点，额外触发
  # 1 次」——对方 consumesSkillPoints×spUsed>0 → 倍率 ×2 聚合单发；我方第二段独立
  # 结算（段数差 D6 族在案，总和一致）；缺 sp_consumed 字段的旧载荷求值失败按不触发
  - event: "on_action"
    condition: "actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster' && resource_of('1502', 'certified_banger') >= 1 && $event.sp_consumed > 0"
    effects:
      - effect_type: "deal_damage"
        name: "大吉大利"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "element_of($event.actor)"
        amount: "param(150204, 1)"
        punchline_source: "resource_of($event.actor, 'certified_banger') >= 1 ? resource_of($event.actor, 'certified_banger') : resource_of('1502', 'certified_banger')"

  # 欢愉技 150220：随后对敌方随机单体造成 #5=5 次 #6（lv10 20%）物理属性欢愉伤害（B40 ⓵
  # 真路由——category "elation" + amount 纯倍率 + punchline_source "res_punchline"（欢愉技
  # 段=阿哈笑点池实时值，终结技额外时刻经 _aha_pool_override 锚定 20）；expected 模式
  # random 确定化=按序取首敌；无 insert 闩——额外时刻代放（insert=True）同发射）；行迹
  # 1502102：施放欢愉技后为我方恢复 #1=1 点战技点（勘正⑨——钩序文本序：段伤害在先、
  # 发点在后）
  - event: "on_action"
    condition: "$event.actor == '1502' && $event.action_id == '150220'"
    effects:
      - effect_type: "deal_damage"
        name: "赠君一卦，火树银花·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        amount: "param(150220, 6)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "赠君一卦，火树银花·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        amount: "param(150220, 6)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "赠君一卦，火树银花·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        amount: "param(150220, 6)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "赠君一卦，火树银花·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        amount: "param(150220, 6)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "deal_damage"
        name: "赠君一卦，火树银花·随机段"
        category: "elation"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        amount: "param(150220, 6)"
        punchline_source: "res_punchline"
        action_type: "elation_skill"
      - effect_type: "gain_skill_point"
        amount: 1

scaling_notes:
