        name: "凶星低语"
        modifier_type: "debuff"
        duration: 3          # #4 各档恒 3（缺省 owner_turn_end——敌方持有者各自回合末走字）
        stat_effects:
          vulnerability: "param(150220, 3)"   # #3：受到伤害提高 16%（lv10）
    # 随机 5 段 + 行迹回点走 hooks

eidolons:
  E1:
    name: "Chuckle Chimes Where Jade Falls"   # CN：何处落玉，盈盈笑语（character_ranks.json 核）
    notes:
      - "① 终结技触发的阿哈额外回合固定计入笑点 20→40——待收③（阿哈时刻通道缺）；② 造成欢愉伤害时全体队友无视目标 20% 防御——待收④（攻击方条件穿透键缺，不造键）"
  E2:
    name: "Blind Arrows Guided by Feathers"   # CN：飞箭无目，青翎为瞳
    hooks:
      # 结界持续期间我方全体 SPD +12%（勘正⑭）：常驻件 + enable_if 门控结界在场
      # （秘技开战/施技双路径同真；速度调度重同步靠 HP 事件推式，面板懒求值不受影响在案）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_ZONE_SPD"
              name: "飞箭无目，青翎为瞳·速度"
              modifier_type: "buff"
              duration: 0
              effect_scope: "team"
              dispellable: False
              enable_if: "has_modifier($self, 'ELATION_ZONE') >= 1"
              stat_effects: {"spd_pct": 0.12}
    notes:
      - "结界持续期间欢愉度额外 +16%——待收①（elation 面板键缺）"
  E3:
    name: "Auspices Mirrored In Decalight"    # CN：十方世界，光映符中
    skill_level_overrides: {"skill": 2, "basic": 1, "follow_up": 1}   # 官方：战技+2/普攻+1/欢愉技+1（勘正⑧）
    notes:
      - "战技+2 随档段：结界共享 param(150202,2)（lv12=22%，待收①随面板接入兑现）；欢愉技+1 随档段：150220 AoE/随机段 lv11"
  E4:
    name: "Threads of Fate Colored by Plumes" # CN：命若素绡，拈羽点彩
    notes:
      - "爻光终结技触发的阿哈额外回合中，所有队友欢愉技伤害变为原伤害 150%——待收③（阿哈时刻通道缺）"
  E5:
    name: "Bejeweled in Radiant Grace"        # CN：璎珞严饰，身如琉璃
    skill_level_overrides: {"ultimate": 2, "talent": 2, "follow_up": 1} # 官方：终结技+2/天赋+2/欢愉技+1（勘正⑧）
    notes:
      - "终结技+2 随档段：全队抗穿 param(150203,2)（lv12=22%）；天赋+2 随档段：大吉大利倍率 param(150204,1)（lv12=22%）"
  E6:
    name: "Ferried Along the Astral Arc"      # CN：牵丝渡引，天星垂虹
    notes:
      - "① 全体队友欢愉伤害获得 25% 增笑（merrymake 独立乘区）——待收⑤；② 爻光自身欢愉技倍率 +100% 原倍率（AoE param(150220,2)×2 / 随机段 param(150220,6)×2）——待收⑤（星魂覆写 action 倍率无通道，倍率表达式在案可断言）"

hooks:
  # 战技 150202：展开结界（3 回合，自身回合开始走字；effect_scope team 占位——欢愉度共享
  # #2 待收①，结界现为门控锚：笑点钩/E2 速度光环 has_modifier 实读）
  - event: "on_action"
    condition: "$event.actor == '1502' && $event.action_id == '150202' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ELATION_ZONE"
          name: "十方光映，万法皆明"
          modifier_type: "buff"
          duration: 3
          tick_anchor: "owner_turn_start"   # 原文：自身每回合开始时结界持续回合数减 1
          effect_scope: "team"
          dispellable: False

  # 战技 150202 #3：结界持续期间，爻光施放普攻/战技后获得 #3=3 个笑点（勘正②快照补偿：
  # 首次战技与挂结界同事件，condition 读事件前旧值——`|| 150202` 补偿后首技即得）
  - event: "on_action"
    condition: "$event.actor == '1502' && !$event.insert && ($event.action_id == '150201' || $event.action_id == '150202') && (has_modifier($self, 'ELATION_ZONE') >= 1 || $event.action_id == '150202')"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: 3

  # 开局三件：① §8.2 进战每欢愉角色 +1 笑点（count_team 命途计数，勘正⑪）；
  # ② §8.1 进战 20 点好活当赏（勘正④——持续 2+行迹 1=3 回合；refresh 重挂加层=
  # 「多次好活当赏笑点值合并」同语义；阿哈时刻结算授予随待收③接线）；
  # ③ 行迹 1502102 暴伤 +60%（常驻）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: "count_team(path='elation')"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "CERTIFIED_BANGER"
          name: "好活当赏"
          modifier_type: "buff"
          duration: 3              # 基础 2（§8.1）+ 行迹 1502103 #2=1
          stacks: 20               # 记录笑点值（§8.1 进战 20 点；modifier.stacks 只收 int 字面量）
          dispellable: False
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "POISED_AND_SATED_CD"
          name: "神闲意满"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"crit_dmg": 0.6}   # 1502102 #4=0.6

  # 终结技 150203：我方全体全属性抗性穿透提高 #2（lv10 20%），持续 #3=3 回合
  # （勘正⑬——all_allies 每持有者各挂，缺省 owner_turn_end 按各自回合末走字，1306 谜诡先例）
  - event: "on_ultimate"
    condition: "$event.source == '1502' && $event.action == '150203'"
    effects:
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "ULT_RES_PEN"
          name: "霓裳铁羽，六爻皆吉"
          modifier_type: "buff"
          duration: 3              # #3 各档恒 3
          dispellable: True
          stat_effects: {"res_pen": "param(150203, 2)"}

  # 天赋 150204：持有好活当赏时，我方目标施放攻击后触发【大吉大利】——对随机 1 个击中的
  # 目标额外造成 1 次 #1（lv10 20%）对应属性欢愉伤害（勘正③触发范围/⑫对应属性/⑮
  # scaling_atk 倍率槽——draft 误用 amount 基数直写槽，0.2 当基数≈0 伤；占位 ATK 基数
  # ——欢愉管线待收②；耗点额外触发待收⑥；deal_damage 不发 on_action 无递归）
  - event: "on_action"
    condition: "actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster' && has_modifier($self, 'CERTIFIED_BANGER') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "大吉大利"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "element_of($event.actor)"
        scaling_atk: "param(150204, 1)"

  # 欢愉技 150220：随后对敌方随机单体造成 #5=5 次 #6（lv10 20%）物理属性欢愉伤害
  # （勘正⑮ scaling_atk 倍率槽——draft 误用 amount 基数直写槽；占位 ATK 基数待收②；
  # expected 模式 random 确定化=按序取首敌）；行迹 1502102：
  # 施放欢愉技后为我方恢复 #1=1 点战技点（勘正⑨）
  - event: "on_action"
    condition: "$event.actor == '1502' && $event.action_id == '150220'"
    effects:
      - effect_type: "deal_damage"
        name: "赠君一卦，火树银花·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        scaling_atk: "param(150220, 6)"
      - effect_type: "deal_damage"
        name: "赠君一卦，火树银花·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        scaling_atk: "param(150220, 6)"
      - effect_type: "deal_damage"
        name: "赠君一卦，火树银花·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        scaling_atk: "param(150220, 6)"
      - effect_type: "deal_damage"
        name: "赠君一卦，火树银花·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        scaling_atk: "param(150220, 6)"
      - effect_type: "deal_damage"
        name: "赠君一卦，火树银花·随机段"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        scaling_atk: "param(150220, 6)"
      - effect_type: "gain_skill_point"
        amount: 1

scaling_notes:
  - "欢愉（Elation）体系通道缺口按 21 章未实装在案：elation 面板/笑点乘区/增笑乘区/等级系数基数均无引擎路径——涉及件（行迹 1502101/结界共享/E1/E2/E6/大吉大利与 150220 基数）如实标待收，不造键不脑补；大吉大利/150220 伤害为 ATK×倍率占位（常规管线），仅对轴 DSL 接线"
  - "笑点（Punchline）现为 actor 计数账（战技/普攻 +3、终结技 +5、进战每欢愉角色 +1 三路），上限待实测；(1+笑点) 乘区与全队共享口径随欢愉管线/16 章 scope:team 接入兑现（待收②⑦）"
  - "SPD 档位：base 101（管线实值）+ 行迹 flat +9（trace_stat_effects 勘正①）；E2 结界 SPD +12% 走 enable_if 门控光环 spd_pct（不并入 base_stats）"
