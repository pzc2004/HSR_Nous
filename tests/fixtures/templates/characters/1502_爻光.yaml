eidolons:
  E1:
    name: "Chuckle Chimes Where Jade Falls"   # CN：何处落玉，盈盈笑语（character_ranks.json 核）
    notes:
      - "① 终结技触发的阿哈额外回合固定计入笑点 20→40——待收②（aha_instant effect 固定 20 字面，无 param/表达式槽，引擎缺口）；② 造成欢愉伤害时全体队友无视目标 20% 防御——待收②（攻击方条件穿透键缺，不造键）"
  E2:
    name: "Blind Arrows Guided by Feathers"   # CN：飞箭无目，青翎为瞳
    hooks:
      # 结界持续期间我方全体 SPD +12%·欢愉度 +16%（勘正⑭+B40 ⓹）：常驻件 + enable_if
      # 门控结界在场（秘技开战/施技双路径同真；速度调度重同步靠 HP 事件推式，面板懒求值
      # 不受影响在案；条件件——结界共享/1502101 的无条件件面板读不到本件贡献，防环在案）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_ZONE_AURA"
              name: "飞箭无目，青翎为瞳"
              modifier_type: "buff"
              duration: 0
              effect_scope: "team"
              dispellable: False
              enable_if: "has_modifier($self, 'ELATION_ZONE') >= 1"
              stat_effects: {"spd_pct": 0.12, "elation": 0.16}   # 官方：速度 12% + 欢愉度额外 16%
  E3:
    name: "Auspices Mirrored In Decalight"    # CN：十方世界，光映符中
    skill_level_overrides: {"skill": 2, "basic": 1, "elation_skill": 1}   # 官方：战技+2/普攻+1/欢愉技+1（勘正⑧；B40 ⓵ slo 键正身）
    notes:
      - "战技+2 随档段：结界共享 param(150202,2)（lv12=22%，B40 ⓹ 经 zone stat_exprs 兑现）；欢愉技+1 随档段：150220 AoE/随机段 lv11"
  E4:
    name: "Threads of Fate Colored by Plumes" # CN：命若素绡，拈羽点彩
    hooks:
      # 爻光终结技触发的阿哈额外回合中，我方全体欢愉技伤害为原伤害 150%（B40 ⓺ 收编——
      # final_dmg_boost 池，pipeline 注「爻光 E4 欢愉技 150% 落点」在案）：额外时刻开始挂、
      # 结束摘（$event.extra==1 门=「爻光终结技触发的」——本模板 aha_instant 唯一来源；
      # 平坦池无行动域——窗内大吉大利同吃 ×1.5，官方只欢愉技，口径偏差在案）
      - event: "aha_instant_start"
        condition: "$event.extra >= 1"
        effects:
          - effect_type: "apply_modifier"
            target: "all_allies"
            modifier:
              modifier_id: "E4_FINAL_DMG"
              name: "命若素绡，拈羽点彩"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"dmg_final_dmg_boost": 0.5}   # 原伤害 150% → final_dmg_boost 池 +0.5
      - event: "aha_instant_end"
        condition: "$event.extra >= 1"
        effects:
          - effect_type: "remove_modifier"
            target: "all_allies"
            modifier_id: "E4_FINAL_DMG"
  E5:
    name: "Bejeweled in Radiant Grace"        # CN：璎珞严饰，身如琉璃
    skill_level_overrides: {"ultimate": 2, "talent": 2, "elation_skill": 1} # 官方：终结技+2/天赋+2/欢愉技+1（勘正⑧；B40 ⓵ slo 键正身）
    notes:
      - "终结技+2 随档段：全队抗穿 param(150203,2)（lv12=22%）；天赋+2 随档段：大吉大利倍率 param(150204,1)（lv12=22%）"
  E6:
    name: "Ferried Along the Astral Arc"      # CN：牵丝渡引，天星垂虹
    hooks:
      # ① 我方全体欢愉伤害增笑 25%（B40 ⓺ 收编——merrymake 独立乘区键在案；常驻 team
      # 光环件，官方「我方全体目标」含自身）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_MERRYMAKE"
              name: "牵丝渡引，天星垂虹·增笑"
              modifier_type: "buff"
              duration: 0
