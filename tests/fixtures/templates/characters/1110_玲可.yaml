    toughness_dmg: 0        # 恢复技无削韧（fandom 无削韧值）
    skill_point_cost: 1     # tbgd 权威：BPNeed sp_cost 1（米游社 sub_tag 缺标为漏标；社区两源佐证）
    energy_gain: 30         # tbgd/米游社一致：施放回能 30

  - action_id: "111003"
    name: "雪原急救方案"
    action_type: "ultimate"
    target_type: "self"     # 释放判定挂自身；实际效果=我方全体（净化+治疗走 on_ultimate hook，pool: allies 全体）
    energy_cost: 100        # 官方 max_sp 100
    energy_gain: 5          # tbgd/米游社一致：施放回能 5
    skill_point_cost: 0     # 不耗不产战技点（tbgd）
    toughness_dmg: 0        # 恢复技无削韧

# 星魂（build.yaml member.eidolon: N 激活 E1..EN）
eidolons:
  E1:
    name: "远行雪杖的清晨"
    hooks:
      # 治疗 HP%≤50%（含 50%）的我方时治疗加成 +20%（HoT 同样生效——过堂收编：
      # hit_condition 治疗命中域 scoped 件正主（$event.target_hp_ratio + heal_bonus，
      # 娜塔莎 1105 天赋先例），draft 误判"outgoing heal 键未证+条件通道缺"）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_HEAL_BOOST"
              name: "远行雪杖的清晨"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              hit_condition: "$event.target_hp_ratio <= 0.5"
              stat_effects: {"heal_bonus": 0.2}
    notes:
      - "HoT 逐跳同走 heal 公式故逐跳独立判定（与官方'持续治疗同样生效'同向——1105 同族）"
  E2:
    name: "便携炉具的正午"
    notes:
      - "持「求生反应」的目标可抵抗 debuff 施加 1 次——待收：before_apply_modifier 拦截通道缺（编译闸无施加前拦截词表）；次数刷新规则（求生反应续期是否恢复）待实测"
  E3:
    name: "午后雪崩信标"
    skill_level_overrides: {"skill": 2, "basic": 1}   # 战技 +2（≤lv15）、普攻 +1（≤lv10）
    notes:
      - "战技 +2 随档段：求生反应 Max HP（stat_exprs 用 param(111002, 1/2)）与立即治疗（param(111002, 4/5)）、持续 #3 均随档；普攻 scaling 实取 lv10 档（表尾=第 10 行）"
  E4:
    name: "露营篝火的薄暮"
    hooks:
      # 获得「求生反应」时，目标攻击力提高 = 玲可 Max HP × 3.0%，持续 1 回合（官方 + 社区一致）。
      # 与战技链同事件并挂（声明序在主链后——同次结算内获得求生反应即触发）
      - event: "on_action"
        condition: "$event.actor == '1110' && $event.action_id == '111002'"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "E4_CAMPFIRE_ATK"
              name: "露营篝火的薄暮"
              modifier_type: "buff"
              duration: 1
              dispellable: True
              stat_effects: {"atk": "$self.max_hp * 0.03"}   # 3.0% 玲可 Max HP（stat_exprs
              # →stat_effects 过堂勘正——exprs 以持有者为语境（$self=目标错基）；
              # hook 物化=施加时刻玲可快照烘焙，快照口径在案）
    notes:
      - "结算基准=施放时玲可 Max HP 快照（stat_effects 烘焙——动态取值通道下 $self 语境为持有者非玲可，过堂勘正）"
  E5:
    name: "极光茶之夜"
    skill_level_overrides: {"ultimate": 2, "talent": 2}   # 终结技 +2、天赋 +2（≤lv15）
    notes:
      - "终结技 +2 随档段：治疗（param(111003, 2/3)）；解控个数 #1 恒 1 不随档；天赋 +2 随档段：HoT 与求生反应加成段（param(111004, 2..5)）"
  E6:
    name: "测绘图纸的黎明"
    hooks:
      # 「求生反应」Max HP 提升额外 + 玲可 Max HP × 6.0%（官方 + 社区一致；5000 血玲可
      # 约 675~800 额外生命，定性吻合）——与战技件同 duration 对齐（param(111002, 3)）。
      # 效果抵抗 +30% 半 待收（stat_effects 键名未证，挡因见头注）
      - event: "on_action"
        condition: "$event.actor == '1110' && $event.action_id == '111002'"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "E6_SURVIVAL_RESPONSE_HP"
              name: "测绘图纸的黎明"
              modifier_type: "buff"
              duration: 2      # param(111002, 3) = 2（与求生反应同轨到期）
              dispellable: True
              stat_effects: {"hp": "$self.max_hp * 0.06"}   # 6.0% 玲可 Max HP（同 E4 双勘正：
              # hp_max 死键→hp flat；exprs 错基→effects 玲可快照）
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "E6_SURVIVAL_RESPONSE_RES"
              name: "测绘图纸的黎明·抵抗"
              modifier_type: "buff"
              duration: 2
              dispellable: True
              stat_effects: {"effect_res": 0.3}   # 效果抵抗 +30%（过堂收编——effect_res
              # 键在库（_KNOWN_STAT_KEYS 登记，杰帕德 E4 先例），draft 误判"键名未证"）
    notes:
      - "E6 两段全收（Max HP 段过堂双勘正、抵抗段 effect_res 收编）；效果抵抗为抗性非免疫（官方文本）"

hooks:
  # 111002 战技：对单体我方施「求生反应」——① Max HP 提升 = #1%×玲可 Max HP + #2 平坦；
  # ④ 立即回复 = #4%×玲可 Max HP + #5 平坦；③ 持续 #3=2 回合。
  # ② 毁灭/存护命途受击概率大幅提高（嘲讽）——待收（aggr 通道缺，挡因见头注）。
  # 目标载荷：on_action 的 target 字段（战技单体选中者）通道未证——按 $event.target 写，待实测
  - event: "on_action"
    condition: "$event.actor == '1110' && $event.action_id == '111002'"
    effects:
      - effect_type: "heal"
        target: "$event.target"
        ratio: "param(111002, 4)"     # 比例口径 = 玲可 Max HP（heal 施放者通道）
        amount: "param(111002, 5)"     # lv10 = 0.12 / 320
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "SURVIVAL_RESPONSE"
          name: "求生反应"
          modifier_type: "buff"
          duration: 2                  # param(111002, 3) = 2（全档恒 2）
          dispellable: True
          stat_effects: {"hp": "$self.max_hp * param(111002, 1) + param(111002, 2)"}
          # 过堂双勘正：① 键名 hp_max 无消费端=死键（effective_stats 无此键——
          # Max HP 提升完全不生效，玲可核心战技死件）；正解 hp flat 槽（l1 平铺）。
          # ② stat_exprs→stat_effects（exprs 以**持有者**为语境求值——$self=目标
          # 而非玲可，取数错基；stat_effects hook 物化=施加时刻以玲可快照烘焙，
          # 快照/动态口径待实测随注）。lv10 = 玲可 Max HP×7.5% + 200

  # 行迹 1110101「提前勘测」：持「求生反应」目标受击后玲可回能 2（过堂收编——
  # gain_energy 原语在库，draft 误判"能量回复 effect 通道缺"）；
  # 受击定义域含 DoT 与否社区/官方冲突——after_being_hit 仅攻击命中族发射（DoT
  # 不经此通道——三月七 1001 反击族同口径），按命中域承载待实测复核
  - event: "after_being_hit"
    condition: "has_modifier($event.target, 'SURVIVAL_RESPONSE') >= 1"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 2

  # 天赋 HoT 授予（战技半）：为「求生反应」目标再挂持续治疗（duration 3 = #1 2 + 行迹 3 +1）
  - event: "on_action"
    condition: "$event.actor == '1110' && $event.action_id == '111002'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "OUTDOOR_SURVIVAL_HOT"
          name: "户外生存经验"
          modifier_type: "buff"
          duration: 3                  # param(111004, 1)=2 + 行迹 3「极境求生」+1（烘焙常量）
          dispellable: True

  # 111003 终结技：我方全体 ① 各解除 1 个负面（#1，LIFO 截断——多 debuff 解除优先级待实测）；
  # ② 各自回复 #2%×玲可 Max HP + #3 平坦；③ 按天赋为全体挂持续治疗
  - event: "on_ultimate"
    condition: "$event.source == '1110' && $event.action == '111003'"
    effects:
      - effect_type: "remove_modifier"
        target: "all_allies"
        filter: "$mod.kind == 'debuff'"
        max_count: 1                   # param(111003, 1) = 1（全档恒 1）
      - effect_type: "heal"
        target: "all_allies"
        ratio: "param(111003, 2)"      # 比例口径 = 玲可 Max HP；lv10 = 0.135 / 360
        amount: "param(111003, 3)"
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "OUTDOOR_SURVIVAL_HOT"
          name: "户外生存经验"
          modifier_type: "buff"
          duration: 3                  # param(111004, 1)=2 + 行迹 3 +1
          dispellable: True

  # 天赋 HoT 结算：持有者回合开始时回复 = #2%×玲可 Max HP + #3 平坦。
  # 事件主体 = 持有 HoT 的目标（$event.actor——on_turn_start 载荷纪律，禁写 $event.target）；
  # "目标自身回合开始 / 任意角色回合开始"官方未细化，按自身回合读法写，待实测复核
  - event: "on_turn_start"
    condition: "has_modifier($event.actor, 'OUTDOOR_SURVIVAL_HOT') >= 1"
    effects:
      - effect_type: "heal"
        target: "$event.actor"
        ratio: "param(111004, 2)"      # 比例口径 = 玲可 Max HP（施放者通道）；lv10 = 0.036 / 96
        amount: "param(111004, 3)"

  # 天赋 HoT 额外段：目标同时持有「求生反应」时再回 = #4%×玲可 Max HP + #5 平坦（lv10 = 0.045 / 120）
  - event: "on_turn_start"
    condition: "has_modifier($event.actor, 'OUTDOOR_SURVIVAL_HOT') >= 1 && has_modifier($event.actor, 'SURVIVAL_RESPONSE') >= 1"
    effects:
      - effect_type: "heal"
        target: "$event.actor"
        ratio: "param(111004, 4)"
        amount: "param(111004, 5)"

scaling_notes:
  - "111006「攻击」通用节点：params=[] 无倍率表——非独立技能（战斗外/秘技路径打击入口），不进 actions 主表倍率、亦不列 skill_params（无表可照抄）；是否为秘技近战打击、耗秘技点数、入场削韧值与能量获取 待实测（tbgd sp/energy 全 0），语义确认后再收"
  - "战技 #6=5 参数：官方 desc 未引用——疑似嘲讽权重/内部系数，语义未公开，待实测（不脑补接入）"
  - "战技嘲讽域：EN 'the chance of them being attacked by enemies will greatly increase' 限定毁灭/存护命途（enable_if path ∈ {destruction, preservation}），量化值无官方数据——待收（aggr 通道缺）"
  - "终结技「插队」语义：社区表述无官方文本背书，待实测（终结技通用满能量释放通道已由 energy_cost 承载）"
  - "秘技 111007「巧克力能量棒」：秘技版 HoT 数值吃天赋档（param(111004, 2..5)）——on_turn_start 结算同通道，无需另挂结算件；是否叠加/刷新、是否吃星魂 1 加成 待实测"
  - "交互语义五项（角色级）：站位=常规 4 人编队成员位（官方+社区）；能量条=有 max_sp 100（普攻 20/战技 30/终结技 5/行迹 1 受击 2——行迹 1 待收）；控制模型=回合制玩家操控，AI 战技目标选择规则待实测；耗产点=普攻 +1、战技 −1（tbgd 权威）、终结技/天赋 0、秘技耗 1 秘技点；目标选择=普攻单体指定敌人、战技单体我方（含自身与否待实测）、终结技/秘技全体我方"
