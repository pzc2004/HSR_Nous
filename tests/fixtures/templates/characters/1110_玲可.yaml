    name: "冰攀前齿技术"
    action_type: "basic"
    target_type: "single"
    damage_type: "quantum"
    scaling: [{"hp": 0.25}, {"hp": 0.3}, {"hp": 0.35}, {"hp": 0.4}, {"hp": 0.45},
              {"hp": 0.5}, {"hp": 0.55}, {"hp": 0.6}, {"hp": 0.65}, {"hp": 0.7}]
    # 生命倍率普攻（官方 desc "Quantum DMG equal to #1[i]% of Lynx's Max HP"——不吃攻击力，
    # hp 系；lv10 = 第 10 行 0.7）
