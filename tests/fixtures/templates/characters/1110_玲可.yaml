# 角色模板：玲可（1110）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂收编/勘正六件：① 战技 target_type "single"→"ally_single"（敌方池
#   挂错会打敌人——1101/1105 同案）。
#   ② 求生反应 Max HP 段双勘正——hp_max 键无消费端=死键（effective_stats
#   无此键，玲可核心战技 Max HP 提升完全不生效）；正解 hp flat 槽。且
#   stat_exprs→stat_effects（exprs 以持有者为语境求值——$self=目标而非
#   玲可取数错基；hook 物化 stat_effects=施加时刻玲可快照烘焙，快照口径
#   在案）。E4 ATK 段/E6 HP 段同双勘正。
#   ③ 行迹 1 提前勘测收编——gain_energy 原语在库（draft 误判"能量回复
#   effect 通道缺"）：持求生反应目标受击玲可回能 2。
#   ④ E1 治疗加成 +20% 收编——hit_condition 治疗命中域 scoped 件正主
#   （$event.target_hp_ratio≤0.5 + heal_bonus，娜塔莎 1105 先例；draft
#   误判"outgoing heal 键未证"）。
#   ⑤ E6 效果抵抗 +30% 收编——effect_res 键在库（杰帕德 E4 先例，draft
#   误判"键名未证"）。
#
# 收录：普攻生命倍率（lv6=0.5×Max HP）/ 战技盐渍野营罐头（指定我方治疗
#       12% 玲可 Max+320 + Max HP +7.5%玲可 Max+200 二回合 + HoT 3 回合
#       + 嘲讽待收）/ 终结技（全体解 1 负面 LIFO + 治疗 13.5%玲可 Max+360
#       + 全体 HoT 3 回合）/ 天赋户外生存经验（HoT 3.6%玲可 Max+96，
#       求生反应持有者额外 4.5%玲可 Max+120）/ 行迹 1（受击回能 2）/
#       行迹 3（HoT +1 已并入）/ 秘技全体 HoT / E1 / E3/E5 等级族 /
#       E4 求生反应 ATK 段 / E6 求生反应 HP+抵抗段
# 待收（均带挡因）：战技嘲讽（aggro 量化值未公开——通道在案但数值语义
#       未证）/ 行迹 2 控制抵抗（effect_res 全类不压缩）/ E2 debuff 抵抗
#       1 次（before_apply_modifier 拦截事件缺）/ 行迹面板节点（社区数据
#       未取证，非键问题）/ 秘技版 HoT 与行迹 3 关系（官方未写）
actor_id: "1110"
name: "玲可"
level: 80
path: "abundance"
element: "quantum"
# groups: 待收——阵营归属未从官方数据证实（贝洛伯格/朗道家族为社区推断，不脑补，不写空值）
# 收录：普攻生命倍率单体（sp +1/回能 20/削韧 10）/ 战技「求生反应」（Max HP 提升 stat_exprs +
#       立即治疗，2 回合，耗 1 点回 30——tbgd 权威裁决）/ 终结技全体解 1 负面 + 治疗
#       （remove_modifier filter/max_count 结构块，耗能 100 回 5）/ 天赋 HoT（EN "Skill or Ultimate"
#       明示双类触发；on_turn_start $event.actor 通道；求生反应持有者额外段 enable 同挂）/
#       秘技进战全体 HoT / 行迹 3「极境求生」HoT +1 回合（烘焙进 duration 常量 3）/
#       星魂 E3/E5 等级族、E4 求生反应 ATK 段、E6 求生反应 Max HP 段（E6 仅收 hp_max 半）
# 待收：战技嘲讽（编译闸无 aggro/受击概率通道——"greatly increase" 无量化值，#6=5 语义未公开）/
#       行迹 1「提前勘测」受击回能 2（编译闸能量回复 effect 词表缺——gain_resource 仅 custom_resources；
#       受击定义域含 DoT 与否社区/官方冲突，待实测）/ 行迹 2 控制抵抗 +35%（CC 拦截率键未证，
#       effect_res≠控制拦截率，不混用）/ E1 治疗加成 +20%（outgoing heal 键未证——incoming_heal
#       有先例、出疗方向键词表未见）/ E2 debuff 抵抗 1 次（before_apply_modifier 拦截通道缺）/
#       E6 效果抵抗 +30%（stat_effects 键名未证）/ 通用节点 111006「攻击」（params=[] 无倍率表，
#       不列入 skill_params——非倍率技能，入场削韧/秘技点语义待实测）/ 秘技版 HoT 是否受行迹 3 延长
#       +1（官方文本未说明，按 2 回合保守写）
# 数值：官方 params 全表照抄（scaling/skill_params 唯一照抄源）；hook/modifier 侧系数走
#       skill_params 表 + param() 编译期引用（05_effects §5.1）
base_stats:
  hp: 1058.4        # 官方 calc lv80 实值（社区 1058 截断写法，以此终审）
  atk: 493.92       # 官方实值（社区 493 为截断写法）
  def: 551.25       # 官方实值（社区 551）
  spd: 100
  crit_rate: 0.05
  crit_dmg: 0.5
  max_energy: 100   # 终结技耗能 100（官方/社区双向印证；普攻 20 / 战技 30 / 终结技释放 5 / 行迹 1 受击 2）

trace_notes:
  - "行迹 3「极境求生」（1110103）：天赋持续治疗 +1 回合——已收，烘焙为 duration 常量 3（2+1；行迹无等级轨道）"
  - "行迹 1「提前勘测」（1110101）过堂收编：持「求生反应」目标受击后玲可回能 2（gain_energy 原语在库——draft 误判『能量回复 effect 通道缺』；after_being_hit 仅攻击命中族发射=DoT 不触发同口径，待实测复核）"
  - "行迹 2「探险技术」（1110102）：控制类负面抵抗 +35%——待收（CC 拦截率键未证）"
  - "行迹面板百分比节点（社区：生命 34% / 防御 22.5% / 效果抵抗 10%）——待收（trace_stat_effects 百分比节点键名未证，不并入 base_stats）"
  - "免死/免疫盘点：玲可本体+星魂全文无任何免死、无敌、伤害转移机制——明确结论，勿挂免疫钩子（官方文本全量核对）"

trace_stat_effects: {}

