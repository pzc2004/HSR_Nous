# 角色模板：虎克（1109）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂收编两件：① 天赋额外回能 #2=5 收编——gain_energy 原语在库（draft
#   误判"无能量通道"；全档恒 5）。
#   ② 大行迹 Playing With Fire 回能 #1=5 收编——同原语（draft 误判；
#   与终结技自身回能 5 分槽）。
#   待收判定维持（已过堂复核）：E1 强化战技增伤（类型桶不分辨同类型双技
#   ——hit_condition 伤害域无 action_id 键）/ E6 对 Burn 增伤（伤害命中域
#   无目标修饰谓词）/ A2 控抗（effect_res 全类不压缩）/ E4 相邻 Burn
#   （邻接代数缺）。
#
# 收录：普攻 / 战技嘿！记得虎克吗（2.4 lv10 + Burn 100% 施加 2 回合）/
#       强化战技 110909（终结技授予强化态一次性消费——available_if 互斥
#       + Blast 主 2.8 邻 0.8 lv10 + Burn 主邻同挂口径在案）/
#       终结技轰！飞来焰火（单体 4.0 lv10 + 强化态授予 + A3 行动提前 20%
#       + 回能 5+5 分槽）/ Burn DoT（on_turn_start 跳 param(110902,4)
#       lv10=0.65×ATK）/ 天赋火上浇油（命中 Burn 目标追加 1.0×ATK lv10
#       + 回能 5 + _talent_lock 防递归闩——快照见旧值=挂 Burn 的当发不触发，
#       后续命中触发）/ 大行迹 Innocence（天赋触发自疗 5% Max）/
#       秘技随机单体 0.5×ATK + 全体 Burn 3 回合 / E2 Burn 时长 +1 /
#       E3/E5 等级族
# 待收（均带挡因）：E1/E6/A2/E4（见上复核）/ 战技与强化战技削韧值
#       （数据缺不脑补）/ DoT 跳伤触发天赋附加段（官方"attacking"是否含
#       DoT 待实测——载荷无 name 键与攻击段不可区分，1108 同案）/
#       强化战技相邻段挂 Burn（官方仅主目标——payload 无 blast 分段标记）
actor_id: "1109"
name: "虎克"
level: 80
path: "destruction"   # 命途（Warrior=毁灭；count_team 编成计数口径）
element: "fire"       # 元素（element_of 取数源——官方数据照抄）
# 收录：普攻/战技/强化战技/终结技 action 全表 + Burn 施加（战技族，E2 时长延伸双 hook）+
#       Burn DoT 结算（on_turn_start，随档 param(110902,4)——两技 DoT 档列同值）+
#       秘技入场（随机单体伤 + 全体 Burn 3 回合单档字面值）+
#       天赋「哈！火上浇油」附加火伤（on_hp_decrease reason=hit + Burn 命中判 + _talent_lock 防递归闩）+
#       换技能硬闸（终结技授予强化态 → 110902↔110909 available_if 互斥，_enhanced_skill 闩）+
#       大行迹「Innocence」天赋触发自疗 5% / 大行迹「Playing With Fire」终结技后行动提前 20% +
#       星魂 E2（Burn 时长 +1）/ E3、E5 等级族
# 待收：A2 控抗 +35%（控抗统计槽无登记键）/ E1 强化战技增伤 20%（类型桶不分辨
#       同类型双技——hit_condition 伤害域无 action_id 键；all_dmg/dmg_skill_dmg_boost
#       均过宽，不可降级承载）/ E4 相邻 Burn（相邻（blast 邻域）无登记 where 谓词）/
#       E6 对 Burn 目标增伤 20%（伤害命中域无目标修饰谓词——scoped $event 仅
#       action_type/damage_type/target_broken/target_controlled）/
#       战技/强化战技削韧值（米游社 sub_tag 缺失）
#       【天赋回能 #2=5 / A3 回能 #1=5 已过堂收编——gain_energy 原语在库】
# 数值：照 query-game-data params 表；action 倍率全表照抄，hook 侧系数走 skill_params + param()
base_stats:
  hp: 1340.6399999999999
  atk: 617.4000000000001
  def: 352.79999999999995
  spd: 94
  crit_rate: 0.05
  crit_dmg: 0.5
  max_energy: 120     # 常规能量槽（米游社 sub_tag 能量 120，对轴表 110903 一致）
trace_stat_effects:     # 行迹白值节点（B-TR① 回填——character_skill_trees.json 1109201-210 逐项加总）
  atk_pct: 0.28         # 攻击强化 ×5（0.04+0.04+0.06+0.06+0.08——1109201/03/05/07/10）
  crit_dmg: 0.133       # 暴击伤害 ×2（0.053+0.08——1109204/08）
  hp_pct: 0.18          # 生命强化 ×3（0.04+0.06+0.08——1109202/06/09）

trace_notes:
  - "大行迹 1109101「Innocence」已收（hooks：天赋触发时自疗 5% Max HP，官方 params_max 0.05；触发面=命中 Burn 目标的任意攻击）"
  - "大行迹 1109102「Naivete」待收：抵抗控制类负面 +35%（params_max 0.35）——控抗统计槽无登记键（stat_effects 词表无 effect_res/ctrl_res 族），挡因：键闸；语义为抗性堆叠非免控（官方文本）"
  - "大行迹 1109103「Playing With Fire」已收全：终结技后行动提前 20%（#2=0.2，advance_action 通道）+ 额外回能 5（#1=5——gain_energy 原语在库过堂收编，draft 误判『无能量通道』；与终结技自身回能 5 分槽）。注意参数序 #1=能量、#2=提前"

