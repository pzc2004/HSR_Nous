custom_resources:
  _s2_burn:
    max: 1    # 星魂 S2 闩（仅 S2 存在时置 1）：本体普攻/战技施加的灼烧倍率 +40%（加算于 Burn 乘区）
  _s6_fk:
    max: 1    # 星魂 S6 闩：看官叠加上限 3→4（+1）。max_stack 通道仅收整型（表达式被闸拒）——
              # 本模板按基础 3 写入；S6 +1 的层数覆写待星魂档 modifier 覆写通道/实测（挡因在案）

# 秘技 121007「耍耍把式卖卖艺」：立即攻击敌人；进战后对**随机单体**造成火伤 = atk × 0.5，
# 共 4 次（params [[0.5,4,1]] 单档固定值，无等级轨道），每次 100% 基础概率附加【看官】。
# 随机单体 ×4 = 目标代数 mode random；deal_damage 与 apply_modifier 同写同一代数——
# random 按 B22 确定化口径（expected 按序取首）同上下文解析同一目标（在案）。
# 削韧 20（米游社 tag；单次/总计口径待实测）；秘技点 1（通用规则，官方未载明数额，待实测）
techniques:
  - technique_id: "121007"
    name: "耍耍把式卖卖艺"
    point_cost: 1
    effects:                                # 进战一次性（战前装填预置，18.3；施放者=桂乃芬）
      - effect_type: "deal_damage"
        name: "耍耍把式卖卖艺·第1击"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "fire"
        amount: "0.5 * $self.atk"
      - effect_type: "apply_modifier"
        target: {pool: "enemies", take: 1, mode: "random"}
        modifier:
          modifier_id: "FIREKISS"
          name: "看官"
          modifier_type: "debuff"
          stacks: 1
          max_stack: 3
          stack_mode: "refresh"
          duration: 3
          dispellable: True
          stat_exprs:
            vulnerability: "param(121004, 4) * stacks($self, 'FIREKISS')"  # vulnerability 正解（dmg_taken 死键——1108/1507 先例）+ stat_exprs 动态读层数
            #（pipeline stat 贡献不乘 stacks；refresh 不更新烘焙，1207 案）
      - effect_type: "deal_damage"
        name: "耍耍把式卖卖艺·第2击"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "fire"
        amount: "0.5 * $self.atk"
      - effect_type: "apply_modifier"
        target: {pool: "enemies", take: 1, mode: "random"}
        modifier:
          modifier_id: "FIREKISS"
          name: "看官"
          modifier_type: "debuff"
          stacks: 1
          max_stack: 3
          stack_mode: "refresh"
          duration: 3
          dispellable: True
          stat_exprs:
            vulnerability: "param(121004, 4) * stacks($self, 'FIREKISS')"  # vulnerability 正解（dmg_taken 死键——1108/1507 先例）+ stat_exprs 动态读层数
            #（pipeline stat 贡献不乘 stacks；refresh 不更新烘焙，1207 案）
      - effect_type: "deal_damage"
        name: "耍耍把式卖卖艺·第3击"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "fire"
        amount: "0.5 * $self.atk"
      - effect_type: "apply_modifier"
        target: {pool: "enemies", take: 1, mode: "random"}
        modifier:
          modifier_id: "FIREKISS"
          name: "看官"
          modifier_type: "debuff"
          stacks: 1
          max_stack: 3
          stack_mode: "refresh"
          duration: 3
          dispellable: True
          stat_exprs:
            vulnerability: "param(121004, 4) * stacks($self, 'FIREKISS')"  # vulnerability 正解（dmg_taken 死键——1108/1507 先例）+ stat_exprs 动态读层数
            #（pipeline stat 贡献不乘 stacks；refresh 不更新烘焙，1207 案）
      - effect_type: "deal_damage"
        name: "耍耍把式卖卖艺·第4击"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "fire"
        amount: "0.5 * $self.atk"
      - effect_type: "apply_modifier"
        target: {pool: "enemies", take: 1, mode: "random"}
        modifier:
          modifier_id: "FIREKISS"
          name: "看官"
          modifier_type: "debuff"
          stacks: 1
          max_stack: 3
          stack_mode: "refresh"
          duration: 3
          dispellable: True
          stat_exprs:
            vulnerability: "param(121004, 4) * stacks($self, 'FIREKISS')"  # vulnerability 正解（dmg_taken 死键——1108/1507 先例）+ stat_exprs 动态读层数
            #（pipeline stat 贡献不乘 stacks；refresh 不更新烘焙，1207 案）

