# 角色模板：桂乃芬（1210）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂勘正四件（staging+fixture 同步）：
#   ① FIREKISS 死键+层数建模（6 处）——draft stat_effects {"dmg_taken": ...}
#     无消费端死键（scaling_notes 自承「键名待闸确认」）；正解 vulnerability
#     承伤区（1108/1507 先例）+ **stat_exprs 动态 stacks() 读层数**（官方
#     「每层+X%」层数驱动：pipeline stat 贡献不乘 stacks、refresh 不更新
#     stat_effects 烘焙（1207 案）——stat_exprs 是唯一通道；1/2/3 层 =
#     0.07/0.14/0.21 lv10 实证）
#   ② E4 回能 gain_resource "energy"→gain_energy 内建通道（custom_resources
#     无 "energy"——1004/1103 实证口径，1207 Majestas 先例）
#   ③ Walking on Knives 真伤 damage_type "true"→"fire"（1209 秘技同案——
#     类别注释义留源元素；防递归由「真伤跳伤 damage_type 字段恒 'true'」
#     设计内保证，无需闩）
#   ④ High Poles 概率通道误判勘正——draft「概率门控通道缺按必挂直书」；
#     正解 condition + mechanic_chance(0.8)（桑博 1108 同先例：基础概率按
#     固定概率近似承载，expected 恒挂/roll 真掷 80%；apply_chance 命中公式
#     通道缺仍在案）
#
# 收录：普攻劈头满堂彩 / 战技迎面开门红（主 1.2 邻 0.4 lv10 + 主目标灼烧
#       100%）/ 灼烧 DoT（2.1821×atk lv10 #4 敌方回合开始 tick——$self.atk
#       实时口径快照待实测）/ 天赋看官 FIREKISS（灼烧跳挂 1 层，每层受击
#       增伤 7% lv10，cap 3，stat_exprs 动态）/ 终结技给您来段看家戏（全体
#       1.2 lv10 + 灼烧中目标爆燃 0.92×原灼烧 lv10 #2，不清除灼烧）/
#       大行迹 High Poles（普攻 80% 挂战技等价灼烧）/ Bladed Hoop（进场
#       拉条 25%）/ Walking on Knives（对灼烧中目标伤害 +20%——真伤压缩
#       口径 1407 E1 同先例，tick/直击/爆燃全载体）/ 秘技 4 击 ×0.5 随机
#       单体（B22 确定化）+FIREKISS 各 1 层 / E1 战技主目标抵抗 −10% /
#       S2 本体灼烧 ×1.4 / E3/E5 等级族 / E4 灼烧跳回 2 能 /
#       S6 层数 +1（max_stack 整型闸——按基础 3 写入挡因在案）
# 待收（均带挡因）：**相邻目标灼烧**（目标代数无相邻谓词——通道缺）/
#       基础概率×效果命中公式（apply_chance 键缺——mechanic_chance 近似）/
#       S6 层数覆写通道 / 灼烧快照/实时口径 / WoK 与 FIREKISS 乘区归属 /
#       外源灼烧触发域 / E1 相邻受益 / 秘技削韧口径 / 行迹属性节点（未下发）
actor_id: "1210"
name: "桂乃芬"
level: 80
path: "nihility"   # 命途：虚无（官方内部类目 Warlock ↔ nihility canonical；count_team 编成计数口径）
groups: []          # 无官方在案派系名册可推断（非黄金裔/非官方系列诗族），不造键——待收：官方派系文本到案后补
element: "fire"     # 元素（element_of 取数源——官方数据照抄）
energy_name: "能量"  # 常规能量槽（无特殊充能名——官方"能量 120"标签交叉印证）
base_stats:
  hp: 882
  atk: 582.1199999999999
  def: 441
  spd: 106
  crit_rate: 0.05
  crit_dmg: 0.5
  max_energy: 120     # 米游社"能量 120"标签 + tbgd 交叉；终结技释放门槛
  # 无 dmg_bonus 节点：行迹三项全为机制件（挂灼烧/拉条/条件增伤），无元素增伤/暴击/速度
  # 平铺百分比节点 ⇒ spd/crit_rate/crit_dmg 不并入行迹加成，维持管线实值
trace_notes:
  - 大行迹 1210101「High Poles」已收：普攻 80% 基础概率附加与战技等价的灼烧（Burn 倍率取
    param(121002,4) 随**战技等级**走，持续 param(121002,5)=2 回合）——EN "equivalent to that
    of her Skill"。**概率门控通道缺**（apply_modifier 无 chance 键）→ 当前按必挂直书、
    会高估 Firekiss 触发频率，待通道补齐/实测校准（未采信项在案）
  - 大行迹 1210102「Bladed Hoop」已收：战斗开始时自身行动提前 25%（EN "action advances by
    25%"=拉条非再动）。进场结算序列时点待实测
  - 大行迹 1210103「Walking on Knives」已收（结界压缩口径）：对灼烧中敌方目标造成的伤害
    +20%——受击事件追加真伤段 0.2×原伤害（category "true" 跳乘区=与"原伤害 120%"严格等值，
    遐蝶 1407 E1 同先例）。乘区归属（与 Firekiss 易伤加算/独立）待实测
  - fandom 该角色条目全空：削韧以米游社 tag 为当前权威、回能/战技点以 tbgd 为权威（无 fandom
    交叉源可校，各条目已注明）
trace_stat_effects: {}

