# 星魂（ranks）——build.yaml member.eidon: N 激活 E1..EN（数值/机制照抄 ranks_detail desc）
eidolons:
  E1:
    name: "Slurping Noodles"
    hooks:
      # 战技攻击的目标 100% 基础概率效果抵抗 −10%，持续 2 回合——EN "the attacked target"
      # 限主目标（不含相邻；相邻是否受益待实测）。$event.target 目标传递通道待实测
      #（on_action 事件载荷 target 字段未见先例，在案）
      - event: "on_action"
        condition: "$event.actor == '1210' && $event.action_id == '121002' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "E1_EFFECT_RES_DOWN"
              name: "Slurping Noodles"
              modifier_type: "debuff"
              duration: 2
              dispellable: True
              stat_effects: {"effect_res": -0.1}   # 效果抵抗下降键名待编译闸词表确认（在案）
  E2:
    name: "Brushing Teeth"
    hooks:
      # 本体普攻/战技所施加的灼烧倍率 +40%（EN "applied by her Basic ATK or Skill" 限本体两技；
      # 外源灼烧不写入本模板 modifier 故天然出集）。实现：战斗开始置 _s2_burn=1，Burn tick
      # 金额表达式读 (1 + 0.4*res__s2_burn)。含大行迹 High Poles 普攻灼烧（EN "equivalent to
      # that of Skill" 指向应参与——待实测确认，证据笔记 §9.9）
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_s2_burn"
            amount: 1
  E3:
    name: "Smashing Boulder"
    skill_level_overrides: {"skill": 2, "basic": 1}   # 战技+2（lv15 封顶）、普攻+1
    notes:
      - "战技+2 随档段：scaling/scaling_blast（实取 lv12 档）+ Burn 倍率 param(121002,4)、爆燃比例 param(121003,2) 侧互指随档"
      - "普攻+1：官方数据普攻仅 10 档（121001 params 10 行），无第 11 档可取——不脑补数值，越档钳表尾 + ⚠ 编译警告口径；lv11 外推值待实测（证据笔记 §9.1）"
  E4:
    name: "Blocking Pike"
    hooks:
      # 本体灼烧每次造成伤害，桂乃芬回复 2 能量（每跳一回，上限受灼烧跳数限制）——
      # 与 Burn tick 同触发点（on_turn_start）。gain_resource 通道承载常规能量（resource_id
      # "energy" 通道名待编译闸确认，在案）
      - event: "on_turn_start"
        condition: "actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'GUINAIFEN_BURN') >= 1"
        effects:
          # 能量走内建 gain_energy 通道（custom_resources 无 "energy"——1004/1103 实证，
          # 1207 Majestas 先例；draft gain_resource "energy" 错通道已勘正）
          - effect_type: "gain_energy"
            target: "self"
            amount: 2
  E5:
    name: "Swallowing Sword"
    skill_level_overrides: {"ultimate": 2, "talent": 2}   # 终结技+2、天赋+2（均 lv15 封顶）
    notes:
      - "终结技+2 随档段：scaling（实取 lv12 档）+ 爆燃比例 param(121003,2)（hook 侧互指随档）；天赋+2 随档段：看官增伤 param(121004,4)、持续 param(121004,5)"
  E6:
    name: "Catching Bullet"
    hooks:
      # 看官可叠加上限 +1（3→4 层）——max_stack 通道仅收整型（表达式被闸拒），本模板按基础 3
      # 写入；S6 +1 的层数覆写待星魂档 modifier 覆写通道/实测（挡因在案）
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_s6_fk"
            amount: 1

hooks:
  # 1210102 Bladed Hoop（大行迹）：战斗开始时自身行动提前 25%（EN "action advances by 25%"=拉条
  # 非再动）。与全队进场结算的先后时点待实测（证据笔记 §9.7）
  - event: "on_battle_start"
    effects:
      - effect_type: "advance_action"
        target: "self"
        amount: 25

  # 1210101 High Poles（大行迹）：普攻 80% 基础概率附加与战技等价的灼烧（倍率取战技 #4，
  # 随战技等级；持续 #5=2 回合）。概率门控通道缺（apply_modifier 无 chance 键）→ 按必挂直书，
  # 高估 Firekiss 触发频率，待实测/通道补齐（trace_notes 在案）
  - event: "on_action"
    condition: "$event.actor == '1210' && $event.action_id == '121001' && !$event.insert && mechanic_chance(0.8)"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "GUINAIFEN_BURN"
          name: "灼烧"
          modifier_type: "debuff"
          stack_mode: "refresh"
          duration: 2    # 持续 2 回合（官方 #5=2，全档恒定）
          dispellable: True

  # 121002 战技：100% 基础概率对主目标施加灼烧（#3=1 全档）；Burn DoT = atk × param(121002,4)，
  # 敌方回合开始时结算（#5=2 回合）。
  # 待收：**相邻目标灼烧**——目标代数无相邻谓词（where 无 distance/adjacent 通道），
  # 挡因=通道缺；主目标半已收（相邻半待通道补齐，证据笔记 §9.10 站位假设同源）
  - event: "on_action"
    condition: "$event.actor == '1210' && $event.action_id == '121002' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "GUINAIFEN_BURN"
          name: "灼烧"
          modifier_type: "debuff"
          stack_mode: "refresh"
          duration: 2
          dispellable: True

  # 灼烧 DoT tick（敌方回合开始）+ 天赋 121004 Firekiss：
  # EN "after their Burn status causes DMG"——灼烧造成伤害即触发（未限定来源；外源灼烧是否
  # 触发待实测，证据笔记 §9.4）。Firekiss：100% 基础概率（#1=1）受击增伤 param(121004,4)、
  # 持续 param(121004,5)=3、上限 param(121004,6)=3（S6 +1 层数覆写待通道/实测）。
  # 基础概率按必挂直书（效果命中/敌方效果抵抗门控通道缺，在案）。
  # 金额基数：$self.atk 实时读取——官方未明示 DoT 快照/实时口径，待实测
  - event: "on_turn_start"
    condition: "actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'GUINAIFEN_BURN') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "灼烧"
        target: "$event.actor"
        damage_type: "fire"
        amount: "param(121002, 4) * (1 + 0.4 * res__s2_burn) * $self.atk"
      - effect_type: "apply_modifier"
        target: "$event.actor"
        modifier:
          modifier_id: "FIREKISS"
          name: "看官"
          modifier_type: "debuff"
          stacks: 1
          max_stack: 3
          stack_mode: "refresh"
          duration: 3
          dispellable: True
          stat_exprs:
            vulnerability: "param(121004, 4) * stacks($self, 'FIREKISS')"  # vulnerability 正解（dmg_taken 死键——1108/1507 先例）+ stat_exprs 动态读层数
            #（pipeline stat 贡献不乘 stacks；refresh 不更新烘焙，1207 案）

  # 121003 终结技：若目标处于灼烧状态，其灼烧立即产生一次伤害 = 原灼烧伤害 × param(121003,2)
  #（原灼烧伤害 = param(121002,4) × atk × S2 乘区——爆燃复用 Burn 乘区读法；不清除灼烧）。
  # 爆燃即"灼烧造成伤害"⇒ 同步挂 Firekiss（是否触发天赋待实测，证据笔记 §9.4 同源）
  - event: "on_ultimate"
    condition: "$event.source == '1210' && $event.action == '121003'"
    effects:
      - effect_type: "deal_damage"
        name: "给您来段看家戏·灼烧爆燃"
        target: {pool: "enemies", where: "has_modifier($it, 'GUINAIFEN_BURN') >= 1"}
        damage_type: "fire"
        amount: "param(121003, 2) * param(121002, 4) * (1 + 0.4 * res__s2_burn) * $self.atk"
      - effect_type: "apply_modifier"
        target: {pool: "enemies", where: "has_modifier($it, 'GUINAIFEN_BURN') >= 1"}
        modifier:
          modifier_id: "FIREKISS"
          name: "看官"
          modifier_type: "debuff"
          stacks: 1
          max_stack: 3
          stack_mode: "refresh"
          duration: 3
          dispellable: True
          stat_exprs:
            vulnerability: "param(121004, 4) * stacks($self, 'FIREKISS')"  # vulnerability 正解（dmg_taken 死键——1108/1507 先例）+ stat_exprs 动态读层数
            #（pipeline stat 贡献不乘 stacks；refresh 不更新烘焙，1207 案）

  # 1210103 Walking on Knives（大行迹）：对灼烧中敌方目标造成的伤害 +20%——结界压缩口径
  #（追加真伤段 0.2×原伤害、category "true" 跳乘区=与"原伤害 120%"严格等值，遐蝶 1407 E1
  # 同先例）。condition 不滤 reason（直击 'hit' 与灼烧 tick 皆本体火伤——官方未限定）；
  # 乘区归属（与 Firekiss 易伤加算/独立）待实测（证据笔记 §9.5）
  - event: "on_hp_decrease"
    condition: "$event.source == '1210' && $event.damage_type == 'fire' && has_modifier($event.target, 'GUINAIFEN_BURN') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "Walking on Knives"
        target: "$event.target"
        damage_type: "fire"
        category: "true"
        amount: "0.2 * $event.amount"

scaling_notes:
  - 交互语义五项（角色级）：①站位——无官方站位/换位机制，常规 4 人队单槽（队友站位仅影响
    战技"相邻"命中面，敌方侧轴规则待实测）；②能量条——有（max_energy=120）：普攻 +20 /
    战技 +30 / 终结技释放后 +5 / E4 每次灼烧跳 +2；③控制模型——回合制玩家操控（自动战斗
    施放优先级待实测）；④耗产点——普攻 +1、战技 −1（tbgd 裁决）、终结技 0、天赋被动 0、
