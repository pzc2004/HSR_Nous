  - fandom 条目全空（该角色无 fandom 数据）：削韧以米游社 tag 为当前权威、回能/战技点以
    tbgd 为权威，无 fandom 交叉源可校（各 action 注释已逐条注明）
  - 121006「攻击」params 为空表——占位技无机制数值，不收录（scaling/skill_params 双缺）
