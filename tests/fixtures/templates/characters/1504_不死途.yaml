# 星魂（build.yaml member.eidolon: N 激活；E1-E6 名=character_ranks.json 官方 CN——勘正①）
eidolons:
  E1:
    name: "小心，满月不可外出"
    hooks:
      # 不死途在场时敌方全体受到伤害 +24%；敌当前 HP% ≤ 50% 时提高至 36%（阈值切换非叠加）
      # ——易伤区加算正解（勘正⑭）：enable_if 门控 vulnerability 双件（持有者=敌方自读 HP%）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E1_VULN_BASE"
              name: "小心，满月不可外出"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              enable_if: "$self.hp > 0.5 * $self.max_hp"
              stat_effects: {"vulnerability": 0.24}
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E1_VULN_HIGH"
              name: "小心，满月不可外出·半血"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              enable_if: "$self.hp <= 0.5 * $self.max_hp"
              stat_effects: {"vulnerability": 0.36}
      # 后进波次补挂（ actor_enter 发射点；已挂跳过）
      - event: "actor_enter"
        condition: "$event.actor_type == 'monster' && has_modifier($event.actor, 'E1_VULN_BASE') < 1"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "$event.actor"}
            modifier:
              modifier_id: "E1_VULN_BASE"
              name: "小心，满月不可外出"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              enable_if: "$self.hp > 0.5 * $self.max_hp"
              stat_effects: {"vulnerability": 0.24}
          - effect_type: "apply_modifier"
            target: {pool: "$event.actor"}
            modifier:
              modifier_id: "E1_VULN_HIGH"
              name: "小心，满月不可外出·半血"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              enable_if: "$self.hp <= 0.5 * $self.max_hp"
              stat_effects: {"vulnerability": 0.36}
    notes:
      - "「不死途在场时」死亡失效缺通道——待收⑤"
  E2:
    name: "敲门，屋内空余窃笑"
    hooks:
      # 婪酣上限 12→18：max_override 收编（勘正⑫，16 §16.12）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_GLD_CAP"
              name: "敲门，屋内空余窃笑·上限"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              target_resource: "gluttony"
              max_override: 18
      # 发动强化天赋追加攻击后返还所移除婪酣的 35%（快照补偿勘正⑫——链内 +4 后判定；
      # 单段建模移除恒 4：round(4×0.35)=1，取整规则待实测；连杀多段待收①）
      - event: "on_ultimate"
        condition: "$event.source == '1504' && $event.action == '150403' && res_gluttony + 4 >= param(150403, 3)"
        effects:
          - effect_type: "gain_resource"
            resource_id: "gluttony"
            amount: "round(param(150403, 3) * 0.35)"
  E3:
    name: "沉默，老友各怀心事"
    skill_level_overrides: {"ultimate": 2, "basic": 1}   # 终结技+2、普攻+1
    notes:
      - "终结技+2：主倍率/追加段倍率随档（scaling + param(150403,4)）；普攻+1 实取 lv7 档"
  E4:
    name: "切记，不必咀嚼真相"
    hooks:
      # 施放终结技时 ATK +40%，持续 3 回合（atk_pct 勘正④；on_ultimate 在伤害结算后发射——
      # 当次终结技/强化 FUA 不吃本 buff，官方挂载点先后待实测）
      - event: "on_ultimate"
        condition: "$event.source == '1504' && $event.action == '150403'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_ATK_BOOST"
              name: "切记，不必咀嚼真相"
              modifier_type: "buff"
              duration: 3
              dispellable: True
              stat_effects: {"atk_pct": 0.4}
  E5:
    name: "提醒，侦探亦是凶手"
    skill_level_overrides: {"skill": 2, "talent": 2}     # 战技+2、天赋+2
    notes:
      - "战技+2：scaling 实取 lv12 档 + 减防/追加段随档（param(150402,4/3)）；天赋+2：FUA 倍率随档（param(150404,4)）"
  E6:
    name: "结局，或许无人生还"
    hooks:
      # 场上存在饲饵时敌方全体全抗 −20% → 自身 team 光环 res_pen 0.2（mechanics 02：RES_PEN
      # 含抗性降低同口径；饲饵开战即在场≈常驻，摘除失效时机待实测③联动）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_BAIT_RESPEN"
              name: "结局，或许无人生还·全抗"
              modifier_type: "buff"
              duration: 0
              effect_scope: "team"
              dispellable: False
              stat_effects: {"res_pen": 0.2}
          # 每获得过 1 层婪酣伤害 +4%（至多 30 层）——stat_exprs 现场追层（勘正⑬）
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_GLD_BOOST"
              name: "结局，或许无人生还·增伤"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_exprs:
                all_dmg: "0.04 * min(stacks($self, 'E6_GLD_STACKS'), 30)"
      # 计数器：按获得量记账（apply +1 → adjust 补 $event.amount-1——stacks 只收 int 字面量，
      # delta 吃表达式，勘正⑬）；消耗不记（amount>0 过滤）
      - event: "on_resource_gain"
        condition: "$event.actor == '1504' && $event.resource_id == 'gluttony' && $event.amount > 0"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_GLD_STACKS"
              name: "结局，或许无人生还·计数"
              modifier_type: "buff"
              stacks: 1
              max_stack: 30
              stack_mode: "refresh"
              duration: 0
              dispellable: False
          - effect_type: "adjust_stacks"
            modifier_id: "E6_GLD_STACKS"
            delta: "$event.amount - 1"
    notes:
      - "累计计数器是否永久累计、死亡/换波清零——待实测（B19 候选）"

hooks:
  # 开战初始化：头狼光环（全体我方暴伤 +40%）；影肢 FUA 增伤
  # （stat_exprs 现场追婪酣层——勘正⑥）；无饲饵时自动标生命值最低敌人为饲饵
  # （官方"场上不存在【饲饵】时立即标记"——开战初始化收；转波缺口待收④）+ 饲饵
  # 存在性减防（勘正⑮）；初始充能 2 点走 decl.current 布场（装填序见资源块注）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "FIRST_FANG_CDMG"
          name: "头狼"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"crit_dmg": 0.4}
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "PHANTOM_LIMB_FUA"
          name: "影肢"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            dmg_follow_up_dmg_boost: "0.8 + 0.1 * res_gluttony"
      - effect_type: "apply_modifier"
        target: {pool: "enemies", order_by: "$it.hp", take: 1, mode: "deterministic"}
        modifier:
          modifier_id: "BAIT"
          name: "饲饵"
          modifier_type: "debuff"
          duration: 0
          dispellable: False
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "BAIT_DEFR"
          name: "饲饵在场·减防"
          modifier_type: "debuff"
          duration: 0
          dispellable: True      # 可驱散性待实测（官方未明——保守 True 在案）
          stat_effects: {"def_pct": "-param(150402, 4)"}

  # 饲饵携带者死亡 → 立即转标当前生命值最低敌人（官方"场上不存在【饲饵】时立即"）+
  # 减防重挂（refresh 语义等值）
  - event: "actor_exit"
    condition: "$event.reason == 'death' && has_modifier($event.actor, 'BAIT') >= 1"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "enemies", order_by: "$it.hp", take: 1, mode: "deterministic"}
        modifier:
          modifier_id: "BAIT"
          name: "饲饵"
          modifier_type: "debuff"
          duration: 0
          dispellable: False
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "BAIT_DEFR"
          name: "饲饵在场·减防"
          modifier_type: "debuff"
          duration: 0
          dispellable: True
          stat_effects: {"def_pct": "-param(150402, 4)"}

  # 150402 战技：目标成为饲饵（先清敌方旧饲饵再标当前目标——单实例、最新施加生效）
  # + 减防重挂（存在性光环，随转移保持）
  - event: "on_action"
    condition: "$event.actor == '1504' && $event.action_id == '150402' && !$event.insert"
    effects:
      - effect_type: "remove_modifier"
        target: "all_enemies"
        modifier_id: "BAIT"
      - effect_type: "apply_modifier"
        target: {pool: "$event.target"}
        modifier:
          modifier_id: "BAIT"
          name: "饲饵"
          modifier_type: "debuff"
          duration: 0
          dispellable: False
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "BAIT_DEFR"
          name: "饲饵在场·减防"
          modifier_type: "debuff"
          duration: 0
          dispellable: True
          stat_effects: {"def_pct": "-param(150402, 4)"}

  # 150402 目标已是饲饵：额外 #3×ATK 雷伤 + 恢复 #5 点战技点（gain_skill_point 收编——
  # 勘正⑯）。快照语义：has_modifier 读施放前饲饵态=官方"若该目标为【饲饵】"（同事件
  # 多钩 condition 统一快照，转标钩尚未落地）；追加段 action_type=skill（勘正⑯）
  - event: "on_action"
    condition: "$event.actor == '1504' && $event.action_id == '150402' && !$event.insert && has_modifier($event.target, 'BAIT') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "鞭哨，逐尽恶兽·额外"
        target: {pool: "$event.target"}
        damage_type: "thunder"
        action_type: "skill"
        amount: "param(150402, 3) * $self.atk"
        toughness_dmg: 10      # 追加段削韧无数据源（tbgd/米游社只载整技 20）——保守 10 待实测
      - effect_type: "gain_skill_point"
        amount: "param(150402, 5)"

  # 罪途①：施放战技 +1 层婪酣
  - event: "on_action"
    condition: "$event.actor == '1504' && $event.action_id == '150402' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "gluttony"
        amount: 1

  # 150403 终结技主链：转标饲饵 + 减防重挂 + 获得 #2 点充能（clamp 上限 3=官方"最多拥有"）
  # + 立即强化天赋 FUA（不耗充能——事件分流构造隔离，勘正⑨）+ 天赋后续 +2 层婪酣
  - event: "on_ultimate"
    condition: "$event.source == '1504' && $event.action == '150403'"
    effects:
      - effect_type: "remove_modifier"
        target: "all_enemies"
        modifier_id: "BAIT"
      - effect_type: "apply_modifier"
        target: {pool: "$event.target"}
        modifier:
          modifier_id: "BAIT"
          name: "饲饵"
          modifier_type: "debuff"
          duration: 0
          dispellable: False
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "BAIT_DEFR"
          name: "饲饵在场·减防"
          modifier_type: "debuff"
          duration: 0
          dispellable: True
          stat_effects: {"def_pct": "-param(150402, 4)"}
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: "param(150403, 2)"     # lv10 = 3
      - effect_type: "deal_damage"
        name: "宿怨，切齿奉还·强化"
        target: {pool: "enemies", where: "has_modifier($it, 'BAIT') >= 1", take: 1}
        damage_type: "thunder"
        amount: "param(150404, 4) * $self.atk"
        toughness_dmg: 5
      - effect_type: "gain_resource"
        resource_id: "gluttony"
        amount: "param(150404, 5)"     # 天赋 FUA 后续 +2 层（强化 FUA 继承性待实测——勘正⑩）

  # 罪途②：施放终结技 +2 层婪酣（官方双份之另一份——勘正⑩）
  - event: "on_ultimate"
    condition: "$event.source == '1504' && $event.action == '150403'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "gluttony"
        amount: 2

  # 婪酣追加段：≥ #3（lv10=4）→ 耗 4 层追加 1 段 #4×ATK（快照补偿 +4=链内双份获得，
  # 勘正⑪；官方"直至婪酣 <4"连杀循环待收①）
  - event: "on_ultimate"
    condition: "$event.source == '1504' && $event.action == '150403' && res_gluttony + 4 >= param(150403, 3)"
    effects:
      - effect_type: "gain_resource"
        resource_id: "gluttony"
        amount: "-param(150403, 3)"
      - effect_type: "deal_damage"
        name: "飨宴，自始无终·婪酣追加"
        target: {pool: "enemies", where: "has_modifier($it, 'BAIT') >= 1", take: 1}
        damage_type: "thunder"
        amount: "param(150403, 4) * $self.atk"
        toughness_dmg: 5               # 追加段削韧按强化 FUA 同档——待实测

  # 150404 天赋反追加：饲饵被我方其他目标攻击（hit）→ 固定回能 #7=8 + 耗 #3=1 充能
  # + FUA（#4×ATK）+ 米游社天赋回能 5 + #5=2 层婪酣。
  # 我方域=actor_type_of(source) != 'monster'；本体排除=source != '1504'（官方"我方其他
  # 目标"——强化/天赋 FUA 自伤与战技额外段自然出集，构造防递归，勘正⑧⑨）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && actor_type_of($event.target) == 'monster' && has_modifier($event.target, 'BAIT') >= 1 && actor_type_of($event.source) != 'monster' && $event.source != '1504' && res_charge >= param(150404, 3)"
    effects:
      - effect_type: "gain_energy"
        amount: "param(150404, 7)"     # 固定 +8（天赋文本）
      - effect_type: "gain_resource"
        resource_id: "charge"
        amount: "-param(150404, 3)"    # 消耗 1 点
      - effect_type: "deal_damage"
        name: "宿怨，切齿奉还"
        target: {pool: "enemies", where: "has_modifier($it, 'BAIT') >= 1", take: 1}
        damage_type: "thunder"
        amount: "param(150404, 4) * $self.atk"
        toughness_dmg: 5
      - effect_type: "gain_energy"
        amount: 5                      # tbgd/米游社天赋 FUA 回能 5（与固定 +8 分笔）
      - effect_type: "gain_resource"
        resource_id: "gluttony"
        amount: "param(150404, 5)"     # +2 层（上限 12；E2 → 18）

  # 罪途③：追加攻击过程中每击杀 1 名敌人 +1 层婪酣——hook FUA 致死 action_id 继承
  # 触发载荷=空串（引擎实证：on_ultimate/on_hp_decrease 载荷无 action_id 键），
  # action 伤害致死带本行动 id 自然出集（勘正⑦；击杀归属口径待实测）
  - event: "on_kill"
    condition: "$event.source == '1504' && $event.action_id == ''"
    effects:
      - effect_type: "gain_resource"
        resource_id: "gluttony"
        amount: 1

scaling_notes:
  - "FUA 全部走 hook deal_damage（trigger_action 通道未实证，在案）：默认伪行动类别 follow_up 正吃影肢分域桶（勘正⑥）；战技额外段标 skill 防误吃（勘正⑯）"
  - "削韧/回能/SP = tbgd 权威 + 米游社五项同值互证（fandom 对轴表全空——复核在案）；追加段削韧无分项数据保守取值待实测"
  - "150404 scaling=params 第 4 列（FUA 倍率——勘正③）；天赋 FUA 实伤由 hooks param(150404,4) 承载，两通道同档同源"
  - "快照语义两件在案：战技额外段读施放前饲饵态（正确语义=快照族①同构）；婪酣段判定补偿 +4（勘正⑪）"
