# 角色模板：不死途 Ashveil（1504）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging 1504_不死途.yaml）+ 过堂勘正（staging→fixtures 合并
# 流水线）。数值地基：StarRailRes 官方数据（skills/params/星魂/行迹全对轴）+ tbgd
# （削韧/回能/SP 权威）+ 米游社五项（同值互证）；fandom 对轴表全空在案。
#
# 过堂勘正十七件（draft 病 → 正解）：
#   ① 星魂幻名（族谱②）：E1-E6 名系 EN 转译（"Beware: Venture Not at Full Moon"
#     等）→ 官方 CN（character_ranks.json）：小心，满月不可外出/敲门，屋内空余窃笑/
#     沉默，老友各怀心事/切记，不必咀嚼真相/提醒，侦探亦是凶手/结局，或许无人生还；
#     行迹名同病：Damnation Trail/Phantom Limb/First Fang → 罪途/影肢/头狼；机制名
#     暴食→婪酣、诱饵→饲饵（官方术语）
#   ② 行迹数值节点"未见官方下发"误判：character_skill_trees levels[].properties
#     在案——暴伤 +0.373/雷伤 +0.144/攻击 +10% → trace_stat_effects 收编
#   ③ 天赋 action 150404 scaling 列错位（族谱⑤）：照抄 params 第 1 列（初始充能，
#     恒 2）→ FUA 倍率=第 4 列 [1.0..2.5]；补 level_key: talent（三月七先例——缺省
#     follow_up 回落 ultimate 档，E3 ult+2 会误抬）
#   ④ E4 攻击 +40% 键错：stat_effects {"atk": 0.4}=+0.4 白值 → atk_pct: 0.4
#   ⑤ 饲饵减防键错（族谱⑦ 同族）：{"def_": "-param"}=-0.4 白值 → def_pct 负值
#     （敌方减防正解，1507 千冶•刃先例）
#   ⑥ 影肢 stat_effects 烘焙死件（族谱⑩）："0.8+0.1*res_gluttony" 开战挂点时
#     婪酣=0 → 恒 0.8 死烘 → stat_exprs 现场通道；且全域 all_dmg 改分域键
#     dmg_follow_up_dmg_boost（类型桶在案——draft"分域键缺"挡因过期）
#   ⑦ 罪途击杀钩死键（族谱⑧）：$event.source == '150404' 永不命中（on_kill
#     source=攻击方 actor_id）→ $event.source == '1504' && $event.action_id == ''
#     （hook 伤害致死 action_id 继承触发载荷=空串，引擎实证；归属口径待实测）
#   ⑧ 天赋钩 source 过滤死键：$event.source != '150404' 同⑦病 → 删；官方"我方
#     其他目标"= source != '1504' + actor_type_of(source) != 'monster'
#   ⑨ _enh_fua 闩死件：只写不读（隔离由事件分流+source 过滤构造性达成）→ 全拆
#   ⑩ 罪途终结技 +2 婪酣缺份：链内仅天赋 +2——官方施放终结技 +2（罪途②）与
#     强化 FUA 后续 +2（天赋 #5）双份 → 双钩各载；强化 FUA 固定回能 +8 摘除
#     （#7 系天赋触发件"【饲饵】受击后"，非 FUA 后续——终结技链不继承，待实测）
#   ⑪ 婪酣追加段快照补偿（族谱⑨）：同事件多钩 condition 读事件开始旧值——
#     res_gluttony >= 4 在链内 +4 之前判定 → res_gluttony + 4 >= param(150403,3)
#   ⑫ E2 双件：返还钩无条件（0 移除也 +1）→ 同⑪补偿条件；上限 12→18"通道缺"
#     挡因过期 → max_override 收编（16 §16.12，昔涟 1141517 先例）
#   ⑬ E6 计数器粒度 bug：apply stacks:1 每事件 +1（+2 婪酣只记 1）→ apply +
#     adjust_stacks delta "$event.amount - 1"（族谱⑪——stacks 只收 int，delta 吃
#     表达式）；增伤件 stat_exprs 现场追层（族谱⑩）；补 $event.amount > 0 过滤
#     （消耗不记——官方"每获得过"）
#   ⑭ E1 乘区错：before_take_damage modify_amount ×1.24/×1.36 = 独立乘算区——
#     官方"受到的伤害提高"= 易伤区加算 → enable_if 门控 vulnerability 双件
#     （HP% 阈值切换非叠加）；actor_enter 补挂（后进波次）
#   ⑮ 饲饵减防缺载：减防系"场上存在【饲饵】时"存在性光环，开战自动标记即生效
#     ——draft 仅施放时挂 → 开战挂 + actor_exit 转标重挂
#   ⑯ 战技追加段伪行动类别：缺省 follow_up 会误吃影肢 FUA 桶——官方"额外造成"
#     系战技组成非追加攻击 → action_type: "skill"（类型归属待实测）；SP 返还
#     "通道缺"挡因过期 → gain_skill_point 收编（花火先例）
#   ⑰ 初始充能 set_resource 装填序被盖：秘技钩编译序在模板钩前——on_battle_start
#     set 2 会盖掉秘技 +1 → decl.current: 2 布场（获得制，序无关）
#
# 收录：饲饵标记/转移/死亡转标+存在性减防（def_pct -40% lv10）/ 天赋反追加
#   （我方其他目标攻击饲饵 → 回 8+5 能、耗 1 充能、FUA、+2 婪酣）/ 终结技主链
#   （转标+3 充能+强化 FUA+双份婪酣 +4）/ 婪酣段（≥4 耗 4 追加一段）/ 罪途三件
#   （战技 +1/终结技 +2/FUA 击杀 +1）/ 影肢 FUA 增伤（0.8+0.1×婪酣 现场）/ 头狼
#   暴伤光环 +40% / 行迹白值（暴伤 0.373/雷伤 0.144/攻 10%）/ 秘技（全体 100%
#   +1 充能）/ E1 易伤双档 / E2 上限 18+返还 / E3/E5 等级族 / E4 攻击 +40% /
#   E6 抗穿光环+婪酣计数增伤
#
# 待收（均带挡因）：
#   ① 强化 FUA 连杀循环：官方"消耗 4 层额外 1 段，直至婪酣 <4"+"致命攻击续打新
#     饲饵"——hook 无循环原语（floor 未接线），现单段建模，多段/续杀差在案
#   ② 头狼② 我方追加攻击暴伤再 +80%：类型分域暴伤键缺（hit_condition scoped
#     不载 crit_dmg）——不写
#   ③ 饲饵死亡转标 vs 天赋 FUA 序（先转标再 FUA 与否）、触发粒度（hit vs
#     action）、"其他目标"域（忆灵/召唤物细分）、追加段回能 +8/+5 归属、E2
#     返还取整（round 4×0.35=1 暂取）、减防可驱散性、秘技削韧（米游社/fandom
#     全空取 0）——全待实测
#   ④ 换波补标：转波全灭后新波无饲饵——"场上无饲饵持有者"敌方侧判定函数缺
#     （who_has 只查我方），actor_enter 无条件补标会错标，挡住在案
#   ⑤ E1"不死途在场时"死亡失效：modifier 无"施加者在场"门控通道（enable_if
#     只读持有者面板），死后易伤残留差在案
#   ⑥ 秘技伤害结算早于模板 on_battle_start 光环挂载（装填预置编译序在前）——
#     头狼暴伤/E1 易伤对秘技跳伤不生效，与官方"进战时全机制在场"有别（引擎
#     装填序缺口，非模板可修）
#   ⑦ 战技追加段类型归属（战技 vs 附加）待实测——现按战技组成建模
