      - [0.7]
      - [0.8]
      - [0.9]
      - [1.0]
      - [1.1]
      - [1.2]
      - [1.3]
      - [1.4]
  "1100402":
    level_key: skill     # 虚空断界（Skill，15 档）——[伤害倍率, 减速基础概率, 减速幅度, 持续回合]
    rows:
      - [0.36, 0.65, 0.1, 2]
      - [0.396, 0.66, 0.1, 2]
      - [0.432, 0.67, 0.1, 2]
      - [0.468, 0.68, 0.1, 2]
      - [0.504, 0.69, 0.1, 2]
      - [0.54, 0.7, 0.1, 2]
      - [0.585, 0.7125, 0.1, 2]
