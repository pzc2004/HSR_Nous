      - [0.6, 0.4, 0.05]
      - [0.65, 0.4, 0.05]
      - [0.7, 0.4, 0.05]
      - [0.75, 0.4, 0.05]
      - [0.8125, 0.4, 0.05]
      - [0.875, 0.4, 0.05]
      - [0.9375, 0.4, 0.05]
      - [1.0, 0.4, 0.05]
      - [1.05, 0.4, 0.05]
      - [1.1, 0.4, 0.05]
      - [1.15, 0.4, 0.05]
