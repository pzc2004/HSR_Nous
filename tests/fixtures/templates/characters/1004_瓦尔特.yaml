  dmg_imaginary: 0.144  # 伤害强化•虚数 ×2（0.064+0.08——11004202/09）
  effect_hit: 0.28      # 效果命中 ×5（0.04+0.04+0.06+0.06+0.08——11004201/03/05/07/10）
