custom_resources:
  _welt_slow_p:
    max: "inf"           # 减速基础概率宿主资源（mechanic_chance 读数——on_battle_start 置档）
  _wl_n:
    max: 8               # 失重每目标每回合触发计数（#6=8 上限；_前缀内部闩，已声明+on_turn_start 重置）
  _e1_n:
    max: 2               # E1 强化计数（大招后 2 次普攻/战技追加段；已声明+on_battle_start 置零）

techniques:
  - technique_id: "1100407"
    name: "画地为牢"
    point_cost: 1
    effects:             # 进战一次性（战前装填预置，18.3；施放者=瓦尔特）
      # #1=100% 基础概率禁锢 1 回合（禁锢=行动延后 20%（#2，通道缺——见头注待收）+ 减速 10%（#3））
      - effect_type: "apply_modifier"
        target: {pool: "enemies"}
        modifier:
          modifier_id: "WELT_DOMAIN_IMPRISON"
          name: "画地为牢·禁锢"
          modifier_type: "debuff"
          duration: 1
          dispellable: True     # 可净化性待实测（保守 True）
          stat_effects: {"spd_pct": -0.1}
    # #4=15 秒大世界领域、#5=领域内敌人移速 -50%：大世界通道缺（待收）；"我方仅 1 个领域"
    # 互斥覆盖顺序待实测

actions:
  - action_id: "1100401"
    name: "重力压制"
    action_type: "basic"
    target_type: "single"
    damage_type: "imaginary"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    # lv10(index 9)=1.40；EN "one designated enemy" 单体玩家指定
    toughness_dmg: 10        # 米游社 10（fandom 空——待 fandom 复核）
    skill_point_gain: 1      # tbgd 权威：+1 产出、0 消耗
    energy_gain: 20          # tbgd=米游社=20（fandom 空）

  - action_id: "1100402"
    name: "虚空断界"
    action_type: "skill"
    target_type: "single"    # 指定 1 名主目标；另外 4 段随机段走 hooks（弹射段不走 action scaling）
    damage_type: "imaginary"
    scaling: [{"atk": 0.36}, {"atk": 0.396}, {"atk": 0.432}, {"atk": 0.468}, {"atk": 0.504},
              {"atk": 0.54}, {"atk": 0.585}, {"atk": 0.63}, {"atk": 0.675}, {"atk": 0.72},
              {"atk": 0.756}, {"atk": 0.792}, {"atk": 0.828}, {"atk": 0.864}, {"atk": 0.9}]
    # lv10(index 9)=0.72；减速基础概率/幅度/持续走 skill_params #2/#3/#4（#4 全档恒 2 回合）
    toughness_dmg: 10        # 米游社 10×段（逐段各削；fandom 空待复核）
    skill_point_cost: 1      # tbgd BPNeed 权威：消耗 1、产出 0
    energy_gain: 6           # tbgd=6（米游社 30 冲突、fandom 空——待实测，暂记 tbgd）

  - action_id: "1100403"
    name: "拟似黑洞"
    action_type: "ultimate"
    target_type: "aoe"
    damage_type: "imaginary"
    energy_cost: 120         # max_sp=120 满能量释放
    energy_gain: 5           # tbgd=米游社=5（技能固有；行迹 +5/+30 另槽）
    toughness_dmg: 20        # 米游社 20（fandom 空待复核）
    scaling: [{"atk": 0.9}, {"atk": 0.96}, {"atk": 1.02}, {"atk": 1.08}, {"atk": 1.14},
              {"atk": 1.2}, {"atk": 1.275}, {"atk": 1.35}, {"atk": 1.425}, {"atk": 1.5},
              {"atk": 1.56}, {"atk": 1.62}, {"atk": 1.68}, {"atk": 1.74}, {"atk": 1.8}]
    # lv10(index 9)=1.50；禁锢延后 #2=0.12（待收，见头注）、概率 #3=1.00、减速 #4=0.10、
    # 失重 #5=0.04 / #6=8 / #7=2 回合
    apply_modifiers:
      # 禁锢（Imprisoned）1 回合：#3=100% 基础概率（恒 1.00，无概率门）+ 禁锢减速 10%（#4）
      # 行动延后 12%（#2）通道缺（待收）；duration int 直给=1（全档恒 1 回合）
      - target: "all_enemies"
        modifier_id: "WELT_IMPRISON"
        name: "禁锢"
        modifier_type: "debuff"
        duration: 1
        dispellable: True     # 待实测
        stat_effects: {"spd_pct": "-param(1100403, 4)"}
      # 失重（Weightless）：#7=2 回合；被击延后 4%（#5）与 ≤8 次/回合（#6）走下方 hooks；
      # 失重减速 5% 来自天赋 1100404 #3（并入本件——常驻光环同目标同一状态）；
      # 失重减防 40%（1100404 #2）过堂收编——def_pct 负值通道已登记（1507 BALEFIRE_BIND
      # 先例），draft 误判"减防 stat 键名未登记"
      - target: "all_enemies"
        modifier_id: "WELT_WEIGHTLESS"
        name: "失重"
        modifier_type: "debuff"
        duration: 2
        dispellable: True     # 待实测
        stat_effects: {"spd_pct": "-param(1100404, 3)", "def_pct": "-param(1100404, 2)"}

hooks:
  # 战斗开始：减速概率宿主资源置档（lv10 #2=0.75；E4 hook 会覆写为 +0.35 版——覆盖序待实测）
  # + _e1_n 计数闩置零（内部闩读前必写——1501 教训）
  - event: "on_battle_start"
    effects:
      - effect_type: "set_resource"
        resource_id: "_welt_slow_p"
        amount: "param(1100402, 2)"
      - effect_type: "set_resource"
        resource_id: "_e1_n"
        amount: 0

  # 虚空断界弹射段：加强版额外 4 段随机单体（EN "additionally deals DMG 4 times"）——
  # 目标代数 mode random（B22 确定化按序取首）；随机段能否回弹主目标待实测
  - event: "on_action"
    condition: "$event.actor == '1004' && $event.action_id == '1100402' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "虚空断界"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(1100402, 1) * $self.atk"
        toughness_dmg: 10
      - effect_type: "deal_damage"
        name: "虚空断界"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(1100402, 1) * $self.atk"
        toughness_dmg: 10
      - effect_type: "deal_damage"
        name: "虚空断界"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(1100402, 1) * $self.atk"
        toughness_dmg: 10
      - effect_type: "deal_damage"
        name: "虚空断界"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "imaginary"
        amount: "param(1100402, 1) * $self.atk"
        toughness_dmg: 10

  # 虚空断界减速（逐 hit 独立掷）：EN "On hit, there is a #2 base chance to reduce SPD"——
  # 触发域=瓦尔特任一虚数攻击命中（含主段/弹射段/11004102 追加段；真伤段天然出集）。
  # 概率门控：condition + mechanic_chance(res_<资源 id> 平铺命名空间——999908 先例；
  # 直传资源 id 字符串会 float() 炸、条件失败按不触发吞 ⚠，e2e 实证钉死；effect 层无 chance 键）
  - event: "on_hp_decrease"
    condition: "$event.source == '1004' && $event.reason == 'hit' && $event.damage_type == 'imaginary' && mechanic_chance(res__welt_slow_p)"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "WELT_SLOW"
          name: "减速"
          modifier_type: "debuff"
          duration: 2              # int 直给（#4 全档恒 2 回合——param() 不用于 duration）
          dispellable: True        # 待实测（覆盖/刷新规则待实测）
          stat_effects: {"spd_pct": "-param(1100402, 3)"}

  # 时空扭曲（Talent 1100404）：瓦尔特攻击已减速敌人时追加虚数真伤 = #1% ATK（lv10=1.00）。
  # 防递归闩：$event.damage_type != 'true'（追加段自身吃 hp_decrease 事件——昔涟 141502 /
  # 1004 撞 128 重入硬帽教训）。
  # 同 hit 序（e2e 实证）：§23 快照分发——同事件条件见旧值，首挂减速的那一 hit 不触发
  # 天赋，后续 hit 才触发（与官方 "already Slowed" 口径构造上一致，非同 hit 先生后判）。
  - event: "on_hp_decrease"
    condition: "$event.source == '1004' && $event.reason == 'hit' && $event.damage_type != 'true' && has_modifier($event.target, 'WELT_SLOW') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "时空扭曲"
        target: "$event.target"
        damage_type: "true"
        category: "true"
        amount: "param(1100404, 1) * $self.atk"
    # 待实测：敌方/队友他源减速是否计入（官方"already Slowed"泛指；现按自有 WELT_SLOW 判定，
    # 通用减速字段名待实测）

  # 失重被击延后：处于失重的目标被攻击时行动延后 #5%（lv10=4%），每目标每回合 ≤#6 次（=8）。
  # 事件主体=$event.target（受击方是失重目标——1307 纪律，不写 $event.actor）；
  # 负 advance_action=行动条延后（我方拉条通道反向用，待实测）
  - event: "on_hp_decrease"
    condition: "has_modifier($event.target, 'WELT_WEIGHTLESS') >= 1 && $event.reason == 'hit' && res__wl_n < 8"
    effects:
      - effect_type: "advance_action"
        target: "$event.target"
        amount: "-100 * param(1100403, 5)"
      - effect_type: "gain_resource"
        resource_id: "_wl_n"
        amount: 1
    # 待实测：多目标共享计数近似（每目标独立计数通道缺）；追加真伤段/DoT 是否计入"被攻击"

  # 失重计数重置：失重目标回合开始清零（"每回合"边界以目标自身回合读，待实测）
  - event: "on_turn_start"
    condition: "has_modifier($event.actor, 'WELT_WEIGHTLESS') >= 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_wl_n"
        amount: 0

  # 大行迹 11004101·前件：战斗开始瓦尔特回复 30 能量（无等级轨道——字面值）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 30

  # 大行迹 11004101·主件【待收——过堂勘正摘除】：官方 "When ally targets attack targets
  # under the 'Weightless' state, their DMG dealt increases by 10%/stack"——主语 their =
  # 攻击方（我方），draft 把 all_dmg 挂敌方本体（=强化敌方输出，方向反）。正确件 =
  # 攻击方视角的目标条件增伤（按目标 WELT_WEIGHTLESS + 其计数层）——光环 enable_if
  # 无 $event.target 语境，条件增伤通道缺；vulnerability 是承伤区（独立乘区）与增伤区
  # 加算数学不等价，不可压缩。计数层（WLT_RETRIB_STACKS）无消费端随主件同待收。
  # params [0.1, 10, 2, 30]：10%/层、10 层、2 回合、开场 30 能量（前件已收）。

  # 大行迹 11004102 Judgment：使用基本攻击或战技时额外 1 段附加伤害——
  # 普攻段 = 0.8×普攻倍率；战技段 = 1.2×战技倍率（行迹无等级轨道，字面值）。
  # 待实测：on_action 载荷 $event.target 字段（主目标指代）；两段是否独立命中掷段
  - event: "on_action"
    condition: "$event.actor == '1004' && $event.action_id == '1100401' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "审判·追加段"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "0.8 * param(1100401, 1) * $self.atk"
  - event: "on_action"
    condition: "$event.actor == '1004' && $event.action_id == '1100402' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "审判·追加段"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "1.2 * param(1100402, 1) * $self.atk"

  # 大行迹 11004103·能量件：使用大招额外回复 5 能量（与技能固有回能 5 分槽——不合并）
  - event: "on_ultimate"
    condition: "$event.source == '1004'"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 5

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN；id 撞号（1004xx=技能 id）已声明
# 分命名空间，不与 actions 互引
eidolons:
  E1:
    name: "传承之铭"
    hooks:
      # 使用大招后获得强化：随后 2 次基本攻击/战技各多打 1 段附加伤害（50%/80% 倍率）
      - event: "on_ultimate"
        condition: "$event.source == '1004'"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e1_n"
            amount: 2
      - event: "on_action"
        condition: "$event.actor == '1004' && $event.action_id == '1100401' && !$event.insert && res__e1_n >= 1"
        effects:
          - effect_type: "deal_damage"
            name: "传承之铭·普攻段"
            target: "$event.target"
            damage_type: "imaginary"
            amount: "0.5 * param(1100401, 1) * $self.atk"
          - effect_type: "gain_resource"
            resource_id: "_e1_n"
            amount: -1
      - event: "on_action"
        condition: "$event.actor == '1004' && $event.action_id == '1100402' && !$event.insert && res__e1_n >= 1"
        effects:
          - effect_type: "deal_damage"
            name: "传承之铭·战技段"
            target: "$event.target"
            damage_type: "imaginary"
            amount: "0.8 * param(1100402, 1) * $self.atk"
          - effect_type: "gain_resource"
            resource_id: "_e1_n"
            amount: -1
    notes:
      - "计数跨回合是否保留、与 11004102 常驻追加段是否各自独立命中 待实测"
  E2:
    name: "星河交汇"
    hooks:
      # 天赋触发时回复 3 能量（与天赋同触发域——命中已减速敌人）
      - event: "on_hp_decrease"
        condition: "$event.source == '1004' && $event.reason == 'hit' && $event.damage_type != 'true' && has_modifier($event.target, 'WELT_SLOW') >= 1"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 3
  E3:
    name: "和平的祈愿"
    skill_level_overrides: {"skill": 2, "basic": 1}   # 战技+2（上限15）、普攻+1（上限10）
    notes:
      - "战技+2 随档段：弹射主/随机段倍率、减速概率（param(1100402,1/2)）；普攻+1 实取 lv7 档（scaling）"
  E4:
    name: "正义的呼名"
    hooks:
      # 使用战技时减速基础概率 +0.35（加法叠入宿主资源；封顶 1.0 规则按 min 保守，待实测）
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_welt_slow_p"
            amount: "min(1, param(1100402, 2) + 0.35)"
    notes:
      - "与基础置档 hook 的覆写顺序（声明序=后写胜）待实测；EHR 折算公式待实测"
  E5:
    name: "善良的代价"
    skill_level_overrides: {"ultimate": 2, "talent": 2}   # 大招+2、天赋+2（各上限15）
    notes:
      - "大招+2 随档段：伤害倍率 scaling、禁锢减速/失重被击延后（param(1100403,1/4/5)）；天赋+2 随档段：附加伤害倍率（param(1100404,1)）、失重减速（param(1100404,3)）"
  E6:
    name: "耀目的荣光"
    hooks:
      # 使用战技时额外 1 段随机敌方（与 4 段弹射段并列——总随机段 5；与随机池边界待实测）
      - event: "on_action"
        condition: "$event.actor == '1004' && $event.action_id == '1100402' && !$event.insert"
        effects:
          - effect_type: "deal_damage"
            name: "虚空断界"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "imaginary"
            amount: "param(1100402, 1) * $self.atk"
            toughness_dmg: 10

scaling_notes:
  - "现役技能=加强版 11004xx（官方清单并存原版 1004xx——按 1005 卡芙卡先例分版本建模，原版不写行动块）"
  - "弹射段（4 段随机 + E6 追加段）不走 action scaling：action 层只承载指定主目标 1 段，随机段与追加段一律 hook deal_damage（目标代数 mode random，B22 确定化按序取首）"
  - "减速为逐 hit 独立触发域（EN 'On hit'）：主段/弹射段/E6 段经 on_hp_decrease 统一掷 mechanic_chance(res__welt_slow_p)（res_ 平铺——999908 先例）；真伤追加段（天赋）不出集"
  - "duration 一律 int 直给（禁锢 1 / 减速 2 / 失重 2 / 惩戒 2）——param() 不入 duration 槽"
  - "能量分槽：技能固有（普攻 20 / 战技 6 待实测 / 大招 5）与行迹（开场 30 / 大招 +5）与星魂（E2 +3）互不合并"
  - "禁锢（Imprisoned）件在 action apply_modifiers 层只保留减速段（control_kind 未在 apply_modifiers 键闸登记）；禁锢专属控制语义（行动延后/无法行动判定）待通道登记后补收，现以 WELT_IMPRISON 件名+减速承载"
