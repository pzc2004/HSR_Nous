# 角色模板：瓦尔特（1004）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂收编/勘正三件：① 失重减防 40%（1100404 #2）收编——def_pct 负值通道已登记
#   （1507 BALEFIRE_BIND 先例），draft 误判"减防 stat 键名未登记"；并入 WELT_WEIGHTLESS。
#   ② 大行迹 11004101 主件方向勘正摘除——官方 "their DMG dealt" 主语=攻击方（我方），
#   draft 把 all_dmg 挂敌方本体=强化敌方输出（方向反）；攻击方视角的目标条件增伤
#   通道缺（光环 enable_if 无 $event.target 语境），vulnerability 承伤区与增伤区
#   数学不等价不可压缩 → 主件+计数层同待收（前件 +30 能量已收）。
#   ③ 减速掷概率门控写法勘正——draft 写 mechanic_chance('_welt_slow_p')（直传资源 id
#   字符串，float() 炸、条件失败按不触发吞 ⚠，e2e 实证）；正解 res_ 平铺命名空间
#   mechanic_chance(res__welt_slow_p)（999908 先例）。
#
# 收录：普攻 / 战技（指定主段 + 4 段随机弹射 + 逐 hit 减速掷 mechanic_chance 宿主资源）
#       / 终结技（AoE + 禁锢减速 10% + 失重：减速 5% + 减防 40% 2 回合）
#       / 失重被击延后 4%（≤8 次/回合计数闩 + 目标回合开始重置）
#       / 天赋时空扭曲（攻击已减速目标追加真伤 param(1100404,1)×ATK，防递归闸
#       damage_type != 'true'）/ 大行迹 11004102 Judgment（普攻 0.8×/战技 1.2× 追加段）
#       / 11004101 开场 +30 能量 / 11004103 大招 +5 能量
#       / E1 大招后 2 次强化计数闩 / E2 天赋触发 +3 能量 / E3/E5 等级族 /
#       E4 减速概率 +0.35 覆写 / E6 第 5 段随机段
# 待收（均带挡因）：禁锢行动延后 #2=12%（行动延后通道未登记——现只承载减速段）/
#       11004101 主件（攻击方目标条件增伤通道缺——过堂勘正，见上）/
#       11004103 EHR>40% 转 ATK（自身面板转换表达式通道待证）/ 秘技大世界领域语义 /
#       天赋触发域含 Judgment/弹射/E1 追加段（现按全虚数命中域——官方泛指待实测）/
#       战技 energy_gain 6（tbgd 与米游社 30 冲突）/ 削韧 fandom 空单源待校验
# 语义钉死（e2e 实证）：天赋同 hit 序 = §23 快照分发——同事件条件见旧值，首挂减速的
#       该 hit 不触发天赋，后续 hit 触发（与官方 "already Slowed" 构造一致，非假设）。
actor_id: "1004"
name: "瓦尔特"
level: 80
path: "warlock"
element: "imaginary"
base_stats:
  hp: 1125.432
  atk: 620.928
  def: 509.355
  spd: 102
  crit_rate: 0.05
  crit_dmg: 0.5
  max_energy: 120        # 终结技需求 120（max_sp=120，米游社"能量 120"交叉印证）
trace_notes:
  - "大行迹 11004102 Judgment 已收两段（Basic 0.8 倍 / Skill 1.2 倍追加段——EN 'Basic ATK or Skill' 双类明示）；与 E1 追加段是否各自独立命中待实测"
  - "大行迹 11004103 Punishment 仅收大招 +5 能量；EHR>40% 转 ATK 部分待收（词表缺——见头注）"
  - "大行迹 11004101 开场 +30 能量已收（on_battle_start gain_energy self）；是否与进场回能叠加待实测。主件（攻击失重目标增伤 10%/层×10）过堂勘正落待收——draft 把 all_dmg 挂敌方本体=强化敌方输出方向反（官方 their=攻击方）；目标条件增伤通道缺，vulnerability 乘区不同不可压缩"
  - "失重减防 40%（1100404 #2）过堂收编：def_pct 负值通道已登记（1507 BALEFIRE_BIND 先例——draft 误判'减防 stat 键名未登记'），并入 WELT_WEIGHTLESS stat_effects"
trace_stat_effects: {}

