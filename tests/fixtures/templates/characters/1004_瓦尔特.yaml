      - [0.792, 0.77, 0.1, 2]
      - [0.828, 0.78, 0.1, 2]
      - [0.864, 0.79, 0.1, 2]
      - [0.9, 0.8, 0.1, 2]
  "1100403":
    level_key: ultimate  # 拟似黑洞（Ultimate，15 档）——[伤害倍率, 禁锢行动延后, 基础概率,
                         #  禁锢减速, 失重被击延后, 每回合次数上限, 失重持续]
    rows:
      - [0.9, 0.06, 1, 0.1, 0.04, 8, 2]
      - [0.96, 0.066, 1, 0.1, 0.04, 8, 2]
      - [1.02, 0.072, 1, 0.1, 0.04, 8, 2]
      - [1.08, 0.078, 1, 0.1, 0.04, 8, 2]
      - [1.14, 0.084, 1, 0.1, 0.04, 8, 2]
      - [1.2, 0.09, 1, 0.1, 0.04, 8, 2]
      - [1.275, 0.0975, 1, 0.1, 0.04, 8, 2]
      - [1.35, 0.105, 1, 0.1, 0.04, 8, 2]
      - [1.425, 0.1125, 1, 0.1, 0.04, 8, 2]
      - [1.5, 0.12, 1, 0.1, 0.04, 8, 2]
      - [1.56, 0.126, 1, 0.1, 0.04, 8, 2]
      - [1.62, 0.132, 1, 0.1, 0.04, 8, 2]
      - [1.68, 0.138, 1, 0.1, 0.04, 8, 2]
      - [1.74, 0.144, 1, 0.1, 0.04, 8, 2]
      - [1.8, 0.15, 1, 0.1, 0.04, 8, 2]
  "1100404":
    level_key: talent    # 时空扭曲（Talent，15 档）——[附加伤害倍率, 失重减防(已收 def_pct 负值), 失重减速]
    rows:
      - [0.5, 0.4, 0.05]
