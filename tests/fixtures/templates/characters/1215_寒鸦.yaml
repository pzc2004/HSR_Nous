# 9. 站位：寒鸦无特殊站位标记（社区层无数据）
# 10. 自动战斗下 AI 终结技目标优先级（社区层无数据）
# 11. on_action / on_hp_decrease / on_kill 载荷的 target、action_type 字段名以事件注册载荷为准
