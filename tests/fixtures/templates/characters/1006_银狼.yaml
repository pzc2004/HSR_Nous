techniques:
  - technique_id: "1100607"   # 现役轨（原版 100607 留档——同技能双编号，LV.999 参数轨道）
    name: "强制结束进程"
    point_cost: 1
    effects:
      - effect_type: "deal_damage"
        name: "强制结束进程"
        target: "all_enemies"
        damage_type: "quantum"
        amount: "0.8 * $self.atk"
        toughness_dmg: 20
        toughness_scope: "all"

actions:
  # 现役轨 = 加强版 LV.999（11006xx）——原版 1006xx 留档不建行动块（卡芙卡 11005xx 先例；
  # draft 曾双轨并登记 → 双战技双终结技同时在册（政策面两 skill 两 ult 并列），过堂摘除；
  # 1100603 官方 "all enemies"=AoE——draft 误登记 single 主目标减防，同案勘正）
  - action_id: "1100601"
    name: "系统警告"
    action_type: "basic"
    target_type: "single"
    damage_type: "quantum"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    toughness_dmg: 10
    skill_point_gain: 1
    energy_gain: 20

  - action_id: "1100602"
    name: "是否允许更改？"
    action_type: "skill"
    target_type: "single"
    damage_type: "quantum"
    scaling: [{"atk": 0.98}, {"atk": 1.078}, {"atk": 1.176}, {"atk": 1.274}, {"atk": 1.372},
              {"atk": 1.47}, {"atk": 1.5925}, {"atk": 1.715}, {"atk": 1.8375}, {"atk": 1.96},
              {"atk": 2.058}, {"atk": 2.156}, {"atk": 2.254}, {"atk": 2.352}, {"atk": 2.45}]
    toughness_dmg: 20
    skill_point_cost: 1
    energy_gain: 30
    # 抗性双降件【过堂摘除落待收】：res_pen 挂敌方=死键——res_pen 读攻击方面板
    #（pipeline._res_multi_eff se["res_pen"]），敌方自身 res_pen 对受击伤害零消费；
    # 敌方抗性面板静态（_base_res 读 actor.stats.resistance 原始 StatBlock，modifier
    # 无聚合通道）。vulnerability 虽读受击方有效面板，但非弱点目标不等价
    #（0.8×1.13=0.904 ≠ 0.93），不可压缩（压缩纪律）。
    # 待收：①弱点植入本体（无通道）②单属性抗性 −20%（#4 恒档，3 回合——Inject 折算
    # 是否已含 +1 待实测）③全属性抗性 −#6（param(1100602,6)，2 回合）——同挡因：
    # 敌方抗性削减修饰通道缺。基础概率 #2（lv10 1.2 溢出）/#5=1 注记随同收。

  - action_id: "1100603"
    name: "账号已封禁"
    action_type: "ultimate"
    target_type: "aoe"           # 官方 "all enemies" 全体（过堂勘正——draft 误登记 single）
    damage_type: "quantum"
    energy_cost: 110
    energy_gain: 5
    toughness_dmg: 30
    scaling: [{"atk": 2.28}, {"atk": 2.432}, {"atk": 2.584}, {"atk": 2.736}, {"atk": 2.888},
              {"atk": 3.04}, {"atk": 3.23}, {"atk": 3.42}, {"atk": 3.61}, {"atk": 3.8},
              {"atk": 3.952}, {"atk": 4.104}, {"atk": 4.256}, {"atk": 4.408}, {"atk": 4.56}]
    apply_modifiers:
      # 全体防御力 −#3（lv10 = 0.45，随档 param(1100603, 3)），持续 #4 = 3 回合。
      # 基础概率 #2（lv10 = 1.2，溢出语义待实测）无 base_chance 通道 → 按必中写入
      - target: "all_enemies"
        modifier_id: "SW_DEF_DOWN"
        name: "账号已封禁"
        modifier_type: "debuff"
        duration: 3
        dispellable: True
        stat_effects: {"def_pct": "-param(1100603, 3)"}

hooks:
  # 天赋 等待程序响应…（1100604 现役轨——过堂切轨：draft 挂原版 100604 表，减防 #2
  # 档差 0.12 vs 0.08、基础概率 #4 档差 1.0 vs 0.72，误档实证）：银狼每次攻击后，
  # 以基础概率 #4 向被攻击目标植入 1 个随机缺陷（攻击力 −#1 / 防御力 −#2 / 速度 −#3），
  # 持续 #5 = 3 回合 + 大行迹 Generate +1 = 4 回合。触发覆盖 EN「every time Silver Wolf
  # attacks」含普攻/战技/终结技攻击段（是否含秘技开怪攻击、追加/协战攻击——待实测）。
  # 挡因在案：随机缺陷三选一无「随机效果类型」通道（目标代数 mode random 仅随机目标）
  # → 保守确定性取第 1 类（减攻），减防（param(1100604,2)）/减速（param(1100604,3)）件待通道扩展；
  # 基础概率 #4（lv10 = 1.0，溢出语义待实测）无 base_chance 键通道 → 按必中写入；
  # 同类型缺陷是否叠加、3 种同体共存上限待实测（本件 stack_mode 取 refresh=不叠同类）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && $event.source == '1006' && actor_type_of($event.target) == 'monster'"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "SW_BUG_ATK"
          name: "缺陷·攻击力"
          modifier_type: "debuff"
          duration: 4
          stack_mode: "refresh"
          dispellable: True
          stat_effects: {"atk_pct": "-param(1100604, 1)"}

eidolons:
  E1:
    name: "社会工程"
    notes:
      - "待收：使用终结技攻击后按目标当前每个负面效果回复能量 7 点、每次终结技至多触发 5 次（≤35）——挡因：①无目标负面效果计数查询函数（同 Side Note 挡因）②能量回复效果类型词表未在案（gain_resource 仅见自定义资源先例）"
  E2:
    name: "僵尸网络"
    hooks:
      - event: "actor_enter"
        condition: "actor_type_of($event.actor) == 'monster'"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.actor"
            modifier:
              modifier_id: "E2_EFFECT_RES_DOWN"
              name: "僵尸网络"
              modifier_type: "debuff"
              duration: 0
              dispellable: False
              stat_effects: {"effect_res": -0.2}
    notes:
      - "效果抵抗键按 stat_effects 同族命名（spd_pct / def_pct / res_pen 先例）——键词表待编译验证，若被键闸打回即改记待收（挡因：effect_res 未在已验证词表内）"
  E3:
    name: "载荷"
    skill_level_overrides: {"skill": 2, "talent": 2}
    notes:
      - "战技 +2：1100602 scaling 实取 lv12 档；随档段全抗 #6（param(1100602,6)）随档；单抗 0.2 与持续 3 恒档不随档"
      - "天赋 +2：缺陷减攻 param(1100604,1) 随档（实取 lv12 = 0.11）；duration 4 = 恒档 3 + 行迹 1，不随档"
  E4:
    name: "弹射攻击"
    notes:
      - "待收：使用终结技攻击后按目标每个负面效果追加 20% ATK 量子附加伤害、每次至多 5 次（≤100% ATK）——挡因：无目标负面效果计数查询函数（与 E1 同）；LV.999 AoE 终结技下的多目标计数口径另待实测"
  E5:
    name: "强制攻击"
    skill_level_overrides: {"ultimate": 2, "basic": 1}
    notes:
      - "终结技 +2：1100603 scaling 实取 lv12 档 + 减防 param(1100603,3) 随档"
      - "普攻 +1：官方普攻 10 档上限（params 10 行），无第 11 档可取——不脑补数值，跳过（param() 越档钳表尾 + ⚠编译警告口径）"
  E6:
    name: "覆盖网络"
    notes:
      - "待收：目标每个负面效果使银狼对其伤害 +20%、上限 +100%（= 5 个负面吃满）——挡因：无目标负面效果计数查询函数，stat_exprs 无法取计数；计数快照时点（与 E1/E4 是否共用同一快照）另待实测"

scaling_notes:
  - "战技耗点对轴冲突已裁决（100602 / 1100602）：tbgd BPNeed sp_cost = 1 ↔ 米游社 sub_tag 无消耗标——按纪律 tbgd 为权威，战技消耗 1 战技点；米游社标签缺省记为标注缺失，不反向否定消耗"
