# 角色模板：银狼（1006）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂收编/勘正四件：① LV.999 单轨重构——官方核心编号 11006xx=现役加强版，
#   原版 1006xx 留档不建行动块（卡芙卡 11005xx 先例）；draft 双轨并登记=
#   双战技双终结技同时在册（政策面并列），摘除 100601/100602/100603 行动块，
#   天赋钩随档表 100604→1100604（减攻 #1 档差 0.11 vs 0.105、减防 #2 档差
#   0.12 vs 0.08、基础概率 #4 档差 1.0 vs 0.72——误档实证）。
#   ② 终结技 1100603 目标类型勘正——官方 "all enemies"（减防全体+伤害全体）
#   =AoE，draft 误登记 single 主目标减防。
#   ③ 战技抗性双降件摘除落待收——res_pen 挂敌方=死键（res_pen 读攻击方面板
#   se["res_pen"]，敌方自身 res_pen 对受击零消费；敌方 resistance 面板静态
#   _base_res 读原始 StatBlock 无聚合通道）；vulnerability 非弱点目标不等价
#   （0.8×1.13=0.904≠0.93）不可压缩——与弱点植入本体同挡因落待收。
#   ④ E2 事件 actor_enter 契约验证通过（DEFAULT_CONTRACT 已登记）。
#
# 收录：普攻（1100601）/ 战技（1100602 单体 1.96 lv10——纯伤害，抗性件待收）
#       / 终结技（1100603 AoE 3.8 lv10 + 全体减防 45% 3 回合 def_pct 负值）
#       / 天赋缺陷（每次攻击命中怪物 → 减攻缺陷 10% lv10，持续 3+Generate 1=4
#       回合——随机三类无通道按第 1 类减攻承载）/ E2 入场敌方效果抵抗 -20%
#       / E3/E5 等级族 / 秘技全体 0.8×ATK + 无视弱点削韧 20
# 待收（均带挡因）：弱点植入本体 + 抗性双降（过堂③）/ 天赋减防·减速两类缺陷
#       （随机效果类型通道缺）/ LV.999 天赋弱点转移 / 大行迹 Generate 击破植入
#       缺陷（击破随机效果判定通道）/ 大行迹 Side Note（目标负面计数函数缺）/
#       E1/E4/E6（同挡因：负面计数函数缺）/ 基础概率溢出语义（#2 lv10 1.2 等）
