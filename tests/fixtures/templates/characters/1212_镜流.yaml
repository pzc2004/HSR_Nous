hooks:
  # ---- 朔望增减（战技 +1 / 终结技 +1 / 寒川映月 -1 / 归零退转魄） ----
  - event: "on_action"
    condition: "$event.actor == '1212' && $event.action_id == '1121202' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "syzygy"
        amount: "param(1121202, 2)"
  - event: "on_action"
    condition: "$event.actor == '1212' && $event.action_id == '1121203' && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "syzygy"
        amount: "param(1121203, 2)"
  - event: "on_action"
    condition: "$event.actor == '1212' && $event.action_id == '1121209' && !$event.insert"
    effects:
      # 朔望消耗固定 1 层/次（官方 1121209 params #2=1 消耗列——draft 曾误取
      # param(1121209,2)=邻倍率列 0.75 幻视；2026-09-23 已回填官方三列形状）
      - effect_type: "gain_resource"
        resource_id: "syzygy"
        amount: -1
  - event: "on_action"
    condition: "$event.actor == '1212' && $event.action_id == '1121209' && res__transmigration >= 1 && res_syzygy - 1 <= 0"
    effects:
      - effect_type: "set_resource"
        resource_id: "_transmigration"
        amount: 0
      - effect_type: "remove_modifier"
        modifier_id: "MOONLIGHT_STACKS"
      - effect_type: "remove_modifier"
        modifier_id: "MOONLIGHT_BOOST"

  # ---- 进转魄（战技/终结技路径：朔望满 2 → 额外+1 层 + 提前 100% + 暴击率） ----
  - event: "on_action"
    condition: "$event.actor == '1212' && ($event.action_id == '1121202' || $event.action_id == '1121203') && res__transmigration < 1 && res_syzygy + 1 >= param(1121204, 5)"
    effects:
      - effect_type: "gain_resource"
        resource_id: "syzygy"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_transmigration"
        amount: 1
      - effect_type: "advance_action"
        target: "self"
        amount: "param(1121204, 6) * 100"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SPECTRAL_TRANS"
          name: "转魄"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "res__transmigration >= 1"
          stat_effects: {"crit_rate": "param(1121204, 7)"}

  # ---- 转魄攻击耗血（队友=other_allies，勘正 draft all_allies 自耗） ----
  - event: "on_action"
    condition: "$event.actor == '1212' && res__transmigration >= 1 && !$event.insert"
    effects:
      - effect_type: "drain_hp"
        target: "other_allies"
        amount: "param(1121204, 2) * $target.max_hp"
        floor: 1
        drain_ratio: 0

  # ---- 月色（任意我方目标受伤/耗血 → 1 层；勘正 draft 的 1212 自伤限定） ----
  - event: "on_hp_decrease"
    condition: "actor_type_of($event.target) != 'monster' && res__transmigration >= 1"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "MOONLIGHT_STACKS"
          name: "月色"
          modifier_type: "buff"
          stacks: 1
          max_stack: 5
          stack_mode: "refresh"
          duration: 0
          dispellable: False
          enable_if: "res__transmigration >= 1"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "MOONLIGHT_BOOST"
          name: "月色·暴伤"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          enable_if: "res__transmigration >= 1"
          stat_effects:
            crit_dmg: "param(1121204, 3) * min(stacks($self, 'MOONLIGHT_STACKS'), param(1121204, 4))"

  # ---- 计次（任意我方目标受伤/耗血 20 次 → 朔望+1；三钩快照互斥） ----
  - event: "on_hp_decrease"
    condition: "actor_type_of($event.target) != 'monster' && res__hit_count + 1 >= param(1121204, 8) && (res__transmigration >= 1 || res_syzygy + 1 < param(1121204, 5))"
    effects:
      - effect_type: "gain_resource"
        resource_id: "syzygy"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_hit_count"
        amount: 0
  - event: "on_hp_decrease"
    condition: "actor_type_of($event.target) != 'monster' && res__hit_count + 1 >= param(1121204, 8) && res__transmigration < 1 && res_syzygy + 1 >= param(1121204, 5)"
    effects:
      - effect_type: "gain_resource"
        resource_id: "syzygy"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_hit_count"
        amount: 0
      - effect_type: "gain_resource"
        resource_id: "syzygy"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_transmigration"
        amount: 1
      - effect_type: "advance_action"
        target: "self"
        amount: "param(1121204, 6) * 100"
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SPECTRAL_TRANS"
          name: "转魄"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          enable_if: "res__transmigration >= 1"
          stat_effects: {"crit_rate": "param(1121204, 7)"}
  - event: "on_hp_decrease"
    condition: "actor_type_of($event.target) != 'monster' && res__hit_count + 1 < param(1121204, 8)"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_hit_count"
        amount: 1

  # ---- 大行迹·剑首 11212102（无罅飞光后回能 15 / 寒川映月后回能 8——
  #      EN "Transcendent Flash"=无罅飞光实证非强化技名；1205 gain_energy 先例） ----
  - event: "on_action"
    condition: "$event.actor == '1212' && $event.action_id == '1121202' && !$event.insert"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 15
  - event: "on_action"
    condition: "$event.actor == '1212' && $event.action_id == '1121209' && !$event.insert"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 8

  # ---- 秘技冻结附加伤（Max HP 版） ----
  - event: "on_turn_start"
    condition: "$event.actor != '1212' && actor_type_of($event.actor) == 'monster' && has_modifier($event.actor, 'TECH_FROZEN') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "古镜照神·冻结附加伤"
        target: "$event.actor"
        damage_type: "ice"
        amount: "param(1121207, 5) * $self.max_hp"

