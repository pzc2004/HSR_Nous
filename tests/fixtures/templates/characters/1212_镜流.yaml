# 角色模板：镜流（1212）·**加强后**（enhanced，默认真身）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 版本双轨：3.4 官方加强前后机制互不兼容（判据=两套技能 id 121xxx/1121xxx，
# 星魂 E1/E4/E6 机制重做），加强前见 `1212_镜流_legacy.yaml`；build member 写
# `version: legacy` 选边（编译期选文件，默认 enhanced——owner 裁定：加强前后
# 视为两个角色）。
#
# 出处：打标 DAG 双轨原料（staging）拆分 + 过堂勘正。
#
# 过堂勘正六件：① 星魂名官方勘正三件（draft 幻名 月落天关/桂子垂霜/万川映月 →
#   月犯天关/朔晕七星/半璧迫望——命名两态原则）② 月色暴伤公式 /10 幻视勘正
#   （param(1121204,3) lv1=0.22→lv10=0.44，draft 误 /10）③ 朔望上限新版=4
#   （官方天赋文本"最多可累计4层"——draft 未分版一律 4 恰对，本件按文本落实）
#   ④ 月色/计次触发条件勘正——任意我方目标受伤/耗血均计（draft 误限 1212
#   自伤/自耗；官方文本"我方目标受到伤害或消耗生命值时"）⑤ 剑首技名错位
#   勘正——EN "Transcendent Flash"=无罅飞光（121202/1121202 普通战技，EN 官方
#   命名对照实证，非强化技名）；新版 11212102 回能 15/8 收编（1205 大行迹
#   gain_energy 先例，staging"通道未登记"挡因过期）⑥ 耗血目标勘正——队友=
#   other_allies（draft all_allies 会自耗，官方"消耗队友生命值"）。
#
# 收录：普攻流影方晖（hp 倍率 lv6=0.5×Max）/ 战技无罅飞光（单攻 lv10=1.5×Max，
#       朔望+1，转魄外可用）/ 终结技昙华生灭天河泻梦（Blast 主 1.8×Max/邻 0.9×Max
#       lv10，朔望+1）/ 强化战技寒川映月（Blast 主 1.5×Max/邻 0.75×Max lv10，
#       朔望-1，转魄专属，不耗点）/ 天赋澹月转魄（朔望 2 层进转魄：额外+1 层+
#       行动提前 100%+暴击率 lv10+50%；转魄攻击耗队友 5%Max 血；我方任意目标
#       受伤/耗血→月色 1 层（上限 5），每层暴伤 lv10+44%；累计 20 次受伤/耗血
#       →朔望+1）/ 大行迹剑首 11212102（无罅飞光后回能 15、寒川映月后回能 8）/
#       秘技古镜照神（朔望+1+回能 15+冻结，冻结附加伤 0.8×Max HP 版）/
#       E1 月犯天关（暴伤+36%+主目标追伤 0.8×Max）/ E2 朔晕七星（终结技后强化
#       战技增伤 80%）/ E3/E5 等级族 / E4 持秉玄烛（月色每层额外暴伤+20%）/
#       E6 蚀变于娄（进转魄额外朔望+2、转魄中冰抗穿+30%）
# 待收（均带挡因）：E1 追伤精确主目标归属（on_action 载荷主/邻区分通道缺——
#       1205 E1 同族，现近似 pool 首敌）/ E6 朔望上限 4→5（资源 max 星魂覆写
#       通道缺——1205 E6 同族）/ 大行迹死境 11212101（转魄中效果抵抗+35%——
#       stat_effects 词表 effect_res 登记证据缺；终结技增伤+20%——ultimate
#       技能类增伤键缺，all_dmg 过宽不造键，0.35/0.2 在案）/ 大行迹霜魄
#       11212103（朔望达上限后再获得→下次攻击无视 25% 防御——def_ignore 键缺，
#       res_pen 不等值不造键，0.25 在案）/ 天赋 params #1=0.3（官方文本未引用，
#       含义不明禁脑补）/ _hit_count"每个目标每次受到攻击最多计算 1 次"的去重
#       窗（现按每 hp_decrease 事件计 1 次近似，多段攻击多计，待实测）/
#       set_hp 类 HP 变动是否计入月色/计次（发 on_hp_decrease 现计入，官方
#       口径待实测——1205 同族随注）
