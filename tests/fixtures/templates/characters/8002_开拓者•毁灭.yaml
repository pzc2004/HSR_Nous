# 角色模板：开拓者•毁灭（8002）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 命名消歧：官方 characters.json 的 name 字段为 {NICKNAME}（玩家取名占位串）——
# 开拓者按命途写全称「开拓者•毁灭」（path=Warrior→destruction；同人物多实体：
# 8001=同命途另一性体（机制镜像、技能 id 80 1xx 系，本文件为其镜像版按 8002
# 官方数据独立对轴）、8003/8004 存护、8005/8006 同谐等，互不通用）。
#
# 出处：打标 DAG 产物（staging `8002_{NICKNAME}.yaml`）+ 过堂勘正（staging→fixtures
# 合并流水线）。
#
# 过堂收编/勘正九件：
#   ① 行迹属性节点聚合收编——draft trace_stat_effects {} 全空漏收：官方十节点
#     ATK+4/4/6/6/8%、HP+4/6/8%、DEF+5/7.5%（character_skill_trees.json
#     8002201-8002210 properties 实值）→ {"atk_pct": 0.28, "hp_pct": 0.18,
#     "def_pct": 0.125}（1302 银枝/1510 姬子•启行同通道先例；金样闸「百分比
#     节点走 trace_stat_effects 通道不并入 base_stats」口径）。
#   ② 天赋 800204「牵制盗垒」收编——draft 误标待收（挡因「击破事件未登记」
#     过期：on_break 已登记，载荷 {bar_index, element, source, target}，1003
#     姬子同案收编先例）；stat_exprs 动态读层（层数在持有者账上需现场追踪=
#     手册⑩指定通道；pipeline stat 贡献不乘 stacks、refresh 不更新烘焙——
#     1210 桂乃芬 FIREKISS 先例），大行迹坚韧 DEF+10%/层 同池折叠（lv10 满
#     2 层=ATK+40%+DEF+20%，含行迹白值口径 atk×1.68/def×1.325）。粒度在案：
#     on_break 按韧性条逐条发射（§4.5 多层韧性），官方「击破弱点」口径=末条，
#     多血条精英可能多计层——待实测/通道细化（姬子头注同案）。
#   ③ 星魂 E6 收编——「消灭敌方目标也触发天赋」：on_kill 已登记（载荷
#     {action_id, source, target}）→ 同叠 PERFECT_PICKOFF（draft 随天赋件
#     一并误标待收）。
#   ④ 大行迹 8002103「斗志」摘除待收——draft 落 on_action 后授 self all_dmg
#     1 回合=双重语义错（触发当次不吃+后续一切伤害误吃）；正确件=对**指定
#     敌方目标**增伤 25%（目标限定），可用通道全评估：dmg_skill_dmg_boost
#     类型桶=把「指定目标限定」改写为「战技限定」语义假；on_become_target 闩
#     +before_take_damage waterfall 可达 action 级精确（800208/800209 可分）
#     但主/邻区分通道依旧缺（手册 16 在案）+乘区归属近似——受限语义不可
#     表达按 1315 波提欧受限易伤整件待收先例摘除（宁缺勿假）。
#   ⑤ 星魂 E2 摘除待收——官方「击中的敌方目标**弱点**为物理属性」弱点过滤
#     是承载语义（对非物理弱点敌=零回血）：has_weakness 族弱点持有查询无
#     通道（broken_of=击破态查询≠弱点持有；element_of 读角色 element 字段
#     非弱点）；draft 按全命中落地=对非物理弱点敌静默多回（假），宁缺勿假
#     摘除。数值 5%×atk 在案，通道到位即收。
#   ⑥ 秘技 800207 治疗基数勘正——官方「回复等同于**各自**生命上限 #1 的
#     生命值」（逐目标自身 max_hp），draft ratio: 0.15=施放者 HP 比例通道
#     全错；正解 amount: "0.15 * $target.max_hp"（$target 逐目标求值——
#     1402 阿格莱雅同先例）。
#   ⑦ 终结技削韧收录——draft 三终结技全缺 toughness_dmg：tbgd
#     AvatarSkillConfig ShowStanceList 权威（内部值÷3=展示值）：
#     800208=[90,0,0]→30 / 800209=[60,0,60]→主20邻20 / 800203=[0,0,0]
#     强化件无削韧（米游社「扩散 20+10*2」拆分与 tbgd 冲突不采——
#     幻视族谱⑭ tbgd 权威）。
#   ⑧ 终结技包装 action 800203 摘除——官方 effect=强化（数据层菜单入口：
#     「在两种攻击模式中选择其一」；params 三列镜像 800208/800209）；
#     draft 落 #1 主+#3 邻扩散=不存在的高伤混合体（450% 主+162% 邻双吃
#     两分支优点=免费后门族），即便改落无伤菜单件也是零伤陷阱
#     （_ult_action_of 取首件：120 能量换 0 伤害）+双计费门。两模式各
#     energy_cost=120=max_sp 全价承载（无免费后门——幻视族谱⑮闩的是
#     零成本子段，本件全价）；声明序 800208 先=自动路径确定性缺省单体
#     模式（同 instance_variants 恒取变体 0 口径），模式选择策略待实测。
#   ⑨ E5 普攻档注释勘正——编译缺省 basic=6 档（非 10）——E5 普攻+1 实取
#     lv7=1.1（10 行表内有档）；draft「10 档上限无第 11 档可取、跳过」
#     系误把缺省档当 10 档，slo 声明本正确、引擎随档自取（compiler cap
#     min(10,·) 在案）。
#   附（挡因更新非收编）：E4 draft「击破状态查询通道缺」过期——broken_of
#     宿主函数 / hit_condition 命中域 target_broken 均在库；真挡因=scoped
#     暴击通道缺（hit_condition 命中域只进 dmg_*/all_dmg/res_pen/
#     vulnerability 三区，暴击区不读 scoped 件；before_take_damage amount
#     已含暴击结算无法回改；on_action 结算后发射前置挂点亦无事件）——
#     维持待收。
#
# 收录：普攻再见安打（lv6 1.0×atk）/ 战技安息全垒打（lv10 主 1.25 邻同
#       1.25——官方同一 #1[i] 双目标照抄，draft「相邻无值待实测」系误注
#       已勘）/ 终结技双分支（800208 单体 lv10 4.5 / 800209 扩散 lv10 主
#       2.7 邻 1.62，各耗 120 回 5）/ 天赋击破叠层（lv10 ATK+20%/层+坚韧
#       DEF+10%/层，max 2 永久，stat_exprs 动态）/ 蓄势（进战回 15 能）/
#       秘技全体各回 15% 自身上限 / E1 终结技击杀回 10 能（每次攻击 1 次
#       闩——on_kill 读 <1 触发置 1、终结技 on_action 复位 0）/ E3/E5
#       等级族 / E6 击杀叠天赋。
# 待收（均带挡因）：斗志 8002103（指定目标限定不可表达——勘正④）/ E2
#       物理弱点过滤（has_weakness 查询通道缺——勘正⑤；逐命中 or 每次
#       攻击一次亦待实测）/ E4 对击破敌暴击率+25%（scoped 暴击通道缺——
#       见上附）/ 天赋多血条粒度（on_break 逐条发射，官方末条口径）/
#       秘技入场攻击 800206 削韧值（fandom/tbgd 展示值均缺——首个权威源
#       到达时补）/ 终结技模式选择策略（自动战斗二选一）待实测 / 天赋/E6
#       触发判定域（DOT/协助/击破转移算不算）待实测 / 天赋 buff 可驱散性
#       （官方未写，按不可驱散近似——待实测）。
