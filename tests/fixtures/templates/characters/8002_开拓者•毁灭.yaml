                    {"atk": 1.35}, {"atk": 1.4175}, {"atk": 1.485}, {"atk": 1.5525}, {"atk": 1.62},
                    {"atk": 1.674}, {"atk": 1.728}, {"atk": 1.782}, {"atk": 1.836}, {"atk": 1.89}]
    # lv10=[2.7, 1.62]；E5 实取 lv12=[2.88, 1.728]；lv15=[3.15, 1.89]
    toughness_dmg: 20         # tbgd 权威（ShowStanceList [60,0,60]÷3：主 20 邻 20——勘正⑦；
    toughness_dmg_blast: 20   # 米游社「20+10*2」拆分与 tbgd 冲突不采——幻视族谱⑭ tbgd 权威）
    skill_point_cost: 0
    skill_point_gain: 0

hooks:
  # 天赋 800204「牵制盗垒」：本角色造成弱点击破后 ATK+param(800204,1)/层（lv10=0.2），
  # 至多 2 层（#2 全档恒 2——literal；max_stack 只收 int 字面量——手册 11）；
  # 大行迹坚韧同源半件：每层随附 DEF+10%（8002102 params [[0.1]] 单档→字面值不随档）。
  # stat_exprs 动态读层（层数在持有者账上需现场追踪=手册⑩指定通道；pipeline stat
  # 贡献不乘 stacks、refresh 不更新烘焙——1210 FIREKISS 先例）。duration 0=永续
  #（官方无时长文本）。粒度在案：on_break 按韧性条逐条发射，官方口径=末条破——
  # 多血条精英可能多计层，待实测/通道细化；触发判定域（DOT/协助/击破转移）待实测
  - event: "on_break"
    condition: "$event.source == '8002'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "PERFECT_PICKOFF"
          name: "牵制盗垒"
          modifier_type: "buff"
          stacks: 1
          max_stack: 2
          stack_mode: "refresh"
          duration: 0
          dispellable: false    # 官方未写——按不可驱散近似（待实测）
          stat_exprs:
            atk_pct: "param(800204, 1) * stacks($self, 'PERFECT_PICKOFF')"
            def_pct: "0.1 * stacks($self, 'PERFECT_PICKOFF')"   # 大行迹坚韧折叠（单档字面化）

  # 大行迹 8002101「蓄势」：战斗开始立即回复 15 能量（params [[15]] 单档字面化）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 15

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN；机制 hooks 一律收进
# 对应 E 块（顶层 hooks=全 E0 生效——8001 同 kit 镜像先例勘正①归位）
eidolons:
  E1:
    name: "A Falling Star"   # 坠临万界的星芒
    hooks:
      # 终结技击杀 → 额外回 10 能量（"该效果每次攻击只能触发 1 次"——闩两段式：
      # 击杀时闩<1 才触发并置 1（同攻击二杀被闩——逐次 emit 序读新值），
      # 终结技 on_action（结算后发射）复位 0——下一次攻击重新放行
      - event: "on_kill"
        condition: "$event.source == '8002' && ($event.action_id == '800208' || $event.action_id == '800209') && res__e1_once < 1"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 10
          - effect_type: "set_resource"
            resource_id: "_e1_once"
            amount: 1
      - event: "on_action"
        condition: "$event.actor == '8002' && ($event.action_id == '800208' || $event.action_id == '800209') && !$event.insert"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e1_once"
            amount: 0
    notes:
      - "真实终结技=800208/800209 两分支（包装件 800203 已摘除——勘正⑧），闩域圈两分支与官方「施放终结技」同义"
      - "与天赋/E6 的'击败触发'同帧各自结算（能量+10 与叠层互不干扰——闩只由本钩自写）——待实测"
  E2:
    name: "An Unwilling Host"   # 因缘假合的人身
    notes:
      - "施放攻击后若击中的敌方目标**弱点**为物理属性，回复等同于开拓者 5% 攻击力的生命——待收（勘正⑤：has_weakness 族弱点持有查询通道缺，draft 全命中落地=对非物理弱点敌静默多回已摘除；数值 5%×atk 在案。逐命中 or 每次攻击一次结算域亦待实测）"
  E3:
    name: "A Leading Whisper"   # 揭示前路的言灵
    skill_level_overrides: {"skill": 2, "talent": 2}   # 战技+2、天赋+2（上限 15）
    notes:
      - "战技+2：800202 scaling/scaling_blast 实取 lv12 档（1.375/同值）；天赋+2 随档段：param(800204,1) → lv12=0.22（stat_exprs 编译期取档；DEF 0.1 与层数上限 2 维持字面值不随档）"
  E4:
    name: "A Destructing Glance"   # 凝眸毁灭的瞬间
    notes:
      - "击中处于弱点击破状态的敌方目标时暴击率+25%——待收（勘正附更新：scoped 暴击通道缺——hit_condition 命中域只进 dmg_*/all_dmg/res_pen/vulnerability，暴击区不读 scoped 件；before_take_damage amount 已含暴击结算无法回改；broken_of/target_broken 查询在库，draft 原挡因「击破查询通道缺」已过期）"
  E5:
    name: "A Surviving Hope"   # 劫余重生的希望
    skill_level_overrides: {"ultimate": 2, "basic": 1}  # 终结技+2、普攻+1（上限 10）
    notes:
      - "终结技+2：800208 scaling 实取 lv12 档（4.8）；800209 scaling/scaling_blast 实取 lv12 档（2.88/1.728）；普攻+1：编译缺省 basic=6 档 → lv7=1.1（10 行表内有档——勘正⑨，draft「无档可取跳过」误判；compiler cap min(10,·) 在案）"
  E6:
    name: "A Trailblazing Will"   # 拓宇行天的意志
    hooks:
      # 开拓者消灭敌方目标时也触发天赋（非直接攻击来源判定域待实测）——
      # 与天赋同叠 PERFECT_PICKOFF（stacks+1 refresh，max 2 clamp 同口径；
      # stat_exprs 现场读层无需重烘——手册⑩）
      - event: "on_kill"
        condition: "$event.source == '8002'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "PERFECT_PICKOFF"
              name: "牵制盗垒"
              modifier_type: "buff"
              stacks: 1
              max_stack: 2
              stack_mode: "refresh"
              duration: 0
              dispellable: false
              stat_exprs:
                atk_pct: "param(800204, 1) * stacks($self, 'PERFECT_PICKOFF')"
                def_pct: "0.1 * stacks($self, 'PERFECT_PICKOFF')"
    notes:
      - "任意来源消灭均触发（普攻/战技/终结技击杀同域——官方「消灭敌方目标」无技能限定）；E6 触发的终结技击杀也经 E1 闩链（两钩同事件无资源串扰——闩只由 E1 钩自写）"

scaling_notes:
  - "终结技 800203=数据层菜单入口（官方 effect=强化；params [3,1.8,1.08] 三列=800208 单体倍率/800209 主/邻倍率镜像）——不落 action（勘正⑧）；出手落 800208/800209 两独立 action、各 energy_cost=120=max_sp 全价；自动路径确定性缺省=声明序首件 800208 单体模式，模式选择策略待实测"
  - "全部伤害 action 基数区=自身 ATK（官方 desc 口径）；Blast 相邻同倍率（800202 官方同一 #1 双目标）与 60% 倍率（800209 #2/#1=0.6）分列 scaling/scaling_blast"
  - "削韧值 tbgd 权威收录（勘正⑦）：800201=10 / 800202=主20邻10 / 800208=30 / 800209=主20邻20（ShowStanceList 内部值÷3；米游社「扩散 20+10*2」拆分冲突不采——幻视族谱⑭）"
  - "等级轨道：编译缺省 basic=6/skill=10/ultimate=10/talent=10——e2e 手算实取档：E0 普攻 1.0/战技 1.25/大单 4.5/大扩 2.7+1.62/天赋 0.2 层；E3 战技 1.375+天赋 0.22；E5 普攻 1.1+大 4.8/2.88+1.728"
