# 鼹鼠党欢迎你（21005，4★ 毁灭/Warrior）——验收版 fixture
# 数据源：StarRailRes cn/en light_cone_ranks.json（desc：装备者施放普攻、战技或终结技攻击敌方
#   目标后，分别获取一层【淘气值】，每层使装备者的攻击力提高#1[i]%；#1 S1~S5=0.12/0.15/0.18/0.21/0.24）。
# 勘正（staging → 验收）：
#   ① staging 只钩 on_ultimate 且单 modifier 无层数语义——官方「分别获取一层」= 普攻/战技/终结技
#      各计一层（上限 3，同类行动重复施放不复叠）→ 拆三 modifier（各 max_stack 1，同名 refresh
#      重挂 clamp 1 层）+ 三 hook 按 action_type 分闸；
#   ② stat 键 atk（flat）错——官方「攻击力提高#1[i]%」是百分比 → atk_pct（白值口径）；
#   ③ 补 $event.actor == $self.actor_id 装备者判定（staging 无——任意队友行动都会给装备者叠层）；
#   ④ 补命途限制条件；notes 待收编注清理。
# 待实测：无。
light_cone_id: '21005'
name: 鼹鼠党欢迎你
rarity: 4
path: Warrior
base_stats:
  hp: 1058.4
  atk: 476.28
  def: 264.6
lookup_tables:
  param_1:
  - 0.12
  - 0.15
  - 0.18
  - 0.21
  - 0.24
variable_bindings:
- self.param_1 = lookup_table("param_1", index=$build.light_cone.superimposition - 1)
hooks:
- event: on_action
  condition: path_of($self) == 'destruction' && $event.actor == $self.actor_id && $event.action_type == 'basic'
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_21005_MISCHIEF_BASIC
      name: 淘气值·普攻
      modifier_type: buff
      duration: 0
      max_stack: 1
      dispellable: false
      stack_mode: replace
      stat_effects:
        atk_pct: $self.param_1
- event: on_action
  condition: path_of($self) == 'destruction' && $event.actor == $self.actor_id && $event.action_type == 'skill'
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_21005_MISCHIEF_SKILL
      name: 淘气值·战技
      modifier_type: buff
      duration: 0
      max_stack: 1
      dispellable: false
      stack_mode: replace
      stat_effects:
        atk_pct: $self.param_1
- event: on_action
  condition: path_of($self) == 'destruction' && $event.actor == $self.actor_id && $event.action_type == 'ultimate'
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_21005_MISCHIEF_ULT
      name: 淘气值·终结技
      modifier_type: buff
      duration: 0
      max_stack: 1
      dispellable: false
      stack_mode: replace
      stat_effects:
        atk_pct: $self.param_1
