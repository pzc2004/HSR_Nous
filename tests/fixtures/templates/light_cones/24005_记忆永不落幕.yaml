# 光锥 fixture：记忆永不落幕（24005，记忆 5★）——staging→fixtures 验收批（验收型）
#
# 数据源：data/starrailres/index_new/cn/light_cone_ranks.json（叠影 desc/params 终审）
#         + data/starrailres/index_new/cn/light_cones.json（基础信息）
#         + data/annotator/staging_root/light_cones/24005_记忆永不落幕.yaml（生成器数值区照抄）
#
# 勘正条目（staging→本版）：
#   ① 补全「使装备者的速度提高#1[f1]%」常驻件（staging 漏，只有战技钩）——spd_pct
#     白值百分比口径（[f1] 格式=百分数一位小数，值即比率，ranks params 照抄）
#   ② 战技钩补装备者判定 $event.actor == $self.actor_id（staging 仅 action_type ==
#     'skill'——任意单位（含敌方）施放战技都给己方全队挂增伤）
#   ③ staging notes「机制 effects 未生成，待收编」退役（机制已收编）
light_cone_id: '24005'
name: 记忆永不落幕
rarity: 5
path: Memory
base_stats:
  hp: 1058.4
  atk: 529.2
  def: 396.9
lookup_tables:
  spd_pct: [0.06, 0.075, 0.09, 0.105, 0.12]  # #1 速度
  param_2: [0.08, 0.1, 0.12, 0.14, 0.16]     # #2 全体增伤
  param_3: [3.0, 3.0, 3.0, 3.0, 3.0]         # #3 持续回合（各档恒 3）
variable_bindings:
- self.spd_pct = lookup_table("spd_pct", index=$build.light_cone.superimposition - 1)
- self.param_2 = lookup_table("param_2", index=$build.light_cone.superimposition - 1)
- self.param_3 = lookup_table("param_3", index=$build.light_cone.superimposition - 1)
notes:
- desc（官方原文，ranks.json 照抄）：使装备者的速度提高#1[f1]%。装备者施放战技后，
  使我方全体造成的伤害提高#2[i]%，持续#3[i]回合。
hooks:
- event: on_battle_start
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_24005_SPD
      name: 记忆永不落幕
      modifier_type: buff
      duration: 0
      stack_mode: "refresh"    # 烘焙值随档恒定（重挂同值——编译器重烘告警消音）
      dispellable: false
      stat_effects:
        spd_pct: $self.spd_pct
- event: on_action
  condition: "$event.actor == $self.actor_id && $event.action_type == 'skill'"
  effects:
  - effect_type: apply_modifier
    target: all_allies
    modifier:
      modifier_id: LC_24005_TEAM_DMG
      name: 记忆永不落幕·增伤
      modifier_type: buff
      duration: 3              # #3=3（各档恒 3，叠影无关时长）
      stack_mode: "refresh"    # 重挂=刷新时长（烘焙值随档恒定，重烘同值——编译器重烘告警消音）
      max_stack: 1
      stat_effects:
        all_dmg: $self.param_2
