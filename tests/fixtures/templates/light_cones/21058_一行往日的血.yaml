# 一行往日的血（21058，4★ 毁灭/Warrior）——验收版 fixture
# 数据源：StarRailRes cn/en light_cone_ranks.json（desc：使装备者的暴击率提高#1[i]%。装备者造成的
#   战技和终结技伤害提高#2[i]%；#1 S1~S5=0.12/0.14/0.16/0.18/0.20（properties CriticalChanceBase
#   同值旁证→crit_rate 列）、#2=0.24/0.28/0.32/0.36/0.40）。
# 勘正（staging → 验收）：
#   ① 常驻 crit_rate 段 staging 漏挂 → 补进战常驻 modifier；
#   ② stat 键 skill_dmg_bonus/ultimate_dmg_bonus 错——类型桶 canonical 键是
#      dmg_skill_dmg_boost/dmg_ultimate_dmg_boost（_KNOWN_STAT_KEYS 词表 + 死键映射先例）；
#   ③ 补命途限制条件；notes 待收编注清理。
#   ④ 绑定变量名 crit_rate 撞 effective_stats 面板键（_HookSelfNS 面板优先——$self.crit_rate
#      现场读到的是面板值而非叠影参数，静默错值；99001 crit_rate_param 先例）→ 绑定改名 crit_rate_param
#     （lookup_tables 数值区不动）。
# 待实测：无。
light_cone_id: '21058'
name: 一行往日的血
rarity: 4
path: Warrior
base_stats:
  hp: 1058.4
  atk: 529.2
  def: 330.75
lookup_tables:
  crit_rate:
  - 0.12
  - 0.14
  - 0.16
  - 0.18
  - 0.2
  param_2:
  - 0.24
  - 0.28
  - 0.32
  - 0.36
  - 0.4
variable_bindings:
- self.crit_rate_param = lookup_table("crit_rate", index=$build.light_cone.superimposition - 1)
- self.param_2 = lookup_table("param_2", index=$build.light_cone.superimposition - 1)
hooks:
- event: on_battle_start
  condition: path_of($self) == 'destruction'
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_21058_PANEL
      name: 一行往日的血
      modifier_type: buff
      duration: 0
      dispellable: false
      stack_mode: replace
      stat_effects:
        crit_rate: $self.crit_rate_param
        dmg_skill_dmg_boost: $self.param_2
        dmg_ultimate_dmg_boost: $self.param_2
