# 光锥 fixture：宇宙大生意（22004，智识 4★）——human_queue 分诊落版
#
# 数据源：data/starrailres/index_new/cn/light_cone_ranks.json（叠影 desc/params 终审）。
# 分诊：候选稿 hooks 空=「模型没写」——攻击半收编（atk_pct 常驻；智识族不设
#   path_of 门——族决策在案）。
# 待收（挡因）：「敌方目标每拥有1个不同属性的弱点，装备者对其造成的伤害提高#2[i]%，
#   最多计入7个」——目标弱点计数无查询通道（无 weakness_count 宿主函数，hit_condition
#   命中域亦无该载荷）。param_2 表/绑定保留供收编时对轴。
light_cone_id: '22004'
name: 宇宙大生意
rarity: 4
path: Mage
base_stats:
  hp: 952.56
  atk: 476.28
  def: 330.75
lookup_tables:
  atk_pct:
  - 0.08
  - 0.1
  - 0.12
  - 0.14
  - 0.16
  param_2:
  - 0.04
  - 0.05
  - 0.06
  - 0.07
  - 0.08
variable_bindings:
- self.atk_pct = lookup_table("atk_pct", index=$build.light_cone.superimposition -
  1)
- self.param_2 = lookup_table("param_2", index=$build.light_cone.superimposition -
  1)
hooks:
- event: on_battle_start
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_22004_ATK
      name: 宇宙大生意·攻击
      modifier_type: buff
      duration: 0
      stack_mode: "refresh"    # 烘焙值随档恒定（重挂同值——编译器重烘告警消音）
      dispellable: false
      stat_effects:
        atk_pct: $self.atk_pct
