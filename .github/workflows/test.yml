name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv venv && uv pip install -e ".[dev,account,screen,pilot,web]"
      # 游戏数据下载：StarRailRes（GitHub Mar-7th/StarRailRes）+ Hakushin（static.nanoka.cc）+
      # turnbasedgamedata（GitLab Dimbreath/turnbasedgamedata）——使数据环境闸
      # starrailres/stage_data/tbgd_data 三判定在 CI 成立；Fandom 语义文件不在此拉取
      #（镜像/快照供给，缺失时相关测试按设计跳过）
      - run: uv run hsr-data-update
      - run: uv run hsr-data-update --lang cn
      - run: uv run hsr-data-update --enemies
      - run: uv run hsr-data-update --stages
      - name: turnbasedgamedata（GitLab raw）
        run: |
          mkdir -p data/turnbasedgamedata
          for f in MonsterConfig.json MonsterTemplateConfig.json MonsterSkillConfig.json; do
            curl -sfL -o "data/turnbasedgamedata/$f" "https://gitlab.com/Dimbreath/turnbasedgamedata/-/raw/main/ExcelOutput/$f"
          done
      # 生成件动态产出：tbgd 技能机制提取（GitLab AvatarSkillConfig → data/tbgd_skill_data.json）+
      # 模板骨架全量生成（约 2 秒——data/sim_templates 五类千余件）——使生成件判定
      # tbgd_skill/sim_templates 在 CI 成立，打标 DAG/模板校验/生成器链路测试由 skip 转实跑
      - run: uv run python -m hsr_nous.pipeline.extract_tbgd_skills
      - run: uv run python -m hsr_nous.adapters.template_generator
      # 离线套件；agents//account 区为他人代码存量问题（SyntaxError 等），修复前进 CI 排除
      # 数据依赖测试自带 skipif（data/ 为 gitignored——CI 上三源下载 + 两件生成后对应判定
      # 成立才跑，fandom 语义缺失时按设计跳过）
      - run: >
          .venv/bin/python -m pytest tests/ -q
          --ignore=tests/test_account.py
          --ignore=tests/test_agent_prompts.py
          --ignore=tests/test_agent_tools.py
          --ignore=tests/test_agents_mocked.py
          --ignore=tests/test_llm_factory.py
          --ignore=tests/test_deepseek_smoke.py
