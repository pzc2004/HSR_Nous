name: data-mirror

# 数据快照 CD:每两周全量生产数据快照(hsr-data update 产物,构造恒等)→
# 发布 release → 开 PR 前移 pins.py 钉值(auto-merge:CI 绿即合)→ 留存清理(只留 2 个)。
# buh 死源以冻结快照覆盖层应急(FROZEN_BUH_TAG),上游 v4.0 落地后删覆盖层即揭封。

on:
  schedule:
    - cron: "13 4 1,15 * *"   # 每月 1/15 日 04:13 UTC ≈ 每两周
  workflow_dispatch:
    inputs:
      tag:
        description: "指定 release tag(留空=data-full-<日期>)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv 与项目环境(hsr-data 需要)
        run: |
          pip install uv
          uv venv && uv pip install -e ".[dev]"

      - name: 全量构建(hsr-data update + buh 覆盖层 + 数据闸 + 打包)
        id: pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/buh_mirror.py build \
            --with-fandom \
            --tag "${{ inputs.tag }}" \
            --out-dir "$RUNNER_TEMP" \
            | tee "$RUNNER_TEMP/build.out"
          grep -E '^tag=' "$RUNNER_TEMP/build.out" >> "$GITHUB_OUTPUT"

      - name: 发布 release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/buh_mirror.py publish \
            --tag "${{ steps.pack.outputs.tag }}" \
            --file "$RUNNER_TEMP/data-snapshot.tar.gz" \
            --out-dir "$RUNNER_TEMP"

      - name: 开 PR 前移 pins.py 钉值(auto-merge:CI 绿即合)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/buh_mirror.py bump \
            --tag "${{ steps.pack.outputs.tag }}"

      - name: 留存清理(只保留最新 2 个 data-full-* 快照)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/buh_mirror.py prune --keep 2
