- insert:
    - id: nous-research-policy
      name: ./research_policy.mjs
    - id: nous-research-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: nous
        transport: stdio
        command: !!js process.env.HSR_NOUS_PYTHON
        args: ['-m', 'hsr_nous.research_permissions.mcp']
        cwd: !!js process.env.HSR_NOUS_RESEARCH_ROOT
        env:
          HSR_NOUS_RESEARCH_ROOT: !!js process.env.HSR_NOUS_RESEARCH_ROOT
          PYTHONPATH: !!js process.env.HSR_NOUS_PYTHONPATH
        toolCallTimeoutMs: 600000
        failOnStartupError: true
