- id: agent-default-model
  config:
    provider: openai-gateway
    model: !!js process.env.HSR_NOUS_LLM_AGENTS_MODEL
- id: llm-pi-ai
  config:
    providers:
      openai-gateway:
        api: openai-completions
        baseURL: !!js >-
          (() => {
            const raw = process.env.HSR_NOUS_LLM_AGENTS_API_BASE
            if (!raw) return raw
            const root = raw.replace(/\/+$/, '')
            return root.endsWith('/v1') ? root : `${root}/v1`
          })()
        apiKeyEnv: HSR_NOUS_LLM_AGENTS_API_KEY
        models:
          - id: !!js process.env.HSR_NOUS_LLM_AGENTS_MODEL
            name: Configured research model
            # deepseek-flash 官方上下文 1M（DSH 目录默认即 1,000,000）；
            # 旧值 262144 是保守默认，声明过小会让用量显示/压缩策略提前误判
            contextWindow: 1000000
