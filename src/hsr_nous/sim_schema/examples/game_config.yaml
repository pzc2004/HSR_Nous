# game_config.yaml — 游戏机制配置（pipeline 自动生成）
# 示例：三月七 vs 冰锋，忘却之庭场景
# 所有数值来自 StarRailRes (Mar-7th/StarRailRes) 数据文件

# ===== 公式定义 =====
formula:
  damage:
    expression: "abilityMulti * dmgBoostMulti * indDmgBoostMulti * defMulti * resMulti * baseUniversalMulti * vulnMulti * indVulnMulti * finalDmgMulti * critMulti * weakenMulti * dmgRedMulti"
    parameters:
      - name: abilityMulti
        source: skill_scaling
      - name: dmgBoostMulti
        expression: "1 + dmg_bonus + all_dmg_bonus"
      - name: indDmgBoostMulti
        expression: "1 + ind_dmg_bonus"
      - name: defMulti
        expression: "(attacker_level * 10 + 200) / (target_def * max(0, 1 - def_pen) + attacker_level * 10 + 200)"
      - name: resMulti
        expression: "1 - clamp(target_res - res_pen, -1.0, 0.9)"
      - name: baseUniversalMulti
        expression: "target_toughness > 0 ? 0.9 : 1.0"
      - name: vulnMulti
        expression: "1 + vulnerability"
      - name: indVulnMulti
        expression: "1 + ind_vulnerability"
      - name: finalDmgMulti
        expression: "1 + final_dmg_bonus"
      - name: critMulti
        expression: "is_crit ? (1 + crit_dmg) : 1.0"
      - name: weakenMulti
        expression: "1 - weaken"
      - name: dmgRedMulti
        expression: "1 - dmg_reduction"

  heal:
    expression: "(atk_scaling * atk + hp_scaling * hp + flat_heal) * (1 + heal_bonus + incoming_heal)"

  shield:
    expression: "(def_scaling * def + hp_scaling * hp + atk_scaling * atk + flat_shield) * (1 + shield_bonus)"

# ===== 角色模板 =====
# 来源: characters.json, character_skills.json, character_promotions.json
character_templates:
  "1001":
    name: "March 7th"
    name_cn: "三月七"
    path: "Knight"              # Preservation
    element: "Ice"
    rarity: 4
    max_energy: 120             # characters.json max_sp
    taunt: 150                  # Preservation = 150

    # 等级 1 基础值（来自 character_promotions.json 最后一档）
    # adapter 计算：final = base + step * (level - 1)
    base_stats:
      hp: { base: 489.6, step: 7.2 }      # Lv.80 = 489.6 + 7.2*79 = 1058.4
      atk: { base: 236.64, step: 3.48 }   # Lv.80 = 236.64 + 3.48*79 = 511.6
      def: { base: 265.2, step: 3.9 }     # Lv.80 = 265.2 + 3.9*79 = 573.3
      spd: 101
      crit_rate: 0.05
      crit_dmg: 0.5
      taunt: 150

    # 行迹提供的固定属性加成（小节点，来自 character_skill_trees.json）
    trace_stats:
      ice_dmg: 0.224             # 3.2%+3.2%+4.8%+4.8%+6.4% = 22.4%
      def_pct: 0.225             # 5%+7.5%+10% = 22.5%
      effect_res: 0.10           # 4%+6% = 10%

    actions:
      - action_id: "1001_basic"
        name: "Frigid Cold Arrow"
        name_cn: "寒冰之箭"
        action_type: "basic"
        target_type: "enemy_single"
        damage_type: "ice"
        energy_gain: 20
        skill_point_gain: 1
        toughness_dmg: 10
        effects:
          - trigger: "on_cast"
            target: "primary_target"
            effect_type: "deal_damage"
            formula: "damage"
            # params[0] = atk scaling per level
            scaling: [0.50, 0.60, 0.70]

      - action_id: "1001_skill"
        name: "The Power of Cuteness"
        name_cn: "可爱即是正义"
        action_type: "skill"
        target_type: "ally_single"
        damage_type: null
        energy_gain: 30
        skill_point_cost: 1
        toughness_dmg: 0
        effects:
          - trigger: "on_cast"
            target: "primary_target"
            effect_type: "apply_modifier"
            modifier_id: "MOD_1001_SHIELD"
            duration: 3
            # params: [def_scaling, duration, hp_threshold, flat_shield, taunt_bonus]
            # Lv.1: DEF*38% + 190, 3 turns, 30% HP threshold
            shield:
              def_scaling: [0.38, 0.4037, 0.4275]
              flat: [190, 304, 389.5]
              duration: [3, 3, 3]
              hp_threshold: 0.3       # HP >= 30% 时增加受击概率

      - action_id: "1001_ultimate"
        name: "Glacial Cascade"
        name_cn: "冰刻剑雨之时"
        action_type: "ultimate"
        target_type: "enemy_aoe"
        damage_type: "ice"
        energy_cost: 120
        energy_gain: 5
        toughness_dmg: 30
        effects:
          - trigger: "on_cast"
            target: "all_enemies"
            effect_type: "deal_damage"
            formula: "damage"
            # params[0] = atk scaling
            scaling: [0.90, 0.96, 1.02]
          - trigger: "on_cast"
            target: "all_enemies"
            effect_type: "apply_modifier"
            modifier_id: "MOD_1001_FREEZE"
            # params: [atk_scaling, base_chance, duration, additional_dmg_scaling]
            # Lv.1: 50% base chance, 1 turn, 30% ATK additional ice dmg
            freeze:
              base_chance: [0.50, 0.50, 0.50]
              duration: [1, 1, 1]
              additional_dmg_scaling: [0.30, 0.33, 0.36]

      - action_id: "1001_talent"
        name: "Girl Power"
        name_cn: "可爱力量"
        action_type: "talent"
        target_type: "enemy_single"
        damage_type: "ice"
        toughness_dmg: 10
        description: "Shielded ally attacked -> March 7th Counters"
        effects:
          - trigger: "on_ally_shielded_hit"
            target: "attacker"
            effect_type: "deal_damage"
            formula: "damage"
            # params: [atk_scaling, max_triggers_per_turn]
            # Lv.1: 50% ATK, max 2 per turn
            scaling: [0.50, 0.55, 0.60]
            max_triggers_per_turn: [2, 2, 2]

      - action_id: "1001_technique"
        name: "Freezing Beauty"
        name_cn: "冻人之美"
        action_type: "technique"
        target_type: "enemy_single"
        damage_type: "ice"
        effects:
          - trigger: "on_battle_start"
            target: "random_enemy"
            effect_type: "apply_modifier"
            modifier_id: "MOD_1001_TECH_FREEZE"
            # params: [base_chance, duration, additional_dmg_scaling]
            freeze:
              base_chance: 1.0
              duration: 1
              additional_dmg_scaling: 0.50

    eidolon_defs:
      - eidolon_id: "E_1001_1"
        rank: 1
        name: "Memory of You"
        name_cn: "记忆中的你"
        description: "Every time March 7th's Ultimate Freezes a target, she regenerates 6 Energy."
        effects:
          - trigger: "on_freeze_apply"
            condition: "source_id == 1001"
            target: "self"
            effect_type: "gain_energy"
            value: 6

      - eidolon_id: "E_1001_2"
        rank: 2
        name: "Memory of It"
        name_cn: "记忆中的它"
        description: "Upon entering battle, grants a Shield equal to 24% of March 7th's DEF plus 320 to the ally with the lowest HP percentage, lasting for 3 turns."
        effects:
          - trigger: "on_battle_start"
            target: "lowest_hp_ally"
            effect_type: "apply_modifier"
            modifier_id: "MOD_1001_E2_SHIELD"
            duration: 3
            shield:
              def_scaling: 0.24
              flat: 320

      - eidolon_id: "E_1001_3"
        rank: 3
        name: "Memory of Everything"
        name_cn: "记忆中的一切"
        description: "Ultimate Lv. +2, Basic ATK Lv. +1."
        effects:
          - effect_type: "skill_level_up"
            target: "ultimate"
            value: 2
          - effect_type: "skill_level_up"
            target: "basic"
            value: 1

      - eidolon_id: "E_1001_4"
        rank: 4
        name: "Never Forfeit Again"
        name_cn: "不再认输"
        description: "Talent Counter can be triggered 1 more time each turn. Counter DMG increases by 30% of March 7th's DEF."
        effects:
          - effect_type: "modify_talent"
            max_triggers_bonus: 1
          - trigger: "on_ally_shielded_hit"
            target: "attacker"
            effect_type: "deal_damage"
            formula: "damage"
            def_scaling: 0.30
            description: "Additional Counter DMG based on DEF"

      - eidolon_id: "E_1001_5"
        rank: 5
        name: "Never Forget Again"
        name_cn: "不再遗忘"
        description: "Skill Lv. +2, Talent Lv. +2."
        effects:
          - effect_type: "skill_level_up"
            target: "skill"
            value: 2
          - effect_type: "skill_level_up"
            target: "talent"
            value: 2

      - eidolon_id: "E_1001_6"
        rank: 6
        name: "Just Like This, Always..."
        name_cn: "就这样、一直……"
        description: "Allies under the protection of the Shield granted by the Skill restore HP equal to 4% of their Max HP plus 106 at the beginning of each turn."
        effects:
          - trigger: "on_turn_start"
            condition: "target.has_modifier(MOD_1001_SHIELD)"
            target: "shielded_ally"
            effect_type: "heal"
            hp_scaling: 0.04
            flat: 106

# ===== 光锥模板 =====
# 来源: light_cones.json, light_cone_promotions.json, light_cone_ranks.json
light_cone_templates:
  "20003":
    name: "Amber"
    name_cn: "琥珀"
    rarity: 3
    path: "Knight"

    # 等级 1 基础值（来自 light_cone_promotions.json 最后一档）
    base_stats:
      hp: { base: 391.68, step: 5.76 }    # Lv.80 = 391.68 + 5.76*79 = 846.7
      atk: { base: 122.4, step: 1.8 }     # Lv.80 = 122.4 + 1.8*79 = 264.6
      def: { base: 153.0, step: 2.25 }    # Lv.80 = 153 + 2.25*79 = 330.8

    # 叠影效果（来自 light_cone_ranks.json）
    skill_name: "Stasis"
    skill_desc: "Increases the wearer's DEF by #1[i]%. If the wearer's current HP percentage is lower than #2[i]%, increases their DEF by a further #3[i]%."
    superimposition:
      1: { def_pct: 0.16, def_pct_conditional: 0.16, hp_threshold: 0.50 }
      2: { def_pct: 0.20, def_pct_conditional: 0.20, hp_threshold: 0.50 }
      3: { def_pct: 0.24, def_pct_conditional: 0.24, hp_threshold: 0.50 }
      4: { def_pct: 0.28, def_pct_conditional: 0.28, hp_threshold: 0.50 }
      5: { def_pct: 0.32, def_pct_conditional: 0.32, hp_threshold: 0.50 }

# ===== 遗器规则 =====
# 来源: relic_main_affixes.json, relic_sub_affixes.json, relic_sets.json
relic_rules:
  main_stats:
    head: { stat: "hp", base: 705.0 }
    hand: { stat: "atk", base: 352.0 }
    body: ["hp_pct", "atk_pct", "def_pct", "crit_rate", "crit_dmg", "heal_bonus", "effect_hit"]
    feet: ["hp_pct", "atk_pct", "def_pct", "spd"]
    sphere: ["hp_pct", "atk_pct", "def_pct", "physical_dmg", "fire_dmg", "ice_dmg", "thunder_dmg", "wind_dmg", "quantum_dmg", "imaginary_dmg"]
    rope: ["hp_pct", "atk_pct", "def_pct", "break_effect", "energy_regen"]

  sub_stats:
    hp:     { base: 33.87, step: 33.87 }
    atk:    { base: 16.93, step: 16.93 }
    def:    { base: 16.93, step: 16.93 }
    hp_pct: { base: 0.034, step: 0.034 }
    atk_pct: { base: 0.034, step: 0.034 }
    def_pct: { base: 0.043, step: 0.043 }
    spd:    { base: 2.0, step: 2.3 }
    crit_rate: { base: 0.026, step: 0.032 }
    crit_dmg:  { base: 0.052, step: 0.064 }
    break_effect: { base: 0.052, step: 0.064 }
    effect_hit:  { base: 0.034, step: 0.043 }
    effect_res:  { base: 0.034, step: 0.043 }

  # 来源: relic_sets.json
  set_bonuses:
    "103":
      name: "Knight of Purity Palace"
      name_cn: "净庭骑士"
      desc:
        - "Increases DEF by 15%."
        - "Increases the max DMG that can be absorbed by the Shield created by the wearer by 20%."
      2pc: [{ type: "DefenceAddedRatio", value: 0.15 }]
      4pc: [{ type: "shield_bonus", value: 0.20 }]

