# build.yaml — 玩家配装配置（运行时输入）
# 示例：三月七 E6 + 琥珀叠影5 + 4件净庭骑士

build:
  team:
    - character_template: "1001"     # March 7th（引用 data/sim_templates/characters/1001_march_7th.yaml）
      level: 80
      eidolon: 6                     # E6
      skill_levels:
        basic: 1
        skill: 10
        ultimate: 10
        talent: 10

      light_cone_template: "20003"   # Amber（引用 data/sim_templates/light_cones/20003.yaml）
      light_cone:
        level: 80
        superimposition: 5           # 叠影5

      relics:
        # 套装：4pc Knight of Purity Palace (103)
        head:   { set_id: "103", main: "hp",       subs: { def_pct: 3, hp_pct: 1, spd: 0, effect_hit: 0 } }
        hand:   { set_id: "103", main: "atk",      subs: { def_pct: 2, hp_pct: 2, spd: 0, effect_hit: 0 } }
        body:   { set_id: "103", main: "def_pct",  subs: { spd: 2, hp_pct: 1, effect_hit: 1, crit_rate: 0 } }
        feet:   { set_id: "103", main: "spd",      subs: { def_pct: 2, hp_pct: 1, effect_hit: 1, spd: 0 } }
        sphere: { set_id: "103", main: "ice_dmg",  subs: { def_pct: 2, spd: 1, hp_pct: 1, crit_dmg: 0 } }
        rope:   { set_id: "103", main: "def_pct",  subs: { spd: 2, hp_pct: 1, effect_hit: 1, def_pct: 0 } }

  policy:
    name: "march_7th_default"

    action_rules:
      - condition: "skill_points > 0 && ally_without_shield"
        action: "skill"
        priority: 100
        description: "有战技点且队友没护盾时给盾"

      - condition: "energy >= max_energy"
        action: "ultimate"
        priority: 90
        description: "能量满时开大"

      - condition: "true"
        action: "basic"
        priority: 0
        description: "默认普攻"

    target_rules:
      - condition: "action_type == 'skill' && target_hp_ratio < parameters.SHIELD_HP_THRESHOLD"
        selector: "lowest_hp_ally"
        priority: 100

      - condition: "action_type == 'ultimate'"
        selector: "all_enemies"
        priority: 100

      - condition: "true"
        selector: "primary_target"
        priority: 0

    parameters:
      SHIELD_HP_THRESHOLD: 0.8
