# 欢愉命途系统模块（21_elation §21.4 阿哈时刻）——**声明归数据，有序结算序列留引擎原语**。
#
# 注入通道：build_compiler auto-import 按成员有效 path==elation 自动注入（存在即注入——
# 非欢愉队不注入，与引擎旧行为一致；多欢愉角色去重单实例——encounter 级 Python 模块
# 缓存语义），亦可经角色模板/build member `imports: ["paths/elation"]` 显式引用（备用槽）。
#
# 合并语义（00_overview 数据流章）：单位声明并入 CompiledEncounter.system_actors（引擎
# 按标记托管布场——旧 _init_aha 点位）；hooks 并入订阅池且**先于角色钩**（体系先于
# 个体——阿哈发放/结算在角色钩之前的现序保持），owner = 首个系统单位。
module: "paths/elation"

units:
  - actor_id: "aha_instant"
    name: "阿哈时刻"
    actor_type: "aha"
    # 四语义标记（排除语义全数据化——引擎不再按 actor_type 名硬编码；词表唯一源
    # sim_schema/actor.py SYSTEM_UNIT_FLAGS，消费点见该表注）：
    #   untargetable      不可被选目标（目标池/队伍命名空间排除——_allies_alive 单漏斗）
    #   no_wipe           不计全灭（全灭判定排除——同漏斗）
    #   no_aura           不吃光环辐射（光环提供者接收侧豁免 + 同漏斗）
    #   wave_reset_exempt 波次重置豁免（「转面不重跑」——scheduler._wave_reset_exempt 注册）
    flags: ["untargetable", "no_wipe", "no_aura", "wave_reset_exempt"]
    base_stats: {hp: 1}      # 名义 HP（行动条上的结算触发器——不参与伤害管线；布场 current_hp 取本值）
    speed_rule: "aha"        # 具名速度规则（公式 21_elation §21.4；系数归 rulebook
                             # constants.aha_speed_base/aha_speed_weights——引擎零游戏数值）
    turn_handler: "aha_turn" # 具名回合结算原语（engine._run_aha_turn——「解控→共读实时池
                             # →按参演编号序代放→授条目→清池→重算速度」有序序列无 DSL
                             # 原语可表达，v1 留引擎；引擎=提供原语的运行时）

hooks:
  # 进战发放（21_elation §21.3/§8.1）：每欢愉角色 +1 笑点 + 20 好活当赏。
  # 2026-10-12 自引擎 _init_aha_grants 收编为本模块钩（数值经 const() 编译期宏读
  # rulebook constants——体系常量单源，引擎零游戏数值铁律）；before_battle_start
  # 挂载点 = 旧调用点位（初始能量事件之后、on_battle_start 之前——on_resource_gain
  # 照发，获得联动开局引燃：绯英③转化/银狼天赋 MMR/火花 E1 抗穿光环）。
  - event: "before_battle_start"
    effects:
      - effect_type: "gain_resource"
        resource_id: "punchline"
        amount: "const(aha_start_punchline)"
        target: {pool: "allies", where: "path_of($it) == 'elation'"}
      - effect_type: "gain_resource"
        resource_id: "certified_banger"
        amount: "const(aha_start_banger)"
        target: {pool: "allies", where: "path_of($it) == 'elation'"}
