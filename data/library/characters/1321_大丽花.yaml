    apply_modifiers:
      # Wilt（败谢）：敌方全体 DEF -#3（lv10 = 18%，lv15 = 23%），持续 #2 = 4 回合（官方
      # params 全档恒 4——字面值）。def_pct 负值 = DEF 降低区（1507/1306 E2 先例）；
      # 先挂 Wilt 后结算伤害（_apply_action_side_effects 序——本大招自吃减防）；
      # "植入共舞者属性弱点"待收④
      - target: "all_enemies"
        modifier_id: "WILT"
        name: "败谢"
        modifier_type: "debuff"
        duration: 4                   # #2 = 4 回合（全档恒 4，官方 params 照抄）
        dispellable: True
        stat_effects: {"def_pct": "-param(132103, 3)"}   # #3 = lv10 0.18 / lv15 0.23

  - action_id: "132104"
    name: "谁在害怕康士坦丝？"
    action_type: "follow_up"      # 官方 Talent 类攻击 → follow_up 键（无 talent 键——姬子先例）
    level_key: "talent"           # 倍率取档锚（follow_up 缺省回落 ultimate 档——E3 联动会错档，显式钉 talent）
    target_type: "bounce"         # 弹射：引擎逐段随机重选（过堂勘正②——「目标被消灭则
                                  # 对随机单体发动」由段间重选天然覆盖）
    damage_type: "fire"
    instances: 5                  # #2 = 5 段（官方 params 全档恒 5——字面值）
    scaling: [{"atk": 0.15}, {"atk": 0.165}, {"atk": 0.18}, {"atk": 0.195}, {"atk": 0.21},
              {"atk": 0.225}, {"atk": 0.2437}, {"atk": 0.2625}, {"atk": 0.2812}, {"atk": 0.3},
              {"atk": 0.315}, {"atk": 0.33}, {"atk": 0.345}, {"atk": 0.36}, {"atk": 0.375}]
    toughness_dmg: 3              # 米游社：FUA 削韧 3×5【对轴】（逐段各削——action 层逐段通道）
    energy_gain: 2                # 米游社"回能 2" + tbgd 双源一致（行动级一次，非逐段）
    skill_point_cost: 0

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN；星魂名官中（character_ranks.json 核）
eidolons:
  E1:
    name: "当一朵花含苞待放"
    hooks:
      # 天赋 #5 转化倍率全队化：非共舞者队友各挂 param(132104,5)（where 排自身+排当前
      # 共舞者——hook 注册序模板先于星魂，绑定点在册后本钩求值，顺序依赖在案）；
      # 共舞者额外 +40%（按加算 0.6+0.4=1.0——乘算 84% 备档，待实测⑧）；
      # 后半固定削韧待收⑤
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id != '1321' && !has_modifier($it, 'DANCE_PARTNER')"}
            modifier:
              modifier_id: "E1_SB_ALLY"
              name: "当一朵花含苞待放·全队转化"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"super_break_modifier": "param(132104, 5)"}
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_SB_SELF"
              name: "当一朵花含苞待放·共舞者加成"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"super_break_modifier": 0.4}
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id != '1321'", order_by: "-$it.break_effect", take: 1, mode: "deterministic"}
            modifier:
              modifier_id: "E1_SB_PARTNER"
              name: "当一朵花含苞待放·共舞者加成"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"super_break_modifier": 0.4}
  E2:
    name: "新生，鲜灵，爱怜"
    hooks:
      # ① 大丽花在场时敌方全属性抗性 -20%：攻击方 res_pen 等价承载（mechanics 02 RES_PEN
      #    含抗性降低数值等价；敌方抗性削减修饰通道缺——1006 同族在案），光环挂大丽花
      #    effect_scope team（持有者自身同吃—— aura 口径）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_ALL_RES_DOWN"
              name: "新生，鲜灵，爱怜"
              modifier_type: "buff"
              duration: 0
              effect_scope: "team"
              dispellable: False
              stat_effects: {"res_pen": 0.2}
      # ② 敌方入场即陷 Wilt 3 回合：入场 + 换波双轨（on_wave_start 在案事件——勘正⑫）；
      #    与终结技 4 回合 Wilt 同 id refresh 取长（待实测⑧）；仅收 DEF 降低半——植入半待收④
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "WILT"
              name: "败谢"
              modifier_type: "debuff"
              duration: 3
              dispellable: True
              stat_effects: {"def_pct": "-param(132103, 3)"}
      - event: "on_wave_start"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "WILT"
              name: "败谢"
              modifier_type: "debuff"
              duration: 3
              dispellable: True
              stat_effects: {"def_pct": "-param(132103, 3)"}
  E3:
    name: "可惜花瓣薄如蝉翼"
    skill_level_overrides: {"ultimate": 2, "basic": 1}
    notes:
      - "终结技+2 随档段：action scaling 实取 lv12 档 + Wilt DEF down（param(132103,3)）随档；Wilt 回合 #2 恒 4（非随档）"
      - "普攻+1：默认 lv6+1=lv7 在 10 档表内（cap=10 结构性不越界——勘正⑭）"
  E4:
    name: "可惜花蕊为虫剥蚀"
    hooks:
      # 天赋 FUA 伤害次数 +5（5→10）：锚 on_action 132104（trigger_action 自发、insert=True）
      # 追加 5 段随机单体（param(132104,1)×ATK、逐段削韧 3、窗口内超击破同 FUA 口径 200%）；
      # 「施放时使敌方全体受到的伤害 +12%，持续 2 回合」收编（vulnerability——勘正⑥；
      # 惠及面事件序 artifact 待实测⑧）。段数 +5 与行迹 2 计次口径：一次施放 = 一次
      # on_action（追加段不发 on_action）→ 计数 +1，口径自洽
      - event: "on_action"
        condition: "$event.actor == '1321' && $event.action_id == '132104' && $event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "all_enemies"
            modifier:
              modifier_id: "E4_VULN"
              name: "可惜花蕊为虫剥蚀"
              modifier_type: "debuff"
              duration: 2
              dispellable: True
              stat_effects: {"vulnerability": 0.12}
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "_FUA_SB_WINDOW"
              name: "FUA 超击破窗口"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stack_mode: "replace"     # 烘焙重挂语义（窗内重挂重烘——编译闸口径）
              stat_effects: {"super_break_modifier": "param(132104, 3) - param(132104, 5)"}
          - effect_type: "deal_damage"
            name: "谁在害怕康士坦丝？·E4"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "fire"
            amount: "param(132104, 1) * $self.atk"
            toughness_dmg: 3
          - effect_type: "deal_damage"
            name: "谁在害怕康士坦丝？·E4"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "fire"
            amount: "param(132104, 1) * $self.atk"
            toughness_dmg: 3
          - effect_type: "deal_damage"
            name: "谁在害怕康士坦丝？·E4"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "fire"
            amount: "param(132104, 1) * $self.atk"
            toughness_dmg: 3
          - effect_type: "deal_damage"
            name: "谁在害怕康士坦丝？·E4"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "fire"
            amount: "param(132104, 1) * $self.atk"
            toughness_dmg: 3
          - effect_type: "deal_damage"
            name: "谁在害怕康士坦丝？·E4"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "fire"
            amount: "param(132104, 1) * $self.atk"
            toughness_dmg: 3
          - effect_type: "remove_modifier"
            modifier_id: "_FUA_SB_WINDOW"
  E5:
    name: "凋落，腐烂，憎恨"
    skill_level_overrides: {"skill": 2, "talent": 2}
    notes:
      - "战技+2：132102 scaling 实取 lv12 档；结界 WBE（param(132102,3)）与回合数（#2 恒 3）全档恒值，非随档"
      - "天赋+2：132104 FUA 单次倍率（scaling/param(132104,1)）与超击破转化 #3/#5、窗口差值均随档实取 lv12；入战能量 #4 恒 35（非随档）"
  E6:
    name: "然而它总是，致命美丽"
    hooks:
      # ① 共舞者 BE +150%：目标代数与绑定同构（降序取最高 BE——勘正①；绑定/再绑定
      #    一致性由同一表达式保证；断绑重选后 E6 件是否重挂待收②）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id != '1321'", order_by: "-$it.break_effect", take: 1, mode: "deterministic"}
            modifier:
              modifier_id: "E6_PARTNER_BE"
              name: "然而它总是，致命美丽"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"break_effect": 1.5}
      # ② 施放天赋 FUA 时所有【共舞者】下一次行动提前 20%——大丽花自身即共舞者
      #    （天赋文本明载），self + 队友共舞者双件（勘正⑪）；锚 insert 施放（勘正②）
      - event: "on_action"
        condition: "$event.actor == '1321' && $event.action_id == '132104' && $event.insert"
        effects:
          - effect_type: "advance_action"
            target: "self"
            amount: 20
          - effect_type: "advance_action"
            target: {pool: "allies", where: "$it.actor_id != '1321'", order_by: "-$it.break_effect", take: 1, mode: "deterministic"}
            amount: 20

hooks:
  # 共舞者绑定（天赋 #1/#2）：入战与击破特攻最高的队友结为共舞者（1 对 1——DANCE_PARTNER
  # 标记承载，后续触发/星魂共用；order_by 降序勘正①）。大丽花自身恒为共舞者
  # （天赋文本「使自身和另一位…共同成为【共舞者】」）——DANCE_PARTNER_SELF 承载。
  # 两件同挂超击破转化池 param(132104,5)（天赋 #5——勘正③；E1 叠加上加 0.4）。
  # 断绑重选/初始选主/tie-break 待收②
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id != '1321'", order_by: "-$it.break_effect", take: 1, mode: "deterministic"}
        modifier:
          modifier_id: "DANCE_PARTNER"
          name: "共舞者"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"super_break_modifier": "param(132104, 5)"}
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "DANCE_PARTNER_SELF"
          name: "共舞者·自身"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_effects: {"super_break_modifier": "param(132104, 5)"}

  # 天赋 #4：入战恢复 35 能量（gain_energy 词表在案——勘正⑤；params 全档恒 35）
  - event: "on_battle_start"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: "param(132104, 4)"

  # 行迹 1321101 主干·入场：其他角色获得 BE = 大丽花 BE × 24% + 50%（flat），持续 1 回合
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id != '1321'"}
        modifier:
          modifier_id: "FUNERAL_BE_ENTRY"
          name: "又一场葬礼"
          modifier_type: "buff"
          duration: 1
          dispellable: False
          stack_mode: "replace"     # 烘焙重挂语义（编译闸口径——重挂重烘不留旧值）
          stat_effects: {"break_effect": "0.24 * $self.break_effect + 0.5"}   # #1=24%、#3=+50%

  # 行迹 1321101 主干·再触发：大丽花受到队友治疗时效果再触发（持续 #4 = 3 回合）。
  # $event.source 按 heal 事件施放者口径读；护盾分支待收⑦、单回合锁幂等在案
  - event: "on_hp_increase"
    condition: "$event.reason == 'heal' && $event.target == '1321' && $event.source != '1321'"
    effects:
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id != '1321'"}
        modifier:
          modifier_id: "FUNERAL_BE_RETRIGGER"
          name: "又一场葬礼"
          modifier_type: "buff"
          duration: 3
          dispellable: False
          stack_mode: "replace"     # 烘焙重挂语义（再触发重烘 $self.break_effect 现场值）
          stat_effects: {"break_effect": "0.24 * $self.break_effect + 0.5"}

  # 天赋 FUA（132104）触发：敌人受到另一位【共舞者】攻击后发动（每回合最多 1 次——
  # _fua_turns 闩）。载体 = trigger_action（勘正②）：132104 instances 5 弹射逐段随机；
  # 窗口件 _FUA_SB_WINDOW 把转化池从 #5 常态值抬到 #3 FUA 值（挂→trigger→即摘，
  # 时域封闭同步——勘正③；覆盖/加算待实测⑧）。$event.source != '1321' 自排除即递归闩
  #（自身任何伤害段不进本钩）；damage_type != 'true' 防真伤段误入（勘正⑬）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && $event.damage_type != 'true' && actor_type_of($event.target) == 'monster' && $event.source != '1321' && has_modifier($event.source, 'DANCE_PARTNER') && res__fua_turns < 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_fua_turns"
        amount: 1
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "_FUA_SB_WINDOW"
          name: "FUA 超击破窗口"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stack_mode: "replace"     # 烘焙重挂语义（窗内重挂重烘——编译闸口径）
          stat_effects: {"super_break_modifier": "param(132104, 3) - param(132104, 5)"}
      - effect_type: "trigger_action"
        action_id: "132104"
      - effect_type: "remove_modifier"
        modifier_id: "_FUA_SB_WINDOW"

  # FUA 每回合闩归零（回合口径按大丽花回合计——$event.actor 主体；全局 round 口径待实测⑧）
  - event: "on_turn_start"
    condition: "$event.actor == '1321'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_fua_turns"
        amount: 0

  # 行迹 1321102「致哀，故人」：每施放 2 次天赋 FUA 产 1 战技点（params [2] 字面值）。
  # 双钩闩（勘正④——同事件多钩 condition 读事件开始旧值，两钩互斥恰一）；
  # 锚 insert 施放（trigger_action 自发 on_action——勘正②）
  - event: "on_action"
    condition: "$event.actor == '1321' && $event.action_id == '132104' && $event.insert && res__fua_sp_count + 1 >= 2"
    effects:
      - effect_type: "gain_skill_point"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_fua_sp_count"
        amount: 0
  - event: "on_action"
    condition: "$event.actor == '1321' && $event.action_id == '132104' && $event.insert && res__fua_sp_count + 1 < 2"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_fua_sp_count"
        amount: 1

scaling_notes:
  - "普攻（132101）官方 10 档、战技/终结技/天赋（132102/132103/132104）15 档——param()/scaling 取档 index=等级-1；E3 终结技+2（lv12 档）普攻+1（lv7 档，无钳档）、E5 战技/天赋+2（lv12 档）"
  - "战技点口径：普攻 +1 / 战技 -1 / 终结技 0 / FUA 0（米游社标签 + tbgd BPNeed 双源一致）"
  - "回能口径：普攻 20 / 战技 30 / 终结技 5 / FUA 2（米游社 + tbgd 双源一致）；天赋入战 +35 已收（gain_energy）；行迹 3 回能随 ③ 待收"
  - "削韧口径（米游社 sub_tag 单源）：普攻 10 / 战技 10+10×2 / 终结技 20 / FUA 3×5（逐段）"
  - "终结技全体均分已收（split: even——按结算时存活目标均分；削韧逐目标全额不摊）"
  - "结界/Wilt 倒计时：duration 字面值（结界 3 / Wilt 4，官方 params 全档恒值）+ tick_anchor owner_turn_start（结界——大丽花回合开始 -1）；Wilt 默认 owner_turn_end（敌方各自回合末 -1）；重复释放同 id refresh 取长，刷新 vs 并存待实测⑧"
  - "共舞者为 1 对 1 绑定状态：DANCE_PARTNER（队友）+ DANCE_PARTNER_SELF（自身恒在）双修饰符承载；断绑重选/初始选主/tie-break 待收②"
  - "超击破转化池面板口径：常态攻击（普攻/战技/终结技）按 #5=param(132104,5)；FUA 按 #3=param(132104,3)（窗口补差——覆盖口径，加算备档待实测⑧）；E1 队友 0.6、共舞者 1.0"
