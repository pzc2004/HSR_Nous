# 角色模板：大丽花（1321）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging `data/annotator/staging/1321_大丽花.yaml`）+ 过堂勘正
# （staging→fixtures 合并流水线）。官方对照：StarRailRes CN/EN 技能+星魂+行迹全表、
# 管线 calc 白值、米游社五项标签（削韧/回能/SP 对轴全过——draft「米游社无消耗标」
# 不确，战技点 -1/+1 标签在案且与 tbgd 一致，tbgd 仍权威）。
#
# 过堂勘正清单（draft 病 → 正解）：
#  ① order_by 缺降序前缀×3（绑定/E6 BE 件/E6 拉条写 `$it.break_effect`——升序 take 1
#    = 选**最低** BE 队友，与官方「击破特攻最高」相反）→ `-` 前缀降序（幻视族谱 13）；
#  ② FUA 载体静默死件重构：draft 5 段散装 deal_damage + 行迹2/E6 锚
#    `on_action 132104 && !$event.insert`——hook 段**不发 on_action**（hooks.py
#    deal_damage 只发 on_hp_decrease），两钩永不触发；正解 = 132104 补 scaling 全表
#    + instances 5（引擎弹射逐段随机重选天然覆盖「目标被消灭则随机单体」）+ 天赋钩
#    trigger_action（姬子 100304 先例）——trigger_action 自发 on_action 且 **insert=True**
#    （draft `!$event.insert` 方向亦错：插入施放恒 insert）；
#  ③ 超击破转化族「挡因过期」收编（B38 super_break_modifier 池键在案——1310 流萤先例）：
#    天赋 #5 共舞者转化（自身 DANCE_PARTNER_SELF + 队友 DANCE_PARTNER 各挂
#    param(132104,5)）/ FUA #3 200%（转化池=面板单值，FUA 200% 与常态 60% 不可同板
#    并存——窗口件 _FUA_SB_WINDOW +(#3-#5) 挂→trigger/追加段→即摘，时域封闭同步）/
#    E1 转化全队化（where 排共舞者给 0.6，共舞者另 +0.4）；
#  ④ 行迹2 产点收编（gain_skill_point 词表在案——1306 先例；draft「hook 侧战技点授予
#    未见词表」挡因过期）。「每施放 2 次」= 双钩闩：同事件多钩 condition 读事件开始
#    旧值（幻视族谱 9），A 钩 `res+1>=2` 产点清零 / B 钩 `res+1<2` 计数 +1，互斥恰一；
#  ⑤ 天赋入战回能 35 收编（gain_energy 词表在案——1313/1003 先例；draft「无能量授予
#    effect_type」挡因过期）；
#  ⑥ E4 受击易伤 12% 收编（vulnerability 承伤区键在案——1306 SPK_VULN/1222 BEFOG
#    先例；draft「易伤键未见锚例」挡因过期）；
#  ⑦ 终结技「伤害由敌方全体均分」收编（split: "even" action 键在案——1408 先例；
#    draft 按「AoE 各吃全额」近似 + 待收⑦一并摘除）；
#  ⑧ 行迹平铺属性并 base_stats（spd 96→101 / break_effect 0.373 / effect_res 0.18——
#    生成器同口径：平铺节点并白值、pct 类才走 trace_stat_effects；draft 全漏）；
#  ⑨ 秘技结界 duration 0→3（官方「立即开启战技的结界」=战技结界本体，持续/倒计时
#    口径同战技 param(132102,2) 全档恒 3——draft「官方未给持续回合」误读）；
#  ⑩ 星魂名勘正为官中（draft 用官方 EN 名——非幻名但按库规官中入库；E3/E5 占位名
#    「（等级+2…）」同勘为官中：可惜花瓣薄如蝉翼 / 凋落，腐烂，憎恨）；
#  ⑪ E6 拉条补自身半（官方「使所有【共舞者】下一次行动提前」——天赋文本明载大丽花
#    自身即共舞者，非「待实测」：self + 队友共舞者双件）；
#  ⑫ E2 入场 Wilt 补换波轨（on_wave_start 事件在案——「敌方目标入场时」含换波，
#    draft 只有 on_battle_start 单轨）；
#  ⑬ FUA 触发 condition 补 `damage_type != 'true'`（真伤段不入「攻击」域——姬子 E2
#    同闸先例，防未来真伤 hook 队友误入）；
#  ⑭ E3 普攻钳档注勘误：默认 lv6 +1 = lv7 ≤ 10 档表尾，无钳档（cap=10 结构性不越界；
#    draft「越 10 档钳表尾」语境不成立——仅 member skill_levels 手动拉满才钳）。
#
# 收录：普攻/战技（Blast 主+相邻同倍率）/终结技（AoE + split even 均分 + Wilt 减防
#   全体）/天赋 FUA（132104 instances 5 弹射 + 每回合 1 次闩 + trigger_action 通道）
#   /战技结界 Zone（全队弱点击破效率 +50%，tick_anchor owner_turn_start 倒计时）
#   /共舞者绑定（最高 BE 队友 + 自身双件，各挂超击破转化池 param(132104,5)）
#   /行迹1 BE 分享（入场 1 回合 + 受队友治疗再触发 3 回合，$self.break_effect 挂点烘焙）
#   /行迹2 每 2 次 FUA 产 1 战技点 / 天赋入战回 35 能 / 秘技部署战技结界
#   /E1（转化全队化 + 共舞者 +0.4）/ E2（全队抗穿 0.2 光环 + 入场/换波 Wilt 3 回合）
#   /E3/E5 等级族 / E4（FUA 追加 5 段 + 敌方全体易伤 12% 2 回合）
#   /E6（共舞者 BE +150% + FUA 后自身与共舞者各提前 20%）
# 待收（均带挡因）：
#   ① 战技结界「未破韧也转超击破」——_try_super_break 触发闸 was_broken 硬门
#     （engine.py:891），无「未破韧转化」开关；
#   ② 共舞者断绑重选（「每当场上不存在另一位【共舞者】」——无队友死亡/离场事件通道）
#     + 初始绑定「另一位开战的队友」选主规则官方未明（现按重绑同规则最高 BE 近似；
#     同 BE tie-break 按 order_by 全序纪律池序决胜，待实测）+ 重选后 E1/E6 件重挂联动；
#   ③ 行迹3 全件（weakness_implant 事件通道缺——SPD+30% 2 回合/固定 20 火削韧/回能
#     10%（上限 65）三件套同挂「我方为敌方添加弱点」事件；数值在案 params [0.5,0.1,0.3,2,20]）；
#   ④ 终结技败谢「添加所有【共舞者】属性弱点」（植入通道缺——1006 银狼同族在案；
#     「所有共舞者属性」动态集合另需属性枚举通道）；
#   ⑤ E1 后半固定削韧（=目标韧性上限 25%、下限 10 上限 300、逐目标仅 1 次、致死重置——
#     无伤害纯削韧 effect 缺 + 逐目标计数/致死重置追踪通道缺）；
#   ⑥ 秘技「开战削韧转 60% 超击破」（开战削韧源未建模——132106 入场攻击占位条目不产出
#     actions，同族）；秘技探索态领域（20 秒不主动攻击/全队仅 1 领域共存——探索态无通道）；
#   ⑦ 行迹1 护盾分支（on_shield_received 事件通道缺；「队友护盾」认定口径待实测）；
#     「单个回合内不可重复触发」锁语义幂等（再触发=同值刷新 3 回合——不建模数值等价，
#     在案不建）；
#   ⑧ 数值口径待实测：FUA #3 200% 对 #5 60% 是覆盖还是加算（现按覆盖——窗口补 #3-#5
#     差值；若实测加算 260% 改窗值为 #3 全值）/ E1「倍率额外提高 40%」按加算 100%（乘算
#     84% 备档）/ E1 +0.4 是否惠及 FUA 转化（现按惠及——窗口期池 = #3+0.4；若官方口径
#     E1 只加 #5 共舞者转化，窗口差值须改 #3-(#5+0.4)）/ FUA 每回合闩按大丽花回合计（全局 round 口径备档）/ 结界·Wilt 重复释放
#     刷新 vs 并存（现同 id refresh 取长）/ E4 易伤惠及面（事件序 artifact：E4 追加 5 段
#     吃得到易伤，action 本体先发的 5 段吃不到——在案）。
# 数值：照官方 params 全表逐行照抄；action 倍率全表照抄，hook/modifier 侧系数走
#   skill_params + param() 编译期引用（05_effects §5.1）；行迹/秘技无等级轨道用字面值。
