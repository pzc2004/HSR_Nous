techniques:
  - technique_id: "800407"
    name: "守护者召令"
    point_cost: 1
    effects:                                # 进战一次性（战前装填预置；施放者=自身）
      - effect_type: "apply_modifier"       # 开战获得护盾 = 30% DEF + 384，持续 1 回合（官方 params [[0.3, 384, 1]] 单档字面值）
        target: "self"
        modifier:
          modifier_id: "TB_FIRE_TECH_SHIELD"
          name: "守护者召令"
          modifier_type: "buff"
          duration: 1
          dispellable: True       # 保守默认（全库盾件先例），驱散待实测
          shield:
            scaling: {def_: 0.3}
            flat: 384

actions:
  - action_id: "800401"
    name: "穿彻坚冰的烈芒"
    action_type: "basic"
    target_type: "single"
    damage_type: "fire"
    available_if: "res_magma_will < 4 && res__eb_free < 1"   # 换技能互斥半（03_actor §3.8.1）：
                                                              # ≥4 层或终结技免费闩置位时普攻替换为 800408
                                                              # （res_ 平铺=res_+rid 单下划线——draft 双下划线误拼勘正⑫）
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    # lv6（index=5）= 100% ATK；E5 普攻+1 官方 cap 10（编译器 basic cap 10 即官方语义）
    toughness_dmg: 10      # [mys] 削韧 10 + [fandom] 同值（draft 误判矛盾勘正——见头注④）
    skill_point_gain: 1    # [tbgd] sp_gain=1（[mys] 战技点 +1 同值）
    energy_gain: 20        # [tbgd] SPBase=20（[mys]+[fandom] 同值）
    resource_gain: {magma_will: 1}   # 官方「并叠加1层【灼热意志】」（action 层副作用通道——勘正⑪）

  - action_id: "800408"
    name: "穿彻坚冰的烈芒"
    action_type: "basic"
    target_type: "blast"
    damage_type: "fire"
    available_if: "res_magma_will >= 4 || res__eb_free >= 1"   # ≥4 层解锁 / 终结技免费强化（互斥另一半）
    scaling: [{"atk": 0.9}, {"atk": 0.99}, {"atk": 1.08}, {"atk": 1.17}, {"atk": 1.26},
              {"atk": 1.35}, {"atk": 1.4625}, {"atk": 1.575}, {"atk": 1.6875}, {"atk": 1.8}]
    scaling_blast: [{"atk": 0.36}, {"atk": 0.396}, {"atk": 0.432}, {"atk": 0.468}, {"atk": 0.504},
                    {"atk": 0.54}, {"atk": 0.585}, {"atk": 0.63}, {"atk": 0.675}, {"atk": 0.72}]
    # lv6（index=5）= 主目标 135% ATK + 相邻 54% ATK（[官方] "adjacent"=敌方队列相邻位）
    toughness_dmg: 20         # [mys] 主目标 20（[fandom] "20 (Main)" 同值）
    toughness_dmg_blast: 10   # [mys] 相邻各 10（[fandom] "10 (Adjacent)" 同值；姬子先例键位）
    skill_point_gain: 1       # [tbgd]/[mys] 与普通普攻一致产 1 点
    energy_gain: 30           # [tbgd] SPBase=30（[mys]+[fandom] 同值——高于普通普攻）

  - action_id: "800402"
    name: "炽燃不灭的琥珀"
    action_type: "skill"
    target_type: "self"      # 自体增益 + 敌方全体嘲讽（无我方点名）
    damage_type: "none"      # 纯防御技无伤害段（勘正⑩——花火 1130602 先例）
    skill_point_cost: 1      # [tbgd] sp_cost=1（[mys] 明标「战技点 -1」——draft 误判漏标勘正）
    energy_gain: 30          # [tbgd] SPBase=30（[mys]+[fandom] 同值）
    resource_gain: {magma_will: 1}   # 官方「并叠加1层【灼热意志】」
    apply_modifiers:
      # 自体减伤 param(800402,1)（lv10=50%）——dmg_dmg_reduction 键在库（勘正③）；
      # 时长官方无文本 → 社区 KQM "single turn" → duration 1 + owner_turn_start 锚
      #（action 层 apply_modifiers 为平铺 modifier 声明 + target 键，词表二值 self/all_enemies）
      - target: "self"
        modifier_id: "TB_FIRE_SKILL_DR"
        name: "炽燃不灭的琥珀"
        modifier_type: "buff"
        duration: 1
        tick_anchor: "owner_turn_start"   # 覆盖敌方行动相（1107 克拉拉 E4 同锚先例）
        dispellable: True                 # 保守默认，驱散待实测
        stat_effects: {"dmg_dmg_reduction": "param(800402, 1)"}
      # 嘲讽敌方全体 1 回合（#2=100% 基础概率确定性挂载、#3=1 回合）——forced_taunt
      # 键在库（勘正②——state.py:105「如火主战技」设计原型即本机制）
      - target: "all_enemies"
        modifier_id: "TB_FIRE_TAUNT"
        name: "嘲讽"
        modifier_type: "debuff"
        duration: 1
        dispellable: True                 # 保守默认，驱散待实测
        forced_taunt: True

  - action_id: "800403"
    name: "陷阵无回的炎枪"
    action_type: "ultimate"
    target_type: "aoe"
    damage_type: "fire"
    energy_cost: 120         # 官方 max_sp=120（tbgd SPNeed 对轴）
    scaling: [{"atk": 0.5, "def": 0.75}, {"atk": 0.55, "def": 0.825},
              {"atk": 0.6, "def": 0.9}, {"atk": 0.65, "def": 0.975},
              {"atk": 0.7, "def": 1.05}, {"atk": 0.75, "def": 1.125},
              {"atk": 0.8125, "def": 1.2188}, {"atk": 0.875, "def": 1.3125},
              {"atk": 0.9375, "def": 1.4062}, {"atk": 1.0, "def": 1.5},
              {"atk": 1.05, "def": 1.575}, {"atk": 1.1, "def": 1.65},
              {"atk": 1.15, "def": 1.725}, {"atk": 1.2, "def": 1.8},
              {"atk": 1.25, "def": 1.875}]
    # lv10（index=9）= 100% ATK + 150% DEF；E5 终结技+2 lv12（index=11）= 110% ATK + 165% DEF
    toughness_dmg: 20        # [mys] 削韧 20（群攻=每目标各 20——姬子 100303 先例；[fandom] 同值）
    skill_point_cost: 0      # [tbgd] 不耗不产
    energy_gain: 5           # [tbgd] SPBase=5（[mys]+[fandom] 同值——开大返还 5）

hooks:
  # 天赋 800404·受击叠层：每次被击 +1 层灼热意志（上限 8，custom_resources max 钳制承载）；
  # after_being_hit 逐段发射——多段攻击「1 次攻击 N 段」叠 N 层口径待实测（头注待收⑤）
  - event: "after_being_hit"
    condition: "$event.target == '8004'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "magma_will"
        amount: 1

  # 天赋 800404·全队护盾：使用普攻/战技/终结技时为全体队友（含自身）套盾
  # = param(800404,1) DEF + param(800404,4)（lv10: 6% DEF + 80），持续 2 回合（#2 全档恒 2）
  # ——shield 槽 param() 随档收编（勘正⑦）；叠盾语义未表态 → 不声明 accumulate（待收①）
  - event: "on_action"
    condition: "$event.actor == '8004' && ($event.action_id == '800401' || $event.action_id == '800408' || $event.action_id == '800402' || $event.action_id == '800403')"
    effects:
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "TB_FIRE_TALENT_SHIELD"
          name: "筑城者遗宝"
          modifier_type: "buff"
          duration: 2
          dispellable: True       # 保守默认，驱散待实测
          shield:
            scaling: {def_: "param(800404, 1)"}   # lv10 = 0.06；E3 天赋+2 随档 lv12 = 0.064
            flat: "param(800404, 4)"              # lv10 = 80；lv12 = 89

  # 大行迹 8004101「强援弱」：施放战技后全队减伤 15%、1 回合（params #2/#3 单档字面值）
  # ——dmg_dmg_reduction 键在库（勘正③）；owner_turn_start 锚覆盖敌方行动相
  - event: "on_action"
    condition: "$event.actor == '8004' && $event.action_id == '800402'"
    effects:
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "TB_A2_TEAM_DR"
          name: "强援弱"
          modifier_type: "buff"
          duration: 1
          tick_anchor: "owner_turn_start"
          dispellable: True
          stat_effects: {"dmg_dmg_reduction": 0.15}

  # 强化普攻 800408·消耗 4 层（终结技免费强化时不耗层，改清 _eb_free 闩）
  - event: "on_action"
    condition: "$event.actor == '8004' && $event.action_id == '800408' && res__eb_free < 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "magma_will"
        amount: -4           # 消耗 4 层（[官方]；统一入口 clamp [0, max]）
  - event: "on_action"
    condition: "$event.actor == '8004' && $event.action_id == '800408' && res__eb_free >= 1"
    effects:
      - effect_type: "set_resource"
        resource_id: "_eb_free"
        amount: 0            # 免费强化已兑现（[官方] "下一次普攻"=一次性）

  # 大行迹 8004102「无畏」：使用强化普攻时回复自身 5% Max HP（[官方 params_max [0.05]]）
  - event: "on_action"
    condition: "$event.actor == '8004' && $event.action_id == '800408'"
    effects:
      - effect_type: "heal"
        target: "self"
        ratio: 0.05          # hp_scaling 槽（施放者=受疗者=自身；吃 heal_bonus 口径）

  # 终结技 800403·后效：下一次普攻自动强化且不消耗灼热意志 → 挂 _eb_free 闩
  # （能否跨回合/跨波次存续、与 ≥4 层强化的优先级 → 待收③）
  - event: "on_action"
    condition: "$event.actor == '8004' && $event.action_id == '800403'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_eb_free"
        amount: 1

  # 大行迹 8004103「行胜思」：回合开始时若自身处于护盾保护下（[官方] 未限定来源=全源
  # ——现按自产两 modifier id 命中域近似，待收④）→ ATK +15% 并回复 5 能量，
  # 持续至本次行动结束
  - event: "on_turn_start"
    condition: "$event.actor == '8004' && has_modifier($self, 'TB_FIRE_TALENT_SHIELD') + has_modifier($self, 'TB_FIRE_TECH_SHIELD') >= 1"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TB_A6_ATK"
          name: "行胜思"
          modifier_type: "buff"
          duration: 1
          tick_anchor: "owner_turn_end"   # "until the action is over"（行动结束即失效）
          dispellable: False
          stat_effects: {"atk_pct": 0.15}
      - effect_type: "gain_energy"        # 回复 5 能量（[官方 params_max [5, 0.15]] #1）
        target: "self"
        amount: 5

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN；名字经 character_ranks.json 核
eidolons:
  E1:
    name: "大地芯髓的鸣动"   # draft「地动山摇」幻名勘正（勘正①）
    hooks:
      # EN 语义裁定：'uses their Basic ATK' / 'uses their enhanced Basic ATK' → 触发域仅普攻
      # （不含战技/终结技——EN 层解 CN 歧义）。category "additional"=附加伤害（勘正⑥；
      # KQM "Fire Additional DMG" 同证）；$self.def_ 白名单键（draft $self.def 勘正）
      - event: "on_action"
        condition: "$event.actor == '8004' && $event.action_id == '800401'"
        effects:
          - effect_type: "deal_damage"
            name: "大地芯髓的鸣动"
            target: "$event.target"
            damage_type: "fire"
            category: "additional"
            amount: "0.25 * $self.def_"
      - event: "on_action"
        condition: "$event.actor == '8004' && $event.action_id == '800408'"
        effects:
          - effect_type: "deal_damage"
            name: "大地芯髓的鸣动·强化"
            target: "$event.target"
            damage_type: "fire"
            category: "additional"
            amount: "0.5 * $self.def_"
    notes:
      - "强化普攻追加段作用于主目标还是含相邻 → 官方未写明，按主目标（$event.target）建模，待实测"
  E2:
    name: "古老寒铁的坚守"   # draft「不屈毅力」幻名勘正
    hooks:
      # 天赋护盾额外抵消 2% DEF + 27（[官方]「额外抵消」——eidolon 文本无等级轨道，字面值）；
      # 护盾合并语义无文本 → 独立第二盾层建模（同触发同 duration；独立分层 vs 同池加算
      # 等效 8% DEF+107 待实测——待收①）
      - event: "on_action"
        condition: "$event.actor == '8004' && ($event.action_id == '800401' || $event.action_id == '800408' || $event.action_id == '800402' || $event.action_id == '800403')"
        effects:
          - effect_type: "apply_modifier"
            target: "all_allies"
            modifier:
              modifier_id: "TB_E2_SHIELD"
              name: "古老寒铁的坚守"
              modifier_type: "buff"
              duration: 2
              dispellable: True
              shield:
                scaling: {def_: 0.02}
                flat: 27
  E3:
    name: "砌造未来的蓝图"   # draft「蓝图」幻名勘正
    skill_level_overrides: {"skill": 2, "talent": 2}   # 战技+2、天赋+2（上限 lv15）
    notes:
      - "随档段全走 param() 自动升档：天赋护盾 param(800404,1/4)（lv12=6.4% DEF+89）；战技自体减伤 param(800402,1)（lv12=51%）"
  E4:
    name: "驻留文明的誓言"   # draft「建国之誓」幻名勘正
    hooks:
      # 战斗开始立即获得 4 层灼热意志 → 首回合即可强化普攻（[官方]）
      - event: "on_battle_start"
        effects:
          - effect_type: "gain_resource"
            resource_id: "magma_will"
            amount: 4
  E5:
    name: "点燃光焰的勇气"   # draft「暖魂之火」幻名勘正
    skill_level_overrides: {"ultimate": 2, "basic": 1}   # 终结技+2、普攻+1
    notes:
      - "终结技+2：scaling 实取 lv12 档（110% ATK + 165% DEF）"
      - "普攻+1：官方文本自带「最多不超过10级」——编译器 basic cap 10 即官方语义（勘正⑧），非数据缺口"
  E6:
    name: "永屹城垣的壁垒"   # draft「城垣重铸」幻名勘正
    hooks:
      # 使用强化普攻或终结技后 DEF +10%，最多叠 3 层（[官方] "stacks up to 3"）；
      # 持续时间官方未写明 → 按整场常驻（duration 0）建模（待收⑥）。
      # 计数层+烘焙值双件（1407 荒芜先例）：同钩序读现场新值——先叠计数层、
      # 再按新层数烘焙 def_pct（同一次触发即吃当层）；def_pct 白值口径（_PCT_BASE 通道）
      - event: "on_action"
        condition: "$event.actor == '8004' && ($event.action_id == '800408' || $event.action_id == '800403')"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "TB_E6_STACKS"
              name: "永屹城垣的壁垒·计数"
              modifier_type: "buff"
              stacks: 1
              max_stack: 3
              stack_mode: "refresh"
              duration: 0
              dispellable: False
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "TB_E6_DEF"
              name: "永屹城垣的壁垒"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              stat_effects:
                def_pct: "0.1 * min(stacks($self, 'TB_E6_STACKS'), 3)"

scaling_notes:
  - "换技能硬闸（800401 ↔ 800408）：available_if 互斥声明（03_actor §3.8.1）——≥4 层灼热意志或 _eb_free 闩置位时普攻替换为强化版；纯合法性替换非形态机（1014 Saber/1109 虎克同构）"
  - "削韧/回能/战技点三项仲裁收官：mys（五项权威）+ fandom + tbgd 三方一致——draft「fandom 空/mys 矛盾」双误判勘正（头注④⑦）；800402 无削韧标签=不削（防御技）"
  - "受击回能：被击获得的能量值属全局规则，数据未下发 → 待收②（天赋只写叠层不写回能）"
  - "减伤堆叠：引擎 dmg_reduction 桶乘算折叠 1-∏(1-x_i)（rulebook zones.dmg_red_multi 注释口径，1107 克拉拉过堂实证）——战技 50%×A2 15% → 合计 57.5% 在案"
  - "E6 烘焙时机：同钩先叠计数层后烘焙 → 当次触发即吃当层（幻视族谱 #9 同钩序读现场新值）；DEF 涨 → 后续盾量（def 系）正反馈在案（套盾读挂点面板）"
