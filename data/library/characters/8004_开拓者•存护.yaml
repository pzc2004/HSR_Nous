# 角色模板：开拓者•存护（8004，Fire / Preservation 火主）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
# 命名消歧：开拓者按命途写——8004=存护（火），≠8001 毁灭 / 8005 同谐 / 8007 记忆
# / 8009 欢愉；米游社开拓者笔记角色名即「开拓者•存护」。
#
# 过堂收编/勘正十二件：
#   ① 星魂幻名六连勘正——draft 地动山摇/不屈毅力/蓝图/建国之誓/暖魂之火/城垣重铸
#     全系编造；官方（character_ranks.json 核）：E1 大地芯髓的鸣动 / E2 古老寒铁的
#     坚守 / E3 砌造未来的蓝图 / E4 驻留文明的誓言 / E5 点燃光焰的勇气 /
#     E6 永屹城垣的壁垒。
#   ② 战技嘲讽收编——forced_taunt 键在库（state.py:105 注释「挂敌方，如火主战技」
#     =本机制即设计原型；engine._pick_ally_target 覆盖层消费端 + 波提欧 1315 先例），
#     draft 误判「控制通道未登记」。#2=100% 基础概率 → 确定性挂载（不掷，KQM：
#     Taunt bypasses Control Effect RES）。
#   ③ 减伤双件收编——dmg_dmg_reduction 键在库（pipeline dmg_red_multi 读目标
#     dmg_bonus["dmg_reduction"]，乘算折叠 1-∏(1-x_i)，1107 克拉拉先例）：战技自体
#     param(800402,1)（lv10=50%）+ 大行迹 8004101 全队 15%/1 回合；draft 误判
#     「减伤通道键未登记」。时长：8004101 官方 #3=1 回合；战技自体官方无时长文本，
#     社区（KQM Fire TB guide）"only for a single turn" → duration 1 +
#     owner_turn_start 锚（覆盖敌方行动相——克拉拉 E4 同锚先例）。
#   ④ 削韧全档收编——draft 误判 mys「20+10*2」与单攻矛盾：mys 两条普攻标签分属
#     单攻 800401（削韧 10）/ 扩散 800408（主 20+相邻 10×2），与官方类型自洽；
#     fandom 8004 条（draft 称"对轴列为空"）实有同值——mys/fandom/tbgd 三方一致：
#     800401=10 / 800408 主 20 + toughness_dmg_blast 10 / 800403 全体各 20
#     （姬子 100303 AoE 先例）；800402 无削韧标签=不削。
#   ⑤ 行迹属性节点收编 trace_stat_effects——draft 留空无注；官方 skill_trees 实值
#     DEF%+35 / ATK%+18 / HP%+10（8004201-8004210 逐节点核）→ def_pct 0.35 /
#     atk_pct 0.18 / hp_pct 0.10（1002 丹恒先例）。
#   ⑥ E1 `$self.def`→`$self.def_`——_SELF_NS_FIELDS 白名单只收 def_（bare def
#     编译期 $self 字段闸即炸）；并补 category: "additional"（官方 EN/KQM=Fire
#     Additional DMG 附加伤害，缺省 follow_up 错挂追加攻击身份——素裳/真理先例）。
#   ⑦ 天赋护盾接 param() 随档（B27 #6 shield 槽已收——杰帕德 110403/砂金 130402
#     先例）：scaling/flat 接 param(800404,1/4)，E3 天赋+2 随档自动生效
#     （lv12=6.4% DEF+89）；draft 写死 lv10 字面值。800402 SP 耗点出处勘正：
#     mys 明标「战技点 -1」非漏标（draft 误判），与 tbgd 一致。
#   ⑧ E5 普攻+1 误读勘正——官方文本自带「最多不超过10级」：编译器 basic cap 10
#     即官方语义（build_compiler._effective_skill_levels），非数据缺口
#     （draft 待收⑤撤销）。
#   ⑨ 资源显示名勘正：岩浆涌动→【灼热意志】（官方 CN 文本；id magma_will 保留
#     内部 canonical）；模板名 {NICKNAME}→开拓者•存护（命名消歧纪律）。
#   ⑩ modifier_type "shield"→"buff"（全库盾件先例——shield 块承载盾语义，
#     modifier_type 无 shield 枚举惯例）；800402 damage_type fire→"none"
#     （纯防御技无伤害段——花火 1130602 先例）。
#   ⑪ 叠层通道压缩——普攻/战技 +1 层灼热意志由双 hook 改 action 层
#     resource_gain（1408 白厄 fire_seed 先例；副作用统一通道）。
#   ⑫ available_if res_ 平铺误拼勘正——draft 写 res__magma_will（双下划线）；
#     平铺键 = res_+rid 单下划线拼接（res_magma_will），误拼 NameError 被引擎
#     「available_if 求值失败按不可用」吞 = 互斥双半全锁死（e2e 换技能链钓出）。
#
# 收录：普攻 800401（lv6=100% ATK + 1 层灼热意志；available_if 与 800408 互斥——
#       换技能硬闸 03_actor §3.8.1）/ 强化普攻 800408（≥4 层解锁，lv6 主 135%+
#       相邻 54%，耗 4 层；终结技免费强化 _eb_free 闩）/ 战技 800402（+1 层 +
#       自体减伤 50%（lv10）+ 嘲讽敌方全体 1 回合）/ 终结技 800403（AoE 100% ATK
#       +150% DEF（lv10），返 5 能，放后挂免费闩）/ 天赋 800404（受击叠层上限 8；
#       任意动作全队套盾 param 随档 lv10=6% DEF+80、2 回合）/ 秘技 800407（开战
#       自盾 30% DEF+384、1 回合）/ A2 8004101（战技后全队减伤 15%、1 回合）/
#       A4 8004102（强化普攻回血 5% Max HP）/ A6 8004103（有盾回合开始 ATK+15%
#       +回能 5，至本次行动结束）/ E1（普攻/强化普攻附加 25%/50% DEF 火伤——
#       EN "uses their Basic ATK" 仅普攻域）/ E2（天赋盾额外 +2% DEF+27 第二层）/
#       E3（战技+2 天赋+2）/ E4（开战 4 层）/ E5（终结技+2、普攻+1 cap10）/
#       E6（强化普攻/终结技后 DEF+10% 叠 3——计数层+烘焙值双件，1407 荒芜先例）
# 待收（均带挡因）：① 护盾叠盾/刷新细则（同池 accumulate/取最大——官方未表态；
#       引擎现状「同 modifier 重复施加=整换」与社区 KQM "Shields do not stack"
#       同向；E2 独立第二盾层 vs 同池合并的差值待实测）② 被击回能（受击回能属
#       全局规则，数据未下发——天赋只写叠层不写回能）③ 免费强化跨回合/跨波次
#       存续 + 与 ≥4 层强化的优先级（_eb_free 一次性闩口径在案）④ A6「护盾保护」
#       来源全域（官方未限定来源=全源——现按自产两 modifier id 命中域近似；
#       「持有任意护盾」谓词通道缺=引擎缺口）⑤ 多段攻击受击叠层口径
#       （after_being_hit 逐段发射——官方「每受到1次攻击」段/次歧义待实测）
#       ⑥ E6 持续官方未写明（无 "for X turns"）→ duration 0 常驻假设（波次/
#       战斗重置待实测）⑦ 站位：官方/wiki/社区均无——待实测（不脑补）
# 数值：actions scaling 照官方 params 全表照抄；hook/modifier 侧系数一律
#       param() 随档（行迹/秘技无等级轨道维持字面值）
