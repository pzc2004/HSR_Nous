# 角色模板：银枝（1302）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
# 银枝不在 3.x 加强名单（1004/1005/1006/1102/1205/1212/1217/1306/1307/1310），
# 星魂单轨无新旧版问题。
#
# 过堂勘正十件：① 星魂幻名 ×6 全灭——draft 六魂名全编（美的无瑕缺口/谦恭如玉/
#   荣誉的荆途/号角的献身/自苍穹某处降下的雪/「你」的辉光），character_ranks.json
#   官方名核正：审美王国的缺口/玛瑙石的谦卑/荆棘路的荣光/号角的奉献/宇宙某处的雪/
#   「你」的光芒；② 行迹 stat 节点漏收——draft 称「无暴击/速度/增伤节点披露」，
#   character_skill_trees.json 实有 10 节点（攻击%×5=0.28 / 物理增伤×3=0.144 /
#   生命%×2=0.10），trace_stat_effects 回填；③ 天赋暴击率/E1 暴伤烘焙死件——
#   draft E1 开战一次烘焙（res=0 → 恒 0=静默死件）、天赋 buff 只在 3 个 on_action
#   钩重烘（虔诚/E4 加层后 stale）——幻视族谱 #10：层数在持有者账上需现场追踪，
#   一律 stat_exprs 条件光环（挂一次、面板读取即重估）；④ 终极技削韧虚报空缺——
#   draft 称「fandom/米游社均空缺，0 占位」，三源实有一致值：fandom「20 (AoE) /
#   5 (Per Bounce)」、米游社「削韧 20 / 20+5*6」、tbgd stance [0,60]/[15,60]（÷3）
#   ——130203=20、130214=20+弹射 5×6 全收；⑤ E6 def_ignore 死键摘除——def_pen 是
#   攻击方**全局槽**（写=静默偏离成全伤害无视防御），「施放终结技时」技域限定通道
#   缺（scoped_boost 只服务 dmg_*/all_dmg/res_pen/vulnerability 三区，def 区不读
#   hit_condition 件；on_ultimate 广播在伤害结算后挂点过晚）——记待收，1015 Archer
#   战技/1310 流萤/1212 霜魄/1004 E6 同案；⑥ 天赋上限字面 10 → param(130204,3)
#   随档（与 E3 联动口径统一；全档恒 10 数值不变）；⑦ E5 注释「普攻 lv8」→ lv7
#   （默认普攻 6 级 +1）；⑧ 大行迹注释英文名 → 官方中文名（虔诚/慷慨/勇气）；
#   ⑨ 弹射段补 action_type: "ultimate"（终结技子击身份——1220 飞霄先例槽）+
#   toughness_dmg: 5；⑩ 资源显示名「自我崇高」→ 官方【升格】；普攻/战技削韧
#   数据源注改 tbgd 权威（非「米游社兜底」）。
# 收录：双阈值终极技（max_energy=180；130203 耗 90 / 130214 耗 180，内建
#       energy_cost 阈值通道）/ 天赋 130204 升格叠层（每命中一敌回能 #1=3 + 1 层，
#       每层暴击率 #2，上限 #3=10——自定义资源计数 + stat_exprs 现场门控）/
#       大行迹 1302101 虔诚（回合开始 +1 层）/ 1302102 慷慨（敌入战 +2 能量）/
#       1302103 勇气（对 HP≤50% 敌增伤 15%——before_take_damage waterfall
#       modify_amount 乘法改写承载）/ 秘技 130207（入战全体 80% ATK 物理伤 +
#       自回能 15）/ 星魂 E1（每层暴伤 +4%，stat_exprs 同池门控）/ E2（终结技时
#       敌≥3 → 攻击 +40% 1 回合）/ E3/E5 等级族 / E4（开战 +2 层 + 上限 10→12，
#       E4_CAP_UP 标记进表达式动态门控）
# 待收（均带挡因）：① E6 施放终结技时无视 30% 防御——技域限定 def_pen 通道缺
#       （勘正⑤挡因）；数值 0.3 在案 ② 130214 弹射间暴击爬坡与随机落点分布
#       （官方「每命中一个」per-hit 读法已顺次承载：主段按存活敌数、弹射逐段
#       先伤害后 +1 层/+3 能——in-game 实测终审）③ 秘技 Daze 10 秒（#1）大世界
#       控制语义——pre-battle 控制通道
#       缺 ④ 升格跨波次保留/衰减无官方文本——现按 battle-long 待实测 ⑤ 慷慨
#       触发边界（首波 setup 不自发 actor_enter/召唤物逐个）——现按每入场事件
#       +2 承载，待实测 ⑥ 勇气增伤乘区归属（独立/通用 additive）待实测——现
#       modify_amount 乘法改写承载 ⑦ hook 伤害不过 before_take_damage waterfall
#       ——弹射/秘技段不吃勇气增伤（引擎缺口，报告单列）⑧ E2 buff 是否作用于
#       当次终结技——引擎序=不作用（on_ultimate 在伤害结算后），与「放完后生效」
#       读法一致，待实测 ⑨ 双终极技 auto 模式 AI 选择逻辑（≥90<180 放哪段）
#       待实测 ⑩ 秘技入战伤害削韧值空缺（fandom/米游社/tbgd 均无——保守 0）
# 数值：照官方 params 全表逐行照抄；action 倍率全表照抄，hook/modifier 侧系数走
#       skill_params + param() 编译期引用（05_effects §5.1）；行迹/秘技无等级轨道
#       一律字面值
