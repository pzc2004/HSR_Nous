# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN；官方名照 character_ranks.json
eidolons:
  E1:
    name: "审美王国的缺口"
    hooks:
      # 每层升格额外 +4% 暴击伤害（与天赋同池层数、同池上限门控——E4 提上限后
      # E1 同吃 12 层）。stat_exprs 现场求值（层数在持有者账上变动，烘焙=stale/死件
      # ——幻视族谱 #10；挂一次面板读取即重估，04_modifier §4.16）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_APOTHEOSIS_CRIT_DMG"
              name: "审美王国的缺口"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_exprs:
                crit_dmg: "0.04 * min(res_apotheosis, param(130204, 3) + 2 * has_modifier($self, 'E4_CAP_UP'))"
  E2:
    name: "玛瑙石的谦卑"
    hooks:
      # 施放终结技时场上敌人 ≥3 → 攻击力 +40%（字面值），持续 1 回合。
      # 判定时点 = 施放时场地上敌人数（enemies_alive()）；召唤物是否计数 → 待实测。
      # 引擎 on_ultimate 广播在伤害结算后 → buff 不作用于当次终结技（与「放完后生效」
      # 读法一致，待实测在案）
      - event: "on_ultimate"
        condition: "$event.source == '1302' && enemies_alive() >= 3"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_ATK_UP"
              name: "玛瑙石的谦卑"
              modifier_type: "buff"
              duration: 1
              dispellable: False
              stat_effects: {"atk_pct": 0.4}
  E3:
    name: "荆棘路的荣光"
    skill_level_overrides: {"skill": 2, "talent": 2}    # 战技 +2、天赋 +2（上限 Lv.15）
    notes:
      - "战技 +2 随档段：130202 scaling 实取 lv12 档；天赋 +2 随档段：回能/暴击率/上限（param(130204,1/2/3) 实取 lv12=[3,0.028,10]）"
  E4:
    name: "号角的奉献"
    hooks:
      # 战斗开始获得 2 层升格；天赋层数上限 +2（10→12）——上限门控以 E4_CAP_UP
      # 标记进 stat_exprs 表达式（动态 cap 通道无先例，min(..., #3 + 2×标记) 承载）
      - event: "on_battle_start"
        effects:
          - effect_type: "gain_resource"
            resource_id: "apotheosis"
            amount: 2
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_CAP_UP"
              name: "号角的奉献"
              modifier_type: "buff"
              duration: 0
              dispellable: False
  E5:
    name: "宇宙某处的雪"
    skill_level_overrides: {"ultimate": 2, "basic": 1}  # 终结技 +2、普攻 +1
    notes:
      - "终结技 +2 随档段：130203/130214 scaling 均实取 lv12 档；130214 弹射倍率/次数走 param(130214,2/3) 随档；普攻 +1 实取 lv7 档（默认 6 级 +1）"
  E6:
    name: "「你」的光芒"
    notes:
      - "施放终结技时无视敌方目标 30% 防御——待收：def_pen 是攻击方全局槽（写=静默偏离成全伤害无视防御），技域限定通道缺（scoped_boost 只服务 dmg_*/all_dmg/res_pen/vulnerability 三区，def 区不读 hit_condition 件；on_ultimate 广播在伤害结算后挂点过晚）——1015 Archer 战技/1310 流萤/1212 霜魄/1004 E6 同案；数值 0.3 在案"
      - "两段分别结算是否均吃 30% 无视防御（含弹射段）→ 待实测确认无例外"

hooks:
  # —— 天赋暴击率 buff 挂点：stat_exprs 条件光环（层数在持有者账上经 5 个事件源变动
  # ——3 个命中钩 + 虔诚 + E4——烘焙重挂必然 stale，幻视族谱 #10；面板读取即重估）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "APOTHEOSIS_CRIT_RATE"
          name: "崇高的客体"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            crit_rate: "param(130204, 2) * min(res_apotheosis, param(130204, 3) + 2 * has_modifier($self, 'E4_CAP_UP'))"

  # —— 天赋 130204 崇高的客体：使用普攻/战技/终极技时每命中一个敌人 → 回能 #1（=3）+ 获 1 层
  # 升格。命中口径：130201 单体=1；130202/130203 全体=存活敌数；130214 = 主段全体按存活敌数
  #（下方钩）+ 6 次弹射逐段自结（弹射钩内先伤害后 +1 层/+3 能——per-hit 顺次读法，
  # 弹射间暴击爬坡待实测在案）。KQM 佐证："offering him 3 Energy for every enemy Argenti hits"
  - event: "on_action"
    condition: "$event.actor == '1302' && $event.action_id == '130201' && !$event.insert"
    effects:
      - effect_type: "gain_energy"
        amount: "param(130204, 1)"                   # 单体命中 1 敌 → 3 能量
      - effect_type: "gain_resource"
        resource_id: "apotheosis"
        amount: 1

  - event: "on_action"
    condition: "$event.actor == '1302' && ($event.action_id == '130202' || $event.action_id == '130203') && !$event.insert"
    effects:
      - effect_type: "gain_energy"
        amount: "param(130204, 1) * enemies_alive()"   # 每敌 3（全体命中口径）
      - effect_type: "gain_resource"
        resource_id: "apotheosis"
        amount: "enemies_alive()"

  # 130214 主段命中：全体 → 回能/层数 = 每敌 3 × 存活敌数（弹射段命中计数在下方弹射钩
  # 逐段自结——官方 "every enemy Argenti hits" per-hit 读法：命中即结算、爬坡实时生效）
  - event: "on_action"
    condition: "$event.actor == '1302' && $event.action_id == '130214' && !$event.insert"
    effects:
      - effect_type: "gain_energy"
        amount: "param(130204, 1) * enemies_alive()"
      - effect_type: "gain_resource"
        resource_id: "apotheosis"
        amount: "enemies_alive()"

  # 130214 弹射段：追加 #2（=6）次伤害，每次对随机一名敌人造成 #3 × ATK 物理伤害
  #（目标代数 mode random 逐段独立抽取，允许重复命中同一目标——官方 "a random enemy"；
  # expected 模式确定化取布场序首敌）。每段 = 先伤害后结算天赋命中（+3 能/+1 层——
  # 段序爬坡：弹射 i 吃 主段+i-1 层；本段命中不计入本段伤害——命中完成才给层）。
  # action_type "ultimate" = 终结技子击身份（1220 飞霄先例槽）；toughness_dmg 5/段
  #（三源一致：fandom 5 (Per Bounce)/米游社 20+5*6/tbgd [15]÷3）。
  # 弹射间暴击爬坡与随机落点分布 → 待实测（现按官方 per-hit 文本顺次承载）
  - event: "on_action"
    condition: "$event.actor == '1302' && $event.action_id == '130214' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "驻「我」华庭，授予至勋·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        action_type: "ultimate"
        toughness_dmg: 5
        amount: "param(130214, 3) * $self.atk"
      - effect_type: "gain_energy"
        amount: "param(130204, 1)"
      - effect_type: "gain_resource"
        resource_id: "apotheosis"
        amount: 1
      - effect_type: "deal_damage"
        name: "驻「我」华庭，授予至勋·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        action_type: "ultimate"
        toughness_dmg: 5
        amount: "param(130214, 3) * $self.atk"
      - effect_type: "gain_energy"
        amount: "param(130204, 1)"
      - effect_type: "gain_resource"
        resource_id: "apotheosis"
        amount: 1
      - effect_type: "deal_damage"
        name: "驻「我」华庭，授予至勋·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        action_type: "ultimate"
        toughness_dmg: 5
        amount: "param(130214, 3) * $self.atk"
      - effect_type: "gain_energy"
        amount: "param(130204, 1)"
      - effect_type: "gain_resource"
        resource_id: "apotheosis"
        amount: 1
      - effect_type: "deal_damage"
        name: "驻「我」华庭，授予至勋·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        action_type: "ultimate"
        toughness_dmg: 5
        amount: "param(130214, 3) * $self.atk"
      - effect_type: "gain_energy"
        amount: "param(130204, 1)"
      - effect_type: "gain_resource"
        resource_id: "apotheosis"
        amount: 1
      - effect_type: "deal_damage"
        name: "驻「我」华庭，授予至勋·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        action_type: "ultimate"
        toughness_dmg: 5
        amount: "param(130214, 3) * $self.atk"
      - effect_type: "gain_energy"
        amount: "param(130204, 1)"
      - effect_type: "gain_resource"
        resource_id: "apotheosis"
        amount: 1
      - effect_type: "deal_damage"
        name: "驻「我」华庭，授予至勋·弹射"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "physical"
        action_type: "ultimate"
        toughness_dmg: 5
        amount: "param(130214, 3) * $self.atk"
      - effect_type: "gain_energy"
        amount: "param(130204, 1)"
      - effect_type: "gain_resource"
        resource_id: "apotheosis"
        amount: 1

  # —— 大行迹 1302101 虔诚：回合开始时立即获得 1 层升格（params_max=[1] 字面值）
  - event: "on_turn_start"
    condition: "$event.actor == '1302'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "apotheosis"
        amount: 1

  # —— 大行迹 1302102 慷慨：敌方目标进入战斗时立即恢复 2 点能量（params_max=[2] 字面值）。
  # 波次/召唤物逐个触发边界 → 待实测（现按每入场事件 1 次 +2 承载；首波 setup 不自发
  # actor_enter，波次换人/召唤入场逐次触发）
  - event: "actor_enter"
    condition: "actor_type_of($event.actor) == 'monster'"
    effects:
      - effect_type: "gain_energy"
        amount: 2

  # —— 大行迹 1302103 勇气：对生命值百分比 ≤50%（#1=0.5 字面值）的敌人造成的伤害提高 15%
  #（#2=0.15 字面值）——before_take_damage waterfall modify_amount 乘法改写承载（无目标相关
  # 增伤 stat 通道先例）；增伤乘区归属（独立 or 通用 additive DMG%）→ 待实测，不脑补；
  # 引擎缺口：hook 伤害（弹射/秘技段）不过本 waterfall，不吃勇气——待收⑦在案
  - event: "before_take_damage"
    condition: "$event.source == '1302' && actor_type_of($event.target) == 'monster' && hp_of($event.target) <= 0.5 * max_hp_of($event.target)"
    effects:
      - effect_type: "modify_amount"
        amount: "1.15 * $event.amount"

scaling_notes:
  - "双阈值终极技：130203（energy_cost 90）与 130214（energy_cost 180）并存——能量门槛走内建 energy_cost 通道（ult_threshold_of 阈值全扣），不设 available_if；auto 模式 AI 选择逻辑 → 待实测⑨"
  - "倍率档位全表照抄官方 params：10 级表（130201）lv10=第 10 行=1.4；15 级表（130202/130203/130204/130214）lv10=第 10 行（1.2 / 1.6 / [3,0.025,10] / 2.8+6×0.95）——不目测表尾"
  - "战技点：130201 产 +1 / 130202 耗 1（tbgd sp_cost 权威，米游社漏标系已知病灶，冲突裁决 tbgd 优先）/ 两段终极技 0 耗 0 产（tbgd）"
  - "削韧：三源一致——普攻 10 / 战技 10（每目标）/ 130203 20 / 130214 主段 20+弹射 5×6（fandom 20 (AoE)+5 (Per Bounce)、米游社 削韧 20 / 20+5*6、tbgd stance ÷3）；秘技入战伤害削韧三源均空缺 → 保守 0 待实测"
  - "能量：max_energy=180（官方 #4[i]=180）；终极技施放返还 5（tbgd energy=5，通用规则）；天赋每敌回能 3 随档（param(130204,1)）"
  - "升格跨波次保留（层数衰减/回合数无官方 duration 文本 → 视为 battle-long）→ 待实测④"
  - "无护盾/净化/免死/免疫/召唤机制文本 → 本角色不涉相关编译块；无站位语义（HSR 系统规则）；控制模型 = 回合制玩家手动操控（两段终极技由玩家选择）"
