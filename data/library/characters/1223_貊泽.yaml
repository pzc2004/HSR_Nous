              {"atk": 2.16}, {"atk": 2.295}, {"atk": 2.43}, {"atk": 2.565}, {"atk": 2.7},
              {"atk": 2.808}, {"atk": 2.916}, {"atk": 3.024}, {"atk": 3.132}, {"atk": 3.24}]
    toughness_dmg: 30
    energy_gain: 5

eidolons:
  E1:
    name: "Oathkeeper"
    hooks:
      # 翻案收录（draft 误判无锚例——gain_energy 六连翻案先例）：进战 20 能 +
      # 附加伤害命中回 2 能（与主干附加钩同触发域的独立钩——1213 E1 先例；
      # 官方「天赋发动的附加伤害命中后」——on_hp_decrease 与主干附加段同帧）
      - event: "on_battle_start"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 20
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && $event.source != '1223' && has_modifier($event.target, 'PREY_MARK') >= 1 && res__prey_active >= 1 && res__prey_charge >= 1"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 2
    notes:
      - "量化在案：一个完整 Prey 周期 9 段附加伤害 = +18 能量"
  E2:
    name: "Wrathbearer"
    notes:
      - "待收：对猎物造成伤害时暴伤 +40%——**真挡因**=hit_condition 命中域无目标 modifier 谓词（伤害命中域只有 action_type/damage_type/target_broken/target_controlled——「对带 PREY_MARK 的敌人」挂不上，两读（攻击者 crit_dmg scoped / 敌方 crit_vuln 族）同缺通道，B27 候选）；受益者/时长双读亦未定（不脑补）"
  E3:
    name: "Deathchaser"
    skill_level_overrides: {"ultimate": 2, "talent": 2}
    notes:
      - "终结技+2 随档段：action scaling 实取 lv12 档（2.916）；终结技派生追击倍率走 param(122304,3) 随 talent 轨道，随本星魂同跳 lv12（1.76）"
      - "天赋+2 随档段：附加伤害 param(122304,1)（lv12=0.33）与追击 param(122304,3)（lv12=1.76）；#2=3 恒值不随档"
  E4:
    name: "Heathprowler"
    hooks:
      - event: "on_action"
        condition: "$event.actor == '1223' && $event.action_id == '122303' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_HEATHPROWLER"
              name: "Heathprowler"
              modifier_type: "buff"
              duration: 2
              dispellable: False
              stat_effects: {"all_dmg": 0.3}
  E5:
    name: "Truthbender"
    skill_level_overrides: {"skill": 2, "basic": 1}
    notes:
      - "战技+2：action scaling 实取 lv12 档（1.65）；充能 #2=9 恒值不随档；普攻+1 实取 lv10 档（1.40，普攻表仅 10 行，+1 已到顶）"
  E6:
    name: "Faithbinder"
    hooks:
      # 旗模式收录（1220 飞霄 _e1_flag 先例——draft 挡因②「覆写通道无」误判）：
      # 开战置旗 → 主干两追击钩 amount 内联 ×(1+0.25×res__e6_flag)——E0 恒等。
      # 乘算口径：官方「increases the DMG multiplier by 25%」按 HSR 惯例=倍率
      # ×1.25（相对放大——社区数据同读）在案，加算（+0.25 绝对）候选待实测
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e6_flag"
            amount: 1

hooks:
  - event: "on_action"
    condition: "$event.actor == '1223' && $event.action_id == '122302' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "PREY_MARK"
          name: "猎物"
          modifier_type: "debuff"
          duration: 0
          dispellable: False
      - effect_type: "set_resource"
        resource_id: "_prey_charge"
        amount: "param(122302, 2)"
      - effect_type: "set_resource"
        resource_id: "_prey_used"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_prey_active"
        amount: 1
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "MOZE_DEPARTED"
          name: "伸天卑飞·离场"
          modifier_type: "buff"
          duration: 0
          dispellable: False

  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && $event.source != '1223' && has_modifier($event.target, 'PREY_MARK') >= 1 && res__prey_active >= 1 && res__prey_charge >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "伸天卑飞，折翅为芒"
        target: "$event.target"
        damage_type: "thunder"
        amount: "param(122304, 1) * $self.atk"
      - effect_type: "gain_resource"
        resource_id: "_prey_charge"
        amount: -1
      - effect_type: "gain_resource"
        resource_id: "_prey_used"
        amount: 1

  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && $event.source != '1223' && has_modifier($event.target, 'PREY_MARK') >= 1 && res__prey_active >= 1 && res__prey_charge >= 1 && res__prey_used + 1 >= param(122304, 2)"
    effects:
      - effect_type: "deal_damage"
        name: "伸天卑飞，折翅为芒·追加攻击"
        target: "$event.target"
        damage_type: "thunder"
        amount: "param(122304, 3) * (1 + 0.25 * res__e6_flag) * $self.atk"   # E6 旗模式内联（E0 恒等）
        toughness_dmg: 10
      - effect_type: "set_resource"
        resource_id: "_prey_used"
        amount: 0

  # 1223101 Nightfeather：天赋追加攻击后回 1 SP（gain_skill_point 原语在库——
  # draft 误判「SP 产出无锚例」：1015/1201 先例）——**独立钩**（闩只挡 SP 不挡
  # 追击本体——初版与追击同钩会连追击一起挡已修正）；1 回合后可再触发=闩+回合重置
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && $event.source != '1223' && has_modifier($event.target, 'PREY_MARK') >= 1 && res__prey_active >= 1 && res__prey_charge >= 1 && res__prey_used + 1 >= param(122304, 2) && res__nightfeather_cd < 1"
    effects:
      - effect_type: "gain_skill_point"
        amount: 1
      - effect_type: "set_resource"
        resource_id: "_nightfeather_cd"
        amount: 1

  - event: "on_turn_start"
    condition: "$event.actor == '1223'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_nightfeather_cd"
        amount: 0   # 闩重置（"1 回合后可再触发"按貊泽回合计近似——按敌方/全场回合待实测）

  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && actor_type_of($event.source) != 'monster' && $event.source != '1223' && has_modifier($event.target, 'PREY_MARK') >= 1 && res__prey_active >= 1 && res__prey_charge - 1 <= 0"
    effects:
      - effect_type: "remove_modifier"
        target: "$event.target"
        modifier_id: "PREY_MARK"
      - effect_type: "set_resource"
        resource_id: "_prey_charge"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_prey_used"
        amount: 0
      - effect_type: "set_resource"
        resource_id: "_prey_active"
        amount: 0
      - effect_type: "remove_modifier"
        modifier_id: "MOZE_DEPARTED"
      - effect_type: "advance_action"
        target: "self"
        amount: 20

  - event: "on_ultimate"
    condition: "$event.source == '1223' && $event.action == '122303'"
    effects:
      - effect_type: "deal_damage"
        name: "伸天卑飞，折翅为芒·终结技追击"
        target: "$event.target"
        damage_type: "thunder"
        amount: "param(122304, 3) * (1 + 0.25 * res__e6_flag) * $self.atk"
        toughness_dmg: 10

scaling_notes:
  - "Departed（离场）目前只作标记 modifier（MOZE_DEPARTED + _prey_active 闩）：免选中/免伤/吃增益/占队伍人数/离场期开大的 UI 允许性全部待实测，不脑补通道；貊泽离场期唯一确定 SP 正产出行迹 1223101 已收（gain_skill_point 独立钩，闩 1 回合），当前 SP 账=战技 −1 / 普攻 +1 / Nightfeather 追击 +1（闩挡 SP 不挡追击本体）"
  - "充能/计数/闩三资源口径：_prey_charge（9，战技重置、附加伤害 −1、追击不耗）；_prey_used（+1/附加伤害、每满 param(122304,2)=3 触发追击并归 0）；_prey_active（Prey/Departed 一体闩，0=周期收束）。条件按事件发生前快照求值（1407 先例），故判满用 +1 补偿、判尽用 −1 补偿"
  - "天赋附加伤害与追击均以 $self.atk 为基数（官方 'equal to #1[i]% of Moze's ATK'）——貊泽离场期面板通道维持自身面板；附加伤害 vs FUA 分类（行迹 1223103 易伤是否覆盖附加伤害）待实测"
  - "对轴汇总（SP=tbgd 权威 / 削韧=米游社代读，fandom 本轮全空待校验）：普攻 0/+1/20/10；战技 −1/0/30/20；终结技 0/0/5/30；天赋追击 0/0/10（回能粒度待实测）/10；秘技 0/0/0"
  - "122306「攻击」条目 params 空、type_text 与 effect_text 皆空 → 判定敌方/占位条目非玩家技能，不编译（待数据方确认）"
