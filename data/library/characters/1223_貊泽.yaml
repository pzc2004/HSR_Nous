  - "行迹 1223102「Daggerhold」两件：①解除 Departed 时自身行动提前 20%（#1=0.20）已收（随充能归 0 解除链 advance_action 20）；②每波开始行动提前 30%（#2=0.30）待收——挡因=波次开始事件键未在锚范例词表出现。Eagle 4 件 25% 拉条与本行迹同帧结算顺序待实测"
  - "行迹 1223103「Vengewise」两件均待收：①终结技视为已发动一次追加攻击（EN 'considered as having launched a Follow-Up ATK'——分类重写非新增伤害段）；挡因=action 层 follow_up 分类覆写通道缺；②猎物受到的追加攻击伤害 +25%（#1=0.25）；挡因=敌方按 FUA 分类受击易伤 stat_effects 键未见。附加伤害是否吃该易伤待实测（附加伤害≠FUA）"
