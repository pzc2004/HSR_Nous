# 角色模板：貊泽（1223）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂勘正四件（staging+fixture 同步）：
#   ① E1 翻案收录——draft 误判「gain_energy 通道无锚范例先例」：gain_energy
#     六连翻案先例（1207/1210/1211/1213/1214/1217）；进战 20 能（on_battle_start）
#     + 附加伤害命中回 2 能（与主干附加钩同触发域独立钩——1213 E1 先例，
#     1209 星魂门控纪律不并主干）
#   ② 1223101 Nightfeather 翻案收录——draft 误判「SP 产出 effect_type 无锚
#     先例」：gain_skill_point 原语在库（1015/1201 先例）；天赋追加攻击后
#     回 1 SP+闩 1 回合——**独立钩**（闩只挡 SP 不挡追击本体：初版与追击
#     同钩会连追击一起挡，已修正为同触发域独立钩）
#   ③ E6 旗模式收录——draft 挡因②「星魂档覆写 hook 数值无既有通道」误判：
#     1220 飞霄 _e1_flag 先例（开战置旗+主干追击 amount 内联乘旗——E0 恒等）；
#     乘算口径：官方「increases the DMG multiplier by 25%」按 HSR 惯例=倍率
#     ×1.25（社区数据同读），加算（+0.25 绝对）候选待实测在案
#   ④ E2 维持待收（挡因改写）——真挡因=hit_condition 命中域无目标 modifier
#     谓词（伤害命中域只有 action_type/damage_type/target_broken/target_controlled
#     ——「对带 PREY_MARK 的敌人」两读（攻击者 crit_dmg scoped / 敌方
#     crit_vuln 族）同缺通道，B27 候选；非 draft 原述「双读不定」）
#
# 离场（MOZE_DEPARTED）维持标记+在案：banished 放逐通道在库（05_effects
#   放逐三语义——白厄 banish_allies 族），但貊泽离场语义边界未钉（免选中/
#   免伤/吃增益/占人数/离场期追击算不算他行动）——不轻用，仅标记 modifier
#   +_prey_active 闩承载周期。
#
# 收录：普攻飞铙 / 战技迅羽掠袭（1.5 lv10 + 猎物标记+充能 9+离场标记）/
#       天赋伸天卑飞（队友攻击猎物 → 附加 0.3 lv10（充能 −1）+每满 3 段
#       追击 1.6 lv10（削韧 10）+终结技后额外追击）/ 行迹 Nightfeather
#       （追击后回 1 SP 闩 1 回合）/ 秘技胁翼匿迹（all_dmg+30% 2 回合）/
#       E1 进战 20 能+附加回 2 / E3/E5 等级族 / E4 大招后 all_dmg+30% /
#       E6 追击 ×1.25 旗模式
# 待收（均带挡因）：E2 对猎物暴伤（hit_condition 目标 modifier 谓词缺）/
#       离场放逐语义（banished 边界——免选中/吃增益/UI 允许性）/
#       1223103 易伤覆盖附加伤害与否（附加 vs FUA 分类）/ 追击回能粒度 /
#       Nightfeather 闩计时锚（按貊泽回合近似——敌方/全场回合待实测）/
#       离场期开大 UI 允许性 / 行迹属性节点（未下发）
