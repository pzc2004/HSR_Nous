# 角色模板：砂金（1304）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
#
# 过堂勘正十七件：① 星魂幻名 ×5（族谱#2——E1 囚徒困境→囚徒博弈 / E3 掉率
#   最大化→最高倍率 / E4 意外悬吊悖论→意外绞刑 / E5 含糊厌恶→模糊厌恶 /
#   E6 猎鹿博弈→猎鹿游戏，全核 character_ranks.json；E2 有限理性本对）；
#   ② base_stats 补 max_energy: 110（draft 挂 energy_cost 110 却无能量上限
#   声明——角色 max_sp=110 官方在案，1208/1306 fixture 同键先例）；
#   ③ 天赋 FUA 结构重构（族谱#15 正解化——draft 把 7 段落成 hook 7×
#   deal_damage：on_action 130404 永不发射 → Bingo!② 死钩（其 `!$event.
#   insert` 与 trigger_action insert=True 自相矛盾=双保险死）；能量/削韧/
#   倍率散落 hook 非 action 层单点记账。正解=姬子 100304/白厄 bounce 先例：
#   action 130404 target_type bounce + instances 7 + scaling 15 档 +
#   toughness_dmg 3/段（3.3 被 int 闸截断——待收见下）+ energy_gain 7
#   （米游社逐段 1×7 合计口径），触发钩 trigger_action + gain_resource -7）；④ on_become_target 盲注双钩补
#   敌方源过滤 actor_type_of($event.source) == 'monster'（官方 "when they
#   get attacked"——draft 不过滤：我方辅助技点带盾队友也产盲注=假阳性）；
#   ⑤ Bingo!② 最低盾 order_by 死键 $it.shield_amount → $it.shield（target_
#   algebra._it_namespace 唯一字段名——查无此属性求值炸=静默死件）；
#   ⑥ 天赋效果抵抗 0.5 字面值 → "param(130404, 4)"（#4 有 15 档等级轨道，
#   E5+2 随档 0.55——draft 自己在 E5 notes 写了随档却没接 param()）；
#   ⑦ E2 全属性抗性 -12% = res_pen 挂敌方死键（族谱#7——抗性区只读攻击方
#   res_pen；all_type_res 死键闸同案 1006/1015/1106/1203）→ 摘除记待收；
#   ⑧ 终结技「不安」crit_dmg_taken 死键（暴击区只读攻击方 crit_rate/
#   crit_dmg，目标侧暴伤承区无消费端）→ 摘除记待收；⑨ E6 count(who_has(
#   'FORTIFIED_WAGER')) 语义幻视——who_has 返回**单个** actor_id 字符串
#   （编成序首命中），count("1304")=len=4 完全错误；带盾人数无宿主 → 摘除
#   记待收；⑩ E4 补逐段回能 +3（米游社天赋回能逐段口径 1×7——额外 3 段
#   同 3.3/段削韧外推同源）；⑪ E3 notes 错值勘正——普攻 lv7=index6=**1.1**
#   DEF（draft 写 0.7=lv3 档）；⑫ 战技 damage_type: imaginary 摘除（无
#   scaling 纯防御技不挂元素——1208 符玄 120802 先例）；⑬ groups:
#   faction:ipc 摘除（命名两态——staging 自标"推断、官方名录未下发"；在册
#   faction 名册仅 chrysos_heir 一族，IPC 无权威对照源）；⑭ 行迹属性回填
#   trace_stat_effects（draft 空表——官方节点：防御 ×5=0.35 / 虚数伤害 ×3
#   =0.144 / 效果抵抗 ×2=0.10，character_skill_trees.json properties 终审，
#   1415 昔涟回填先例）；⑮ SP 冲突注记勘误——米游社 sub_tag 明载"战技点
#   -1"，与 tbgd 一致无冲突（draft 虚报"覆盖米游社无消耗标"）；⑯ 130404
#   补 level_key: "talent"（draft 缺发——engine._skill_level_of 对 follow_up
#   回落 ultimate：eidolon 3/4（E3 终结技+2 激活、E5 未激活）追击倍率误读
#   lv12=0.275（天赋实档 lv10=0.25）——e2e 钓出，build_compiler「曾静默
#   丢失——白厄模板族」同案）；⑰ 收录口径复核全过——15 档表 lv10=index 9
#   三表逐行对官方 params 全等（族谱#1 无病灶）、盲注上限 10 官方 "capped
#   at 10" 在案、护盾 accumulate 同池 + cap multiplier 2（1104 杰帕德
#   shield param() 先例）、秘技三档互斥取最低档 24% 保守 + 注。
# 收录：战技/Hot Hand/Bingo!/E1 四源「坚垣筹码」护盾同池 accumulate +
#   cap=当次战技盾 200%；盲注全链（带盾我方受击 +1（砂金本人 +2）/ Bingo!
#   队友 FUA 产点 ≤3/回合 / 终结技 +1~7 确定化 7 → 满 7 消耗触发 bounce×7
#   追加 → Bingo!② 全队追盾+最低盾加追）；Leverage DEF→暴击率 stat_exprs
#   动态通道；效果抵抗 50%（随档）+ 控制免疫 2 回合 CD 门控；E1 带盾暴伤
#   +20%/终结技追盾；E3/E5 等级跳档全随档（param 通道）；E4 加防 +3 段
#   +3 能；秘技 DEF 三档保守 24%。
# 待收（均带挡因）：E2 有限理性 全属性抗性 -12%（敌方抗性削减修饰通道缺
#   ——all_type_res 死键闸同案；抗性区只读攻击方 res_pen + 目标基础抗性）
#   / 终结技「不安」 暴伤承 +15%（目标侧 crit 承区无消费端——scoped 补口
#   族仅 vulnerability/res_pen 域，crit 域无目标侧通道）/ E6 猎鹿游戏 带盾
#   队友计数（宿主缺——who_has 单值返回/$team 无 shield 键；建议 $team.
#   shield 或 count_team 式计数宿主立项）/ 秘技三档概率权重与档位随机
#   （随机通道缺——保守取最低档 24%）/ 终结技盲注随机 1~7（无随机整数
#   宿主——确定化按上界 7，期望 4 待随机通道）/ 标记代理差异（护盾提前
#   破裂 FORTIFIED_WAGER 标记不联动摘除——无 has_shield/护盾余量宿主；
#   效果抵抗/免控/E1 暴伤按标记 3 回合近似，破盾溢发窗在案）/ E4「先加防
#   后 10 段全吃」覆盖顺序（同主同事件 hook 无优先级槽——trigger_order
#   仅跨 actor；现 7 段本体不吃本次 +40% DEF、3 段追加段吃——近似在案
#   待实测）/ Bingo!②「护盾值最低」比较口径（现按 $it.shield 当前剩余
#   合计——上限口径待实测）/ 天赋逐段削韧 3.3 浮点（action 层
#   toughness_dmg int 闸截断为 3——浮点削韧族通道缺，损失 0.3×7=2.1/次；
#   hook 层 deal_damage toughness 是 float 通道，action 层等 float 化立项）。
actor_id: "1304"
name: "砂金"
level: 80
path: "preservation"        # 存护（count_team 编成计数口径）
element: "imaginary"        # 虚数（element_of 取数源）
base_stats:                 # 照抄官方管线 lv80 实值（pipeline.calc_character_stats 终审）
  hp: 1203.0479999999998
  atk: 446.29200000000003
  def: 654.885
  spd: 106
  crit_rate: 0.05           # Leverage 走 stat_exprs 动态加成，不并入 base_stats
  crit_dmg: 0.5
  max_energy: 110           # 能量上限 110（米游社 energy_cap/tbgd 与官方一致——过堂补登）
trace_stat_effects:         # 官方行迹属性节点（character_skill_trees.json properties 终审）
  def_pct: 0.35             # 防御强化 ×5（0.05+0.05+0.075+0.075+0.10）
  dmg_imaginary: 0.144      # 伤害强化•虚数 ×3（0.032+0.048+0.064）
  effect_res: 0.10          # 效果抵抗强化 ×2（0.04+0.06）
trace_notes:
  - 大行迹 Leverage（1304101）已收（stat_exprs 动态通道）：DEF 每超 1600 点 100 → 暴击率 +2%，上限 +48%；宿主词表无 floor，用 round 近似（逐档偏差 <1% 暴击率，在案）
  - 大行迹 Hot Hand（1304102）已收（on_battle_start 全队盾，100% 战技盾=param(130402,1/2) 随档实例化——官方"of the one provided by the Skill"按当前战技等级读，星魂 5 +2 随档生效）
  - 大行迹 Bingo!（1304103）已收两件（队友 FUA 产盲注 ≤3/回合；FUA 后全队追加盾+最低盾 1 人）；"Shield Effect 最低"比较口径（当前剩余值 vs 上限）待实测
  - 站位：官方/wiki/社区均无——待实测（不脑补）

# hook/modifier 系数等级表（param() 编译期引用，05_effects §5.1）；行迹/秘技无等级轨道 → 字面值
