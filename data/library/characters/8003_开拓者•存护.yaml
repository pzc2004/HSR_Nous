# 角色模板：开拓者•存护（8003·火主）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
# 命名消歧：开拓者按命途写——cid 8003 = 存护命途（characters.json path=Knight /
# 米游社五项注册名「开拓者•存护」）；draft 名「火主（开拓者·存护）」是社区俗称+错间隔号，勘正。
#
# 过堂收编/勘正十三件：
#   ① 死键 dmg_taken×2 勘正——draft 战技减伤/大行迹 8003101 减伤均写 dmg_taken
#     （编译死键闸实证炸——正解减伤乘区 dmg_dmg_reduction 正值，1107 克拉拉/1206 素裳先例）；
#   ② 星魂名全幻勘正——E1-E6 draft 名六出六幻，照 character_ranks.json 全换：
#     E1 大地芯髓的鸣动 / E2 古老寒铁的坚守 / E3 砌造未来的蓝图 / E4 驻留文明的誓言
#     / E5 点燃光焰的勇气 / E6 永屹城垣的壁垒；
#   ③ 行迹白值漏收勘正——draft trace_stat_effects 空块：StarRailRes 小节点聚合
#     防御% 0.35（201/203/205/207/210）+ 攻击% 0.18（202/206/209）+ 生命% 0.10（204/208），
#     trace_stat_effects 通道回填（1502_爻光勘正①同病）；
#   ④ 嘲讽死件收编——draft AMBER_TAUNT 零效果键=静默死件；引擎 forced_taunt 键在库
#     （state.py 注释明写「如火主战技」，1315_波提欧 STANDOFF_TARGET 先例），挂上即
#     强制敌方攻击火主；
#   ⑤「数值槽不接受等级引用函数」挡因过期——shield scaling/flat 与 stat_effects 字符串
#     槽均接 param()（B27#6 已收，1104_杰帕德勘正②同病）：天赋盾 param(800304,1/4)、
#     战技减伤 param(800302,1)，E3 随档自动生效（draft E3 notes「偏移段待实测接线」摘下）；
#   ⑥ E6 烘焙死件勘正——stat_effects 值不乘层（_compute 直折），三层 DEF 名存实亡；
#     正解 stat_exprs 活读（1210 桂乃芬 FIREKISS/1015 Archer 先例）：
#     def_pct = 0.1 × stacks($self)；
#   ⑦ E1 追加段补 category: "additional"——缺省伪行动类别 follow_up 会误吃追加攻击
#     限定增伤桶；官方「额外造成」=角色附加伤害（mechanics 02 §2.1 生效表：吃常规乘区
#     含双暴、不吃类型限定增伤；1505_绯英先例）；
#   ⑧ 削韧三值回填——draft 全标待实测（「米游社 20+10*2 疑串页」是标注侧串行误判，
#     米游社五项分行干净）：800301 削韧 10 / 800308 主 20+相邻 10 / 800303 削韧 20
#     （米游社五项权威，纪律 14）；
#   ⑨ 800301 回能冲突注记过期——draft 称「米游社回能 30 vs tbgd 20 冲突」，实测米游社
#     数据回能 20（串行误判同族），两源一致 20；
#   ⑩ 天赋盾 modifier 补 max_stack: 1——E2 双钩同 modifier_id 重挂，refresh 层数空转
#     脏账（层数无消费端）；护盾值走 accumulate 池不读层；
#   ⑪ groups: ["faction:trailblazer"] 摘除——无官方名册权威源（faction:chrysos_heir
#     有献予诗推断源先例），零消费端的脑补名册不收；
#   ⑫ Magma Will 资源 id「未下发待对账」挡因不成立——custom_resources 是模板自定义
#     命名空间（16 章），magma_will = 官方机制名 canonical 化，合规直用；
#   ⑬ E1 stat_of 面板键勘正——draft 写 stat_of($self, 'def')：L1 词表键是 def_，
#     'def' 查无返回 0.0=追加段静默 0 伤（e2e 钓出实证；1104 杰帕德 'def_' 先例）。
#
# 收录：普攻 800301（回能 20 产点 +1 削韧 10，+1 层灼热意志）/ 战技 800302（自体减伤
#       param 随档 lv10=50% + 全体嘲讽 forced_taunt 1 回合——100% 基础概率，抵抗链
#       未接线在案——耗 1 SP 回能 30，+1 层）/ 终结技 800303（ATK+DEF 双系全体 + 免耗
#       强化一次标记，耗 120 返 5 削韧 20）/ 天赋 800304（受击 +1 层灼热意志上限 8 +
#       施放普攻/战技/终结技全体护盾 param 随档 lv10=6%DEF+80 两回合，accumulate 同池）/
#       强化普攻 800308（耗 4 层，标记豁免；Blast 主/相邻双表 + 削韧 20+10，回能 30 产点）/
#       秘技 800307（开战自体护盾 30%DEF+384 一回合）/ 大行迹 8003101（战技后全体减伤
#       15% 一回合）/ 8003102（强化普攻后自回 5% 最大生命）/ 星魂 E1-E6 全机制。
# 待收（均带挡因）：大行迹 8003103（回合开始持盾 → ATK+15% + 回 5 能至行动结束）——
#       挡因：宿主函数词表无「护盾在身」判定（stacks/has_modifier 不覆盖 shield 通道，
#       引擎缺口见报告）；
#       嘲讽抵抗链（EHR/RES 概率门）——挡因：100% 基础概率下 hook apply_modifier 无
#       chance 槽（_EFFECT_PARAM_KEYS 无此键），命中为乐观上界，待实测；
#       战技减伤持续回合（官方文本未写——「持续#3回合」语法上挂嘲讽；暂按 1 回合社区
#       口径，待实测）；
#       天赋盾叠算模型/dispellable/E2 池名/免耗标记与 E6 buff 持续时长——官方文本
#       未写，待实测；
#       E1 追加段相邻目标是否同吃（$event.target 主目标口径）/ 是否独立削韧——待实测。
# 数值：action 倍率全表照抄官方 params；hook/modifier 侧系数一律 param() 随档（等级
#       轨道：basic 默认 lv6、skill/ultimate/talent 默认 lv10；E3/E5 星魂偏移编译期
#       自动加算——幻视族谱 #18 联动）。
actor_id: "8003"
name: "开拓者•存护"
level: 80
path: "preservation"   # 命途（count_team 编成计数口径——characters.json path=Knight 对照 preservation）
element: "fire"        # 元素（element_of 取数源——官方数据照抄）
base_stats:
  hp: 1241.8560000000002
  atk: 601.5239999999999
  def: 606.375
  spd: 95
  crit_rate: 0.05      # 管线实值原值（行迹无暴击率节点）
  crit_dmg: 0.5        # 管线实值原值（行迹无暴伤节点）
  max_energy: 120      # 终结技能量上限 120（本体声明 + 米游社「能量 120」交叉一致）
trace_stat_effects:    # StarRailRes 行迹小节点聚合（勘正③——character_skill_trees.json 8003201-210）
  def_pct: 0.35        # 防御强化 ×5（0.05+0.05+0.075+0.075+0.10）
  atk_pct: 0.18        # 攻击强化 ×3（0.04+0.06+0.08）
  hp_pct: 0.1          # 生命强化 ×2（0.04+0.06）
trace_notes:
  - "大行迹 8003101 强援弱 已收（战技后全体受伤害降低 15%，1 回合——params [[10, 0.15, 1]] 的 #2/#3 字面值；减伤键 dmg_dmg_reduction，勘正①）"
  - "大行迹 8003102 生先死 已收（强化普攻后回复自身 5% 最大生命，params [[0.05]] 字面值）"
  - "大行迹 8003103 行胜思 未收（挡因见头部待收：宿主词表无护盾在身判定通道——params [[5, 0.15]] 在案）"
  - "本体无免死、无控制免疫——不许脑补"

# hook/modifier 侧系数等级表（param() 编译期取档——index = 等级-1，E3/E5 偏移自动生效）
skill_params:
  "800302":
    level_key: skill   # 炽燃不灭的琥珀（Skill）：#1 自体减伤 %，#2 嘲讽基础概率，#3 嘲讽回合数
    rows:  # lv1..lv15 照抄原始数据 params
      - [0.4, 1, 1]
      - [0.41, 1, 1]
      - [0.42, 1, 1]
      - [0.43, 1, 1]
      - [0.44, 1, 1]
      - [0.45, 1, 1]
      - [0.4625, 1, 1]
      - [0.475, 1, 1]
      - [0.4875, 1, 1]
      - [0.5, 1, 1]     # lv10：减伤 50%、基础概率 100%、1 回合（#1 经 param(800302,1) 随档）
      - [0.51, 1, 1]
      - [0.52, 1, 1]   # lv12（E3 战技+2 实取档）：减伤 52%
      - [0.53, 1, 1]
      - [0.54, 1, 1]
      - [0.55, 1, 1]
  "800304":
    level_key: talent  # 筑城者遗宝（Talent）：#1 护盾 DEF 比例，#2 护盾回合数，#3 灼热意志上限，#4 护盾固定值
    rows:  # lv1..lv15 照抄原始数据 params
      - [0.04, 2, 8, 20]
      - [0.0425, 2, 8, 32]
      - [0.045, 2, 8, 41]
      - [0.0475, 2, 8, 50]
      - [0.05, 2, 8, 56]
      - [0.052, 2, 8, 62]
      - [0.054, 2, 8, 66.5]
      - [0.056, 2, 8, 71]
      - [0.058, 2, 8, 75.5]
      - [0.06, 2, 8, 80]   # lv10：6% DEF + 80 点，持续 2 回合，上限 8 层（#1/#4 经 param 随档）
      - [0.062, 2, 8, 84.5]
      - [0.064, 2, 8, 89]  # lv12（E3 天赋+2 实取档）：6.4% DEF + 89
      - [0.066, 2, 8, 93.5]
      - [0.068, 2, 8, 98]
      - [0.07, 2, 8, 102.5]

custom_resources:
  magma_will:
    name: "灼热意志（Magma Will）"
    max: 8            # 上限 8（官方 Talent #3[i]=8 全档恒定）；模板自定义命名空间合规 id（勘正⑫）

# 秘技 800307 守护者召令：下一场战斗开始时获护盾 = DEF×30% + 384，持续 1 回合（单行 params
# 无等级轨道 → 字面值直写）；800306「攻击」为通用秘技攻击兜底条目（params 空、非可编排
# 动作）→ 不落 actions，破韧由引擎秘技默认通道承担
techniques:
  - technique_id: "800307"
    name: "守护者召令"
    point_cost: 1     # 秘技点消耗待实测（暂按常规 1 点保守默认）
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "GUARDIAN_BEACON"
          name: "守护者召令"
          modifier_type: "buff"
          duration: 1
          dispellable: False
          shield:
            scaling: {def_: 0.3}    # 字面值（无等级轨道——05_effects §5.1 边界）
            flat: 384

actions:
  - action_id: "800301"
    name: "穿彻坚冰的烈芒"
    action_type: "basic"
    target_type: "single"
    damage_type: "fire"
    available_if: "res_magma_will < 4 && has_modifier($self, 'ULT_FREE_ENHANCED') < 1"   # 灼热意志≥4 或终极技免耗标记时普攻入口换为 800308（§3.8.1 互斥声明）
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},   # lv1..lv10 照抄 params（运行实档 lv6=100% ATK；E5 +1 → lv7=110%）
              {"atk": 1.0}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    toughness_dmg: 10      # 米游社五项：削韧 10（勘正⑧）
    skill_point_gain: 1    # 米游社「战技点 +1」
    energy_gain: 20        # tbgd=20 与米游社「回能20」一致（勘正⑨——draft 冲突注记过期）

  - action_id: "800302"
    name: "炽燃不灭的琥珀"
    action_type: "skill"
    target_type: "self"    # 非伤害技：自体减伤 + 全体敌人嘲讽；主作用域自体，敌方嘲讽走 hook target: all_enemies
    skill_point_cost: 1    # tbgd BPNeed sp_cost=1，与米游社「战技点 -1」一致
    energy_gain: 30        # tbgd=30 与米游社「回能 30」一致

  - action_id: "800303"
    name: "陷阵无回的炎枪"
    action_type: "ultimate"
    target_type: "aoe"
    damage_type: "fire"
    energy_cost: 120       # max_sp 全额消耗
    energy_gain: 5         # 施放后返还 5（tbgd=5 与米游社「回能 5」一致）
    toughness_dmg: 20      # 米游社五项：削韧 20（勘正⑧）
    scaling: [{"atk": 0.5, "def": 0.75}, {"atk": 0.55, "def": 0.825},   # lv1..lv15 照抄 params（lv10 = ATK 100% + DEF 150%；E5 +2 → lv12 = 110%+165%）
              {"atk": 0.6, "def": 0.9}, {"atk": 0.65, "def": 0.975},
              {"atk": 0.7, "def": 1.05}, {"atk": 0.75, "def": 1.125},
              {"atk": 0.8125, "def": 1.2188}, {"atk": 0.875, "def": 1.3125},
              {"atk": 0.9375, "def": 1.4062}, {"atk": 1.0, "def": 1.5},
              {"atk": 1.05, "def": 1.575}, {"atk": 1.1, "def": 1.65},
              {"atk": 1.15, "def": 1.725}, {"atk": 1.2, "def": 1.8},
              {"atk": 1.25, "def": 1.875}]

  - action_id: "800308"
    name: "穿彻坚冰的烈芒（强化）"
    action_type: "basic"
    target_type: "blast"
    damage_type: "fire"
    available_if: "res_magma_will >= 4 || has_modifier($self, 'ULT_FREE_ENHANCED') >= 1"   # ≥4 层或终极技免耗标记；与 800301 互斥（§3.8.1）
    scaling: [{"atk": 0.9}, {"atk": 0.99}, {"atk": 1.08}, {"atk": 1.17}, {"atk": 1.26},  # lv1..lv10 照抄 params #1 主目标（运行实档 lv6=135%；E5 → lv7=146.25%）
              {"atk": 1.35}, {"atk": 1.4625}, {"atk": 1.575}, {"atk": 1.6875}, {"atk": 1.8}]
    scaling_blast: [{"atk": 0.36}, {"atk": 0.396}, {"atk": 0.432}, {"atk": 0.468}, {"atk": 0.504},   # params #2 相邻目标（lv6=54%；E5 → lv7=58.5%）
                    {"atk": 0.54}, {"atk": 0.585}, {"atk": 0.63}, {"atk": 0.675}, {"atk": 0.72}]
    toughness_dmg: 20         # 米游社五项：主目标削韧 20（勘正⑧）
    toughness_dmg_blast: 10   # 米游社五项：相邻各 10（「削韧 20+10*2」）
    skill_point_gain: 1    # 米游社「战技点 +1」（强化普攻仍产点）
    energy_gain: 30        # tbgd=30 与米游社「回能 30」一致

hooks:
  # 天赋受击充能：每被击中 +1 层灼热意志（上限由资源 max 8 承担；after_being_hit 仅
  # 攻击命中发射——DoT 跳伤不走此事件，与「每受到1次攻击」文本口径一致）
  - event: "after_being_hit"
    condition: "$event.target == '8003'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "magma_will"
        amount: 1

  # 普攻/战技施放后 +1 层灼热意志（官方 800301/800302 文本「并叠加1层【灼热意志】」；
  # 800308 文本无叠加段——不补）
  - event: "on_action"
    condition: "$event.actor == '8003' && ($event.action_id == '800301' || $event.action_id == '800302') && !$event.insert"
    effects:
      - effect_type: "gain_resource"
        resource_id: "magma_will"
        amount: 1

  # 800302 战技：自身减伤 param 随档（lv10=50%，E3 lv12=52%——勘正①⑤；减伤持续回合
  # 官方文本未写，暂按 1 回合社区口径——待实测）
  - event: "on_action"
    condition: "$event.actor == '8003' && $event.action_id == '800302' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "AMBER_DMG_REDUCTION"
          name: "炽燃不灭的琥珀·减伤"
          modifier_type: "buff"
          duration: 1          # 待实测（文本未写——「持续#3回合」语法挂嘲讽侧）
          dispellable: False
          stat_effects: {"dmg_dmg_reduction": "param(800302, 1)"}   # 减伤乘区正值（克拉拉先例）；烘焙时 param 已按 E3 偏移取档
      # 嘲讽全体敌人：#2 全档恒 100% 基础概率 → 概率门可省；抵抗链（EHR/RES）无接线
      # 通道在案（待实测——命中为乐观上界）。forced_taunt 收编（勘正④——引擎键在库）
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "AMBER_TAUNT"
          name: "炽燃不灭的琥珀·嘲讽"
          modifier_type: "debuff"
          duration: 1          # param(800302,3) 全档恒 1（int 直给）
          dispellable: True
          forced_taunt: True   # 强制嘲讽：携带本件的敌人必须攻击火主（state.py 注「如火主战技」；波提欧先例）

  # 800303 终极技：施放后下一次普攻变为强化普攻且不消耗灼热意志（一次性标记，跨回合
  # 保留；持续时长文本未写 → duration 0 战斗内永续占位 + 800308 摘除链——波提欧
  # STANDOFF 同构）
  - event: "on_ultimate"
    condition: "$event.source == '8003' && $event.action == '800303'"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ULT_FREE_ENHANCED"
          name: "免耗强化一次"
          modifier_type: "buff"
          duration: 0          # 持续时长待实测（文本未写，按一次性标记占位）
          dispellable: False

  # 800308 强化普攻：无免耗标记时消耗 4 层灼热意志（同事件双钩互斥——condition 快照
  # 读事件开始旧值，二选一并发不双跑，幻视族谱 #9 口径）
  - event: "on_action"
    condition: "$event.actor == '8003' && $event.action_id == '800308' && !$event.insert && has_modifier($self, 'ULT_FREE_ENHANCED') < 1"
    effects:
      - effect_type: "gain_resource"
        resource_id: "magma_will"
        amount: -4
  - event: "on_action"
    condition: "$event.actor == '8003' && $event.action_id == '800308' && !$event.insert && has_modifier($self, 'ULT_FREE_ENHANCED') >= 1"
    effects:
      - effect_type: "remove_modifier"
        modifier_id: "ULT_FREE_ENHANCED"

  # 天赋 800304 群护盾：EN "uses Basic ATK, Skill, or Ultimate"——触发域三类全含
  #（含强化普攻，其仍是 Basic ATK）；shield 块 param 随档（勘正⑤——lv10=6%DEF+80，
  # E3 lv12=6.4%+89）；duration = param #2 全档恒 2（int 直给）；accumulate 同池
  #（E2 追加量同池叠算——池名/叠算模型待实测在案）；dispellable 文本未写 → 待实测
  - event: "on_action"
    condition: "$event.actor == '8003' && ($event.action_type == 'basic' || $event.action_type == 'skill' || $event.action_type == 'ultimate') && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "FTB_TALENT_SHIELD"
          name: "筑城者遗宝"
          modifier_type: "buff"
          duration: 2          # 全档恒 2 回合（int 直给）
          max_stack: 1         # 勘正⑩：E2 双钩重挂 refresh 层数空转——护盾值走 accumulate 池不读层
          dispellable: False   # 可否被驱散文本未写 → 待实测
          shield:
            scaling: {def_: "param(800304, 1)"}   # param 随档（B27#6——lv10=0.06，E3 lv12=0.064）
            flat: "param(800304, 4)"              # lv10=80，E3 lv12=89
            accumulate: "FTB_SHIELD"              # 同池加算（E2 追加量）；池名待实测

  # 大行迹 8003101 强援弱：使用战技后全体我方受伤害 -15%（params [[10, 0.15, 1]] 的
  # #2/#3 字面值，无等级轨道）——减伤乘区正值（勘正①）
  - event: "on_action"
    condition: "$event.actor == '8003' && $event.action_id == '800302' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "STRONG_DEFEND_WEAK"
          name: "强援弱"
          modifier_type: "buff"
          duration: 1          # #3=1 字面值
          dispellable: False
          stat_effects: {"dmg_dmg_reduction": 0.15}   # #2=0.15 字面值；多件乘算折叠（克拉拉同口径）

  # 大行迹 8003102 生先死：使用强化普攻后回复自身 5% 最大生命（params [[0.05]] 字面值）
  - event: "on_action"
    condition: "$event.actor == '8003' && $event.action_id == '800308' && !$event.insert"
    effects:
      - effect_type: "heal"
        target: "self"
        ratio: 0.05

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN；名字照 character_ranks.json（勘正②）
eidolons:
  E1:
    name: "大地芯髓的鸣动"
    hooks:
      # 普攻额外造成火伤 = 25% DEF；强化普攻 = 50% DEF（角色附加伤害——category:
      # "additional" 勘正⑦：吃常规乘区含双暴、不吃类型限定增伤；$event.target=主目标，
      # 强化普攻相邻是否同吃待实测）
      - event: "on_action"
        condition: "$event.actor == '8003' && $event.action_id == '800301' && !$event.insert"
        effects:
          - effect_type: "deal_damage"
            name: "大地芯髓的鸣动"
            target: "$event.target"
            damage_type: "fire"
            category: "additional"
            amount: "0.25 * stat_of($self, 'def_')"   # 面板键 def_（L1 词表——'def' 查无=静默 0 值，勘正⑬）
      - event: "on_action"
        condition: "$event.actor == '8003' && $event.action_id == '800308' && !$event.insert"
        effects:
          - effect_type: "deal_damage"
            name: "大地芯髓的鸣动"
            target: "$event.target"
            damage_type: "fire"
            category: "additional"
            amount: "0.5 * stat_of($self, 'def_')"
    notes:
      - "追加段是否独立判定削韧（deal_damage toughness 缺省 0）、强化普攻相邻目标是否同吃 → 待实测"
  E2:
    name: "古老寒铁的坚守"
    hooks:
      # 天赋护盾额外吸收量：+2% DEF + 27（与本盾同池加算——accumulate 同池名，池名待实测）
      - event: "on_action"
        condition: "$event.actor == '8003' && ($event.action_type == 'basic' || $event.action_type == 'skill' || $event.action_type == 'ultimate') && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "all_allies"
            modifier:
              modifier_id: "FTB_TALENT_SHIELD"
              name: "筑城者遗宝"
              modifier_type: "buff"
              duration: 2
              max_stack: 1
              dispellable: False
              shield:
                scaling: {def_: 0.02}     # 字面值（星魂无等级轨道）
                flat: 27
                accumulate: "FTB_SHIELD"  # 同池加算（与天赋件同 modifier_id+同池——重挂并入，勘正⑩）
  E3:
    name: "砌造未来的蓝图"
    skill_level_overrides: {"skill": 2, "talent": 2}   # 战技+2、天赋+2（≤15）
    notes:
      - "战技+2 随档：减伤 param(800302,1) 实取 lv12=0.52（勘正⑤——param 编译期取档自动生效）"
      - "天赋+2 随档：护盾 param(800304,1)/(800304,4) 实取 lv12=0.064/89（同上）"
  E4:
    name: "驻留文明的誓言"
    hooks:
      # 战斗开始立即获得 4 层灼热意志（开局即可强化普攻）
      - event: "on_battle_start"
        effects:
          - effect_type: "gain_resource"
            resource_id: "magma_will"
            amount: 4
  E5:
    name: "点燃光焰的勇气"
    skill_level_overrides: {"ultimate": 2, "basic": 1}   # 终结技+2（≤15）、普攻+1（≤10）
    notes:
      - "终结技+2：action 层 scaling 实取 lv12（ATK 110% + DEF 165%）；普攻+1：800301/800308 实取 lv7（110% / 146.25%+58.5%）"
  E6:
    name: "永屹城垣的壁垒"
    hooks:
      # 使用强化普攻或终结技后 DEF +10%，至多 3 层（持续时长文本未写 → duration 0
      # 战斗内永续占位，待实测）。stat_exprs 活读层数（勘正⑥——stat_effects 值不乘层，
      # 烘焙=三层名存实亡；桂乃芬 FIREKISS 先例）
      - event: "on_action"
        condition: "$event.actor == '8003' && ($event.action_id == '800308' || $event.action_id == '800303') && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_CITY_FORGING"
              name: "永屹城垣的壁垒"
              modifier_type: "buff"
              stacks: 1
              max_stack: 3
              stack_mode: "refresh"
              duration: 0       # 持续时长待实测（文本未写层数是否永久）
              dispellable: False
              stat_exprs:
                def_pct: "0.1 * stacks($self, 'E6_CITY_FORGING')"

scaling_notes:
  - "普攻/强化普攻换技能：灼热意志 ≥ 4 或 ULT_FREE_ENHANCED 标记在身时 800301 → 800308（available_if 互斥声明，§3.8.1 行动级可用条件；非形态机——不结束本回合/不授倒计时）"
  - "天赋护盾触发域按 EN 层裁定为 Basic ATK / Skill / Ultimate 三类全含（含强化普攻）——on_action condition 用 action_type 三值并集，非 action_id 白名单（800308 自动命中 basic；终结技由 _fire_ultimate 自动广播 on_action，B37 方案 A）"
  - "嘲讽 100% 基础概率：概率门省略合法，但敌方效果抵抗链未接线（hook apply_modifier 无 chance 槽——待收在案），命中率为乐观上界"
  - "800306「攻击」通用秘技兜底条目不落 actions（params 空）——破韧由引擎秘技默认通道承担"
  - "base_stats 一律照管线 calc_character_stats 实值终审（hp 1241.856/atk 601.524/def 606.375/spd 95）；行迹小节点百分比走 trace_stat_effects 不并入白值"
  - "modifier 数值槽一律 param() 随档或字面值：skill/talent 有等级轨道走 param（E3 自动 lv12），星魂/行迹/秘技无轨道走字面值"
