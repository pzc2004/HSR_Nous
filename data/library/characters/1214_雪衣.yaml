# 角色模板：雪衣（1214）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂勘正五件+回滚一件（staging+fixture 同步）：
#   ① 业报上限字面化——draft 以 _karma_cap 资源承载上限却未初始化（缺省
#     初值 0 → 判定 res+1>=0 恒触发）；先补主干 on_battle_start set 8，又
#     探针钓出**秘技等装填钩先于主干初始化钩**（秘技 2 目标削韧时 cap 仍
#     0 → 连触两次，e1=221+747×2 实证）——「资源+装填钩初始化」承载上限
#     构造性不安全；正解上限字面化（主干钩 res+1>=8 / E6 钩 res+1>=6，
#     两钩互斥：k=6 时主干 7<8 不过、E6 7>=6 触发），_karma_cap 删除
#   ② 明察 stat_effects→stat_exprs 动态——draft「BE 重估通道缺」误判一次性
#     烘焙（1210 FIREKISS 先例：面板读取即重估，E4 击破特攻 +40% 自动跟随）
#   ③ E1 乘区归属——draft 写进 amount 倍率区（与明察大增伤区共存时失真
#     (1+X)×1.4≠(1+X+0.4)）；正解 dmg_follow_up_dmg_boost 类型桶（hook
#     deal_damage 伪行动缺省归 follow_up 类可命中）
#   ④ 追击回能 +2 收录——draft「hook 侧回能通道缺」误判翻案（gain_energy
#     内建通道，1207/1210/1211/1213 四连先例）；整套一次 +2 粒度在案
#   ⑤ 灼见主机记账池删除——_karma_overflow 只进不出错误结构；同步模型
#     逐事件 +1 恒不截断（触发即清零后续从 0 累），溢出构造性不实例化、
#     官方回填语义等价于清零——+N 族到达再按回填重收
#   ⑥【回滚在案】触发判定 res+1>=cap——过堂一度误判「双加提前一层」改 -1，
#     探针钓出 emit 类事件**条件快照求值后统一跑效果**（hooks.py
#     _run_event_hooks_snapshot）：condition 读事件开始时旧值，+1 补偿
#     本事件计数钩入账正是易踩坑清单「快照 off-by-one」正族——draft 本对，
#     已回滚注记（教训：同事件两钩≠同钩 effects 序，两种 off-by-one 场景
#     相反，先验快照语义再下笔）
#
# 收录：普攻破魔锥 / 战技摄伏诸恶（主 1.4 邻 0.7 lv10）/ 天赋业报（我方
#       削韧每次 +1 层 cap 8，满即消耗发动追击 3 弹射 ×0.9 lv10——弹射削韧
#       不带防回流 ✓ + 回能 +2）/ 终结技天罚贯身（2.5 lv10 + 无视弱点削韧
#       40 toughness_scope all）/ 大行迹明察（增伤=100%×BE cap 240% 动态）/
#       无畏轴承（韧性读取通道缺待收）/ 灼见主机（结构删除在案）/ 秘技斩立决
#       （全体 80%+削韧 20）/ E1 追击增伤 40%（follow_up 桶）/ E2 追击回血
#       5%（整套粒度在案）/ E3/E5 等级族 / E4 终结技后 BE+40% 2 回合 /
#       E6 业报 cap 6
# 待收（均带挡因）：无畏轴承韧性判据（toughness_of 通道缺）/ 终结技削韧
#       增伤（同通道缺）/ E2 无视弱点削韧+量子击破（星魂档 action 覆写通道
#       缺+hook 伤害无 action_id 挂点）/ 追击削韧值（官方 tag 与 3 跳结构
#       不吻不采用）/ 追击回能粒度 / E2 回血粒度 / 行迹属性节点（未下发）
