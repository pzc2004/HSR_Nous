  - "大行迹 1214102「无畏轴承」待收：目标当前削韧 ≥ 最大削韧 50% 时终结技伤害 +10%（params_max [0.5, 0.1]）——挡因：宿主函数表无 toughness_of/韧性读取通道，条件无法求值；边界判定（含 50% 端点/已击破目标）官方文本未明示 → 待实测"
  - "大行迹 1214103「灼见主机」结构删除：同步模型逐事件 +1 恒不截断（触发即清零后续从 0 累）——溢出构造性不实例化，官方回填语义等价于清零；draft 记账池只进不出+双 +1 偏移已废（探针实证 cap 未初始化恒触发）——+N 族到达再按回填重收"
  - "本角色无免死、无免疫、无复活机制（三大行迹全评均无），不得虚构"
  - "天赋追击回能 +2（tbgd）已收：gain_energy 内建通道（draft「hook 侧回能通道缺」误判翻案——1207/1210/1211/1213 四连先例）；整套一次 +2 保守读，粒度待实测"
  - "天赋追击削韧量待收：米游社 tag「10+5*2」与官方「3 次随机弹射」结构不吻合，fandom 全空 → 不采用（hook 伤害暂不带 toughness_dmg，同时天然满足官方「追击不再叠业报」的防回流要求）"
  - "终结技 121403 削韧增伤（lv10 #2=0.15、上限 #3=60%）待收：挡因——宿主函数表无韧性读取（toughness_of 缺），无法按「本次削韧量」求值增伤；官方亦未给每点削韧=系数还是分段函数 → 待实测后补 hook"
  - "星魂 E2「天赋追击无视弱点属性削韧 + 击破时触发量子击破效果」待收——挡因：星魂档覆写 action 键无通道（eidolons overrides 仅消费 state_config），且追击走 hook 伤害（无 action_id 可挂 toughness_scope）；首个非量子弱点实例到达时再收"
  - "星魂 E2 粒度读法：天赋追击回血 5% 最大生命按「整套追击 1 次 5%」保守读——官方文本未明示每跳粒度 → 待实测 B19 候选；旗标承载，触发链内结算"
  - "星魂 E3 取档口径：战技 lv15 = 175%/87.5%（scaling/scaling_blast 实取 lv15 档）；普攻 lv10 = 140%（实取 lv10 档）"
