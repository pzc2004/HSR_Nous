eidolons:
  E1:
    name: "Dvesha, Inhibited"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_FOLLOWUP_DMG"
              name: "Dvesha, Inhibited"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              # 追击增伤 40% 归 follow_up 类型桶（hook deal_damage 伪行动缺省归
              # follow_up 类可命中——draft 写进 amount 倍率区：与明察大增伤区
              # 共存时失真（(1+X)×1.4≠(1+X+0.4)）已勘正）
              stat_effects: {"dmg_follow_up_dmg_boost": 0.4}
  E2:
    name: "Klesha, Breached"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_BREAK_FOLLOWUP"
              name: "Klesha, Breached"
              modifier_type: "buff"
              duration: 0
              dispellable: False
  E3:
    name: "Duḥkha, Ceased"
    skill_level_overrides: {"skill": 2, "basic": 1}
  E4:
    name: "Karma, Severed"
    hooks:
      - event: "on_ultimate"
        condition: "$event.source == '1214' && $event.action == '121403'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_BREAK_EFFECT"
              name: "Karma, Severed"
              modifier_type: "buff"
              duration: 2
              dispellable: True
              stat_effects: {"break_effect": 0.4}
  E5:
    name: "Deva, Enthralled"
    skill_level_overrides: {"ultimate": 2, "talent": 2}
  E6:
    name: "Saṃsāra, Mastered"
    hooks:
      # cap 6 字面化判定（与主干钩互斥：k=6 时主干 7<8 不过、本钩 7>=6 触发——
      # _karma_cap 资源承载已废：秘技等装填钩先于主干初始化钩，cap 未初始化期
      # 恒触发（秘技 2 目标削韧连触两次探针实证）；上限字面化是同时序免疫的唯一形）
      - event: "on_toughness_damage"
        condition: "actor_type_of($event.source) != 'monster' && res__karma + 1 >= 6"
        effects:
          - effect_type: "deal_damage"
            name: "十王圣断，业报恒常"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "quantum"
            amount: "param(121404, 2) * $self.atk"
          - effect_type: "deal_damage"
            name: "十王圣断，业报恒常"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "quantum"
            amount: "param(121404, 2) * $self.atk"
          - effect_type: "deal_damage"
            name: "十王圣断，业报恒常"
            target: {pool: "enemies", take: 1, mode: "random"}
            damage_type: "quantum"
            amount: "param(121404, 2) * $self.atk"
          - effect_type: "heal"
            target: "self"
            amount: "has_modifier($self, 'E2_BREAK_FOLLOWUP') * 0.05 * $self.max_hp"
          - effect_type: "gain_energy"
            target: "self"
            amount: 2
          - effect_type: "set_resource"
            resource_id: "_karma"
            amount: 0

hooks:
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "XUEYI_CLAIRVOYANT"
          name: "明察"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          # stat_exprs 动态重估（1210 FIREKISS 先例——E4 击破特攻 +40% 时自动跟随；
          # draft stat_effects 一次性烘焙+「重估通道缺」误判——通道一直在）
          stat_exprs:
            all_dmg: "min($self.break_effect, 2.4)"

  - event: "on_toughness_damage"
    condition: "actor_type_of($event.source) != 'monster'"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_karma"
        amount: "param(121404, 3)"

  - event: "on_toughness_damage"
    condition: "actor_type_of($event.source) != 'monster' && res__karma + 1 >= 8"
    effects:
      # 快照 off-by-one（emit 类事件「条件快照求值后统一跑效果」——hooks.py
      # _run_event_hooks_snapshot）：本 condition 读的是事件开始时旧值，+1 补偿
      # 本事件计数钩的入账（易踩坑清单同族——Welt/驭空先例；draft 此处本对，
      # 过堂一度误判已回滚）；上限字面 8（_karma_cap 资源承载已废——装填钩先于
      # 主干初始化钩，cap 未初始化期恒触发：秘技 2 目标削韧连触两次探针实证）；
      # 溢出记账结构删除（同步模型逐事件 +1 恒不截断——溢出构造性不实例化；
      # 官方灼见主机回填语义等价于清零，+N 族到达再收）
      - effect_type: "deal_damage"
        name: "十王圣断，业报恒常"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "quantum"
        amount: "param(121404, 2) * $self.atk"
      - effect_type: "deal_damage"
        name: "十王圣断，业报恒常"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "quantum"
        amount: "param(121404, 2) * $self.atk"
      - effect_type: "deal_damage"
        name: "十王圣断，业报恒常"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "quantum"
        amount: "param(121404, 2) * $self.atk"
      - effect_type: "heal"
        target: "self"
        amount: "has_modifier($self, 'E2_BREAK_FOLLOWUP') * 0.05 * $self.max_hp"
      # 天赋追击回能 +2（tbgd——整套一次保守读，粒度待实测；gain_energy 通道
      # 翻案：draft「hook 侧回能通道缺」误判，1207/1210/1211/1213 四连先例）
      - effect_type: "gain_energy"
        target: "self"
        amount: 2
      # 消耗全部业报（官方「消耗所有业报」——同步模型回填恒 0）
      - effect_type: "set_resource"
        resource_id: "_karma"
        amount: 0

