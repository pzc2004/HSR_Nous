  - "削韧权威源缺位：fandom 本角色字段全空 → 全部削韧档按米游社 sub_tag 暂录并标待 fandom 校验（普攻 10 / 战技 20+10×2 / 终结技 40 / 秘技 20 / 天赋追击米游社 tag 与 3 跳结构不吻 → 不采用）"
  - "大行迹 1214102 与终结技削韧增伤两处韧性读取机制待收（挡因：无韧性读取宿主函数通道）；E2 追击无视弱点削韧待收（挡因：星魂档 action 键覆写通道缺 + hook 伤害无 action_id 挂点）"
