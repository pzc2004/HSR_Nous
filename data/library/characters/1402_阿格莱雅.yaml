    target_type: "blast"
    damage_type: "thunder"
    available_if: "res__stance >= 1"      # 仅至高之姿可用（140201 同槽替换）
    scaling: [{"atk": 1.0}, {"atk": 1.2}, {"atk": 1.4}, {"atk": 1.6}, {"atk": 1.8},
              {"atk": 2.0}, {"atk": 2.2}, {"atk": 2.4}, {"atk": 2.6}, {"atk": 2.8}]
    scaling_blast: [{"atk": 0.45}, {"atk": 0.54}, {"atk": 0.63}, {"atk": 0.72}, {"atk": 0.81},
                    {"atk": 0.9}, {"atk": 0.99}, {"atk": 1.08}, {"atk": 1.17}, {"atk": 1.26}]
    toughness_dmg: 20           # tbgd stance 60/3=20 + 米游社削韧 20 互证（draft 10 勘正⑦）
    toughness_dmg_blast: 10     # tbgd stance 30/3=10（draft 5 勘正⑦）
    skill_point_gain: 0         # 官方 EN 明示 "cannot recover Skill Points" + tbgd sp_gain=0
    energy_gain: 20             # tbgd

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN（名字全部 character_ranks.json 终审）
eidolons:
  E1:
    name: "飘曳金星的行列"
    hooks:
      # ① 间隙织线目标受到伤害 +15%——受击事件按目标带标追加真伤段 0.15×原伤害
      # （category "true" 跳乘区=与"受到伤害+15%"数值等值；昔涟 141502 结界先例）。
      # 防递归：damage_type != 'true'（真伤段自身发射带 'true' 结构性出集）
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.damage_type != 'true' && actor_type_of($event.target) == 'monster' && actor_type_of($event.source) != 'monster' && has_modifier($event.target, 'SEAM_STITCH') >= 1"
        effects:
          - effect_type: "deal_damage"
            name: "飘曳金星的行列"
            target: "$event.target"
            damage_type: "true"
            category: "true"
            amount: "0.15 * $event.amount"
      # ② 阿格莱雅或衣匠攻击间隙织线目标后额外回能 20——按攻击行动每次 1 段口径
      # （action_type 白名单：附加段 'additional'/连携子段结构性出集——多段/连携
      # 场景频次待实测在案；回能归阿格莱雅——忆灵共享能量池引擎重定向同口径）
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.damage_type == 'thunder' && ($event.source == '1402' || $event.source == '1402_garmentmaker') && ($event.action_type == 'basic' || $event.action_type == 'memosprite_skill') && has_modifier($event.target, 'SEAM_STITCH') >= 1"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 20
  E2:
    name: "行舟命运的眼睑"
    hooks:
      # ① 阿格莱雅或衣匠行动时 → 双方无视防御 +14%/层（至多 3 层）——def_pen 在案键
      # （def_multi zone；draft 误判"无通道"待收，勘正⑨）。行动域="行动时"（终结技
      # 施放非行动——action_type != 'ultimate' 剔除）；层数池挂阿格莱雅+烘焙双件
      # （蒙福者烘焙：挂点读现场层数——同钩先 gain 后用，23 章同钩序读口径）
      - event: "on_action"
        condition: "($event.actor == '1402' || $event.actor == '1402_garmentmaker') && !$event.insert && $event.action_type != 'ultimate' && res__e2_stacks < 3"
        effects:
          - effect_type: "gain_resource"
            resource_id: "_e2_stacks"
            amount: 1
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E2_DEF_PEN"
              name: "行舟命运的眼睑"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              stat_effects: {"def_pen": "0.14 * min(res__e2_stacks, 3)"}
          - effect_type: "apply_modifier"     # 衣匠不在场=空池 no-op（重召由下方 actor_enter 补挂）
            target: {pool: "allies", where: "$it.actor_id == '1402_garmentmaker'"}
            modifier:
              modifier_id: "E2_DEF_PEN_GM"
              name: "行舟命运的眼睑·衣匠"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              stat_effects: {"def_pen": "0.14 * min(res__e2_stacks, 3)"}
      # ② 清零域：除自身与衣匠外任意单位主动施放技能时（EN "actively uses an ability"
      # 含终结技——B37 uses-ability 域裁定在案；插入行动非"主动施放"剔除）
      - event: "on_action"
        condition: "$event.actor != '1402' && $event.actor != '1402_garmentmaker' && !$event.insert && res__e2_stacks >= 1"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e2_stacks"
            amount: 0
          - effect_type: "remove_modifier"
            target: "self"
            modifier_id: "E2_DEF_PEN"
          - effect_type: "remove_modifier"
            target: {pool: "allies", where: "$it.actor_id == '1402_garmentmaker'"}
            modifier_id: "E2_DEF_PEN_GM"
      # ③ 衣匠重召补挂（层数池挂阿格莱雅的账——跨重召保留）
      - event: "actor_enter"
        condition: "$event.actor == '1402_garmentmaker' && $event.reason == 'summon' && res__e2_stacks >= 1"
        effects:
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id == '1402_garmentmaker'"}
            modifier:
              modifier_id: "E2_DEF_PEN_GM"
              name: "行舟命运的眼睑·衣匠"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              stat_effects: {"def_pen": "0.14 * min(res__e2_stacks, 3)"}
  E3:
    name: "华珠凝滞的礼物"
    skill_level_overrides: {"basic": 1, "skill": 2, "memosprite_talent": 1}   # 普攻+1 / 战技+2 / 忆灵天赋+1
    notes:
      - "普攻+1：level_key=basic 双挂载——140201/140208 同吃（实取 lv7 档：默认 6+1，勘正⑩）；战技+2：140202/140209 实取 lv12（默认 10+2——heal 比例 param(140209,1) lv12=0.55 随档）"
      - "忆灵天赋+1：官方 10 档上限无第 11 档——param() 钳表尾+⚠编译警告口径（不脑补数值）"
  E4:
    name: "大理石内的闪烁"
    hooks:
      # ① 速度层上限 +1（6→7）② 阿格莱雅攻击后也可叠层——基础轨（模板钩）仅衣匠侧
      # 放行至 6；本钩放行：阿格莱雅攻击全程（<7）+ 衣匠第 7 层（>=6 且 <7）——
      # 与基础轨互斥不双计（快照条件：基础轨 <6 与本钩 >=6 分段，勘正⑧）
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.damage_type == 'thunder' && res__gm_on_field >= 1 && (($event.source == '1402' && $event.action_type == 'basic') || ($event.source == '1402_garmentmaker' && $event.action_type == 'memosprite_skill' && res__spd_stacks >= 6)) && has_modifier($event.target, 'SEAM_STITCH') >= 1 && res__spd_stacks < 7"
        effects:
          - effect_type: "gain_resource"
            resource_id: "_spd_stacks"
            amount: 1
          - effect_type: "apply_modifier"     # 衣匠侧固定速度层同步刷新（replace 烘焙值）
            target: {pool: "allies", where: "$it.actor_id == '1402_garmentmaker'"}
            modifier:
              modifier_id: "GM_SPD_STACKS"
              name: "泪水锻造的匠躯"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              stat_effects: {"spd": "param(1140203, 1) * min(res__spd_stacks, 7)"}
      # ② 至高之姿 SPD% 同步刷新（仅姿态内——条件 res__stance >= 1 快照读，姿态由
      # 终结技先行事件建立；烘焙读现场层数=基础轨 gain 后新值，声明序在案）
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.damage_type == 'thunder' && res__gm_on_field >= 1 && res__stance >= 1 && (($event.source == '1402' && $event.action_type == 'basic') || ($event.source == '1402_garmentmaker' && $event.action_type == 'memosprite_skill' && res__spd_stacks >= 6)) && has_modifier($event.target, 'SEAM_STITCH') >= 1 && res__spd_stacks < 7"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "SUPREME_SPD_PCT"
              name: "至高之姿·速度层数"
              modifier_type: "buff"
              stack_mode: "replace"
              duration: 0
              dispellable: False
              stat_effects: {"spd_pct": "param(140203, 1) * min(res__spd_stacks, 7)"}
  E5:
    name: "漆黑苦难的织者"
    skill_level_overrides: {"ultimate": 2, "talent": 2, "memosprite_skill": 1}   # 终结技+2 / 天赋+2 / 忆灵技+1
    notes:
      - "终结技+2：SPD%/层随档 param(140203,1)（lv12=0.16）；天赋+2：附加伤害随档 param(140204,1)（lv12=0.336）——衣匠 HP 比/定值 #5/#6 烘焙在 summons base_stats（非 hook 数值槽——05_effects §5.1 边界在案，维持字面值）"
      - "忆灵技+1：官方 10 档上限无第 11 档——param() 钳表尾+⚠编译警告口径"
  E6:
    name: "盈虚无常的金线"
    hooks:
      # 至高之姿下雷属性抗性穿透 +20%（双方——res_pen 挂攻击侧，在案键；进场/开大挂、
      # 衣匠消失摘阿格莱雅侧（衣匠侧随离场灭）；单通道 on_action——B37 方案 A 终结技同发）
      - event: "on_action"
        condition: "$event.actor == '1402' && $event.action_id == '140203' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_THUNDER_RES_PEN"
              name: "盈虚无常的金线"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"res_pen": 0.2}
          - effect_type: "apply_modifier"
            target: {pool: "allies", where: "$it.actor_id == '1402_garmentmaker'"}
            modifier:
              modifier_id: "E6_THUNDER_RES_PEN_GM"
              name: "盈虚无常的金线·衣匠"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              stat_effects: {"res_pen": 0.2}
    notes:
      - "连携攻击（140208 Joint ATK）伤害按双方 SPD > 160/240/320 提升 10%/30%/60% 待收——挡因：单技能增伤通道缺（all_dmg 是全技能口径会误伤刺纹之陷/天赋附加段；dmg_bonus_by_type 需 action 层 joint 标签挂载键——未接线）+ 动态双阈值 SPD 判定与「双方」合取语义未接线"

hooks:
  # ===== 大行迹 1402103「飞驰之阳」：战斗开始能量 < 50%（175/350）→ 补至 175 =====
  # （秘技装填预置先于模板钩——先 +30 再按 175 钳补，18.3 队列序在案）
  - event: "on_battle_start"
    condition: "$self.energy < 175"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: "175 - $self.energy"

  # ===== 140202 战技（Summon 版）：召唤衣匠 + 自身立即行动 =====
  - event: "on_action"
    condition: "$event.actor == '1402' && $event.action_id == '140202' && !$event.insert"
    effects:
      - effect_type: "summon"
        summon_id: "1402_garmentmaker"
      - effect_type: "advance_action"      # 自我拉条 100%（官方"并使自身立即行动"）
        target: "self"
        amount: 100

  # ===== 140209 战技（Restore 版）：恢复衣匠 #1 其最大生命（lv10=50%；E3 → lv12=55% 随档） =====
  - event: "on_action"
    condition: "$event.actor == '1402' && $event.action_id == '140209' && !$event.insert"
    effects:
      - effect_type: "heal"
        target: {pool: "allies", where: "$it.actor_id == '1402_garmentmaker'"}
        amount: "param(140209, 1) * $target.max_hp"   # $target 逐目标求值——05_effects
                                                    # 治疗族首实例（本角色战技即在案引例）

  # ===== 140203 终结技（单通道 on_action——B37 方案 A）：召唤/回满衣匠 + 进入至高之姿
  # + 速度层数转化 + 短视之惩双件 + 衣匠免控 + 自身立即行动 =====
  - event: "on_action"
    condition: "$event.actor == '1402' && $event.action_id == '140203' && !$event.insert"
    effects:
      - effect_type: "summon"              # 衣匠已在场=重复召唤 no-op（引擎口径），下行回满承接
        summon_id: "1402_garmentmaker"
      - effect_type: "heal"                # 官方"若衣匠已在场，则使其生命值回复至上限"
        target: {pool: "allies", where: "$it.actor_id == '1402_garmentmaker'"}
        amount: "$target.max_hp"
      - effect_type: "set_resource"
        resource_id: "_stance"
        amount: 1
      - effect_type: "apply_modifier"      # 至高之姿标记（战技锁/强化普攻可用条件的读源）
        target: "self"
        modifier:
          modifier_id: "SUPREME_STANCE"
          name: "至高之姿"
          modifier_type: "buff"
          duration: 0
          dispellable: False
      - effect_type: "apply_modifier"      # 每层 SPD +#1%（lv10=15%/层）× 当前速度层数——
        target: "self"                     # 蒙福者烘焙（挂点读现场层数；后续叠层由刷新钩重烘，
        modifier:                          # 无 enable_if——条件件不进短视之惩的无条件件面板读域，
          modifier_id: "SUPREME_SPD_PCT"   # 姿态外不挂由刷新钩 stance 闸+离场摘除双保险承载）
          name: "至高之姿·速度层数"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          stat_effects: {"spd_pct": "param(140203, 1) * min(res__spd_stacks, 7)"}
      - effect_type: "apply_modifier"      # 1402101 短视之惩·阿格莱亚索件：ATK += 7.2%×自身
        target: "self"                     # 速度 + 3.6%×衣匠速度（stat_exprs 现场求值——速度层
        modifier:                          # 变档即随档；$self.spd 读无条件件面板=含至高之姿
          modifier_id: "MYOPIC_DOOM_ATK"   # SPD% 件；勘正④——draft scaling_effects 死键+误判
          name: "短视之惩"                 # 跨主体未接线）
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            atk: "0.072 * $self.spd + 0.036 * stat_of('1402_garmentmaker', 'spd')"
      - effect_type: "apply_modifier"      # 1402101 短视之惩·衣匠件（同式双件各挂——1409
        target: {pool: "allies", where: "$it.actor_id == '1402_garmentmaker'"}
        modifier:                          # 暴风停歇双件先例；$self=衣匠）
          modifier_id: "MYOPIC_DOOM_ATK_GM"
          name: "短视之惩·衣匠"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            atk: "0.072 * stat_of($self.summoner_id, 'spd') + 0.036 * $self.spd"
      - effect_type: "apply_modifier"      # 衣匠免疫控制类负面状态（EN "immune to Crowd
        target: {pool: "allies", where: "$it.actor_id == '1402_garmentmaker'"}
        modifier:                          # Control debuffs"；grants_immune control 词表在案）
          modifier_id: "GM_CC_IMMUNE"
          name: "至高之姿·衣匠免控"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          grants_immune: ["control"]
      - effect_type: "advance_action"      # 自身立即行动（官方：只拉自己，不拉衣匠）
        target: "self"
        amount: 100

  # ===== 天赋 140204·挂标：衣匠在场时阿格莱雅施放攻击使**目标**陷入「间隙织线」——
  # on_action 主目标口径（$event.target=行动主目标；勘正⑫——draft 走 on_hp_decrease
  # 逐目标事件，blast 末段相邻目标抢标）。单目标覆盖（EN "only takes effect on the
  # most recently inflicted target"）：先清全敌旧标再挂新标
  - event: "on_action"
    condition: "$event.actor == '1402' && $event.action_type == 'basic' && !$event.insert && res__gm_on_field >= 1"
    effects:
      - effect_type: "remove_modifier"
        target: "all_enemies"
        modifier_id: "SEAM_STITCH"
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "SEAM_STITCH"
          name: "间隙织线"
          modifier_type: "debuff"
          duration: 0
          dispellable: True

  # ===== 天赋 140204·附加段：攻击带「间隙织线」的敌人后追加雷属性附加伤害 = #1 × ATK
  # （lv10=30%，param 随档）+ 附加段命中回能 10（tbgd 140204 energy_gen=10 权威——FUA 族
  # 口径，触发归属待实测在案，勘正⑬）。category "additional"（决策卡 #19：不吃类型限定
  # 增伤）——段事件 action_type='additional' 结构性出集本钩（白名单 'basic'）与叠层/
  # E1 回能各钩=防递归由白名单承载（勘正⑪，替代 draft _add_dmg_lock 闩）。衣匠在场伞
  # 口径：天赋整段"衣匠在场时"——衣匠消失后织线存续期是否仍触发待实测在案
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && $event.damage_type == 'thunder' && $event.source == '1402' && $event.action_type == 'basic' && res__gm_on_field >= 1 && has_modifier($event.target, 'SEAM_STITCH') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "金玫之指"
        target: "$event.target"
        damage_type: "thunder"
        category: "additional"
        amount: "param(140204, 1) * $self.atk"
      - effect_type: "gain_energy"
        target: "self"
        amount: 10

  # ===== 忆灵天赋 1140203·叠层（基础轨）：**衣匠**攻击带「间隙织线」的敌人后速度层 +1
  # （#1 固定值/层，lv6=55——官方"使自身的速度提高"主语=衣匠；阿格莱雅侧叠层是 E4
  # 权能，勘正⑧），基础轨放行 <6 层（快照条件读事件开始旧值——增益后 ≤6）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && $event.damage_type == 'thunder' && $event.source == '1402_garmentmaker' && $event.action_type == 'memosprite_skill' && res__gm_on_field >= 1 && has_modifier($event.target, 'SEAM_STITCH') >= 1 && res__spd_stacks < 6"
    effects:
      - effect_type: "gain_resource"
        resource_id: "_spd_stacks"
        amount: 1
      - effect_type: "apply_modifier"      # 衣匠侧固定速度层刷新（replace 整换重烘——
        target: {pool: "allies", where: "$it.actor_id == '1402_garmentmaker'"}
        modifier:                          # 同钩先 gain 后用，烘焙读现场新值）
          modifier_id: "GM_SPD_STACKS"
          name: "泪水锻造的匠躯"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          stat_effects: {"spd": "param(1140203, 1) * min(res__spd_stacks, 7)"}

  # ===== 至高之姿 SPD% 刷新（仅姿态内——条件 res__stance >= 1 快照读；声明序在叠层
  # 钩之后=烘焙读增益后新值；姿态外不刷新由本闸承载、姿态解除由 actor_exit 摘除承载）
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && $event.damage_type == 'thunder' && $event.source == '1402_garmentmaker' && $event.action_type == 'memosprite_skill' && res__gm_on_field >= 1 && res__stance >= 1 && has_modifier($event.target, 'SEAM_STITCH') >= 1 && res__spd_stacks < 6"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SUPREME_SPD_PCT"
          name: "至高之姿·速度层数"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          stat_effects: {"spd_pct": "param(140203, 1) * min(res__spd_stacks, 7)"}

  # ===== 衣匠被召唤（1140205 飞驰之夏）：自身行动提前 100%（拉的是衣匠）+ 置在场闩
  # + 速度层烘焙件回挂（织运之竭：重召按保留层数恢复——读现场层数烘焙） =====
  - event: "actor_enter"
    condition: "$event.actor == '1402_garmentmaker' && $event.reason == 'summon'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_gm_on_field"
        amount: 1
      - effect_type: "advance_action"
        target: {pool: "allies", where: "$it.actor_id == '1402_garmentmaker'"}
        amount: 100
      - effect_type: "apply_modifier"
        target: {pool: "allies", where: "$it.actor_id == '1402_garmentmaker'"}
        modifier:
          modifier_id: "GM_SPD_STACKS"
          name: "泪水锻造的匠躯"
          modifier_type: "buff"
          stack_mode: "replace"
          duration: 0
          dispellable: False
          stat_effects: {"spd": "param(1140203, 1) * min(res__spd_stacks, 7)"}

  # ===== 衣匠消失（1140206 枯草之盈 + 1402102 织运之竭 + 解除至高之姿） =====
  - event: "actor_exit"
    condition: "$event.actor == '1402_garmentmaker'"
    effects:
      - effect_type: "set_resource"
        resource_id: "_gm_on_field"
        amount: 0
      - effect_type: "gain_energy"         # 枯草之盈：为阿格莱雅回能 #1=20（全档 20）
        target: "self"
        amount: "param(1140206, 1)"
      - effect_type: "set_resource"        # 织运之竭：速度层数最多保留 1 层
        resource_id: "_spd_stacks"
        amount: "min(res__spd_stacks, 1)"
      - effect_type: "set_resource"        # 衣匠消失 → 解除至高之姿（官方原文）
        resource_id: "_stance"
        amount: 0
      - effect_type: "remove_modifier"
        target: "self"
        modifier_id: "SUPREME_STANCE"
      - effect_type: "remove_modifier"
        target: "self"
        modifier_id: "SUPREME_SPD_PCT"
      - effect_type: "remove_modifier"
        target: "self"
        modifier_id: "MYOPIC_DOOM_ATK"
      - effect_type: "remove_modifier"
        target: "self"
        modifier_id: "E6_THUNDER_RES_PEN"

summons:
  "1402_garmentmaker":
    name: "衣匠"
    control: "auto"        # 全自动（行动时自动施放刺纹之陷——官方 auto；
                           # 优先织线目标待收：prefer_target 词表仅 owner_last_target）
    inheritance: ["atk", "def", "crit_rate", "crit_dmg", "break_effect", "effect_hit",
                  "effect_res", "max_energy", "energy_regen", "taunt", "dmg_bonus"]
    # 部分继承（12.4 通用约定"其余面板继承忆师"的落地形——1413/1415 先例）：atk/def/
    # 暴击等随忆师白值快照；hp/spd 由 140204 #4/#5/#6 单独定义维持烘焙——双段动态
    # 通道缺（max_hp_ratio 仅比例无 flat 加项、无 spd 比例槽，待收在案；E5 天赋+2
    # 变档 0.704/828 同属烘焙边界）
    base_stats:
      hp: 1539.625         # = 阿格莱雅 1241.856 × 0.66（talent lv10 #5）+ 720（#6）
      spd: 35.7            # = 102 × 0.35（talent #4——无速度行迹/遗器口径烘焙）；
                           # 速度层由 GM_SPD_STACKS 修饰（#1 固定值/层）
      atk: 698.544         # 继承列表覆写——本行仅静态校验锚（1413/1415 同例）
    actions:
      - action_id: "1140201"
        name: "刺纹之陷"
        action_type: "memosprite_skill"
        target_type: "blast"
        damage_type: "thunder"
        scaling: [{"atk": 0.55}, {"atk": 0.66}, {"atk": 0.77}, {"atk": 0.88}, {"atk": 0.99},
                  {"atk": 1.1}, {"atk": 1.21}, {"atk": 1.32}, {"atk": 1.43}, {"atk": 1.54}]
        scaling_blast: [{"atk": 0.33}, {"atk": 0.396}, {"atk": 0.462}, {"atk": 0.528}, {"atk": 0.594},
                        {"atk": 0.66}, {"atk": 0.726}, {"atk": 0.792}, {"atk": 0.858}, {"atk": 0.924}]
        toughness_dmg: 10        # 米游社 sub_tag "削韧10+5*2"（主 10/相邻 5；fandom 缺——单源待实测）
        toughness_dmg_blast: 5
        energy_gain: 10          # 米游社 "回能 10"（tbgd 忆灵技 null——照米游社；归忆师共享池，待实测）
        skill_point_gain: 0      # tbgd null + 社区无点按记录——保守 0，待实测

