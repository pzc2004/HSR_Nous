# 随机 1 敌挂「间隙织线」——全件走战前装填预置队列（18.3：选中秘技进战才发；
# draft 把后三件落模板级 on_battle_start 无条件钩=白送，勘正⑤）。params 单档 [1, 30] 字面化
techniques:
  - technique_id: "140207"
    name: "披星百裂"
    point_cost: 1
    effects:
      - effect_type: "summon"
        summon_id: "1402_garmentmaker"
      - effect_type: "gain_energy"
        target: "self"
        amount: 30                     # #2 进战回能 30（tbgd/米游社一致）
      - effect_type: "deal_damage"
        name: "披星百裂"
        target: "all_enemies"
        damage_type: "thunder"
        amount: "1.0 * $self.atk"      # #1 全体 100% ATK（无等级轨道——字面值）
        toughness_dmg: 20              # 米游社削韧 20（单源——进战削韧，待实测）
      - effect_type: "apply_modifier"  # 随后使敌方随机目标陷入「间隙织线」（官方 random 明示；
                                       # expected 模式 mode:random 退化为序取——1217/1220 同口径）
        target: {pool: "enemies", take: 1, mode: "random"}
        modifier:
          modifier_id: "SEAM_STITCH"
          name: "间隙织线"
          modifier_type: "debuff"
          duration: 0
          dispellable: True

