# 角色模板：阿格莱雅（1402）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging 1402_阿格莱雅）+ 过堂勘正（staging→fixtures 合并
# 流水线）。官方对照：query-game-data + starrailres cn json（character_skills /
# character_ranks / character_skill_trees）+ tbgd + 米游社五项标签。
#
# 过堂勘正清单（draft 病 → 正解）：
#   ① 星魂幻名 ×6——E1-E6 名全编（金星之漂/眼睑之筏/轻盈的紬丝/大理石之微光/
#     神圣的千花/命运织锦之涨落）→ 官方名（飘曳金星的行列/行舟命运的眼睑/
#     华珠凝滞的礼物/大理石内的闪烁/漆黑苦难的织者/盈虚无常的金线，
#     character_ranks.json 终审）；② 大行迹幻名 ×2——1402102「命运之末缕」→
#     「织运之竭」、1402103「疾驰之阳」→「飞驰之阳」（character_skill_trees.json）；
#     ③ 姿态名非官方——「至高姿态」→ 官方【至高之姿】（展示名同改）；
#   ④ 短视之惩静默死件——scaling_effects source "self.spd" 不在 Layer1 键域
#     （"spd" 才是）→ 静默跳过=写了不生效；且 draft 误判跨主体半"未接线"——
#     正解 stat_exprs + stat_of 双件全收（1409 暴风停歇/IKA 先例：7.2%×阿格莱雅
#     速度 + 3.6%×衣匠速度，双方各挂、现场求值随速度层变档）；
#   ⑤ 秘技白送——进战回能 30/全体 100% 雷伤/随机挂标写在模板级 on_battle_start
#     无条件钩（不点秘技也白嫖）→ 全件收回 techniques 块（18.3 装填预置队列——
#     选中秘技才在进战发）；⑥ 普攻锁缺——140201 无 available_if（至高之姿下普攻
#     应被孤锋千吻替换，双普攻并存）→ 补 available_if res__stance < 1；
#   ⑦ 削韧错位——140208 削韧 10/5 → tbgd stance [60,0,30]/3 = 20/10（米游社
#     削韧 20 互证）；140201 值对但 provenance 改标 tbgd 30/3=10 + 米游社削韧 10 双源；
#   ⑧ 叠层主体错——1140203 叠层钩 draft 双主体放行（阿格莱雅攻击也叠）→ 基础轨
#     仅衣匠攻击叠层（官方"攻击…后，使自身的速度提高"主语=衣匠；阿格莱雅侧叠层
#     是 E4 权能），且 draft 双钩同事件双计——本版基础轨衣匠 <6、E4 轨（阿格莱雅
#     全程 + 衣匠第 7 层）<7 互斥不双计；
#   ⑨ E2 误判死档——draft 记"无视防御无通道待收"→ def_pen 在案键（rulebook
#     def_multi zone max(0,1-def_pen)），层数池+烘焙双件+清零钩全收（清零域=EN
#     "actively uses an ability" 含终结技，B37 在案）；
#   ⑩ E3 note 算错——"战技+2 实取 lv15=0.625"→ 默认 10+2=lv12=0.55；"普攻实取
#     lv10"→ 默认 6+1=lv7（_effective_skill_levels 口径）；
#   ⑪ 附加伤害 category 缺——天赋附加段补 category "additional"（决策卡 #19：
#     不吃类型限定增伤；段事件 action_type='additional' 结构性出集叠层/回能/挂标
#     各钩——action_type 白名单承载防递归，替代 draft _add_dmg_lock 闩）；
#   ⑫ 挂标目标域错——draft 挂标钩走 on_hp_decrease 逐目标事件，blast 末段相邻
#     目标会抢标 → 改 on_action 主目标口径（$event.target=行动主目标，官方
#     "施放攻击时使目标陷入"）；⑬ 天赋回能 10 漏收——tbgd 140204 energy_gen=10
#     权威 → 附加段命中回能 10 收编（FUA 族口径，归属待实测在案）；
#   ⑭ 冗余双保险闩——on_battle_start 资源清零钩（custom_resources current:0
#     同通道）→ 删；⑮ 衣匠继承全烘焙 → 部分继承列表（1413/1415 先例）+ hp/spd
#     维持烘焙（双段通道缺——见待收）。
# 收录：双态战技（召唤/治疗 available_if 互斥分支）/ 终结技（召唤+回满+至高之姿
#       +立即行动+速度层转化+衣匠免控）/ 天赋间隙织线（on_action 主目标、单目标
#       覆盖）+附加雷伤（category additional、param 随档）+附加段回能 10 / 忆灵
#       刺纹之陷 blast / 速度层（基础 6、双方烘焙双钩）/ 飞驰之夏拉条 100% /
#       枯草之盈回能 20 / 飞驰之阳开局补能 / 织运之竭保 1 层 / 短视之惩双件 /
#       秘技四件 / 行迹属性节点 / E1（织线易伤真伤 15%+攻击回能 20）/ E2（def_pen
#       14%×3 层+清零）/ E4（层上限 7+阿格莱雅叠层）/ E6（雷抗穿 20% 双件）/
#       E3/E5 等级族随档
# 待收（均带挡因，详见 scaling_notes 末段）：140208 连携衣匠半（joint_attack 未
#       接线）/ E6 连携 SPD 阈值增伤（单技能增伤通道缺）/ 衣匠 HP 双段与 SPD 比例
#       动态继承（max_hp_ratio 无 flat 加项、无 spd 比例槽）/ 衣匠自毁倒计时
#       （倒计时 actor 通道缺+时长数值无源）/ 衣匠绿字快照（继承边界在案）/
#       衣匠优选攻击织线目标（prefer_target 词表仅 owner_last_target）
actor_id: "1402"
name: "阿格莱雅"
level: 80
path: "remembrance"   # 命途（count_team 编成计数口径）
groups: ["faction:chrysos_heir"]   # 黄金裔名册——官方献予「浪漫」之诗 1141514
                                   # 「对阿格莱雅施放时」在案（生成器 _FACTION_ROSTERS
                                   # 同口径滞后未补 1402；in_group/count_team(group=) 口径）
element: "thunder"    # 元素（element_of 取数源——官方数据照抄）
base_stats:
  hp: 1241.856
  atk: 698.544
  def: 485.1
  spd: 102
  crit_rate: 0.05     # 白值；行迹暴击率节点 +0.12 走 trace_stat_effects 通道（不并入——
                      # 1002/1302/1314 同例）
  crit_dmg: 0.5
  max_energy: 350     # 能量上限 350（官方 max_sp；米游社 energy_cap 互证）
trace_stat_effects:   # 官方行迹属性小节点（character_skill_trees.json properties 终审）
  dmg_thunder: 0.224  # 伤害强化•雷 ×5（0.032+0.032+0.048+0.048+0.064——1402201/03/05/07/10）
  crit_rate: 0.12     # 暴击率强化 ×3（0.027+0.04+0.053——1402202/06/09）
  def_pct: 0.125      # 防御强化 ×2（0.05+0.075——1402204/08）
trace_notes:
  - 大行迹「短视之惩」（1402101）双件全收：至高之姿下阿格莱雅与衣匠 ATK += 7.2%×阿格莱雅
    速度 + 3.6%×衣匠速度（params [[7.2,3.6]] 单档字面化）——stat_exprs 现场求值（速度层
    变档即随档；draft scaling_effects "self.spd" 死键已勘正④）；双件各挂不辐射
  - 大行迹「织运之竭」（1402102）已收：衣匠消失时速度层最多保留 1 层（actor_exit 钳
    res__spd_stacks），再次被召唤时按保留层数恢复（actor_enter 重挂烘焙件）
  - 大行迹「飞驰之阳」（1402103）已收：战斗开始能量不足 50%（175/350）则补至 175——
    on_battle_start + gain_energy self（能量为内建资源，不走 custom_resources）
  - 忆灵天赋+1（E3）/忆灵技+1（E5）：官方 10 档上限无第 11 档——不脑补数值，param()
    越档钳表尾+⚠编译警告口径（1409/昔涟同例）

