# 角色模板：真理医生（1305）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging 1305_真理医生.yaml）+ 过堂勘正（staging→fixtures
# 合并流水线）。数值照 query-game-data params 全表逐行对过；星魂 EN 名与
# en/character_ranks.json 全对；削韧/回能/战技点 = 米游社五项 + tbgd
# （SPBase/StanceDamageDisplay/BPNeed/BPAdd）双源一致；非加强角色（无新旧双轨）。
#
# 过堂勘正十四件：
#   ① 行迹平铺节点翻案——draft 称「官方管线未给节点表」并脑补节点类型为
#     暴击/暴伤/虚数增伤；实查 character_skill_trees.json properties 全给且类型
#     为**暴击率/攻击力/防御力**：crit_rate +0.12（0.027+0.04+0.053，flat 并入
#     base_stats 0.05→0.17——丹恒 dmg_bonus 同通道先例）/ atk_pct +0.28 /
#     def_pct +0.125（pct 族走 trace_stat_effects——1002 丹恒先例）。
#   ② 终结技 debuff 幻名——draft 写「智者的愚行」（EN Wiseman's Folly 直译脑补）；
#     官方 CN 定名【智者的短见】（cn character_skills 130503 desc 实证）。
#   ③ 大行迹 CN 名张冠李戴——1305102 官方 CN「演绎」（Inference，draft 件名误
#     写「推理」）；1305103 官方 CN 才是「推理」（Deduction）。演绎/推理归位。
#   ④ 愚行触发域过宽——draft「任意我方（含自身）」；官方 CN「真理医生的**队友**
#     攻击」/ EN "Dr. Ratio's teammates" 双侧一致排除自身 → condition 加
#     `$event.source != '1305'`（自身战技/追击/附加段全出触发域，构造性防自链）。
#   ⑤ 愚行层数判定死钩——draft `has_modifier(...) >= 1` 是**存在性**判定；
#     adjust_stacks 到 0 不摘件（clamp [0,max_stack] 原地保留）→ 0 层后恒触发
#     = 无限愚行。正解 `stacks($event.target, 'WISEMANS_FOLLY') >= 1`。
#   ⑥ adjust_stacks 缺 target——draft 两处（愚行扣层/E6 +1）未写 target，缺省
#     self = 真理医生（愚行件挂敌方——自身账上无件，no-op 死钩）。正解
#     target: "$event.target"。
#   ⑦ E6 次数 +1 被钳死——draft 愚行 max_stack 2，adjust_stacks 钳 [0,max_stack]
#     → 2+1 钳回 2，E6 永不生效。正解基础件 max_stack 3（=E6 结构上限；E0 路径
#     只减不增天然 ≤2，无泄漏）。
#   ⑧ E2 无限递归 + 类别错——draft E2 deal_damage 无 category → 伪行动归
#     follow_up → 自伤再命中本钩（无闩）= 无限递归。正解 category: "additional"
#     （官方「附加伤害」语义本体——伪行动归 additional 类自然出 follow_up 域，
#     构造性防递归；附加伤害乘区口径 = 引擎现行常规乘区含期望暴击区，游戏真相
#     附加伤害不暴击——归属待实测 B19 在案）。
#   ⑨ E6 增伤建模失真——draft 写成 0.5×天赋倍率追加段（倍率区失真）；官方
#     「追加攻击造成的伤害提高50%」= 增伤区。正解 eidolon stat_effects
#     dmg_follow_up_dmg_boost 0.5（1214 雪衣 E1 同案同解——EIDO 修饰件通道，
#     hook deal_damage 伪行动缺省归 follow_up 类可命中）。
#   ⑩ 追击回能翻案——draft「hook 侧回能通道缺」待收系误判：gain_energy 内建
#     通道在案（1214 雪衣④ 1207/1210/1211/1213 四连先例）。天赋追击 +5
#     （tbgd SPBase 5 + 米游社「回能 5」双源）收进两个追击钩；E4「触发天赋
#     +15」同通道翻案收录（单钩挂追击命中事件，战技触发/愚行触发双路径一钩
#     覆盖——官方未区分触发源，在案）。
#   ⑪ 归纳层数不缩放死挂——draft stat_effects 定值：modifier stat_effects 不随
#     stacks 缩放（effective_stats 直加不乘层）→ 恒 1 层量。正解 stat_exprs 动态
#     读层（1210 FIREKISS 先例）：0.025/0.05 × stacks($self,'SUMMATION')。
#   ⑫ 愚行「仅最新目标」漏建模——官方「仅对终结技最新施放的目标生效」：draft
#     只挂不摘。正解 on_ultimate 钩先 remove_modifier all_enemies 再挂
#     $event.target（同钩 effects 序读现场新值）。
#   ⑬ hook 序——归纳/演绎（施放即挂）提到追击钩之前：追击伤害读现场面板吃到
#     本次归纳层（draft 序追击先行，首战技追击吃不到归纳——官方「使用战技时」
#     先挂增益后出追击；emit 快照语义下同事件条件旧值、effects 序现场值）。
#   ⑭ 削韧标注病灶撤销——draft「仅 mys 单一来源待交叉」：tbgd
#     StanceDamageDisplay 10/20/30/10 与米游社五项逐项一致（双源在案）。
#
# 收录：普攻 130501 / 战技 130502 / 终结技 130503（三段悖论——智者的短见计数
#       modifier 化：stacks 2 = lv10 #2 全档恒 2，stack_mode replace = 重施放重置
#       满次数；「仅最新目标」先摘后挂；E6 上限 3 见⑦）/ 天赋 130504 追加攻击
#       （hook deal_damage 承载 action_type follow_up 缺省；触发概率 40%+20%/
#       debuff 掷点+debuff 计数双通道缺 → 按确定性全触发上界收录，B19 候选）/
#       秘技 130507（进战全体降速 15%/2 回合已收；领域嘲讽待收）/
#       大行迹 归纳（暴击率 2.5%+暴伤 5%/层，上限 6——debuff 计数通道缺按 1 层
#       基线）/ 演绎（战技降效果抵抗 10%/2 回合）/ 星魂 E1-E6（E1 开战 4 层+
#       上限 10 / E2 附加伤害基线段 / E3+E5 等级族 / E4 追击回能 +15 / E6 愚行
#       次数 +1 + 追击增伤 50% 类型桶）。
# 待收（均带挡因）：天赋概率掷点（40%+20%/debuff——debuff 计数函数缺，概率真值
#       无法求值，确定性全触发=上界，B19 候选）/ 大行迹「推理」增伤（≥3 debuff
#       目标每 debuff +10% 至多 50%——debuff 计数通道缺，无逐层/阈值载体）/
#       E2 逐 debuff 多段（每 debuff 1 段至多 4 段——同通道缺，基线 1 段）/
#       Summation 真实层数（目标 debuff 数 1..6——同上，基线 1 层/次）/
#       追加攻击目标死亡重定向随机敌方（「原目标已灭则随机单体」复合目标式缺）/
#       秘技领域嘲讽（领域/嘲讽通道无既有键；半径与 10 秒计时起点官方未给数值；
#       队友领域互斥同为领域系统语义）/ 130506「攻击」官方占位条目（params 空表，
#       不构成可编排技能）/ 附加伤害暴击区归属（引擎现行按常规乘区结算——游戏
#       真相待实测）。
# 数值：action scaling 全表照抄官方 params（15 档表 lv10=index 9；普攻 10 档
#       lv6=index 5）；hook/modifier 侧随档系数走 skill_params + param() 编译期
#       引用（05_effects §5.1——E5 天赋 +2 实取 lv12=2.97 随档联动）。
actor_id: "1305"
name: "真理医生"
level: 80
path: "hunt"          # 命途（Rogue/巡猎——官方数据；count_team 编成计数口径）
element: "imaginary"  # 元素（element_of 取数源——官方数据照抄）
base_stats:
  hp: 1047.816        # 官方管线 lv80 实值（calc_character_stats 对轴）
  atk: 776.16
  def: 460.845
  spd: 103
  crit_rate: 0.17     # 管线 0.05 + 行迹暴击率节点 0.12（0.027+0.04+0.053——
                      # character_skill_trees properties 实证，勘正①；draft 漏收）
  crit_dmg: 0.5       # 官方白值（行迹无暴伤节点）
  max_energy: 140     # 官方能量上限（StarRailRes max_sp + 米游社「能量 140」双源）

trace_notes:
  - 大行迹「归纳」（1305101）：施放战技时目标每有 1 个负面效果，暴击率 +2.5%、暴击伤害 +5%，至多 6 层（E1 → 10 层）。debuff 计数查询通道缺 → 按 1 层/次基线收录（真实值 1..6 层，B19 候选）；params_max [0.025, 0.05, 6] 单档字面值
  - 大行迹「演绎」（1305102）：施放战技攻击敌方目标后，100% 基础概率使受到攻击的敌方目标效果抵抗 -10%（#2），持续 2 回合（#3）——params_max [1, 0.1, 2] 单档字面值，已收（stat 键 effect_res 词表在案——draft「键待编译校验」挡因过期）
  - 大行迹「推理」（1305103）：对持有 ≥3 debuff 的目标造成伤害时，每有 1 个 debuff 伤害 +10%、至多 +50%（params_max [3, 0.1, 0.5]）——待收（挡因：debuff 计数通道缺，无逐层/阈值判定载体）
  - 行迹平铺节点（勘正①）：暴击率 +12%（flat 并入 base_stats）/ 攻击力 +28%、防御力 +12.5%（pct 族走 trace_stat_effects 通道，不并入白值——生成器/1002 丹恒同口径）
trace_stat_effects:
  atk_pct: 0.28       # 行迹攻击力节点 0.04+0.04+0.06+0.06+0.08（StarRailRes properties 实证）
  def_pct: 0.125      # 行迹防御力节点 0.05+0.075（同上）

