    level_key: ultimate # 三段悖论（Ultimate）——[#1 倍率, #2 愚行触发次数（全档恒 2）]
    rows:               # lv1..lv15 照抄原始数据 params（lv10=2.4；E3 +2 实取 lv12=2.592）
      - [1.44, 2]
      - [1.536, 2]
      - [1.632, 2]
      - [1.728, 2]
      - [1.824, 2]
      - [1.92, 2]
      - [2.04, 2]
      - [2.16, 2]
      - [2.28, 2]
      - [2.4, 2]
      - [2.496, 2]
      - [2.592, 2]
      - [2.688, 2]
      - [2.784, 2]
      - [2.88, 2]
  "130504":
    level_key: talent   # 我思故我在（Talent——追加攻击体 action_type follow_up 缺省）
    rows:               # lv1..lv15 照抄原始数据 params（[#1 倍率, #2 基础概率, #3 每 debuff 增幅]）
      - [1.35, 0.4, 0.2]
      - [1.485, 0.4, 0.2]
      - [1.62, 0.4, 0.2]
      - [1.755, 0.4, 0.2]
      - [1.89, 0.4, 0.2]
      - [2.025, 0.4, 0.2]
      - [2.1938, 0.4, 0.2]
      - [2.3625, 0.4, 0.2]
      - [2.5312, 0.4, 0.2]
      - [2.7, 0.4, 0.2]       # lv10：倍率 2.7、固定概率 40%、每 debuff +20%
      - [2.835, 0.4, 0.2]
      - [2.97, 0.4, 0.2]      # lv12（E5 +2 实取档）
      - [3.105, 0.4, 0.2]
      - [3.24, 0.4, 0.2]
      - [3.375, 0.4, 0.2]

techniques:
  - technique_id: "130507"
    name: "偶像塑造"
    point_cost: 1        # 保守默认（官方数据包未给秘技点数——数据缺失，按通用 1 点；mys tag 妨害旁证）
    effects:             # 进战一次性（战前装填预置；施放者=真理医生）
      - effect_type: "apply_modifier"   # 进入领域战斗：每个敌方目标 100% 基础概率速度 -15%（#2/#3），2 回合（#4）
        target: "all_enemies"
        modifier:
          modifier_id: "IDOL_SLOW"
          name: "偶像塑造"
          modifier_type: "debuff"
          duration: 2
          dispellable: True
          stat_effects: {"spd_pct": -0.15}
      # 领域【嘲讽附近敌人 10 秒】+ 队友领域互斥——待收：领域/嘲讽通道无既有键
      #（Zone 系统未接线，嘲讽半径与 10 秒计时起点官方未给数值，不脑补）

actions:
  - action_id: "130501"
    name: "知识就是力量"
    action_type: "basic"
    target_type: "single"
    damage_type: "imaginary"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    # 10 档表（官方 params 仅 10 行——E3 普攻 +1 至 lv7，表尾 lv10 无越档）
    toughness_dmg: 10          # 米游社+tbgd 双源一致（勘正⑭）
    skill_point_gain: 1        # tbgd BPAdd 权威 + 米游社「战技点 +1」
    energy_gain: 20            # tbgd SPBase + 米游社「回能 20」

  - action_id: "130502"
    name: "精神助产术"
    action_type: "skill"
    target_type: "single"
    damage_type: "imaginary"
    scaling: [{"atk": 0.75}, {"atk": 0.825}, {"atk": 0.9}, {"atk": 0.975}, {"atk": 1.05},
              {"atk": 1.125}, {"atk": 1.2188}, {"atk": 1.3125}, {"atk": 1.4062}, {"atk": 1.5},
              {"atk": 1.575}, {"atk": 1.65}, {"atk": 1.725}, {"atk": 1.8}, {"atk": 1.875}]
    # 15 档全表照抄（lv10=第 10 行 = 1.5，非表尾；E5 战技 +2 实取 lv12 = 1.65）
    toughness_dmg: 20          # 米游社+tbgd 双源
    skill_point_cost: 1        # tbgd BPNeed 权威 + 米游社「战技点 -1」
    energy_gain: 30            # tbgd SPBase + 米游社「回能 30」

  - action_id: "130503"
    name: "三段悖论"
    action_type: "ultimate"
    target_type: "single"
    damage_type: "imaginary"
    scaling: [{"atk": 1.44}, {"atk": 1.536}, {"atk": 1.632}, {"atk": 1.728}, {"atk": 1.824},
              {"atk": 1.92}, {"atk": 2.04}, {"atk": 2.16}, {"atk": 2.28}, {"atk": 2.4},
              {"atk": 2.496}, {"atk": 2.592}, {"atk": 2.688}, {"atk": 2.784}, {"atk": 2.88}]
    # 15 档全表照抄（lv10 = 2.4，非表尾；E3 终结技 +2 实取 lv12 = 2.592）
    energy_cost: 140           # 能量上限（mys「能量 140」+ StarRailRes max_sp）
    energy_gain: 5             # tbgd SPBase + 米游社「回能 5」（施放返还能量）
    toughness_dmg: 30          # 米游社+tbgd 双源
    skill_point_cost: 0        # tbgd
    # #2 愚行触发次数 = param(130503, 2)（全档恒 2）——由 on_ultimate hook 落 stacks（见 hooks）

  # 130504 天赋追加攻击不建 action 条目：动作体以 hook deal_damage 承载（伪行动
  # action_type 缺省 follow_up——遐蝶/三月七/雪衣族同构先例）
  # 130506「攻击」：官方占位条目（无 type_text/effect_text、params 空表）——不构成
  # 可编排技能，不入 actions（挡因：官方字段缺失，语义待官方补充/待实测）

hooks:
  # hook 序（勘正⑬）：演绎/归纳（施放即挂）在前，天赋追击在后——追击伤害读现场
  # 面板吃到本次归纳层（官方「使用战技时」先挂增益后出追击）。

  # 1305102 大行迹「演绎」：施放战技攻击敌方目标后 100% 基础概率使受击目标效果
  # 抵抗 -10%（#2），持续 2 回合（#3）——params_max [1, 0.1, 2] 单档字面值
  - event: "on_action"
    condition: "$event.actor == '1305' && $event.action_id == '130502' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "INFERENCE_EFFECT_RES"
          name: "演绎"
          modifier_type: "debuff"
          duration: 2
          dispellable: True
          stat_effects: {"effect_res": -0.1}

  # 1305101 大行迹「归纳」：施放战技时目标每有 1 个 debuff → 暴击率 +2.5%、暴击
  # 伤害 +5%（至多 6 层，E1 → 10）。【挡因在案】debuff 计数通道缺 → 按 1 层/次基线
  # 收录（真实值 1..6）；层数刷新模型（快照 replace/逐层累积）待实测；官方文本无
  # duration → 0（战斗内常驻）。stat_exprs 动态读层（勘正⑪——stat_effects 定值
  # 不随层缩放，1210 FIREKISS 先例）
  - event: "on_action"
    condition: "$event.actor == '1305' && $event.action_id == '130502' && !$event.insert"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SUMMATION"
          name: "归纳"
          modifier_type: "buff"
          stacks: 1
          max_stack: 6
          stack_mode: "refresh"
          duration: 0
          dispellable: False
          stat_exprs:
            crit_rate: "0.025 * stacks($self, 'SUMMATION')"
            crit_dmg: "0.05 * stacks($self, 'SUMMATION')"

  # 130504 天赋·追加攻击（战技触发半）：施放战技后对战技目标发动 1 次追加攻击
  #（伪行动缺省 follow_up 类），伤害 = ATK × #1（lv10 = 2.7，param 随档——E5 实取
  # lv12 = 2.97）+ 回能 5（tbgd SPBase + 米游社双源，勘正⑩）。
  # 【概率挡因在案】固定概率 40%（#2）+ 每 debuff +20%（#3）——debuff 计数通道缺，
  # 概率真值无法求值 → 按确定性全触发收录 = 真实值上界；B19 候选。
  # 目标死亡重定向随机敌方待收（挡因：无"原目标已灭则随机单体"复合目标式）。
  - event: "on_action"
    condition: "$event.actor == '1305' && $event.action_id == '130502' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "我思故我在"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "param(130504, 1) * $self.atk"
        toughness_dmg: 10        # 米游社+tbgd 双源
      - effect_type: "gain_energy"
        target: "self"
        amount: 5

  # 130503 终结技：施加【智者的短见】（勘正② 官方 CN 定名）——stacks 2 = lv10 #2
  #（全档恒 2），stack_mode replace = 重施放重置满次数（EN "resets after Dr. Ratio's
  # Ultimate is used"——清零读法列入待实测 B19）。无 duration（持续至次数用尽）。
  # 「仅对终结技最新施放的目标生效」（勘正⑫）：先全场摘除再挂最新目标——同钩
  # effects 序读现场新值。max_stack 3 = E6 结构上限（勘正⑦——adjust_stacks 钳
  # [0,max_stack]，draft max 2 把 E6 +1 钳死；E0 路径只减不增天然 ≤2）
  - event: "on_ultimate"
    condition: "$event.source == '1305' && $event.action == '130503'"
    effects:
      - effect_type: "remove_modifier"
        target: "all_enemies"
        modifier_id: "WISEMANS_FOLLY"
        reason: "replace"
      - effect_type: "apply_modifier"
        target: "$event.target"
        modifier:
          modifier_id: "WISEMANS_FOLLY"
          name: "智者的短见"
          modifier_type: "debuff"
          stacks: 2
          max_stack: 3
          stack_mode: "replace"
          duration: 0
          dispellable: True

  # 愚行触发（勘正④⑤⑥）：**队友**（排除真理医生自身——CN「队友」/EN teammates
  # 双侧一致）攻击命中持有愚行且层数 ≥1（stacks 判定——has_modifier 是存在性，
  # 0 层不摘件会恒触发的死钩已勘正）的目标时，对该目标发动 1 次天赋追加攻击
  #（同战技触发半同倍率同回能）并消耗 1 层（target 必须事件寻址——缺省 self 是
  # no-op 死钩）。【待实测在案】愚行是否计入归纳/推理/天赋概率所数的 debuff——
  # 官方未明示
  - event: "on_hp_decrease"
    condition: "$event.reason == 'hit' && $event.source != '1305' && actor_type_of($event.source) != 'monster' && stacks($event.target, 'WISEMANS_FOLLY') >= 1"
    effects:
      - effect_type: "deal_damage"
        name: "我思故我在"
        target: "$event.target"
        damage_type: "imaginary"
        amount: "param(130504, 1) * $self.atk"
        toughness_dmg: 10        # 米游社+tbgd 双源
      - effect_type: "gain_energy"
        target: "self"
        amount: 5
      - effect_type: "adjust_stacks"
        target: "$event.target"
        modifier_id: "WISEMANS_FOLLY"
        delta: -1

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN。EN 名与
# en/character_ranks.json 逐一对过（CN：倨傲生祸患/显微而阐幽/认识你自己/
# 盲目造痴愚/海阔舟无楫/永恒唯真理）；非加强角色，无新旧双轨。
eidolons:
  E1:
    name: "Pride Comes Before a Fall"   # 倨傲生祸患
    hooks:
      # 战斗开始立即获得 4 层归纳；归纳上限 6→10（官方「上限提高4层」）。
      # 开战先挂定 max_stack 10（refresh 续层读首挂件 max_stack——基础件随后
      # 续层自然吃到 10 上限）；stat_exprs 与基础件同式（面板口径一致）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "SUMMATION"
              name: "归纳"
              modifier_type: "buff"
              stacks: 4
              max_stack: 10
              stack_mode: "refresh"
              duration: 0
              dispellable: False
              stat_exprs:
                crit_rate: "0.025 * stacks($self, 'SUMMATION')"
                crit_dmg: "0.05 * stacks($self, 'SUMMATION')"
  E2:
    name: "The Divine Is in the Details"   # 显微而阐幽
    hooks:
      # 天赋追加攻击击中目标时，目标每有 1 个 debuff 造成 20% ATK 虚数**附加伤害**，
      # 每次追加攻击最多 4 次。【挡因在案】debuff 计数通道缺 → 基线 1 段收录
      #（真实值 1..4 段）。category "additional"（勘正⑧——官方「附加伤害」语义
      # 本体 + 伪行动归 additional 类自然出 follow_up 域，构造性防自递归；
      # 附加伤害暴击区归属待实测在案）
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.source == '1305' && $event.action_type == 'follow_up'"
        effects:
          - effect_type: "deal_damage"
            name: "显微而阐幽"
            target: "$event.target"
            damage_type: "imaginary"
            category: "additional"
            amount: "0.2 * $self.atk"
  E3:
    name: "Know Thyself"   # 认识你自己
    skill_level_overrides: {"ultimate": 2, "basic": 1}   # 终结技+2（上限 15）、普攻+1（上限 10）
    notes:
      - "终结技+2 随档段：action 层 scaling 实取 lv12 = 2.592；愚行次数 #2 全档恒 2（无跳差）；energy_gain/toughness 非档位表"
      - "普攻+1：130501 仅 10 档（params 10 行），lv7 = 1.1，表尾 lv10 = 1.4——无越档"
  E4:
    name: "Ignorance Is Blight"   # 盲目造痴愚
    hooks:
      # 触发天赋时额外恢复 15 点能量（勘正⑩ 翻案收录——gain_energy 内建通道在案，
      # draft「hook 侧回能通道缺」误判；1214 雪衣④ 四连先例）。单钩挂天赋追击
      # 命中事件：战技触发/愚行触发双路径一钩覆盖（官方未区分触发源，在案）
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.source == '1305' && $event.action_type == 'follow_up'"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 15
  E5:
    name: "Sic Itur Ad Astra"   # 海阔舟无楫
    skill_level_overrides: {"skill": 2, "talent": 2}     # 战技+2（上限 15）、天赋+2（上限 15）
    notes:
      - "战技+2：130502 scaling 实取 lv12 = 1.65；天赋+2：130504 追加攻击倍率实取 lv12 = 2.97（hook amount param(130504,1) 编译期随档替换）；概率/每 debuff 增幅 #2/#3 全档恒定"
  E6:
    name: "Vincit Omnia Veritas"   # 永恒唯真理
    # 天赋追加攻击伤害 +50%（勘正⑨——官方「伤害提高50%」= 增伤区；draft 写成
    # 0.5×倍率追加段失真。eidolon stat_effects → EIDO 修饰件通道，
    # dmg_follow_up_dmg_boost 类型桶命中 hook 伪行动 follow_up 类——1214 雪衣 E1 同解）
    stat_effects: {"dmg_follow_up_dmg_boost": 0.5}
    hooks:
      # 愚行触发次数 +1（2→3）：on_ultimate 基础件先挂（stacks 2 / replace），本件
      # 随后 +1（声明序=基础件在前，eidolons 件后结算——遐蝶 E6 同构先例）；
      # max_stack 3 结构上限见勘正⑦；target 事件寻址见勘正⑥
      - event: "on_ultimate"
        condition: "$event.source == '1305' && $event.action == '130503'"
        effects:
          - effect_type: "adjust_stacks"
            target: "$event.target"
            modifier_id: "WISEMANS_FOLLY"
            delta: 1

scaling_notes:
  - 战技点口径：130502 耗 1 点（tbgd BPNeed + 米游社「战技点 -1」双源）；普攻产 1 点、终结技/追加攻击 0 耗 0 产
  - 天赋（130504）为攻击类天赋 → 动作体以 hook deal_damage 承载（伪行动缺省 follow_up 类——词表纪律：官方 Talent 类攻击写 follow_up，无 talent 键）；概率/层数机制落 hooks（掷点+debuff 计数双通道缺 → 确定性全触发上界收录，B19 候选）
  - 追加攻击基数 = ATK × param(130504, 1)（$self.atk 现场面板——非烘焙常数，真理医生无"按队友面板"基数）
  - 判读参数读法：130503 [#1 倍率, #2 次数]；130504 [#1 倍率, #2 基础概率, #3 每 debuff 增幅]；130507 [#1 秒数, #2 基础概率, #3 降速比例, #4 回合]；行迹 1305101 [0.025, 0.05, 6] / 1305102 [1, 0.1, 2] / 1305103 [3, 0.1, 0.5]（params_max，单档字面值）
  - 削韧/回能/战技点五项 = 米游社+tbgd 双源一致（普 10/20 能/+1 点、战 20/30 能/-1 点、终结 30/5 能、追击 10/5 能——勘正⑭，draft「单一来源待交叉」病灶撤销）
  - 130506「攻击」官方为占位（params 空表）——不入 actions，不脑补语义
  - 待实测汇总（不脑补）：天赋概率硬顶 100% 溢出行为 / 愚行是否计入 debuff 数 / 终结技重置=满次数还是清零 / 归纳刷新模型 / E1 开战 4 层与刷新模型叠加关系 / E2 附加伤害暴击区归属 / 秘技领域嘲讽半径与 10 秒计时起点
