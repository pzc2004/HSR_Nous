    rows:               # lv1..lv15 照抄原始数据 params（lv10=第 10 行=1.5；E5 +2 实取 lv12=1.65）
      - [0.75]
      - [0.825]
      - [0.9]
      - [0.975]
      - [1.05]
      - [1.125]
      - [1.2188]
      - [1.3125]
      - [1.4062]
      - [1.5]
      - [1.575]
      - [1.65]
