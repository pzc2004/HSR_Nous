# 角色模板：那刻夏（1405）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging data/annotator/staging/1405_那刻夏.yaml）+ 过堂勘正
#       （staging→fixtures 合并流水线）。
#
# 过堂收编/勘正十五件：① 行迹属性节点全漏收编——draft 注「行迹无暴击率节点」不实
#   （官方 character_skill_trees：风伤 0.032+0.032+0.048+0.048+0.064=0.224 / 暴击率
#   0.027+0.04+0.053=0.12 / 生命 0.04+0.06=0.10）→ trace_stat_effects 三件（1312 米沙
#   先例）；② count_team() 空参病（族谱 #6）——行迹2 enable_if 空参=数「命途为空的
#   成员数」非智识人数 → count_team(path='erudition')；③ E1 减防键 def_ 平值病——
#   def_=-0.16 是防御 flat −0.16（非 −16%）→ def_pct 负值（1015 先例，白值百分比
#   通道）；④ E2 全抗降 res_pen 挂敌方=死键（族谱 #7——res_pen 读攻击方面板，敌方
#   抗性削减修饰通道缺）摘除落待收（1006 银狼/1106 同案）；⑤ E6 真伤钩递归闩缺
#   （族谱 #12——真伤段自身发 on_hp_decrease 带 damage_type 'true'，draft 条件
#   不滤=自触发无限递归）补 `$event.damage_type != 'true'`（昔涟结界防递归同闸）；
#   ⑥ 战技敌数增伤 post-action 钩死件勘正——on_action 在伤害结算后发射，draft 的
#   duration 1 增伤对本技能零贡献 → 正主=常驻件 dmg_skill_dmg_boost 类型桶 +
#   stat_exprs 活读 enemies_alive()（1015 Archer/1008 阿兰先例），主段/弹射段/追加段
#   （伪行动 action_type skill，飞霄 1220 先例）同吃；⑦ 天赋揭露增伤同病勘正——
#   draft on_action 授予不覆盖触发攻击本身 → 移挂终结技 apply_modifiers（action 层
#   副作用先于伤害结算——官方「先挂升华后结算伤害」顺序在案）：揭露与 +30% 增伤
#   同帧落地，大招本击即吃；⑧ 弹射挡因不实勘正——bounce 在 TARGET_TYPES（1304
#   砂金/1408 先例），但那刻夏首段=玩家指定单体，bounce 原生语义=全段随机（含首段）
#   不符 → 维持主段 single + hook 4 段随机（1009 艾丝妲同构），挡因改写；⑨「fandom
#   缺」注记不实——fandom 有战技回能 30（=6×5，与米游社「6*5」同源）/削韧 10+5；
#   能量记档维持 tbgd=6（族谱 #14 仲裁），两源 30 读法待实测；⑩ 行迹1 回合开始回能
#   挡因过期——gain_energy 在库，收编（on_turn_start + 揭露不在场代理条件，当前
#   近似下揭露⇔增伤件同寿命）；⑪ E1 首次战技回点挡因过期——gain_skill_point +
#   trigger_limit 在库，收编（once_per_battle）；⑫ 弱点植入挡因部分过期——
#   weakness_add 通道在库（B25，1310/1315/1408 先例）：升华 7 弱点静态全类型=严格
#   官方语义收编（effective_weakness 驱动抗性区+削韧 own_element 闸双消费端）、
#   秘技按施放者=那刻夏（风）近似收编；天赋逐 hit 随机类型+优先未持有=动态选择
#   通道缺维持待收；⑬ 升华/揭露到期锚勘正——官方「持续至目标回合开始」→
#   duration 1 + tick_anchor owner_turn_start（draft 默认 owner_turn_end=目标回合
#   结束才到期，多活半轮）；⑭ E4 双件烘焙改单件 stat_exprs 活读（1015 Archer 先例——
#   免烘焙快照病）；⑮ 星魂名改官方 CN 名（draft EN 名与官方 EN 一致无幻名，按
#   1407/1409/1413/1415 近例收敛）。
#
# 收录：普攻/战技/终结技三 action（lv10 档 1.0/0.7/1.6——15 行表 lv10=index 9）
#       + 战技 4 段弹射 hook（逐段 0.7×atk、削韧 5、action_type skill 伪行动）
#       + 敌数增伤常驻件（dmg_skill_dmg_boost 类型桶 stat_exprs 活读）
#       + 终结技升华（7 弱点 weakness_add 严格语义 + 揭露同帧授予 + 揭露增伤
#       apply_modifiers 预结算）+ 天赋追加战技双分支（主目标存活/死亡转随机——
#       单段保守收录）+ 行迹1 双半（普攻回能烘焙 30 + 回合开始回能 30 代理条件）
#       + 行迹2 智识双分支（count_team erudition enable_if）+ 秘技入战风弱点近似
#       + 星魂 E1（首技回点+减防）/E3/E4/E5/E6（真伤+行迹2 双效果常驻）
#
# 待收（均带挡因，详见 hooks/eidolons notes 与文末清单）：天赋逐 hit 随机弱点植入 /
#       升华硬控（无控抗者无法行动）/ 行迹3 每弱点无视防御 / E2 入场全抗降+弱点 /
#       追加战技完整继承战技段/回能/削韧 / 战技回能 6 vs 30 仲裁待实测 / E1 减防
#       逐命中粒度 / 弹射「优先未命中」去重 / E4 叠加边界 / 敌数增伤计数时点
actor_id: "1405"
name: "那刻夏"
level: 80
path: "erudition"   # 命途（count_team 编成计数口径——行迹 1405102 读智识人数）
element: "wind"     # 元素（element_of 取数源；官方数据照抄）
base_stats:
  hp: 970.2
  atk: 756.756
  def: 557.865
  spd: 97
  crit_rate: 0.05     # calc lv80 管线实值（行迹暴击节点 +0.12 走 trace_stat_effects——
  crit_dmg: 0.5       # 1312 米沙先例；管线值不含行迹节点，勘正 draft「无暴击节点」误注）
  max_energy: 140     # 常规能量条上限 140（官方档案 max_sp + 米游社 sub_tag 双源）
trace_stat_effects:
  dmg_wind: 0.224     # 行迹伤害强化•风 ×5（0.032+0.032+0.048+0.048+0.064——官方
                      # character_skill_trees properties WindAddedRatio；dmg_<element> 前缀
                      # 路由元素桶，1314 翡翠 dmg_quantum 同族）
  crit_rate: 0.12     # 行迹暴击率节点 ×3（0.027+0.04+0.053——CriticalChanceBase）
  hp_pct: 0.10        # 行迹生命节点 ×2（0.04+0.06——HPAddedRatio，pct 白值口径引擎结算）
trace_notes:
  - 行迹1「Roaming Signifier」（1405101，晋阶2）两件全收：① 普攻额外回 10 能量——烘焙入 action energy_gain 30（20 基础 tbgd + 10 行迹，常驻无门控无观察差，同走 ERR 通道）② 回合开始时若场上无【质性揭露】敌人回 30 能量——hooks on_turn_start + gain_energy（draft「能量直授通道未登记」挡因过期）；「无揭露敌人」按代理条件 has_modifier($self,'QUALI_DMG_BOOST')<1（当前近似下揭露⇔增伤件同寿命；弱点计数通道登记后应改按敌方揭露计数判定——代理在案）
  - 行迹2「Imperative Hiatus」（1405102，晋阶4）两分支全收：队伍 1 名智识 → 那刻夏暴伤 +140%（#1=1.4）；≥2 名智识 → 全队增伤 +50%（#2=0.5）——on_battle_start 双件 enable_if count_team(path='erudition')（draft 空参病勘正——族谱 #6）；E6 后双效果常驻：E6 hooks 无条件复授同值 + stack_mode replace 同 id 幂等，注册序主干先星魂后=E6 版（无 enable_if）恒为最终件，不双叠
  - 行迹3「Qualitative Shift」（1405103，晋阶6）待收：敌人每有 1 种弱点 → 无视 4% 防御（上限 7 种=28%，#1=0.04）。挡因：敌方弱点计数查询函数缺（def_pen 攻击侧键在库但「目标弱点类型数」无宿主函数；hit_condition scoped 加成只收 dmg_*/all_dmg/res_pen/vulnerability 不收 def_pen——逐目标档无通道，不脑补）
  - 免死/免疫检查：三条行迹均无免死/无敌/免疫/特殊生命比例机制——无遗漏
  - 行迹属性节点（风伤/暴击率/生命）全部收编 trace_stat_effects【官方 character_skill_trees properties】——draft 全漏+误注「行迹无暴击率节点」
techniques:
  # 秘技（140507 瞳扉之彩）：大世界恐惧（10 秒，#1）不入战模拟；入战为每个敌人施加
  # 「攻击者属性」1 个弱点持续 3 回合（#2=3）——weakness_add 通道在库（B25），按
  # 施放者=那刻夏（风）近似收编（「攻击者属性」动态元素通道缺——他属性攻击者入战待收）
  - technique_id: "140507"
    name: "瞳扉之彩"
    point_cost: 1
    effects:                              # 进战一次性（战前装填预置，18.3；施放者=那刻夏）
      - effect_type: "apply_modifier"
        target: "all_enemies"
        modifier:
          modifier_id: "TECH_ATTACKER_WEAKNESS"
          name: "瞳扉之彩·攻击者属性弱点"
          modifier_type: "debuff"
          duration: 3
          dispellable: False
          weakness_add: ["wind"]          # 按施放者=那刻夏（风）近似（动态通道缺在案）

# hook/modifier 侧系数的等级表（param() 编译期引用，05_effects §5.1）；
# 行迹（14051xx）与秘技（140507）无等级轨道（单档），维持字面值
