  "140503":
    level_key: ultimate  # 生息破土，世界塑造（Ultimate）
    rows:  # lv1..lv15 照抄原始数据 params（15 行表——lv10 = 第 10 行 = 1.6，不取表尾 2.0）
      - [0.8]
      - [0.88]
      - [0.96]
      - [1.04]
      - [1.12]
