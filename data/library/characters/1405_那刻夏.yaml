  "140502":
    level_key: skill     # 分形，驱逐虚知（Skill）；#2=弹射段数 4、#3=每可攻击敌人增伤 0.2 全档固定
    rows:  # lv1..lv15 照抄原始数据 params（15 行表——lv10 = 第 10 行 = 0.7，不取表尾 0.875）
      - [0.35, 4, 0.2]
      - [0.385, 4, 0.2]
      - [0.42, 4, 0.2]
      - [0.455, 4, 0.2]
