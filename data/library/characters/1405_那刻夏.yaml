actions:
  - action_id: "140501"
    name: "楚痛，酿造实识"
    action_type: "basic"
    target_type: "single"        # 玩家指定单体（官方 "one designated enemy"）
    damage_type: "wind"
    scaling: [{"atk": 0.5}, {"atk": 0.6}, {"atk": 0.7}, {"atk": 0.8}, {"atk": 0.9},
              {"atk": 1}, {"atk": 1.1}, {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}]
    # 10 行表 lv10 = 第 10 行 = 1.4（默认档 lv6 = index 5 = 1.0）
    toughness_dmg: 10            # 米游社 sub_tag 交叉校验（fandom 削韧 10 一致）
    skill_point_gain: 1          # tbgd BPNeed sp_gain=1
    energy_gain: 30              # 基础 20（tbgd/fandom 双源）+ 行迹1 常驻 +10（烘焙合账——无门控无观察差）

  - action_id: "140502"
    name: "分形，驱逐虚知"
    action_type: "skill"
    target_type: "single"        # 主目标段（玩家指定）；4 段弹射由 on_action hooks 承载
    damage_type: "wind"          #（bounce 原生通道=全段随机含首段，与「首段指定」不符——1009 艾丝妲同构）
    scaling: [{"atk": 0.35}, {"atk": 0.385}, {"atk": 0.42}, {"atk": 0.455}, {"atk": 0.49},
              {"atk": 0.525}, {"atk": 0.5687}, {"atk": 0.6125}, {"atk": 0.6562}, {"atk": 0.7},
              {"atk": 0.735}, {"atk": 0.77}, {"atk": 0.805}, {"atk": 0.84}, {"atk": 0.875}]
    # 15 行表 lv10 = 第 10 行 = 0.7（单段倍率；#2=4 弹射段、#3=每可攻击敌人 +20% 全档固定）
    toughness_dmg: 10            # 主目标段 10；弹射段 4×5 由 hooks 承担（合计 30——米游社 10+5*4）
    skill_point_cost: 1          # tbgd sp_cost=1 为权威（族谱 #14 仲裁；米游社/fandom 同值 -1）
    energy_gain: 6               # tbgd=6 为权威（族谱 #14 仲裁）；fandom 30=米游社「6×5」两源
                                 # 读法（逐 hit 6 回能合计 30）待实测——直接决定 2 动 1 大循环成立性

  - action_id: "140503"
    name: "生息破土，世界塑造"
    action_type: "ultimate"
    target_type: "aoe"
    damage_type: "wind"
    energy_cost: 140
    energy_gain: 5               # tbgd/米游社/fandom 三源一致
    toughness_dmg: 20            # 米游社 sub_tag 交叉校验（全体 20）
    skill_point_cost: 0
    scaling: [{"atk": 0.8}, {"atk": 0.88}, {"atk": 0.96}, {"atk": 1.04}, {"atk": 1.12},
              {"atk": 1.2}, {"atk": 1.3}, {"atk": 1.4}, {"atk": 1.5}, {"atk": 1.6},
              {"atk": 1.68}, {"atk": 1.76}, {"atk": 1.84}, {"atk": 1.92}, {"atk": 2}]
    # 15 行表 lv10 = 第 10 行 = 1.6（不取表尾 2.0）
    apply_modifiers:
      # 官方顺序："Inflicts Sublimation, then deals DMG"——action 层副作用先于伤害结算
      #（engine._apply_action_side_effects→伤害段，编译序实证）：升华/揭露/增伤同帧落地，
      # 大招本击即吃揭露增伤与 7 弱点抗性红利（draft 走 on_action 钩=伤害后授予=本击不吃）
      # 【升华】① 7 种弱点植入——weakness_add 静态全类型=严格官方语义收编（B25 通道在库，
      # effective_weakness 驱动抗性区 _base_res + 削韧 own_element 闸双消费端）；
      # ② 无控抗者无法行动（硬控）待收：无法行动通道仅 freeze 族（自带解冻 50% 推条
      # 副作用非等价）+控抗判定通道缺。持续至目标回合开始——duration 1 +
      # tick_anchor owner_turn_start（目标回合开始即到期=官方原文口径，遐蝶同锚先例）
      - target: "all_enemies"
        modifier_id: "SUBLIMATION"
        name: "升华"
        modifier_type: "debuff"
        duration: 1
        tick_anchor: "owner_turn_start"
        dispellable: False
        weakness_add: ["physical", "fire", "ice", "lightning", "wind", "quantum", "imaginary"]
      # 【质性揭露】近似授予：升华 7 弱点 ≥ 天赋阈值 #3=5 种——弱点计数通道缺时的合规
      # 近似（天赋逐 hit 植入本体待收；弱点通道登记后应改按敌方弱点数判定授予）。
      # 持续与升华同寿命（当前近似下 7 弱点在揭露即在）
      - target: "all_enemies"
        modifier_id: "QUALITATIVE_DISCLOSURE"
        name: "质性揭露"
        modifier_type: "debuff"
        duration: 1
        tick_anchor: "owner_turn_start"
        dispellable: False
      # 140504 天赋·揭露增伤：对【质性揭露】目标伤害 +30%（lv10 #1，E5 随档 param）——
      # 与揭露同帧授予 self（当前近似揭露=全体敌人，self all_dmg 与逐目标判定数值等价；
      # 逐目标粒度/非大招路径揭露待弱点通道）。duration 1 近似（tick 锚错位在案——敌方
      # 揭露 owner_turn_start vs 本件 owner_turn_end）
      - target: "self"
        modifier_id: "QUALI_DMG_BOOST"
        name: "质性揭露·增伤"
        modifier_type: "buff"
        duration: 1
        dispellable: False
        stat_effects: {"all_dmg": "param(140504, 1)"}

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN（数值/机制照抄 ranks_detail desc）
eidolons:
  E1:
    name: "月掩星夜的魔术师"
    hooks:
      # ① 首次施放战技后恢复 1 战技点——gain_skill_point + trigger_limit 双通道在库
      #（draft「战技点直授通道未登记」挡因过期）；once_per_battle=全场 1 次
      - event: "on_action"
        condition: "$event.actor == '1405' && $event.action_id == '140502' && !$event.insert"
        trigger_limit: {once_per_battle: true}
        effects:
          - effect_type: "gain_skill_point"
            amount: 1
      # ② 施放战技击中敌方目标时防御 -16% 持续 2 回合——def_pct 负值（draft def_ 平值病
      # 勘正：def_=-0.16 是防御 flat −0.16 非 −16%，1015 先例）。逐命中粒度待实测：多段
      # 弹射命中敌人全挂（社区印证）vs 现按主目标段单挂——hit 域无 action_id（族谱 #8）
      # 逐目标通道缺；同帧弹射段不吃（注册序主干弹射钩先于星魂钩）在案
      - event: "on_action"
        condition: "$event.actor == '1405' && $event.action_id == '140502' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "$event.target"
            modifier:
              modifier_id: "E1_DEF_DOWN"
              name: "月掩星夜的魔术师·减防"
              modifier_type: "debuff"
              duration: 2
              dispellable: False
              stat_effects: {"def_pct": -0.16}
  E2:
    name: "真实历史的自然人"
    notes:
      - "两半全待收：① 敌方目标入场时触发 1 次天赋的弱点添加效果——随机类型+优先未持有的动态弱点选择通道缺（weakness_add 仅静态列表）② 使其全属性抗性降低 20%——res_pen 挂敌方=死键（读攻击方面板，1006 银狼/1106 同案；敌方 resistance 面板静态无聚合通道，vulnerability 非等价不代用）——draft 曾以 res_pen 死件承载，过堂摘除（族谱 #7）"
  E3:
    name: "镌刻进深空的瞳孔"
    skill_level_overrides: {"ultimate": 2, "basic": 1}   # 终结技+2、普攻+1
    notes:
      - "终结技+2 随档段：140503 scaling 实取 lv12 档（1.76——index 11）；普攻+1 实取 lv7 档（1.1——scaling 表随档）"
  E4:
    name: "坠落在山谷的炽热"
    hooks:
      # 施放战技时 ATK +30%，持续 2 回合，至多 2 层（→ 最高 +60%）——单件 stacks 计数 +
      # stat_exprs 活读（1015 Archer 先例，免烘焙快照病；draft 双件烘焙件过堂合并）。
      # post-action 授予=当次战技不吃、后续行动吃（「首次是否自吃」待实测）；追加战技不发
      # on_action 行动事件=不叠层（EN 'When using Skill' 字面含追加技——叠加边界待实测）
      - event: "on_action"
        condition: "$event.actor == '1405' && $event.action_type == 'skill' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_ATK_STACKS"
              name: "坠落在山谷的炽热"
              modifier_type: "buff"
              stacks: 1
              max_stack: 2
              stack_mode: "refresh"
              duration: 2
              dispellable: False
              stat_exprs:
                atk_pct: "0.3 * min(stacks($self, 'E4_ATK_STACKS'), 2)"
  E5:
    name: "离心漩涡外的胚种"
    skill_level_overrides: {"skill": 2, "talent": 2}     # 战技+2、天赋+2
    notes:
      - "战技+2：140502 scaling 实取 lv12 档（0.77——index 11）+ 敌数增伤/弹射段随档（param(140502,1/3) 编译期取 lv12）；天赋+2：揭露增伤随档（param(140504,1) lv12=0.324）"
  E6:
    name: "万物皆在万物之中"
    hooks:
      # ① 那刻夏造成的伤害为原伤害的 130%——受击事件按源=那刻夏追加真伤段 0.3×原伤害
      #（category true 跳乘区=与「原伤害×1.3」数值等值近似，遐蝶 E1/昔涟结界同族在案）。
      # 防递归闸 damage_type != 'true'：真伤段自身发 on_hp_decrease 带 'true'（昔涟同闸——
      # draft 漏闸=自触发无限递归，族谱 #12）。触发域=reason 'hit' 受击族（DoT/击破待实测）
      - event: "on_hp_decrease"
        condition: "$event.reason == 'hit' && $event.damage_type != 'true' && $event.source == '1405'"
        effects:
          - effect_type: "deal_damage"
            name: "万物皆在万物之中"
            target: "$event.target"
            damage_type: "true"
            category: "true"
            amount: "0.3 * $event.amount"
      # ② 行迹2 两效果不再依赖智识人数：常驻复授同值（stack_mode replace 与基础行迹件
      # 同 id 幂等——注册序主干先星魂后，E6 版（无 enable_if）恒为最终件，不双叠）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "TR2_ERUDITION_CD"
              name: "Imperative Hiatus"
              modifier_type: "buff"
              duration: 0
              stack_mode: "replace"
              dispellable: False
              stat_effects: {"crit_dmg": 1.4}
          - effect_type: "apply_modifier"
            target: "all_allies"
            modifier:
              modifier_id: "TR2_TEAM_DMG"
              name: "Imperative Hiatus"
              modifier_type: "buff"
              duration: 0
              stack_mode: "replace"
              dispellable: False
              stat_effects: {"all_dmg": 0.5}

hooks:
  # 行迹1 ②：回合开始时若场上无【质性揭露】敌人 → 那刻夏回 30 能量（#2=30）——
  # gain_energy 通道在库（draft 挡因过期勘正）；「无揭露敌人」代理条件=
  # has_modifier($self,'QUALI_DMG_BOOST')<1（当前近似下揭露⇔增伤件同寿命——
  # 敌方揭露计数查询通道缺，弱点通道登记后应改按敌方计数判定，代理在案）
  - event: "on_turn_start"
    condition: "$event.actor == '1405' && has_modifier($self, 'QUALI_DMG_BOOST') < 1"
    effects:
      - effect_type: "gain_energy"
        amount: 30

  # 140502 敌数增伤：每有 1 个可攻击敌人在场 → 本技能伤害 +20%（#3 全档固定，E5 随档
  # param）——常驻件 dmg_skill_dmg_boost 类型桶 + stat_exprs 活读 enemies_alive()
  #（1015 Archer/1008 阿兰先例；draft on_action post-action 授予=本技能不吃=死件勘正）。
  # 战技主段（action 层）+ 弹射段/追加段（伪行动 action_type skill）同吃；计数时点=
  # 面板读取即重估（逐段现场敌数——官方 "when used" 快照时点待实测，段间减员少计在案）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "SKILL_ENEMY_COUNT_DMG"
          name: "分形，驱逐虚知·敌数增伤"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            dmg_skill_dmg_boost: "param(140502, 3) * enemies_alive()"

  # 140502 战技弹射段：额外 4 段（#2），每段对随机 1 名敌人造成单段倍率风伤（#1×攻击力
  # ——param 随档，E5 lv12=0.735）、逐段削韧 5（米游社 10+5×4 交叉校验）；伪行动
  # action_type skill（敌数增伤类型桶命中——飞霄 1220 先例）。"优先弹向本技能尚未命中
  # 过的敌人"去重规则无通道——按随机单体承载（mode random；expected 确定化按序取首，
  # B22 纪律），优先/回退规则待实测；首段指定+后段随机的结构与 1009 艾丝妲同构
  - event: "on_action"
    condition: "$event.actor == '1405' && $event.action_id == '140502' && !$event.insert"
    effects:
      - effect_type: "deal_damage"
        name: "分形，驱逐虚知·弹射1"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        action_type: "skill"
        amount: "param(140502, 1) * stat_of($self, 'atk')"
        toughness_dmg: 5
      - effect_type: "deal_damage"
        name: "分形，驱逐虚知·弹射2"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        action_type: "skill"
        amount: "param(140502, 1) * stat_of($self, 'atk')"
        toughness_dmg: 5
      - effect_type: "deal_damage"
        name: "分形，驱逐虚知·弹射3"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        action_type: "skill"
        amount: "param(140502, 1) * stat_of($self, 'atk')"
        toughness_dmg: 5
      - effect_type: "deal_damage"
        name: "分形，驱逐虚知·弹射4"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        action_type: "skill"
        amount: "param(140502, 1) * stat_of($self, 'atk')"
        toughness_dmg: 5

  # 140504 天赋·追加战技：对【质性揭露】目标使用普攻或战技后追加 1 次战技（EN "an
  # additional instance of Skill"——触发域仅 basic/skill，终结技不触发）；不耗 SP（hook 通道
  # 天然 0 点）、不可再触发（!$event.insert + hook 伤害不发 on_action 行动事件=结构性防递归）。
  # 伪行动 action_type skill——敌数增伤/揭露增伤同吃。主目标存活分支
  - event: "on_action"
    condition: "$event.actor == '1405' && !$event.insert && ($event.action_type == 'basic' || $event.action_type == 'skill') && has_modifier($event.target, 'QUALITATIVE_DISCLOSURE') >= 1 && hp_of($event.target) > 0"
    effects:
      - effect_type: "deal_damage"
        name: "分形，驱逐虚知·追加"
        target: "$event.target"
        damage_type: "wind"
        action_type: "skill"
        amount: "param(140502, 1) * stat_of($self, 'atk')"
        toughness_dmg: 10
  # 追加战技目标死亡分支：转为对随机 1 名敌人释放（官方明示）——快照语义：双分支
  # 条件同读事件时状态（hp_of>0 / <=0 互斥），恰一发（族谱 #9 正向实例）
  - event: "on_action"
    condition: "$event.actor == '1405' && !$event.insert && ($event.action_type == 'basic' || $event.action_type == 'skill') && has_modifier($event.target, 'QUALITATIVE_DISCLOSURE') >= 1 && hp_of($event.target) <= 0"
    effects:
      - effect_type: "deal_damage"
        name: "分形，驱逐虚知·追加"
        target: {pool: "enemies", take: 1, mode: "random"}
        damage_type: "wind"
        action_type: "skill"
        amount: "param(140502, 1) * stat_of($self, 'atk')"
        toughness_dmg: 10

  # 1405102 行迹2 分支：队伍 1 名智识 → 那刻夏暴伤 +140%（#1）；≥2 名智识 → 全队增伤
  # +50%（#2）——count_team(path='erudition') 智识编成计数（含阵亡口径；draft 空参病
  # 勘正——族谱 #6）；stack_mode replace 与 E6 常驻件同 id 幂等
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TR2_ERUDITION_CD"
          name: "Imperative Hiatus"
          modifier_type: "buff"
          duration: 0
          stack_mode: "replace"
          enable_if: "count_team(path='erudition') == 1"
          dispellable: False
          stat_effects: {"crit_dmg": 1.4}
      - effect_type: "apply_modifier"
        target: "all_allies"
        modifier:
          modifier_id: "TR2_TEAM_DMG"
          name: "Imperative Hiatus"
          modifier_type: "buff"
          duration: 0
          stack_mode: "replace"
          enable_if: "count_team(path='erudition') >= 2"
          dispellable: False
          stat_effects: {"all_dmg": 0.5}

scaling_notes:
  - 站位：官方技能全表无站位条件、社区无特殊站位记载 → 无约束（待实测兜底确认隐性站位）
  - 控制模型：普攻/战技/终结技为回合制玩家操控（主目标玩家指定）；弹射落点与追加战技目标
    （原目标死亡转随机）系统自动；天赋/行迹全为全自动 hook
  - 能量条：常规条（上限 140）；普攻 30（20+行迹1 10 烘焙）、战技 6（tbgd 权威，fandom/米游社
    30=6×5 读法待实测）、终结技自回 5；行迹1 回合开始 30 已收（代理条件在案）
  - 战技 5 段/次（主 +4 弹射）：主目标段走 action scaling，弹射段走 on_action hook deal_damage
    （基数 stat_of($self,'atk')，与 action scaling 同源 param(140502,1) 随档）；总削韧 10+5×4=30
  - 追加战技（天赋）：hook 承载、0 SP、单段主目标（削韧 10 保守收录）；是否完整继承 140502
    的「4 段弹射」「回能」「逐段削韧」待实测（EN 仅 "1 additional instance of Skill"）
  - 140506 入场攻击：通用秘技攻击条目（params 空），归通用入场攻击系统，不建独立机制
  - 质性揭露授予近似：当前由终结技 apply_modifiers 授予（升华 7 弱点 ≥ 5 阈值的合规近似）；
    天赋逐 hit 弱点植入通道缺时，非大招路径无法自然达标——弱点计数通道登记后应改为按
    弱点数判定授予（含行迹3 无视防御计数源）
  - 白值终审：一律以 calc lv80 实值 {hp 970.2 / atk 756.756 / def 557.865 / spd 97 / cr 0.05 /
    cd 0.5} 为准（管线不含行迹节点——节点走 trace_stat_effects），社区页数值不采

# 待收清单（挡因如实）
# 1. 天赋逐 hit 弱点植入（每 hit 1 随机弱点、优先未持有类型、持续 3 回合 #2）——挡因：
#    动态弱点类型选择通道缺（weakness_add 仅静态列表；随机/优先规则无宿主函数）。
# 2. 终结技【升华】硬控：无控抗者无法行动——挡因：无法行动通道仅 freeze 族（自带解冻
#    50% 推条副作用非等价）+「控制抵抗」判定/数值通道缺（type_res 无实例源不新造）。
# 3. 行迹3 每弱点 4% 无视防御（上限 28%）——挡因：敌方弱点计数查询函数缺（def_pen 键
#    在库但计数源无通道；hit_condition scoped 只收 dmg_*/all_dmg/res_pen/vulnerability）。
# 4. E2 敌人入场触发天赋弱点添加 + 全属性抗性 -20%——挡因：动态弱点通道缺 + 敌方抗性
#    削减修饰通道缺（res_pen 挂敌方=死键读攻击方面板；vulnerability 非等价不代用）。
# 5. 追加战技完整继承 140502 的 4 段弹射/回能/逐段削韧、E4 追加技叠层——待实测。
# 6. 战技回能 6（tbgd 记档）vs 30（fandom/米游社「6×5」两源读法）——待实测（直接决定
#    2 动 1 大循环成立性）。
# 7. E1 减防逐命中目标粒度（多段弹射命中敌人全挂——社区印证）vs 现主目标段单挂——
#    hit 域无 action_id（族谱 #8）逐目标通道缺，待实测。
# 8. 战技弹射「优先未命中」去重 + 敌人<5 回退规则——挡因：弹射落点策略通道缺（现按随机
#    单体承载，expected 取首），待实测。
# 9. E4 当次战技是否自吃首层（post-action 授予=不吃）、敌数增伤计数时点（stat_exprs 逐段
#    现场敌数 vs 官方 "when used" 快照）——待实测。
# 10. 揭露/增伤件 tick 锚错位（敌方 owner_turn_start vs 那刻夏 owner_turn_end）与行迹1
#     代理条件（揭露⇔增伤件同寿命近似）——近似在案，弱点通道登记后收敛。
# 11. 秘技「攻击者属性」动态元素通道缺（现按施放者=那刻夏风属性近似）。
