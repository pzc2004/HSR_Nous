      - [1.92]
      - [2]
  "140504":
    level_key: talent    # 四分明哲，三重至高（Talent）；#2=弱点持续 3 回合、#3=阈值 5 种 全档固定
    rows:  # lv1..lv15 照抄原始数据 params（15 行表——lv10 = 第 10 行 = 0.30，不取表尾 0.36）
      - [0.18, 3, 5]
      - [0.192, 3, 5]
      - [0.204, 3, 5]
      - [0.216, 3, 5]
      - [0.228, 3, 5]
