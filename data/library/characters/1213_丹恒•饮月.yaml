# 角色模板：丹恒·饮月（1213）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂勘正四件（staging+fixture 同步）+ 引擎补口一件：
#   ①【引擎补口】before_consume payload 加 reason 键（SP 消耗行动归属——SP 队级
#     actor 恒 ""，_adjust_skill_points 的 reason=f"action:<id>" 串为唯一归属
#     凭据；bus 注册表同步）——逆鳞抵扣"仅饮月自身耗点"判定的唯一通道
#   ② 逆鳞抵扣收录（待收 #3 翻案）——before_consume waterfall：modify_amount
#     改写 SP 扣量 max(N−k,0) + gain_resource 扣 squama min(N,k)（优先全抵，
#     次序官方未明示按此读待实测；「视同消耗」与第三方触发器交互无实例在案）
#   ③ 1213101 开局回能收录（待收 #1 翻案——gain_energy 通道在词表，1207
#     Majestas 先例；draft 误判「通道未登记」）
#   ④ 1213102 cc_res 死键件删除——控制特化抵抗通道缺（type_res 公式乘区
#     保留但无实例源不新造；effect_res 全类型抵抗替代=高估非等价）维持待收
#   ⑤ E6 S6_RESPEN 补 stack_mode "replace"（重烘——1207 案同族：refresh
#     留旧烘焙，计数层数变化不更新）
#
# 收录：四档普攻（泽芝 0 耗/瞬华 1 耗/天矢阴 2 耗/盘拏耀跃 3 耗——scaling
#       全表照抄）+ 龙力自在选择器（sp/energy 全 0 官方 EN 明示）+ 121309
#       取消 no-op 行动块（闸门 Skill 核心 ID 不缺）/ 天赋亢心逐击叠层（动作
#       后 +N 层 cap 6——动作内递增未建模在案）+ 烘焙增伤双件 / 战技喝破自
#       第 4 击叠层（天矢阴 2/盘拏耀跃 4 cap 4）+ 烘焙暴伤 / 终结技 3 段
#       主 3.0 邻 1.4 lv10 + 逆鳞 +2 / 逆鳞抵扣 SP / 大行迹星穹奔涌开局
#       回能 15 / 秘技全体 120% + 逆鳞 +1 / E1 擎手统一计数器（每击 1+1
#       层 cap 6+4=10，上限闩 _e1_rh）/ E2 终结技后拉条 100%+逆鳞 +1 /
#       E3/E5 等级族 / E6 队友终结技叠计数→下一次盘拏耀跃虚无抗穿
#       20%/层 ×3（replace 重烘）
# 待收（均带挡因）：1213102 控制抗性（type_res 通道缺）/ 1213103 虚无弱点
#       暴伤（weakness 查询缺，1209 Icing 同族）/ 动作内逐击递增（擎手/喝破
#       ——官方每击叠层本动作后段即吃，现动作后一次叠 N 承载；精确化需
#       instances 分段+逐段叠层，段分布数据缺）/ E4 时长覆写通道 / 视同
#       消耗第三方交互 / 强化三档削韧（fandom 空不脑补）/ 持续时点读法 /
#       龙力自在 uses a Skill 排除域 / AUTO 档位策略 / 终结技回能 ERR 归属
actor_id: "1213"
name: "丹恒·饮月"
level: 80
path: "destruction"   # 命途·毁灭（官方内部类目 Warrior ↔ destruction canonical）
element: "imaginary"

# 1213 丹恒·饮月（Dan Heng · Imbibitor Lunae）人工全机制版，勿用生成器覆盖
#
# 收录：
#   - 四档普攻（泽芝/瞬华/天矢阴/盘拏耀跃）+ 强化选择器龙力自在（121302）——
#     官方 EN "does not consume Skill Points and is not considered as using a Skill"，
#     sp_cost 0/0（tbgd + 官方双源），触发词过滤器 `uses a Skill` 域裁定见待收 #3
#   - 121309「取消」UI 回退钮入 actions（闸门：Skill 类核心 ID 不许缺行动块）——
#     sp/energy 全 0、无战斗效果，编译器视作 no-op
#   - 天赋「亢心」逐击叠层（hits 计数口径：泽芝 2 / 瞬华 3 / 天矢阴 5 / 盘拏耀跃 7 /
#     终结技 3，cap 6）+ 计数层与烘焙增伤双件（1407 天赋增伤同先例）
#   - 「喝破 Outroar」自第 4 击起叠层（天矢阴 5-3=2 层 / 盘拏耀跃 7-3=4 层，cap 4）+
#     烘焙暴伤件（param(121302,1) 随档）
#   - 终结技 3 段主+相邻 + 「逆鳞」资源池（上限 3，param(121303,4)）+ 释放后回能 5
#   - 大行迹 1213101 开局回能 15（已收——gain_energy 通道翻案）/ 1213102 控制抗性
#     +35%（待收：type_res 无实例源不造键，effect_res 全抗非等价）/ 1213103 虚无弱点
#     暴伤 +24%（待收：目标弱点判据不在宿主函数词表）
#   - 秘技 121307 掣空如虹（盘麓状态：开怪全体 120% ATK 虚无伤 + 逆鳞 +1）
#   - 「逆鳞」抵扣战技点（已收——before_consume waterfall + payload.reason 行动归属
#     引擎补口；优先全抵次序在案，第三方「因战技消耗」触发器交互无实例）
#   - 星魂 E1-E6（见 eidolons 块——E1 擎手统一计数器（每击 1+1 层 cap 6+4=10，
#     上限闩 _e1_rh——重审勘正 off-by-one）；E2 终结技后提前 100% + 逆鳞 +1；
#     E3/E5 等级族；E4 待收 #4；E6 队友终结技→下一次盘拏耀跃虚无抗穿
#     20%/层 ×3）
#
# 重审勘正两件（2026-09-24，实证非误报）：
#   ⑥ E1 RH_STACKS off-by-one——官方 E1「gains 1 extra stack for each hit」+
#     天赋基础每击 1 层=每击 2 层 cap 6+4=10；旧拆双计数器（base cap6 +
#     E1 cap4）=min(h,6)+min(h,4)，天矢阴 5 击得 9 ≠ 官方 min(5×2,10)=10。
#     统一计数器：E1 额外层并入 RH_STACKS 同槽（物理上限 10），cap 判别闩
#     _e1_rh 由 RH_DMG stat_exprs 读（param(121304,2)+4×闩）；RH_STACKS_E1
#     双槽设计废弃
#   ⑦ scaling_notes 尾条勘注——「1213101 开局 +15 能量通道缺（待收 #1）」
#     与已收录 on_battle_start gain_energy 15 钩矛盾（待收 #1 早已翻案），
#     旧文勘误
#
# 待收：
#   1. 1213102 控制抗性 +35%——控制特化抵抗通道缺（type_res 无实例源不新造；
#      effect_res 全抗替代=高估非等价；cc_res 死键件已删）
#   2. 1213103 虚无弱点 +24% 暴伤——挡因：目标弱点判据（weakness_of 类）不在宿主函数
#      词表，enable_if 只能读 $self 面板，目标条件通道缺（1209 Icing 同族待收）
#   3. 「逆鳞」抵扣与第三方「因战技消耗」触发器的交互（视同消耗语义无实例——抵扣
#      本体已收：before_consume waterfall + reason 行动归属引擎补口）
#   4. E4 Outroar 持续时间覆写（回合结束 → 下一回合结束）——挡因：duration/tick_anchor
#      的星魂档覆写通道缺（skill_level_overrides 只覆写等级）
#   5. 龙力自在对第三方 `uses a Skill` 触发器的排除是否编译层生效（事件域裁定）
#   6. Outroar/擎手"持续至回合结束"确切清除时点（owner_turn_end 为读法，待实测）
#   7. 瞬华/天矢阴/盘拏耀跃削韧值（fandom 空，仅终结技有米游社 sub_tag 20+20*2）
#   8. 终结技释放后 +5 能量是否受 ERR% 乘区（tbgd 记固定回能 5）
#   9. 自动战斗 AI 强化档位选择策略（社区层无结果，待实测）
#  10. 擎手/喝破"动作内逐击递增"未建模（官方每击叠层本动作后段即吃——现按动作后
#      一次叠 N 层承载；精确化需 instances 分段+逐段叠层，段分布数据缺）
#
# 数值：照 query-game-data params 表；action 倍率全表照抄，hook/modifier 侧系数走
#       skill_params 表 + param() 编译期引用（05_effects §5.1，随档）
