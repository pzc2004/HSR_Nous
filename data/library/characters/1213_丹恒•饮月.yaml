    name: "垂天御驾"
    hooks:
      - event: "on_ultimate"
        condition: "$event.source != '1213' && actor_type_of($event.source) != 'monster'"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "S6_STACKS"
              name: "垂天御驾计数"
              modifier_type: "buff"
              stacks: 1
              max_stack: 3
              stack_mode: "refresh"
              duration: 0
              dispellable: False
      - event: "on_become_target"
        condition: "$event.source == '1213' && $event.action_id == '121312' && has_modifier($self, 'S6_STACKS') >= 1"
        effects:
          # 伤害前挂=本发吃（官方「施放盘拏耀跃时消耗所有层数每层抗穿+20%」——消耗型
          # 本发生效）；draft on_action 伤害后挂=duration 1 当回合到期谁都吃不到（死挂）
          # 已勘正；has_modifier 门控保证 blast 多目标幂等（首目标挂+摘，后续目标条件不过）
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "S6_RESPEN"
              name: "垂天御驾"
              modifier_type: "buff"
              stack_mode: "replace"   # 重烘（1207 案——refresh 留旧烘焙，计数层数变化不更新）
              duration: 1
              tick_anchor: "owner_turn_end"
              dispellable: False
              stat_effects:
                res_pen: "0.2 * min(stacks($self, 'S6_STACKS'), 3)"
          - effect_type: "remove_modifier"
            modifier_id: "S6_STACKS"
      - event: "on_action"
        condition: "$event.actor == '1213' && $event.action_id == '121312' && !$event.insert && has_modifier($self, 'S6_RESPEN') >= 1"
        effects:
          # 消耗型收尾：该次攻击结算后摘除加成件（官方「消耗所有层数」=仅该次攻击——
          # 防同回合二连动（E2 拉条族）第二发残留误吃）
          - effect_type: "remove_modifier"
            modifier_id: "S6_RESPEN"
    notes:
      - "消耗型本发生效：on_become_target 伤害前挂（1207/1209 先例）+摘计数；多目标幂等由 has_modifier 门控承载（draft「声明序先挂后摘」实为死挂——on_action 伤害后挂谁都吃不到）"

