  # before_consume waterfall（engine._adjust_skill_points），payload.reason 携行动归属
  #（2026-09-12 引擎补口——SP 队级 actor 恒 ""，action:<id> 串为唯一归属凭据）；仅饮月
  # 三档强化普攻触发（名义耗点 1/2/3），优先全抵（次序官方未明示按此读，待实测）。
  # 抵扣后 SP 实扣减少 → on_skill_point_change/after_consume 可见量同步减少——「视同
  # 消耗」语义与第三方触发器（花火族）的交互无实例在案。
  - event: "before_consume"
    condition: "$event.resource_id == 'sp' && ($event.reason == 'action:121308' || $event.reason == 'action:121310' || $event.reason == 'action:121312') && res_squama >= 1"
    effects:
      - effect_type: "modify_amount"
        amount: "max($event.amount - res_squama, 0)"
      - effect_type: "gain_resource"
        resource_id: "squama"
        amount: "-min($event.amount, res_squama)"

scaling_notes:
  - "强化档位选择（龙力自在至多 3 连 → 121308/121310/121312）：以独立 basic action 承载（政策/手选同漏斗）；121302 本身为 no-op 选择器（sp 0/energy 0），121309「取消」为 UI 回退 no-op 行动块（sp 0/energy 0/无伤害）"
  - "「逆鳞」抵扣战技点：已收（before_consume waterfall——modify_amount 改写 SP 扣量 + gain_resource 扣 squama；payload.reason 行动归属引擎补口 2026-09-12）。优先全抵次序读法在案；「视同消耗」与第三方触发器交互无实例在案"
  - "擎手/喝破上限与每层数值随档：param(121304,1)/param(121302,1)（E3/E5 覆写后编译期取档 index=等级-1，15 行表 lv12=第 12 行）"
  - "天矢阴/盘拏耀跃相邻溅射自第 4 击起：action 层按 [主, 相邻] 双 scaling 记账，逐击起始序属结算语义（通道待实测，B19 候选）"
  - "1213103 盘龙再临（虚无弱点 +24% 暴伤）数值已判、目标条件通道缺（待收 #2）；1213101 开局 +15 能量已收（on_battle_start gain_energy 钩——待收 #1 翻案，重审勘注：本条旧文「通道缺」与收录矛盾）"
