eidolons:
  E1:
    name: "同袍垂天"
    hooks:
      # 官方 E1「Increases the stackable Righteous Heart count by 4, and gains
      # 1 extra stack of Righteous Heart for each hit」——统一计数器（重审勘正）：
      # 额外层并入主干 RH_STACKS 同槽（每击 1+1=2 层，cap 6+4=10），不再双计数
      # 器并行（旧 RH_STACKS cap6 + RH_STACKS_E1 cap4 拆槽=min(h,6)+min(h,4)，
      # 天矢阴 5 击得 5+4=9 ≠ 官方 min(5×2,10)=10——off-by-one 实证）；上限判别
      # 闩 _e1_rh 由 RH_DMG stat_exprs 读（cap=param(121304,2)+4×闩——modifier
      # max_stack 只承载物理上限 10，refresh 重挂不改 existing.max_stack，引擎
      # 语义见 modifiers._apply_modifier）
      - event: "on_battle_start"
        effects:
          - effect_type: "set_resource"
            resource_id: "_e1_rh"
            amount: 1
      - event: "on_action"
        condition: "$event.actor == '1213' && $event.action_id == '121301' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "RH_STACKS"
              name: "擎手计数"
              modifier_type: "buff"
              stacks: 2
              max_stack: 10
              stack_mode: "refresh"
              duration: 1
              tick_anchor: "owner_turn_end"
              dispellable: True
      - event: "on_action"
        condition: "$event.actor == '1213' && $event.action_id == '121308' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "RH_STACKS"
              name: "擎手计数"
              modifier_type: "buff"
              stacks: 3
              max_stack: 10
              stack_mode: "refresh"
              duration: 1
              tick_anchor: "owner_turn_end"
              dispellable: True
      - event: "on_action"
        condition: "$event.actor == '1213' && $event.action_id == '121310' && !$event.insert"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "RH_STACKS"
              name: "擎手计数"
              modifier_type: "buff"
              stacks: 5
              max_stack: 10
              stack_mode: "refresh"
              duration: 1
              tick_anchor: "owner_turn_end"
              dispellable: True
      - event: "on_action"
