eidolons:
  E1:
    name: "至死不休"
    hooks:
      # HP% ≤ 50% 时战技伤害 +10%（enable_if 门控常驻件——面板读取即重估）；
      # dmg_skill_dmg_boost = dmg_bonus 类型桶正主通道（过堂键名勘正——draft skill_dmg 死键）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E1_SKILL_DMG"
              name: "至死不休"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "$self.hp / $self.max_hp <= 0.5"
              stat_effects: {"dmg_skill_dmg_boost": 0.1}
    notes:
      - "与天赋增伤同区加算（dmg_boost_multi 的 all/elemental/type 三桶加和）；原全局 hooks 挂载=E0 也生效 bug 已归位本块（过堂）"
  E2:
    name: "破釜沉舟"
    hooks:
      - event: "on_action"
        condition: "$event.actor == '1008' && $event.action_id == '100802' && !$event.insert"
        effects:
          - effect_type: "remove_modifier"
            target: "self"
            filter: "$mod.kind == 'debuff'"
            max_count: 1
      - event: "on_ultimate"
        condition: "$event.source == '1008'"
        effects:
          - effect_type: "remove_modifier"
            target: "self"
            filter: "$mod.kind == 'debuff'"
            max_count: 1
    notes:
      - "净化与战技自伤的同回合先后、不可驱散 Debuff 的 LIFO 跳过行为待实测"
  E3:
    name: "奋起直追"
    skill_level_overrides: {"skill": 2, "basic": 1}
    notes:
      - "战技+2 随档段：action scaling（实取 lv12 档）+ 耗血比例 param(100802,1)（全档 0.15 无观察差）；普攻+1：10 档上限无第 11 档，跳过（param() 越档钳表尾+⚠编译警告口径）"
  E4:
    name: "反败为胜"
    hooks:
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E4_TURN_THE_TABLES"
              name: "反败为胜"
              modifier_type: "buff"
              duration: 2
              dispellable: False
      - event: "before_take_damage"
        condition: "$event.target == '1008' && has_modifier($self, 'E4_TURN_THE_TABLES') >= 1 && $event.amount >= hp_of($event.target)"
        effects:
          - effect_type: "heal"
            target: "self"
            amount: "0.25 * $self.max_hp"
          - effect_type: "remove_modifier"
            modifier_id: "E4_TURN_THE_TABLES"
          - effect_type: "cancel_event"
    notes:
      - "致死判定走 before_take_damage 通道（attack 类伤害；DoT 不经此通道——护盾穿透/护盾在场判定口径待实测）；2 回合计时起点=进场即起算（与 Repel 触发优先级待实测）"
  E5:
    name: "竭尽全力"
    skill_level_overrides: {"ultimate": 2, "talent": 2}
    notes:
      - "终结技+2：action scaling/scaling_blast 实取 lv12 档；天赋+2：失 HP 增伤上限 param(100804,1) 随档（实取 lv12=0.792）"
  E6:
    name: "同归于尽"
    hooks:
      # HP% ≤ 50% 时终结技伤害 +20%（enable_if 门控常驻件；dmg_ultimate_dmg_boost
      # 类型桶——过堂键名勘正 draft ult_dmg 死键 + 归位本块）
      - event: "on_battle_start"
        effects:
          - effect_type: "apply_modifier"
            target: "self"
            modifier:
              modifier_id: "E6_ULT_DMG"
              name: "同归于尽"
              modifier_type: "buff"
              duration: 0
              dispellable: False
              enable_if: "$self.hp / $self.max_hp <= 0.5"
              stat_effects: {"dmg_ultimate_dmg_boost": 0.2}
    notes:
      - "待收：相邻目标倍率提升至与主目标同级（#2 槽改用 #1 倍率）——挡因：action scaling_blast 为静态档位表（eidolon overrides 仅消费 state_config，锚范例同口径），hook 侧目标代数无相邻位选择通道（where 无 adjacency 宿主函数），差值补齐（(param(100803,1)-param(100803,2))*atk 补给相邻）无法定位相邻目标"

hooks:
  # 战技 100802 自伤：消耗自身 Max HP 的 15%（param(100802,1) 全档固定），HP 不足时降至 1
  #（floor 1 保底不致死——官方 EN "his HP will be reduced to 1"）
  - event: "on_action"
    condition: "$event.actor == '1008' && $event.action_id == '100802' && !$event.insert"
    effects:
      - effect_type: "drain_hp"
        target: "self"
        amount: "param(100802, 1) * $self.max_hp"
        floor: 1
        drain_ratio: 0

  # 天赋 100804 至痛至怒：按当前损失 HP 百分比获得增伤，上限 param(100804,1)（lv10=0.72）
  #——常驻条件光环，stat_exprs 现场求值（04_modifier §4.16 面板读取即重估——过堂勘正：
  # draft 写 stat_effects，hook 物化=施加时刻一次性快照烘焙（hooks.py apply_modifier
  # 注释"施加时刻快照"），开战满血烘 0 后永久 0=死件）；线性插值形状由社区佐证
  #（starguide/KQM），精确函数式官方未给，待实测
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ARLAN_TALENT_DMG"
          name: "至痛至怒"
          modifier_type: "buff"
          duration: 0
          dispellable: False
          stat_exprs:
            all_dmg: "param(100804, 1) * (1 - $self.hp / $self.max_hp)"

  # 大行迹 1008101 Revival：击败敌人时若当前 HP% ≤ 30%，回复 Max HP × 20%（on_kill 逐杀发射）
  - event: "on_kill"
    condition: "$event.source == '1008' && $self.hp / $self.max_hp <= 0.3"
    effects:
      - effect_type: "heal"
        target: "self"
        amount: "0.2 * $self.max_hp"

  # 大行迹 1008102 Endurance【过堂摘除落待收】：抵抗持续伤害类负面效果概率 +50%
  #（dot_resist）——DoT 专属抗性键无读取端（src 全仓无 dot_resist 消费点=静默死键，
  # 1507 教训）；debuff 命中判定走 hit_chance(effect_res 全负面抗性)，effect_res 非
  # DoT 限定不可压缩。与效果抵抗加算顺序待实测随主件同收。

  # 大行迹 1008103 Repel：进战时 HP% ≤ 50% → 置免伤闩；首次被攻击（before_take_damage 通道）
  # 豁免除 DoT 外全部伤害并清闩——DoT 不走该通道天然不解闩，符合官方"直到被攻击"的
  # 除 DoT 外语义；追加攻击/反击是否解除闩待实测
  - event: "on_battle_start"
    condition: "$self.hp / $self.max_hp <= 0.5"
    effects:
      - effect_type: "set_resource"
        resource_id: "_repel_active"
        amount: 1
  - event: "before_take_damage"
    condition: "$event.target == '1008' && res__repel_active >= 1"
    effects:
      - effect_type: "cancel_event"
      - effect_type: "set_resource"
        resource_id: "_repel_active"
        amount: 0

  # E1/E6 原全局挂载段【过堂移除——星魂件挂全局 hooks=E0 也生效的 bug】：
  # 两件已各归 eidolons.E1/E6.hooks（星魂闸按 rank 注册才是正解）；
  # 键名勘正同步：skill_dmg/ult_dmg 无读取端（面板死键）→ dmg_skill_dmg_boost /
  # dmg_ultimate_dmg_boost（dmg_bonus 类型桶正主通道——pipeline dmg_boost_multi
  # 读 f"{action_type}_dmg_boost"）

scaling_notes:
  - "普攻 100801 只有 10 档（params 表 10 行）——E3 普攻+1 无第 11 档可取，跳过（钳表尾+⚠口径）"
  - "战技 HP 消耗全档 0.15 不随级变（param(100802,1) 十五行恒同值）；先扣血后出伤的结算时序对天赋增伤即时生效的影响（1 HP 边界伤害值）待实测"
  - "Repel 的 before_take_damage cancel 与 E4 致死拦截同通道双 hook 并存：Repel 闩在场时先 cancel（免伤），闩清后 E4 件接管——触发顺序按声明序，与官方优先级的吻合度待实测"
