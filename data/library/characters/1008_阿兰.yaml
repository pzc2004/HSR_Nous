# 角色模板：阿兰（1008）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）
#
# 过堂收编/勘正四件：① E1/E6 星魂件归位——draft 挂全局 hooks（E0 也生效的
#   星魂闸 bug），各归 eidolons.E1/E6.hooks（星魂按 rank 注册才是正解）。
#   ② 增伤键名勘正——skill_dmg/ult_dmg 面板死键（无读取端）→ dmg_skill_dmg_boost
#   / dmg_ultimate_dmg_boost（dmg_bonus 类型桶正主通道：pipeline dmg_boost_multi
#   读 f"{action_type}_dmg_boost"；dmg_ 前缀路由先例=长夜月 dmg_final_dmg_boost）。
#   ③ 天赋至痛至怒 stat_effects→stat_exprs——hook 物化的 stat_effects 字符串值
#   =施加时刻一次性快照烘焙（hooks.py 注释"施加时刻快照"），开战满血烘 0 后
#   永久 0=死件；stat_exprs 现场求值（§4.16 面板读取即重估）才是正主，实证
#   40% 血→all 0.432 活求值。
#   ④ 大行迹 Endurance 摘除落待收——dot_resist 键无读取端（src 全仓无消费点
#   =静默死键）；debuff 命中走 effect_res 全负面抗性，非 DoT 限定不可压缩。
#
# 收录：普攻（单体 1.4 lv10）/ 战技（单体 2.4 lv10 + 自伤 15% Max HP 全档固定
#       + floor 1 保底，不耗点不产点 tbgd 权威）/ 终结技（Blast 主 3.2+邻 1.6）
#       / 天赋至痛至怒（失 HP 线性增伤上限 0.72 lv10——stat_exprs 活求值）
#       / 大行迹 Revival（on_kill HP≤30% 回 20% Max HP）/ Repel（进战低血免伤闩
#       ——sim 开战恒满血自然不可达，cancel 路径 e2e 钉死）
#       / E1 战技增伤 10%（HP≤50% 门控）/ E2 双通道净化 / E4 致死拦截回 25%
#       / E6 终结技增伤 20% / E3/E5 等级族
# 待收（均带挡因）：Endurance DoT 抗性（过堂④）/ E6 邻位倍率同级（邻接代数
#       通道缺）/ 战技先扣血后出伤时序（现 on_action 后扣——天赋增伤读扣前 HP，
#       与官方先后待实测）/ 秘技大世界入口语义
actor_id: "1008"
name: "阿兰"
level: 80
path: "destruction"
groups: ["faction:none"]
element: "thunder"
# 收录：普攻 100801（单体、回能 20/产点 +1）/
#       战技 100802（自伤 Max HP 15% 全档固定 + floor 1 保底不致死，不耗点不产点——
#       tbgd sp_cost=0/sp_gain=0 权威，starguide"战技产点"表述按证据笔记不采纳）/
#       终结技 100803（Blast 主+邻双倍率、能量耗 110 回 5）/
#       天赋 100804 至痛至怒（失 HP 增伤上限随档 param(100804,1)，线性形状社区佐证）/
#       秘技 100807（全体雷伤 0.8，单档字面值）/
#       大行迹 Revival（on_kill 低血 30% 回 20% Max HP）/
#       Repel（进战 HP≤50% 获得 before_take_damage 免伤闩，首次被攻击即解除——
#       DoT 不走该通道天然豁免，符合官方"除持续伤害外"）/
#       星魂 E1-E6（E1 战技增伤/E2 净化标准结构/E4 致死拦截/E6 终结技增伤——
#       各归 eidolons 块星魂闸；E3/E5 等级族）
# 待收：Endurance（DoT 抗性 +0.5——dot_resist 键无读取端死键摘除，effect_res 非
#       DoT 限定不可压缩）/
#       E6 邻位倍率提升至主目标同级——挡因：action 层 scaling_blast 为静态档位表，
#       eidolon overrides 仅消费 state_config（锚范例同口径在案），hook 侧无相邻目标代数键
#       （目标代数 where 无 adjacency 宿主函数），差值补齐通道缺，非量子无观察差外的硬缺；
#       100806 攻击（Overworld）无倍率无参数，按通用入口动作记注不入 actions
# 数值：照 query-game-data params 表；action 倍率全表照抄，hook/modifier 侧系数走
#       skill_params 表 + param() 编译期引用（05_effects §5.1）
base_stats:
  hp: 1199.52
  atk: 599.76
  def: 330.75
  spd: 102
  crit_rate: 0.05
  crit_dmg: 0.5
  max_energy: 110
trace_notes:
  - "大行迹 Revival（1008101）已收：击败敌人时若自身 HP% ≤ 30%，回复 Max HP × 20%（on_kill 逐杀发射）；一次行动击杀多敌算几次待实测（按敌计 vs 按次计——on_kill 逐杀发射默认按敌计，在案）"
  - "大行迹 Endurance（1008102）待收：抵抗持续伤害类负面效果概率 +50%——dot_resist 键无读取端（过堂摘除死键；debuff 命中走 effect_res 全负面抗性，非 DoT 限定不可压缩）"
  - "大行迹 Repel（1008103）已收：进战时 HP% ≤ 50% 获免伤闩，首次被攻击前豁免除 DoT 外全部伤害；失效语义中追加攻击/反击是否解除闩待实测；与 E4 致死保护优先级待实测"
  - "100806「攻击」（Overworld 入口）：无倍率无参数，仅作战斗初始化注记，不入伤害 actions（官方文本）"
trace_stat_effects:     # 行迹白值节点（B-TR① 回填——character_skill_trees.json 1008201-210 逐项加总）
  atk_pct: 0.28         # 攻击强化 ×5（0.04+0.04+0.06+0.06+0.08——1008201/03/05/07/10）
  hp_pct: 0.10          # 生命强化 ×2（0.04+0.06——1008204/08）
  effect_res: 0.18      # 效果抵抗 ×3（0.04+0.06+0.08——1008202/06/09）

