  - action_id: "100803"
    name: "狂者制裁"
    action_type: "ultimate"
    target_type: "blast"
    damage_type: "thunder"
    scaling: [{"atk": 1.92}, {"atk": 2.048}, {"atk": 2.176}, {"atk": 2.304}, {"atk": 2.432},
              {"atk": 2.56}, {"atk": 2.72}, {"atk": 2.88}, {"atk": 3.04}, {"atk": 3.2},
              {"atk": 3.328}, {"atk": 3.456}, {"atk": 3.584}, {"atk": 3.712}, {"atk": 3.84}]
    # 主目标 lv1..lv15（lv10=3.2）
    scaling_blast: [{"atk": 0.96}, {"atk": 1.024}, {"atk": 1.088}, {"atk": 1.152}, {"atk": 1.216},
                    {"atk": 1.28}, {"atk": 1.36}, {"atk": 1.44}, {"atk": 1.52}, {"atk": 1.6},
                    {"atk": 1.664}, {"atk": 1.728}, {"atk": 1.792}, {"atk": 1.856}, {"atk": 1.92}]
