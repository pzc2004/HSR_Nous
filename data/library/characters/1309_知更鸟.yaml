techniques:
  - technique_id: "130907"
    name: "酣醉序曲"
    point_cost: 1
    # 领域半待收（头注⑤）：领域内敌人不攻击 Robin 并跟随 Robin / 同场仅 1 个我方领域
    # ——挡因：Zone/仇恨/领域互斥通道缺；本版只收进战 latch + 每波回能 5
    effects:  # 进战一次性预置（编译器转 on_battle_start 装填钩；施放者=Robin）：领域 latch
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "TECH_DRUNK_OVERTURE"
          name: "酣醉序曲"
          modifier_type: "buff"
          duration: 0
          dispellable: False
    hooks:  # 仅 pre_battle 选用本秘技时注册（编译器通道——勿在模板 hooks 复写，防双挂，勘正⑧）
      - event: "on_wave_start"
        condition: "has_modifier($self, 'TECH_DRUNK_OVERTURE') >= 1"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 5

actions:

  - action_id: "130901"
    name: "扑翼白声"
    action_type: "basic"
    target_type: "single"
    damage_type: "physical"
    scaling:  # lv1..lv10 ATK 倍率全表照抄（官方 desc "Physical DMG equal to #1[i]% of Robin's ATK"；lv6=index5=1.0）
      - {"atk": 0.5}
      - {"atk": 0.6}
      - {"atk": 0.7}
      - {"atk": 0.8}
      - {"atk": 0.9}
      - {"atk": 1.0}
      - {"atk": 1.1}
      - {"atk": 1.2}
      - {"atk": 1.3}
      - {"atk": 1.4}
    toughness_dmg: 10        # 米游社 sub_tag 削韧 10（tbgd stance 30÷3 同值）
    skill_point_gain: 1      # tbgd sp_gain=1 + 米游社「战技点 +1」双源一致
    energy_gain: 20          # tbgd energy=20 + 米游社「回能 20」双源一致

  - action_id: "130902"
    name: "翎之咏叹调"
    action_type: "skill"
    target_type: "self"      # 全队友自动生效（无目标选择）——self + effect_scope team 承载
    damage_type: "none"      # 纯支援技无伤害段（1306 先例）
    toughness_dmg: 0
    skill_point_cost: 1      # tbgd sp_cost=1 + 米游社「战技点 -1」双源一致（勘正⑦——draft「米游社无标」不实）
    energy_gain: 30          # tbgd energy=30 + 米游社「回能 30」双源一致（A3 行迹 +5 走 hook，合计 35）
    apply_modifiers:
      - target: "self"       # 全队友增伤 3 回合（lv10 #1=0.5——param() 编译期取档）；倒计时按 Robin 自身回合
        modifier_id: "ROBIN_SKILL_DMG"   # 减 1（官方 "This duration decreases by 1 at the start of
        name: "翎之咏叹调"               # Robin's every turn"——主体是 Robin 本人，非受体回合）
        modifier_type: "buff"
        duration: 3
        tick_anchor: "owner_turn_start"
        effect_scope: "team"
        dispellable: True
        stat_effects: {"all_dmg": "param(130902, 1)"}

  # 协奏（Concerto）状态全族待收：进入状态 / 协奏期间 ATK 加成（Robin_ATK×#1 + #3 固定）/
  # 追加伤害（固定 CR #5、固定 CD #6——deal_damage 无固定暴击覆写通道）/ 自体禁动+免控 /
  # 倒计时独立条目 SPD=90 / 结束立即行动（见头注①②）
  # 已收半件：施放时除 Robin 外全体队友立即行动（hooks on_ultimate：advance_action 100）
  - action_id: "130903"
    name: "千音迭奏，群星赋格"
    action_type: "ultimate"
    target_type: "self"
    damage_type: "none"      # 纯支援技无伤害段（追加伤害属协奏族，待收①②）
    energy_cost: 160         # 官方 max_sp 160 全扣
    energy_gain: 5           # tbgd energy_gen=5 + 米游社「回能 5」双源一致（sp_cost=0/sp_gain=0）
    toughness_dmg: 0

  # 战斗外遭遇动作（type_text 空、params 空表）：占位 basic（1002_丹恒/1215_寒鸦先例，
  # 勘正⑤——draft 误用 assist=助战技原语后门）；无 scaling 天然惰性（伤害/削韧段要
  # damage_type+scaling 双有才结算）；入场削韧结算通道未登记——头注④
  - action_id: "130906"
    name: "攻击"
    action_type: "basic"
    target_type: "single"
    damage_type: "physical"
    toughness_dmg: 10        # tbgd stance 30÷3 显示口径（官方：战斗外攻击入场按属性削韧；无 params 倍率）
    energy_gain: 0

hooks:
  # 天赋 130904 常驻半：全体友方 CRIT DMG +20%（lv10 #1——param() 编译期取档；
  # 常驻无持续——挂 self + effect_scope team 光环，阮梅弦外音族先例）
  - event: "on_battle_start"
    effects:
      - effect_type: "apply_modifier"
        target: "self"
        modifier:
          modifier_id: "ROBIN_TALENT_CD"
          name: "调性合颂"
          modifier_type: "buff"
          duration: 0
          effect_scope: "team"
          dispellable: False
          stat_effects: {"crit_dmg": "param(130904, 1)"}

  # 大行迹 1309101 华彩花腔：战斗开始时自身行动提前 25%（params_max=[0.25] 字面值——
  # 无等级轨道；每波/仅首波待实测）
  - event: "on_battle_start"
    effects:
      - effect_type: "advance_action"
        target: "self"
        amount: 25

  # 天赋 130904 回能半：我方目标攻击命中敌方后 Robin 自回能 2（lv10 #2，全档恒定）。
  # 触发域 = 非怪物主体 + 目标为怪物（勘正②——含追加攻击/反击等插入式攻击，官方
  # "after allies attack enemy targets"；FUA 队喂能是核心联动）；对友方施放的辅助/治疗
  # 不触发（目标过滤）；DoT 结算不发 on_action 不触发（引擎通道语义在案）。
  # 警戒：协奏追加伤害（待收②）落地须走 deal_damage 不发 on_action——否则误回本钩
  - event: "on_action"
    condition: "actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster'"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: "param(130904, 2)"

  # 大行迹 1309103 模进乐段：施放战技时额外回复 5 点能量（与基础 30 加算=35；
  # 行迹数值字面值——无等级轨道）
  - event: "on_action"
    condition: "$event.actor == '1309' && $event.action_id == '130902' && !$event.insert"
    effects:
      - effect_type: "gain_energy"
        target: "self"
        amount: 5

  # 终技 130903 施放：除 Robin 外全体队友立即行动（官方 "makes all teammates (i.e.,
  # excluding this unit) immediately take action"——行动条推进 100 先例通道，1101 布洛妮娅
  # 同族）；协奏入场/其余半待收（头注①）
  - event: "on_ultimate"
    condition: "$event.source == '1309' && $event.action == '130903'"
    effects:
      - effect_type: "advance_action"
        target: {pool: "allies", where: "$it.actor_id != '1309'"}
        amount: 100

# 星魂（ranks）——build.yaml member.eidolon: N 激活 E1..EN（数值/机制照抄 ranks_detail desc）
eidolons:
  E1:
    name: "Land of Smiles"   # 微笑的国度（character_ranks.json 对拍一致）
    notes:
      - "待收：协奏激活时全体友方全属性抗性穿透 +24%（字面值 0.24）——挡因：协奏持续门通道缺（头注①）"
  E2:
    name: "Afternoon Tea For Two"   # 两者的午茶
    hooks:
      # 天赋能量回复效果额外 +1（官方 "additionally increases by 1"——Talent 基值 2 → 合计 3；
      # 触发域与天赋本钩同口径，勘正②）
      - event: "on_action"
        condition: "actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster'"
        effects:
          - effect_type: "gain_energy"
            target: "self"
            amount: 1
    notes:
      - "待收：协奏激活时全体友方速度 +16%（spd_pct 白值口径）——挡因：协奏持续门通道缺（头注①）"
  E3:
    name: "Inverted Tuning"   # 倒悬的弦宫
    skill_level_overrides: {"skill": 2, "ultimate": 2}
    notes:
