scaling_notes:
  - "协奏（Concerto）是独立行动轴实体（固定 SPD 90）+ Robin 自体禁动/免控状态：不可建模成普通 buff，也无第二 actor 登记通道——本版只收施放瞬时的『除 Robin 外全体立即行动』，其余半全部待收并挡因上墙；不许以常驻闩近似（会使协奏永久化）"
  - "天赋回能触发域：非怪物主体 + 目标为怪物（含 FUA/反击——三层措辞『uses an ability』『attack』在案；DoT 不发 on_action 不触发）；纯辅助/治疗对友方施放不触发——目标过滤在案"
  - "倒计时 SPD=90 是否吃减速/加速/行动条推进：官方文本暗示不吃，无显式声明——待实测（随协奏族①并案）"
  - "秘技 130907 酣醉序曲：领域半待收（头注⑤）；已收进战 latch + 每波回能 5（on_wave_start——钩仅 pre_battle 选用时注册，勘正⑧双挂已拆）"
  - "秘技点耗：官方 point_cost=1 已记；多 Robin 同队场景波次归属待实测"
