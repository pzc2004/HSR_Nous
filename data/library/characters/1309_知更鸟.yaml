# 角色模板：知更鸟（1309）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging）+ 过堂勘正（staging→fixtures 合并流水线）。
#
# 过堂勘正八件：① 行迹白值节点假挡因——draft 称「四条米游社链接抓取 Loading →
#   行迹数值节点全部待收」，但官方 StarRailRes character_skill_trees.json 自带结构
#   化 properties（ATK%+28/HP%+18/SPD+5）——官方数据无需社区页，脑补挡因删除：
#   trace_stat_effects 收 atk_pct 0.28/hp_pct 0.18（1409 生成器口径先例）、spd 102+5
#   =107 烘焙入 base_stats（phainon/昔涟先例）；② 天赋回能触发域两处错——draft 条件
#   无目标过滤（Robin 自放战技 target self / 队友对治疗增益目标施放都会误触 +2，
#   Archer 1015 过堂同案）且 `!$event.insert` 误排除追加攻击/反击（官方 "after allies
#   attack enemy targets"——FUA/反击同触发，FUA 队喂能是核心联动）：勘正为
#   actor_type_of($event.actor) != 'monster' && actor_type_of($event.target) == 'monster'
#   （E2 钩同改）；③ E4 max_count: 1 脑补限量——官方「解除我方全体的控制类负面状态」
#   无个数限制，删 max_count；④ E4 filter `$mod.tags includes 'crowd_control'` 死字段
#   ——remove_modifier 的 $mod 命名空间无 tags 键（只有 modifier_id/modifier_type/
#   debuff_kind/control_kind/dispellable/kind）：勘正 `$mod.kind == 'control'`
#   （1413/1415 先例）；⑤ 130906 action_type "assist" 错型——assist = 助战技原语
#   （fire_assist 专用、无额度资源=无限次免费发动后门）：勘正 "basic"（1002_丹恒/1215_
#   寒鸦先例——无 scaling 天然惰性：伤害/削韧段要 damage_type+scaling 双有才结算）；
#   ⑥ E5 注「普攻+1 实取 lv10（表尾）」档位错——编译器默认档 basic lv6，+1 = lv7 →
#   scaling index6 = 1.1；⑦ 战技 SP「米游社无消耗标」叙事不实——米游社实有「战技点
#   -1」标签，与 tbgd sp_cost=1 双源一致无冲突；⑧ 秘技每波回能钩双挂——techniques.
#   hooks 与模板 hooks 末段重复同一 on_wave_start 回能 5（pre_battle 选用秘技后双注册
#   → 每波 +10）：删模板侧重复钩，只留 techniques 块内（编译器仅选用时注册）。
# 收录：普攻（产 1 SP/回能 20/削韧 10）/ 战技（耗 1 SP、回能 30+A3 行迹 5=35、全队增伤
#       param(130902,1) 持续 3 回合 tick_anchor owner_turn_start——倒计时按 Robin 自身
#       回合走）/ 终结技（能量门 160 全扣 + 返还 5 + 除 Robin 外全体队友立即行动——
#       advance_action 100 先例通道）/ 天赋（常驻全队暴伤光环 param(130904,1) + 我方
#       攻击命中敌方后自回能 param(130904,2)=2，触发域含 FUA/反击）/ A1 进战自身行动
#       提前 25% / A3 战技额外回能 5 / 秘技 130907（进战 latch + 每波回能 5）/
#       行迹白值节点（atk_pct 0.28/hp_pct 0.18/spd +5）/ E2 天赋回能 +1 /
#       E3（skill+2/ultimate+2）/ E4 终结技驱散全队控制类负面 / E5（basic+1/talent+2）
# 待收（均带挡因）：
#   ① 协奏（Concerto）状态全族：倒计时独立行动轴实体（固定 SPD 90——无第二 actor/
#      计时实体登记通道）；协奏期间 Robin 自体禁动（无 turn_lock 通道）+ 免控；协奏
#      期间全队 ATK +（Robin_ATK×#1 + #3 固定）；协奏结束立即行动。同挡全族：A2 即兴
#      装饰（协奏期间全体追加攻击暴伤 +25）、E1 全属性抗穿 +24%、E2 速度 +16%、
#      E4 效果抵抗 +50%、E6（见③）——协奏持续门是公共前置，门缺全挂
#   ② 协奏期间追加伤害：deal_damage 无固定 CRIT Rate/CRIT DMG 覆写通道（#5=1/#6=1.5
#      不可表达）；落地警戒：须走 deal_damage（不发 on_action——防天赋回能误触发+递归）
#   ③ E6「追加伤害暴伤 +450%、至多 8 次、每次施放终技重置」：per-ultimate 计数池+跨
#      目标分摊模型无通道（叠①②）
#   ④ 130906 战斗外遭遇攻击：入场削韧结算通道未登记（本版占位 basic 在案——params
#      空表不写 scaling，天然惰性；削韧 10 取 tbgd stance 30÷3 显示口径）
#   ⑤ 领域互斥（同场仅 1 个我方领域）与领域内敌人不攻击/跟随 Robin：Zone/仇恨通道缺
#   ⑥ groups 分组名册：官方名册数据未下发（非黄金裔——_FACTION_ROSTERS 无对照），
#      缺省不脑补
# 数值：params 全表照抄官方 character_skills.json（130901 十档 / 130902-130904 十五档，
#      逐行程序对拍一致）；hook/modifier 侧系数走 skill_params + param()（05_effects
#      §5.1——编译期替换）；行迹/秘技无等级轨道一律字面值
actor_id: "1309"
name: "知更鸟"
level: 80
path: "harmony"      # 命途（count_team 编成计数口径；官方数据 path=Shaman 即同谐）
element: "physical"  # 元素（element_of 取数源；官方数据照抄）
base_stats:
  hp: 1280.664       # 官方管线实值（calc_character_stats 对拍一致）
  atk: 640.332
  def: 485.1
  spd: 107           # 102 + 行迹速度节点 ×2（1309204 +2/1309208 +3——SpeedDelta 烘焙口径，phainon/昔涟先例）
  crit_rate: 0.05
  crit_dmg: 0.5
  max_energy: 160    # 官方 max_sp 160（query-game-data/米游社双源一致；走内建 energy——
                     # energy_cost/energy_gain + gain_energy 钩；不许在 custom_resources 声明 energy）

trace_stat_effects:
  atk_pct: 0.28      # 行迹攻击节点 ×5（1309201/03/05/07/10：0.04+0.04+0.06+0.06+0.08——初始 modifier 通道，1409 先例）
  hp_pct: 0.18       # 行迹生命节点 ×3（1309202/06/09：0.04+0.06+0.08）
trace_notes:
  - "大行迹 1309101 华彩花腔（A2 晋阶 2）：战斗开始自身行动提前 25%（#1 字面值 0.25——无等级轨道）已收（on_battle_start advance_action self 25）；每波/仅首波待实测"
  - "大行迹 1309102 即兴装饰（A4 晋阶 4）：协奏时我方全体追加攻击暴伤 +25%——待收（协奏持续门通道缺，头注①）；EN 限定 Follow-Up ATK 一类"
  - "大行迹 1309103 模进乐段（A6 晋阶 6）：施放战技额外恢复 5 点能量（#1 字面值——无等级轨道）已收（on_action 钩 gain_energy 5，与战技基础 30 加算=35）"
  - "行迹白值节点全收：ATK%+28/HP%+18（trace_stat_effects 通道）+ SPD+5（烘焙 base_stats.spd 107）——官方 character_skill_trees.json properties 结构化字段直取，勘正①"
  - "秘技 130907 酣醉序曲：领域半待收——领域内敌人不攻击 Robin 并跟随 / 同场仅 1 个我方领域（Zone/仇恨/领域互斥通道缺，头注⑤）；已收进战 latch + 每波回能 5（#2 字面值）"
  - "站位：官方/wiki/社区均无——待实测（不脑补）"

