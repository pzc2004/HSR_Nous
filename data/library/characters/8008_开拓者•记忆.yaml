# 角色模板：开拓者•记忆（8008，星·playergirl4——与 8007 穹 同人物另一实体，
# 引用必须全称「开拓者•记忆」或带 ID，不得简称）——**人工全机制版，勿用生成器覆盖**
#
# **真身在本目录；测试经 `template_roots` 注入（人工根优先于 data/ 生成根，
# 见 `sim/compile/build_compiler.py:_load_template`）**
#
# 出处：打标 DAG 产物（staging 8008_{NICKNAME}）+ 过堂勘正（staging→fixtures 合并
# 流水线）。数据锚：StarRailRes 官方技能/星魂/行迹文本与 params（终审——8007/8008
# 同套件逐项 diff 全同，忆灵技能锚定共享条目 18007xx）× tbgd AvatarSkillConfig
# （削韧/回能/战技点权威）× 米游社开拓者笔记（五项标签）× fandom（交叉）×
# Prydwen/HoYoLAB（秘技 100%/真伤全域互证）× 8007 先例 fixture（同套件已验件）。
#
# 过堂勘正清单（draft 病 → 正解）：
#   ① 星魂幻名 ×6——E1-E6 全用英文名 → 官方名（现在的记叙者/过往的拾遗者/
#     未来的咏唱者/缪斯的新舞伴/诗篇的裁缝匠/神启的转呈者，character_ranks.json
#     终审）；② 忆灵技能漏查（全稿最大病）——draft 记「Mem 战技与 Mem's Support
#     数据未下发」并举四件待收，实际官方锚定 18007xx 全量下发（1<首 cid>xx 平行
#     id，1402 衣匠 11402xx 同族）：Mem 战技/支援/三天赋/充能规则/真伤 Buff 全收；
#   ③ 800806 误判「忆灵普攻 memosprite_skill」——官方 type MazeNormal=大世界
#     普攻占位条目（140206 同族）→ 不建 action 输出轴；
#   ④ res__epic 前缀错位——资源 id `epic` 平铺=res_epic（res_+id 逐字，万敌
#     res__charge 同病灶）；available_if 的 res_ 闸未接线，写错=静默锁死双普攻；
#   ⑤ remove_modifier filter「controlled($it)」——filter 绑定的是 $mod（待审
#     modifier），$it 无注入点=死 filter；正解 $mod.kind == 'control'（1413 先例）；
#   ⑥ 8008102 触发域双错——action_type == 'skill' 永不命中（忆灵技 action_type=
#     memosprite_skill，静默死钩）且官方触发技限定【坏人！麻烦！】→
#     action_id == '1800701'；
#   ⑦ E2 域过宽——「非本体非迷迷」命中全部我方角色行动 → actor_type_of ==
#     'summon' && != '8008_mem'（官方「除迷迷以外的我方忆灵」）；
#   ⑧ 秘技伤害 1% → 100%（#3[i]% 的 [i] 格式=值×100 取整；Prydwen/HoYoLAB/
#     Gachabase 三源互证）；负推 advance_action -50 → delay_action 50 正通道；
#   ⑨ 削韧三处——800803「保守 0」→ 20（tbgd stance 60/3+fandom 20+米游社 20
#     三源，族谱#14 fandom 非空不许保守）；800808「保守 0」→ 5+5 拆账（fandom
#     5+5+tbgd 30/3=10+米游社 10）；800801 缺 → 10（三源一致，所谓冲突不成立）；
#   ⑩ 终结技/强普迷迷半伤害通道错——draft 落本体 action scaling/本体钩 $self.atk
#     （错吃行迹 atk 14% 与暴伤 0.373）≠官方「迷迷 ATK」面板（543.312/0.5）→
#     忆灵侧钩精确面板（终结技 U1 在场/E0u 首召双档——1413 先例；强普迷迷半
#     忆灵侧钩 + action_type "basic" 声明）；终结技削韧 20 同迁钩侧；
#   ⑪ trace_stat_effects {} → 行迹属性节点全收（暴伤 0.373/攻击 14%/生命 14%，
#     character_skill_trees properties 终审）；
#   ⑫ 800809 惰性副本 → 双 id 互斥分工（1402 先例：800802=Summon 版（迷迷不在
#     场）/800809=Restore 版（在场），官方 effect 标签自证；params 空数值随
#     800802 同表读，共享口径待实测）；互斥闩 has_summon 单参（draft _mem_on_field
#     手工闩退役——宿主函数直读在场语义）；
#   ⑬ stat_of(x,'max_energy') 死键排雷——effective_stats 无 max_energy 键（恒 0：
#     E4 判别恒真、磁石增幅恒 0——8007 先例实证）→ 零能量判别走目标代数
#     $it.max_energy == 0（E4 标记件），磁石增幅走挂点记账（mem_boost 资源，
#     $target.max_energy 逐目标求值——能量上限不变量，快照=现场同值）；
#   ⑭ E1「待收」→ 收两件：暴击率 +10%（enable_if 随声援门控——声援消失即失效，
#     优于 duration 近似；8007 先例）+ 忆灵向同播（声援同 id 挂持有者的忆灵——
#     $it.summoner_id == $event.target 寻址；忆师向待收：「忆师 of X」寻址缺，
#     镜像目标集合随编成动态不以双挂近似——8007 同判）；
#   ⑮ E4/8008103/E6 三「待收」→ 全收：E4 标记件 per-target（官方「该目标」——
#     draft 全局旗误；+6% 经真伤钩 has_modifier 加计）、8008103 阶梯 // 整除并入
#     真伤单段（官方「倍率提高」非追加段）、E6 固定暴击以 _e6 闸变体钩夹心
#     （烘焙 1.0-$self.crit_rate 补足至恰好 100%——作用域=终结技单段；补足式
#     恰答拐叠加失真，8007 待收理由针对 +1.0 加成式不适用本式）；
#   ⑯ inheritance "none" → 部分继承列表（1413/1415 先例——atk/def/暴击等随忆主
#     白值，hp/spd 维持烘焙）；迷迷 HP 烘焙 1478.25 → 1478.2528 精确值；
#   ⑰ on_ultimate → on_action 单通道（B37 方案 A，1402 先例）。
# 与 8007 先例 fixture 的七处分歧（均实证在案，上游对齐时建议回植）：
#   ⒈ 800702 Summon 版幽灵 +10% 充能剔除——#2 充能在「若迷迷已在场」分支内
#     （召唤分支无充能；社区首召 90%=50%+40% 互证，8007 首召 100% 系双计）；
#   ⒉ 终结技伤害暴击主体=迷迷面板（忆灵侧钩 1.046 档）——8007 本体钩混用本体
#     暴伤 1.293（1.06465 档），与自身「行迹暴伤不传播」注矛盾；
#   ⒊ 1800707 自身施放不拉条分支实收（官方明文）——8007 全目标无条件拉条漏分支；
#   ⒋ 充能账挂忆灵侧（12_summon v1.2——重召布场重置=游戏实况从 1800705 的 50%
#     重计、不在场不累计；8007 忆主账两处泄漏角在案）；
#   ⒌ E6 固定暴击收编（见勘正⑮——8007 记待收）；
#   ⒍ 1800701 段机制 instances+instance_variants（1308 B35 族正解）——8007 散装
#     5×deal_damage 钩退役；
#   ⒎ 天赋能量池双钩加 has_summon 闸（迷迷不在场不累计——与首召 90% 口径一致；
#     召唤当次自身回能不计入，待实测终审）。
# 收录：双分支战技（800802 召唤/800809 治疗+充能，has_summon 互斥）/ 终结技
#       （召唤+充能+史诗+迷迷基数 AoE 双档）/ 天赋（迷迷 SPD130/HP 烘焙/能量池
#       //10 转化）/ 强化普攻（耗史诗+净化迷迷+连携双半+充能）/ 忆灵技 1800701
#       （4 弹跳+末段全体混合段型）/ 1800707（manual_trigger 支援：拉条 100% 分
#       支+声援 3 回合+mem_boost 记账+充能归零）/ 忆灵天赋 1800703（全队暴伤光
#       环+充能满立即行动）/ 1800705/1800706 / 声援真伤核（36%+磁石阶梯+E4 6%
#       单段，hit/break/dot 三域）/ 三大行迹+尾声 / 秘技两件 / E1（暴击+忆灵向
#       同播）/ E2（忆灵行动回能 8 闸）/ E4（零能量标记+3% 充能）/ E6（固定暴
#       击）/ E3/E5 等级族随档
# 待收（均带挡因，详见 scaling_notes 末段）：秘技 Dimension/Time Stop 与互斥槽
#       （Zone/时停通道未建模）/ E1 忆师向同播（「忆师 of X」寻址缺）/ 1800707
#       手选盟友语义（召唤物目标策略通道缺——auto 缺省选自身即落入不拉条分支）
#       / 忆灵技与支援回能（无源，保守 0 待实测）/ 连携 joint 标签（joint_attack
#       未接线）/ 迷迷 HP 双段随档（max_hp_ratio 无 flat 加项——烘焙 lv10）
