# 遗器套装 fixture：凯歌祝捷的英豪（123）——staging→fixtures 验收批（验收型）
#
# 数据源：data/starrailres/index_new/cn/relic_sets.json（desc/properties 官方抽取）
#         + data/annotator/staging_root/relics/123_凯歌祝捷的英豪.yaml（生成器数值区照抄）
#
# 勘正条目（staging→本版）：
#   ① 4pc 速度件重构：staging 用 on_turn_start 每回合重挂 duration:1 近似「忆灵在场时」——
#     改为 on_battle_start 常驻件 + enable_if "has_summon($self)" 条件光环门控
#     （04_modifier §4.16：面板读取即重估——忆灵上下场即时生效/失效，零事件噪音；
#     行动条速度推式重同步只挂 HP 事件（engine._resync_cond_speed），忆灵上下场后的
#     条速重算待收编——面板恒准，e2e 按面板断言）
#   ② 补全「装备者的忆灵攻击时，装备者和忆灵的暴击伤害提高30%，持续2回合」整段
#     （staging 漏）——on_action × actor_type_of($event.actor) == 'summon' 过滤；
#     装备者/忆灵双挂，max_stack: 1（同名 buff 重复攻击刷新时长不叠层）
#   ③ 触发域近似在案：严格「装备者的忆灵」谓词需 summoner_of() 条件函数（DSL 通道缺）——
#     现役近似 = 在场召唤物行动 + has_summon($self)；多忆师编队边界待实测
#   ④ 时长语义：「攻击时」挂点在行动结算后（on_action 发射序）——触发本次攻击自身
#     是否吃 30% 暴伤待实测；双件各自按携带者回合走字（持续 2 回合）
#   ⑤ staging notes「未覆盖部分待收编」两条退役（机制已收编）
relic_set_id: '123'
name: 凯歌祝捷的英豪
set_2pc:
  desc: 攻击力提高12%。
  stat_effects:
    atk_pct: 0.12
set_4pc:
  desc: 装备者的忆灵在场时，装备者的速度提高6%，装备者的忆灵攻击时，装备者和忆灵的暴击伤害提高30%，持续2回合。
  hooks:
  - event: on_battle_start
    effects:
    - effect_type: apply_modifier
      target: self
      modifier:
        modifier_id: SET_123_SPD
        name: 凯歌祝捷的英豪·忆灵在场疾行
        modifier_type: buff
        duration: 0
        dispellable: false
        enable_if: has_summon($self)
        stat_effects:
          spd_pct: 0.06
  - event: on_action
    condition: actor_type_of($event.actor) == 'summon' && has_summon($self)
    effects:
    - effect_type: apply_modifier
      target: self
      modifier:
        modifier_id: SET_123_CRITDMG
        name: 凯歌祝捷的英豪·合击暴伤
        modifier_type: buff
        duration: 2
        max_stack: 1
        stat_effects:
          crit_dmg: 0.3
    - effect_type: apply_modifier
      target: "$event.actor"
      modifier:
        modifier_id: SET_123_CRITDMG
        name: 凯歌祝捷的英豪·合击暴伤
        modifier_type: buff
        duration: 2
        max_stack: 1
        stat_effects:
          crit_dmg: 0.3
notes:
- 触发域近似（勘正③）：「忆灵攻击时」= 在场召唤物（actor_type summon）行动且装备者持有
  召唤物；严格「装备者的忆灵」谓词通道缺（无 summoner_of），多忆师编队边界待实测。
- 挂点时刻（勘正④）：on_action 发射于行动结算后——触发攻击自身吃不吃暴伤待实测。
