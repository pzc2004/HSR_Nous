# 劫火莲灯铸炼宫（316）·位面饰品——验收版 fixture
# 数据源：官方 desc + properties（SpeedAddedRatio 0.06 ↔ spd_pct 0.06 双锚一致）。
# 勘正（staging → 验收）：
#   ① staging 的 after_being_hit 钩整条删除——条件 `actor_type_of($event.target)
#     != 'monster_boss_dummy'` 是臆造词（actor_type 词表 character/monster/summon），
#     且真正的触发条件「目标拥有火属性弱点」当时无已接线表达通道
#     （has_weakness 在 22_syntax_reference §22.4 登记但未实现，写了编译期炸）
#     ——不可忠实表达的条件不硬凑（铁律）。
#   ② notes 整段复述删；件 B 转精准待收注。
# 收编（2026-10-12，B36 批 2 通道①）：件 B「击中拥有火属性弱点的敌方目标时
#   击破特攻+40% 持续1回合」落地——has_weakness 弱点查询谓词（2026-10-12 接线，
#   含植入弱点——pipeline.effective_weakness 同口径）+ after_being_hit 攻击方视角
#   （$event.source 装备者判定，23041 降防钩同通道先例；DoT 跳伤不发 after_being_hit，
#   天然只命中攻击）。叠加/驱散语义官方 desc 未写 → 按 replace 重挂刷时长不叠层
#   （「提高40%」单值无叠加文本），实测待核
relic_set_id: '316'
name: 劫火莲灯铸炼宫
set_2pc:
  desc: 使装备者的速度提高6%。当装备者击中拥有火属性弱点的敌方目标时，击破特攻提高40%，持续1回合。
  stat_effects:
    spd_pct: 0.06
  hooks:
  - event: after_being_hit
    condition: $event.source == $self.actor_id && has_weakness($event.target, 'fire') > 0
    effects:
    - effect_type: apply_modifier
      target: self
      modifier:
        modifier_id: SET_316_FIRE_WEAK_BE
        name: 劫火莲灯铸炼宫·火弱点击破特攻
        modifier_type: buff
        duration: 1            # 官方「持续1回合」
        dispellable: false     # 装备效果不可驱散（装备族通例；官方未写明——待实测）
        stack_mode: "replace"  # 重挂=刷时长不叠层（单值无叠加文本——待实测）
        stat_effects:
          break_effect: 0.4    # 官方恒 40%（位面饰品无叠影档）
notes:
- set_2pc 件B（火弱点命中→击破特攻+40% 1回合）已收编（2026-10-12——has_weakness
  通道①接线 + after_being_hit 攻击方视角）；叠加/驱散语义官方 desc 未写，replace
  重挂刷时长口径待实测

# 挂账语义机读键（决策卡 #24——scripts/extract_caveats.py 批量提取，
# 源=本文件 notes 机读注块与 `# 待实测：`/`# 待收…：`/`# 挂账…：` 注释行；原文不动，判级口径见脚本头注）
caveats:
  - text: "set_2pc 件B（火弱点命中→击破特攻+40% 1回合）已收编（2026-10-12——has_weakness 通道①接线 + after_being_hit 攻击方视角）；叠加/驱散语义官方 desc 未写，replace 重挂刷时长口径待实测"
    level: pending
