# 遗器套装模板：幽锁深牢的系囚（116）——验收版（staging_root 打标批 → fixtures 验收批）
# 数据源：StarRailRes relic_sets.json（cn desc + properties：2pc AttackAddedRatio 0.12）
# 勘正条目：
#   ① 2pc 冗余空 hooks: [] 删除（纯数值件走 stat_effects 通道，不需要 hooks 占位）
#   ② 4pc staging 占位 hooks 全删——on_battle_start/on_turn_start 挂 stat_exprs 全 '0' 的
#      modifier：all_damage_bonus 无消费端（死键）+ 数值恒 0，与官方机制毫无对应（占位
#      垃圾而非机制表达，留着只会误导后续收编）
#   ③ 4pc 收编（2026-09-16 引擎通道落地）：dot_count() 宿主函数 + hit_condition scoped
#      def_pen（逐目标无视防御通道，04_modifier §hit_condition 穿透区）——「每承受 1 个
#      持续伤害…无视 6%…最多计入 3 个」= 三层各 6% 独立命中件（dot_count ≥1/2/3），
#      scoped 求和天然实现 min(dot_count,3)×6%（命中域数值槽只收烘焙字面量，层叠编码
#      即上限语义；全伤害路由同通道——直伤/击破/超击破/DoT 跳伤（跳伤时刻现值））
relic_set_id: '116'
name: 幽锁深牢的系囚
set_2pc:
  desc: 攻击力提高12%。
  stat_effects:
    atk_pct: 0.12
set_4pc:
  desc: 敌方目标每承受1个持续伤害效果，装备者对其造成伤害时就无视其6%的防御力，最多计入3个持续伤害效果。
  hooks:
  - event: on_battle_start
    effects:
    - effect_type: apply_modifier
      target: self
      modifier:
        modifier_id: SET_116_4PC_PEN_1
        name: 幽锁深牢的系囚·无视防御一
        modifier_type: buff
        duration: 0
        dispellable: false
        hit_condition: dot_count($event.target) >= 1
        stat_effects:
          def_pen: 0.06
    - effect_type: apply_modifier
      target: self
      modifier:
        modifier_id: SET_116_4PC_PEN_2
        name: 幽锁深牢的系囚·无视防御二
        modifier_type: buff
        duration: 0
        dispellable: false
        hit_condition: dot_count($event.target) >= 2
        stat_effects:
          def_pen: 0.06
    - effect_type: apply_modifier
      target: self
      modifier:
        modifier_id: SET_116_4PC_PEN_3
        name: 幽锁深牢的系囚·无视防御三
        modifier_type: buff
        duration: 0
        dispellable: false
        hit_condition: dot_count($event.target) >= 3
        stat_effects:
          def_pen: 0.06
