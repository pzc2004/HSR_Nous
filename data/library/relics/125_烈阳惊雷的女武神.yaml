# 遗器套装 fixture：烈阳惊雷的女武神（125）——staging→fixtures 验收批（验收型）
#
# 数据源：data/starrailres/index_new/cn/relic_sets.json（desc/properties 官方抽取）
#         + data/annotator/staging_root/relics/125_烈阳惊雷的女武神.yaml（生成器数值区照抄）
#
# 勘正条目（staging→本版）：
#   ① 触发条件重写（staging 三病）：in_group($event.target) 单参误用（词表 in_group(actor,
#     group) 两参——运行期 TypeError → 条件求值失败按不触发 = B8 静默死钩）；漏治疗来源
#     判定（任意我方治疗都误触发——官方主语「装备者及其忆灵」）；`$event.target != $self`
#     拿 actor_id 比 _HookSelfNS 对象恒真（装备者受疗也误触发）→ 重写为：来源=装备者本人
#     或其在场召唤物（近似）+ 目标=我方非装备者
#   ② 甘霖双件补 max_stack: 1（staging 缺 cap——跨回合再触发 stacks 叠 2、速度/暴伤翻倍
#     bug；「持续2回合」= 刷新时长不叠层）
#   ③ 「每回合最多触发1次」= 触发锁（duration: 1，携带者回合结束走字到期）保留 staging
#     结构；锁为内部记账件 dispellable: false
#   ④ staging notes「未覆盖部分待收编」两条退役（机制已收编）
#   ⑤ 归属判定收口（2026-10-12，B36 批 2 通道③）：summoner_of 宿主函数（2026-10-12
#     接线）双侧替换——来源侧「装备者的忆灵提供治疗」= summoner_of($event.source)
#     == $self.actor_id（替换 在场召唤物+has_summon 近似）；目标侧「及其忆灵以外」
#     排除同通道补齐 = summoner_of($event.target) != $self.actor_id（勘正②近似同销——
#     非召唤物目标 summoner_of 得 '' 恒通过，装备者忆灵受疗正确排除）
relic_set_id: '125'
name: 烈阳惊雷的女武神
set_2pc:
  desc: 速度提高6%。
  stat_effects:
    spd_pct: 0.06
set_4pc:
  desc: 当装备者及其忆灵为装备者及其忆灵以外的我方目标提供治疗后，使装备者获得【甘霖】，每回合最多触发1次，持续2回合。装备者持有【甘霖】时，速度提高6%，我方全体暴击伤害提高15%，该效果无法叠加。
  hooks:
  - event: on_hp_increase
    condition: ($event.source == $self.actor_id || summoner_of($event.source) == $self.actor_id) && $event.target != $self.actor_id && summoner_of($event.target) != $self.actor_id && actor_type_of($event.target) != 'monster' && !has_modifier($self, 'SET_125_RAIN_LOCK')
    effects:
    - effect_type: apply_modifier
      target: self
      modifier:
        modifier_id: SET_125_RAIN
        name: 甘霖
        modifier_type: buff
        duration: 2
        max_stack: 1
        stat_effects:
          spd_pct: 0.06
    - effect_type: apply_modifier
      target: self
      modifier:
        modifier_id: SET_125_RAIN_TEAM
        name: 甘霖·全队暴伤
        modifier_type: buff
        duration: 2
        max_stack: 1
        effect_scope: team
        stat_effects:
          crit_dmg: 0.15
    - effect_type: apply_modifier
      target: self
      modifier:
        modifier_id: SET_125_RAIN_LOCK
        name: 甘霖·触发锁
        modifier_type: buff
        duration: 1
        dispellable: false
notes:
- 归属判定已收口（2026-10-12，勘正⑤）：来源侧「装备者的忆灵提供治疗」= summoner_of
  归属判定；目标侧「及其忆灵以外」排除 = summoner_of($event.target) != $self.actor_id
  （原近似同销）；多忆师编队无误挂。
- "「无法叠加」= max_stack: 1 幂等重挂；多装备者同队双光环辐射叠加边界待实测。"

# 挂账语义机读键（决策卡 #24——scripts/extract_caveats.py 批量提取，
# 源=本文件 notes 机读注块与 `# 待实测：`/`# 待收…：`/`# 挂账…：` 注释行；原文不动，判级口径见脚本头注）
caveats:
  - text: "「无法叠加」= max_stack: 1 幂等重挂；多装备者同队双光环辐射叠加边界待实测。"
    level: pending
