# 光锥模板：时节不居（23013）——验收版 fixture
# 数据源：data/starrailres/index_new/cn/light_cone_ranks.json——desc「使装备者生命上限
#   提高#1[i]%，治疗量提高#2[i]%。当装备者对我方目标提供治疗时，记录治疗量。当任意我方
#   目标施放攻击后，根据记录治疗量的#3[i]%，对随机1个受到攻击的敌方目标造成基于装备者
#   属性的附加伤害。该伤害不受加成影响，每回合最多结算1次」，params
#   [[0.18,0.12,0.36],...,[0.3,0.2,0.6]] ↔ hp_pct/dmg_heal_bonus/param_3 三表各五行对轴
#   一致（properties HPAddedRatio+HealRatioBase ↔ hp_pct+heal_bonus 双锚一致）。
# 勘正（staging 原病 → 本版修正）：
#   ① stat 键 dmg_heal_bonus → heal_bonus（dmg_ 前缀桶落 dmg_bonus["heal_bonus"] 无消费端
#     =静默死件——治疗管线读顶层 heal_bonus，pipeline.heal；relic 101 同案勘正；生成器
#     _PROP_MAP 同病 2026-10-12 已同步修正（新草稿表名 heal_bonus），本件表名沿用历史不动，
#     stat 键取词表 heal_bonus）
#   ② 补命途限制条件 path_of($self) == 'abundance'
# 收编（2026-10-12）：记录治疗量→附加伤害段——装备侧 custom_resources 通道
#   与 trigger_limit 糖本批下发，三段落地：
#   ① 记录池 lc_23013_heal_pool（owner: light_cone 元数据登记）：on_hp_increase
#     （source=装备者）按 $event.amount（实际治疗量）累计——溢出量 excess 不计
#     （「治疗量」按实际回血口径，在案）；
#   ② 触发：after_being_hit（攻击方视角——「任意我方目标施放攻击后」，source 我方
#     即中：actor_type character/summon）且池 >0 → deal_damage 池×#3 于受击目标，
#     随后清零记录池（结算即消费记录口径，在案）；
#   ③ 「每回合最多结算1次」= trigger_limit: {per_turn: 1}（每角色回合窗——on_turn_start
#     重置，与游戏「每回合」=每个角色回合的常例同口径）。
#   挂账（官方文本未写明，不硬凑）：
#   ⒜ 乘区口径——「该伤害不受加成影响」取 category: "true"（全乘区中性：无增伤/暴击/
#     防御/抗性）；防/抗区是否生效官方未写明，待实测（若实测走防御/抗性乘区，改挂
#     additional/direct 一行）；EN「The type of this Additional DMG is of the same
#     Type as the wearer's」元素属性在 true 路由不可观察，在案；
#   ⒝ 随机点名——「随机1个受到攻击的敌方目标」简化为本次命中的受击目标
#     （$event.target；AoE 多目标随机实现官方未写明）；
#   ⒞ 池结转——未触发不主动清池（每回合窗只限次数）；若官方实为每回合清池，差异在案。
# 待实测：挂账三行。
light_cone_id: '23013'
name: 时节不居
rarity: 5
path: Priest
base_stats:
  hp: 1270.08
  atk: 476.28
  def: 463.04999999999995
lookup_tables:
  hp_pct:
  - 0.18
  - 0.21
  - 0.24
  - 0.27
  - 0.3
  dmg_heal_bonus:
  - 0.12
  - 0.14
  - 0.16
  - 0.18
  - 0.2
  param_3:
  - 0.36
  - 0.42
  - 0.48
  - 0.54
  - 0.6
variable_bindings:
- self.hp_pct = lookup_table("hp_pct", index=$build.light_cone.superimposition - 1)
- self.dmg_heal_bonus = lookup_table("dmg_heal_bonus", index=$build.light_cone.superimposition
  - 1)
- self.param_3 = lookup_table("param_3", index=$build.light_cone.superimposition -
  1)
custom_resources:
  lc_23013_heal_pool:
    name: 时节不居·治疗记录池
    max: "inf"
    owner: light_cone
hooks:
- event: on_battle_start
  condition: path_of($self) == 'abundance'
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_23013_HP_HEAL
      name: 时节不居
      modifier_type: buff
      duration: 0
      dispellable: false
      stack_mode: replace
      stat_effects:
        hp_pct: $self.hp_pct
        heal_bonus: $self.dmg_heal_bonus
- event: on_hp_increase
  # 记录：装备者对我方目标提供治疗的实际治疗量（溢出 excess 不计，在案）
  condition: "path_of($self) == 'abundance' and $event.source == $self.actor_id and $event.amount > 0"
  effects:
  - effect_type: gain_resource
    resource_id: lc_23013_heal_pool
    amount: "$event.amount"
- event: after_being_hit
  # 结算：我方攻击命中 → 池×#3 附加伤害于受击目标（随机点名简化为命中目标，在案），
  # 每回合最多 1 次（trigger_limit）；池清零（结算即消费记录口径，在案）
  condition: "path_of($self) == 'abundance' and actor_type_of($event.source) in ['character', 'summon'] and res_lc_23013_heal_pool > 0"
  trigger_limit:
    per_turn: 1
  effects:
  - effect_type: deal_damage
    target: "$event.target"
    amount: "res_lc_23013_heal_pool * $self.param_3"
    category: "true"
    damage_type: "true"
    name: 时节不居·附加伤害
  - effect_type: set_resource
    resource_id: lc_23013_heal_pool
    amount: 0
notes:
- 官方 desc：使装备者生命上限提高#1[i]%，治疗量提高#2[i]%。当装备者对我方目标提供
  治疗时，记录治疗量。当任意我方目标施放攻击后，根据记录治疗量的#3[i]%，对随机1个
  受到攻击的敌方目标造成基于装备者属性的附加伤害。该伤害不受加成影响，每回合最多
  结算1次。
- 第三段（记录治疗量→附加伤害）2026-10-12 收编：通道=装备侧 custom_resources +
  trigger_limit（下发）；口径挂账三行见文件头注（乘区/随机点名/池结转）。

caveats:
  - text: "⒜ 乘区口径——「该伤害不受加成影响」取 category: \"true\"（全乘区中性：无增伤/暴击/防御/抗性）；防/抗区是否生效官方未写明，待实测（若实测走防御/抗性乘区，改挂additional/direct 一行）；EN「The type of this Additional DMG is of the sameType as the wearer's」元素属性在 true 路由不可观察，在案；⒝ 随机点名——「随机1个受到攻击的敌方目标」简化为本次命中的受击目标（$event.target；AoE 多目标随机实现官方未写明）；⒞ 池结转——未触发不主动清池（每回合窗只限次数）；若官方实为每回合清池，差异在案"
    level: pending
