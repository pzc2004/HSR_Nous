# 光锥模板：同一种心情（21007）——验收版 fixture
# 数据源：data/starrailres/index_new/cn/light_cone_ranks.json——desc「使装备者的治疗量
#   提高#1[i]%，并在施放战技时为我方全体恢复#2[f1]点能量」，params [[0.1,2],...,[0.2,4]]
#   ↔ dmg_heal_bonus/param_2 两表各五行对轴一致（properties HealRatioBase ↔ heal_bonus 锚一致；
#   生成器表名 dmg_heal_bonus 沿用，stat 键取词表 heal_bonus）。
# 勘正（staging 原病 → 本版修正）：
#   ① 常驻治疗量段整段缺失 → 补 on_battle_start 常驻 heal_bonus（dmg_heal_bonus 绑定
#     在 staging 挂了空饷）
#   ② 触发条件 $event.actor == $self → $event.actor == $self.actor_id（$self 是命名空间
#     对象非 id 串，与 $event.actor 比较恒假=死钩）
#   ③ 补命途限制条件 path_of($self) == 'abundance'
# ERR 口径：战技回能不在 mechanics 05 §5.3 具名豁免清单——吃 ERR（缺省通道，正确）。
light_cone_id: '21007'
name: 同一种心情
rarity: 4
path: Priest
base_stats:
  hp: 952.56
  atk: 423.36
  def: 396.9
lookup_tables:
  dmg_heal_bonus:
  - 0.1
  - 0.125
  - 0.15
  - 0.175
  - 0.2
  param_2:
  - 2.0
  - 2.5
  - 3.0
  - 3.5
  - 4.0
variable_bindings:
- self.dmg_heal_bonus = lookup_table("dmg_heal_bonus", index=$build.light_cone.superimposition
  - 1)
- self.param_2 = lookup_table("param_2", index=$build.light_cone.superimposition -
  1)
notes:
- 官方 desc：使装备者的治疗量提高#1[i]%，并在施放战技时为我方全体恢复#2[f1]点能量。
hooks:
- event: on_battle_start
  condition: path_of($self) == 'abundance'
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_21007_HEAL_BONUS
      name: 同一种心情·治疗量
      modifier_type: buff
      duration: 0
      dispellable: false
      stack_mode: replace
      stat_effects:
        heal_bonus: $self.dmg_heal_bonus
- event: on_action
  condition: $event.actor == $self.actor_id && $event.action_type == 'skill' && path_of($self)
    == 'abundance'
  effects:
  - effect_type: gain_energy
    target: all_allies
    amount: $self.param_2
