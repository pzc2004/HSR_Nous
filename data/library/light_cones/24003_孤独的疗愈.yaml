# 光锥模板：孤独的疗愈（24003）——验收版（staging→fixtures 过堂）
#
# 数据源：StarRailRes light_cone_ranks.json desc/params + properties
# （BreakDamageAddedRatioBase→break_effect 语义列，生成器已抽）。
# 官方机制：使装备者的击破特攻提高#1[i]%。当装备者施放终结技时，使装备者造成的持续
# 伤害提高#2[i]%，持续#3[i]回合（恒 2）。陷入装备者施加的持续伤害效果的敌方目标被
# 消灭时，装备者恢复#4[f1]点能量。
#
# 勘正四件（staging→fixture）：
#   ① 击破特攻常驻半补收（staging 全漏——break_effect 表/绑定在而未用）；
#   ② 终结技 DoT 增伤钩退役——dot_dmg 桶当时无消费端（2026-09-16 B27#3 已接线：
#     dmg_dot_dmg_boost 桶键、21008 先例；裸键 dot_dmg_boost/dot_dmg_bonus 均登记死键
#     映射），且 staging on_ultimate 缺 source 判定（任意角色开大都触发）；
#   ③ 击杀回能钩退役——staging on_kill 无条件=任意敌方被消灭都回能，官方明文限定
#     「陷入装备者施加的持续伤害效果的」目标；当时「装备者施加的 DoT」归属检索通道缺
#     （kind/归属检索原语缺——黑天鹅 E2 同案；2026-10-12 批 2 经 debuff_count source
#     参收编，见下）；
#   ④ 命途门控补挂。
#
# 收编（②击杀回能半 2026-10-12 批 2 收编；①终结技 DoT 增伤半 2026-10-12 批 1 收编）：
#   ①「施放终结技时持续伤害提高#2 持续#3=2 回合」已收编——dmg_dot_dmg_boost 桶
#     （B27#3 接线，21008 先例）+ on_ultimate 钩（$event.source == $self.actor_id
#     装备者判定）挂 duration 2 件；
#   ②「陷入装备者施加的持续伤害效果的敌方目标被消灭时，装备者恢复#4 点能量」已收编
#     （2026-10-12，B36 批 2 通道②）——on_kill 钩（消灭即触发，不限击杀者）+
#     debuff_count($event.target, source=$self.actor_id) 来源过滤计数（source 参
#     2026-10-12 扩编；on_kill 发射点在死亡链来源件摘除后、尸体 modifier 仍在，
#     计数可读）。口径偏宽在案：debuff_count source 为全负面口径（装备者施加的
#     非 DoT 负面同计），「持续伤害」kind×source 交叉窄化无通道——typical 虚无
#     DoT 手装备者施加件即 DoT（卡芙卡触电/黑天鹅奥迹/桑博风化/桂乃芬灼烧/椒丘
#     烬煨），佩拉/银狼类纯 debuff 手装备本锥的误触发角例待实测
#
# 勘正补记（叠影引用层）：生成器语义表名 break_effect 与 $self 面板键同名遮蔽（
# 先读面板后读绑定——烘焙 0.0 实证）；正解 param_N 官方序号命名（表值不动），族内统一。
#
# 遗留（不动数值区）：白值三围含生成器病（官方值 1058.4/529.2/396.9——e2e xfail 锚）。
light_cone_id: '24003'
name: 孤独的疗愈
rarity: 5
path: Warlock
base_stats:
  hp: 1058.4
  atk: 529.2
  def: 396.9
lookup_tables:
  param_1:
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  param_2:
  - 0.24
  - 0.3
  - 0.36
  - 0.42
  - 0.48
  param_3:
  - 2.0
  - 2.0
  - 2.0
  - 2.0
  - 2.0
  param_4:
  - 4.0
  - 4.5
  - 5.0
  - 5.5
  - 6.0
variable_bindings:
- self.param_1 = lookup_table("param_1", index=$build.light_cone.superimposition
  - 1)
- self.param_2 = lookup_table("param_2", index=$build.light_cone.superimposition -
  1)
- self.param_3 = lookup_table("param_3", index=$build.light_cone.superimposition -
  1)
- self.param_4 = lookup_table("param_4", index=$build.light_cone.superimposition -
  1)
hooks:
- event: on_battle_start
  condition: path_of($self) == 'nihility'
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_24003_BREAK_EFFECT
      name: 孤独的疗愈·击破特攻
      modifier_type: buff
      duration: 0
      dispellable: false
      stack_mode: "replace"   # 表达式烘焙件重挂=重烘（1207 驭空案）
      stat_effects:
        break_effect: $self.param_1
- event: on_ultimate
  # 终结技 DoT 增伤（2026-10-12 收编）：装备者施放终结技 → dmg_dot_dmg_boost 桶 2 回合
  # （21008 同桶先例；$event.source 装备者判定——任意角色开大打不触发）
  condition: path_of($self) == 'nihility' && $event.source == $self.actor_id
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_24003_ULT_DOT_DMG
      name: 孤独的疗愈·终结技持续增伤
      modifier_type: buff
      duration: 2   # #3 全档恒 2 回合
      dispellable: false
      stack_mode: "replace"   # 表达式烘焙件重挂=重烘（1207 驭空案）
      stat_effects:
        dmg_dot_dmg_boost: $self.param_2
- event: on_kill
  # 击杀回能（2026-10-12 批 2 收编）：被消灭目标携带装备者施加的负面效果（来源过滤
  # 计数——debuff_count source 参；全负面口径偏宽在案，见头注②），任意击杀者皆触发
  condition: path_of($self) == 'nihility' && debuff_count($event.target, source=$self.actor_id) >= 1
  effects:
  - effect_type: gain_energy
    target: self
    amount: $self.param_4
