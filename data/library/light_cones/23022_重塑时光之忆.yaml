- event: on_hp_decrease
  condition: path_of($self) == 'nihility' && $event.reason == 'dot' && $event.source == $self.actor_id && dot_kind($event.target, 'wind_shear') > 0 && !has_modifier($self, 'LC_23022_LATCH_WS')
  effects:
