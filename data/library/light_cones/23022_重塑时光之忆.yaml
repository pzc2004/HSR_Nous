    target: self
    modifier:
      modifier_id: LC_23022_PROPHET
      name: 先知
      modifier_type: buff
      duration: 0
      dispellable: false
      max_stack: 4
      stack_mode: "refresh"
      stat_exprs:
        atk_pct: "$self.param_2 * stacks($self, 'LC_23022_PROPHET')"
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_23022_LATCH_WS
