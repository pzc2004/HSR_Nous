# 汪！散步时间！（21026，4★ 毁灭/Warrior）——验收版 fixture
# 数据源：StarRailRes cn/en light_cone_ranks.json（desc：使装备者的攻击力提高#1[i]%，对处于灼烧
#   或裂伤状态的敌方目标造成的伤害提高#2[i]%，该效果对持续伤害也会生效；#1 S1~S5=0.10/0.125/0.15/
#   0.175/0.20（properties AttackAddedRatio 同值旁证→atk_pct 列）、#2=0.16/0.20/0.24/0.28/0.32）。
# 勘正（staging → 验收）：
#   ① 常驻 atk_pct 段 staging 已挂保留，补命途限制条件 + stack_mode 烘焙口径；
#   ② 灼烧/裂伤条件增伤段已收编（2026-09-23——dot_count 宿主函数（2026-09-16 落地）
#      + scoped all_dmg：hit_condition dot_count($event.target) >= 1；「对持续伤害
#      也会生效」由 DoT 跳伤命中域同件承载（跳伤时刻目标状态现值判定，04_modifier
#      §hit_condition DoT 节））；
#   ③ notes 待收编注清理；
#   ④ 判定集合收口（2026-10-12，B36 批 2 通道②）：dot_count 宽口径（一切 DoT 件
#      全计，触电/风化同触发=偏宽）升级为 dot_kind 双值精确口径（灼烧 burn /
#      裂伤 bleed 两类——官方「灼烧或裂伤状态」字面集合；dot_kind 谓词 2026-10-12
#      接线，modifier_type=='dot' + dot_element 映射严口径）
light_cone_id: '21026'
name: 汪！散步时间！
rarity: 4
path: Warrior
base_stats:
  hp: 952.56
  atk: 476.28
  def: 330.75
lookup_tables:
  atk_pct:
  - 0.1
  - 0.125
  - 0.15
  - 0.175
  - 0.2
  param_2:
  - 0.16
  - 0.2
  - 0.24
  - 0.28
  - 0.32
variable_bindings:
- self.atk_pct = lookup_table("atk_pct", index=$build.light_cone.superimposition - 1)
- self.param_2 = lookup_table("param_2", index=$build.light_cone.superimposition - 1)
notes:
- 灼烧/裂伤目标增伤段已收编（2026-09-23 dot_count 宽口径 → 2026-10-12 升级 dot_kind
  双值精确口径——灼烧 burn/裂伤 bleed 两类；DoT 跳伤命中域同件承载）。
hooks:
- event: on_battle_start
  condition: path_of($self) == 'destruction'
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_21026_ATK_PCT
      name: 汪！散步时间！·攻击力
      modifier_type: buff
      duration: 0
      dispellable: false
      stack_mode: replace
      stat_effects:
        atk_pct: $self.atk_pct
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_21026_DOT_DMG
      name: 汪！散步时间！·灼裂增伤
      modifier_type: buff
      duration: 0
      dispellable: false
      stack_mode: replace
      # 对灼烧/裂伤目标增伤 #2（2026-10-12 收口——dot_kind 双值精确口径：灼烧 burn /
      # 裂伤 bleed；「对持续伤害也会生效」=DoT 跳伤命中域同件（跳伤时刻现值判定））
      hit_condition: "dot_kind($event.target, 'burn') > 0 || dot_kind($event.target, 'bleed') > 0"
      stat_effects:
        all_dmg: $self.param_2
