# 光锥 fixture：嘿，我在这儿（22001，丰饶 4★）——human_queue 分诊落版
#
# 数据源：data/starrailres/index_new/cn/light_cone_ranks.json（叠影 desc/params 终审）。
# 分诊（候选稿→本版）：① 候选稿 modifier_id/duration/dispellable 写在 effect 层
#   （modifier 块字段越层——键闸打回）归位 modifier 块内 + hp_added_ratio 死写法改
#   hp_pct（白值百分比正解）；② 补治疗量半（on_action skill 装备者 → heal_bonus
#   2 回合——#3 全档恒 2）；③ 命途门 path_of=='abundance'。
light_cone_id: '22001'
name: 嘿，我在这儿
rarity: 4
path: Priest
base_stats:
  hp: 952.56
  atk: 423.36
  def: 396.9
lookup_tables:
  hp_pct:
  - 0.08
  - 0.09
  - 0.1
  - 0.11
  - 0.12
  param_2:
  - 0.16
  - 0.19
  - 0.22
  - 0.25
  - 0.28
  param_3:
  - 2.0
  - 2.0
  - 2.0
  - 2.0
  - 2.0
variable_bindings:
- self.hp_pct = lookup_table("hp_pct", index=$build.light_cone.superimposition - 1)
- self.param_2 = lookup_table("param_2", index=$build.light_cone.superimposition -
  1)
- self.param_3 = lookup_table("param_3", index=$build.light_cone.superimposition -
  1)
hooks:
- event: on_battle_start
  condition: path_of($self) == 'abundance'
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_22001_HP
      name: 嘿，我在这儿·生命
      modifier_type: buff
      duration: 0
      dispellable: false
      stack_mode: "replace"   # 烘焙表达式件重挂=重烘（1207 驭空案）
      stat_effects:
        hp_pct: $self.hp_pct
- event: on_action
  condition: path_of($self) == 'abundance' && $event.actor == $self.actor_id && $event.action_type == 'skill'
  effects:
  - effect_type: apply_modifier
    target: self
    modifier:
      modifier_id: LC_22001_HEAL_BONUS
      name: 嘿，我在这儿·治疗量
      modifier_type: buff
      duration: 2   # #3 全档恒 2（duration 槽只收 int 字面量）
      dispellable: false
      stack_mode: "replace"   # 烘焙表达式件重挂=重烘（1207 驭空案）
      stat_effects:
        heal_bonus: $self.param_2
