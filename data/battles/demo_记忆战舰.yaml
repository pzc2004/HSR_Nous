name: demo_记忆战舰
description: 遐蝶+风堇+长夜月+昔涟（1407/1409/1413/1415）：四忆灵同场——新蕊/追忆特殊充能、耗血产蕊、治疗 tally、忆质限次、activate_ultimate 全队免费开大全测得到；三只低伤沙包（血池打不完）
build_yaml: "build:\n  team:\n    - character_template: '1407'\n      level: 80\n    - character_template: '1409'\n      level: 80\n    - character_template: '1413'\n      level: 80\n    - character_template: '1415'\n      level: 80\n  policy:\n    name: remembrance_team\n    action_rules:\n      - condition: energy >= max_energy\n        action: ultimate\n        priority: 90\n      - condition: skill_points > 2\n        action: skill\n        priority: 50\n      - condition: 'true'\n        action: basic\n        priority: 0\n    parameters: {}\n"
stage_yaml: "stage:\n  stage_id: demo_elite_long\n  enemies:\n  - enemy_template: sandbag\n    actor_id: enemy1\n    name: 精英假人·壹\n  - enemy_template: sandbag\n    actor_id: enemy2\n    name: 精英假人·贰\n  - enemy_template: sandbag\n    actor_id: enemy3\n    name: 精英假人·叁\n  termination:\n    mode: kill_target\n"
