# terminology.yaml — 中英文术语映射
# 代码/LLM 用英文 key，文档/日志/UI 用中文显示

# ===== 系统模块（星神/世界观命名）=====
# 项目整体：博识尊 (Nous)
# "万物皆有未解之谜，万物皆有其解答。原为解答宇宙而生的天体计算机，升格为星神。"
# ——项目旨在求解配队配装问题，与博识尊"求解宇宙"的本质一致

# Simulator：翁法罗斯 (Amphoreus)
# 博识尊的天体神经元——权杖 δ-me13 中运行的模拟世界。
# 通过无数次循环实验求解"生命的第一因"。
# ——战斗模拟器，同一场战斗反复模拟以求最优解

# Agent：阿基维利 (Akivili)
# "命运罗盘有三个方向——未知、已知、不可知。阿基维利离开孤立的佩加纳，
#  不断开拓宇宙的未知边缘，试图寻找星界之外的答案。"
# ——不断探索未知方案，用模拟器实战验证，开拓新路径

# Memory：浮黎 (Fuli)
# "没有比纯粹的记忆更包罗万象的存在：它不偏不倚地记录一切，
#  无私地保存每一个基本事实与每一种璀璨形态。"
# ——存储和检索经验，跨越旅程保持记忆

# data/：智库 (Data Bank)
# 列车上的百科全书系统，存储角色/光锥/遗器/敌人数据

project: 博识尊
simulator: 翁法罗斯
agent: 阿基维利
memory: 浮黎
data_dir: 智库

